<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <title>Game Arcade — Cameras Decoded</title>
  <meta name="description" content="Play photography drills. Earn XP. Climb the leaderboard." />

  <!-- ===== MASTER LOADER ===== -->
  <script src="/scripts/master-loader.js?v=20260930c"></script>

  <!-- ===== FIREBASE SDKs ===== -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- ===== FIREBASE INIT ===== -->
  <script src="/scripts/firebase-init.js"></script>

  <!-- ===== USER STATE (auth bridge for shared header; never redirects) ===== -->
  <script src="/scripts/user-state.js"></script>

  <!-- ===== SHARED COMPONENT SCRIPTS ===== -->
  <script src="header.js?v=20260925a"></script>
  <script src="/scripts/desktop-sidebar.js"></script>
  <!-- bottom-nav.js is loaded by master-loader – do not load it again -->

  <!-- ===== FONTS & ICONS ===== -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --green: #8deb00;
      --green-soft: rgba(141, 235, 0, 0.78);
      --green-glow: rgba(141, 235, 0, 0.35);
      --green-dim: rgba(141, 235, 0, 0.12);
      --dark: #0a0a0a;
      --ink: #050705;
      --card-bg: rgba(17, 19, 17, 0.88);
      --card-solid: #101310;
      --border: rgba(255, 255, 255, 0.09);
      --text: #f2f5ef;
      --text-muted: rgba(255, 255, 255, 0.55);
      --text-faint: rgba(255, 255, 255, 0.35);
      --radius: 18px;
      --shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
      --font-display: 'Space Mono', monospace;
      --font-body: 'Montserrat', sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    /* body-layout guard: design-system.css loads later via master-loader and
       forces flex centering on body, which breaks normal page flow. */
    body{display:block !important;justify-content:normal !important;align-items:normal !important;padding:0 !important}
    body {
      background: var(--ink);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .main-content {
      max-width: 720px;
      margin: 0 auto;
      /* clears the fixed shared header (58px) + notch safe-area, dashboard pattern */
      padding: calc(76px + env(safe-area-inset-top)) 16px 120px;
    }
    .page-head { margin: 8px 0 18px; }
    .page-head .kicker {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-display); font-size: 11px; letter-spacing: 3px;
      text-transform: uppercase; color: var(--green-soft); margin-bottom: 10px;
    }
    .page-head h1 {
      font-family: var(--font-display); font-size: 28px; margin: 0 0 6px;
      letter-spacing: -0.5px;
    }
    /* PNG-first page title: the custom PNG renders when present in
       /custom-site-titles/, otherwise the hidden h1 text shows. */
    .page-head .page-title-img {
      display: block; max-width: 300px; width: auto; height: auto;
      margin: 0 0 6px;
    }
    [hidden]{display:none!important;}
    .page-head h1 i { color: var(--green); margin-right: 8px; }
    .page-head p { margin: 0; color: var(--text-muted); font-size: 14px; }
    .page-head p .arc-shimmer {
      background: linear-gradient(100deg, #8a8a8a 30%, #fff 50%, #8a8a8a 70%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: arcShimmer 6s linear infinite;
    }
    @keyframes arcShimmer { to { background-position: -200% 0; } }

    .arcade-grid { display: grid; gap: 12px; }
    @media (min-width: 560px) {
      .arcade-grid { grid-template-columns: 1fr 1fr; }
    }
    .game-card {
      /* dossier-weave texture, soft-light — the dashboard signature-card treatment */
      background:
        url('/media/dossier-weave.jpg') center/640px,
        var(--card-bg);
      background-blend-mode: soft-light;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s, transform 0.2s;
      overflow: hidden;
    }
    /* photographic card art banner — full-bleed, melts into the card body */
    .game-art {
      height: 150px;
      margin: -18px -18px 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
      border-bottom: 1px solid var(--border);
    }
    .game-art::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg,
        rgba(5, 7, 5, 0.22) 0%,
        rgba(5, 7, 5, 0) 38%,
        rgba(16, 19, 16, 0.88) 100%);
    }
    .game-card:hover { border-color: rgba(141, 235, 0, 0.35); }
    .game-card:active { transform: scale(0.99); }
    .game-top { display: flex; align-items: center; gap: 12px; }
    .game-icon {
      width: 48px; height: 48px; border-radius: 14px; flex: none;
      background: var(--green-dim);
      display: flex; align-items: center; justify-content: center;
      color: var(--green);
    }
    .game-icon svg { display: block; }
    .game-meta { flex: 1; min-width: 0; }
    .game-meta b { display: block; font-size: 16px; letter-spacing: -0.2px; }
    .game-meta span {
      font-size: 11px; color: var(--text-faint);
      font-family: var(--font-display); letter-spacing: 1px; text-transform: uppercase;
    }
    .game-xp {
      font-family: var(--font-display); font-size: 13px; font-weight: 700;
      color: var(--green); white-space: nowrap;
    }
    .game-desc { font-size: 13px; color: var(--text-muted); margin: 0; line-height: 1.5; }
    .game-foot { display: flex; align-items: center; gap: 10px; margin-top: auto; }
    .game-best {
      flex: 1; font-size: 12px; color: var(--text-faint);
      font-family: var(--font-display);
    }
    /* ---- signature chase button (page-unique class: shared components.css
       loads later via master-loader and would flatten a generic .btn name) ---- */
    @property --abtn-angle{syntax:'<angle>';initial-value:0deg;inherits:false}
    @keyframes abtnSpin{to{--abtn-angle:360deg}}
    .abtn-chase {
      position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
      min-height:48px;border-radius:12px;padding:12px 22px;border:1px solid transparent;
      background:
        linear-gradient(120deg,rgba(255,255,255,.10),rgba(255,255,255,0) 42%),
        linear-gradient(165deg,rgba(141,235,0,.20) 0%,rgba(141,235,0,.07) 60%,rgba(141,235,0,.13) 100%);
      color:var(--green);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 6px 22px rgba(141,235,0,.10);
      font-family:var(--font-body);font-weight:800;font-size:13px;letter-spacing:.08em;
      text-transform:uppercase;text-decoration:none;cursor:pointer;
      transition:filter .18s ease,transform .18s ease;
    }
    .abtn-chase::before {
      content:'';position:absolute;inset:-0.5px;border-radius:inherit;padding:0.5px;
      background:conic-gradient(from var(--abtn-angle),transparent 20%,var(--green) 40%,transparent 60%,var(--green) 80%,transparent 100%);
      -webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
      -webkit-mask-composite:xor;mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
      mask-composite:exclude;pointer-events:none;opacity:.35;
    }
    @media (prefers-reduced-motion:no-preference) {
      .abtn-chase::before { animation:abtnSpin 6s linear infinite; }
    }
    .abtn-chase:hover { filter:brightness(1.12); }
    .abtn-chase:active { transform:scale(.97); }
    .abtn-chase:focus-visible { outline:3px solid var(--green); outline-offset:2px; }
    .arcade-empty {
      text-align: center; color: var(--text-muted); font-size: 14px;
      padding: 40px 20px; border: 1px dashed var(--border); border-radius: var(--radius);
    }
    .arcade-note { margin-top: 16px; font-size: 12px; color: var(--text-faint); text-align: center; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
    }
  </style>
</head>
<body class="arcade-page">

  <main class="main-content" id="mainContent">
    <div class="page-head">
      <div class="kicker"><i class="fas fa-gamepad" aria-hidden="true"></i>Practice</div>
      <img src="/custom-site-titles/game-arcade.png" alt="Game Arcade" class="page-title-img" onerror="this.style.display='none';this.nextElementSibling.hidden=false;">
      <h1 hidden>Game Arcade</h1>
      <p><span class="arc-shimmer">Play photography drills. Every run earns XP toward the leaderboard.</span></p>
    </div>

    <div class="arcade-grid" id="arcadeGrid" aria-live="polite">
      <div class="arcade-empty">Loading games…</div>
    </div>

    <p class="arcade-note">New drills drop as you progress through Missions and the Darkroom.</p>
  </main>

  <script>
    (function () {
      'use strict';
      var db = null;
      var gridEl = document.getElementById('arcadeGrid');

      /* Thin line-style game glyphs (1.5px stroke, no fill) rendered as inline
         SVG — crisp at 48px, no heavy filled icons. Keyed by slot id, falling
         back to the game id; unmapped slots get the default camera glyph. */
      var ICON_PATHS = {
        'aperture':
          '<circle cx="12" cy="12" r="10"/>' +
          '<path d="m14.31 8 5.74 9.94"/><path d="M9.69 8h11.48"/>' +
          '<path d="m7.38 12 5.74-9.94"/><path d="M9.69 16 3.95 6.06"/>' +
          '<path d="M14.31 16H2.83"/><path d="m16.62 12-5.74 9.94"/>',
        'calendar':
          '<rect x="3" y="4.5" width="18" height="16" rx="2.5"/>' +
          '<path d="M8 2.5v4M16 2.5v4M3 10h18"/>' +
          '<path d="M13.2 11.8l-2.4 3.4h2l-1 3.2 3.4-4.4h-2l1-2.2z"/>',
        'triangle':
          '<path d="M12 3.5 21 19.5H3z"/><circle cx="12" cy="14" r="2.5"/>',
        'frame':
          '<path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8"/>' +
          '<path d="M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8"/>' +
          '<path d="M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16"/>' +
          '<path d="M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/>' +
          '<circle cx="12" cy="12" r="1.6"/>',
        'sun':
          '<circle cx="12" cy="12" r="4.2"/>' +
          '<path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6"/>' +
          '<path d="M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/>',
        'moon':
          '<path d="M20.5 13.5A8.5 8.5 0 1 1 10.5 3.5a7 7 0 0 0 10 10z"/>' +
          '<path d="M17.5 3.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>',
        'crosshair':
          '<circle cx="12" cy="12" r="8.5"/>' +
          '<path d="M12 2.5V6M12 18v3.5M2.5 12H6M18 12h3.5"/>',
        'camera':
          '<path d="M4 8.5h2.6l1.7-2.2h7.4l1.7 2.2H20a1.5 1.5 0 0 1 1.5 1.5v8.5' +
          'a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 18.5V10A1.5 1.5 0 0 1 4 8.5z"/>' +
          '<circle cx="12" cy="14" r="3.4"/>'
      };
      var GAME_ICON = {
        'exposure-lab': 'triangle',
        'ar-viewfinder': 'frame',
        'golden-hour-rush': 'sun',
        'blue-hour-sprint': 'moon',
        'focal-length-sniper': 'crosshair',
        'camera-lab': 'aperture',
        'lab-01': 'aperture',
        'lab-daily': 'calendar'
      };
      function iconSvg(key) {
        var paths = ICON_PATHS[key] || ICON_PATHS.camera;
        return '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" ' +
          'stroke="currentColor" stroke-width="1.5" stroke-linecap="round" ' +
          'stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
      }
      var GAME_BLURBS = {
        'exposure-lab': 'Nail the exposure triangle under pressure.',
        'ar-viewfinder': 'Read the meter and frame the shot in AR.',
        'golden-hour-rush': 'Chase the light before the sun drops.',
        'blue-hour-sprint': 'Balance ambient and flash at dusk.',
        'focal-length-sniper': 'Read the glass — call the focal length.',
        'camera-lab': 'Run the full camera: six real scenarios, graded briefs.',
        'lab-daily': 'One brief. One day. Best score counts.'
      };
      /* photographic card art — media/arcade/<game>.jpg, 800x450 (16:9).
         Keyed by slot id, falling back to the game id. New lesson_slots docs
         pick up art automatically once their id/game is listed here. */
      var ART_V = '20260927a';
      var GAME_ART = {
        'exposure-lab': 'exposure-lab',
        'ar-viewfinder': 'ar-viewfinder',
        'golden-hour-rush': 'golden-hour-rush',
        'blue-hour-sprint': 'blue-hour-sprint',
        'focal-length-sniper': 'focal-length-sniper',
        'camera-lab': 'camera-lab',
        'lab-01': 'camera-lab',
        'lab-daily': 'lab-daily'
      };

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function renderGames(slots, bestBySlot) {
        if (!slots.length) {
          gridEl.innerHTML = '<div class="arcade-empty">No drills live yet.<br>Check back soon.</div>';
          return;
        }
        gridEl.innerHTML = slots.map(function (s) {
          var iconKey = GAME_ICON[s.id] || GAME_ICON[s.game] || 'camera';
          var blurb = GAME_BLURBS[s.id] || GAME_BLURBS[s.game] || '';
          var artKey = GAME_ART[s.id] || GAME_ART[s.game] || '';
          var art = artKey ? '<div class="game-art" role="img" aria-label="' +
            esc(s.title || s.game) + ' artwork" style="background-image:url(\'/media/arcade/' +
            artKey + '.jpg?v=' + ART_V + '\')"></div>' : '';
          var best = bestBySlot[s.id];
          var bestHtml = best != null
            ? 'Best: ' + best + '%'
            : 'No signal yet';
          return '<article class="game-card">' +
            art +
            '<div class="game-top">' +
              '<div class="game-icon">' + iconSvg(iconKey) + '</div>' +
              '<div class="game-meta"><b>' + esc(s.title || s.game) + '</b>' +
              '<span>' + esc(s.unit || '') + (s.lesson ? ' · ' + esc(s.lesson) : '') + '</span></div>' +
              '<div class="game-xp">' + (s.xp || 0) + ' XP</div>' +
            '</div>' +
            (blurb ? '<p class="game-desc">' + esc(blurb) + '</p>' : '') +
            '<div class="game-foot">' +
              '<span class="game-best">' + esc(bestHtml) + '</span>' +
              '<a class="abtn-chase" href="/play.html?slot=' + encodeURIComponent(s.id) + '">' +
                '<i class="fas fa-play" aria-hidden="true"></i>Play</a>' +
            '</div>' +
          '</article>';
        }).join('');
      }

      async function loadArcade() {
        if (!db) return;
        try {
          var snap = await db.collection('lesson_slots').orderBy('order').get();
          var slots = [];
          snap.forEach(function (doc) {
            slots.push(Object.assign({ id: doc.id }, doc.data() || {}));
          });
          var bestBySlot = {};
          var user = firebase.auth().currentUser;
          if (user) {
            try {
              var gs = await db.collection('game_sessions')
                .where('uid', '==', user.uid).get();
              gs.forEach(function (doc) {
                var d = doc.data() || {};
                var sid = d.slotId;
                var score = d.score;
                if (sid != null && typeof score === 'number') {
                  if (bestBySlot[sid] == null || score > bestBySlot[sid]) bestBySlot[sid] = score;
                }
              });
            } catch (e) { /* best scores are optional */ }
          }
          renderGames(slots, bestBySlot);
        } catch (e) {
          gridEl.innerHTML = '<div class="arcade-empty">Could not load games.<br>Check your connection and reload.</div>';
        }
      }

      function boot() {
        if (!window.firebase || !firebase.auth || !firebase.firestore) {
          gridEl.innerHTML = '<div class="arcade-empty">Could not reach our servers.<br>Check your connection and reload.</div>';
          return;
        }
        db = firebase.firestore();
        firebase.auth().onAuthStateChanged(function () { loadArcade(); });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
      else boot();
    })();
  </script>
<script src="/scripts/ptr.js"></script>
</body>
</html>
