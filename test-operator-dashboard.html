<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Dashboard — Cameras Decoded</title>
  <link rel="stylesheet" href="bottom-nav.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script src="cd-ui.js"></script>
</head>
<body>
  <div style="max-width:600px;margin:40px auto;padding:20px;font-family:sans-serif;">
    <h1>📡 Operator Dashboard</h1>

    <div id="loading" style="padding:40px;text-align:center;">Loading...</div>

    <div id="content" style="display:none;">
      <div style="padding:20px;background:#f5f5f5;border-radius:8px;margin-bottom:20px;">
        <h2>Welcome, <span id="userName">—</span>!</h2>
        <p><strong>Username:</strong> <span id="userUsername">—</span></p>
        <p><strong>Plan:</strong> <span id="userTier">Free</span></p>
        <p><strong>Points:</strong> <span id="userPoints">0</span></p>
        <p><strong>Level:</strong> <span id="userLevel">1</span></p>
        <p><strong>Referral Code:</strong> <span id="userReferral">—</span></p>
        <button onclick="copyReferral()" style="padding:6px 16px;background:#8deb00;border:none;border-radius:4px;cursor:pointer;font-family:monospace;">Copy Referral Link</button>
        <br><br>
        <button onclick="logout()" style="padding:6px 16px;background:#ff4444;border:none;border-radius:4px;cursor:pointer;color:#fff;font-family:monospace;">Logout</button>
      </div>

      <h3>Quick Links</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <a href="profile.html?uid=<span id="uidPlaceholder"></span>" style="padding:10px 20px;background:#333;color:#fff;text-decoration:none;border-radius:6px;">Profile</a>
        <a href="learning-journey.html" style="padding:10px 20px;background:#333;color:#fff;text-decoration:none;border-radius:6px;">Learning Journey</a>
        <a href="cynetis-7.html" style="padding:10px 20px;background:#333;color:#fff;text-decoration:none;border-radius:6px;">Cynetis-7</a>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div id="bottomNavContainer">
    <nav class="bottom-nav chasing-border-nav" id="bottomNav">
      <a href="index.html">Home</a>
      <a href="operator-dashboard.html">Dashboard</a>
      <a href="learning-journey.html">Journey</a>
      <a href="cynetis-7.html">Cynetis-7</a>
      <a href="profile.html">Profile</a>
    </nav>
  </div>

  <script src="bottom-nav.js"></script>
  <script>
    let uid = null;
    const params = new URLSearchParams(window.location.search);
    uid = params.get('uid');

    if (!uid) {
      auth.onAuthStateChanged(user => {
        if (user) { uid = user.uid; loadDashboard(); }
        else { window.location.href = 'signup.html'; }
      });
    } else {
      loadDashboard();
    }

    function loadDashboard() {
      db.collection('users').doc(uid).get()
        .then(doc => {
          if (!doc.exists) { cdToast('User not found.', 'error'); return; }
          const data = doc.data();

          if (data.role !== 'Operator') {
            const map = {
              'Partner': 'partner-dashboard.html',
              'Instructor': 'instructor-dashboard.html'
            };
            window.location.href = map[data.role] + '?uid=' + uid;
            return;
          }

          document.getElementById('userName').textContent = data.name || '—';
          document.getElementById('userUsername').textContent = data.username || '—';
          document.getElementById('userTier').textContent = data.tier === 'pro' ? 'Pro' : 'Free';
          document.getElementById('userPoints').textContent = data.totalPoints || 0;
          document.getElementById('userLevel').textContent = data.level || 1;
          document.getElementById('userReferral').textContent = data.referralCode || '—';
          document.getElementById('uidPlaceholder').textContent = uid;

          document.getElementById('loading').style.display = 'none';
          document.getElementById('content').style.display = 'block';

          // Update bottom nav active state
          if (window.BottomNav) {
            window.BottomNav.setActive();
          }
        })
        .catch(err => {
          document.getElementById('loading').textContent = 'Error: ' + err.message;
        });
    }

    function copyReferral() {
      const link = document.getElementById('userReferral').textContent;
      if (!link || link === '—') {
        cdToast('Referral code not available.', 'error');
        return;
      }
      const fullLink = 'https://camerasdecoded.com/ref/' + link;
      navigator.clipboard.writeText(fullLink)
        .then(() => cdToast('✅ Copied!'))
        .catch(() => {
          // Fallback
          const input = document.createElement('input');
          input.value = fullLink;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
          cdToast('✅ Copied!');
        });
    }

    function logout() {
      auth.signOut().then(() => {
        window.location.href = 'index.html';
      });
    }
  </script>
</body>
</html>
