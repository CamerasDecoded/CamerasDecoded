<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter — Cameras Decoded</title>

  <!-- Master Loader -->
  <script src="/scripts/master-loader.js?v=20260911a"></script>

  <!-- Guide & Quiz Styles -->
  <link rel="stylesheet" href="/styles/guide-styles.css?v=20260911a" />
  <link rel="stylesheet" href="/styles/quiz-styles.css?v=20260911a" />

  <!-- Root CSS (absolute paths) -->
  <link rel="stylesheet" href="/header.css?v=20260911a" />
  <link rel="stylesheet" href="/bottom-nav.css?v=20260911a" />

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Firebase Init & User State -->
  <script src="/scripts/firebase-init.js?v=20260911a"></script>
  <script src="/scripts/user-state.js?v=20260911a"></script>

  <!-- Rewards -->
  <script src="/scripts/badge-definitions.js?v=20260911a"></script>
  <script src="/scripts/reward-engine.js?v=20260911a"></script>

  <!-- Guide-specific scripts -->
  <script src="/scripts/guide-loader.js?v=20260911a"></script>
  <script src="/scripts/guide-quiz.js?v=20260911a"></script>
  <script src="/scripts/guide-progress.js?v=20260911a"></script>
  <script src="/scripts/discussion-threads.js?v=20260911a"></script>
  <script src="/scripts/certificate-generator.js?v=20260911a"></script>
</head>
<body>
  <!-- Main content (header & sidebar injected by master-loader) -->
  <main class="main-content">
    <div class="chapter-container" id="chapterContainer">
      <div id="chapterHeader">
        <h1 id="chapterTitle"></h1>
        <p id="chapterSummary"></p>
        <div class="chapter-actions">
          <a id="pdfLink" class="btn-primary" target="_blank">📄 Read PDF</a>
          <button id="startQuizBtn" class="btn-primary">🧠 Start Quiz</button>
        </div>
      </div>

      <div id="quizContainer" style="display:none;">
        <div id="quizQuestion"></div>
        <div id="quizOptions"></div>
        <button id="quizSubmitBtn" class="btn-primary">Submit</button>
        <div id="quizFeedback"></div>
        <div id="quizProgress"></div>
      </div>

      <div id="threadsContainer">
        <h2>Discussion</h2>
        <div id="threadsList"></div>
        <div id="newThreadForm" style="display:none;">
          <input type="text" id="threadTitle" placeholder="Thread title" />
          <textarea id="threadContent" placeholder="Your question or tip..."></textarea>
          <button id="createThreadBtn" class="btn-primary">Post Thread</button>
        </div>
        <button id="showThreadFormBtn" class="btn-secondary">+ New Thread</button>
      </div>
    </div>
  </main>

  <!-- Bottom nav injection point -->
  <div id="bottomNavContainer" data-role="operator"></div>

  <script>
    let currentQuiz = null;
    let chapter = null;         // hoisted for reward helper
    let rewardsAwarded = false; // idempotency guard for the reward loop

    const chapterId = new URLSearchParams(window.location.search).get('chapterId');
    if (!chapterId) {
      window.location.href = '/pages/learning-guide.html';
    }

    // Derive candidate badge IDs from chapter metadata.
    // Prefers explicit chapter.badgeIds / chapter.badges; falls back to tags/title regex.
    function badgesFromChapter(ch) {
      if (!ch) return [];
      const explicit = []
        .concat(Array.isArray(ch.badgeIds) ? ch.badgeIds : [])
        .concat(Array.isArray(ch.badges)   ? ch.badges   : []);
      if (explicit.length) return explicit;

      const haystack = [
        ...(Array.isArray(ch.tags) ? ch.tags : []),
        ch.slug  || '',
        ch.title || ''
      ].join(' ').toLowerCase();

      const map = [
        [/aperture/,                  'aperture_adept'],
        [/shutter/,                   'shutter_surgeon'],
        [/composition/,               'composition_master'],
        [/histogram/,                 'histogram_hero'],
        [/exposure|metering/,         'exposure_expert'],
        [/flash|lighting/,            'flash_pioneer'],
        [/curve|tone/,                'curve_master'],
        [/tether/,                    'tether_tech'],
        [/set[- ]?design|studio/,     'set_designer'],
        [/colour|color/,              'colour_scientist'],
        [/lut/,                       'lut_creator'],
        [/brand/,                     'brand_architect'],
        [/business|contract|pricing/, 'business_sharp'],
        [/portfolio/,                 'portfolio_pro'],
        [/snapshot/,                  'snapshot_collector'],
        [/protocol/,                  'protocol_pioneer']
      ];
      const out = [];
      map.forEach(([re, id]) => { if (re.test(haystack)) out.push(id); });
      return out;
    }

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = '/login.html';
        return;
      }
      const userId = user.uid;

      try {
        // Load chapter and quiz data
        const loaded = await GuideLoader.loadChapter('guide_v1', chapterId);
        chapter = loaded.chapter;
        const quiz = loaded.quiz;

        document.getElementById('chapterTitle').textContent   = chapter.title;
        document.getElementById('chapterSummary').textContent = chapter.summary;
        document.getElementById('pdfLink').href               = chapter.pdfUrl;

        // Mark chapter as started
        await GuideProgress.markChapterStarted(userId, chapterId);

        // Load discussion threads
        const threads = await DiscussionThreads.loadThreadsForChapter(chapterId);
        renderThreads(threads, userId);

        // Check user role for thread creation
        const userData = window.USER || {};
        if (['Instructor', 'Partner'].includes(userData.role)) {
          document.getElementById('showThreadFormBtn').style.display = 'block';
        } else {
          document.getElementById('showThreadFormBtn').style.display = 'none';
        }

        // Quiz setup
        if (quiz && quiz.questions) {
          document.getElementById('startQuizBtn').style.display = 'block';
          document.getElementById('startQuizBtn').addEventListener('click', () => {
            document.getElementById('quizContainer').style.display = 'block';
            currentQuiz = new GuideQuiz(quiz.questions);
            renderQuizQuestion(currentQuiz);
          });
        } else {
          document.getElementById('startQuizBtn').style.display = 'none';
        }

        // Quiz submit handler
        document.getElementById('quizSubmitBtn').addEventListener('click', async () => {
          if (!currentQuiz) return;
          const selected = document.querySelector('input[name="quizOption"]:checked');
          if (!selected) {
            alert('Please select an answer.');
            return;
          }
          const idx = parseInt(selected.value, 10);
          const result = currentQuiz.submitAnswer(idx);
          document.getElementById('quizFeedback').textContent = result.isCorrect
            ? '✅ Correct!'
            : `❌ ${result.explanation}`;
          document.getElementById('quizProgress').textContent =
            `Progress: ${Math.round(result.progress)}%`;

          if (currentQuiz.currentIndex < currentQuiz.questions.length) {
            renderQuizQuestion(currentQuiz);
          } else {
            // Quiz finished
            document.getElementById('quizSubmitBtn').style.display = 'none';
            document.getElementById('quizFeedback').innerHTML += '<br>Quiz complete! Submitting...';

            const final = await currentQuiz.finishQuiz(userId, chapterId);
            document.getElementById('quizFeedback').innerHTML +=
              `<br>Final score: ${final.score}% ${
                final.passed
                  ? '✅ Passed! Certificate generated.'
                  : '❌ Try again later.'
              }`;

            // --- Reward loop ---
            if (final.passed && !rewardsAwarded) {
              rewardsAwarded = true;
              try {
                const rewards = await RewardEngine.award({
                  uid: userId,
                  xp: 20, // matches the dashboard's lesson-complete reward
                  activity: {
                    type: 'quiz',
                    label: `Passed quiz: ${chapter.title}`,
                    icon: '🧠',
                    meta: { chapterId, score: final.score, guideId: 'guide_v1' }
                  },
                  candidateBadges: badgesFromChapter(chapter)
                });

                const parts = [`+${rewards.xpEarned} XP`];
                if (rewards.streak > 1) parts.push(`🔥 ${rewards.streak}-day streak`);
                if (rewards.newlyUnlockedBadges.length) {
                  const names = rewards.newlyUnlockedBadges.map(id => {
                    const b = window.BADGE_DEFS && window.BADGE_DEFS[id];
                    return b ? `${b.icon} ${b.name}` : id;
                  });
                  parts.push(`Badges: ${names.join(', ')}`);
                }
                document.getElementById('quizFeedback').innerHTML +=
                  `<br><strong>${parts.join(' · ')}</strong>`;
              } catch (e) {
                console.error('RewardEngine failed', e);
                document.getElementById('quizFeedback').innerHTML +=
                  '<br><em>(Rewards failed to save — your quiz result is still recorded.)</em>';
              }
            }
          }
        });

        // Thread creation
        document.getElementById('showThreadFormBtn').addEventListener('click', () => {
          document.getElementById('newThreadForm').style.display = 'block';
          document.getElementById('showThreadFormBtn').style.display = 'none';
        });

        document.getElementById('createThreadBtn').addEventListener('click', async () => {
          const title   = document.getElementById('threadTitle').value.trim();
          const content = document.getElementById('threadContent').value.trim();
          if (!title || !content) {
            alert('Please fill in both fields.');
            return;
          }
          await DiscussionThreads.createThread(
            userId, userData.name, userData.role, chapterId, title, content
          );
          location.reload();
        });

      } catch (err) {
        console.error(err);
        document.getElementById('chapterContainer').innerHTML =
          `<p class="error">${err.message}</p>`;
      }
    });

    function renderQuizQuestion(quiz) {
      const q = quiz.questions[quiz.currentIndex];
      document.getElementById('quizQuestion').textContent = q.question;
      const optionsHtml = q.options.map((opt, i) => `
        <div>
          <input type="radio" name="quizOption" value="${i}" id="opt${i}" />
          <label for="opt${i}">${opt}</label>
        </div>
      `).join('');
      document.getElementById('quizOptions').innerHTML = optionsHtml;
      document.getElementById('quizSubmitBtn').style.display = 'block';
      document.getElementById('quizFeedback').textContent = '';
    }

    function renderThreads(threads, userId) {
      const container = document.getElementById('threadsList');
      if (threads.length === 0) {
        container.innerHTML = '<p>No discussions yet. Be the first!</p>';
        return;
      }
      container.innerHTML = threads.map(thread => `
        <div class="thread">
          <h4>${thread.title}</h4>
          <p>${thread.content}</p>
          <div class="thread-meta">by ${thread.authorName} · ${
            new Date(thread.createdAt?.seconds * 1000).toLocaleDateString()
          }</div>
          <div class="thread-replies">
            ${thread.replies.map(reply => `
              <div class="reply">
                <strong>${reply.authorName}</strong> (${reply.authorRole}): ${reply.content}
                <div class="reply-meta">${
                  new Date(reply.createdAt?.seconds * 1000).toLocaleDateString()
                }</div>
              </div>
            `).join('')}
          </div>
          <button class="reply-btn" data-thread-id="${thread.id}">Reply</button>
          <div class="reply-form" style="display:none; margin-top:8px;">
            <textarea class="reply-content" placeholder="Write your reply..."></textarea>
            <button class="submit-reply-btn" data-thread-id="${thread.id}">Post Reply</button>
          </div>
        </div>
      `).join('');

      container.querySelectorAll('.reply-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const form = btn.parentElement.querySelector('.reply-form');
          form.style.display = form.style.display === 'none' ? 'block' : 'none';
        });
      });

      container.querySelectorAll('.submit-reply-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const threadId  = e.target.dataset.threadId;
          const textarea  = e.target.parentElement.querySelector('.reply-content');
          const content   = textarea.value.trim();
          if (!content) return;
          const userData = window.USER || {};
          await DiscussionThreads.replyToThread(
            userId, userData.name, userData.role, threadId, content
          );
          location.reload();
        });
      });
    }
  </script>
</body>
</html>
