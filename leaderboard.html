<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <title>Leaderboard — Cameras Decoded</title>
  <meta name="description" content="Top Cameras Decoded operators by XP. Climb the board." />

  <!-- ===== SHARED COMPONENT CSS ===== -->

  <!-- ===== FIREBASE SDKs ===== -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- ===== FIREBASE INIT ===== -->
  <script src="/scripts/firebase-init.js"></script>

  <!-- ===== USER STATE (auth bridge for shared header; never redirects) ===== -->
  <script src="/scripts/user-state.js"></script>

  <!-- ===== SHARED COMPONENT SCRIPTS ===== -->
  <script src="header.js?v=20260925a"></script>
  <script src="/scripts/desktop-sidebar.js"></script>
  <!-- bottom-nav.js is loaded by master-loader – do not load it again -->

  <!-- ===== FONTS & ICONS ===== -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --green: #8deb00;
      --green-soft: rgba(141, 235, 0, 0.78);
      --green-glow: rgba(141, 235, 0, 0.35);
      --green-dim: rgba(141, 235, 0, 0.12);
      --dark: #0a0a0a;
      --ink: #050705;
      --card-bg: rgba(17, 19, 17, 0.88);
      --card-solid: #101310;
      --border: rgba(255, 255, 255, 0.09);
      --text: #f2f5ef;
      --text-muted: rgba(255, 255, 255, 0.55);
      --text-faint: rgba(255, 255, 255, 0.35);
      --gold: #e0b12d;
      --silver: #c7ccd4;
      --bronze: #d08a4e;
      --radius: 18px;
      --shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
      --font-display: 'Space Mono', monospace;
      --font-body: 'Montserrat', sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--ink);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .main-content {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 120px;
    }
    .page-head { margin: 8px 0 18px; }
    .page-head .kicker {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-display); font-size: 11px; letter-spacing: 3px;
      text-transform: uppercase; color: var(--green-soft); margin-bottom: 10px;
    }
    .page-head h1 {
      font-family: var(--font-display); font-size: 28px; margin: 0 0 6px;
      letter-spacing: -0.5px;
    }
    .page-head h1 i { color: var(--green); margin-right: 8px; }
    .page-head p { margin: 0; color: var(--text-muted); font-size: 14px; }

    .lb-tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 6px; margin-bottom: 14px;
    }
    .lb-tab {
      border: 0; border-radius: 12px; padding: 12px;
      background: transparent; color: var(--text-muted);
      font-family: var(--font-display); font-size: 13px; letter-spacing: 1px;
      cursor: pointer; min-height: 48px;
    }
    .lb-tab.on { background: var(--green-dim); color: var(--green); font-weight: 700; }
    .lb-tab:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }

    .lb-you {
      background: linear-gradient(135deg, rgba(141,235,0,0.10) 0%, var(--card-bg) 55%);
      border: 1px solid rgba(141, 235, 0, 0.28);
      border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px;
      display: flex; align-items: center; gap: 14px;
      box-shadow: var(--shadow), 0 0 40px rgba(141, 235, 0, 0.07);
    }
    .lb-you .rank {
      font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--green);
      min-width: 56px; text-align: center;
    }
    .lb-you .who { flex: 1; min-width: 0; }
    .lb-you .who b { display: block; font-size: 15px; }
    .lb-you .who span { font-size: 12px; color: var(--text-muted); font-family: var(--font-display); }
    .lb-you .xp { font-family: var(--font-display); font-size: 20px; font-weight: 700; }

    .lb-list { display: grid; gap: 8px; }
    .lb-row {
      display: flex; align-items: center; gap: 14px;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 16px;
    }
    .lb-row.me { border-color: rgba(141, 235, 0, 0.45); background: rgba(141,235,0,0.06); }
    .lb-row .pos {
      font-family: var(--font-display); font-size: 15px; font-weight: 700;
      min-width: 40px; text-align: center; color: var(--text-muted);
    }
    .lb-row.r1 .pos { color: var(--gold); }
    .lb-row.r2 .pos { color: var(--silver); }
    .lb-row.r3 .pos { color: var(--bronze); }
    .lb-row .who { flex: 1; min-width: 0; }
    .lb-row .who b {
      display: block; font-size: 14px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .lb-row .who span { font-size: 11px; color: var(--text-faint); font-family: var(--font-display); }
    .lb-row .xp { font-family: var(--font-display); font-size: 15px; font-weight: 700; white-space: nowrap; }
    .lb-row .xp small { color: var(--text-faint); font-weight: 400; font-size: 11px; }
    .lb-empty {
      text-align: center; color: var(--text-muted); font-size: 14px;
      padding: 40px 20px; border: 1px dashed var(--border); border-radius: var(--radius);
    }
    .lb-note { margin-top: 16px; font-size: 12px; color: var(--text-faint); text-align: center; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
    }
  </style>
</head>
<body class="leaderboard-page">

  <main class="main-content" id="mainContent">
    <div class="page-head">
      <div class="kicker"><i class="fas fa-trophy" aria-hidden="true"></i>Leaderboard</div>
      <h1>Top operators</h1>
      <p>Every game and every mission earns XP. Climb the board.</p>
    </div>

    <div class="lb-tabs" role="tablist" aria-label="Leaderboard period">
      <button class="lb-tab on" id="tabWeek" role="tab" aria-selected="true">This week</button>
      <button class="lb-tab" id="tabAll" role="tab" aria-selected="false">All time</button>
    </div>

    <div class="lb-you" id="lbYou" hidden>
      <div class="rank" id="lbYouRank">–</div>
      <div class="who"><b id="lbYouName">You</b><span id="lbYouSub"></span></div>
      <div class="xp" id="lbYouXp">0</div>
    </div>

    <div class="lb-list" id="lbList" aria-live="polite">
      <div class="lb-empty">Loading the board…</div>
    </div>

    <p class="lb-note">Weekly board resets every Monday. Play drills and finish missions to climb.</p>
  </main>

  <script>
    (function () {
      'use strict';
      var db = null;
      var lbMode = 'week';
      var listEl = document.getElementById('lbList');
      var youEl = document.getElementById('lbYou');

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function lbWeekKey(d) {
        d = d || new Date();
        var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        var day = (t.getUTCDay() + 6) % 7;
        t.setUTCDate(t.getUTCDate() - day + 3);
        var first = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
        var week = 1 + Math.round(((t - first) / 864e5 - 3 + ((first.getUTCDay() + 6) % 7)) / 7);
        return t.getUTCFullYear() + '-W' + ('0' + week).slice(-2);
      }
      function xpOf(r, wk) {
        if (lbMode === 'week') return ((r.weeks || {})[wk]) || 0;
        return r.xp || 0;
      }

      function renderBoard(rows, wk, meUid) {
        if (!rows.length) {
          listEl.innerHTML = '<div class="lb-empty">No scores yet this period.<br>Play a drill to take the lead.</div>';
          return;
        }
        var medals = ['\uD83E\uDD47', '\uD83E\uDD48', '\uD83E\uDD49'];
        listEl.innerHTML = rows.map(function (r, i) {
          var isMe = meUid && r.id === meUid;
          var cls = 'lb-row' + (isMe ? ' me' : '') + (i < 3 ? ' r' + (i + 1) : '');
          var pos = i < 3 ? medals[i] : '#' + (i + 1);
          var plays = r.plays ? '<span>' + r.plays + ' plays</span>' : '<span>&nbsp;</span>';
          return '<div class="' + cls + '">' +
            '<div class="pos">' + pos + '</div>' +
            '<div class="who"><b>' + esc(r.displayName || 'Operator') + (isMe ? ' (you)' : '') + '</b>' + plays + '</div>' +
            '<div class="xp">' + xpOf(r, wk).toLocaleString() + ' <small>XP</small></div>' +
            '</div>';
        }).join('');
      }

      function renderYou(rows, wk, meUid) {
        if (!meUid) { youEl.hidden = true; return; }
        var idx = -1, mine = null;
        rows.forEach(function (r, i) { if (r.id === meUid) { idx = i; mine = r; } });
        youEl.hidden = false;
        if (mine) {
          document.getElementById('lbYouRank').textContent = '#' + (idx + 1);
          document.getElementById('lbYouName').textContent = (mine.displayName || 'Operator') + ' (you)';
          document.getElementById('lbYouXp').textContent = xpOf(mine, wk).toLocaleString();
          document.getElementById('lbYouSub').textContent =
            (mine.plays || 0) + ' plays · ' + (lbMode === 'week' ? 'this week' : 'all time');
        } else {
          // Outside the top 50 — read the user's own doc for their totals.
          document.getElementById('lbYouRank').textContent = '50+';
          document.getElementById('lbYouName').textContent = 'You';
          document.getElementById('lbYouSub').textContent = lbMode === 'week' ? 'this week' : 'all time';
          db.collection('leaderboard').doc(meUid).get().then(function (d) {
            var r = d.data() || {};
            document.getElementById('lbYouName').textContent = (r.displayName || 'You') + ' (you)';
            document.getElementById('lbYouXp').textContent = xpOf(r, wk).toLocaleString();
          }).catch(function () {});
        }
      }

      async function loadBoard() {
        if (!db) return;
        var wk = lbWeekKey();
        var field = lbMode === 'week' ? 'weeks.' + wk : 'xp';
        var meUid = firebase.auth().currentUser ? firebase.auth().currentUser.uid : null;
        try {
          var snap = await db.collection('leaderboard').orderBy(field, 'desc').limit(50).get();
          var rows = [];
          snap.forEach(function (doc) { rows.push(Object.assign({ id: doc.id }, doc.data() || {})); });
          renderBoard(rows, wk, meUid);
          renderYou(rows, wk, meUid);
        } catch (e) {
          listEl.innerHTML = '<div class="lb-empty">Could not load the board.<br>Check your connection and reload.</div>';
        }
      }

      function setMode(mode) {
        lbMode = mode;
        document.getElementById('tabWeek').classList.toggle('on', mode === 'week');
        document.getElementById('tabAll').classList.toggle('on', mode === 'all');
        document.getElementById('tabWeek').setAttribute('aria-selected', mode === 'week');
        document.getElementById('tabAll').setAttribute('aria-selected', mode === 'all');
        listEl.innerHTML = '<div class="lb-empty">Loading the board…</div>';
        loadBoard();
      }
      document.getElementById('tabWeek').addEventListener('click', function () { setMode('week'); });
      document.getElementById('tabAll').addEventListener('click', function () { setMode('all'); });

      function boot() {
        if (!window.firebase || !firebase.auth || !firebase.firestore) {
          listEl.innerHTML = '<div class="lb-empty">Could not reach our servers.<br>Check your connection and reload.</div>';
          return;
        }
        db = firebase.firestore();
        firebase.auth().onAuthStateChanged(function () { loadBoard(); });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
      else boot();
    })();
  </script>
</body>
</html>
