  <!-- ===== FONTS & ICONS ===== -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --green: #8deb00;
      --green-soft: rgba(141, 235, 0, 0.78);
      --green-glow: rgba(141, 235, 0, 0.35);
      --green-dim: rgba(141, 235, 0, 0.12);
      --dark: #0a0a0a;
      --ink: #050705;
      --card-bg: rgba(17, 19, 17, 0.88);
      --card-solid: #101310;
      --border: rgba(255, 255, 255, 0.09);
      --text: #f2f5ef;
      --text-muted: rgba(255, 255, 255, 0.55);
      --text-faint: rgba(255, 255, 255, 0.35);
      --gold: #e0b12d;
      --silver: #c7ccd4;
      --bronze: #d08a4e;
      --radius: 18px;
      --shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
      --font-display: 'Space Mono', monospace;
      --font-body: 'Montserrat', sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--ink);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .main-content {
      max-width: 720px;
      margin: 0 auto;
      /* clears the fixed shared header (58px) + notch safe-area, dashboard pattern */
      padding: 76px 16px 120px;
      padding: calc(76px + env(safe-area-inset-top)) 16px 120px;
    }
    .page-head { margin: 8px 0 18px; }
    .page-head .kicker {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-display); font-size: 11px; letter-spacing: 3px;
      text-transform: uppercase; color: var(--green-soft); margin-bottom: 10px;
    }
    .page-head h1 {
      font-family: var(--font-display); font-size: 28px; margin: 0 0 6px;
      letter-spacing: -0.5px;
    }
    .page-head h1 i { color: var(--green); margin-right: 8px; }
    .page-head p { margin: 0; color: var(--text-muted); font-size: 14px; }

    .lb-tabs {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 6px; margin-bottom: 14px;
    }
    .lb-tab {
      border: 0; border-radius: 12px; padding: 12px 8px;
      background: transparent; color: var(--text-muted);
      font-family: var(--font-display); font-size: 12px; letter-spacing: 1px;
      cursor: pointer; min-height: 48px; white-space: nowrap;
    }
    .lb-tab.on { background: var(--green-dim); color: var(--green); font-weight: 700; }
    .lb-tab:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }

    .lb-you {
      background: linear-gradient(160deg, rgba(141,235,0,.14), rgba(141,235,0,.03) 60%), var(--card-bg);
      border: 1px solid rgba(141, 235, 0, 0.35); border-radius: var(--radius);
      padding: 20px; margin-bottom: 22px; position: relative; overflow: hidden;
      box-shadow: var(--shadow), 0 0 40px rgba(141, 235, 0, 0.07);
    }
    .lb-you::before { content:''; position:absolute; inset:0;
      background: radial-gradient(circle at 80% 10%, rgba(141,235,0,.18), transparent 55%);
      pointer-events:none; }
    .lb-you-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; position:relative; }
    .lb-you-label { font-family: var(--font-display); font-size:10px; letter-spacing:.22em; color:var(--text-muted); }
    .lb-you-pct { font-family: var(--font-display); font-size:10px; letter-spacing:.22em; color:var(--green); }
    .lb-you-rank { font-size:44px; font-weight:800; line-height:1; position:relative; }
    .lb-you-rank small { font-size:16px; color:var(--text-muted); font-weight:600; }
    .lb-you-xp { font-family: var(--font-display); font-size:13px; color:var(--green); margin-top:4px; position:relative; }
    .lb-you-bar { height:6px; background:rgba(255,255,255,.08); border-radius:3px; margin:12px 0 8px; overflow:hidden; position:relative; }
    .lb-you-bar i { display:block; height:100%; background:linear-gradient(90deg,var(--green),#c6ff5e); border-radius:3px; }
    .lb-you-note { font-size:12px; color:var(--text-muted); position:relative; }
    .lb-you-note b { color:var(--green); }
    /* Podium */
    .lb-podium { display:flex; align-items:flex-end; justify-content:center; gap:10px; margin:6px 0 22px; }
    .lb-podium[hidden] { display:none !important; }
    .lb-pcol { display:flex; flex-direction:column; align-items:center; flex:1; max-width:130px; }
    .lb-pavatar { width:64px; height:64px; border-radius:50%; border:3px solid var(--border); object-fit:cover; background:#222; }
    .lb-pinitial { display:flex; align-items:center; justify-content:center; font:700 26px var(--font-display); color:var(--green); background:rgba(141,235,0,.08); }
    .lb-p1 .lb-pavatar { width:78px; height:78px; border-color:var(--gold); box-shadow:0 0 24px rgba(224,177,45,.35); }
    .lb-p2 .lb-pavatar { border-color:var(--silver); box-shadow:0 0 18px rgba(199,204,212,.25); }
    .lb-p3 .lb-pavatar { border-color:var(--bronze); box-shadow:0 0 18px rgba(208,138,78,.25); }
    .lb-pname { font-size:13px; font-weight:700; margin-top:8px; }
    .lb-pxp { font-family:var(--font-display); font-size:12px; color:var(--text-muted); }
    .lb-pbar { width:100%; border-radius:10px 10px 0 0; margin-top:10px; display:flex; align-items:flex-start; justify-content:center; padding-top:10px; font-family:var(--font-display); font-weight:700; font-size:20px; }
    .lb-p1 .lb-pbar { height:96px; background:linear-gradient(180deg,rgba(224,177,45,.28),rgba(224,177,45,.05)); color:var(--gold); border:1px solid rgba(224,177,45,.3); border-bottom:0; }
    .lb-p2 .lb-pbar { height:72px; background:linear-gradient(180deg,rgba(199,204,212,.2),rgba(199,204,212,.04)); color:var(--silver); border:1px solid rgba(199,204,212,.25); border-bottom:0; }
    .lb-p3 .lb-pbar { height:56px; background:linear-gradient(180deg,rgba(208,138,78,.2),rgba(208,138,78,.04)); color:var(--bronze); border:1px solid rgba(208,138,78,.25); border-bottom:0; }
    .lb-crown { margin-bottom:-4px; z-index:1; line-height:0; }
    .lb-crown img { filter: drop-shadow(0 2px 8px rgba(0,0,0,.5)); }
    /* Chase gaps + trends */
    .lb-gap { font-size:11px; color:var(--green); font-family:var(--font-display); }
    .lb-gap.dim { color:var(--text-faint); }
    .lb-trend { font-size:11px; margin-left:6px; }
    .lb-trend.up { color:var(--green); } .lb-trend.down { color:#ff6b6b; } .lb-trend.same { color:var(--text-faint); }
    .lb-row.you { border-color:rgba(141,235,0,.5); }

    .lb-list { display: grid; gap: 8px; }
    .lb-row {
      display: flex; align-items: center; gap: 14px;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 16px;
    }
    .lb-row.me { border-color: rgba(141, 235, 0, 0.45); background: rgba(141,235,0,0.06); }
    .lb-row .pos {
      font-family: var(--font-display); font-size: 15px; font-weight: 700;
      min-width: 40px; text-align: center; color: var(--text-muted);
    }
    .lb-row.r1 .pos { color: var(--gold); }
    .lb-row.r2 .pos { color: var(--silver); }
    .lb-row.r3 .pos { color: var(--bronze); }
    .lb-row .who { flex: 1; min-width: 0; }
    .lb-row .who b {
      display: block; font-size: 14px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .lb-row .who span { font-size: 11px; color: var(--text-faint); font-family: var(--font-display); }
    .lb-row .xp { font-family: var(--font-display); font-size: 15px; font-weight: 700; white-space: nowrap; }
    .lb-row .xp small { color: var(--text-faint); font-weight: 400; font-size: 11px; }
    .lb-empty {
      text-align: center; color: var(--text-muted); font-size: 14px;
      padding: 40px 20px; border: 1px dashed var(--border); border-radius: var(--radius);
    }
    .lb-note { margin-top: 16px; font-size: 12px; color: var(--text-faint); text-align: center; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
    }
  </style>
</head>
<body class="leaderboard-page">

  <main class="main-content" id="mainContent">
    <div class="page-head">
      <div class="kicker"><i class="fas fa-trophy" aria-hidden="true"></i>Leaderboard</div>
      <h1>Top operators</h1>
      <p>Every game and every mission earns XP. Climb the board.</p>
    </div>

    <div class="lb-tabs" role="tablist" aria-label="Leaderboard period">
      <button class="lb-tab on" id="tabWeek" role="tab" aria-selected="true">This week</button>
      <button class="lb-tab" id="tabAll" role="tab" aria-selected="false">All time</button>
      <button class="lb-tab" id="tabDaily" role="tab" aria-selected="false">Daily Brief</button>
    </div>

    <div class="lb-you" id="lbYou" hidden>
      <div class="lb-you-top">
        <span class="lb-you-label">YOUR RANK</span>
        <span class="lb-you-pct" id="lbYouPct"></span>
      </div>
      <div class="lb-you-rank"><span id="lbYouRank">–</span> <small id="lbYouTotal"></small></div>
      <div class="lb-you-xp" id="lbYouXp">0 XP</div>
      <div class="lb-you-bar"><i id="lbYouBarFill"></i></div>
      <div class="lb-you-note" id="lbYouNote"></div>
    </div>

    <div class="lb-podium" id="lbPodium" hidden></div>

    <div class="lb-list" id="lbList" aria-live="polite">
      <div class="lb-empty">Loading the board…</div>
    </div>

    <p class="lb-note" id="lbNote">Weekly board resets every Monday. Play drills and finish missions to climb.</p>
  </main>

  <script>
    (function () {
      'use strict';
      var db = null;
      var lbMode = 'week';
      var listEl = document.getElementById('lbList');
      var youEl = document.getElementById('lbYou');

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      // Podium avatar fallback: broken photoURL -> initial-letter avatar
      window.lbAvatarFallback = function (img) {
        var d = document.createElement('div');
        d.className = 'lb-pavatar lb-pinitial';
        d.textContent = img.getAttribute('data-initial') || 'O';
        img.replaceWith(d);
      };
      function lbWeekKey(d) {
        d = d || new Date();
        var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        var day = (t.getDay() + 6) % 7;
        t.setDate(t.getDate() - day + 3);
        var first = new Date(t.getFullYear(), 0, 4);
        var week = 1 + Math.round(((t - first) / 864e5 - 3 + ((first.getDay() + 6) % 7)) / 7);
        return t.getFullYear() + '-W' + ('0' + week).slice(-2);
      }
      function xpOf(r, wk) {
        if (lbMode === 'week') return ((r.weeks || {})[wk]) || 0;
        return r.xp || 0;
      }

      function renderBoard(rows, wk, meUid, lastWkRanks) {
        if (!rows.length) {
          listEl.innerHTML = '<div class="lb-empty">No scores yet this period.<br>Play a drill to take the lead.</div>';
          document.getElementById('lbPodium').hidden = true;
          return;
        }
        // Assign ranks with tie handling: same XP = same rank, next rank skips
        var ranked = [];
        var lastXp = null, lastRank = 0;
        rows.forEach(function (r, i) {
          var xp = xpOf(r, wk);
          var rank = (xp === lastXp) ? lastRank : (i + 1);
          ranked.push({ row: r, xp: xp, rank: rank });
          lastXp = xp; lastRank = rank;
        });

        // Podium: top 3 unique ranks
        var podiumHtml = '';
        var pRows = ranked.slice(0, 3);
        if (pRows.length >= 2) {
          var order = [1, 0, 2]; // 2nd, 1st, 3rd for visual podium
          var pClasses = ['lb-p2', 'lb-p1', 'lb-p3'];
          var pNums = ['2', '1', '3'];
          podiumHtml = order.map(function (oi, vi) {
            if (oi >= pRows.length) return '';
            var pr = pRows[oi];
            var crown = vi === 1 ? '<div class="lb-crown"><img src="/media/icons/leaderboard-crown.png?v=20261004a" alt="1st place crown" style="width:46px;height:46px;object-fit:contain"></div>' : '';
            var pInitial = esc((pr.row.displayName || 'O').charAt(0).toUpperCase());
            var avatar = pr.row.photoURL ?
              '<img class="lb-pavatar" src="' + esc(pr.row.photoURL) + '" data-initial="' + pInitial + '" onerror="lbAvatarFallback(this)" alt="">' :
              '<div class="lb-pavatar lb-pinitial">' + pInitial + '</div>';
            return '<div class="lb-pcol ' + pClasses[vi] + '">' + crown + avatar +
              '<div class="lb-pname">' + esc(pr.row.displayName || 'Operator') + '</div>' +
              '<div class="lb-pxp">' + pr.xp.toLocaleString() + ' XP</div>' +
              '<div class="lb-pbar">' + pNums[vi] + '</div></div>';
          }).join('');
          var podEl = document.getElementById('lbPodium');
          podEl.innerHTML = podiumHtml;
          podEl.hidden = false;
        } else {
          document.getElementById('lbPodium').hidden = true;
        }

        // List rows (skip top 3 shown in podium, start from rank 4)
        var startIdx = Math.min(3, ranked.length);
        listEl.innerHTML = ranked.slice(startIdx).map(function (pr) {
          var r = pr.row;
          var isMe = meUid && r.id === meUid;
          var cls = 'lb-row' + (isMe ? ' me you' : '');
          // Chase gap: XP to the person directly above
          var gapHtml = '<div class="lb-gap dim">—</div>';
          var aboveIdx = ranked.indexOf(pr) - 1;
          if (aboveIdx >= 0) {
            var gap = ranked[aboveIdx].xp - pr.xp;
            if (gap > 0) gapHtml = '<div class="lb-gap">' + gap.toLocaleString() + ' XP to #' + ranked[aboveIdx].rank + '</div>';
          }
          // Trend vs last week
          var trendHtml = '';
          if (lastWkRanks && lastWkRanks[r.id] != null) {
            var diff = lastWkRanks[r.id] - pr.rank;
            if (diff > 0) trendHtml = '<span class="lb-trend up">▲' + diff + '</span>';
            else if (diff < 0) trendHtml = '<span class="lb-trend down">▼' + Math.abs(diff) + '</span>';
            else trendHtml = '<span class="lb-trend same">–</span>';
          }
          return '<div class="' + cls + '">' +
            '<div class="pos">#' + pr.rank + '</div>' +
            '<div class="who"><b>' + esc(r.displayName || 'Operator') + (isMe ? ' (you)' : '') + '</b>' + gapHtml + '</div>' +
            '<div class="xp">' + pr.xp.toLocaleString() + ' <small>XP</small>' + trendHtml + '</div>' +
            '</div>';
        }).join('');
      }

      function renderYou(rows, wk, meUid, totalCount) {
        if (!meUid) { youEl.hidden = true; return; }
        var idx = -1, mine = null, myXp = 0, myRank = 0;
        // Find user and calculate rank with ties
        var lastXp = null, lastRank = 0;
        rows.forEach(function (r, i) {
          var xp = xpOf(r, wk);
          var rank = (xp === lastXp) ? lastRank : (i + 1);
          if (r.id === meUid) { idx = i; mine = r; myXp = xp; myRank = rank; }
          lastXp = xp; lastRank = rank;
        });
        youEl.hidden = false;
        if (mine) {
          document.getElementById('lbYouRank').textContent = '#' + myRank;
          document.getElementById('lbYouTotal').textContent = totalCount ? '/ ' + totalCount : '';
          document.getElementById('lbYouXp').textContent = myXp.toLocaleString() + ' XP ' + (lbMode === 'week' ? 'this week' : 'all time');
          // Percentile
          if (totalCount && totalCount > 0) {
            var pct = Math.ceil((myRank / totalCount) * 100);
            document.getElementById('lbYouPct').textContent = 'TOP ' + pct + '%';
          }
          // Progress bar: XP relative to #1
          var topXp = rows.length ? xpOf(rows[0], wk) : myXp;
          var barPct = topXp > 0 ? Math.min(100, Math.round((myXp / topXp) * 100)) : 0;
          document.getElementById('lbYouBarFill').style.width = barPct + '%';
          // Chase note: XP to pass the person above
          var noteEl = document.getElementById('lbYouNote');
          if (idx > 0) {
            var aboveXp = xpOf(rows[idx - 1], wk);
            var gap = aboveXp - myXp;
            var aboveName = esc(rows[idx - 1].displayName || 'Operator');
            // Find above rank with ties
            var aboveRank = 1, lx = null, lr = 0;
            for (var j = 0; j < idx; j++) {
              var jxp = xpOf(rows[j], wk);
              var jr = (jxp === lx) ? lr : (j + 1);
              if (j === idx - 1) aboveRank = jr;
              lx = jxp; lr = jr;
            }
            if (gap > 0) {
              noteEl.innerHTML = '<b>' + gap.toLocaleString() + ' XP</b> to pass <b>' + aboveName + '</b> at #' + aboveRank;
            } else {
              noteEl.innerHTML = 'Tied with <b>' + aboveName + '</b> at #' + aboveRank;
            }
          } else {
            noteEl.innerHTML = 'You hold <b>#1</b>. Defend it.';
          }
        } else {
          // Outside the top 50
          document.getElementById('lbYouRank').textContent = '50+';
          document.getElementById('lbYouTotal').textContent = totalCount ? '/ ' + totalCount : '';
          document.getElementById('lbYouPct').textContent = '';
          document.getElementById('lbYouBarFill').style.width = '0%';
          document.getElementById('lbYouNote').textContent = 'Play to climb into the top 50.';
          db.collection('leaderboard').doc(meUid).get().then(function (d) {
            var r = d.data() || {};
            document.getElementById('lbYouXp').textContent = xpOf(r, wk).toLocaleString() + ' XP ' + (lbMode === 'week' ? 'this week' : 'all time');
          }).catch(function () {});
        }
      }

      function lastWeekKey() {
        var d = new Date();
        d.setDate(d.getDate() - 7);
        return lbWeekKey(d);
      }

      async function loadBoard() {
        if (!db) return;
        if (lbMode === 'daily') return loadDailyBoard();
        var wk = lbWeekKey();
        var field = lbMode === 'week' ? 'weeks.' + wk : 'xp';
        var meUid = firebase.auth().currentUser ? firebase.auth().currentUser.uid : null;
        try {
          var snap = await db.collection('leaderboard').orderBy(field, 'desc').limit(50).get();
          var rows = [];
          snap.forEach(function (doc) { rows.push(Object.assign({ id: doc.id }, doc.data() || {})); });

          // Last week's ranks for trend arrows (graceful: empty if no data)
          var lastWkRanks = {};
          if (lbMode === 'week') {
            try {
              var lastWk = lastWeekKey();
              var lastSnap = await db.collection('leaderboard').orderBy('weeks.' + lastWk, 'desc').limit(50).get();
              var lx = null, lr = 0;
              var li = 0;
              lastSnap.forEach(function (doc) {
                var d = doc.data() || {};
                var xp = ((d.weeks || {})[lastWk]) || 0;
                var rank = (xp === lx) ? lr : (li + 1);
                lastWkRanks[doc.id] = rank;
                lx = xp; lr = rank; li++;
              });
            } catch (e) { /* no last-week data yet — trends stay hidden */ }
          }

          // Total user count for percentile — cached in stats/leaderboard by the
          // daily counter job (tools/leaderboard-counter). Falls back to the
          // fetched page size if the cache doc doesn't exist yet.
          var totalCount = rows.length;
          try {
            var metaDoc = await db.collection('stats').doc('leaderboard').get();
            var meta = metaDoc.data() || {};
            if (meta.totalUsers > 0) totalCount = meta.totalUsers;
          } catch (e) { /* percentile uses page size as fallback */ }

          renderBoard(rows, wk, meUid, lastWkRanks);
          renderYou(rows, wk, meUid, totalCount);
        } catch (e) {
          listEl.innerHTML = '<div class="lb-empty">Could not load the board.<br>Check your connection and reload.</div>';
        }
      }

      function startOfToday() {
        var d = new Date();
        d.setHours(0, 0, 0, 0);
        return d;
      }

      function localDayKey(d) {
        d = d || new Date();
        var m = String(d.getMonth() + 1).padStart(2, '0');
        var day = String(d.getDate()).padStart(2, '0');
        return d.getFullYear() + '-' + m + '-' + day;
      }

      async function loadDailyBoard() {
        var meUid = (window.firebase && firebase.auth().currentUser) ? firebase.auth().currentUser.uid : null;
        try {
          // Daily board is a dedicated per-day collection populated by the
          // game shell on lab-daily completion — no cross-user game_sessions
          // query needed (rules forbid it).
          var today = localDayKey();
          var snap = await db.collection('daily_boards').doc(today).collection('scores')
            .orderBy('score', 'desc').limit(50).get();
          var rows = [];
          snap.forEach(function (doc) {
            var d = doc.data() || {};
            rows.push({
              id: doc.id,
              displayName: d.displayName || 'Operator',
              score: Math.round(d.score || 0),
              plays: d.plays || 0
            });
          });
          renderDailyBoard(rows, meUid);
        } catch (e) {
          listEl.innerHTML = '<div class="lb-empty">Could not load today\u2019s board.<br>Check your connection and reload.</div>';
          youEl.hidden = true;
        }
      }

      function renderDailyBoard(rows, meUid) {
        var medals = ['\uD83E\uDD47', '\uD83E\uDD48', '\uD83E\uDD49'];
        document.getElementById('lbPodium').hidden = true;
        if (!rows.length) {
          listEl.innerHTML = '<div class="lb-empty">No scores on today\u2019s brief yet.<br>Be the first to shoot it.</div>';
        } else {
          listEl.innerHTML = rows.map(function (r, i) {
            var isMe = meUid && r.id === meUid;
            var cls = 'lb-row' + (isMe ? ' me' : '') + (i < 3 ? ' r' + (i + 1) : '');
            var pos = i < 3 ? medals[i] : '#' + (i + 1);
            var plays = r.plays ? '<span>' + r.plays + (r.plays === 1 ? ' attempt' : ' attempts') + '</span>' : '<span>&nbsp;</span>';
            return '<div class="' + cls + '">' +
              '<div class="pos">' + pos + '</div>' +
              '<div class="who"><b>' + esc(r.displayName || 'Operator') + (isMe ? ' (you)' : '') + '</b>' + plays + '</div>' +
              '<div class="xp">' + r.score + ' <small>PTS</small></div>' +
              '</div>';
          }).join('');
        }
        // Your card — reuses the existing lb-you elements (no daily-only DOM)
        if (!meUid) { youEl.hidden = true; return; }
        youEl.hidden = false;
        var idx = -1;
        rows.forEach(function (r, i) { if (r.id === meUid) idx = i; });
        document.getElementById('lbYouPct').textContent = 'DAILY BRIEF';
        if (idx >= 0) {
          var r = rows[idx];
          document.getElementById('lbYouRank').textContent = '#' + (idx + 1);
          document.getElementById('lbYouTotal').textContent = rows.length >= 50 ? '/ 50+' : '/ ' + rows.length;
          document.getElementById('lbYouXp').textContent = r.score.toLocaleString() + ' PTS';
          document.getElementById('lbYouNote').textContent = r.plays + (r.plays === 1 ? ' attempt' : ' attempts') + ' \u00b7 today\u2019s brief';
          var top = rows.length ? rows[0].score : r.score;
          var pct = top > 0 ? Math.min(100, Math.round((r.score / top) * 100)) : 0;
          document.getElementById('lbYouBarFill').style.width = pct + '%';
        } else {
          document.getElementById('lbYouRank').textContent = '\u2014';
          document.getElementById('lbYouTotal').textContent = '';
          document.getElementById('lbYouPct').textContent = 'DAILY BRIEF';
          document.getElementById('lbYouXp').textContent = 'No score yet';
          document.getElementById('lbYouBarFill').style.width = '0%';
          document.getElementById('lbYouNote').textContent = 'Shoot today\u2019s brief to join the board.';
        }
      }

      var LB_NOTES = {
        week: 'Weekly board resets every Monday. Play drills and finish missions to climb.',
        all: 'Every point ever earned, all in one place.',
        daily: 'One brief per day. Unlimited attempts \u2014 your best score counts.'
      };
      function setMode(mode) {
        lbMode = mode;
        var tabs = { week: 'tabWeek', all: 'tabAll', daily: 'tabDaily' };
        Object.keys(tabs).forEach(function (m) {
          var tab = document.getElementById(tabs[m]);
          tab.classList.toggle('on', mode === m);
          tab.setAttribute('aria-selected', mode === m);
        });
        document.getElementById('lbNote').textContent = LB_NOTES[mode] || LB_NOTES.week;
        listEl.innerHTML = '<div class="lb-empty">Loading the board…</div>';
        document.getElementById('lbPodium').hidden = true;
        loadBoard();
      }
      document.getElementById('tabWeek').addEventListener('click', function () { setMode('week'); });
      document.getElementById('tabAll').addEventListener('click', function () { setMode('all'); });
      document.getElementById('tabDaily').addEventListener('click', function () { setMode('daily'); });

      function boot() {
        if (!window.firebase || !firebase.auth || !firebase.firestore) {
          listEl.innerHTML = '<div class="lb-empty">Could not reach our servers.<br>Check your connection and reload.</div>';
          return;
        }
        db = firebase.firestore();
        firebase.auth().onAuthStateChanged(function (user) {
          if (!user) {
            listEl.innerHTML = '<div class="lb-empty">Sign in to see the leaderboard.<br><a href="/login.html" style="color:var(--green);font-weight:700;">Sign in</a></div>';
            youEl.hidden = true;
            document.getElementById('lbPodium').hidden = true;
            return;
          }
          loadBoard();
        });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
      else boot();
    })();
  </script>
</body>
</html>
