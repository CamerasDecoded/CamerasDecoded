<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journey — Cameras Decoded</title>
  <meta name="description" content="Your personalized learning journey with Cynetis‑7." />

  <!-- ===== MASTER LOADER ===== -->
  <script src="/scripts/master-loader.js"></script>

  <!-- ===== SHARED COMPONENT CSS ===== -->
  <link rel="stylesheet" href="header.css" />
  <link rel="stylesheet" href="bottom-nav.css" />

  <!-- ===== FIREBASE SDKs ===== -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- ===== FIREBASE INIT ===== -->
  <script src="/scripts/firebase-init.js"></script>

  <!-- ===== SHARED COMPONENT SCRIPTS ===== -->
  <script src="header.js"></script>
  <script src="sidebar.js"></script>
  <script src="bottom-nav.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* ============================================================
       JOURNEY PAGE – CONTENT STYLES
       ============================================================ */
    :root {
      --space-sm: 16px; --space-md: 32px; --space-lg: 64px; --space-xl: 96px;
      --green: #8deb00; --green-dim: rgba(141,235,0,0.12); --green-glow: rgba(141,235,0,0.15);
      --text-muted: #b4b4b4; --bg-panel: #0A0A0A; --border-dim: #1A1A1A; --gold: #e0b12d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050705;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(141, 235, 0, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(141, 235, 0, 0.08) 0%, transparent 45%),
        linear-gradient(rgba(141, 235, 0, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(141, 235, 0, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px, 24px 24px;
      background-attachment: fixed;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1,h2,h3,.mono { font-family: 'Space Mono', monospace; }
    a { text-decoration: none; color: inherit; transition: 0.2s; }

    /* ============================================================
       MAIN CONTENT – offset for the injected sidebar
    ============================================================ */
    .main-content {
      margin-left: 280px;
      padding: 100px 40px 40px;
      max-width: calc(1200px + 280px);
      position: relative;
      z-index: 2;
      animation: fadeIn 0.5s ease-in-out forwards;
    }

    @media (max-width: 1024px) {
      .main-content {
        margin-left: 0;
        padding: 100px 20px 20px;
      }
    }

    @keyframes fadeIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }

    /* ============================================================
       JOURNEY HEADER
       ============================================================ */
    .journey-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-dim);
      padding-bottom: 12px;
    }
    .journey-header h1 {
      font-size: 24px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .journey-header h1 span { color: var(--green); }
    .journey-header .points-display {
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      color: var(--green);
      background: var(--green-dim);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid rgba(141,235,0,0.15);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ============================================================
       MODULE PROGRESS (overall + current module)
       ============================================================ */
    .module-progress {
      background: var(--bg-panel);
      border: 1px solid var(--border-dim);
      border-radius: 10px;
      padding: 14px 20px;
      margin-bottom: 20px;
    }
    .module-progress .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 4px;
    }
    .module-progress .top-row .label {
      font-size: 13px;
      color: var(--text-muted);
    }
    .module-progress .top-row .percentage {
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      color: var(--green);
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--border-dim);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-track .fill {
      height: 100%;
      background: linear-gradient(90deg, #1db31b 0%, #c9e265 100%);
      border-radius: 4px;
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      width: 0%;
    }

    /* ============================================================
       STEPS (Duolingo style)
       ============================================================ */
    .step-container {
      margin-bottom: 24px;
    }
    .step-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-dim);
      border-radius: 12px;
      padding: 20px 24px;
      transition: all 0.3s ease;
      margin-bottom: 12px;
    }
    .step-card.completed {
      border-color: rgba(141,235,0,0.2);
      opacity: 0.6;
    }
    .step-card.locked {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .step-card .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .step-card .top .left {
      flex: 1;
    }
    .step-card .top .left .step-title {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 2px;
    }
    .step-card .top .left .step-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .step-card .top .left .step-meta .type-badge {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      background: var(--green-dim);
      color: var(--green);
      padding: 1px 10px;
      border-radius: 12px;
      border: 1px solid rgba(141,235,0,0.08);
    }
    .step-card .top .left .step-meta .points-badge {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--gold);
      background: rgba(224,177,45,0.08);
      padding: 1px 10px;
      border-radius: 12px;
      border: 1px solid rgba(224,177,45,0.1);
    }
    .step-card .top .step-status {
      font-size: 22px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .step-card .step-description {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.6;
    }
    .step-card .step-content {
      margin-top: 12px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
      border: 1px solid var(--border-dim);
      color: #d0d0d0;
      font-size: 14px;
      line-height: 1.7;
    }
    .step-card .step-content iframe {
      width: 100%;
      border-radius: 6px;
    }
    .step-card .step-actions {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-step {
      padding: 8px 24px;
      background: transparent;
      border: 1px solid var(--green);
      border-radius: 8px;
      color: var(--green);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-step:hover {
      background: rgba(141,235,0,0.08);
    }
    .btn-step:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-step.completed-btn {
      border-color: var(--text-muted);
      color: var(--text-muted);
      cursor: default;
    }
    .btn-step.completed-btn:hover {
      background: transparent;
    }

    /* Cynetis tip */
    .cynetis-tip {
      background: rgba(141,235,0,0.04);
      border-left: 3px solid var(--green);
      padding: 10px 14px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .cynetis-tip strong {
      color: var(--green);
    }

    /* ============================================================
       MODULE COMPLETION CELEBRATION
       ============================================================ */
    .module-complete {
      background: var(--bg-panel);
      border: 1px solid var(--green);
      border-radius: 12px;
      padding: 28px 24px;
      text-align: center;
      margin-bottom: 20px;
      animation: fadeSlide 0.6s ease forwards;
    }
    .module-complete .icon {
      font-size: 48px;
      margin-bottom: 8px;
    }
    .module-complete h2 {
      font-family: 'Space Mono', monospace;
      color: var(--green);
      font-size: 24px;
    }
    .module-complete p {
      color: var(--text-muted);
      font-size: 14px;
      margin: 6px 0 14px;
    }
    .module-complete .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(20px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ============================================================
       SIDEBAR – overridden content (module library)
       ============================================================ */
    /* We'll keep the default sidebar styling from sidebar.js,
       but we will replace its content with our custom module list.
       We'll target the .sidebar-nav inside #sidebarContainer */
    .sidebar-module-library {
      flex: 1;
      overflow-y: auto;
    }
    .sidebar-module-library .module-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-muted);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      border: 1px solid transparent;
      margin-bottom: 4px;
    }
    .sidebar-module-library .module-item:hover {
      background: rgba(141,235,0,0.04);
      border-color: rgba(141,235,0,0.15);
    }
    .sidebar-module-library .module-item.active {
      color: var(--green);
      background: rgba(141,235,0,0.08);
      border-color: rgba(141,235,0,0.2);
    }
    .sidebar-module-library .module-item .status-icon {
      margin-left: auto;
      font-size: 14px;
    }
    .sidebar-module-library .module-item .status-icon.locked { color: #555; }
    .sidebar-module-library .module-item .status-icon.completed { color: var(--green); }
    .sidebar-module-library .module-item .status-icon.active { color: var(--gold); }

    /* ============================================================
       CYNETIS‑7 ASSISTANT (floating)
       ============================================================ */
    .cynetis-assistant {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }

    .cynetis-toggle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(141, 235, 0, 0.25);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5), 0 0 40px rgba(141, 235, 0, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--green);
      font-size: 24px;
      font-weight: 700;
      font-family: 'Space Mono', monospace;
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    .cynetis-toggle:hover {
      border-color: var(--green);
      box-shadow: 0 4px 32px rgba(141, 235, 0, 0.15), 0 0 60px rgba(141, 235, 0, 0.08);
      transform: scale(1.04);
    }
    .cynetis-toggle .avatar-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      overflow: hidden;
    }
    .cynetis-toggle .avatar-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cynetis-panel {
      width: 340px;
      max-width: calc(100vw - 40px);
      background: rgba(10, 10, 10, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(141, 235, 0, 0.12);
      border-radius: 16px;
      box-shadow: 0 16px 60px rgba(0, 0, 0, 0.6);
      padding: 20px 22px;
      transform: translateY(12px) scale(0.96);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: bottom right;
    }
    .cynetis-panel.open {
      transform: translateY(0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .cynetis-panel .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      padding-bottom: 10px;
    }
    .cynetis-panel .header .icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
    }
    .cynetis-panel .header .icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cynetis-panel .header .name {
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .cynetis-panel .header .status {
      margin-left: auto;
      font-size: 10px;
      color: var(--text-muted);
      background: rgba(255,255,255,0.04);
      padding: 2px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .cynetis-panel .message {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    .cynetis-panel .message strong {
      color: var(--green);
      font-weight: 600;
    }
    .cynetis-panel .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .cynetis-panel .actions .chip {
      padding: 5px 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px;
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .cynetis-panel .actions .chip:hover {
      border-color: var(--green);
      color: var(--green);
      background: rgba(141,235,0,0.04);
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 1024px) {
      .main-content { margin-left: 0; padding: 100px 16px 20px; }
      .journey-header { flex-direction: column; align-items: stretch; gap: 10px; }
    }
    @media (max-width: 600px) {
      .step-card { padding: 16px; }
      .step-card .top { flex-direction: column; }
      .step-card .top .step-status { align-self: flex-end; }
      .cynetis-panel { width: 100%; max-width: calc(100vw - 24px); }
    }
  </style>
</head>
<body>

  <!-- ===== SIDEBAR INJECTION POINT ===== -->
  <div id="sidebarContainer"></div>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content" id="mainContent">

    <!-- ============================================================
         JOURNEY HEADER
         ============================================================ -->
    <div class="journey-header">
      <h1><i class="fas fa-route" style="color:var(--green);"></i> <span>Cynetis‑7</span> Journey</h1>
      <div class="points-display">
        <i class="fas fa-star"></i>
        <span id="totalPointsDisplay">0</span> pts
      </div>
    </div>

    <!-- ============================================================
         MODULE PROGRESS (overall)
         ============================================================ -->
    <div class="module-progress" id="moduleProgress">
      <div class="top-row">
        <span class="label"><i class="fas fa-flag" style="color:var(--green);"></i> <span id="currentModuleTitle">Loading...</span></span>
        <span class="percentage" id="progressPercentage">0%</span>
      </div>
      <div class="progress-track">
        <div class="fill" id="progressFill" style="width:0%;"></div>
      </div>
    </div>

    <!-- ============================================================
         STEPS
         ============================================================ -->
    <div id="stepContainer" class="step-container">
      <!-- Rendered by JS -->
    </div>

    <!-- ============================================================
         MODULE COMPLETE (hidden until triggered)
         ============================================================ -->
    <div id="moduleComplete" style="display:none;"></div>

  </main>

  <!-- ===== BOTTOM NAV CONTAINER ===== -->
  <div id="bottomNavContainer" data-role="operator"></div>

  <!-- ============================================================
       CYNETIS‑7 ASSISTANT (floating)
       ============================================================ -->
  <div class="cynetis-assistant" id="cynetisAssistant">
    <div class="cynetis-toggle" id="cynetisToggle" aria-label="Cynetis-7 Assistant">
      <span class="avatar-icon">
        <img src="cynetis-avatar.png" alt="Cynetis-7" />
      </span>
    </div>
    <div class="cynetis-panel" id="cynetisPanel">
      <div class="header">
        <span class="icon"><img src="cynetis-avatar.png" alt="Cynetis-7" /></span>
        <span class="name">Cynetis‑7</span>
        <span class="status">Active</span>
      </div>
      <div class="message" id="cynetisMessage">
        <strong>Operator,</strong> let's decode your journey together.
      </div>
      <div class="actions" id="cynetisActions">
        <span class="chip" data-action="next">What's next?</span>
        <span class="chip" data-action="explain">Explain this step</span>
        <span class="chip" data-action="pain">My pain points</span>
        <span class="chip" data-action="badges">Badge progress</span>
      </div>
    </div>
  </div>

  <!-- ============================================================
       JAVASCRIPT – all journey logic
       ============================================================ -->
  <script>
    // ============================================================
    // FIREBASE
    // ============================================================
    const auth = window.auth || firebase.auth();
    const db = window.db || firebase.firestore();

    // ============================================================
    // STATE
    // ============================================================
    let currentUser = null;
    let userData = null;
    let journeyData = null;      // { id, title, modules: [ {id, title, steps: [...] } ] }
    let userProgress = null;     // { completedSteps: [], completedModules: [], totalPoints: 0, badgesEarned: [] }
    let currentModuleIndex = 0;
    let assistantOpen = false;

    // ============================================================
    // DOM REFS
    // ============================================================
    const totalPointsDisplay = document.getElementById('totalPointsDisplay');
    const currentModuleTitle = document.getElementById('currentModuleTitle');
    const progressFill = document.getElementById('progressFill');
    const progressPercentage = document.getElementById('progressPercentage');
    const stepContainer = document.getElementById('stepContainer');
    const moduleCompleteDiv = document.getElementById('moduleComplete');
    const cynetisToggle = document.getElementById('cynetisToggle');
    const cynetisPanel = document.getElementById('cynetisPanel');
    const cynetisMessage = document.getElementById('cynetisMessage');
    const cynetisActions = document.getElementById('cynetisActions');

    // ============================================================
    // HELPERS
    // ============================================================
    function cdToast(msg) {
      const container = document.getElementById('cd-toast-container') || (() => {
        const div = document.createElement('div');
        div.id = 'cd-toast-container';
        div.style.cssText = 'position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;';
        document.body.appendChild(div);
        return div;
      })();
      const toast = document.createElement('div');
      toast.className = 'cd-toast';
      toast.style.cssText = 'background:rgba(10,10,10,0.92);border:1px solid rgba(141,235,0,0.15);color:#fff;font-family:"Space Mono",monospace;font-size:12px;padding:10px 22px;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,0.4);opacity:0;transform:translateY(-8px);transition:all 0.3s ease;pointer-events:auto;text-align:center;';
      toast.textContent = msg;
      container.appendChild(toast);
      requestAnimationFrame(() => { toast.style.opacity = '1'; toast.style.transform = 'translateY(0)'; });
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // ============================================================
    // SEED DATA (one‑time setup)
    // ============================================================
    async function seedJourneyData() {
      try {
        const check = await db.collection('journeys').doc('beginner').get();
        if (check.exists) return;

        const beginnerJourney = {
          id: 'beginner',
          title: 'Beginner Operator Journey',
          level: 'beginner',
          description: 'Master the fundamentals of photography and build your confidence.',
          modules: [
            {
              id: 'mod_01',
              title: 'Welcome & Basics',
              description: 'Get started with Cameras Decoded and the Exposure Triangle.',
              steps: [
                {
                  id: 'step_001',
                  type: 'text',
                  title: 'Welcome to Cameras Decoded',
                  description: 'Learn what it means to be an Operator and how this platform will transform your photography.',
                  content: 'Welcome to your journey. Over the next several steps, you\'ll learn the fundamentals of photography, master your camera, and build the confidence to create stunning images.',
                  duration: 5,
                  points: 50,
                  badge: null,
                  prerequisites: [],
                  recommendedProducts: [],
                  completionAction: 'mark_complete'
                },
                {
                  id: 'step_002',
                  type: 'video',
                  title: 'Understanding the Exposure Triangle',
                  description: 'Watch this video to understand how aperture, shutter speed, and ISO work together.',
                  content: '<iframe width="100%" height="315" src="https://www.youtube.com/embed/example1" frameborder="0" allowfullscreen></iframe>',
                  duration: 12,
                  points: 100,
                  badge: 'aperture_adept',
                  prerequisites: ['step_001'],
                  recommendedProducts: ['guide_exposure_triangle'],
                  completionAction: 'watch_video'
                },
                {
                  id: 'step_003',
                  type: 'snapshot',
                  title: 'Create Your First Snapshot Card',
                  description: 'Generate a Snapshot Card on Aperture to solidify your understanding.',
                  content: 'Open the Snapshot Card AI and create a card about aperture.',
                  duration: 8,
                  points: 75,
                  badge: 'snapshot_collector',
                  prerequisites: ['step_002'],
                  recommendedProducts: [],
                  completionAction: 'launch_snapshot'
                }
              ]
            },

    // ============================================================
    // LOAD JOURNEY DATA
    // ============================================================
    async function loadJourneyData(level = 'beginner') {
      try {
        const journeyDoc = await db.collection('journeys').doc(level).get();
        if (!journeyDoc.exists) {
          if (level === 'beginner') {
            await seedJourneyData();
            const retry = await db.collection('journeys').doc('beginner').get();
            if (retry.exists) {
              journeyData = retry.data();
            } else {
              // Fallback minimal
              journeyData = {
                id: 'beginner',
                title: 'Beginner Journey',
                modules: [{
                  id: 'mod_01',
                  title: 'Start Here',
                  description: 'Introductory module.',
                  steps: [{
                    id: 'step_001',
                    type: 'text',
                    title: 'Welcome',
                    description: 'Start here.',
                    content: 'Welcome!',
                    duration: 5,
                    points: 50,
                    badge: null,
                    prerequisites: [],
                    recommendedProducts: [],
                    completionAction: 'mark_complete'
                  }],
                  totalPoints: 50
                }]
              };
            }
          } else {
            return loadJourneyData('beginner');
          }
        } else {
          journeyData = journeyDoc.data();
        }

        // Load user progress
        if (currentUser) {
          const ujDoc = await db.collection('userJourney').doc(currentUser.uid).get();
          if (ujDoc.exists) {
            userProgress = ujDoc.data();
            if (!userProgress.completedSteps) userProgress.completedSteps = [];
            if (!userProgress.completedModules) userProgress.completedModules = [];
            if (!userProgress.totalPoints) userProgress.totalPoints = 0;
            if (!userProgress.badgesEarned) userProgress.badgesEarned = [];
          } else {
            userProgress = {
              completedSteps: [],
              completedModules: [],
              totalPoints: 0,
              badgesEarned: [],
              startedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            await db.collection('userJourney').doc(currentUser.uid).set(userProgress);
          }
        }

        // Determine which module to show (first incomplete or last completed)
        if (journeyData.modules && journeyData.modules.length > 0) {
          let found = false;
          for (let i = 0; i < journeyData.modules.length; i++) {
            const mod = journeyData.modules[i];
            const allSteps = mod.steps.map(s => s.id);
            const completedSteps = userProgress.completedSteps.filter(id => allSteps.includes(id));
            if (completedSteps.length < allSteps.length) {
              currentModuleIndex = i;
              found = true;
              break;
            }
          }
          if (!found) {
            currentModuleIndex = journeyData.modules.length - 1; // last module
          }
        }

        renderAll();
        renderSidebarLibrary();
        updateAssistantTip();

      } catch (err) {
        console.error('Error loading journey data:', err);
        cdToast('Error loading journey: ' + err.message);
      }
    }

    // ============================================================
    // RENDER ALL
    // ============================================================
    function renderAll() {
      if (!journeyData || !journeyData.modules) return;
      const mod = journeyData.modules[currentModuleIndex];
      if (!mod) return;

      // Update header
      currentModuleTitle.textContent = mod.title;

      // Update points
      totalPointsDisplay.textContent = userProgress.totalPoints || 0;

      // Update module progress
      const allStepIds = mod.steps.map(s => s.id);
      const completedCount = allStepIds.filter(id => userProgress.completedSteps.includes(id)).length;
      const totalSteps = allStepIds.length;
      const pct = totalSteps > 0 ? Math.round((completedCount / totalSteps) * 100) : 0;
      progressFill.style.width = pct + '%';
      progressPercentage.textContent = pct + '%';

      // Render steps
      renderSteps(mod);

      // Check if module is complete
      if (completedCount === totalSteps && totalSteps > 0) {
        if (!userProgress.completedModules.includes(mod.id)) {
          // Mark module as completed
          userProgress.completedModules.push(mod.id);
          db.collection('userJourney').doc(currentUser.uid).set({
            completedModules: userProgress.completedModules
          }, { merge: true });
          showModuleComplete(mod);
        }
      } else {
        moduleCompleteDiv.style.display = 'none';
      }

      // Re-render sidebar library to update statuses
      renderSidebarLibrary();
    }

    // ============================================================
    // COMPLETE STEP
    // ============================================================
    window.completeStep = async function(stepId) {
      if (!currentUser) return;

      const mod = journeyData.modules[currentModuleIndex];
      const step = mod.steps.find(s => s.id === stepId);
      if (!step) {
        cdToast('Step not found.');
        return;
      }

      if (userProgress.completedSteps.includes(stepId)) {
        cdToast('Already completed this step.');
        return;
      }

      const missing = (step.prerequisites || []).filter(pre => !userProgress.completedSteps.includes(pre));
      if (missing.length > 0) {
        cdToast('Complete the prerequisites first.');
        return;
      }

      try {
        const newCompleted = [...userProgress.completedSteps, stepId];
        const newPoints = (userProgress.totalPoints || 0) + (step.points || 0);

        const newBadges = [...(userProgress.badgesEarned || [])];
        const earnedBadges = [];

        if (step.badge && !newBadges.includes(step.badge)) {
          newBadges.push(step.badge);
          earnedBadges.push(step.badge);
        }

        // Additional badge logic (e.g., first 3 steps, 5 steps)
        if (newCompleted.length === 3 && !newBadges.includes('first_steps')) {
          newBadges.push('first_steps');
          earnedBadges.push('first_steps');
        }
        if (newCompleted.length === 5 && !newBadges.includes('signal_pioneer')) {
          newBadges.push('signal_pioneer');
          earnedBadges.push('signal_pioneer');
        }

        await db.collection('userJourney').doc(currentUser.uid).set({
          completedSteps: newCompleted,
          totalPoints: newPoints,
          badgesEarned: newBadges
        }, { merge: true });

        userProgress.completedSteps = newCompleted;
        userProgress.totalPoints = newPoints;
        userProgress.badgesEarned = newBadges;

        if (earnedBadges.length > 0) {
          const badgeNames = earnedBadges.join(', ');
          cdToast(`🏅 Badge Unlocked: ${badgeNames}!`);
        }

        cdToast(`✅ Step complete! +${step.points || 0} points (Total: ${newPoints})`);

        // Re-render the current module
        renderAll();
        updateAssistantTip();

        // Check if module is now complete
        const modSteps = mod.steps.map(s => s.id);
        if (modSteps.every(id => newCompleted.includes(id))) {
          // Module completed – show celebration
          if (!userProgress.completedModules.includes(mod.id)) {
            userProgress.completedModules.push(mod.id);
            await db.collection('userJourney').doc(currentUser.uid).set({
              completedModules: userProgress.completedModules
            }, { merge: true });
            showModuleComplete(mod);
          }
        }

      } catch (err) {
        console.error('Error completing step:', err);
        cdToast('Error: ' + err.message);
      }
    };

    // ============================================================
    // SIDEBAR LIBRARY (override sidebar content)
    // ============================================================
    function renderSidebarLibrary() {
      const sidebarContainer = document.getElementById('sidebarContainer');
      if (!sidebarContainer) return;

      // Wait for sidebar to be injected (we'll use a MutationObserver or just set a timeout)
      // Better: use a small delay and then replace content if needed.
      setTimeout(() => {
        const sidebar = document.querySelector('#sidebarContainer .sidebar');
        if (!sidebar) return;

        // Find the nav area: typically .sidebar-nav or .sidebar .nav-group
        // We'll replace the content of .sidebar-nav with our module list.
        let navContainer = sidebar.querySelector('.sidebar-nav');
        if (!navContainer) {
          // If not present, create it
          navContainer = document.createElement('div');
          navContainer.className = 'sidebar-nav';
          // Insert it after the profile or logo
          const profile = sidebar.querySelector('.sidebar-profile');
          if (profile) {
            profile.after(navContainer);
          } else {
            sidebar.appendChild(navContainer);
          }
        }

        // Build module list
        if (!journeyData || !journeyData.modules) {
          navContainer.innerHTML = '<div style="padding:12px;color:var(--text-muted);">Loading modules...</div>';
          return;
        }

        const completedModules = userProgress?.completedModules || [];
        let html = `
          <div class="sidebar-module-library">
            <div style="padding:8px 12px 4px; font-size:11px; color:#555; text-transform:uppercase; letter-spacing:0.5px;">Journey Modules</div>
        `;
        journeyData.modules.forEach((mod, index) => {
          const isCompleted = completedModules.includes(mod.id);
          const isActive = index === currentModuleIndex;
          // Determine lock status: if previous module not completed, lock
          let isLocked = false;
          if (index > 0) {
            const prevMod = journeyData.modules[index - 1];
            if (!completedModules.includes(prevMod.id)) {
              isLocked = true;
            }
          }
          const statusIcon = isCompleted ? '✅' : (isLocked ? '🔒' : (isActive ? '▶️' : ''));
          const statusClass = isActive ? 'active' : '';
          html += `
            <div class="module-item ${statusClass}" data-module-index="${index}" style="${isLocked ? 'opacity:0.5; cursor:not-allowed;' : 'cursor:pointer;'}">
              <span>${mod.title}</span>
              <span class="status-icon ${isCompleted ? 'completed' : (isLocked ? 'locked' : 'active')}">${statusIcon}</span>
            </div>
          `;
        });
        html += `</div>`;
        navContainer.innerHTML = html;

        // Add click listeners
        navContainer.querySelectorAll('.module-item').forEach(el => {
          const idx = parseInt(el.dataset.moduleIndex);
          if (!isNaN(idx) && !el.style.cursor.includes('not-allowed')) {
            el.addEventListener('click', () => {
              // Check if unlocked
              const mod = journeyData.modules[idx];
              if (idx > 0) {
                const prevMod = journeyData.modules[idx - 1];
                if (!userProgress.completedModules.includes(prevMod.id)) {
                  cdToast('🔒 Complete the previous module first.');
                  return;
                }
              }
              goToModule(idx);
            });
          }
        });

        // Also update the active state in the sidebar profile? Not necessary.
      }, 300); // give sidebar.js time to inject
    }

    // ============================================================
    // ASSISTANT LOGIC
    // ============================================================
    function updateAssistantTip() {
      if (!journeyData || !userProgress) {
        cynetisMessage.innerHTML = `<strong>Operator,</strong> I'm analyzing your journey. Please complete a few steps and I'll have personalized tips.`;
        return;
      }

      const mod = journeyData.modules[currentModuleIndex];
      if (!mod) return;

      const steps = mod.steps;
      const completed = userProgress.completedSteps || [];
      const allSteps = steps.map(s => s.id);
      const completedCount = allSteps.filter(id => completed.includes(id)).length;
      const totalSteps = allSteps.length;

      // Find next incomplete step
      let nextStep = null;
      for (const s of steps) {
        if (!completed.includes(s.id)) {
          nextStep = s;
          break;
        }
      }

      let tip = '';
      if (completedCount === totalSteps && totalSteps > 0) {
        tip = `🎉 You've completed <strong>${mod.title}</strong>! Ready for the next module?`;
      } else if (nextStep) {
        const stepTitle = nextStep.title;
        const stepDesc = nextStep.description || '';
        let specificAdvice = '';
        const painPoints = userData?.learningJourney?.painPoints || [];
        if (painPoints.includes('technical') && nextStep.type === 'video') {
          specificAdvice = ' Watch closely – this will help with your technical confusion.';
        } else if (painPoints.includes('creative') && nextStep.type === 'challenge') {
          specificAdvice = ' Use this challenge to break through creative block.';
        } else if (painPoints.includes('editing') && nextStep.type === 'text') {
          specificAdvice = ' This covers editing – right up your alley.';
        }
        tip = `Your next step is <strong>${stepTitle}</strong>. ${stepDesc}${specificAdvice}`;
      } else {
        tip = `You've completed ${completedCount} of ${totalSteps} steps. Keep going – you're making progress!`;
      }

      // Add a motivational line based on progress
      const pct = totalSteps > 0 ? (completedCount / totalSteps) * 100 : 0;
      if (pct < 25) {
        tip += '<br>Every journey starts with a first step. You\'re building momentum.';
      } else if (pct < 50) {
        tip += '<br>Halfway there! You\'re building real confidence.';
      } else if (pct < 75) {
        tip += '<br>You\'re in the flow. Keep pushing – mastery is near.';
      } else if (pct < 100) {
        tip += '<br>Almost there! The finish line is in sight.';
      }

      cynetisMessage.innerHTML = `<strong>Operator,</strong> ${tip}`;
    }

      if (!chip) return;
      const action = chip.dataset.action;
      handleAssistantAction(action);
    });

    function handleAssistantAction(action) {
      if (!journeyData || !userProgress) {
        cdToast('Please wait for your journey to load.');
        return;
      }

      const mod = journeyData.modules[currentModuleIndex];
      const steps = mod.steps;
      const completed = userProgress.completedSteps || [];
      const totalSteps = steps.length;
      const completedCount = completed.filter(id => steps.some(s => s.id === id)).length;

      let response = '';
      switch (action) {
        case 'next': {
          let nextStep = null;
          for (const s of steps) {
            if (!completed.includes(s.id)) {
              nextStep = s;
              break;
            }
          }
          if (nextStep) {
            response = `Your next step is <strong>${nextStep.title}</strong>. ${nextStep.description || ''}`;
          } else {
            response = `You've completed all steps in this module! 🎉`;
          }
          break;
        }
        case 'explain': {
          let activeStep = null;
          for (const s of steps) {
            const isLocked = s.prerequisites && s.prerequisites.some(pre => !completed.includes(pre));
            if (!completed.includes(s.id) && !isLocked) {
              activeStep = s;
              break;
            }
          }
          if (activeStep) {
            response = `<strong>${activeStep.title}</strong>: ${activeStep.description || 'No description provided.'}`;
          } else {
            response = 'All steps are either completed or locked. Check your prerequisites.';
          }
          break;
        }
        case 'pain': {
          const painPoints = userData?.learningJourney?.painPoints || [];
          if (painPoints.length > 0) {
            response = `Your pain points: ${painPoints.join(', ')}. I'll keep these in mind as you progress.`;
          } else {
            response = 'You haven\'t selected any pain points yet. Update your profile to get personalized tips.';
          }
          break;
        }
        case 'badges': {
          const earned = userProgress.badgesEarned || [];
          // Total badges from the system (we can fetch from badges collection)
          // For now, use static count of badge definitions.
          const totalBadges = 6; // we seeded 6 badges
          response = `You've earned <strong>${earned.length}</strong> of ${totalBadges} badges. ${earned.length === totalBadges ? 'Amazing – you\'ve collected them all!' : 'Keep going to unlock the rest!'}`;
          break;
        }
        default:
          response = 'I\'m here to help. What would you like to know?';
      }
      cynetisMessage.innerHTML = `<strong>Cynetis‑7:</strong> ${response}`;
    }

    // ============================================================
    // AUTH LISTENER
    // ============================================================
    function updateComponents(user, userData) {
      if (window.Header && typeof window.Header.setUserData === 'function') {
        window.Header.setUserData(user, userData);
      }
      if (window.BottomNav) {
        window.BottomNav.updateBadges(userData);
        window.BottomNav.setRole(userData?.role || 'Operator');
      }
      if (window.Sidebar && typeof window.Sidebar.updateProfile === 'function') {
        window.Sidebar.updateProfile(userData);
      }
    }

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = 'login.html?redirect=' + encodeURIComponent('journey.html');
        return;
      }

      currentUser = user;
      localStorage.setItem('cameras_decoded_uid', user.uid);

      try {
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (userDoc.exists) {
          userData = userDoc.data();
        } else {
          userData = { name: 'Operator', role: 'Operator', tier: 'free' };
        }
      } catch (err) {
        console.warn('Could not load user data:', err);
        userData = { name: 'Operator', role: 'Operator', tier: 'free' };
      }

      // Update shared components
      updateComponents(user, userData);

      // Load journey data
      await loadJourneyData('beginner');

      // After journey data loads, ensure sidebar is updated
      renderSidebarLibrary();

      // Also re-render sidebar when user updates modules
      // We can set a listener on userJourney changes, but for now we'll re-render on step complete.
    });

    // ============================================================
    // INIT – seed if needed
    // ============================================================
    (async function init() {
      try {
        const check = await db.collection('journeys').limit(1).get();
        if (check.empty) {
          await seedJourneyData();
        }
      } catch (err) {
        console.warn('Init check failed, will retry on load:', err);
      }
    })();

    console.log('🚀 Cynetis‑7 Journey Engine (Duolingo-style) ready.');
  </script>
</body>
</html>
