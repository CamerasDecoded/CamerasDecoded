<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Your Gallery — Cameras Decoded</title>
<meta name="description" content="View and download your full-resolution photos. No account needed.">
<meta property="og:title" content="Your photo gallery — Cameras Decoded">
<meta property="og:image" content="https://camerasdecoded.com/cameras-decoded-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="/scripts/firebase-init.js?v=20261007b"></script>
<style>
  :root {
    --ink: #141414;
    --ink-soft: #3a3a3a;
    --muted: #6b6b6b;
    --faint: #9a9a9a;
    --line: #e3e3e3;
    --paper: #ffffff;
    --wash: #f7f7f5;
    --accent: #1a7f37;
    --accent-wash: #eef7ef;
    --red: #c0392b;
    --mono: 'Space Mono', monospace;
    --sans: 'Montserrat', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--wash); color: var(--ink); font-family: var(--sans);
    min-height: 100dvh; display: block !important;
    padding: 0 !important;
    padding-top: calc(env(safe-area-inset-top, 0px) + 20px) !important;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 48px) !important;
  }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }

  /* Status cards */
  .card {
    background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
    padding: 44px 28px; text-align: center; margin-top: 32px;
  }
  .card .ic {
    width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center; font-size: 24px;
  }
  .card .ic.ok { background: var(--accent-wash); color: var(--accent); }
  .card .ic.err { background: #fdecea; color: var(--red); }
  .card h1, .card .card-h { font-size: 22px; font-weight: 800; margin-bottom: 8px; letter-spacing: -.01em; }
  .card p { font-size: 14px; color: var(--muted); line-height: 1.6; max-width: 380px; margin: 0 auto; }
  .spinner {
    width: 40px; height: 40px; border-radius: 50%; margin: 0 auto 18px;
    border: 3px solid var(--line); border-top-color: var(--ink);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Gallery header */
  .g-head { text-align: center; padding: 10px 0 18px; }
  .g-head .g-logo { max-width: 150px; max-height: 64px; object-fit: contain; margin-bottom: 12px; }
  .g-head .g-photog {
    font-family: var(--mono); font-size: 11px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--faint); margin-bottom: 8px;
  }
  .g-head h1, .g-head .g-title { font-size: 24px; font-weight: 800; letter-spacing: -.01em; margin-bottom: 6px; }
  .g-head .g-meta { font-size: 13px; color: var(--muted); }

  .dl-bar { display: flex; gap: 10px; margin-bottom: 16px; }
  .btn {
    flex: 1; border: none; border-radius: 12px; padding: 15px 20px;
    font-size: 15px; font-weight: 700; background: var(--ink); color: #fff;
    transition: transform .12s, opacity .2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); flex: 0 0 auto; }
  .dl-status { font-size: 12px; font-family: var(--mono); color: var(--muted); text-align: center; margin-bottom: 14px; min-height: 18px; }

  /* Grid */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .cell { aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--line); cursor: pointer; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Lightbox */
  .lb {
    position: fixed; inset: 0; z-index: 50; background: rgba(10,10,10,.96);
    display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .lb.open { opacity: 1; pointer-events: auto; }
  .lb-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px; color: #fff;
  }
  .lb-count { font-family: var(--mono); font-size: 13px; color: rgba(255,255,255,.7); }
  .lb-close {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25);
    background: transparent; color: #fff; font-size: 18px;
  }
  .lb-stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
    color: #fff; font-size: 18px;
  }
  .lb-prev { left: 10px; } .lb-next { right: 10px; }
  .lb-bottom {
    padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex; justify-content: center;
  }
  .lb-dl {
    border: none; border-radius: 12px; padding: 14px 40px;
    background: #fff; color: #141414; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }

  .foot {
    text-align: center; margin-top: 34px; padding-top: 20px;
    border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: var(--faint);
  }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    transform: translateX(-50%); background: #1c1c1c; color: #fff;
    font-size: 13px; padding: 12px 20px; border-radius: 12px;
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 99; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Loading -->
  <div class="card" id="viewLoading">
    <div class="spinner"></div>
    <div class="card-h">Loading your gallery…</div>
  </div>

  <!-- Invalid -->
  <div class="card hidden" id="viewInvalid">
    <div class="ic err"><i class="fas fa-link"></i></div>
    <div class="card-h">Link isn't valid</div>
    <p>This gallery link is invalid or was mistyped. Ask your photographer for a fresh link.</p>
  </div>

  <!-- Expired -->
  <div class="card hidden" id="viewExpired">
    <div class="ic err"><i class="fas fa-clock"></i></div>
    <div class="card-h">This gallery has expired</div>
    <p>The photographer set an expiry on this link. Reach out to them if you still need the images.</p>
  </div>

  <!-- Gallery -->
  <div id="viewGallery" class="hidden">
    <div class="g-head">
      <img class="g-logo hidden" id="gLogo" alt="Photographer logo">
      <div class="g-photog" id="gPhotog"></div>
      <div class="g-title" id="gTitle"></div>
      <div class="g-meta" id="gMeta"></div>
    </div>
    <div class="dl-bar">
      <button class="btn" id="dlAllBtn"><i class="fas fa-download"></i> Download all</button>
    </div>
    <div class="dl-status" id="dlStatus"></div>
    <div class="grid" id="grid"></div>
    <div class="foot">DELIVERED VIA CAMERAS DECODED</div>
  </div>

</div>

<!-- Lightbox -->
<div class="lb" id="lightbox" aria-hidden="true">
  <div class="lb-top">
    <div class="lb-count" id="lbCount"></div>
    <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
  </div>
  <div class="lb-stage">
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">&#8249;</button>
    <img id="lbImg" alt="Gallery photo fullscreen">
    <button class="lb-nav lb-next" id="lbNext" aria-label="Next">&#8250;</button>
  </div>
  <div class="lb-bottom">
    <button class="lb-dl" id="lbDl"><i class="fas fa-download"></i> Download</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script>
/* ============================================================
   Deliver view (client side, public — no account needed)
   Link format: deliver-view.html?u={uid}&g={galleryId}&t={token}
   The token is validated in JS against the doc's token field.
   Firestore rules can't see URL query params, so public GET is
   allowed on gallery docs (unguessable auto-IDs; the token is
   the real gate). Expiry is enforced in JS for the right UX.
   ============================================================ */
var DV = { uid: null, gid: null, token: null, data: null, idx: 0 };

function $(id) { return document.getElementById(id); }
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 2600);
}
function show(id) {
  ['viewLoading', 'viewInvalid', 'viewExpired', 'viewGallery'].forEach(function (v) {
    $(v).classList.toggle('hidden', v !== id);
  });
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

async function boot() {
  var q = new URLSearchParams(window.location.search);
  DV.uid = q.get('u'); DV.gid = q.get('g'); DV.token = q.get('t');
  if (!DV.uid || !DV.gid || !DV.token) { show('viewInvalid'); return; }
  if (!window.db) { show('viewInvalid'); return; }

  try {
    var snap = await window.db.collection('users').doc(DV.uid).collection('galleries').doc(DV.gid).get();
    if (!snap.exists) { show('viewInvalid'); return; }
    var d = snap.data() || {};
    // Token gate
    if (!d.token || d.token !== DV.token) { show('viewInvalid'); return; }
    // Expiry gate
    if (d.expiresAt && d.expiresAt.toDate && d.expiresAt.toDate() < new Date()) { show('viewExpired'); return; }
    DV.data = d;
    renderGallery();
    bumpViews();
  } catch (e) {
    console.warn('Gallery load failed:', e);
    show('viewInvalid');
  }
}

function renderGallery() {
  var d = DV.data;
  var imgs = d.images || [];
  if (d.businessLogo) {
    var logo = $('gLogo');
    logo.src = d.businessLogo; logo.classList.remove('hidden');
  }
  $('gPhotog').textContent = d.photographerName || 'Your photographer';
  $('gTitle').textContent = d.title || 'Gallery';
  $('gMeta').textContent = imgs.length + (imgs.length === 1 ? ' photo' : ' photos');

  var grid = $('grid');
  grid.innerHTML = '';
  imgs.forEach(function (url, i) {
    var c = document.createElement('div');
    c.className = 'cell';
    var img = document.createElement('img');
    img.src = url; img.alt = 'Photo ' + (i + 1); img.loading = 'lazy';
    c.appendChild(img);
    c.onclick = function () { openLb(i); };
    grid.appendChild(c);
  });
  document.title = (d.title || 'Gallery') + ' — Cameras Decoded';
  show('viewGallery');
}

/* View counter: public update restricted by rules to viewCount+1 only.
   Session-guarded so a refresh doesn't double-count. */
function bumpViews() {
  try {
    var key = 'dv_viewed_' + DV.gid;
    if (sessionStorage.getItem(key)) return;
    sessionStorage.setItem(key, '1');
  } catch (e) {}
  var ref = window.db.collection('users').doc(DV.uid).collection('galleries').doc(DV.gid);
  ref.get().then(function (s) {
    if (!s.exists) return;
    var cur = (s.data() || {}).viewCount || 0;
    return ref.update({ viewCount: cur + 1 });
  }).catch(function () {});
}

/* ---------- Lightbox ---------- */
function openLb(i) {
  DV.idx = i;
  syncLb();
  $('lightbox').classList.add('open');
  $('lightbox').setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}
function closeLb() {
  $('lightbox').classList.remove('open');
  $('lightbox').setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}
function syncLb() {
  var imgs = DV.data.images || [];
  if (!imgs.length) return;
  DV.idx = (DV.idx + imgs.length) % imgs.length;
  $('lbImg').src = imgs[DV.idx];
  $('lbCount').textContent = (DV.idx + 1) + ' / ' + imgs.length;
}
$('lbClose').onclick = closeLb;
$('lbPrev').onclick = function (e) { e.stopPropagation(); DV.idx--; syncLb(); };
$('lbNext').onclick = function (e) { e.stopPropagation(); DV.idx++; syncLb(); };
$('lightbox').addEventListener('click', function (e) {
  if (e.target === $('lightbox') || e.target.classList.contains('lb-stage')) closeLb();
});
document.addEventListener('keydown', function (e) {
  if (!$('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') { DV.idx--; syncLb(); }
  if (e.key === 'ArrowRight') { DV.idx++; syncLb(); }
});

/* ---------- Downloads ---------- */
function fileNameFor(i) {
  var base = (DV.data.title || 'gallery').replace(/[^a-z0-9-_]+/gi, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
  return (base || 'gallery') + '-' + (i + 1) + '.jpg';
}
async function downloadUrl(url, name) {
  var res = await fetch(url);
  if (!res.ok) throw new Error('fetch failed');
  var blob = await res.blob();
  var obj = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = obj; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(obj); }, 4000);
}
$('lbDl').onclick = async function () {
  var imgs = DV.data.images || [];
  var url = imgs[DV.idx];
  if (!url) return;
  toast('Downloading…');
  try { await downloadUrl(url, fileNameFor(DV.idx)); }
  catch (e) { window.open(url, '_blank'); }
};
$('dlAllBtn').onclick = async function () {
  var imgs = DV.data.images || [];
  if (!imgs.length) return;
  var btn = $('dlAllBtn');
  btn.disabled = true;
  var st = $('dlStatus');
  var ok = 0;
  for (var i = 0; i < imgs.length; i++) {
    st.textContent = 'Downloading ' + (i + 1) + ' of ' + imgs.length + '…';
    try { await downloadUrl(imgs[i], fileNameFor(i)); ok++; }
    catch (e) { /* keep going */ }
    await new Promise(function (r) { setTimeout(r, 600); });
  }
  st.textContent = ok === imgs.length ? 'All ' + ok + ' downloaded.' : ok + ' of ' + imgs.length + ' downloaded.';
  btn.disabled = false;
  setTimeout(function () { st.textContent = ''; }, 5000);
};

document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
