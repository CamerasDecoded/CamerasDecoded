<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning Module — Cameras Decoded</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="bottom-nav.css" />

  <!-- GSAP for smooth animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    /* ============================================================
       PREMIUM LEARNING MODULE – GLASS‑MORPHISM
       ============================================================ */
    :root {
      --green: #8deb00;
      --green-dim: rgba(141,235,0,0.08);
      --green-glow: rgba(141,235,0,0.2);
      --text-muted: #b4b4b4;
      --bg-panel: rgba(12,12,14,0.92);
      --border-dim: rgba(255,255,255,0.06);
      --card-bg: rgba(12,12,14,0.85);
      --radius: 16px;
      --radius-sm: 10px;
      --transition-smooth: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #08080a;
      background-image:
        radial-gradient(ellipse at 30% 20%, rgba(141,235,0,0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 80%, rgba(141,235,0,0.02) 0%, transparent 50%),
        radial-gradient(rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px;
      background-attachment: fixed;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .module-wrapper {
      position: relative;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 28px 24px 20px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-dim);
      animation: fadeSlide 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    .module-wrapper::before {
      content: '';
      position: absolute;
      inset: -0.5px;
      border-radius: calc(var(--radius) + 0.5px);
      padding: 0.5px;
      background: conic-gradient(from var(--angle), transparent 20%, var(--green) 40%, transparent 60%, var(--green) 80%, transparent 100%);
      -webkit-mask: linear-gradient(black, black) content-box, linear-gradient(black, black) border-box;
      -webkit-mask-composite: xor;
      mask: linear-gradient(black, black) content-box, linear-gradient(black, black) border-box;
      mask-composite: exclude;
      animation: spinBorder 6s linear infinite;
      pointer-events: none;
      z-index: 0;
      opacity: 0.3;
    }

    @keyframes spinBorder {
      to { --angle: 360deg; }
    }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(20px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== HEADER ===== */
    .module-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-dim);
      position: relative;
      z-index: 1;
    }

    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-center { flex: 1; text-align: center; min-width: 0; }
    .header-right { display: flex; align-items: center; gap: 10px; }

    .btn-exit, .btn-help, .btn-restart {
      background: transparent;
      border: 1px solid rgba(141,235,0,0.15);
      color: var(--green);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 15px;
    }
    .btn-exit:hover, .btn-help:hover, .btn-restart:hover {
      background: rgba(141,235,0,0.08);
      border-color: var(--green);
      box-shadow: 0 0 20px rgba(141,235,0,0.1);
    }

    .btn-restart {
      border-color: rgba(224,177,45,0.25);
      color: #e0b12d;
      width: auto;
      padding: 0 14px;
      border-radius: 20px;
      gap: 6px;
      font-size: 12px;
      font-family: 'Space Mono', monospace;
    }
    .btn-restart:hover {
      border-color: #e0b12d;
      background: rgba(224,177,45,0.08);
    }

    .module-title {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      font-family: 'Space Mono', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-bar {
      width: 100%;
      max-width: 300px;
      height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 4px;
      overflow: hidden;
      margin: 6px auto 4px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #1db31b 0%, #c9e265 100%);
      border-radius: 4px;
      width: 0%;
      transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .slide-counter {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'Space Mono', monospace;
      letter-spacing: 0.5px;
    }

    /* ===== SLIDES CONTAINER ===== */
    .slides-container {
      position: relative;
      perspective: 1000px;
      padding: 32px 10px 20px;
      min-height: 380px;
      z-index: 1;
    }

    .slide {
      display: none;
      opacity: 0;
      transform: translateX(100%) rotateY(20deg);
      transition: none;
      min-height: 300px;
      padding: 20px 10px;
      text-align: center;
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
      right: 0;
    }

    .slide.active {
      display: flex;
      flex-direction: column;
      justify-content: center;
      opacity: 1;
      transform: translateX(0) rotateY(0);
      transition: all 0.5s var(--transition-smooth);
      position: relative;
    }

    .slide.exit-left {
      display: flex;
      opacity: 0;
      transform: translateX(-100%) rotateY(-20deg);
      transition: all 0.4s var(--transition-smooth);
    }

    .slide.exit-right {
      display: flex;
      opacity: 0;
      transform: translateX(100%) rotateY(20deg);
      transition: all 0.4s var(--transition-smooth);
    }

    .slide-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    .slide h2 {
      font-size: 30px;
      color: var(--green);
      font-family: 'Space Mono', monospace;
      line-height: 1.2;
    }

    .slide p {
      font-size: 16px;
      color: var(--text-muted);
      line-height: 1.7;
      max-width: 600px;
    }

    .slide img {
      width: 100%;
      max-width: 600px;
      max-height: 320px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-dim);
      margin: 8px auto;
      transition: border-color 0.3s ease;
    }
    .slide img:hover {
      border-color: rgba(141,235,0,0.3);
    }

    .slide iframe {
      width: 100%;
      max-width: 600px;
      height: 315px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-dim);
    }

    /* ===== QUIZ ===== */
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 600px;
      margin-top: 12px;
    }

    .quiz-option {
      padding: 16px 20px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(141,235,0,0.15);
      border-radius: var(--radius-sm);
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 15px;
      font-family: 'Montserrat', sans-serif;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .quiz-option::before {
      content: '';
      width: 22px;
      height: 22px;
      border: 2px solid rgba(141,235,0,0.3);
      border-radius: 50%;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .quiz-option:hover {
      background: rgba(141,235,0,0.06);
      border-color: rgba(141,235,0,0.4);
      transform: translateX(4px);
    }

    .quiz-option.selected::before {
      background: var(--green);
      border-color: var(--green);
      box-shadow: 0 0 20px rgba(141,235,0,0.3);
    }

    .quiz-option.correct {
      background: rgba(76,175,80,0.15);
      border-color: #4CAF50;
      color: #4CAF50;
    }
    .quiz-option.correct::before {
      border-color: #4CAF50;
      background: #4CAF50;
      content: '✓';
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 700;
      font-size: 14px;
    }

    .quiz-option.incorrect {
      background: rgba(244,67,54,0.15);
      border-color: #F44336;
      color: #F44336;
    }
    .quiz-option.incorrect::before {
      border-color: #F44336;
      background: #F44336;
      content: '✕';
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 700;
      font-size: 14px;
    }

    .quiz-explanation {
      margin-top: 16px;
      padding: 16px 20px;
      background: rgba(141,235,0,0.06);
      border: 1px solid rgba(141,235,0,0.12);
      border-radius: var(--radius-sm);
      text-align: left;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      display: none;
      width: 100%;
      max-width: 600px;
      animation: slideDown 0.3s ease;
    }

    .quiz-explanation.show { display: block; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== CAPSTONE ===== */
    .capstone-upload {
      width: 100%;
      max-width: 600px;
      margin-top: 12px;
    }

    .upload-area {
      border: 2px dashed rgba(141,235,0,0.2);
      border-radius: var(--radius-sm);
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(141,235,0,0.02);
    }
    .upload-area:hover {
      border-color: rgba(141,235,0,0.5);
      background: rgba(141,235,0,0.06);
    }
    .upload-area.dragover {
      border-color: var(--green);
      background: rgba(141,235,0,0.1);
      transform: scale(1.02);
    }

    .upload-area i {
      font-size: 40px;
      color: var(--green);
      display: block;
      margin-bottom: 8px;
    }
    .upload-area p {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0;
    }

    .file-input-label {
      padding: 10px 20px;
      background: transparent;
      border: 1px solid var(--green);
      color: var(--green);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      display: inline-block;
      transition: all 0.3s ease;
      margin-top: 10px;
    }
    .file-input-label:hover {
      background: rgba(141,235,0,0.08);
      box-shadow: 0 0 20px rgba(141,235,0,0.1);
    }

    #photoInput, #fileInput { display: none; }

    .preview-image {
      max-width: 200px;
      max-height: 200px;
      margin: 12px auto;
      border-radius: var(--radius-sm);
      border: 2px solid var(--green);
      display: none;
      box-shadow: 0 0 30px rgba(141,235,0,0.15);
    }

    /* ===== FOOTER ===== */
    .slide-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 16px;
      border-top: 1px solid var(--border-dim);
      position: relative;
      z-index: 1;
      flex-wrap: wrap;
    }

    .footer-spacer { flex: 1; }

    .slide-indicators {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .indicator-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .indicator-dot.active {
      background: var(--green);
      width: 28px;
      border-radius: 5px;
      box-shadow: 0 0 12px rgba(141,235,0,0.2);
    }
    .indicator-dot:hover {
      background: rgba(141,235,0,0.4);
    }

    .btn-prev, .btn-next {
      padding: 12px 22px;
      background: transparent;
      border: 1px solid var(--green);
      color: var(--green);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: all 0.3s ease;
      min-width: 100px;
      justify-content: center;
    }
    .btn-prev:hover, .btn-next:hover {
      background: rgba(141,235,0,0.08);
      box-shadow: 0 0 25px rgba(141,235,0,0.08);
      transform: scale(1.02);
    }
    .btn-prev:active, .btn-next:active { transform: scale(0.96); }
    .btn-prev:disabled, .btn-next:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }
    .btn-prev {
      border-color: rgba(255,255,255,0.15);
      color: var(--text-muted);
    }
    .btn-prev:hover {
      border-color: rgba(255,255,255,0.3);
      color: #fff;
    }
    .btn-next .fa-flag-checkered {
      color: #e0b12d;
    }

    /* ===== TOAST ===== */
    #toast-container {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      pointer-events: none;
    }

    .toast {
      background: rgba(10,10,10,0.92);
      border: 1px solid var(--green);
      color: #fff;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      opacity: 0;
      transform: translateY(-10px) scale(0.95);
      transition: all 0.3s ease;
      pointer-events: auto;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateY(0) scale(1); }
    .toast.error { border-color: rgba(255,74,74,0.3); }

    /* ===== MODALS ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius);
      padding: 40px 32px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      transform: scale(0.9) translateY(20px);
      transition: all 0.4s var(--transition-smooth);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .modal-overlay.show .modal-content { transform: scale(1) translateY(0); }

    .modal-celebration { display: flex; flex-direction: column; align-items: center; gap: 12px; }

    .celebration-icon {
      font-size: 64px;
      animation: bounce 0.8s ease infinite;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }

    .modal-content h2 {
      font-size: 28px;
      color: var(--green);
      font-family: 'Space Mono', monospace;
      margin: 0;
    }
    .modal-content p {
      color: var(--text-muted);
      margin: 0;
    }

    .xp-earned {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 16px 20px;
      background: rgba(141,235,0,0.06);
      border: 1px solid rgba(141,235,0,0.12);
      border-radius: var(--radius-sm);
      width: 100%;
    }
    .xp-earned span:first-child {
      font-size: 36px;
      font-weight: 700;
      color: var(--green);
      font-family: 'Space Mono', monospace;
    }
    .xp-earned span:last-child {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .modal-actions { display: flex; gap: 12px; width: 100%; margin-top: 12px; }

    .btn-primary, .btn-secondary {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: var(--green);
      color: #000;
    }
    .btn-primary:hover {
      background: #a0f520;
      box-shadow: 0 0 30px rgba(141,235,0,0.2);
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border-dim);
      color: var(--text-muted);
    }
    .btn-secondary:hover {
      border-color: var(--green);
      color: var(--green);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      body { padding: 12px; }
      .module-wrapper { padding: 20px 16px 16px; border-radius: var(--radius-sm); }
      .module-header { flex-wrap: wrap; gap: 8px; }
      .header-center { order: 1; flex-basis: 100%; }
      .header-left, .header-right { order: 0; }
      .module-title { font-size: 16px; }
      .slides-container { padding: 24px 10px 10px; min-height: 320px; }
      .slide h2 { font-size: 24px; }
      .slide p { font-size: 14px; }
      .slide-footer { flex-wrap: wrap; gap: 10px; }
      .btn-prev, .btn-next { min-width: 80px; padding: 10px 16px; font-size: 12px; }
      .slide-indicators { order: 0; width: 100%; justify-content: center; }
    }

    @media (max-width: 480px) {
      .module-wrapper { padding: 14px 12px 12px; }
      .slide h2 { font-size: 20px; }
      .btn-exit, .btn-help { width: 34px; height: 34px; font-size: 13px; }
      .btn-restart { font-size: 10px; padding: 0 10px; height: 34px; }
      .modal-content { padding: 28px 16px; }
      .celebration-icon { font-size: 48px; }
    }

    /* ===== BOTTOM NAV OFFSET ===== */
    #bottomNavContainer {
      margin-top: 20px;
      width: 100%;
      max-width: 820px;
    }
  </style>
</head>
<body>

  <!-- ===== TOAST ===== -->
  <div id="toast-container"></div>

  <!-- ===== MAIN WRAPPER ===== -->
  <div class="module-wrapper" id="moduleWrapper">

    <!-- ===== HEADER ===== -->
    <header class="module-header">
      <div class="header-left">
        <button class="btn-exit" id="btnExit" title="Exit module">
          <i class="fas fa-arrow-left"></i>
        </button>
      </div>
      <div class="header-center">
        <h1 class="module-title" id="moduleTitle">Loading...</h1>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="slide-counter">Slide <span id="currentSlide">1</span> of <span id="totalSlides">0</span></p>
      </div>
      <div class="header-right">
        <button class="btn-restart" id="btnRestart">
          <i class="fas fa-redo"></i> Restart
        </button>
        <button class="btn-help" id="btnHelp" title="Tips">
          <i class="fas fa-lightbulb"></i>
        </button>
      </div>
    </header>

    <!-- ===== SLIDES ===== -->
    <div class="slides-container" id="slidesContainer">
      <!-- Slides injected by JavaScript -->
    </div>

    <!-- ===== FOOTER ===== -->
    <footer class="slide-footer">
      <button class="btn-prev" id="btnPrev" style="display:none;">
        <i class="fas fa-arrow-left"></i> Back
      </button>
      <div class="footer-spacer"></div>
      <div class="slide-indicators" id="slideIndicators"></div>
      <div class="footer-spacer"></div>
      <button class="btn-next" id="btnNext">Next <i class="fas fa-arrow-right"></i></button>
    </footer>
  </div>

  <!-- ===== BOTTOM NAV CONTAINER ===== -->
  <div id="bottomNavContainer"></div>

  <!-- ===== COMPLETION MODAL ===== -->
  <div class="modal-overlay" id="completionModal">
    <div class="modal-content modal-celebration">
      <div class="celebration-icon">🎉</div>
      <h2>Module Complete!</h2>
      <p id="celebrationText"></p>
      <div class="xp-earned">
        <span id="xpEarnedAmount">+500</span>
        <span>Mastery XP</span>
      </div>
      <div id="badgesEarned" style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:6px 0;"></div>
      <div class="modal-actions">
        <button class="btn-primary" id="continueBtn">Continue Learning</button>
      </div>
    </div>
  </div>

  <!-- ===== CONFIRM MODAL ===== -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-content modal-confirm">
      <h3 id="confirmTitle" style="font-family:'Space Mono',monospace; color:var(--green); font-size:22px;">Exit Module?</h3>
      <p id="confirmMessage" style="color:var(--text-muted); margin-top:8px;">Your progress will be saved.</p>
      <div class="modal-actions">
        <button class="btn-secondary" id="confirmCancel">Cancel</button>
        <button class="btn-primary" id="confirmOk">Exit</button>
      </div>
    </div>
  </div>

  <!-- ===== FIREBASE SDKs ===== -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

  <!-- ===== FIREBASE INIT ===== -->
  <script src="js/firebase-init.js"></script>

  <!-- ===== BOTTOM NAV ===== -->
  <script src="bottom-nav.js"></script>

  <script>
    // ================================================================
    // TOAST
    // ================================================================
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast' + (type === 'error' ? ' error' : '');
      toast.textContent = message;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // ================================================================
    // CONFIRM MODAL
    // ================================================================
    function showConfirm(title, message, onConfirm) {
      const modal = document.getElementById('confirmModal');
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMessage').textContent = message;
      modal.classList.add('show');
      document.getElementById('confirmCancel').onclick = () => modal.classList.remove('show');
      document.getElementById('confirmOk').onclick = () => {
        modal.classList.remove('show');
        onConfirm();
      };
    }

    // ================================================================
    // LEARNING MODULE CLASS
    // ================================================================

    class LearningModule {
      constructor(moduleId, userId) {
        this.moduleId = moduleId;
        this.userId = userId;

        // State
        this.slides = [];
        this.currentSlideIndex = 0;
        this.moduleData = null;
        this.userProgress = null;
        this.quizAnswers = {};
        this.capstonePhotoFile = null;
        this.isCompleting = false;

        // DOM
        this.slidesContainer = document.getElementById('slidesContainer');
        this.progressFill = document.getElementById('progressFill');
        this.currentSlideEl = document.getElementById('currentSlide');
        this.totalSlidesEl = document.getElementById('totalSlides');
        this.btnNext = document.getElementById('btnNext');
        this.btnPrev = document.getElementById('btnPrev');
        this.indicatorsEl = document.getElementById('slideIndicators');
        this.titleEl = document.getElementById('moduleTitle');

        // Bind
        this.nextSlide = this.nextSlide.bind(this);
        this.prevSlide = this.prevSlide.bind(this);
        this.showSlide = this.showSlide.bind(this);
        this.handleKeyDown = this.handleKeyDown.bind(this);

        this.init();
      }

      async init() {
        try {
          await this.loadModuleData();
          await this.loadUserProgress();
          this.renderModule();
          this.attachListeners();
          this.showSlide(this.currentSlideIndex);
          this.updateProgressBar();
          this.updateNavigation();
          this.updateIndicators();
        } catch (err) {
          console.error('Module init error:', err);
          showToast('Failed to load module: ' + err.message, 'error');
        }
      }

      // ---- Load module data ----
      async loadModuleData() {
        const moduleRef = db.collection('modules').doc(this.moduleId);
        const moduleSnap = await moduleRef.get();
        if (!moduleSnap.exists) throw new Error('Module not found');
        this.moduleData = moduleSnap.data();

        const slidesSnap = await moduleRef.collection('slides').orderBy('order').get();
        this.slides = slidesSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        if (this.slides.length === 0) throw new Error('No slides found');
      }

      // ---- Load user progress ----
      async loadUserProgress() {
        const progressRef = db.collection('users')
          .doc(this.userId)
          .collection('learningProgress')
          .doc(this.moduleId);
        const snap = await progressRef.get();

        if (snap.exists) {
          this.userProgress = snap.data();
          this.currentSlideIndex = this.userProgress.currentSlideIndex || 0;
          this.quizAnswers = this.userProgress.quizAnswers || {};
        } else {
          this.userProgress = {
            status: 'in-progress',
            currentSlideIndex: 0,
            startedAt: new Date(),
            completedAt: null,
            quizAnswers: {},
            capstonePhotoUrl: null,
            capstonePhotoFeedback: null,
            xpEarned: 0
          };
          await progressRef.set(this.userProgress);
        }
      }

      // ---- Render ----
      renderModule() {
        this.titleEl.textContent = this.moduleData.metadata?.title || 'Module';
        this.totalSlidesEl.textContent = this.slides.length;

        // Build slides with error handling
        this.slides.forEach((slide, idx) => {
          try {
            const slideEl = this.createSlideElement(slide, idx);
            this.slidesContainer.appendChild(slideEl);
          } catch (err) {
            console.error(`Error rendering slide ${idx}:`, err);
            const fallbackEl = document.createElement('div');
            fallbackEl.className = 'slide slide-error';
            fallbackEl.dataset.slideIndex = idx;
            fallbackEl.innerHTML = `
              <div class="slide-content">
                <h2>⚠️ Error Loading Slide</h2>
                <p style="color: var(--text-muted);">There was a problem loading this slide. Please try again later.</p>
              </div>
            `;
            this.slidesContainer.appendChild(fallbackEl);
          }
        });

        // Build indicators
        this.slides.forEach((_, idx) => {
          const dot = document.createElement('div');
          dot.className = 'indicator-dot' + (idx === 0 ? ' active' : '');
          dot.dataset.index = idx;
          dot.addEventListener('click', () => this.showSlide(idx));
          this.indicatorsEl.appendChild(dot);
        });
      }

      createSlideElement(slide, index) {
        const el = document.createElement('div');
        el.className = `slide slide-${slide.type}`;
        el.dataset.slideIndex = index;
        el.dataset.slideType = slide.type;

        const content = document.createElement('div');
        content.className = 'slide-content';

        try {
          switch (slide.type) {
            case 'intro':
            case 'content':
              content.innerHTML = `<h2>${slide.title || ''}</h2><p>${slide.content || ''}</p>`;
              break;
            case 'image':
              content.innerHTML = `
                <h2>${slide.title || ''}</h2>
                <img src="${slide.imageUrl || ''}" alt="${slide.title || ''}" loading="lazy">
                <p>${slide.content || ''}</p>
              `;
              break;
            case 'video':
              content.innerHTML = `
                <h2>${slide.title || ''}</h2>
                <iframe src="${slide.videoUrl || ''}" allowfullscreen></iframe>
                <p>${slide.content || ''}</p>
              `;
              break;
            case 'quiz':
              content.innerHTML = this.renderQuiz(slide, index);
              break;
            case 'capstone':
              content.innerHTML = this.renderCapstone(slide, index);
              break;
            default:
              content.innerHTML = `<h2>${slide.title || ''}</h2><p>${slide.content || ''}</p>`;
          }
        } catch (err) {
          content.innerHTML = `
            <h2>⚠️ Error Loading Slide</h2>
            <p style="color: var(--text-muted);">There was a problem loading this slide.</p>
          `;
        }

        el.appendChild(content);
        return el;
      }

      renderQuiz(slide, index) {
        const quiz = slide.quiz || {};
        const options = Array.isArray(quiz.options) ? quiz.options : [];

        if (options.length === 0) {
          return `
            <h2>${quiz.question || 'Quiz'}</h2>
            <p style="color: var(--text-muted);">No quiz options available. Please try again later.</p>
          `;
        }

        const optionsHtml = options.map(opt => `
          <button class="quiz-option" data-option-id="${opt.id}" data-slide-index="${index}">
            ${opt.text || ''}
          </button>
        `).join('');

        return `
          <h2>${quiz.question || 'Quiz'}</h2>
          <div class="quiz-options">
            ${optionsHtml}
          </div>
          <div class="quiz-explanation" id="explanation-${index}">
            ${quiz.explanation || ''}
          </div>
        `;
      }

      renderCapstone(slide, index) {
        const capstone = slide.capstone || {};
        return `
          <h2>${slide.title || ''}</h2>
          <p>${capstone.prompt || slide.content || ''}</p>
          <div class="capstone-upload">
            <div class="upload-area" id="uploadArea-${index}">
              <i class="fas fa-cloud-upload-alt"></i>
              <p>Drag and drop your photo here, or click to select</p>
              <label class="file-input-label">Choose File</label>
              <input type="file" id="photoInput-${index}" accept="image/*">
            </div>
            <img id="preview-${index}" class="preview-image">
            <button class="btn-next" id="submitCapstone-${index}" style="display:none; margin-top:12px;">
              Submit Photo
            </button>
          </div>
        `;
      }

      // ---- Show slide ----
      showSlide(index) {
        if (index < 0 || index >= this.slides.length) return;

        const currentEl = this.slidesContainer.querySelector('.slide.active');
        const newEl = this.slidesContainer.querySelector(`.slide[data-slide-index="${index}"]`);
        if (!newEl) return;

        // Animate out current
        if (currentEl) {
          const direction = index > this.currentSlideIndex ? 'exit-left' : 'exit-right';
          currentEl.classList.remove('active');
          currentEl.classList.add(direction);
          setTimeout(() => {
            currentEl.style.display = 'none';
          }, 400);
        }

        // Animate in new
        newEl.style.display = 'flex';
        gsap.set(newEl, {
          opacity: 0,
          x: index > this.currentSlideIndex ? 60 : -60,
          rotationY: index > this.currentSlideIndex ? 15 : -15,
        });
        gsap.to(newEl, {
          opacity: 1,
          x: 0,
          rotationY: 0,
          duration: 0.5,
          ease: 'power3.out',
          onStart: () => {
            newEl.classList.add('active');
          }
        });

        this.currentSlideIndex = index;
        this.currentSlideEl.textContent = index + 1;

        this.updateProgressBar();
        this.updateNavigation();
        this.updateIndicators();
        this.attachSlideListeners(index);
      }

      // ---- Navigation ----
      nextSlide() {
        const slide = this.slides[this.currentSlideIndex];
        // Validate quiz before moving forward
        if (slide.type === 'quiz' && !this.validateQuiz(this.currentSlideIndex)) {
          showToast('Please select an answer', 'error');
          return;
        }
        if (this.currentSlideIndex < this.slides.length - 1) {
          this.showSlide(this.currentSlideIndex + 1);
        } else {
          this.completeModule();
        }
      }

      prevSlide() {
        if (this.currentSlideIndex > 0) {
          this.showSlide(this.currentSlideIndex - 1);
        }
      }

      // ---- Quiz validation ----
      validateQuiz(slideIndex) {
        return this.quizAnswers[slideIndex] !== undefined;
      }

      // ---- Capstone upload ----
      async submitCapstone(slideIndex) {
        if (!this.capstonePhotoFile) {
          showToast('Please select a photo', 'error');
          return;
        }
        try {
          const storageRef = firebase.storage()
            .ref(`capstones/${this.userId}/${this.moduleId}/${Date.now()}_${this.capstonePhotoFile.name}`);
          const snapshot = await storageRef.put(this.capstonePhotoFile);
          const photoUrl = await snapshot.ref.getDownloadURL();

          const progressRef = db.collection('users')
            .doc(this.userId)
            .collection('learningProgress')
            .doc(this.moduleId);
          await progressRef.update({
            capstonePhotoUrl: photoUrl,
            capstoneSubmittedAt: new Date()
          });

          showToast('Photo submitted successfully!');
          this.nextSlide();
        } catch (err) {
          console.error('Capstone upload error:', err);
          showToast('Upload failed: ' + err.message, 'error');
        }
      }

      // ---- Complete module ----
      async completeModule() {
        if (this.isCompleting) return;
        this.isCompleting = true;

        try {
          const xpReward = this.moduleData.metadata?.xpReward || 500;

          const progressRef = db.collection('users')
            .doc(this.userId)
            .collection('learningProgress')
            .doc(this.moduleId);
          await progressRef.update({
            status: 'completed',
            completedAt: new Date(),
            xpEarned: xpReward
          });

          const userRef = db.collection('users').doc(this.userId);
          await userRef.update({
            totalPoints: firebase.firestore.FieldValue.increment(xpReward)
          });

          this.showCompletionModal(xpReward);
        } catch (err) {
          console.error('Completion error:', err);
          showToast('Error completing module: ' + err.message, 'error');
        } finally {
          this.isCompleting = false;
        }
      }

      // ---- UI updates ----
      updateProgressBar() {
        const pct = ((this.currentSlideIndex + 1) / this.slides.length) * 100;
        gsap.to(this.progressFill, {
          width: pct + '%',
          duration: 0.5,
          ease: 'power2.out'
        });
      }

      updateNavigation() {
        this.btnPrev.style.display = this.currentSlideIndex > 0 ? 'flex' : 'none';
        const isLast = this.currentSlideIndex === this.slides.length - 1;
        this.btnNext.innerHTML = isLast
          ? 'Complete <i class="fas fa-flag-checkered"></i>'
          : 'Next <i class="fas fa-arrow-right"></i>';
      }

      updateIndicators() {
        document.querySelectorAll('.indicator-dot').forEach((dot, idx) => {
          dot.classList.toggle('active', idx === this.currentSlideIndex);
        });
      }

      // ---- Event listeners ----
      attachListeners() {
        this.btnNext.addEventListener('click', this.nextSlide);
        this.btnPrev.addEventListener('click', this.prevSlide);
        document.addEventListener('keydown', this.handleKeyDown);

        document.getElementById('btnExit').addEventListener('click', () => {
          showConfirm('Exit Module?', 'Your progress will be saved.', () => {
            window.location.href = 'learning-journey.html';
          });
        });

        document.getElementById('btnRestart').addEventListener('click', () => {
          showConfirm('Restart Module?', 'All progress will be reset.', async () => {
            try {
              const progressRef = db.collection('users')
                .doc(this.userId)
                .collection('learningProgress')
                .doc(this.moduleId);
              await progressRef.set({
                status: 'in-progress',
                currentSlideIndex: 0,
                startedAt: new Date(),
                completedAt: null,
                quizAnswers: {},
                capstonePhotoUrl: null,
                capstonePhotoFeedback: null,
                xpEarned: 0
              }, { merge: true });
              showToast('Module restarted!', 'success');
              setTimeout(() => location.reload(), 1000);
            } catch (err) {
              console.error('Restart error:', err);
              showToast('Error restarting module', 'error');
            }
          });
        });

        document.getElementById('btnHelp').addEventListener('click', () => {
          showToast('💡 Tap "Next" to continue. Complete all slides to earn XP!');
        });

        document.getElementById('continueBtn').addEventListener('click', () => {
          window.location.href = 'learning-journey.html';
        });
      }

      handleKeyDown(e) {
        if (e.key === 'ArrowRight') this.nextSlide();
        if (e.key === 'ArrowLeft') this.prevSlide();
        if (e.key === 'Escape') {
          document.querySelector('.modal-overlay.show')?.classList.remove('show');
        }
      }

      attachSlideListeners(index) {
        const slide = this.slides[index];
        const slideEl = this.slidesContainer.querySelector(`.slide[data-slide-index="${index}"]`);
        if (!slideEl) return;

        if (slide.type === 'quiz') {
          this.attachQuizListeners(index, slideEl);
        } else if (slide.type === 'capstone') {
          this.attachCapstoneListeners(index, slideEl);
        }
      }

      attachQuizListeners(index, slideEl) {
        const options = slideEl.querySelectorAll('.quiz-option');
        const explanation = document.getElementById(`explanation-${index}`);

        options.forEach(opt => {
          opt.addEventListener('click', (e) => {
            const clicked = e.currentTarget;
            options.forEach(o => o.classList.remove('selected', 'correct', 'incorrect'));
            clicked.classList.add('selected');

            const optId = clicked.dataset.optionId;
            this.quizAnswers[index] = optId;

            const slide = this.slides[index];
            const isCorrect = slide.quiz.options.find(o => o.id === optId)?.correct || false;

            if (isCorrect) {
              clicked.classList.add('correct');
            } else {
              clicked.classList.add('incorrect');
              options.forEach(o => {
                const id = o.dataset.optionId;
                if (slide.quiz.options.find(opt => opt.id === id)?.correct) {
                  o.classList.add('correct');
                }
              });
            }

            if (explanation) explanation.classList.add('show');
            this.saveProgress();
          });
        });
      }

      attachCapstoneListeners(index, slideEl) {
        const uploadArea = slideEl.querySelector(`#uploadArea-${index}`);
        const fileInput = slideEl.querySelector(`#photoInput-${index}`);
        const preview = slideEl.querySelector(`#preview-${index}`);
        const submitBtn = slideEl.querySelector(`#submitCapstone-${index}`);

        const handleFile = (file) => {
          if (!file || !file.type.startsWith('image/')) {
            showToast('Please select an image file', 'error');
            return;
          }
          this.capstonePhotoFile = file;
          const reader = new FileReader();
          reader.onload = (e) => {
            preview.src = e.target.result;
            preview.style.display = 'block';
            submitBtn.style.display = 'block';
            gsap.fromTo(preview, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' });
          };
          reader.readAsDataURL(file);
        };

        fileInput.addEventListener('change', (e) => {
          if (e.target.files.length) handleFile(e.target.files[0]);
        });

        uploadArea.addEventListener('dragover', (e) => {
          e.preventDefault();
          uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
          uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
          e.preventDefault();
          uploadArea.classList.remove('dragover');
          if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        uploadArea.querySelector('.file-input-label')?.addEventListener('click', (e) => {
          e.preventDefault();
          fileInput.click();
        });

        submitBtn.addEventListener('click', () => {
          this.submitCapstone(index);
        });
      }

      // ---- Save progress ----
      async saveProgress() {
        try {
          const progressRef = db.collection('users')
            .doc(this.userId)
            .collection('learningProgress')
            .doc(this.moduleId);
          await progressRef.update({
            currentSlideIndex: this.currentSlideIndex,
            quizAnswers: this.quizAnswers,
            updatedAt: new Date()
          });
        } catch (err) {
          console.warn('Save progress error:', err);
        }
      }

      // ---- Completion modal ----
      showCompletionModal(xpReward) {
        const modal = document.getElementById('completionModal');
        document.getElementById('celebrationText').textContent =
          `You've mastered "${this.moduleData.metadata?.title || 'this module'}"!`;
        document.getElementById('xpEarnedAmount').textContent = `+${xpReward}`;

        const badgeContainer = document.getElementById('badgesEarned');
        badgeContainer.innerHTML = '';

        modal.classList.add('show');
        gsap.fromTo(modal, { opacity: 0 }, { opacity: 1, duration: 0.3 });
      }
    }

    // ================================================================
    // INITIALIZE
    // ================================================================

    let learningModule;

    function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const moduleId = urlParams.get('moduleId');

      if (!moduleId) {
        alert('No module specified');
        window.location.href = 'learning-journey.html';
        return;
      }

      firebase.auth().onAuthStateChanged((user) => {
        if (user) {
          learningModule = new LearningModule(moduleId, user.uid);
        } else {
          window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href);
        }
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
