<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning Module — Cameras Decoded</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --green: #8deb00;
      --green-dim: rgba(141,235,0,0.12);
      --text-muted: #b4b4b4;
      --bg-panel: #0A0A0A;
      --border-dim: #1A1A1A;
      --radius: 12px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#050705;
      color:#fff;
      font-family:'Montserrat',sans-serif;
      min-height:100vh;
    }
    h1,h2,h3 { font-family:'Space Mono',monospace; }
    #toast-container {
      position:fixed; top:20px; left:50%; transform:translateX(-50%);
      z-index:9999; display:flex; flex-direction:column; gap:10px; align-items:center; pointer-events:none;
    }
    .toast {
      background:#0A0A0A; border:1px solid var(--green); color:#fff;
      font-family:'Space Mono',monospace; font-size:13px;
      padding:12px 24px; border-radius:8px; opacity:0;
      transform:translateY(-10px) scale(0.95); transition:all 0.3s ease;
    }
    .toast.show { opacity:1; transform:translateY(0) scale(1); }
    .toast.error { border-color:#ff4a4a; }
    .module-wrapper { max-width:900px; margin:0 auto; padding:20px; min-height:100vh; display:flex; flex-direction:column; }
    .module-header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 0 16px; border-bottom:1px solid var(--border-dim); }
    .header-center { flex:1; text-align:center; }
    .btn-exit, .btn-help {
      background:transparent; border:1px solid rgba(141,235,0,0.3); color:var(--green);
      width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;
    }
    .module-title { font-size:18px; }
    .progress-bar { width:100%; max-width:300px; height:4px; background:var(--border-dim); border-radius:4px; overflow:hidden; margin:6px auto 4px; }
    .progress-fill { height:100%; background:linear-gradient(90deg,#1db31b 0%,#c9e265 100%); border-radius:4px; width:0%; transition:width 0.4s ease; }
    .slide-counter { font-size:11px; color:var(--text-muted); font-family:'Space Mono',monospace; }
    .slides-container { flex:1; position:relative; padding:40px 20px 20px; min-height:400px; }
    .slide { display:none; opacity:0; min-height:300px; padding:20px 10px; text-align:center; }
    .slide.active { display:flex; flex-direction:column; justify-content:center; opacity:1; }
    .slide-content { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:16px; width:100%; max-width:700px; margin:0 auto; }
    .slide h2 { font-size:32px; color:var(--green); margin-bottom:10px; }
    .slide p { color:var(--text-muted); line-height:1.6; font-size:15px; }
    .quiz-container { width:100%; text-align:left; margin-top:20px; }
    .quiz-question { font-size:18px; font-weight:600; margin-bottom:20px; color:#fff; }
    .quiz-option {
      background:var(--bg-panel); border:1px solid var(--border-dim); padding:14px 18px;
      border-radius:10px; margin-bottom:12px; cursor:pointer; transition:all 0.2s ease;
      font-size:14px; display:flex; align-items:center; gap:12px;
    }
    .quiz-option:hover { border-color:var(--green); background:rgba(141,235,0,0.06); }
    .quiz-option.selected { border-color:var(--green); background:var(--green-dim); }
    .quiz-option.correct { border-color:#1db31b; background:rgba(29,179,27,0.15); }
    .quiz-option.incorrect { border-color:#ff4a4a; background:rgba(255,74,74,0.12); }
    .quiz-explanation { display:none; background:rgba(141,235,0,0.08); border-left:3px solid var(--green); padding:14px; border-radius:8px; margin-top:16px; font-size:13px; color:#d0d0d0; }
    .quiz-explanation.show { display:block; }
    .nav-controls { display:flex; justify-content:space-between; align-items:center; padding:20px 0; gap:12px; margin-top:auto; }
    .btn-nav { background:transparent; border:1px solid var(--border-dim); color:#fff; padding:12px 22px; border-radius:30px; cursor:pointer; font-family:'Space Mono',monospace; font-size:13px; transition:all 0.2s ease; }
    .btn-nav.primary { background:var(--green); color:#000; border-color:var(--green); font-weight:700; }
    .btn-nav:disabled { opacity:0.4; pointer-events:none; }
    .btn-nav:hover:not(:disabled) { border-color:var(--green); color:var(--green); }
    .btn-nav.primary:hover { background:#a0ff20; }
    .dots { display:flex; gap:8px; }
    .dot { width:10px; height:10px; border-radius:50%; background:var(--border-dim); cursor:pointer; transition:all 0.2s; }
    .dot.active { background:var(--green); width:24px; border-radius:10px; }
    .dot.completed { background:rgba(141,235,0,0.5); }
    .debug { font-family:'Space Mono'; font-size:11px; color:#666; margin-top:10px; }
  </style>
</head>
<body>
  <div id="toast-container"></div>
  <div class="module-wrapper">
    <div class="module-header">
      <button class="btn-exit" id="exitBtn"><i class="fa-solid fa-arrow-left"></i></button>
      <div class="header-center">
        <h1 class="module-title" id="moduleTitle">Loading...</h1>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="slide-counter" id="slideCounter">0 / 0</div>
      </div>
      <button class="btn-help"><i class="fa-solid fa-question"></i></button>
    </div>
    <div class="slides-container" id="slidesContainer">
      <div style="text-align:center; padding:60px; color:#666;">Loading slides...</div>
    </div>
    <div class="nav-controls">
      <button class="btn-nav" id="prevBtn">← Previous</button>
      <div class="dots" id="dotsContainer"></div>
      <button class="btn-nav primary" id="nextBtn">Next →</button>
    </div>
    <div class="debug" id="debugInfo"></div>
  </div>

  <script>
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyB95Vx0i8W6WNfUy1N4TNQyfN5xCxQYnz8",
  authDomain: "cameras-decoded.firebaseapp.com",
  projectId: "cameras-decoded",
  storageBucket: "cameras-decoded.firebasestorage.app",
  messagingSenderId: "1088920052790",
  appId: "1:1088920052790:web:2177c1fb31109c1fa02497",
  measurementId: "G-YN3M01WW0B"
};
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function showToast(msg, type='') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = msg;
      container.appendChild(toast);
      requestAnimationFrame(()=> toast.classList.add('show'));
      setTimeout(()=> {
        toast.classList.remove('show');
        setTimeout(()=> toast.remove(), 300);
      }, 3000);
    }

    class LearningModule {
      constructor(moduleId, userId) {
        this.moduleId = moduleId;
        this.userId = userId;
        this.slides = [];
        this.currentSlideIndex = 0;
        this.quizAnswers = {};
        this.moduleData = null;

        this.slidesContainer = document.getElementById('slidesContainer');
        this.progressFill = document.getElementById('progressFill');
        this.slideCounter = document.getElementById('slideCounter');
        this.dotsContainer = document.getElementById('dotsContainer');
        this.debugInfo = document.getElementById('debugInfo');
        this.moduleTitleEl = document.getElementById('moduleTitle');

        this.init();
      }

      async init() {
        document.getElementById('prevBtn').addEventListener('click', () => this.prevSlide());
        document.getElementById('nextBtn').addEventListener('click', () => this.nextSlide());
        document.getElementById('exitBtn').addEventListener('click', () => window.location.href = 'learning-journey.html');
        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowRight') this.nextSlide();
          if (e.key === 'ArrowLeft') this.prevSlide();
        });

        await this.loadModuleData();
      }

      async loadModuleData() {
        try {
          const moduleRef = db.collection('modules').doc(this.moduleId);
          const moduleSnap = await moduleRef.get();
          if (!moduleSnap.exists) throw new Error(`Module ${this.moduleId} not found`);

          this.moduleData = moduleSnap.data();
          const metadata = this.moduleData.metadata || this.moduleData;
          this.moduleTitleEl.textContent = metadata.title || this.moduleId;

          // FIX: Get slides WITHOUT orderBy so docs without order field are not excluded
          const slidesSnap = await moduleRef.collection('slides').get();
          
          if (slidesSnap.empty) throw new Error('No slides found in subcollection');

          this.slides = slidesSnap.docs.map(doc => {
            const data = doc.data();
            // Normalize: your slide-4 stores quiz at top level, others may have nested structure
            return {
              id: doc.id,
              order: data.order ?? (parseInt(doc.id.split('-')[1]) || 999),
              type: data.type || (data.quiz ? 'quiz' : 'content'),
              title: data.title || '',
              content: data.content || data.description || '',
              quiz: data.quiz || (data.question ? data : null),
              ...data
            };
          }).sort((a,b) => a.order - b.order);

          this.debugInfo.textContent = `Firestore: loaded ${this.slides.length} docs -> ${this.slides.map(s=>s.id + '(' + (s.order||'?') + ')').join(', ')}`;

          if (this.slides.length === 0) throw new Error('Slides array empty after parsing');

          this.renderSlides(); // <-- now defined!
          this.renderDots();
          this.showSlide(0);

        } catch (err) {
          console.error(err);
          showToast(`Failed to load module: ${err.message}`, 'error');
          this.slidesContainer.innerHTML = `<div style="padding:40px; text-align:center;"><h3 style="color:#ff4a4a;">${err.message}</h3><p style="color:#888; margin-top:10px;">Check console. Common fix: add <code>order</code> field to slide-4 (order: 4) and <code>type: "quiz"</code></p><pre style="text-align:left; background:#111; padding:12px; border-radius:8px; margin-top:16px; font-size:11px; overflow:auto;">${err.stack||err}</pre></div>`;
        }
      }

      renderSlides() {
        this.slidesContainer.innerHTML = '';
        this.slides.forEach((slide, index) => {
          const slideEl = document.createElement('div');
          slideEl.className = 'slide';
          slideEl.dataset.slideIndex = index;

          let inner = `<div class="slide-content">`;

          if (slide.type === 'quiz' || slide.quiz) {
            const quiz = slide.quiz || slide;
            inner += `<h2>${slide.title || 'Quiz Time'}</h2>`;
            inner += `<div class="quiz-container">`;
            inner += `<div class="quiz-question">${quiz.question || 'Quiz question missing'}</div>`;
            const options = quiz.options || [];
            options.forEach(opt => {
              inner += `<div class="quiz-option" data-option-id="${opt.id}" data-slide="${index}">
                <span style="width:22px;height:22px;border:1px solid #333;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;">${opt.id.replace('opt_','').toUpperCase()}</span>
                <span>${opt.text}</span>
              </div>`;
            });
            inner += `<div class="quiz-explanation" id="explanation-${index}">${quiz.explanation || ''}</div>`;
            inner += `</div>`;
          } else {
            inner += `<h2>${slide.title || `Slide ${index+1}`}</h2>`;
            inner += `<p>${slide.content || slide.description || 'No content'}</p>`;
            if (slide.image) inner += `<img src="${slide.image}" style="max-width:100%;border-radius:12px;margin-top:16px;" />`;
          }

          inner += `</div>`;
          slideEl.innerHTML = inner;
          this.slidesContainer.appendChild(slideEl);
        });

        // Attach quiz listeners AFTER DOM created
        this.slides.forEach((slide, index) => {
          if (slide.type === 'quiz' || slide.quiz) {
            this.attachQuizListeners(index);
          }
        });
      }

      renderDots() {
        this.dotsContainer.innerHTML = '';
        this.slides.forEach((_, i) => {
          const dot = document.createElement('div');
          dot.className = 'dot';
          if (i === this.currentSlideIndex) dot.classList.add('active');
          dot.addEventListener('click', () => this.showSlide(i));
          this.dotsContainer.appendChild(dot);
        });
      }

      attachQuizListeners(index) {
        const slideEl = this.slidesContainer.querySelector(`.slide[data-slide-index="${index}"]`);
        if (!slideEl) return;
        const options = slideEl.querySelectorAll('.quiz-option');
        const explanation = document.getElementById(`explanation-${index}`);
        const slide = this.slides[index];
        const quiz = slide.quiz || slide;

        options.forEach(opt => {
          opt.addEventListener('click', (e) => {
            const clicked = e.currentTarget; // FIX: use currentTarget not target
            options.forEach(o => o.classList.remove('selected','correct','incorrect'));
            clicked.classList.add('selected');
            const optId = clicked.dataset.optionId;
            this.quizAnswers[index] = optId;

            const isCorrect = quiz.options.find(o => o.id === optId)?.correct;
            if (isCorrect) {
              clicked.classList.add('correct');
              showToast('Correct! You can continue →');
            } else {
              clicked.classList.add('incorrect');
              options.forEach(o => {
                if (quiz.options.find(q => q.id === o.dataset.optionId)?.correct) {
                  o.classList.add('correct');
                }
              });
              showToast('Not quite, check the correct answer');
            }

            if (explanation) explanation.classList.add('show');
            this.updateNavButtons();
            this.saveProgress();
          });
        });
      }

      showSlide(index) {
        if (index < 0 || index >= this.slides.length) return;
        const all = this.slidesContainer.querySelectorAll('.slide');
        all.forEach(s => s.classList.remove('active'));
        const target = this.slidesContainer.querySelector(`.slide[data-slide-index="${index}"]`);
        if (target) target.classList.add('active');

        this.currentSlideIndex = index;
        this.updateProgress();
        this.renderDots();
        this.updateNavButtons();
        
        gsap.fromTo(target, { opacity:0, y:10 }, { opacity:1, y:0, duration:0.3 });
      }

      nextSlide() {
        const currentSlide = this.slides[this.currentSlideIndex];
        // Gate: if current is quiz, require answer
        if ((currentSlide.type === 'quiz' || currentSlide.quiz) && !this.quizAnswers[this.currentSlideIndex]) {
          showToast('Please answer the quiz to continue', 'error');
          return;
        }
        if (this.currentSlideIndex < this.slides.length - 1) {
          this.showSlide(this.currentSlideIndex + 1);
        } else {
          showToast(`Module complete! +${this.moduleData.metadata?.xpReward || 500} XP`);
        }
      }

      prevSlide() {
        if (this.currentSlideIndex > 0) this.showSlide(this.currentSlideIndex - 1);
      }

      updateProgress() {
        const total = this.slides.length;
        const current = this.currentSlideIndex + 1;
        const pct = (current / total) * 100;
        this.progressFill.style.width = pct + '%';
        this.slideCounter.textContent = `${current} / ${total}`;
      }

      updateNavButtons() {
        document.getElementById('prevBtn').disabled = this.currentSlideIndex === 0;
        const nextBtn = document.getElementById('nextBtn');
        if (this.currentSlideIndex === this.slides.length - 1) {
          nextBtn.textContent = 'Finish';
        } else {
          nextBtn.textContent = 'Next →';
        }
      }

      async saveProgress() {
        if (!this.userId) return;
        try {
          const ref = db.collection('users').doc(this.userId).collection('learningProgress').doc(this.moduleId);
          await ref.set({
            currentSlideIndex: this.currentSlideIndex,
            quizAnswers: this.quizAnswers,
            updatedAt: new Date()
          }, { merge: true });
        } catch (e) { console.warn('saveProgress', e); }
      }
    }

    // INIT
    function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const moduleId = urlParams.get('moduleId') || 'golden-hour-portraits';

      // Replace with real auth if you have it, otherwise demo mode
      firebase.auth().onAuthStateChanged((user) => {
        const uid = user ? user.uid : 'demo-user';
        new LearningModule(moduleId, uid);
      });
      
      // If auth not configured, still run
      setTimeout(() => {
        if (!window.learningModuleInstance) {
          // fallback if auth never fires
          // new LearningModule(moduleId, 'demo-user');
        }
      }, 1500);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
