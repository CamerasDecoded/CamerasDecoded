  <meta name="description" content="Everything happening on Cameras Decoded: Arena entries, winners, milestones, and community activity." />

  <style>
:root{
  --green:#8deb00;
  --green-soft:rgba(141,235,0,.12);
  --green-border:rgba(141,235,0,.35);
  --bg:#070807;
  --surface:#0e0f0e;
  --surface-2:#121312;
  --text:#ffffff;
  --muted:#a9b8a2;
  --muted-2:#6f7d68;
  --border:rgba(255,255,255,.09);
  --border-strong:rgba(255,255,255,.17);
  --gold:#f5c044;
  --ease:cubic-bezier(.22,1,.36,1);
  --font-d:'Space Mono',monospace;
  --font-b:'Montserrat',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{display:block !important;justify-content:normal !important;align-items:normal !important;
  padding:0 !important;padding-top:calc(env(safe-area-inset-top,0px) + 80px) !important;
  background:var(--bg);color:var(--text);font-family:var(--font-b);min-height:100dvh}
.feed-wrap{max-width:640px;margin:0 auto;padding:16px 16px 120px}
.feed-title{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.feed-title img{height:32px}
.feed-title h1{font-family:var(--font-d);font-size:18px;letter-spacing:.08em}
.feed-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:16px;margin-bottom:12px;animation:fadeUp .4s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.feed-card-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.feed-avatar{width:36px;height:36px;border-radius:50%;background:var(--surface-2);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-d);font-size:14px;color:var(--green);flex-shrink:0;overflow:hidden}
.feed-avatar img{width:100%;height:100%;object-fit:cover}
.feed-meta{flex:1;min-width:0}
.feed-actor{font-weight:700;font-size:14px}
.feed-time{font-family:var(--font-d);font-size:11px;color:var(--muted-2)}
.feed-type{font-family:var(--font-d);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--green);border:1px solid var(--green-border);border-radius:6px;padding:3px 8px;
  background:var(--green-soft);flex-shrink:0}
.feed-type.winner{color:var(--gold);border-color:rgba(245,192,68,.35);background:rgba(245,192,68,.12)}
.feed-text{font-size:14px;line-height:1.5;color:var(--text);margin-bottom:10px}
.feed-image{width:100%;border-radius:12px;margin-bottom:10px;display:block;background:var(--surface-2)}
.feed-action{display:inline-block;font-family:var(--font-d);font-size:12px;color:var(--green);
  text-decoration:none;border:1px solid var(--green-border);border-radius:8px;padding:8px 14px;
  background:var(--green-soft)}
/* editorial cards */
.feed-card.editorial{border-color:rgba(141,235,0,.2);background:linear-gradient(135deg,var(--surface),#0c120a)}
.ed-title{font-size:17px;font-weight:800;line-height:1.3;margin-bottom:6px}
.ed-excerpt{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:10px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ed-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ed-cta{display:inline-block;font-family:var(--font-d);font-size:12px;color:#0a0a0a;
  background:var(--green);text-decoration:none;border-radius:8px;padding:10px 18px;font-weight:700}
/* spotlight */
.feed-card.spotlight{border-color:rgba(245,192,68,.3);background:linear-gradient(135deg,var(--surface),#141007)}
.spot-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.spot-avatar{width:52px;height:52px;border-radius:50%;background:var(--surface-2);
  border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-d);font-size:20px;color:var(--gold);flex-shrink:0;overflow:hidden}
.spot-avatar img{width:100%;height:100%;object-fit:cover}
.spot-name{font-weight:800;font-size:16px}
.spot-label{font-family:var(--font-d);font-size:10px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
.feed-empty{text-align:center;padding:60px 20px;color:var(--muted)}
.filter-tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding:10px 4px;
--jr-green:var(--green,#8deb00)}
.jelly-chip{flex-shrink:0;font-family:var(--font-d);font-size:11px;letter-spacing:.06em;
background:var(--surface);border:1px solid var(--border);color:var(--muted);
border-radius:20px;padding:8px 16px;cursor:pointer;transform-origin:center;
transition:transform .45s cubic-bezier(.34,1.56,.64,1),background-color .25s,color .25s,border-color .25s;
will-change:transform;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.jelly-chip.active{background:var(--green-soft);border-color:var(--green-border);color:var(--green)}
@media(prefers-reduced-motion:reduce){.jelly-chip{transition:none}}
.composer{background:var(--surface);border:1px solid var(--border);border-radius:16px;
padding:14px;margin-bottom:16px}
.composer textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);
border-radius:10px;color:var(--text);font-family:var(--font-b);font-size:14px;
padding:12px;min-height:60px;resize:vertical;margin-bottom:10px}
.composer button{background:var(--green);border:none;color:#0a0a0a;border-radius:8px;
padding:10px 20px;font-family:var(--font-d);font-size:12px;font-weight:700;cursor:pointer}
.feed-empty .big{font-size:40px;margin-bottom:12px}
.feed-loading{text-align:center;padding:40px;color:var(--muted-2);font-family:var(--font-d);font-size:13px}
@media(min-width:768px){.feed-wrap{padding-top:24px}}
  </style>
</head>
<body>
  <div class="feed-wrap">
    <div class="feed-title">
      <img src="/custom-site-titles/feed.png?v=20261011a" alt="Feed"
        onerror="this.style.display='none';this.nextElementSibling.hidden=false;" />
      <h1 hidden>FEED</h1>
    </div>
    <div class="filter-tabs" id="filterTabs" role="radiogroup" aria-label="Feed filters">
      <button class="jelly-chip active" data-f="all" role="radio" aria-checked="true">All</button>
      <button class="jelly-chip" data-f="arena" role="radio" aria-checked="false">Arena</button>
      <button class="jelly-chip" data-f="clubs" role="radio" aria-checked="false">Clubs</button>
      <button class="jelly-chip" data-f="ideas" role="radio" aria-checked="false">Ideas</button>
      <button class="jelly-chip" data-f="milestones" role="radio" aria-checked="false">Milestones</button>
      <button class="jelly-chip" data-f="content" role="radio" aria-checked="false">Articles</button>
    </div>
    <div class="composer" id="composer" style="display:none">
      <textarea id="composerText" maxlength="300" placeholder="Share something with the community…"></textarea>
      <button id="composerPost">Post</button>
    </div>
    <div id="feedList"><div class="feed-loading">Loading the signal…</div></div>
  </div>

<script>
(function(){
const feedList = document.getElementById('feedList');
const TYPE_LABELS = { arena_entry:'Arena Entry', arena_winner:'Winner', xp_milestone:'Milestone', club_post:'Club', suggestion:'Idea', post:'Post', blog_post:'Article', protocol:'Protocol', podcast:'Podcast', featured_operator:'Spotlight' };

function timeAgo(ts) {
  if (!ts) return '';
  const ms = ts.toMillis ? ts.toMillis() : (ts.seconds * 1000);
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

let activeFilter = 'all';
const FILTER_TYPES = {
  all: null,
  arena: ['arena_entry','arena_winner'],
  clubs: ['club_post'],
  ideas: ['suggestion'],
  milestones: ['xp_milestone'],
  content: ['blog_post','protocol','podcast']
};
/* JellyRadio filter chips: selected swells, neighbors barge outward with stagger */
(function(){
  var tabs = document.getElementById('filterTabs');
  var chips = Array.prototype.slice.call(tabs.querySelectorAll('.jelly-chip'));
  var SWELL = 0.18, SHRINK = 0.04, BARGE = 7, STAGGER = 28;
  function jellyTo(sel){
    chips.forEach(function(chip, i){
      var on = (i === sel);
      var far = Math.abs(i - sel);
      var dir = Math.sign(i - sel);
      var s = on ? 1 + SWELL : 1 - SHRINK;
      var x = dir * BARGE * (on ? 0 : 1);
      // stagger: farther chips animate slightly later
      chip.style.transitionDelay = (far * STAGGER) + 'ms';
      // jelly squash: scale y lags x for organic feel
      chip.style.transform = 'translateX(' + x + 'px) scale(' + s + ',' + (on ? s * 0.96 : s) + ')';
      chip.classList.toggle('active', on);
      chip.setAttribute('aria-checked', on ? 'true' : 'false');
    });
    // clear stagger delays after animation settles
    setTimeout(function(){
      chips.forEach(function(c){ c.style.transitionDelay = '0ms'; });
    }, 600);
  }
  // set initial jelly state (All selected)
  jellyTo(0);
  tabs.addEventListener('click', function(e){
    var b = e.target.closest('.jelly-chip');
    if(!b) return;
    var idx = chips.indexOf(b);
    if(idx < 0) return;
    jellyTo(idx);
    activeFilter = b.dataset.f;
    loadFeed();
  });
  // keyboard: arrows move selection
  tabs.addEventListener('keydown', function(e){
    var cur = chips.findIndex(function(c){ return c.classList.contains('active'); });
    var next = -1;
    if(e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (cur + 1) % chips.length;
    else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (cur - 1 + chips.length) % chips.length;
    else if(e.key === 'Home') next = 0;
    else if(e.key === 'End') next = chips.length - 1;
    if(next < 0) return;
    e.preventDefault();
    chips[next].focus();
    jellyTo(next);
    activeFilter = chips[next].dataset.f;
    loadFeed();
  });
})();
/* composer */
function updateComposer(){
  const u = (typeof firebase!=='undefined'&&firebase.apps&&firebase.apps.length)
    ? firebase.auth().currentUser : null;
  document.getElementById('composer').style.display = u ? 'block' : 'none';
}
document.getElementById('composerPost').onclick = async function(){
  const text = document.getElementById('composerText').value.trim();
  if(!text) return;
  const u = firebase.auth().currentUser;
  if(!u) return;
  const userName = (window.USER&&window.USER.name)||u.displayName||'Operator';
  try{
    await firebase.firestore().collection('feedItems').add({
      type: 'post', actorUid: u.uid, actorName: userName, text: text,
      targetType: 'profile', targetId: u.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      visibility: 'public'
    });
    document.getElementById('composerText').value = '';
    activeFilter = 'all';
    document.querySelectorAll('.filter-tab').forEach(function(t){
      t.classList.toggle('active', t.dataset.f==='all');
    });
    loadFeed();
  }catch(e){}
};
async function loadFeed() {
  try {
    if (typeof firebase === 'undefined' || !firebase.apps || !firebase.apps.length) {
      feedList.innerHTML = '<div class="feed-empty"><div>Could not load the feed.</div></div>';
      return;
    }
    updateComposer();
    const db = firebase.firestore();
    const snap = await db.collection('feedItems').orderBy('createdAt','desc').limit(50).get();
    feedList.innerHTML = '';
    const types = FILTER_TYPES[activeFilter];
    /* slot ranking: featured first, then interleave editorial every 4th */
    const items = [];
    snap.forEach(doc => {
      const d = doc.data(); d._id = doc.id;
      if(types && !types.includes(d.type)) return;
      items.push(d);
    });
    const featured = items.filter(d => d.type === 'featured_operator');
    const editorial = items.filter(d => ['blog_post','protocol','podcast'].includes(d.type));
    const social = items.filter(d => !['featured_operator','blog_post','protocol','podcast'].includes(d.type));
    const ordered = [...featured];
    let ei = 0;
    social.forEach((d, i) => {
      ordered.push(d);
      if((i+1) % 4 === 0 && ei < editorial.length) ordered.push(editorial[ei++]);
    });
    while(ei < editorial.length) ordered.push(editorial[ei++]);

    let shown = 0;
    const frag = document.createDocumentFragment();
    ordered.forEach(d => {
      shown++;
      frag.appendChild(renderCard(d));
    });

    function renderCard(d){
      const el = document.createElement('div');
      /* editorial: title-forward */
      if(['blog_post','protocol','podcast'].includes(d.type)){
        el.className = 'feed-card editorial';
        el.innerHTML =
          `<div class="ed-meta"><div class="feed-type">${esc(TYPE_LABELS[d.type]||d.type)}</div>`+
          `<div class="feed-time">${timeAgo(d.createdAt)}</div></div>`+
          (d.title ? `<div class="ed-title">${esc(d.title)}</div>` : '')+
          (d.text ? `<div class="ed-excerpt">${esc(d.text)}</div>` : '')+
          (d.imageUrl ? `<img class="feed-image" src="${esc(d.imageUrl)}" loading="lazy" alt=""/>` : '')+
          (d.actionUrl ? `<a class="ed-cta" href="${esc(d.actionUrl)}">${esc(d.actionLabel||'Read')}</a>` : '');
        return el;
      }
      /* spotlight: profile-forward */
      if(d.type === 'featured_operator'){
        el.className = 'feed-card spotlight';
        const av = d.actorAvatar ? `<img src="${esc(d.actorAvatar)}" alt=""/>` : esc((d.actorName||'?')[0].toUpperCase());
        el.innerHTML =
          `<div class="spot-head"><div class="spot-avatar">${av}</div>`+
          `<div><div class="spot-label">Featured Operator</div>`+
          `<div class="spot-name">${esc(d.actorName||'Operator')}</div></div></div>`+
          (d.text ? `<div class="feed-text">${esc(d.text)}</div>` : '')+
          (d.imageUrl ? `<img class="feed-image" src="${esc(d.imageUrl)}" loading="lazy" alt=""/>` : '')+
          (d.actionUrl ? `<a class="feed-action" href="${esc(d.actionUrl)}">${esc(d.actionLabel||'View Profile')}</a>` : '');
        return el;
      }
      /* social: default */
      el.className = 'feed-card';
      const typeCls = d.type === 'arena_winner' ? 'feed-type winner' : 'feed-type';
      const avatarHtml = d.actorAvatar ? `<img src="${esc(d.actorAvatar)}" alt=""/>` : esc((d.actorName||'?')[0].toUpperCase());
      el.innerHTML =
        `<div class="feed-card-header">` +
          `<div class="feed-avatar">${avatarHtml}</div>` +
          `<div class="feed-meta"><div class="feed-actor">${esc(d.actorName||'Operator')}</div>` +
          `<div class="feed-time">${timeAgo(d.createdAt)}</div></div>` +
          `<div class="${typeCls}">${esc(TYPE_LABELS[d.type]||d.type)}</div>` +
        `</div>` +
        (d.text ? `<div class="feed-text">${esc(d.text)}</div>` : '') +
        (d.imageUrl ? `<img class="feed-image" src="${esc(d.imageUrl)}" loading="lazy" alt=""/>` : '') +
        (d.actionUrl ? `<a class="feed-action" href="${esc(d.actionUrl)}">${esc(d.actionLabel||'View')}</a>` : '');
      return el;
    }
    if (shown === 0) {
      const msg = activeFilter === 'all'
        ? 'Nothing here yet.<br/>Enter the Arena or hit a milestone to light up the feed.'
        : 'Nothing in this view yet.';
      feedList.innerHTML = '<div class="feed-empty"><div class="big">◌</div><div>'+msg+'</div></div>';
      return;
    }
    feedList.appendChild(frag);
  } catch(e) {
    feedList.innerHTML = '<div class="feed-empty"><div>Could not load the feed.</div></div>';
  }
}
loadFeed();
})();
</script>
<script src="/scripts/ptr.js?v=20261001a"></script>
</body>
