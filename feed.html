<script>
(function(){
const feedList = document.getElementById('feedList');
const TYPE_LABELS = { arena_entry:'Arena Entry', arena_winner:'Winner', xp_milestone:'Milestone', club_post:'Club', suggestion:'Idea', post:'Post', blog_post:'Article', protocol:'Protocol', podcast:'Podcast', featured_operator:'Spotlight' };

function timeAgo(ts) {
  if (!ts) return '';
  const ms = ts.toMillis ? ts.toMillis() : (ts.seconds * 1000);
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function dec(s){ const t=document.createElement('textarea'); t.innerHTML=s||''; return t.value; }
const FLASH_ICON = '<svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>';
const SHARE_ICON = '<svg viewBox="0 0 24 24"><path d="M4 12v8a1 1 0 001 1h14a1 1 0 001-1v-8M16 6l-4-4-4 4M12 2v13"/></svg>';
const COMMENT_ICON = '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>';
const TRASH_ICON = '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0v14a2 2 0 01-2 2H8a2 2 0 01-2-2V6M10 11v6M14 11v6"/></svg>';


let activeFilter = 'all';
const FILTER_TYPES = {
  all: null,
  arena: ['arena_entry','arena_winner'],
  clubs: ['club_post'],
  ideas: ['suggestion'],
  milestones: ['xp_milestone'],
  content: ['blog_post','protocol','podcast']
};
/* JellyRadio filter chips: selected swells, neighbors barge outward with stagger */
(function(){
  var tabs = document.getElementById('filterTabs');
  var chips = Array.prototype.slice.call(tabs.querySelectorAll('.jelly-chip'));
  var SWELL = 0.18, SHRINK = 0.04, BARGE = 7, STAGGER = 28;
  function jellyTo(sel){
    chips.forEach(function(chip, i){
      var on = (i === sel);
      var far = Math.abs(i - sel);
      var dir = Math.sign(i - sel);
      var s = on ? 1 + SWELL : 1 - SHRINK;
      var x = dir * BARGE * (on ? 0 : 1);
      // stagger: farther chips animate slightly later
      chip.style.transitionDelay = (far * STAGGER) + 'ms';
      // jelly squash: scale y lags x for organic feel
      chip.style.transform = 'translateX(' + x + 'px) scale(' + s + ',' + (on ? s * 0.96 : s) + ')';
      chip.classList.toggle('active', on);
      chip.setAttribute('aria-checked', on ? 'true' : 'false');
    });
    // clear stagger delays after animation settles
    setTimeout(function(){
      chips.forEach(function(c){ c.style.transitionDelay = '0ms'; });
    }, 600);
  }
  // set initial jelly state (All selected)
  jellyTo(0);
  tabs.addEventListener('click', function(e){
    var b = e.target.closest('.jelly-chip');
    if(!b) return;
    var idx = chips.indexOf(b);
    if(idx < 0) return;
    jellyTo(idx);
    activeFilter = b.dataset.f;
    loadFeed();
  });
  // keyboard: arrows move selection
  tabs.addEventListener('keydown', function(e){
    var cur = chips.findIndex(function(c){ return c.classList.contains('active'); });
    var next = -1;
    if(e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (cur + 1) % chips.length;
    else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (cur - 1 + chips.length) % chips.length;
    else if(e.key === 'Home') next = 0;
    else if(e.key === 'End') next = chips.length - 1;
    if(next < 0) return;
    e.preventDefault();
    chips[next].focus();
    jellyTo(next);
    activeFilter = chips[next].dataset.f;
    loadFeed();
  });
})();
/* composer */
function updateComposer(){
  const u = (typeof firebase!=='undefined'&&firebase.apps&&firebase.apps.length)
    ? firebase.auth().currentUser : null;
  document.getElementById('composer').style.display = u ? 'block' : 'none';
}
// Re-check when auth resolves (fixes composer hidden on launch)
if(typeof firebase!=='undefined'&&firebase.apps&&firebase.apps.length){
  firebase.auth().onAuthStateChanged(function(){ updateComposer(); loadFlashStates(); loadFeed(); });
} else {
  // firebase not ready yet, retry shortly
  setTimeout(function(){
    if(typeof firebase!=='undefined'&&firebase.apps&&firebase.apps.length){
      firebase.auth().onAuthStateChanged(function(){ updateComposer(); loadFlashStates(); loadFeed(); });
      updateComposer();
    }
  }, 2000);
}
/* composer: text + image upload via CDUpload (Cloudinary) */
let composerImageUrls = [];
document.getElementById('composerImageBtn').onclick = function(){
  document.getElementById('composerFile').click();
};
document.getElementById('composerFile').onchange = async function(e){
  const files = Array.prototype.slice.call(e.target.files || []);
  if(!files.length) return;
  const btn = document.getElementById('composerImageBtn');
  for(let i = 0; i < files.length && composerImageUrls.length < 5; i++){
    btn.textContent = 'Uploading ' + (i+1) + '/' + Math.min(files.length, 5) + '…';
    try{
      const up = await window.CDUpload.upload(files[i]);
      if(up && up.url) composerImageUrls.push(up.url);
    }catch(err){}
  }
  if(composerImageUrls.length){
    document.getElementById('composerPreviewImg').src = composerImageUrls[0];
    document.getElementById('composerPreview').style.display = 'block';
    // show count if multiple
    btn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg> ' + composerImageUrls.length + ' photo' + (composerImageUrls.length>1?'s':'');
  } else {
    btn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg> Photo';
  }
};
document.getElementById('composerPreviewX').onclick = function(){
  composerImageUrls = [];
  document.getElementById('composerPreview').style.display = 'none';
  document.getElementById('composerFile').value = '';
  document.getElementById('composerImageBtn').innerHTML = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg> Photo';
};
function getActorAvatar(){
  const u = firebase.auth().currentUser;
  if(!u) return null;
  return (window.USER && window.USER.avatar) || u.photoURL || null;
}
document.getElementById('composerPost').onclick = async function(){
  const text = document.getElementById('composerText').value.trim();
  if(!text && !composerImageUrls.length) return;
  const u = firebase.auth().currentUser;
  if(!u) return;
  const userName = (window.USER&&window.USER.name)||u.displayName||'Operator';
  const btn = document.getElementById('composerPost');
  btn.querySelector('span').textContent = 'Posting…'; btn.disabled = true;
  try{
    const doc = {
      type: 'post', actorUid: u.uid, actorName: userName, text: text,
      targetType: 'profile', targetId: u.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      visibility: 'public'
    };
    const av = getActorAvatar();
    if(av) doc.actorAvatar = av;
    if(composerImageUrls.length === 1) doc.imageUrl = composerImageUrls[0];
    else if(composerImageUrls.length > 1) doc.imageUrls = composerImageUrls;
    await firebase.firestore().collection('feedItems').add(doc);
    document.getElementById('composerText').value = '';
    composerImageUrls = [];
    document.getElementById('composerPreview').style.display = 'none';
    document.getElementById('composerFile').value = '';
    document.getElementById('composerImageBtn').innerHTML = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg> Photo';
    // reset filter to all
    activeFilter = 'all';
    document.querySelectorAll('.jelly-chip').forEach(function(t,i){
      t.classList.toggle('active', i===0);
    });
    loadFeed();
  }catch(e){}
  btn.querySelector('span').textContent = 'Post'; btn.disabled = false;
};
async function loadFeed() {
  try {
    if (typeof firebase === 'undefined' || !firebase.apps || !firebase.apps.length) {
      feedList.innerHTML = '<div class="feed-empty"><div>Could not load the feed.</div></div>';
      return;
    }
    updateComposer();
    const db = firebase.firestore();
    const snap = await db.collection('feedItems').orderBy('createdAt','desc').limit(50).get();
    feedList.innerHTML = '';
    const types = FILTER_TYPES[activeFilter];
    /* time-aware interleave: the slot ranking (featured first, social first,
       editorial woven every 4th) applies only WITHIN each Chicago day —
       nothing ever crosses a day boundary. Days run newest first. */
    const items = [];
    snap.forEach(doc => {
      const d = doc.data(); d._id = doc.id;
      if(types && !types.includes(d.type)) return;
      items.push(d);
    });
    function dayKey(d){
      const t = d.createdAt && d.createdAt.toDate ? d.createdAt.toDate() : null;
      if(!t || isNaN(t.getTime())) return '9999-12-31';
      return t.toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
    }
    const byDay = new Map();
    items.forEach(d => {
      const k = dayKey(d);
      if(!byDay.has(k)) byDay.set(k, []);
      byDay.get(k).push(d);
    });
    const ordered = [];
    Array.from(byDay.keys()).sort().reverse().forEach(k => {
      const dayItems = byDay.get(k);
      const featured = dayItems.filter(d => d.type === 'featured_operator');
      const editorial = dayItems.filter(d => ['blog_post','protocol','podcast'].includes(d.type));
      const social = dayItems.filter(d => !['featured_operator','blog_post','protocol','podcast'].includes(d.type));
      ordered.push(...featured);
      let ei = 0;
      social.forEach((d, i) => {
        ordered.push(d);
        if((i+1) % 4 === 0 && ei < editorial.length) ordered.push(editorial[ei++]);
      });
      while(ei < editorial.length) ordered.push(editorial[ei++]);
    });

    let shown = 0;
    const frag = document.createDocumentFragment();
    ordered.forEach(d => {
      shown++;
      frag.appendChild(renderCard(d));
    });

    /* --- carousel: auto-advancing multi-image --- */
    function carouselHTML(urls){
      if(!urls || !urls.length) return '';
      if(urls.length === 1) return `<img class="feed-image" src="${esc(urls[0])}" loading="lazy" alt=""/>`;
      const slides = urls.map(u => `<div class="carousel-slide"><img src="${esc(u)}" loading="lazy" alt=""/></div>`).join('');
      const dots = urls.map((_,i) => `<div class="carousel-dot${i===0?' on':''}"></div>`).join('');
      return `<div class="carousel" data-carousel>` +
        `<div class="carousel-track">${slides}</div>` +
        `<div class="carousel-dots">${dots}</div>` +
        `<div class="carousel-count">1/${urls.length}</div>` +
      `</div>`;
    }
    function getImageUrls(d){
      if(Array.isArray(d.imageUrls) && d.imageUrls.length) return d.imageUrls;
      if(d.imageUrl) return [d.imageUrl];
      return [];
    }
    function initCarousels(root){
      root.querySelectorAll('[data-carousel]').forEach(function(car){
        if(car._init) return; car._init = true;
        const track = car.querySelector('.carousel-track');
        const dots = Array.prototype.slice.call(car.querySelectorAll('.carousel-dot'));
        const count = car.querySelector('.carousel-count');
        const n = dots.length;
        let idx = 0, timer = null, paused = false;
        function go(i){
          idx = (i + n) % n;
          track.style.transform = 'translateX(-' + (idx*100) + '%)';
          dots.forEach(function(dt,k){ dt.classList.toggle('on', k===idx); });
          if(count) count.textContent = (idx+1) + '/' + n;
        }
        function auto(){
          if(paused) return;
          timer = setTimeout(function(){ go(idx+1); auto(); }, 4000);
        }
        function stopAuto(){ if(timer){ clearTimeout(timer); timer = null; } }
        // pause on touch, resume after
        let tx0 = 0;
        car.addEventListener('touchstart', function(e){
          tx0 = e.touches[0].clientX; paused = true; stopAuto();
        }, {passive:true});
        car.addEventListener('touchend', function(e){
          const dx = e.changedTouches[0].clientX - tx0;
          if(Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1));
          setTimeout(function(){ paused = false; auto(); }, 3000);
        }, {passive:true});
        // dots clickable
        dots.forEach(function(dt,k){ dt.addEventListener('click', function(){ stopAuto(); go(k); auto(); }); });
        // pause when offscreen
        if('IntersectionObserver' in window){
          new IntersectionObserver(function(es){
            es.forEach(function(en){
              if(en.isIntersecting){ if(!paused && !timer) auto(); }
              else stopAuto();
            });
          }, {threshold:.3}).observe(car);
        } else { auto(); }
      });
    }
    /* --- feed interactions: reactions, comments, share --- */
    function actionBarHTML(d){
      const fc = d.flashCount || 0;
      const me = (typeof firebase !== 'undefined' && firebase.auth && firebase.auth().currentUser) || null;
      const delBtn = (me && d.actorUid === me.uid && ['post','club_post','suggestion'].includes(d.type))
        ? `<button class="feed-act feed-del" data-act="delete" data-id="${d._id}">${TRASH_ICON}<span class="del-label">Delete</span></button>` : '';
      return `<div class="feed-actions">` +
        `<button class="feed-act" data-act="flash" data-id="${d._id}">${FLASH_ICON}<span class="cnt" data-flash-cnt="${d._id}">${fc||''}</span><span>Flash</span></button>` +
        `<button class="feed-act" data-act="comment" data-id="${d._id}">${COMMENT_ICON}<span>Comment</span></button>` +
        `<button class="feed-act" data-act="share" data-id="${d._id}">${SHARE_ICON}<span>Share</span></button>` +
        delBtn +
      `</div>` +
      `<div class="comments" data-comments="${d._id}"></div>`;
    }
    async function doFlash(itemId, btn){
      const u = firebase.auth().currentUser;
      if(!u) return;
      const db = firebase.firestore();
      const ref = db.collection('feedItems').doc(itemId).collection('reactions').doc(u.uid);
      const cntEl = document.querySelector(`[data-flash-cnt="${itemId}"]`);
      try{
        const existing = await ref.get();
        if(existing.exists){
          await ref.delete();
          btn.classList.remove('loved');
          if(cntEl){ const n = parseInt(cntEl.textContent||'0')-1; cntEl.textContent = n>0?n:''; }
        } else {
          await ref.set({ type:'flash', createdAt: firebase.firestore.FieldValue.serverTimestamp() });
          btn.classList.add('loved');
          btn.classList.remove('anim-flash'); void btn.offsetWidth;
          btn.classList.add('anim-flash');
          setTimeout(()=>btn.classList.remove('anim-flash'), 600);
          if(cntEl){ const n = parseInt(cntEl.textContent||'0')+1; cntEl.textContent = n; }
        }
      }catch(e){}
    }
    async function loadFlashStates(){
      const u = firebase.auth().currentUser;
      if(!u) return;
      const db = firebase.firestore();
      document.querySelectorAll('[data-act="flash"]').forEach(async function(btn){
        const itemId = btn.dataset.id;
        try{
          // check if I flashed
          const mine = await db.collection('feedItems').doc(itemId).collection('reactions').doc(u.uid).get();
          if(mine.exists) btn.classList.add('loved');
          // count total
          const snap = await db.collection('feedItems').doc(itemId).collection('reactions').get();
          const cntEl = document.querySelector(`[data-flash-cnt="${itemId}"]`);
          if(cntEl && snap.size) cntEl.textContent = snap.size;
        }catch(e){}
      });
    }
    async function toggleComments(itemId, btn){
      const box = document.querySelector(`[data-comments="${itemId}"]`);
      if(btn){ btn.classList.remove('anim-comment'); void btn.offsetWidth; btn.classList.add('anim-comment');
        setTimeout(()=>btn.classList.remove('anim-comment'), 450); }
      if(box.classList.contains('open')){ box.classList.remove('open'); return; }
      const db = firebase.firestore();
      const u = firebase.auth().currentUser;
      box.classList.add('open');
      box.innerHTML = '<div class="feed-loading" style="padding:16px">Loading…</div>';
      try{
        const snap = await db.collection('feedItems').doc(itemId).collection('comments')
          .orderBy('createdAt','asc').limit(20).get();
        let h = '';
        snap.forEach(doc => {
          const c = doc.data();
          const av = c.actorAvatar ? `<img src="${esc(c.actorAvatar)}" alt=""/>` : esc((c.actorName||'?')[0].toUpperCase());
          h += `<div class="comment"><div class="comment-av">${av}</div>` +
            `<div class="comment-body"><div class="comment-name">${esc(c.actorName||'Operator')}</div>` +
            `<div class="comment-text">${esc(c.text||'')}</div>` +
            `<div class="comment-time">${timeAgo(c.createdAt)}</div></div></div>`;
        });
        if(u){
          h += `<div class="comment-form"><input type="text" placeholder="Write a comment…" data-cinput="${itemId}" maxlength="300"/>` +
            `<button data-csend="${itemId}">Send</button></div>`;
        }
        box.innerHTML = h || '<div style="color:var(--muted-2);font-size:12px">No comments yet.</div>';
      }catch(e){
        box.innerHTML = '<div style="color:var(--muted-2);font-size:12px">Could not load comments.</div>';
      }
    }
    async function sendComment(itemId){
      const input = document.querySelector(`[data-cinput="${itemId}"]`);
      const text = input ? input.value.trim() : '';
      if(!text) return;
      const u = firebase.auth().currentUser;
      if(!u) return;
      const userName = (window.USER&&window.USER.name)||u.displayName||'Operator';
      try{
        const doc = { actorUid: u.uid, actorName: userName, text: text,
          createdAt: firebase.firestore.FieldValue.serverTimestamp() };
        const av = getActorAvatar();
        if(av) doc.actorAvatar = av;
        await firebase.firestore().collection('feedItems').doc(itemId).collection('comments').add(doc);
        toggleComments(itemId); // close
        setTimeout(() => toggleComments(itemId), 100); // reopen
      }catch(e){}
    }
    async function deleteFeedItem(itemId){
      const db = firebase.firestore();
      const ref = db.collection('feedItems').doc(itemId);
      for(const sub of ['comments','reactions']){
        const snap = await ref.collection(sub).get();
        let batch = db.batch(); let n = 0;
        for(const doc of snap.docs){
          batch.delete(doc.ref); n++;
          if(n === 450){ await batch.commit(); batch = db.batch(); n = 0; }
        }
        if(n) await batch.commit();
      }
      await ref.delete();
    }
    async function handleDelete(btn, itemId, card){
      const label = btn.querySelector('.del-label');
      if(!btn.dataset.armed){
        btn.dataset.armed = '1';
        btn.classList.add('armed');
        if(label) label.textContent = 'Confirm?';
        setTimeout(() => {
          delete btn.dataset.armed;
          btn.classList.remove('armed');
          if(label) label.textContent = 'Delete';
        }, 3500);
        return;
      }
      btn.disabled = true;
      if(label) label.textContent = 'Deleting…';
      try{
        await deleteFeedItem(itemId);
        if(card){ card.classList.add('removing'); setTimeout(() => card.remove(), 260); }
      }catch(err){
        btn.disabled = false;
        delete btn.dataset.armed;
        btn.classList.remove('armed');
        if(label){ label.textContent = 'Failed — retry'; setTimeout(() => { label.textContent = 'Delete'; }, 2500); }
      }
    }
    async function sharePost(itemId, d, btn){
      if(btn){ btn.classList.remove('anim-share'); void btn.offsetWidth; btn.classList.add('anim-share');
        setTimeout(()=>btn.classList.remove('anim-share'), 450); }
      const url = 'https://camerasdecoded.com/feed.html#' + itemId;
      const title = d.title || 'Cameras Decoded Feed';
      const text = d.text ? d.text.substring(0, 100) : title;
      if(navigator.share){
        try{ await navigator.share({ title: title, text: text, url: url }); }catch(e){}
      } else if(navigator.clipboard){
        try{ await navigator.clipboard.writeText(url); }catch(e){}
      }
    }
    // delegate action bar clicks
    feedList.addEventListener('click', function(e){
      const act = e.target.closest('[data-act]');
      if(act){
        const itemId = act.dataset.id;
        const card = act.closest('.feed-card');
        // find the data object - stored on element
        const d = card && card._feedData;
        if(act.dataset.act === 'flash') doFlash(itemId, act);
        else if(act.dataset.act === 'comment') toggleComments(itemId, act);
        else if(act.dataset.act === 'share' && d) sharePost(itemId, d, act);
        else if(act.dataset.act === 'delete') handleDelete(act, itemId, card);
        return;
      }
      const cs = e.target.closest('[data-csend]');
      if(cs){ sendComment(cs.dataset.csend); return; }
    });
    feedList.addEventListener('keypress', function(e){
      if(e.key === 'Enter'){
        const inp = e.target.closest('[data-cinput]');
        if(inp) sendComment(inp.dataset.cinput);
      }
    });

    function renderCard(d){
      const el = document.createElement('div');
      /* editorial: title-forward */
      if(['blog_post','protocol','podcast'].includes(d.type)){
        el.className = 'feed-card editorial';
        el.innerHTML =
          `<div class="ed-meta">${d.type === 'blog_post' ? '' : `<div class="feed-type">${esc(TYPE_LABELS[d.type]||d.type)}</div>`}`+
          `<div class="feed-time">${timeAgo(d.createdAt)}</div></div>`+
          (d.title ? `<div class="ed-title">${esc(dec(d.title))}</div>` : '')+
          (d.text ? `<div class="ed-excerpt">${esc(d.text)}</div>` : '')+
          carouselHTML(getImageUrls(d))+
          (d.actionUrl ? `<a class="ed-cta" href="${esc(d.actionUrl)}">${esc(d.actionLabel||'Read')}</a>` : '')+
          actionBarHTML(d);
        el._feedData = d;
        return el;
      }
      /* spotlight: profile-forward */
      if(d.type === 'featured_operator'){
        el.className = 'feed-card spotlight';
        const av = d.actorAvatar ? `<img src="${esc(d.actorAvatar)}" alt=""/>` : esc((d.actorName||'?')[0].toUpperCase());
        el.innerHTML =
          `<div class="spot-head"><div class="spot-avatar">${av}</div>`+
          `<div><div class="spot-label">Featured Operator</div>`+
          `<div class="spot-name">${esc(d.actorName||'Operator')}</div></div></div>`+
          (d.text ? `<div class="feed-text">${esc(d.text)}</div>` : '')+
          carouselHTML(getImageUrls(d))+
          (d.actionUrl ? `<a class="feed-action" href="${esc(d.actionUrl)}">${esc(d.actionLabel||'View Profile')}</a>` : '')+
          actionBarHTML(d);
        el._feedData = d;
        return el;
      }
      /* social: default */
      el.className = 'feed-card';
      const typeCls = d.type === 'arena_winner' ? 'feed-type winner' : 'feed-type';
      const avatarHtml = d.actorAvatar ? `<img src="${esc(d.actorAvatar)}" alt=""/>` : esc((d.actorName||'?')[0].toUpperCase());
      el.innerHTML =
        `<div class="feed-card-header">` +
          `<div class="feed-avatar">${avatarHtml}</div>` +
          `<div class="feed-meta"><div class="feed-actor">${esc(d.actorName||'Operator')}</div>` +
          `<div class="feed-time">${timeAgo(d.createdAt)}</div></div>` +
          (d.type === 'post' ? '' : `<div class="${typeCls}">${esc(TYPE_LABELS[d.type]||d.type)}</div>`) +
        `</div>` +
        (d.text ? `<div class="feed-text">${esc(d.text)}</div>` : '') +
        carouselHTML(getImageUrls(d)) +
        (d.actionUrl ? `<a class="feed-action" href="${esc(d.actionUrl)}">${esc(d.actionLabel||'View')}</a>` : '')+
        actionBarHTML(d);
      el._feedData = d;
      return el;
    }
    if (shown === 0) {
      const msg = activeFilter === 'all'
        ? 'Nothing here yet.<br/>Enter the Arena or hit a milestone to light up the feed.'
        : 'Nothing in this view yet.';
      feedList.innerHTML = '<div class="feed-empty"><div class="big">◌</div><div>'+msg+'</div></div>';
      return;
    }
    feedList.appendChild(frag);
    loadFlashStates();
    initCarousels(feedList);
  } catch(e) {
    feedList.innerHTML = '<div class="feed-empty"><div>Could not load the feed.</div></div>';
  }
}
loadFeed();
})();
</script>
