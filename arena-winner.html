<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena Winner — Cameras Decoded</title>
  <meta name="description" content="One crowned shot, judged blind by other photographers. The winning photo, the photographer who took it, and the field it beat — from the Cameras Decoded Arena.">
  <meta property="og:title" content="Arena Winner — Cameras Decoded">
  <meta property="og:description" content="Judged blind. Proven nightly. The crowned shot from the Cameras Decoded Arena, and the field it beat.">
  <meta property="og:image" content="https://camerasdecoded.com/og-image.jpg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://camerasdecoded.com/arena-winner.html">

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/scripts/master-loader.js?v=20261110a"></script>

  <style>
    :root {
      --green: #8deb00;
      --green-hi: #a0f520;
      --gold: #e0b12d;
      --ink: #08080a;
      --line: rgba(255,255,255,0.08);
      --line-green: rgba(141,235,0,0.18);
      --text-dim: #b4b4b4;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Body-layout guard: design-system.css loads later via master-loader and
       forces flex centering + 20px padding; this page claims its own layout. */
    body {
      display: block !important;
      justify-content: normal !important;
      align-items: normal !important;
      padding: 0 !important;
      background-color: var(--ink);
      background-image:
        radial-gradient(ellipse at 30% 20%, rgba(141, 235, 0, 0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 80%, rgba(141, 235, 0, 0.02) 0%, transparent 50%),
        radial-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      position: relative;
    }
    h1, h2, h3, .mono { font-family: 'Space Mono', monospace; }
    a { text-decoration: none; color: inherit; }

    .main-content {
      max-width: 880px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 0px) + 80px) 20px 120px;
      position: relative;
      z-index: 1;
      animation: fadeIn 0.5s ease-in-out forwards;
    }
    @keyframes fadeIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }

    .back-link { display: inline-block; margin-bottom: 22px; font-family: 'Space Mono', monospace; font-size: 14px; color: var(--green); }
    .back-link:hover { color: var(--green-hi); }

    .aw-kicker { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 2.5px; color: var(--green); text-transform: uppercase; margin-bottom: 10px; }
    .aw-title-img { display: block; width: min(430px, 100%); height: auto; }
    #awTitleFb { font-size: 38px; line-height: 1.15; background: linear-gradient(90deg, #1db31b 0%, #c9e265 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .aw-round-title { font-size: 24px; line-height: 1.3; margin-top: 14px; color: #ffffff; }
    .aw-date { color: var(--text-dim); font-size: 14px; margin-top: 6px; font-family: 'Space Mono', monospace; }

    .aw-status { margin-top: 28px; border: 1px solid var(--line); border-radius: 16px; padding: 26px 22px; background: rgba(12,12,14,0.6); }
    .aw-status .big { display: block; font-family: 'Space Mono', monospace; font-size: 19px; margin-bottom: 8px; }
    .aw-status p { color: var(--text-dim); font-size: 15px; }

    .aw-hero { margin-top: 26px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line-green); background: #0c0c0e; box-shadow: 0 12px 40px rgba(0,0,0,0.45); position: relative; }
    .aw-hero img { width: 100%; display: block; aspect-ratio: 4/3; object-fit: cover; }
    .aw-hero-ph { aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--text-dim); font-family: 'Space Mono', monospace; font-size: 15px; }

    .aw-winner { margin-top: 22px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .aw-winner img.av { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 2px solid var(--green); }
    .aw-winner .who { min-width: 0; }
    .aw-winner .name { font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 700; }
    .aw-winner .sub { color: var(--text-dim); font-size: 14px; }
    .aw-winner .sub .gold { color: var(--gold); font-weight: 700; }

    /* The book card: the crown flows straight into the booking action.
       Rendered only when the winner's public profile carries booking info. */
    .aw-book {
      margin-top: 24px;
      border: 1px solid var(--line-green);
      border-radius: 16px;
      padding: 22px;
      background: linear-gradient(180deg, rgba(141,235,0,0.06) 0%, rgba(12,12,14,0.6) 55%);
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    .aw-book h3 { color: var(--green); font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; }
    .aw-book .biz { font-size: 17px; font-weight: 600; color: #ffffff; }
    .aw-book .where { color: var(--text-dim); font-size: 14px; margin-top: 2px; }
    .aw-book .proof { color: var(--text-dim); font-size: 14px; margin-top: 12px; }
    .aw-book .proof .gold { color: var(--gold); font-weight: 700; }
    .aw-book .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
    .aw-book .socials { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .aw-book .socials a { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--green); }

    .aw-brief { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 24px; }
    .aw-brief h3 { color: var(--green); font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
    .aw-brief p { color: #d8d8d8; font-size: 16px; }

    .aw-field { margin-top: 30px; }
    .aw-field h3 { color: var(--green); font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 14px; }
    .aw-field-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .aw-shot { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #0c0c0e; }
    .aw-shot img { width: 100%; display: block; aspect-ratio: 1/1; object-fit: cover; }
    .aw-shot .ph { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; color: #555; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1px; }
    .aw-shot .nm { display: block; padding: 8px 10px; font-size: 12.5px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .aw-media { display: block; }
    @media (max-width: 560px) { .aw-field-grid { grid-template-columns: repeat(2, 1fr); } }

    /* The crown moment: plays once per crown, only while the crown is fresh
       (72 hours), first view only. One loud thing, then the page is calm. */
    .crown-fresh .aw-hero::after { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0; transform: translateX(-130%) skewX(-12deg); background: linear-gradient(100deg, transparent 30%, rgba(224,177,45,0.16) 44%, rgba(255,255,255,0.30) 50%, rgba(141,235,0,0.14) 56%, transparent 70%); animation: cdCrownSweep 1.7s cubic-bezier(0.22, 0.61, 0.36, 1) 0.3s both; }
    @keyframes cdCrownSweep { 0% { opacity: 0; transform: translateX(-130%) skewX(-12deg); } 12% { opacity: 1; } 82% { opacity: 1; } 100% { opacity: 0; transform: translateX(130%) skewX(-12deg); } }
    .crown-fresh .aw-winner { animation: cdCrownGlow 2.4s ease-in-out 0.25s both; }
    @keyframes cdCrownGlow { 0% { box-shadow: 0 0 0 rgba(224,177,45,0); } 35% { box-shadow: 0 0 0 1px rgba(224,177,45,0.55), 0 0 38px rgba(224,177,45,0.30); } 100% { box-shadow: 0 0 0 rgba(224,177,45,0); } }
    .aw-crownmark { display: block; width: 40px; height: auto; margin-bottom: 10px; }
    .crown-fresh .aw-crownmark { animation: cdCrownPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.35s both; }
    @keyframes cdCrownPop { 0% { opacity: 0; transform: scale(0.55) translateY(6px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .crown-fresh .aw-hero::after, .crown-fresh .aw-winner, .crown-fresh .aw-crownmark { animation: none; }
      .crown-fresh .aw-hero::after { opacity: 0; }
    }
    .aw-doors { margin-top: 34px; display: flex; gap: 12px; flex-wrap: wrap; }
    .btn-solid { padding: 14px 26px; border: none; border-radius: 10px; background: var(--green); color: #000; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 15px; cursor: pointer; display: inline-block; transition: 0.2s; }
    .btn-solid:hover { background: var(--green-hi); box-shadow: 0 0 20px rgba(141,235,0,0.5); }
    .btn-ghost { padding: 14px 26px; border: 1px solid var(--line-green); border-radius: 10px; background: rgba(12,12,14,0.6); color: var(--green); font-family: 'Space Mono', monospace; font-weight: 700; font-size: 15px; cursor: pointer; display: inline-block; transition: 0.2s; }
    .btn-ghost:hover { border-color: var(--green); }
  </style>
</head>
<body>
  <main class="main-content">
    <a class="back-link" href="/arena-winners.html">&larr; All crowns</a>
    <p class="aw-kicker" id="awKicker">The Arena</p>
    <h1><img class="aw-title-img" src="/custom-site-titles/arena-winner.png?v=20261111a" alt="Arena Winner" onerror="this.style.display='none';document.getElementById('awTitleFb').style.display=''"><span id="awTitleFb" style="display:none">Arena Winner</span></h1>
    <h2 class="aw-round-title" id="awRoundTitle">Loading the crown&hellip;</h2>
    <p class="aw-date" id="awDate"></p>
    <div id="awBody">
      <div class="aw-status"><span class="big">One moment</span><p>Reading the round record — the winning shot, its photographer, and the field it beat.</p></div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/scripts/firebase-init.js?v=20261007b"></script>
  <script>
    (function () {
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function ts(v) { return v && v.toMillis ? v.toMillis() : (typeof v === 'number' ? v : null); }
      function fmtDate(ms) {
        if (!ms) return '';
        try {
          return new Date(ms).toLocaleDateString('en-US', { timeZone: 'America/Chicago', weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        } catch (e) { return ''; }
      }
      function fmtShortDate(ms) {
        if (!ms) return '';
        try {
          return new Date(ms).toLocaleDateString('en-US', { timeZone: 'America/Chicago', month: 'short', day: 'numeric' });
        } catch (e) { return ''; }
      }
      function bizNormUrl(u) {
        u = (u || '').trim();
        if (!u) return '';
        return /^https?:\/\//i.test(u) ? u : 'https://' + u;
      }
      /* The book card: business info from the winner's public profile.
         Returns '' when the winner has no booking info on record, so old
         crowns render exactly as before. */
      function bizCardHtml(biz, name, round) {
        if (!biz) return '';
        var soc = biz.socials || {};
        var hasAny = !!(biz.location || biz.craft || (biz.categories && biz.categories.length) ||
          biz.availability || biz.bookingLink || soc.instagram || soc.website);
        if (!hasAny) return '';
        var first = String(name || 'An operator').split(' ')[0] || 'An operator';
        var line = '';
        var cats = Array.isArray(biz.categories) ? biz.categories.filter(Boolean) : [];
        if (cats.length) line = cats.join(' \u00b7 ');
        else if (biz.craft) line = biz.craft === 'video' ? 'Videographer' : biz.craft === 'hybrid' ? 'Photo + video' : 'Photographer';
        var sub = [];
        if (biz.location) sub.push(biz.location);
        if (biz.availability === 'open') sub.push('Booking now');
        else if (biz.availability === 'booked') sub.push('Currently booked');
        var crownDate = fmtShortDate(ts(round.closesAt));
        var html = '<section class="aw-book"><h3>Work with ' + esc(first) + '</h3>';
        if (line) html += '<p class="biz">' + esc(line) + '</p>';
        if (sub.length) html += '<p class="where">' + esc(sub.join(' \u00b7 ')) + '</p>';
        html += '<p class="proof">Crowned in the Arena' + (crownDate ? ', ' + esc(crownDate) : '') +
          ' — judged best <span class="gold">blind</span>, by other photographers.</p>';
        html += '<div class="actions">';
        if (biz.bookingLink) html += '<a class="btn-solid" href="' + esc(bizNormUrl(biz.bookingLink)) + '" target="_blank" rel="noopener">Book a shoot</a>';
        html += '<a class="btn-ghost" href="/profile.html?u=' + esc(round.winnerUid) + '">View profile</a>';
        html += '</div>';
        var links = [];
        if (soc.instagram) {
          var ig = String(soc.instagram).trim();
          var igUrl = /^https?:\/\//i.test(ig) ? ig : 'https://instagram.com/' + ig.replace(/^@/, '');
          links.push('<a href="' + esc(igUrl) + '" target="_blank" rel="noopener">Instagram</a>');
        }
        if (soc.website) links.push('<a href="' + esc(bizNormUrl(soc.website)) + '" target="_blank" rel="noopener">Website</a>');
        if (links.length) html += '<div class="socials">' + links.join('') + '</div>';
        html += '</section>';
        return html;
      }
      /* The round's clock is the source of truth for its phase — the same
         derivation the Arena page uses. */
      function phaseOf(round) {
        var now = Date.now();
        var closesAt = ts(round.closesAt), votingAt = ts(round.votingAt), opensAt = ts(round.opensAt);
        if (closesAt && now >= closesAt) return 'closed';
        if (votingAt && now >= votingAt) return 'voting';
        if (opensAt && now >= opensAt) return 'open';
        return round.state || 'open';
      }
      var body = document.getElementById('awBody');
      function status(big, text, doors) {
        body.innerHTML = '<div class="aw-status"><span class="big">' + esc(big) + '</span><p>' + esc(text) + '</p>' +
          (doors ? '<div class="aw-doors">' + doors + '</div>' : '') + '</div>';
      }
      var DOORS = '<a class="btn-solid" href="/missions.html">Enter tonight&rsquo;s round</a>' +
                  '<a class="btn-ghost" href="/arena-winners.html">See all crowns</a>';

      /* The crown moment gate: fresh crown (closed within 72 hours), first
         view of this crown on this device. Sets the seen-flag before playing,
         so a refresh mid-sweep never replays it. */
      function maybeCelebrate(round) {
        var closes = ts(round.closesAt);
        if (!closes) return;
        var age = Date.now() - closes;
        if (age < 0 || age > 72 * 3600 * 1000) return;
        var key = 'cd_crown_seen_' + roundId;
        try {
          if (localStorage.getItem(key)) return;
          localStorage.setItem(key, '1');
        } catch (e) { return; }
        var main = document.querySelector('.main-content');
        if (!main) return;
        main.classList.add('crown-fresh');
        var who = main.querySelector('.aw-winner .who');
        if (who) {
          var ns = 'http://www.w3.org/2000/svg';
          var svg = document.createElementNS(ns, 'svg');
          svg.setAttribute('viewBox', '0 0 24 24');
          svg.setAttribute('class', 'aw-crownmark');
          svg.setAttribute('aria-hidden', 'true');
          var path = document.createElementNS(ns, 'path');
          path.setAttribute('d', 'M3 18 L1.8 7.5 L7.5 11 L12 4.5 L16.5 11 L22.2 7.5 L21 18 Z');
          path.setAttribute('fill', '#e0b12d');
          var bar = document.createElementNS(ns, 'rect');
          bar.setAttribute('x', '3'); bar.setAttribute('y', '19.4');
          bar.setAttribute('width', '18'); bar.setAttribute('height', '1.9');
          bar.setAttribute('rx', '0.95'); bar.setAttribute('fill', '#e0b12d');
          svg.appendChild(path); svg.appendChild(bar);
          who.insertBefore(svg, who.firstChild);
        }
      }
      var roundId = new URLSearchParams(window.location.search).get('round') || '';
      var tries = 0;
      function arm() {
        var ok = typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length && window.db;
        if (!ok) { if (tries++ < 50) setTimeout(arm, 100); return; }
        load(window.db);
      }
      function load(db) {
        if (!roundId) {
          status('No round named', 'This page is one night&rsquo;s crown. Pick a night from the wall of crowns.', DOORS);
          return;
        }
        db.collection('arenaRounds').doc(roundId).get().then(function (snap) {
          if (!snap.exists) {
            status('That round is not on record', 'The link may be mistyped, or the round predates the Arena records. Every crowned night is on the wall.', DOORS);
            return;
          }
          var round = snap.data() || {};
          render(db, round);
        }).catch(function () {
          status('Could not load the round', 'Check your connection and reload — the crown record stays put.', DOORS);
        });
      }
      function render(db, round) {
        var lane = round.lane === 'mission' ? 'Weekly Mission' : 'Daily Challenge';
        document.getElementById('awKicker').textContent = 'The Arena · ' + lane;
        document.getElementById('awRoundTitle').textContent = round.title || 'Untitled round';
        document.getElementById('awDate').textContent = fmtDate(ts(round.closesAt));
        var phase = phaseOf(round);
        if (phase !== 'closed') {
          status('Not crowned yet',
            'This round is still running. Voting closes and the crown lands at 11 PM CST — the winner appears on this page the moment it does.',
            DOORS);
          return;
        }
        if (!round.winnerUid) {
          if (round.state !== 'closed') {
            status('Results are being tallied',
              'The round has closed and the votes are being counted. The crown lands here shortly — check back in a few minutes.',
              DOORS);
          } else {
            status('No crown this night',
              'Nobody entered this round, so there is no winner to show. The next round is already open.',
              DOORS);
          }
          return;
        }
        var winnerEntryId = round.winnerEntryId;
        var jobs = [
          db.collection('arenaRounds').doc(roundId).collection('entries').get(),
          db.collection('feedItems').where('targetId', '==', roundId).where('type', '==', 'arena_winner').limit(5).get()
            .catch(function () { return null; }),
          round.lane === 'mission'
            ? db.collection('arenaHallOfFame').doc(roundId).get().catch(function () { return null; })
            : Promise.resolve(null),
          db.collection('publicProfiles').doc(round.winnerUid).get().catch(function () { return null; })
        ];
        Promise.all(jobs).then(function (res) {
          var entries = [];
          res[0].forEach(function (d) {
            var data = d.data() || {};
            entries.push({ uid: d.id, imgUrl: data.imgUrl || null, authorName: data.authorName || null, submittedMs: ts(data.submittedAt) || 0 });
          });
          var feedItem = null;
          if (res[1]) {
            res[1].forEach(function (d) {
              var v = d.data() || {};
              if (!feedItem && String(v.actorUid || '').indexOf('crew:') !== 0) feedItem = v;
            });
          }
          var hof = res[2] && res[2].exists ? (res[2].data() || {}) : null;
          var biz = res[3] && res[3].exists ? (res[3].data() || {}) : null;
          var winner = null;
          entries.forEach(function (e) { if (e.uid === winnerEntryId) winner = e; });
          var name = (winner && winner.authorName) || (feedItem && feedItem.actorName) || (hof && hof.authorName) || 'An operator';
          var username = (feedItem && feedItem.actorUsername) || null;
          var avatar = (feedItem && feedItem.actorAvatar) || null;
          var img = (winner && winner.imgUrl) || (feedItem && feedItem.imageUrl) || (hof && hof.imgUrl) || null;
          var votes = null;
          if (feedItem && typeof feedItem.votes === 'number') votes = feedItem.votes;
          else if (hof && typeof hof.votes === 'number') votes = hof.votes;
          var field = entries.filter(function (e) { return e.uid !== winnerEntryId; });
          field.sort(function (a, b) { return a.submittedMs - b.submittedMs; });

          var html = '';
          html += '<div class="aw-hero" id="awHero"></div>';
          html += '<div class="aw-winner"><span id="awAvSlot"></span>' +
            '<div class="who"><div class="name">' + esc(name) + '</div>' +
            '<div class="sub">' + (username ? '@' + esc(username) + ' · ' : '') +
            (votes != null ? '<span class="gold">' + votes + ' weighted votes</span> · ' : '') +
            'beat ' + field.length + (field.length === 1 ? ' other shot' : ' other shots') + ', judged blind</div></div></div>';
          html += bizCardHtml(biz, name, round);
          if (round.brief) {
            html += '<section class="aw-brief"><h3>The brief</h3><p>' + esc(round.brief) + '</p></section>';
          }
          if (field.length) {
            html += '<section class="aw-field"><h3>The field it beat</h3><div class="aw-field-grid">';
            field.forEach(function (e) {
              html += '<div class="aw-shot"><span class="aw-media" data-url="' + esc(e.imgUrl || '') + '"></span>' +
                '<span class="nm">' + esc(e.authorName || 'Operator') + '</span></div>';
            });
            html += '</div></section>';
          }
          html += '<div class="aw-doors"><a class="btn-solid" href="/missions.html">Enter tonight&rsquo;s round</a>' +
                  '<button class="btn-ghost" id="awShare" type="button">Share this crown</button>' +
                  '<a class="btn-ghost" href="/arena-winners.html">See all crowns</a></div>';
          body.innerHTML = html;
          /* Dynamic images are attached as DOM nodes (real URLs come from
             the round record, never from markup). */
          var hero = document.getElementById('awHero');
          function heroPlaceholder() {
            hero.innerHTML = '';
            var ph = document.createElement('div');
            ph.className = 'aw-hero-ph';
            ph.textContent = 'The winning image has expired from the vault — the crown stands.';
            hero.appendChild(ph);
          }
          if (img) {
            var him = document.createElement('img');
            him.alt = 'The winning shot';
            him.addEventListener('error', heroPlaceholder);
            him.src = img;
            hero.appendChild(him);
          } else heroPlaceholder();
          if (avatar) {
            var av = document.createElement('img');
            av.className = 'av'; av.alt = '';
            av.addEventListener('error', function () { av.style.display = 'none'; });
            av.src = avatar;
            document.getElementById('awAvSlot').appendChild(av);
          }
          body.querySelectorAll('.aw-media').forEach(function (slot) {
            var url = slot.getAttribute('data-url');
            if (!url) {
              var ex = document.createElement('div');
              ex.className = 'ph'; ex.textContent = 'EXPIRED';
              slot.appendChild(ex);
              return;
            }
            var im = document.createElement('img');
            im.alt = ''; im.loading = 'lazy';
            im.addEventListener('error', function () {
              var ex2 = document.createElement('div');
              ex2.className = 'ph'; ex2.textContent = 'EXPIRED';
              slot.replaceChild(ex2, im);
            });
            im.src = url;
            slot.appendChild(im);
          });
          maybeCelebrate(round);
          var shareBtn = document.getElementById('awShare');
          if (shareBtn) shareBtn.addEventListener('click', function () {
            var shareData = {
              title: 'Arena Winner — Cameras Decoded',
              text: name + ' won the Arena: "' + (round.title || 'Untitled round') + '" — judged blind. Proven nightly.',
              url: window.location.href
            };
            if (navigator.share) { navigator.share(shareData).catch(function () {}); }
            else if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(shareData.url).then(function () { shareBtn.textContent = 'Link copied'; });
            }
          });
        }).catch(function () {
          status('Could not load the crown', 'The round is on record, but its entries would not load. Check your connection and reload.', DOORS);
        });
      }
      arm();
    })();
  </script>
