<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Operator Profile — Cameras Decoded</title>

  <!-- ===== MASTER LOADER (injects header, bottom nav container, shared CSS) ===== -->
  <script src="/scripts/master-loader.js"></script>

  <!-- ===== SHARED COMPONENT CSS ===== -->
  <link rel="stylesheet" href="header.css" />
  <link rel="stylesheet" href="bottom-nav.css" />

  <!-- ===== FIREBASE SDKs ===== -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- ===== FIREBASE INIT ===== -->
  <script src="/scripts/firebase-init.js"></script>

  <!-- ===== SHARED COMPONENT SCRIPTS ===== -->
  <script src="header.js"></script>
  <script src="sidebar.js"></script>

  <style>
    /* ============================================================
       OPERATOR PROFILE – STYLES (adapted from partner‑profile)
       ============================================================ */
    :root {
      --green: #8deb00;
      --green-dim: rgba(141,235,0,0.12);
      --green-glow: rgba(141,235,0,0.25);
      --text-muted: #b4b4b4;
      --bg-panel: #0A0A0A;
      --border-dim: #1A1A1A;
      --gold: #e0b12d;
      --card-bg: rgba(10,10,10,0.6);
      --radius: 12px;
      --transition-smooth: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: #050705;
      background-image: radial-gradient(circle at 20% 30%, rgba(141,235,0,0.12) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(141,235,0,0.08) 0%, transparent 45%),
                        linear-gradient(rgba(141,235,0,0.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(141,235,0,0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px, 24px 24px;
      background-attachment: fixed;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; }
    h1, h2, h3, .mono { font-family: 'Space Mono', monospace; }

    /* ============================================================
       SIDEBAR CONTAINER – injected by sidebar.js
       ============================================================ */
    #sidebarContainer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 1000;
      width: 280px;
    }

    .sidebar {
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      padding: 20px 16px 24px;
      border-right: 1px solid var(--border-dim);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s var(--transition-smooth);
      transform: translateX(0);
      position: relative;
    }

    @media (max-width: 1024px) {
      #sidebarContainer {
        position: fixed;
        width: 280px;
        z-index: 1000;
      }
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s var(--transition-smooth);
      }
      .sidebar.open {
        transform: translateX(0);
      }
    }

    .sidebar .logo { text-align:center; margin-bottom:12px; }
    .sidebar .logo img { height:70px; width:auto; transition:filter 0.3s ease; }
    .sidebar .logo img:hover { filter:drop-shadow(0 0 20px rgba(141,235,0,0.15)); }

    .sidebar-profile { text-align:center; padding:12px 0 16px; border-bottom:1px solid var(--border-dim); margin-bottom:16px; flex-shrink:0; }
    .profile-avatar { width:64px; height:64px; border-radius:50%; background-size:cover; background-position:center; margin:0 auto 8px; border:2px solid var(--green); background-color:#1a1a1a; transition:transform 0.3s var(--transition-smooth), box-shadow 0.3s ease; }
    .profile-avatar:hover { transform:scale(1.05); box-shadow:0 0 30px var(--green-glow); border-color:#a0f520; }
    .profile-name { font-weight:600; font-size:14px; color:#fff; }
    .profile-email { font-size:12px; color:var(--text-muted); }

    .sidebar-nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sidebar-nav .nav-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sidebar-nav .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      color: var(--text-muted);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      border-radius: 6px;
      transition: all 0.2s var(--transition-smooth);
      cursor: pointer;
      text-decoration: none;
      border: none;
    }
    .sidebar-nav .nav-item i {
      width: 20px;
      text-align: center;
      font-size: 14px;
      transition: transform 0.2s ease;
    }
    .sidebar-nav .nav-item:hover {
      color: var(--green);
      background: rgba(141,235,0,0.05);
      transform: translateX(3px);
    }
    .sidebar-nav .nav-item:hover i {
      transform: scale(1.1);
    }
    .sidebar-nav .nav-item.active {
      color: var(--green);
      background: rgba(141,235,0,0.08);
    }
    .sidebar-divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.06);
      margin: 6px 0;
      flex-shrink: 0;
    }

    #privateLinks {
      display: none;
      flex-direction: column;
      gap: 2px;
    }
    #privateLinks .nav-item { display: flex; }
    #authCta {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 4px;
    }
    #authCta .nav-item {
      justify-content: center;
      border: 1px solid var(--green);
      border-radius: 30px;
      color: var(--green);
      background: transparent;
      padding: 8px 12px;
      margin: 4px 0;
    }
    #authCta .nav-item:hover { background: rgba(141,235,0,0.08); }
    #authCta .nav-item.signup {
      background: var(--green);
      color: #000;
    }
    #authCta .nav-item.signup:hover { background: #a0f520; }

    .sidebar-notification {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border-dim);
      background: rgba(255,255,255,0.01);
      border-radius: 8px;
      padding: 10px 12px;
      transition: background 0.3s ease;
      flex-shrink: 0;
    }
    .sidebar-notification:hover { background: rgba(141,235,0,0.02); }
    .sidebar-notification .notif-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--text-muted);
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .sidebar-notification .notif-header i { color: var(--green); font-size: 12px; }
    .sidebar-notification .notif-message {
      font-size: 12px;
      color: #fff;
      line-height: 1.4;
      word-break: break-word;
    }
    .sidebar-notification .notif-message.empty {
      color: var(--text-muted);
      font-style: italic;
      font-size: 11px;
    }
    .sidebar-notification .notif-timestamp {
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 2px;
      font-family: 'Space Mono', monospace;
      opacity: 0.5;
    }

    /* ============================================================
       MAIN CONTENT LAYOUT
       ============================================================ */
    .main-content {
      margin-left: 280px;
      padding: 80px 40px 40px;
      max-width: calc(1200px + 280px);
      position: relative;
      z-index: 2;
    }

    @media (max-width: 1024px) {
      .main-content { margin-left: 0; padding: 100px 20px 20px; }
    }

    /* ============================================================
       CARDS
       ============================================================ */
    .card {
      background: rgba(12,12,12,0.16);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 28px;
      margin-bottom: 18px;
      transition: border-color 0.3s, box-shadow 0.3s;
      box-shadow: 0 4px 30px rgba(0,0,0,0.3);
    }
    .card:hover {
      border-color: rgba(141,235,0,0.15);
      box-shadow: 0 8px 50px rgba(0,0,0,0.5);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .card-header img {
      max-height: 34px;
      width: auto;
      display: block;
    }

    /* Remove the old icon and h2 */
    .card-header .icon,
    .card-header h2 {
      display: none;
    }

    .card-header .badge {
      font-size: 9px;
      font-family: 'Space Mono', monospace;
      background: rgba(141,235,0,0.08);
      color: var(--green);
      padding: 2px 10px;
      border-radius: 20px;
      border: 1px solid rgba(141,235,0,0.1);
      margin-left: auto;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px 20px;
    }
    .info-item .label {
      font-size: 10px;
      color: #666;
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .info-item .value {
      font-size: 15px;
      color: #fff;
      font-weight: 500;
      margin-top: 6px;
      word-break: break-word;
    }
    .info-item .value.green { color: var(--green); }

    /* ===== FORM FIELDS ===== */
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      color: var(--text-muted);
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      outline: none;
      transition: all 0.3s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--green);
      box-shadow: 0 0 20px rgba(141,235,0,0.06);
    }

    /* ===== SAVE ROW ===== */
    .save-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .btn-save {
      padding: 10px 28px;
      background: var(--green);
      border: none;
      border-radius: 8px;
      color: #000;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-save:hover {
      background: #a0f520;
      box-shadow: 0 0 40px rgba(141,235,0,0.3);
      transform: scale(1.02);
    }

    /* ===== AVATAR ===== */
    .avatar-row {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    .avatar-preview {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      border: 2.5px solid var(--green);
      background-color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: #555;
    }
    .avatar-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .btn-upload {
      padding: 6px 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: var(--text-muted);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-upload:hover {
      border-color: var(--green);
      color: var(--green);
      background: rgba(141,235,0,0.04);
    }

    /* ===== REFERRAL ===== */
    .ref-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }
    .ref-link {
      font-family: 'Space Mono', monospace;
      color: var(--green);
      font-size: 14px;
      word-break: break-all;
      flex: 1;
      min-width: 180px;
      background: rgba(0,0,0,0.3);
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .ref-stats {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }
    .ref-stats .stat { text-align: center; }
    .ref-stats .stat .num {
      font-size: 22px;
      font-weight: 700;
      color: var(--green);
    }
    .ref-stats .stat .lbl {
      font-size: 10px;
      color: #666;
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ===== LOADING ===== */
    .loading-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255,255,255,0.08);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== TOAST ===== */
    #toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      pointer-events: none;
    }
    .toast {
      background: rgba(10,10,10,0.9);
      border: 1px solid var(--green);
      color: #fff;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      padding: 12px 24px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      pointer-events: auto;
      text-align: center;
      max-width: 90vw;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { border-color: #ff4a4a; }

    /* ===== CHASING BORDER ===== */
    @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
    .chasing-border { position: relative; border-color: transparent !important; background-clip: padding-box; overflow: visible; }
    .chasing-border::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: conic-gradient(from var(--angle), #8deb00, #00e5ff, #a0f520, #8deb00);
      -webkit-mask: linear-gradient(black, black) content-box, linear-gradient(black, black) border-box;
      -webkit-mask-composite: xor;
      mask: linear-gradient(black, black) content-box, linear-gradient(black, black) border-box;
      mask-composite: exclude;
      animation: spinBorder 4s linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    .chasing-border>* { position: relative; z-index: 1; }
    @keyframes spinBorder { to { --angle: 360deg; } }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 640px) {
      .info-grid { grid-template-columns: 1fr 1fr; }
      .avatar-row { flex-direction: column; align-items: center; text-align: center; }
      .avatar-actions { align-items: center; }
      .ref-row { flex-direction: column; align-items: stretch; }
      .save-row { justify-content: center; }
      .card-header img { max-height: 28px; }
    }
    @media (max-width: 420px) {
      .info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ===== SIDEBAR INJECTION POINT ===== -->
  <div id="sidebarContainer"></div>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content">
    <div id="toast-container"></div>

    <div class="profile-header" style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; margin-bottom:28px; padding-bottom:16px; border-bottom:1px solid var(--border);">
      <div class="brand" style="display:flex; align-items:center; gap:12px;">
        <img src="/custom-site-titles/profile-operator.png" alt="Operator Profile" style="max-height:50px; width:auto; display:block;" />
        <span class="tag" id="roleTag" style="font-size:11px; color:var(--text-muted); font-family:'Space Mono',monospace; background:rgba(255,255,255,0.04); padding:2px 12px; border-radius:20px; border:1px solid var(--border);">Operator</span>
      </div>
      <div class="header-actions" style="display:flex; gap:10px; flex-wrap:wrap;">
        <a href="operator-dashboard.html" id="dashboardLink" class="btn" style="padding:6px 16px; border-radius:8px; font-family:'Space Mono',monospace; font-size:11px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--green); color:var(--green); background:transparent;">Dashboard</a>
      </div>
    </div>

    <!-- Loading -->
    <div id="loadingState" class="loading-state">
      <div class="spinner"></div>
      <p>Loading your signal...</p>
    </div>

    <!-- Profile content -->
    <div id="profileContent" style="display:none;">

      <!-- Avatar Card -->
      <div class="card avatar-card chasing-border" id="avatarCard">
        <div class="card-header">
          <img src="/custom-site-titles/profile-photo.png" alt="Profile Photo" />
        </div>
        <div class="avatar-row">
          <div class="avatar-preview" id="avatarPreview"><i class="fas fa-user"></i></div>
          <div class="avatar-actions">
            <input type="file" id="avatarInput" accept="image/*" style="display:none;" />
            <button class="btn-upload" id="uploadBtn"><i class="fas fa-upload"></i> Upload Photo</button>
            <button class="btn-upload btn-remove" id="removeBtn" style="display:none;"><i class="fas fa-trash-alt"></i> Remove</button>
            <span class="status-text" id="uploadStatus"></span>
            <span style="font-size:10px;color:#555;">Max 5MB · JPG, PNG, GIF</span>
          </div>
        </div>
      </div>

      <!-- Basic Info -->
      <div class="card">
        <div class="card-header">
          <img src="/custom-site-titles/basic-information.png" alt="Basic Information" />
          <span class="badge">read-only</span>
        </div>
        <div class="info-grid">
          <div class="info-item"><span class="label">Full Name</span><span class="value" id="displayNameDisplay">—</span></div>
          <div class="info-item"><span class="label">Username</span><span class="value" id="usernameDisplay">—</span></div>
          <div class="info-item"><span class="label">Email</span><span class="value" id="emailDisplay">—</span></div>
        </div>
      </div>

      <!-- Gear & Preferences (editable) -->
      <div class="card">
        <div class="card-header">
          <img src="/custom-site-titles/gear-and-preferences.png" alt="Gear & Preferences" />
        </div>
        <div class="form-group">
          <label for="preferredGearInput">Preferred Gear</label>
          <input type="text" id="preferredGearInput" placeholder="e.g. Sony A7IV, 24-70mm GM" />
        </div>
        <div class="form-group">
          <label for="specialtiesInput">Specialties</label>
          <input type="text" id="specialtiesInput" placeholder="e.g. Portrait, Landscape, Street" />
        </div>
        <div class="save-row"><button class="btn-save" id="saveGearBtn"><i class="fas fa-save"></i> Save</button></div>
      </div>

      <!-- Stats & Progress -->
      <div class="card">
        <div class="card-header">
          <img src="/custom-site-titles/stats-and-progress.png" alt="Stats & Progress" />
        </div>
        <div class="info-grid">
          <div class="info-item"><span class="label">Journey Nodes</span><span class="value" id="journeyNodes">0</span></div>
          <div class="info-item"><span class="label">Snapshots</span><span class="value" id="snapshotCount">0</span></div>
          <div class="info-item"><span class="label">Points</span><span class="value" id="pointsDisplay">0</span></div>
          <div class="info-item"><span class="label">Streak</span><span class="value" id="streakDisplay">0</span></div>
        </div>
      </div>

      <!-- Referral & Stats -->
      <div class="card chasing-border">
        <div class="card-header">
          <img src="/custom-site-titles/referral-and-stats.png" alt="Referral & Stats" />
        </div>
        <div class="ref-row">
          <div>
            <div style="font-size:10px;color:#666;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:0.5px;">Your Referral Link</div>
            <div class="ref-link" id="referralLinkDisplay">camerasdecoded.com/ref/—</div>
            <button class="btn-save" style="padding:4px 14px;font-size:11px;margin-top:6px;" id="copyRefBtn"><i class="fas fa-copy"></i> Copy</button>
          </div>
          <div class="ref-stats">
            <div class="stat"><div class="num" id="refTotalReferrals">0</div><div class="lbl">Referrals</div></div>
            <div class="stat"><div class="num" id="refTotalCommission">$0</div><div class="lbl">Commission</div></div>
            <div class="stat"><div class="num" id="refAmbassadorTier">—</div><div class="lbl">Tier</div></div>
          </div>
        </div>
      </div>

      <footer class="profile-footer" style="margin-top:40px;padding-top:20px;border-top:1px solid var(--border);text-align:center;font-size:12px;color:#555;font-family:'Space Mono',monospace;">© 2026 Cameras Decoded · All signals locked</footer>
    </div>
  </main>

  <!-- ===== BOTTOM NAV CONTAINER – with data-role="operator" ===== -->
  <div id="bottomNavContainer" data-role="operator"></div>

  <!-- ===== EMAIL VERIFICATION (optional) ===== -->
  <script src="/scripts/email-verification.js"></script>

  <!-- ===== PAGE-SPECIFIC JAVASCRIPT ===== -->
  <script>
    // ================================================================
    // OPERATOR PROFILE – STANDARDISED PATTERN
    // ================================================================

    function cdToast(msg, type) {
      if (typeof window.cdToast === 'function') {
        window.cdToast(msg, type);
      } else {
        alert(msg);
      }
    }
    if (typeof window.cdToast === 'undefined') {
      window.cdToast = cdToast;
    }

    const auth = window.auth || firebase.auth();
    const db = window.db || firebase.firestore();

    window.handleLogout = function() {
      auth.signOut().then(() => window.location.href = 'login.html').catch(() => window.location.href = 'login.html');
    };

    const IMGBB_API_KEY = '0b9201a8e4212a124013c23eb559936a';
    let currentUser = null;
    let userDocRef = null;

    // ---- Get (or create) user document ----
    async function getUserData(user) {
      const uid = user.uid;
      const docRef = db.collection('users').doc(uid);
      const doc = await docRef.get();

      if (doc.exists) {
        return doc.data();
      } else {
        const email = user.email || '';
        const username = email ? email.split('@')[0] : 'operator_' + uid.slice(0,6);
        const defaultData = {
          displayName: user.displayName || '',
          email: user.email || '',
          username: username,
          photoURL: user.photoURL || null,
          role: 'Operator',
          preferredGear: '',
          specialties: '',
          journeyNodes: 0,
          snapshots: 0,
          totalPoints: 0,
          streak: 0,
          referralCode: username,
          totalReferrals: 0,
          totalCommissionEarned: 0,
          ambassadorTier: 'operator',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          tourCompleted: false
        };
        await docRef.set(defaultData);
        return defaultData;
      }
    }

    // ---- Render profile ----
    function renderProfile(data) {
      // Update shared components
      if (window.Header && typeof window.Header.setUserData === 'function') {
        window.Header.setUserData(currentUser, data);
      }
      if (window.BottomNav) {
        window.BottomNav.updateBadges(data);
        window.BottomNav.setRole(data.role);
      }
      if (window.Sidebar && typeof window.Sidebar.updateProfile === 'function') {
        window.Sidebar.updateProfile(data);
      } else {
        console.warn('Sidebar.updateProfile not available – ensure sidebar.js is loaded.');
      }

      // Local UI
      document.getElementById('roleTag').textContent = data.role || 'Operator';
      document.getElementById('displayNameDisplay').textContent = data.displayName || data.name || '—';
      document.getElementById('usernameDisplay').textContent = data.username || '—';
      document.getElementById('emailDisplay').textContent = data.email || '—';
      document.getElementById('dashboardLink').href = 'operator-dashboard.html';

      // Avatar
      const avatarPreview = document.getElementById('avatarPreview');
      const removeBtn = document.getElementById('removeBtn');
      if (data.photoURL) {
        avatarPreview.innerHTML = `<img src="${data.photoURL}" alt="Avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`;
        removeBtn.style.display = 'inline-block';
      } else {
        avatarPreview.innerHTML = '<i class="fas fa-user" style="font-size:32px;color:#555;"></i>';
        removeBtn.style.display = 'none';
      }

      // Gear & Preferences
      document.getElementById('preferredGearInput').value = data.preferredGear || '';
      document.getElementById('specialtiesInput').value = data.specialties || '';

      // Stats
      document.getElementById('journeyNodes').textContent = data.journeyNodes || 0;
      document.getElementById('snapshotCount').textContent = data.snapshots || 0;
      document.getElementById('pointsDisplay').textContent = data.totalPoints || 0;
      document.getElementById('streakDisplay').textContent = data.streak || 0;

      // Referral
      const refCode = data.referralCode || '';
      document.getElementById('referralLinkDisplay').textContent = `camerasdecoded.com/ref/${refCode}`;
      document.getElementById('refTotalReferrals').textContent = data.totalReferrals || 0;
      document.getElementById('refTotalCommission').textContent = '$' + (data.totalCommissionEarned || 0);
      document.getElementById('refAmbassadorTier').textContent = data.ambassadorTier || 'operator';

      // Show content
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('profileContent').style.display = 'block';

      // Attach event listeners (only once)
      if (!window._profileListenersAttached) {
        window._profileListenersAttached = true;
        setupAvatarUpload();
        setupSaveGear();
        setupCopyReferral();
      }
    }

    // ---- Event setup ----
    function setupAvatarUpload() {
      const uploadBtn = document.getElementById('uploadBtn');
      const removeBtn = document.getElementById('removeBtn');
      const fileInput = document.getElementById('avatarInput');

      uploadBtn.replaceWith(uploadBtn.cloneNode(true));
      const newUploadBtn = document.getElementById('uploadBtn');
      newUploadBtn.addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 5*1024*1024) { cdToast('File too large (max 5MB)', 'error'); return; }
        const formData = new FormData();
        formData.append('image', file);
        const statusEl = document.getElementById('uploadStatus');
        statusEl.textContent = 'Uploading...';
        try {
          const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method:'POST', body: formData });
          const json = await res.json();
          if (json.success) {
            const url = json.data.url;
            await userDocRef.update({ photoURL: url });
            document.getElementById('avatarPreview').innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`;
            document.getElementById('removeBtn').style.display = 'inline-block';
            statusEl.textContent = 'Done!';
          } else {
            throw new Error('Upload failed');
          }
        } catch (err) {
          statusEl.textContent = 'Error uploading';
          cdToast('Upload failed: ' + err.message, 'error');
        }
      });

      removeBtn.addEventListener('click', async () => {
        await userDocRef.update({ photoURL: null });
        document.getElementById('avatarPreview').innerHTML = '<i class="fas fa-user" style="font-size:32px;color:#555;"></i>';
        document.getElementById('removeBtn').style.display = 'none';
        cdToast('Photo removed');
      });
    }

    function setupSaveGear() {
      const btn = document.getElementById('saveGearBtn');
      btn.replaceWith(btn.cloneNode(true));
      document.getElementById('saveGearBtn').addEventListener('click', async () => {
        const preferredGear = document.getElementById('preferredGearInput').value.trim();
        const specialties = document.getElementById('specialtiesInput').value.trim();
        try {
          await userDocRef.update({
            preferredGear,
            specialties,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          cdToast('Preferences saved!');
        } catch (err) { cdToast('Error: ' + err.message, 'error'); }
      });
    }

    function setupCopyReferral() {
      const btn = document.getElementById('copyRefBtn');
      btn.replaceWith(btn.cloneNode(true));
      document.getElementById('copyRefBtn').addEventListener('click', () => {
        const link = document.getElementById('referralLinkDisplay').textContent;
        navigator.clipboard.writeText(link).then(() => cdToast('Copied!'));
      });
    }

    // ---- Auth listener ----
    auth.onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      currentUser = user;
      userDocRef = db.collection('users').doc(user.uid);

      try {
        const data = await getUserData(user);
        renderProfile(data);
      } catch (err) {
        console.error('Error loading profile:', err);
        document.getElementById('loadingState').innerHTML = `<p style="color:#ff4a4a;">Error: ${err.message}</p>`;
      }

      userDocRef.onSnapshot((doc) => {
        if (doc.exists) {
          renderProfile(doc.data());
        }
      }, (err) => {
        console.warn('Profile listener error:', err);
      });
    });

    // ---- Cart UI ----
    function getCart() { return JSON.parse(localStorage.getItem('cameras_decoded_cart') || '[]'); }
    function updateCartUI() {
      const cart = getCart();
      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      const countEl = document.getElementById('cartHeaderCount');
      const labelEl = document.getElementById('cartHeaderLabel');
      if (countEl) { countEl.textContent = totalItems; countEl.style.display = totalItems > 0 ? 'inline-block' : 'none'; }
      if (labelEl) labelEl.textContent = totalItems > 0 ? `Cart (${totalItems})` : 'Cart';
    }
    window.addEventListener('storage', updateCartUI);
    document.addEventListener('DOMContentLoaded', updateCartUI);
  </script>
</body>
</html>
