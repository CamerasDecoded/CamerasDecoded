<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Cameras Decoded</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --green: #8deb00;
      --green-dim: rgba(141, 235, 0, 0.12);
      --green-glow: rgba(141, 235, 0, 0.25);
      --text-muted: #b4b4b4;
      --bg-panel: #0A0A0A;
      --border-dim: #1A1A1A;
      --card-bg: rgba(10, 10, 10, 0.6);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #050705;
      background-image: radial-gradient(circle at 20% 30%, rgba(141, 235, 0, 0.12) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(141, 235, 0, 0.08) 0%, transparent 45%),
                        linear-gradient(rgba(141, 235, 0, 0.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(141, 235, 0, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px, 24px 24px;
      background-attachment: fixed;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 800px; margin: 40px auto; }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-dim);
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: rgba(141, 235, 0, 0.2); }
    .card h2 {
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      color: var(--green);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; }
    .item .label { font-size: 10px; color: #666; font-family: 'Space Mono', monospace; text-transform: uppercase; letter-spacing: 0.5px; }
    .item .value { font-size: 14px; color: #fff; margin-top: 2px; }
    .item .value.green { color: var(--green); }
    .btn-back {
      display: inline-block;
      padding: 10px 24px;
      background: transparent;
      border: 1px solid var(--green);
      border-radius: 8px;
      color: var(--green);
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
    }
    .btn-back:hover { background: rgba(141, 235, 0, 0.1); box-shadow: 0 0 20px rgba(141, 235, 0, 0.2); }
    .btn-logout {
      padding: 10px 24px;
      background: transparent;
      border: 1px solid #ff4a4a;
      border-radius: 8px;
      color: #ff4a4a;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-logout:hover { background: rgba(255, 74, 74, 0.1); }
    .flex { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .flex.space-between { justify-content: space-between; }

    .avatar-section {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 12px 0;
    }
    .avatar-preview {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      border: 3px solid var(--green);
      flex-shrink: 0;
      background-color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: #555;
      position: relative;
      overflow: hidden;
    }
    .avatar-preview img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .avatar-upload-btn {
      padding: 10px 20px;
      background: transparent;
      border: 1px solid var(--green);
      border-radius: 8px;
      color: var(--green);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
    }
    .avatar-upload-btn:hover { background: rgba(141, 235, 0, 0.1); }
    .avatar-upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .avatar-upload-btn.remove { border-color: #ff4a4a; color: #ff4a4a; }
    .avatar-upload-btn.remove:hover { background: rgba(255, 74, 74, 0.1); }
    .upload-status {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .upload-status.success { color: var(--green); }
    .upload-status.error { color: #ff4a4a; }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
      .container { margin: 20px auto; }
      .card { padding: 16px 18px; }
      .avatar-section { flex-direction: column; align-items: center; }
    }

    #toast-container {
      position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:9999;
      display:flex; flex-direction:column; gap:10px; align-items:center; pointer-events:none;
    }
    .toast {
      background:#0A0A0A; border:1px solid var(--green); color:#fff;
      font-family:'Space Mono',monospace; font-size:13px; padding:12px 24px;
      border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,0.6);
      opacity:0; transform:translateY(-10px); transition:all 0.3s ease; pointer-events:auto; text-align:center;
    }
    .toast.show { opacity:1; transform:translateY(0); }
    .toast.error { border-color:#ff4a4a; }

    .loading { text-align:center; padding:60px 0; color:var(--text-muted); }
    .loading i { font-size:32px; color:var(--green); display:block; margin-bottom:12px; }
    .btn-refresh {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--text-muted);
      border-radius: 4px;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
      font-family: 'Space Mono', monospace;
    }
    .btn-refresh:hover { border-color: var(--green); color: var(--green); }
  </style>
</head>
<body>
  <div id="toast-container"></div>

  <div class="container">
    <div class="flex space-between" style="margin-bottom:20px;">
      <h1 style="font-family:'Space Mono',monospace;color:var(--green);font-size:24px;">
        <i class="fas fa-user"></i> Profile
      </h1>
      <div class="flex">
        <button class="btn-refresh" id="refreshBtn"><i class="fas fa-sync"></i> Refresh</button>
        <a href="operator-dashboard.html" class="btn-back"><i class="fas fa-arrow-left"></i> Dashboard</a>
        <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>

    <div id="loadingState" class="loading">
      <i class="fas fa-spinner fa-spin"></i>
      <p>Loading your profile...</p>
    </div>

    <div id="profileContent" style="display:none;">

      <!-- Avatar Section -->
      <div class="card" id="avatarCard">
        <h2><i class="fas fa-image"></i> Profile Photo</h2>
        <div class="avatar-section">
          <div class="avatar-preview" id="avatarPreview">
            <i class="fas fa-user" id="avatarPlaceholder"></i>
          </div>
          <div>
            <input type="file" id="avatarInput" accept="image/*" style="display:none;" />
            <button class="avatar-upload-btn" id="uploadBtn"><i class="fas fa-upload"></i> Upload Photo</button>
            <button class="avatar-upload-btn remove" id="removeBtn" style="display:none;" onclick="removeAvatar()">
              <i class="fas fa-trash"></i> Remove
            </button>
            <div class="upload-status" id="uploadStatus"></div>
            <div style="font-size:11px;color:#666;margin-top:6px;">Max 5MB · JPG, PNG, GIF</div>
          </div>
        </div>
      </div>

      <!-- Basic Info -->
      <div class="card" id="basicInfo">
        <h2><i class="fas fa-id-card"></i> Basic Information</h2>
        <div class="grid" id="basicGrid"></div>
      </div>

      <!-- Preferences -->
      <div class="card" id="preferencesCard">
        <h2><i class="fas fa-camera"></i> Gear & Preferences</h2>
        <div class="grid" id="preferencesGrid"></div>
      </div>

      <!-- Learning Journey -->
      <div class="card" id="learningCard">
        <h2><i class="fas fa-compass"></i> Learning Journey</h2>
        <div class="grid" id="learningGrid"></div>
      </div>

      <!-- Referral & Stats -->
      <div class="card" id="referralCard">
        <h2><i class="fas fa-satellite-dish"></i> Referral & Stats</h2>
        <div class="grid" id="referralGrid"></div>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script>
    // ---- Firebase Init ----
    const firebaseConfig = {
      apiKey: "AIzaSyB95Vx0i8W6WNfUy1N4TNQyfN5xCxQYnz8",
      authDomain: "cameras-decoded.firebaseapp.com",
      projectId: "cameras-decoded",
      storageBucket: "cameras-decoded.firebasestorage.app",
      messagingSenderId: "1088920052790",
      appId: "1:1088920052790:web:2177c1fb31109c1fa02497",
      measurementId: "G-YN3M01WW0B"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ---- ImgBB API Key ----
    const IMGBB_API_KEY = '0b9201a8e4212a124013c23eb559936a';

    // ---- DOM refs ----
    const avatarPreview = document.getElementById('avatarPreview');
    const avatarInput = document.getElementById('avatarInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const removeBtn = document.getElementById('removeBtn');
    const uploadStatus = document.getElementById('uploadStatus');

    let currentUserData = null;
    let currentUser = null;

    // ---- Toast ----
    function cdToast(message, type) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'toast' + (type === 'error' ? ' error' : '');
      toast.textContent = message;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 4000);
    }

    // ---- Upload to ImgBB ----
    async function uploadToImgBB(file) {
      const formData = new FormData();
      formData.append('image', file);
      const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: 'POST',
        body: formData
      });
      const data = await response.json();
      if (data.success) {
        return data.data.url;
      } else {
        throw new Error(data.error?.message || 'Upload failed');
      }
    }

    // ---- Avatar Upload ----
    uploadBtn.addEventListener('click', () => avatarInput.click());

    avatarInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        cdToast('Please select an image file.', 'error');
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        cdToast('Image must be under 5MB.', 'error');
        return;
      }

      const reader = new FileReader();
      reader.onload = (event) => {
        avatarPreview.innerHTML = `<img src="${event.target.result}" alt="Avatar" />`;
      };
      reader.readAsDataURL(file);

      uploadStatus.textContent = 'Uploading to ImgBB...';
      uploadStatus.className = 'upload-status';
      uploadBtn.disabled = true;

      try {
        const user = auth.currentUser;
        if (!user) throw new Error('Not authenticated');

        const imageUrl = await uploadToImgBB(file);
        await db.collection('users').doc(user.uid).update({ photoURL: imageUrl });

        currentUserData.photoURL = imageUrl;
        localStorage.setItem('profilePhoto', imageUrl);

        uploadStatus.textContent = '✅ Upload complete!';
        uploadStatus.className = 'upload-status success';
        uploadBtn.disabled = false;
        removeBtn.style.display = 'inline-block';
        cdToast('Profile photo updated!');

        // Update sidebar if open
        try {
          const sidebarAvatar = document.querySelector('.profile-avatar');
          if (sidebarAvatar) {
            sidebarAvatar.style.backgroundImage = `url(${imageUrl})`;
            sidebarAvatar.innerHTML = '';
          }
        } catch (e) {}

      } catch (err) {
        console.error(err);
        uploadStatus.textContent = '❌ ' + err.message;
        uploadStatus.className = 'upload-status error';
        uploadBtn.disabled = false;
        cdToast('Upload failed: ' + err.message, 'error');
      }
    });

    // ---- Remove Avatar ----
    window.removeAvatar = async function() {
      const user = auth.currentUser;
      if (!user) { cdToast('Please log in.', 'error'); return; }

      const confirmed = confirm('Remove your profile photo?');
      if (!confirmed) return;

      try {
        await db.collection('users').doc(user.uid).update({
          photoURL: firebase.firestore.FieldValue.delete()
        });

        currentUserData.photoURL = null;
        avatarPreview.innerHTML = '<i class="fas fa-user" id="avatarPlaceholder"></i>';
        removeBtn.style.display = 'none';
        uploadStatus.textContent = 'Photo removed.';
        uploadStatus.className = 'upload-status';
        cdToast('Profile photo removed.');

        localStorage.removeItem('profilePhoto');

        try {
          const sidebarAvatar = document.querySelector('.profile-avatar');
          if (sidebarAvatar) {
            sidebarAvatar.style.backgroundImage = "url('cameras-decoded-logo.png')";
            sidebarAvatar.innerHTML = '';
          }
        } catch (e) {}

      } catch (err) {
        console.error(err);
        cdToast('Error removing photo: ' + err.message, 'error');
      }
    };

    // ---- RENDER PROFILE ----
    function renderProfile(userData) {
      currentUserData = userData;
      console.log('Rendering profile with data:', userData); // DEBUG

      const loading = document.getElementById('loadingState');
      const content = document.getElementById('profileContent');

      // Avatar
      if (userData.photoURL) {
        avatarPreview.innerHTML = `<img src="${userData.photoURL}" alt="Avatar" />`;
        removeBtn.style.display = 'inline-block';
        localStorage.setItem('profilePhoto', userData.photoURL);
      } else {
        avatarPreview.innerHTML = '<i class="fas fa-user" id="avatarPlaceholder"></i>';
        removeBtn.style.display = 'none';
      }

      // Basic Info
      const basicGrid = document.getElementById('basicGrid');
      basicGrid.innerHTML = `
        <div class="item"><div class="label">Full Name</div><div class="value">${userData.displayName || '—'}</div></div>
        <div class="item"><div class="label">Username</div><div class="value">${userData.username || '—'}</div></div>
        <div class="item"><div class="label">Email</div><div class="value">${userData.email || '—'}</div></div>
        <div class="item"><div class="label">Plan</div><div class="value green">${userData.tier === 'pro' ? 'Pro' : 'Free'}</div></div>
        <div class="item"><div class="label">Billing</div><div class="value">${userData.billingInterval || 'monthly'}</div></div>
        <div class="item"><div class="label">Role</div><div class="value">${userData.role || 'Operator'}</div></div>
      `;

      // Preferences
      const prefs = userData.preferences || {};
      const prefGrid = document.getElementById('preferencesGrid');
      prefGrid.innerHTML = `
        <div class="item"><div class="label">Camera Brands</div><div class="value">${(prefs.brands || []).join(', ') || '—'}</div></div>
        <div class="item"><div class="label">Lenses</div><div class="value">${(prefs.lenses || []).join(', ') || '—'}</div></div>
        <div class="item"><div class="label">Interests</div><div class="value">${(prefs.interests || []).join(', ') || '—'}</div></div>
        <div class="item"><div class="label">Confidence</div><div class="value">${userData.learningJourney?.confidence || '—'}/10</div></div>
      `;

      // Learning Journey
      const lj = userData.learningJourney || {};
      const goalMap = {
        'master-manual':'Master manual mode',
        'start-business':'Start a photography/video business',
        'improve-social':'Improve social media content',
        'family-travel':'Capture family/travel memories',
        'professional-event':'Become a professional event/wedding photographer',
        'filmmaker':'Become a filmmaker/videographer'
      };
      const ambitionMap = { 'hobbyist':'Hobbyist', 'semi-pro':'Semi‑professional', 'professional':'Professional' };
      const expMap = { '<6':'Less than 6 months', '6-12':'6–12 months', '1-2':'1–2 years', '3-5':'3–5 years', '5+':'5+ years' };
      const formatMap = { 'video':'Video', 'written':'Written guides', 'interactive':'Interactive exercises', 'mixed':'Mix of everything' };
      const channelMap = { 'email':'Email', 'push':'Push notifications', 'sms':'SMS' };
      const sixMap = {
        'exposure':'Exposure triangle (manual mode)',
        'composition':'Composition & storytelling',
        'lighting':'Lighting (photo & video)',
        'editing':'Editing/post-production',
        'color':'Color grading',
        'business':'Business & client management',
        'gear':'Mastering my specific gear'
      };
      const dreamMap = {
        'portrait-series':'A portrait series',
        'short-film':'A short film',
        'documentary':'A documentary',
        'music-video':'A music video',
        'commercial':'A commercial/corporate video',
        'wedding-film':'A wedding film',
        'social-content':'Social media content (Reels/TikTok)',
        'photobook':'A photo book / portfolio'
      };
      const challengeMap = {
        'low-light':'Low light performance',
        'composition':'Composition & framing',
        'posing':'Posing subjects / directing talent',
        'manual':'Manual settings confusion',
        'autofocus':'Autofocus struggles',
        'editing':'Post‑processing / editing',
        'color-grading':'Color grading',
        'confidence':'Confidence / imposter syndrome',
        'gear':'Understanding my gear',
        'business':'Building my business'
      };

      const learnGrid = document.getElementById('learningGrid');
      learnGrid.innerHTML = `
        <div class="item"><div class="label">Experience</div><div class="value">${expMap[lj.experience] || lj.experience || '—'}</div></div>
        <div class="item"><div class="label">Primary Goal</div><div class="value">${goalMap[lj.primaryGoal] || lj.primaryGoal || '—'}</div></div>
        <div class="item"><div class="label">Ambition</div><div class="value">${ambitionMap[lj.ambition] || lj.ambition || '—'}</div></div>
        <div class="item"><div class="label">Content Format</div><div class="value">${formatMap[lj.contentFormat] || lj.contentFormat || '—'}</div></div>
        <div class="item"><div class="label">Delivery Channel</div><div class="value">${channelMap[lj.deliveryChannel] || lj.deliveryChannel || '—'}</div></div>
        <div class="item"><div class="label">Shoot Frequency</div><div class="value">${lj.shootFrequency || '—'}</div></div>
        <div class="item"><div class="label">Biggest Challenge</div><div class="value">${challengeMap[lj.biggestChallenge] || lj.biggestChallenge || '—'}</div></div>
        <div class="item"><div class="label">Pain Points</div><div class="value">${(lj.painPoints || []).join(', ') || '—'}</div></div>
        <div class="item"><div class="label">6-Month Goal</div><div class="value">${sixMap[lj.sixMonthGoal] || lj.sixMonthGoal || '—'}</div></div>
        <div class="item"><div class="label">Dream Project</div><div class="value">${dreamMap[lj.dreamProject] || lj.dreamProject || '—'}</div></div>
      `;

      // Referral & Stats
      const refGrid = document.getElementById('referralGrid');
      refGrid.innerHTML = `
        <div class="item"><div class="label">Referral Code</div><div class="value green">${userData.referralCode || '—'}</div></div>
        <div class="item"><div class="label">Total Referrals</div><div class="value">${userData.totalReferrals || 0}</div></div>
        <div class="item"><div class="label">Commission Earned</div><div class="value">$${(userData.totalCommissionEarned || 0).toFixed(2)}</div></div>
        <div class="item"><div class="label">Ambassador Tier</div><div class="value green">${userData.ambassadorTier || 'signal'}</div></div>
        <div class="item"><div class="label">Total Points</div><div class="value">${userData.totalPoints || 0}</div></div>
        <div class="item"><div class="label">Level</div><div class="value">${userData.level || 1}</div></div>
        <div class="item"><div class="label">Daily Streak</div><div class="value">🔥 ${userData.dailyChallengeStreak || 0} days</div></div>
        <div class="item"><div class="label">Badges Earned</div><div class="value">${(userData.badgesEarned || []).join(', ') || 'None yet'}</div></div>
      `;

      loading.style.display = 'none';
      content.style.display = 'block';
    }

    // ---- LOAD PROFILE ----
    async function loadProfile(user) {
      if (!user) {
        document.getElementById('loadingState').innerHTML = '<p>Not authenticated. <a href="login.html">Login</a></p>';
        return;
      }
      currentUser = user;
      try {
        const doc = await db.collection('users').doc(user.uid).get();
        if (!doc.exists) {
          cdToast('User data not found.', 'error');
          return;
        }
        const data = doc.data();
        console.log('Fetched user data:', data);
        renderProfile(data);
      } catch (err) {
        console.error(err);
        document.getElementById('loadingState').innerHTML = `<p class="error">Error: ${err.message}</p>`;
      }
    }

    // ---- Refresh ----
    document.getElementById('refreshBtn').addEventListener('click', () => {
      if (currentUser) {
        document.getElementById('loadingState').style.display = 'block';
        document.getElementById('profileContent').style.display = 'none';
        loadProfile(currentUser);
      }
    });

    // ---- Logout ----
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await auth.signOut();
      window.location.href = 'login.html';
    });

    // ---- Auth Listener ----
    auth.onAuthStateChanged((user) => {
      if (user) {
        loadProfile(user);
      } else {
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
