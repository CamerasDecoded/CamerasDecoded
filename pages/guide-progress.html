<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Progress — Cameras Decoded</title>

  <!-- Master Loader -->
  <script src="/scripts/master-loader.js"></script>

  <!-- Guide Styles -->
  <link rel="stylesheet" href="/styles/guide-styles.css" />

  <!-- Root CSS (absolute paths) -->
  <link rel="stylesheet" href="/header.css" />
  <link rel="stylesheet" href="/bottom-nav.css" />

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Firebase Init & User State -->
  <script src="/scripts/firebase-init.js"></script>
  <script src="/scripts/user-state.js"></script>

  <!-- Shared components (absolute paths) -->
  <script src="/header.js"></script>
  <script src="/sidebar.js"></script>
  <script src="/bottom-nav.js"></script>

  <!-- Guide-specific scripts -->
  <script src="/scripts/guide-loader.js"></script>
  <script src="/scripts/guide-progress.js"></script>
</head>
<body>
  <div id="sidebarContainer"></div>

  <main class="main-content">
    <div class="progress-container">
      <div class="progress-header">
        <h1>📊 Your Learning Progress</h1>
        <a href="/pages/learning-guide.html" class="btn-secondary">← Back to Guide</a>
      </div>

      <!-- Summary Stats -->
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
          <div class="stat-number" id="totalChaptersStat">0</div>
          <div class="stat-label">Total Chapters</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="completedStat">0</div>
          <div class="stat-label">Completed</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="inProgressStat">0</div>
          <div class="stat-label">In Progress</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="avgScoreStat">—</div>
          <div class="stat-label">Average Quiz Score</div>
        </div>
      </div>

      <!-- Overall Progress Bar -->
      <div class="overall-progress">
        <p>Overall Completion</p>
        <div class="progress-bar-wrapper">
          <div class="progress-bar-fill" id="overallProgressFill" style="width:0%;"></div>
        </div>
        <span id="overallPercent">0%</span>
      </div>

      <!-- Chapter Details Table -->
      <h2>Chapter Details</h2>
      <div id="chapterDetails" class="chapter-details-list">
        <p>Loading...</p>
      </div>
    </div>
  </main>

  <div id="bottomNavContainer" data-role="operator"></div>

  <script>
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = '/login.html';
        return;
      }

      const userId = user.uid;
      const guideId = 'guide_v1';

      try {
        // Load all chapters with progress
        const chapters = await GuideLoader.loadGuideChapters(guideId, userId);
        const total = chapters.length;

        // Calculate stats
        let completed = 0;
        let inProgress = 0;
        let scores = [];
        let detailsHtml = '';

        chapters.forEach((ch, idx) => {
          const progress = ch.userProgress;
          const isCompleted = progress.completed === true;
          const isStarted = progress.started !== null;
          const score = progress.quizScore;

          if (isCompleted) completed++;
          else if (isStarted) inProgress++;

          if (score !== null) scores.push(score);

          // Build detail row
          const status = isCompleted ? '✅ Completed' : (isStarted ? '📖 In Progress' : '🔒 Not Started');
          const scoreDisplay = score !== null ? `${score}%` : '—';
          detailsHtml += `
            <div class="chapter-detail-row">
              <span class="detail-number">${idx + 1}</span>
              <span class="detail-title">${ch.title}</span>
              <span class="detail-status">${status}</span>
              <span class="detail-score">${scoreDisplay}</span>
            </div>
          `;
        });

        const avgScore = scores.length > 0 ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;

        // Update summary stats
        document.getElementById('totalChaptersStat').textContent = total;
        document.getElementById('completedStat').textContent = completed;
        document.getElementById('inProgressStat').textContent = inProgress;
        document.getElementById('avgScoreStat').textContent = avgScore !== null ? `${avgScore}%` : '—';

        // Update overall progress bar
        const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
        document.getElementById('overallProgressFill').style.width = `${pct}%`;
        document.getElementById('overallPercent').textContent = `${pct}%`;

        // Render chapter details
        document.getElementById('chapterDetails').innerHTML = `
          <div class="chapter-detail-header">
            <span>#</span>
            <span>Chapter</span>
            <span>Status</span>
            <span>Score</span>
          </div>
          ${detailsHtml}
        `;
      } catch (err) {
        console.error(err);
        document.getElementById('chapterDetails').innerHTML = '<p class="error">Failed to load progress. Please try again.</p>';
      }
    });
  </script>
</body>
</html>
