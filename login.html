<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Cameras Decoded</title>
  <meta name="description" content="Access your dashboard. The signal awaits." />

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <link rel="stylesheet" href="/styles/design-system.css">
  <link rel="stylesheet" href="/styles/components.css">
</head>
<body>

  <canvas id="particles"></canvas>

  <div class="auth-wrapper chasing-border">
    <div id="loginFormContainer">
      <div class="logo-area">
        <img src="cameras-decoded-logo.png" alt="Cameras Decoded" class="logo-image" />
        <h1>Welcome back</h1>
        <p>Access your command center</p>
      </div>

      <div class="social-buttons">
        <button class="btn-social" onclick="signInWithGoogle()">
          <!-- Google SVG -->
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.38-3.09 1.03-4.41l-7.98-6.19C.92 17.05 0 20.41 0 24c0 3.59.92 6.95 2.56 9.81l7.97-6.22z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          <span>Sign in with Google</span>
        </button>
        <button class="btn-social" onclick="signInWithFacebook()">
          <!-- Facebook SVG -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          <span>Sign in with Facebook</span>
        </button>
      </div>

      <div class="divider"><hr><span>or</span><hr></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Enter your password" required />
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)">👁</button>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="loginBtn">Access Dashboard</button>
        <div id="errorMsg" class="error-box"></div>
      </form>

      <div class="bottom-links">
        <a href="signup.html">No account? Sign up</a>
        <span>·</span>
        <a href="https://camerasdecoded.com">Return to Cameras Decoded</a>
      </div>
    </div>

    <!-- Role selection (hidden by default) -->
    <div id="roleSelection">
      <div class="logo-area" style="margin-bottom:16px;">
        <h2 style="font-size:20px;">Choose your path</h2>
        <p>You have access to multiple dashboards.</p>
      </div>
      <div class="role-grid" id="roleGrid"></div>
      <a href="#" class="back-to-login" onclick="showLoginForm(); return false;">
        <i class="fas fa-arrow-left"></i> Back to login
      </a>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Auth logic -->
  <script src="/scripts/auth.js"></script>

  <!-- Page-specific script for UI events (minimal) -->
  <script>
    // Toggle password visibility
    window.togglePasswordVisibility = function(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁';
      }
    };

    // Login form submit
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      window.login(email, password);
    });

    // Role selection helpers
    window.showLoginForm = function() {
      document.getElementById('loginFormContainer').style.display = 'block';
      document.getElementById('roleSelection').style.display = 'none';
    };

    function populateRoleCards(roles, uid) {
      const grid = document.getElementById('roleGrid');
      grid.innerHTML = '';
      const icons = { 'Operator':'fa-camera', 'Partner':'fa-store', 'Instructor':'fa-chalkboard-teacher', 'admin':'fa-shield-alt', 'Admin':'fa-shield-alt' };
      const desc = { 'Operator':'For photographers & videographers', 'Partner':'For stores & training programs', 'Instructor':'For working photographers who teach', 'admin':'System administrator', 'Admin':'System administrator' };
      roles.forEach(role => {
        const card = document.createElement('div');
        card.className = 'role-card';
        card.innerHTML = `<i class="fas ${icons[role] || 'fa-user'}"></i><h4>${role}</h4><p>${desc[role] || ''}</p>`;
        card.addEventListener('click', () => {
          const data = JSON.parse(localStorage.getItem('cameras_decoded_user') || '{}');
          data.selectedRole = role;
          localStorage.setItem('cameras_decoded_user', JSON.stringify(data));
          redirectToDashboard(role, uid);
        });
        grid.appendChild(card);
      });
    }

    // Particles animation
    (function() {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      let w, h, particles = [];
      const count = 80;
      function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize); resize();
      class Particle {
        constructor() { this.x = Math.random()*w; this.y = Math.random()*h; this.size = Math.random()*2+0.5; this.speedX = (Math.random()-0.5)*0.3; this.speedY = (Math.random()-0.5)*0.3; this.opacity = Math.random()*0.3+0.05; }
        update() { this.x += this.speedX; this.y += this.speedY; if (this.x<0||this.x>w) this.speedX*=-1; if (this.y<0||this.y>h) this.speedY*=-1; }
        draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fillStyle = `rgba(141,235,0,${this.opacity})`; ctx.fill(); }
      }
      for (let i=0;i<count;i++) particles.push(new Particle());
      function animate() { ctx.clearRect(0,0,w,h); particles.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(animate); }
      animate();
    })();
  </script>
</body>
</html>
