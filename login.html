<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Cameras Decoded</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --green: #8deb00;
      --green-dim: rgba(141, 235, 0, 0.06);
      --green-glow: rgba(141, 235, 0, 0.15);
      --card-bg: rgba(12, 12, 14, 0.92);
      --border: rgba(255, 255, 255, 0.06);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --text-muted: rgba(255, 255, 255, 0.35);
      --radius: 16px;
      --radius-sm: 10px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #08080a;
      background-image: radial-gradient(ellipse at 30% 20%, rgba(141,235,0,0.04) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(141,235,0,0.02) 0%, transparent 50%),
                        radial-gradient(rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px;
      color: var(--text-primary);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .login-card {
      max-width: 400px;
      width: 100%;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 48px 36px 40px;
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      animation: fadeSlide 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeSlide {
      0% { opacity:0; transform:translateY(20px) scale(0.98); }
      100% { opacity:1; transform:translateY(0) scale(1); }
    }
    .login-header { text-align:center; margin-bottom:32px; }
    .login-header .logo-image { display:block; max-height:110px; width:auto; margin:0 auto 16px; object-fit:contain; }
    .login-header h1 { font-family:'Space Mono',monospace; font-size:22px; font-weight:700; color:var(--text-primary); letter-spacing:-0.5px; }
    .login-header p { font-size:14px; color:var(--text-secondary); margin-top:4px; font-weight:300; }
    .social-buttons { display:flex; flex-direction:column; gap:10px; margin-bottom:24px; }
    .btn-social {
      width:100%; padding:12px 16px; border:1px solid var(--border); border-radius:var(--radius-sm);
      background:rgba(255,255,255,0.02); color:var(--text-secondary); font-family:'Montserrat',sans-serif;
      font-size:13px; font-weight:500; cursor:pointer; transition:all 0.25s ease;
      display:flex; align-items:center; justify-content:center; gap:12px;
    }
    .btn-social:hover { border-color:rgba(141,235,0,0.25); color:var(--text-primary); transform:translateY(-1px); }
    .btn-social .social-icon { display:flex; align-items:center; justify-content:center; width:20px; height:20px; flex-shrink:0; }
    .divider {
      display:flex; align-items:center; gap:16px; margin:20px 0 22px;
      color:var(--text-muted); font-size:11px; font-family:'Space Mono',monospace; letter-spacing:0.5px; text-transform:uppercase;
    }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
    .form-group { margin-bottom:18px; }
    .form-group label { display:block; color:var(--text-secondary); font-size:11px; font-family:'Space Mono',monospace; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:5px; }
    .form-group input {
      width:100%; padding:12px 16px; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:var(--radius-sm);
      color:var(--text-primary); font-family:'Montserrat',sans-serif; font-size:15px; outline:none; transition:all 0.3s ease;
    }
    .form-group input:focus { border-color:rgba(141,235,0,0.3); box-shadow:0 0 30px rgba(141,235,0,0.03); background:rgba(255,255,255,0.05); }
    .form-row { display:flex; justify-content:space-between; align-items:center; margin-top:4px; margin-bottom:20px; }
    .forgot-link { color:var(--text-muted); font-size:12px; font-family:'Space Mono',monospace; text-decoration:none; transition:color 0.2s; cursor:pointer; }
    .forgot-link:hover { color:var(--green); }
    .btn-login {
      width:100%; padding:14px; background:var(--green); border:none; border-radius:var(--radius-sm);
      color:#000; font-family:'Space Mono',monospace; font-weight:700; font-size:14px; cursor:pointer;
      transition:all 0.3s ease; margin-top:4px; letter-spacing:0.3px;
    }
    .btn-login:hover { background:#a0f520; box-shadow:0 0 40px rgba(141,235,0,0.15); transform:scale(1.01); }
    .btn-login:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
    .error-msg { color:#ff4d4d; margin-top:14px; display:none; font-size:13px; text-align:center; }
    .login-footer { margin-top:24px; text-align:center; }
    .login-footer a { color:var(--text-secondary); font-size:13px; text-decoration:none; transition:color 0.2s; }
    .login-footer a:hover { color:var(--green); }
    .login-footer .sep { color:var(--text-muted); margin:0 8px; font-size:12px; }
    .login-footer .home-link { display:block; margin-top:14px; color:var(--text-muted); font-size:12px; font-family:'Space Mono',monospace; letter-spacing:0.3px; }
    #resetOverlay {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px); z-index:999;
      align-items:center; justify-content:center;
    }
    #resetOverlay.show { display:flex; }
    .reset-modal {
      background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius);
      padding:32px 28px; max-width:380px; width:90%; position:relative;
    }
    .reset-modal h3 { font-family:'Space Mono',monospace; color:var(--green); font-size:18px; text-align:center; margin-bottom:8px; }
    .reset-modal p { color:var(--text-secondary); font-size:13px; text-align:center; margin-bottom:18px; }
    .reset-modal .btn-close-reset { position:absolute; top:12px; right:16px; background:none; border:none; color:var(--text-muted); font-size:20px; cursor:pointer; }
    .reset-modal .btn-close-reset:hover { color:#fff; }
    #toast-container {
      position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:9999;
      display:flex; flex-direction:column; gap:10px; align-items:center; pointer-events:none;
    }
    .toast {
      background:#0A0A0A; border:1px solid var(--green); color:#fff;
      font-family:'Space Mono',monospace; font-size:13px; padding:12px 24px;
      border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,0.6);
      opacity:0; transform:translateY(-10px); transition:all 0.3s ease; pointer-events:auto; text-align:center;
    }
    .toast.show { opacity:1; transform:translateY(0); }
    .toast.error { border-color:#ff4a4a; }
  </style>
</head>
<body>
  <div id="toast-container"></div>

  <div class="login-card">
    <div id="loginFormContainer">
      <div class="login-header">
        <img src="cameras-decoded-logo.png" alt="Cameras Decoded" class="logo-image" />
        <h1>Welcome back</h1>
        <p>Access your command center</p>
      </div>

      <div class="social-buttons">
        <button class="btn-social" id="googleLogin">
          <span class="social-icon"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.38-3.09 1.03-4.41l-7.98-6.19C.92 17.05 0 20.41 0 24c0 3.59.92 6.95 2.56 9.81l7.97-6.22z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg></span>
          <span>Sign in with Google</span>
        </button>
        <button class="btn-social" id="facebookLogin">
          <span class="social-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg></span>
          <span>Sign in with Facebook</span>
        </button>
      </div>

      <div class="divider">or</div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>
        <div class="form-row">
          <span></span>
          <span class="forgot-link" id="forgotPass">Forgot password?</span>
        </div>
        <button type="submit" class="btn-login" id="loginBtn">Access Dashboard</button>
        <div id="errorMsg" class="error-msg"></div>
      </form>

      <div class="login-footer">
        <a href="signup.html">No account? Sign up</a>
        <span class="sep">·</span>
        <a href="https://camerasdecoded.com" class="home-link"><i class="fas fa-arrow-left"></i> Return to Cameras Decoded</a>
      </div>
    </div>
  </div>

  <!-- Reset Overlay -->
  <div id="resetOverlay">
    <div class="reset-modal">
      <button class="btn-close-reset" id="closeReset">&times;</button>
      <h3>Reset Password</h3>
      <p>Enter your email address and we'll send you a link to reset your password.</p>
      <div class="form-group">
        <input type="email" id="resetEmail" placeholder="you@example.com" />
      </div>
      <button class="btn-login" id="sendResetBtn">Send Reset Link</button>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script>
    // ---- Firebase Init ----
    const firebaseConfig = {
      apiKey: "AIzaSyB95Vx0i8W6WNfUy1N4TNQyfN5xCxQYnz8",
      authDomain: "cameras-decoded.firebaseapp.com",
      projectId: "cameras-decoded",
      storageBucket: "cameras-decoded.firebasestorage.app",
      messagingSenderId: "1088920052790",
      appId: "1:1088920052790:web:2177c1fb31109c1fa02497",
      measurementId: "G-YN3M01WW0B"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ---- Toast ----
    function cdToast(message, type) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'toast' + (type === 'error' ? ' error' : '');
      toast.textContent = message;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 4000);
    }

    // ---- Redirect helper ----
    async function redirectToDashboard(user) {
      const uid = user.uid;
      const doc = await db.collection('users').doc(uid).get();
      if (!doc.exists) {
        // Minimal recovery - create basic doc
        const email = user.email || '';
        const username = email ? email.split('@')[0] : 'user' + uid.slice(0,6);
        const data = {
          uid, email,
          displayName: user.displayName || '',
          username,
          role: 'Operator',
          tier: 'free',
          billingInterval: 'monthly',
          preferences: { brands: [], lenses: [], interests: [] },
          learningJourney: {},
          totalPoints: 0, level: 1, badgesEarned: [],
          dailyChallengeStreak: 0, lastChallengeDate: null, dailyChallengesCompleted: [],
          savedProtocols: [], savedCards: [], savedBlogs: [], savedPodcasts: [], savedCommunityPosts: [],
          referralCode: username,
          totalReferrals: 0, totalCommissionEarned: 0, ambassadorTier: 'signal',
          aiUsage: { total: 0, prompt: 0, snapshot: 0, ideas: 0, critique: 0 },
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          tourCompleted: false
        };
        await db.collection('users').doc(uid).set(data);
        cdToast('Account repaired. Please complete your profile.');
      }
      window.location.href = 'operator-dashboard.html';
    }

    // ---- Social Login ----
    document.getElementById('googleLogin').addEventListener('click', async () => {
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await auth.signInWithPopup(provider);
        await redirectToDashboard(result.user);
      } catch (err) {
        cdToast(err.message, 'error');
      }
    });

    document.getElementById('facebookLogin').addEventListener('click', async () => {
      try {
        const provider = new firebase.auth.FacebookAuthProvider();
        provider.addScope('email');
        provider.addScope('public_profile');
        const result = await auth.signInWithPopup(provider);
        await redirectToDashboard(result.user);
      } catch (err) {
        cdToast(err.message, 'error');
      }
    });

    // ---- Email/Password Login ----
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorEl = document.getElementById('errorMsg');
      const loginBtn = document.getElementById('loginBtn');
      errorEl.style.display = 'none';

      if (!email || !password) {
        cdToast('Please enter both email and password.', 'error');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      try {
        const cred = await auth.signInWithEmailAndPassword(email, password);
        await redirectToDashboard(cred.user);
      } catch (err) {
        let msg = err.message;
        if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
          msg = 'Invalid email or password.';
        } else if (err.code === 'auth/too-many-requests') {
          msg = 'Too many failed attempts. Try again later.';
        } else if (err.code === 'auth/network-request-failed') {
          msg = 'Network error. Check your connection.';
        }
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
        cdToast(msg, 'error');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Access Dashboard';
      }
    });

    // ---- Forgot Password ----
    document.getElementById('forgotPass').addEventListener('click', () => {
      document.getElementById('resetOverlay').classList.add('show');
      document.getElementById('resetEmail').value = document.getElementById('email').value || '';
    });
    document.getElementById('closeReset').addEventListener('click', () => {
      document.getElementById('resetOverlay').classList.remove('show');
    });
    document.getElementById('sendResetBtn').addEventListener('click', async () => {
      const email = document.getElementById('resetEmail').value.trim();
      if (!email) {
        cdToast('Please enter your email address.', 'error');
        return;
      }
      try {
        await auth.sendPasswordResetEmail(email);
        cdToast('✅ Reset link sent to ' + email);
        document.getElementById('resetOverlay').classList.remove('show');
      } catch (err) {
        cdToast(err.message, 'error');
      }
    });

    // ---- Auto-redirect if already logged in ----
    auth.onAuthStateChanged((user) => {
      if (user && window.location.pathname.includes('login.html')) {
        redirectToDashboard(user);
      }
    });

    // ---- Escape key for overlay ----
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') document.getElementById('resetOverlay').classList.remove('show');
    });

    // ---- Initial check ----
    if (auth.currentUser) {
      redirectToDashboard(auth.currentUser);
    }
  </script>
</body>
</html>
