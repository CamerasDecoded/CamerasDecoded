<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Cameras Decoded</title>
  <meta name="description" content="Access your dashboard. The signal awaits." />

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --green: #8deb00;
      --green-dim: rgba(141, 235, 0, 0.06);
      --green-glow: rgba(141, 235, 0, 0.15);
      --green-soft: rgba(141, 235, 0, 0.08);
      --card-bg: rgba(12, 12, 14, 0.92);
      --border: rgba(255, 255, 255, 0.06);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --text-muted: rgba(255, 255, 255, 0.35);
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #08080a;
      background-image:
        radial-gradient(ellipse at 30% 20%, rgba(141, 235, 0, 0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 80%, rgba(141, 235, 0, 0.02) 0%, transparent 50%),
        radial-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px;
      color: var(--text-primary);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.4;
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 48px 36px 40px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      animation: fadeSlide 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    .login-card::before {
      content: '';
      position: absolute;
      inset: -0.5px;
      border-radius: calc(var(--radius) + 0.5px);
      padding: 0.5px;
      background: conic-gradient(from var(--angle), transparent 20%, var(--green) 40%, transparent 60%, var(--green) 80%, transparent 100%);
      -webkit-mask: linear-gradient(black, black) content-box, linear-gradient(black, black) border-box;
      -webkit-mask-composite: xor;
      mask: linear-gradient(black, black) content-box, linear-gradient(black, black) border-box;
      mask-composite: exclude;
      animation: spinBorder 6s linear infinite;
      pointer-events: none;
      z-index: 0;
      opacity: 0.3;
    }

    @keyframes spinBorder {
      to { --angle: 360deg; }
    }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(20px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
    }

    .login-header .logo-image {
      display: block;
      max-height: 110px;
      width: auto;
      margin: 0 auto 16px auto;
      object-fit: contain;
    }

    .login-header h1 {
      font-family: 'Space Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .login-header p {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
      font-weight: 300;
    }

    .social-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }

    .btn-social {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-secondary);
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .btn-social:hover {
      border-color: rgba(141, 235, 0, 0.25);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 20px 0 22px;
      color: var(--text-muted);
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .form-group {
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
    }

    .form-group label {
      display: block;
      color: var(--text-secondary);
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      border-color: rgba(141, 235, 0, 0.3);
      box-shadow: 0 0 30px rgba(141, 235, 0, 0.03);
      background: rgba(255, 255, 255, 0.05);
    }

    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 40px; }
    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 16px;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--green);
      border: none;
      border-radius: var(--radius-sm);
      color: #000;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }

    .btn-login:hover {
      background: #a0f520;
      box-shadow: 0 0 40px rgba(141, 235, 0, 0.15);
      transform: scale(1.01);
    }

    .error-msg {
      color: #ff4d4d;
      margin-top: 14px;
      display: none;
      font-size: 13px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .login-footer {
      margin-top: 24px;
      text-align: center;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .login-footer a {
      color: var(--text-secondary);
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .login-footer a:hover {
      color: var(--green);
    }

    @media (max-width: 480px) {
      .login-card { padding: 32px 20px 28px; }
      .login-header h1 { font-size: 20px; }
      .login-header .logo-image { max-height: 80px; }
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <div class="login-card">
    <div class="login-header">
      <img src="cameras-decoded-logo.png" alt="Cameras Decoded" class="logo-image" />
      <h1>Welcome back</h1>
      <p>Access your command center</p>
    </div>

    <div class="social-buttons">
      <button class="btn-social" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.38-3.09 1.03-4.41l-7.98-6.19C.92 17.05 0 20.41 0 24c0 3.59.92 6.95 2.56 9.81l7.97-6.22z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span>Sign in with Google</span>
      </button>
      <button class="btn-social" onclick="signInWithFacebook()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        <span>Sign in with Facebook</span>
      </button>
    </div>

    <div class="divider">or</div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Enter your password" required />
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <p style="text-align:right; margin-top:4px; font-size:12px;"><a href="#" onclick="forgotPassword(); return false;" style="color:var(--green); text-decoration:none;">Forgot password?</a></p>
      <button type="submit" class="btn-login" id="loginBtn">Access Dashboard</button>
      <div id="errorMsg" class="error-msg"></div>
    </form>

    <div class="login-footer">
      <a href="signup.html">No account? Sign up</a>
      <a href="https://camerasdecoded.com"><i class="fas fa-arrow-left"></i> Return to Cameras Decoded</a>
    </div>
  </div>

  <div id="cd-toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script>
    // Firebase init
    const firebaseConfig = {
      apiKey: "AIzaSyB95Vx0i8W6WNfUy1N4TNQyfN5xCxQYnz8",
      authDomain: "cameras-decoded.firebaseapp.com",
      projectId: "cameras-decoded",
      storageBucket: "cameras-decoded.firebasestorage.app",
      messagingSenderId: "1088920052790",
      appId: "1:1088920052790:web:2177c1fb31109c1fa02497",
      measurementId: "G-YN3M01WW0B"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Toast
    function cdToast(message, type = 'success') {
      const container = document.getElementById('cd-toast-container');
      const toast = document.createElement('div');
      toast.className = 'cd-toast' + (type === 'error' ? ' error' : '');
      toast.textContent = message;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3500);
    }

    // Toggle password
    window.togglePasswordVisibility = function(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i class="fas fa-eye-slash"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i class="fas fa-eye"></i>';
      }
    };

    // Forgot password
    window.forgotPassword = function() {
      const email = document.getElementById('email').value.trim();
      if (!email) { cdToast('Please enter your email address.', 'error'); return; }
      auth.sendPasswordResetEmail(email)
        .then(() => cdToast('Password reset email sent!'))
        .catch(err => cdToast(err.message, 'error'));
    };

    // Social login
    window.signInWithGoogle = function() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).then(result => handleSocialLogin(result.user)).catch(err => cdToast(err.message, 'error'));
    };
    window.signInWithFacebook = function() {
      const provider = new firebase.auth.FacebookAuthProvider();
      auth.signInWithPopup(provider).then(result => handleSocialLogin(result.user)).catch(err => cdToast(err.message, 'error'));
    };

    function handleSocialLogin(user) {
      const uid = user.uid;
      db.collection('users').doc(uid).get().then(doc => {
        if (!doc.exists) {
          const username = user.email ? user.email.split('@')[0] : 'user' + uid.slice(0,6);
          const data = { name: user.displayName || '', email: user.email || '', username, role: 'Operator', tier: 'free', billingInterval: 'monthly', createdAt: firebase.firestore.FieldValue.serverTimestamp(), referralCode: username, preferences: { brands: [], lenses: [], interests: [] }, learningJourney: {}, photoURL: user.photoURL || '' };
          return db.collection('users').doc(uid).set(data).then(() => db.collection('referralCodes').doc(username).set({ uid, createdAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => {})).then(() => db.collection('users').doc(uid).get());
        }
        return doc;
      }).then(doc => {
        const data = doc.data();
        redirectToDashboard(data.role || 'Operator', uid);
      }).catch(err => cdToast(err.message, 'error'));
    }

    function redirectToDashboard(role, uid) {
      const map = { 'Operator': 'operator-dashboard.html', 'Partner': 'partner-dashboard.html', 'Instructor': 'instructor-dashboard.html', 'Admin': 'admin-dashboard.html', 'admin': 'admin-dashboard.html' };
      window.location.href = map[role] || 'operator-dashboard.html';
    }

    // Email login
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.style.display = 'none';
      if (!email || !password) { errorMsg.textContent = 'Please fill in all fields.'; errorMsg.style.display = 'block'; return; }
      auth.signInWithEmailAndPassword(email, password)
        .then(cred => {
          return db.collection('users').doc(cred.user.uid).get().then(doc => {
            if (!doc.exists) {
              const username = email.split('@')[0];
              const data = { name: cred.user.displayName || '', email, username, role: 'Operator', tier: 'free', billingInterval: 'monthly', createdAt: firebase.firestore.FieldValue.serverTimestamp(), referralCode: username, preferences: { brands: [], lenses: [], interests: [] }, learningJourney: {}, photoURL: cred.user.photoURL || '' };
              return db.collection('users').doc(cred.user.uid).set(data).then(() => db.collection('referralCodes').doc(username).set({ uid: cred.user.uid, createdAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => {})).then(() => db.collection('users').doc(cred.user.uid).get());
            }
            return doc;
          });
        })
        .then(doc => {
          const data = doc.data();
          redirectToDashboard(data.role || 'Operator', doc.id);
        })
        .catch(err => {
          errorMsg.textContent = err.message;
          errorMsg.style.display = 'block';
        });
    });

    // Particles
    (function() {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      let w, h, particles = [];
      const count = 80;
      function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize); resize();
      class Particle {
        constructor() { this.x = Math.random()*w; this.y = Math.random()*h; this.size = Math.random()*2+0.5; this.speedX = (Math.random()-0.5)*0.3; this.speedY = (Math.random()-0.5)*0.3; this.opacity = Math.random()*0.3+0.05; }
        update() { this.x += this.speedX; this.y += this.speedY; if (this.x<0||this.x>w) this.speedX*=-1; if (this.y<0||this.y>h) this.speedY*=-1; }
        draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fillStyle = `rgba(141,235,0,${this.opacity})`; ctx.fill(); }
      }
      for (let i=0;i<count;i++) particles.push(new Particle());
      function animate() { ctx.clearRect(0,0,w,h); particles.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(animate); }
      animate();
    })();
  </script>
</body>
</html>
