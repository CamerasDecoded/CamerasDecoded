<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Cameras Decoded</title>
  <style>
    body { font-family: sans-serif; background: #0a0a0a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1a1a1a; padding: 30px; border-radius: 12px; width: 340px; }
    input { width: 100%; padding: 10px; margin: 6px 0 14px; background: #2a2a2a; border: none; border-radius: 6px; color: #fff; }
    button { width: 100%; padding: 12px; background: #8deb00; border: none; border-radius: 6px; color: #000; font-weight: bold; cursor: pointer; }
    button:hover { background: #a0f520; }
    .error { color: #ff4a4a; margin-top: 10px; display: none; }
    .social-btn { background: transparent; border: 1px solid #444; color: #fff; margin-top: 6px; }
    .social-btn:hover { border-color: #8deb00; }
    .divider { text-align: center; color: #666; margin: 16px 0; }
    .forgot { text-align: right; font-size: 12px; color: #666; cursor: pointer; margin-top: -8px; margin-bottom: 12px; }
    .forgot:hover { color: #8deb00; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="color:#8deb00;">📡 Log In</h2>
    <div id="socialButtons">
      <button class="social-btn" id="googleBtn">Sign in with Google</button>
      <button class="social-btn" id="facebookBtn">Sign in with Facebook</button>
    </div>
    <div class="divider">── or ──</div>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required />
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" required />
      <div class="forgot" id="forgotPass">Forgot password?</div>
      <button type="submit" id="loginBtn">Access Dashboard</button>
      <div id="error" class="error"></div>
    </form>
    <p style="margin-top:16px; text-align:center; color:#888;">No account? <a href="signup.html" style="color:#8deb00;">Sign up</a></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB95Vx0i8W6WNfUy1N4TNQyfN5xCxQYnz8",
      authDomain: "cameras-decoded.firebaseapp.com",
      projectId: "cameras-decoded",
      storageBucket: "cameras-decoded.firebasestorage.app",
      messagingSenderId: "1088920052790",
      appId: "1:1088920052790:web:2177c1fb31109c1fa02497",
      measurementId: "G-YN3M01WW0B"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    async function goToDashboard(user) {
      const uid = user.uid;
      // Check if doc exists, create if missing (recovery)
      const doc = await db.collection('users').doc(uid).get();
      if (!doc.exists) {
        // Create minimal doc
        const email = user.email || '';
        const username = email ? email.split('@')[0] : 'user' + uid.slice(0,6);
        const data = {
          uid,
          email,
          displayName: user.displayName || '',
          username,
          role: 'Operator',
          tier: 'free',
          billingInterval: 'monthly',
          preferences: { brands: [], lenses: [], interests: [] },
          learningJourney: {},
          totalPoints: 0,
          level: 1,
          badgesEarned: [],
          dailyChallengeStreak: 0,
          lastChallengeDate: null,
          dailyChallengesCompleted: [],
          savedProtocols: [],
          savedCards: [],
          savedBlogs: [],
          savedPodcasts: [],
          savedCommunityPosts: [],
          referralCode: username,
          totalReferrals: 0,
          totalCommissionEarned: 0,
          ambassadorTier: 'signal',
          aiUsage: { total: 0, prompt: 0, snapshot: 0, ideas: 0, critique: 0 },
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          tourCompleted: false
        };
        await db.collection('users').doc(uid).set(data);
        try {
          await db.collection('referralCodes').doc(username).set({ uid, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        } catch (e) {}
      }
      window.location.href = 'operator-dashboard.html?uid=' + uid;
    }

    // Social login
    async function socialLogin(provider) {
      try {
        const result = await auth.signInWithPopup(provider);
        await goToDashboard(result.user);
      } catch (err) {
        document.getElementById('error').textContent = err.message;
        document.getElementById('error').style.display = 'block';
      }
    }

    document.getElementById('googleBtn').onclick = () => socialLogin(new firebase.auth.GoogleAuthProvider());
    document.getElementById('facebookBtn').onclick = () => {
      const p = new firebase.auth.FacebookAuthProvider();
      p.addScope('email');
      p.addScope('public_profile');
      socialLogin(p);
    };

    // Email login
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';
      if (!email || !password) {
        errorEl.textContent = 'Please enter email and password.';
        errorEl.style.display = 'block';
        return;
      }
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Logging in...';
      try {
        const cred = await auth.signInWithEmailAndPassword(email, password);
        await goToDashboard(cred.user);
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Access Dashboard';
      }
    };

    // Forgot password
    document.getElementById('forgotPass').onclick = () => {
      const email = document.getElementById('email').value.trim();
      if (!email) {
        document.getElementById('error').textContent = 'Enter your email address first.';
        document.getElementById('error').style.display = 'block';
        return;
      }
      auth.sendPasswordResetEmail(email)
        .then(() => alert('Reset link sent to ' + email))
        .catch(err => alert(err.message));
    };

    // Auto-redirect if already logged in
    auth.onAuthStateChanged((user) => {
      if (user && window.location.pathname.includes('login.html')) {
        goToDashboard(user);
      }
    });
  </script>
</body>
</html>
