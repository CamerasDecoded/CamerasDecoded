<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Cameras Decoded</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* ============================================================
       PREMIUM LOGIN – Enhanced with subtle animations & polish
       ============================================================ */
    :root {
      --green: #8deb00;
      --green-dim: rgba(141, 235, 0, 0.12);
      --green-glow: rgba(141, 235, 0, 0.25);
      --card-bg: rgba(15, 15, 15, 0.85);
      --border: #1A1A1A;
      --text-muted: #b4b4b4;
      --radius: 16px;
      --radius-sm: 8px;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: #050705;
      background-image: radial-gradient(circle at 20% 30%, rgba(141,235,0,0.12) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(141,235,0,0.08) 0%, transparent 45%),
                        linear-gradient(rgba(141,235,0,0.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(141,235,0,0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px, 24px 24px;
      background-attachment: fixed;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      margin: 0;
      animation: bodyFadeIn 0.8s ease forwards;
    }

    @keyframes bodyFadeIn {
      0% { opacity: 0; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1); }
    }

    .login-card {
      max-width: 400px;
      width: 100%;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 40px 32px;
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.4s ease,
                  border-color 0.4s ease;
      position: relative;
      overflow: hidden;
    }
    .login-card:hover {
      border-color: rgba(141, 235, 0, 0.15);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      transform: translateY(-2px);
    }

    /* ===== CHASING BORDER (subtle) ===== */
    @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
    .login-card::before {
      content: '';
      position: absolute;
      inset: -0.5px;
      border-radius: calc(var(--radius) + 0.5px);
      padding: 0.5px;
      background: conic-gradient(from var(--angle), transparent 20%, var(--green) 40%, transparent 60%, var(--green) 80%, transparent 100%);
      -webkit-mask: linear-gradient(black, black) content-box, linear-gradient(black, black) border-box;
      -webkit-mask-composite: xor;
      mask: linear-gradient(black, black) content-box, linear-gradient(black, black) border-box;
      mask-composite: exclude;
      animation: spinBorder 6s linear infinite;
      pointer-events: none;
      z-index: 0;
      opacity: 0.3;
    }
    @keyframes spinBorder { to { --angle: 360deg; } }

    .login-card > * { position: relative; z-index: 1; }

    .login-header { text-align:center; margin-bottom:28px; }
    .login-header h1 {
      font-family:'Space Mono',monospace;
      font-size:22px;
      color:var(--green);
      animation: headerSlide 0.6s ease forwards;
      opacity: 0;
      transform: translateY(-10px);
    }
    @keyframes headerSlide {
      0% { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .login-header p {
      font-size:14px;
      color:var(--text-muted);
      margin-top:4px;
      animation: headerSlide 0.6s ease 0.1s forwards;
      opacity: 0;
    }

    .form-group {
      margin-bottom:16px;
      animation: fadeUp 0.5s ease 0.2s forwards;
      opacity: 0;
      transform: translateY(8px);
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .form-group label {
      display:block;
      color:var(--text-muted);
      font-size:11px;
      font-family:'Space Mono',monospace;
      text-transform:uppercase;
      letter-spacing:0.5px;
      margin-bottom:4px;
    }
    .form-group input {
      width:100%;
      padding:12px 16px;
      background:#0F0F0F;
      border:1px solid var(--border);
      border-radius:var(--radius-sm);
      color:#fff;
      font-size:15px;
      outline:none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.3s ease;
      font-family:'Montserrat',sans-serif;
    }
    .form-group input:focus {
      border-color:var(--green);
      box-shadow: 0 0 30px rgba(141,235,0,0.06), inset 0 0 30px rgba(141,235,0,0.02);
      transform: scale(1.01);
    }
    .form-group input::placeholder { color: #555; }

    .btn-social {
      width:100%;
      padding:12px;
      background:transparent;
      border:1px solid rgba(255,255,255,0.08);
      border-radius:var(--radius-sm);
      color:#fff;
      font-size:14px;
      cursor:pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.3s ease,
                  border-color 0.3s ease;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin-bottom:6px;
      position:relative;
      overflow:hidden;
      animation: fadeUp 0.5s ease 0.15s forwards;
      opacity: 0;
      transform: translateY(8px);
    }
    .btn-social:nth-child(2) { animation-delay: 0.2s; }
    .btn-social:hover {
      border-color:rgba(141,235,0,0.3);
      background:rgba(141,235,0,0.05);
      transform: translateY(-1px) scale(1.01);
      box-shadow: 0 4px 20px rgba(141,235,0,0.05);
    }
    .btn-social:active {
      transform: scale(0.97);
      transition-duration: 0.08s;
    }

    .divider {
      display:flex;
      align-items:center;
      gap:16px;
      margin:16px 0 20px;
      color:var(--text-muted);
      font-size:11px;
      font-family:'Space Mono',monospace;
      text-transform:uppercase;
      animation: fadeUp 0.5s ease 0.25s forwards;
      opacity: 0;
      transform: translateY(8px);
    }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }

    .forgot-link {
      text-align:right;
      font-size:12px;
      color:var(--text-muted);
      cursor:pointer;
      margin-top:-4px;
      margin-bottom:12px;
      display:block;
      transition: color 0.2s ease, transform 0.2s ease;
    }
    .forgot-link:hover { color:var(--green); transform: translateX(-2px); }

    .btn-primary {
      width:100%;
      padding:14px;
      background:var(--green);
      border:none;
      border-radius:var(--radius-sm);
      color:#000;
      font-family:'Space Mono',monospace;
      font-weight:700;
      font-size:14px;
      cursor:pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.4s ease;
      margin-top:4px;
      animation: fadeUp 0.5s ease 0.3s forwards;
      opacity: 0;
      transform: translateY(8px);
    }
    .btn-primary:hover {
      background:#a0f520;
      box-shadow:0 0 40px rgba(141,235,0,0.15);
      transform: scale(1.01);
    }
    .btn-primary:active {
      transform: scale(0.97);
      transition-duration: 0.08s;
    }
    .btn-primary:disabled {
      opacity:0.5;
      cursor:not-allowed;
      transform:none !important;
    }

    .error-msg {
      color:#ff4a4a;
      margin-top:12px;
      display:none;
      font-size:13px;
      text-align:center;
      animation: fadeUp 0.3s ease forwards;
    }

    .login-footer {
      margin-top:20px;
      text-align:center;
      font-size:13px;
      color:var(--text-muted);
      animation: fadeUp 0.5s ease 0.35s forwards;
      opacity: 0;
      transform: translateY(8px);
    }
    .login-footer a {
      color:var(--green);
      text-decoration:none;
      transition: color 0.2s ease, transform 0.2s ease;
      display:inline-block;
    }
    .login-footer a:hover { color:#a0f520; transform: translateX(2px); }

    #resetOverlay {
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.7);
      backdrop-filter:blur(8px);
      z-index:999;
      align-items:center;
      justify-content:center;
      animation: fadeInOverlay 0.3s ease forwards;
    }
    @keyframes fadeInOverlay {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    #resetOverlay.show { display:flex; }
    .reset-modal {
      background:var(--card-bg);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:32px 28px;
      max-width:380px;
      width:90%;
      position:relative;
      animation: modalSlide 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes modalSlide {
      0% { opacity: 0; transform: scale(0.9) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .reset-modal h3 { font-family:'Space Mono',monospace; color:var(--green); font-size:18px; text-align:center; margin-bottom:8px; }
    .reset-modal p { color:var(--text-muted); font-size:13px; text-align:center; margin-bottom:18px; }
    .reset-modal .btn-close-reset {
      position:absolute;
      top:12px;
      right:16px;
      background:none;
      border:none;
      color:var(--text-muted);
      font-size:20px;
      cursor:pointer;
      transition: transform 0.2s ease, color 0.2s ease;
    }
    .reset-modal .btn-close-reset:hover { color:#fff; transform: rotate(90deg); }

    #toast-container {
      position:fixed;
      top:20px;
      left:50%;
      transform:translateX(-50%);
      z-index:9999;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:center;
      pointer-events:none;
    }
    .toast {
      background:#0A0A0A;
      border:1px solid var(--green);
      color:#fff;
      font-family:'Space Mono',monospace;
      font-size:13px;
      padding:12px 24px;
      border-radius:var(--radius-sm);
      box-shadow:0 4px 20px rgba(0,0,0,0.6);
      opacity:0;
      transform:translateY(-10px) scale(0.95);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events:auto;
      text-align:center;
    }
    .toast.show { opacity:1; transform:translateY(0) scale(1); }
    .toast.error { border-color:#ff4a4a; }

    @media (max-width:480px) {
      .login-card { padding:32px 20px 28px; }
      .login-header h1 { font-size:20px; }
    }
  </style>
</head>
<body>
  <div id="toast-container"></div>
  <div class="login-card">
    <div class="login-header">
      <h1>📡 Welcome back</h1>
      <p>Access your command center</p>
    </div>
    <button class="btn-social" id="googleLogin"><i class="fab fa-google"></i> Sign in with Google</button>
    <button class="btn-social" id="facebookLogin"><i class="fab fa-facebook-f"></i> Sign in with Facebook</button>
    <div class="divider">or</div>
    <form id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="you@example.com" required /></div>
      <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="••••••••" required /></div>
      <span class="forgot-link" id="forgotPass">Forgot password?</span>
      <button type="submit" class="btn-primary" id="loginBtn">Access Dashboard</button>
      <div id="errorMsg" class="error-msg"></div>
    </form>
    <div class="login-footer">
      No account? <a href="signup.html">Sign up</a>
      <span style="margin:0 8px;">·</span>
      <a href="https://camerasdecoded.com" style="color:var(--text-muted);font-size:12px;">← Home</a>
    </div>
  </div>
  <div id="resetOverlay">
    <div class="reset-modal">
      <button class="btn-close-reset" id="closeReset">&times;</button>
      <h3>Reset Password</h3>
      <p>Enter your email and we'll send you a reset link.</p>
      <div class="form-group"><input type="email" id="resetEmail" placeholder="you@example.com" /></div>
      <button class="btn-primary" id="sendResetBtn" style="margin-top:4px;">Send Reset Link</button>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script>
    // ===== ALL LOGIC IS UNCHANGED – only the UI layer is enhanced =====
    const firebaseConfig = {
      apiKey: "AIzaSyB95Vx0i8W6WNfUy1N4TNQyfN5xCxQYnz8",
      authDomain: "cameras-decoded.firebaseapp.com",
      projectId: "cameras-decoded",
      storageBucket: "cameras-decoded.firebasestorage.app",
      messagingSenderId: "1088920052790",
      appId: "1:1088920052790:web:2177c1fb31109c1fa02497",
      measurementId: "G-YN3M01WW0B"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function cdToast(msg, type) {
      const c = document.getElementById('toast-container');
      if (!c) return;
      const t = document.createElement('div');
      t.className = 'toast' + (type === 'error' ? ' error' : '');
      t.textContent = msg;
      c.appendChild(t);
      requestAnimationFrame(() => t.classList.add('show'));
      setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 4000);
    }

    function goToDashboard() { window.location.href = 'operator-dashboard.html'; }

    document.getElementById('googleLogin').onclick = () => {
      auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
        .then(() => goToDashboard())
        .catch(err => { document.getElementById('errorMsg').textContent = err.message; document.getElementById('errorMsg').style.display = 'block'; });
    };
    document.getElementById('facebookLogin').onclick = () => {
      const p = new firebase.auth.FacebookAuthProvider();
      p.addScope('email'); p.addScope('public_profile');
      auth.signInWithPopup(p)
        .then(() => goToDashboard())
        .catch(err => { document.getElementById('errorMsg').textContent = err.message; document.getElementById('errorMsg').style.display = 'block'; });
    };

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorEl = document.getElementById('errorMsg');
      errorEl.style.display = 'none';
      if (!email || !password) { errorEl.textContent = 'Please enter both.'; errorEl.style.display = 'block'; return; }
      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = 'Logging in...';
      try {
        await auth.signInWithEmailAndPassword(email, password);
        goToDashboard();
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Access Dashboard';
      }
    };

    document.getElementById('forgotPass').onclick = () => {
      const email = document.getElementById('email').value.trim();
      if (!email) { cdToast('Enter your email first.', 'error'); return; }
      auth.sendPasswordResetEmail(email).then(() => cdToast('Reset link sent to ' + email)).catch(err => cdToast(err.message, 'error'));
    };
    document.getElementById('closeReset').onclick = () => document.getElementById('resetOverlay').classList.remove('show');
    document.getElementById('sendResetBtn').onclick = async () => {
      const email = document.getElementById('resetEmail').value.trim();
      if (!email) { cdToast('Enter your email.', 'error'); return; }
      try { await auth.sendPasswordResetEmail(email); cdToast('Reset link sent.'); document.getElementById('resetOverlay').classList.remove('show'); } catch (err) { cdToast(err.message, 'error'); }
    };

    auth.onAuthStateChanged(user => { if (user && window.location.pathname.includes('login.html')) goToDashboard(); });
  </script>
</body>
</html>
