<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Cameras Decoded</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ===== BASE (matches original signup) ===== */
    :root {
      --green: #8deb00;
      --green-dim: rgba(141, 235, 0, 0.12);
      --green-glow: rgba(141, 235, 0, 0.25);
      --card-bg: rgba(15, 15, 15, 0.85);
      --border: #1A1A1A;
      --text-muted: #b4b4b4;
      --gold: #e0b12d;
      --gold-glow: rgba(224, 177, 45, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      background-image: radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 24px 24px;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* ---- Particles canvas (floating dots) ---- */
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* ---- Main container with chasing border ---- */
    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 40px 32px;
      backdrop-filter: blur(4px);
      animation: fadeSlide 0.6s ease forwards;
      border: 3px solid transparent;
      min-height: 360px;
    }

    /* ---- Chasing light border (your custom sizes) ---- */
    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    .login-wrapper::before {
      content: '';
      position: absolute;
      inset: -0.7px;
      border-radius: 24.7px;
      padding: 0.7px;
      background: conic-gradient(from var(--angle), #8deb00, #00e5ff, #a0f520, #8deb00);
      -webkit-mask: 
        linear-gradient(black, black) content-box,
        linear-gradient(black, black) border-box;
      -webkit-mask-composite: xor;
      mask: 
        linear-gradient(black, black) content-box,
        linear-gradient(black, black) border-box;
      mask-composite: exclude;
      animation: spinBorder 4s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes spinBorder {
      to { --angle: 360deg; }
    }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ---- Card contents ---- */
    .login-wrapper h1 {
      font-family: 'Space Mono', monospace;
      color: var(--green);
      margin-bottom: 30px;
      font-size: 24px;
      text-align: center;
      position: relative;
      z-index: 3;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
      position: relative;
      z-index: 3;
    }

    .input-group label {
      display: block;
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 6px;
      font-family: 'Space Mono', monospace;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      background: #0F0F0F;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      outline: none;
      transition: all 0.3s;
    }

    .input-group input:focus {
      border-color: var(--green);
      box-shadow: 0 0 20px rgba(141, 235, 0, 0.06);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--green);
      border: none;
      border-radius: 10px;
      color: #000;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 20px rgba(141, 235, 0, 0.1);
      margin-top: 10px;
      position: relative;
      z-index: 3;
    }

    .btn-login:hover {
      background: #a0f520;
      box-shadow: 0 0 40px rgba(141, 235, 0, 0.3);
      transform: scale(1.02);
    }

    .error-msg {
      color: #ff4d4d;
      margin-top: 15px;
      display: none;
      font-size: 14px;
      text-align: center;
      position: relative;
      z-index: 3;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      color: var(--text-muted);
      font-size: 13px;
      text-decoration: none;
      text-align: center;
      font-family: 'Montserrat', sans-serif;
      position: relative;
      z-index: 3;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--green);
    }

    .back-link i {
      margin-right: 6px;
    }

    /* ---- Role Selection (hidden by default) ---- */
    #roleSelection {
      display: none;
      animation: fadeSlide 0.4s ease forwards;
    }
    #roleSelection h2 {
      font-family: 'Space Mono', monospace;
      font-size: 20px;
      color: var(--green);
      margin-bottom: 8px;
      text-align: center;
    }
    #roleSelection p.sub {
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      margin-bottom: 20px;
    }
    .role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin: 12px 0 20px;
      perspective: 1200px;
    }
    .role-card {
      background: #0F0F0F;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--text-muted);
      transform-style: preserve-3d;
      transform: rotateY(0deg) scale(1);
    }
    .role-card i {
      font-size: 28px;
      color: #555;
      margin-bottom: 6px;
      transition: 0.3s;
    }
    .role-card h4 {
      font-family: 'Space Mono', monospace;
      font-size: 15px;
      color: #fff;
      margin-bottom: 2px;
    }
    .role-card p {
      font-size: 11px;
      line-height: 1.3;
      color: var(--text-muted);
    }
    .role-card:hover {
      border-color: var(--green);
      transform: rotateY(5deg) scale(1.02);
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .role-card.selected {
      border-color: var(--green);
      background: var(--green-dim);
      box-shadow: 0 0 30px rgba(141, 235, 0, 0.06);
    }
    .role-card.selected i {
      color: var(--green);
    }
    /* Highlight the most common choice (Operator) with gold glow */
    .role-card.operator-highlight {
      border-color: var(--gold);
      box-shadow: 0 0 30px var(--gold-glow), inset 0 0 30px var(--gold-glow);
    }
    .role-card.operator-highlight:hover {
      box-shadow: 0 0 50px var(--gold-glow), inset 0 0 50px var(--gold-glow);
    }
    @media (max-width: 500px) {
      .role-grid {
        grid-template-columns: 1fr;
        perspective: none;
      }
      .role-card:hover {
        transform: none;
      }
    }

    /* ---- Toast notifications ---- */
    #cd-toast-container {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      pointer-events: none;
    }

    .cd-toast {
      background: #0A0A0A;
      border: 1px solid var(--green);
      color: #ffffff;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      padding: 12px 22px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 0 15px rgba(141, 235, 0, 0.15);
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      pointer-events: auto;
      max-width: 90vw;
      text-align: center;
    }

    .cd-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .cd-toast.error {
      border-color: #ff4a4a;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 0 15px rgba(255, 74, 74, 0.15);
    }

    /* ---- Responsive ---- */
    @media (max-width: 500px) {
      .login-wrapper { padding: 30px 20px; }
    }
  </style>
</head>
<body>

  <canvas id="particles"></canvas>

  <div class="login-wrapper">
    <!-- Login Form -->
    <div id="loginFormContainer">
      <h1>LOGIN</h1>
      <form id="loginForm">
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn-login">Access Dashboard</button>
        <div id="errorMsg" class="error-msg">Invalid email or password.</div>
      </form>
      <a href="signup.html" class="back-link"><i class="fas fa-arrow-left"></i> No account? Sign Up</a>
      <a href="https://camerasdecoded.com" style="display:block; margin-top: 16px; color: var(--text-muted); font-size: 12px; text-decoration: none; font-family: 'Space Mono', monospace; transition: color 0.2s; text-align:center; position:relative; z-index:3;">
        <i class="fas fa-home"></i> Return to Cameras Decoded
      </a>
    </div>

    <!-- Role Selection (hidden initially) -->
    <div id="roleSelection">
      <h2>Choose Your Dashboard</h2>
      <p class="sub">You have multiple roles. Select which one you'd like to access.</p>
      <div class="role-grid" id="roleGrid">
        <!-- Cards will be inserted dynamically -->
      </div>
      <a href="#" class="back-link" onclick="showLoginForm(); return false;" style="margin-top:8px;"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </div>
  </div>

  <div id="cd-toast-container"></div>

  <!-- Toast helper -->
  <script>
    function cdToast(message, type) {
      const container = document.getElementById('cd-toast-container');
      const toast = document.createElement('div');
      toast.className = 'cd-toast' + (type === 'error' ? ' error' : '');
      toast.textContent = message;
      container.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.add('show');
      });
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }
  </script>

  <!-- FIREBASE COMPAT SCRIPTS -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {

      // --- Firebase Config ---
      const firebaseConfig = {
        apiKey: "AIzaSyB95Vx0i8W6WNfUy1N4TNQyfN5xCxQYnz8",
        authDomain: "cameras-decoded.firebaseapp.com",
        projectId: "cameras-decoded",
        storageBucket: "cameras-decoded.firebasestorage.app",
        messagingSenderId: "1088920052790",
        appId: "1:1088920052790:web:2177c1fb31109c1fa02497",
        measurementId: "G-YN3M01WW0B"
      };
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();

      // DOM refs
      const loginForm = document.getElementById('loginForm');
      const loginContainer = document.getElementById('loginFormContainer');
      const roleSelection = document.getElementById('roleSelection');
      const roleGrid = document.getElementById('roleGrid');
      const errorMsg = document.getElementById('errorMsg');

      // Helper to show/hide sections
      window.showLoginForm = function() {
        loginContainer.style.display = 'block';
        roleSelection.style.display = 'none';
      };

      function showRoleSelection() {
        loginContainer.style.display = 'none';
        roleSelection.style.display = 'block';
      }

      // ---- Store user data in localStorage (including referral fields) ----
      function storeUserData(userData) {
        localStorage.setItem('cameras_decoded_user', JSON.stringify(userData));
      }

      // ---- Redirect to dashboard based on selected role ----
      function redirectToDashboard(role, uid) {
        let url = '';
        if (role === 'Operator') url = 'operator-dashboard.html';
        else if (role === 'Instructor') url = 'instructor-dashboard.html';
        else url = 'partner-dashboard.html'; // Partner default
        // Check for redirect param from query string
        const params = new URLSearchParams(window.location.search);
        const redirectUrl = params.get('redirect');
        if (redirectUrl) {
          try {
            const destUrl = new URL(decodeURIComponent(redirectUrl));
            destUrl.searchParams.set('opToken', uid);
            window.location.href = destUrl.toString();
            return;
          } catch (e) {
            window.location.href = decodeURIComponent(redirectUrl);
            return;
          }
        }
        window.location.href = url;
      }

      // --- Login Form Submit ---
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        errorMsg.style.display = 'none';

        auth.signInWithEmailAndPassword(email, password)
          .then((userCredential) => {
            const uid = userCredential.user.uid;
            return db.collection('users').doc(uid).get().then((doc) => {
              if (!doc.exists) {
                throw new Error('User data not found.');
              }
              const data = doc.data();
              // Build user data object (including referral fields)
              const userData = {
                uid: uid,
                name: data.name || '',
                email: data.email || email,
                username: data.username || '',
                role: data.role || 'Operator',
                roles: data.roles || [data.role || 'Partner'],
                referralCode: data.referralCode || '',
                referredBy: data.referredBy || '',
                totalReferrals: data.totalReferrals || 0,
                totalCommissionEarned: data.totalCommissionEarned || 0,
                ambassadorTier: data.ambassadorTier || 'signal',
                // Include all other fields from Firestore
                ...data
              };
              // Store full user data in localStorage
              storeUserData(userData);

              // Determine available roles
              let availableRoles = [];
              if (userData.roles && Array.isArray(userData.roles) && userData.roles.length > 0) {
                availableRoles = userData.roles;
              } else if (userData.role) {
                availableRoles = [userData.role];
              } else {
                availableRoles = ['Partner']; // fallback
              }
              // Remove duplicates and sort
              availableRoles = [...new Set(availableRoles)];

              if (availableRoles.length === 1) {
                // Single role → redirect immediately
                redirectToDashboard(availableRoles[0], uid);
              } else {
                // Multiple roles → show selection
                showRoleSelection();
                populateRoleCards(availableRoles, uid);
              }
            });
          })
          .catch((err) => {
            errorMsg.style.display = 'block';
            errorMsg.innerText = err.message;
          });
      });

      // --- Populate role cards ---
      function populateRoleCards(roles, uid) {
        roleGrid.innerHTML = '';
        const roleIcons = {
          'Operator': 'fa-camera',
          'Partner': 'fa-store',
          'Instructor': 'fa-chalkboard-teacher'
        };
        const roleDescriptions = {
          'Operator': 'For photographers & videographers',
          'Partner': 'For stores & training programs',
          'Instructor': 'For working photographers who teach'
        };
        roles.forEach(role => {
          const card = document.createElement('div');
          card.className = 'role-card' + (role === 'Operator' ? ' operator-highlight' : '');
          card.innerHTML = `
            <i class="fas ${roleIcons[role] || 'fa-user'}"></i>
            <h4>${role}</h4>
            <p>${roleDescriptions[role] || ''}</p>
          `;
          card.addEventListener('click', () => {
            // Store selected role in user data
            const userData = JSON.parse(localStorage.getItem('cameras_decoded_user') || '{}');
            userData.selectedRole = role;
            storeUserData(userData);
            redirectToDashboard(role, uid);
          });
          roleGrid.appendChild(card);
        });
      }

      // --- Particles (floating dots) ---
      (function() {
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let w, h;
        const particles = [];
        const count = 120;

        function resize() {
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
          constructor() {
            this.x = Math.random() * w;
            this.y = Math.random() * h;
            this.size = Math.random() * 2.5 + 0.5;
            this.speedX = (Math.random() - 0.5) * 0.4;
            this.speedY = (Math.random() - 0.5) * 0.4;
            this.opacity = Math.random() * 0.4 + 0.1;
          }
          update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > w) this.speedX *= -1;
            if (this.y < 0 || this.y > h) this.speedY *= -1;
          }
          draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(141,235,0,${this.opacity})`;
            ctx.fill();
          }
        }

        for (let i = 0; i < count; i++) particles.push(new Particle());

        function animate() {
          ctx.clearRect(0, 0, w, h);
          particles.forEach(p => { p.update(); p.draw(); });
          requestAnimationFrame(animate);
        }
        animate();
      })();

    });
  </script>
</body>
</html>
