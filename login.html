<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Cameras Decoded</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div id="toast-container"></div>

  <div class="login-card" style="max-width:400px;margin:auto;background:var(--card-bg);border-radius:var(--radius);padding:40px 32px;border:1px solid var(--border);">
    <div style="text-align:center;margin-bottom:24px;">
      <h1 style="font-family:'Space Mono',monospace;color:var(--green);font-size:24px;">Welcome Back</h1>
      <p style="color:var(--text-muted);font-size:14px;">Access your command center</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px;">
      <button class="btn-social" id="googleLogin"><i class="fab fa-google"></i> Sign in with Google</button>
      <button class="btn-social" id="facebookLogin"><i class="fab fa-facebook-f"></i> Sign in with Facebook</button>
    </div>

    <div style="display:flex;align-items:center;gap:16px;margin:16px 0;color:var(--text-muted);font-size:11px;font-family:'Space Mono',monospace;">
      <hr style="flex:1;border:none;border-top:1px solid var(--border);" />
      <span>or</span>
      <hr style="flex:1;border:none;border-top:1px solid var(--border);" />
    </div>

    <form id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="you@example.com" required /></div>
      <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Enter your password" required /></div>
      <button type="submit" class="btn-primary" style="width:100%;">Access Dashboard</button>
      <div id="loginError" style="color:#ff4a4a;margin-top:12px;display:none;"></div>
    </form>

    <div style="margin-top:20px;text-align:center;">
      <a href="signup.html" style="color:var(--green);font-size:13px;">No account? Sign up</a>
      <span style="color:var(--text-muted);margin:0 8px;">·</span>
      <a href="#" id="forgotPass" style="color:var(--text-muted);font-size:13px;">Forgot password?</a>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './js/firebase-init.js';
    import { signInWithGoogle, signInWithFacebook, loginWithEmail, sendPasswordReset } from './js/auth.js';
    import { cdToast, initParticles } from './js/ui-helpers.js';

    initParticles();

    const emailInput = document.getElementById('email');
    const passInput = document.getElementById('password');
    const errorEl = document.getElementById('loginError');

    document.getElementById('googleLogin').addEventListener('click', async () => {
      try {
        const user = await signInWithGoogle();
        await handleLogin(user);
      } catch (e) {}
    });

    document.getElementById('facebookLogin').addEventListener('click', async () => {
      try {
        const user = await signInWithFacebook();
        await handleLogin(user);
      } catch (e) {}
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';
      try {
        const user = await loginWithEmail(emailInput.value, passInput.value);
        await handleLogin(user);
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    });

    document.getElementById('forgotPass').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = emailInput.value;
      if (!email) { cdToast('Please enter your email address.', 'error'); return; }
      try {
        await sendPasswordReset(email);
        cdToast('Reset link sent to ' + email);
      } catch (err) {
        cdToast(err.message, 'error');
      }
    });

    async function handleLogin(user) {
      const uid = user.uid;
      const doc = await db.collection('users').doc(uid).get();
      if (!doc.exists) {
        cdToast('User document not found. Please sign up first.', 'error');
        return;
      }
      const data = doc.data();
      const role = data.role || 'Operator';
      if (role === 'Operator') window.location.href = 'operator-dashboard.html?uid=' + uid;
      else if (role === 'Partner') window.location.href = 'partner-dashboard.html?uid=' + uid;
      else if (role === 'Instructor') window.location.href = 'instructor-dashboard.html?uid=' + uid;
      else window.location.href = 'operator-dashboard.html?uid=' + uid;
    }

    // Auto-redirect if already logged in
    auth.onAuthStateChanged((user) => {
      if (user) {
        // Check if we are on the login page
        if (window.location.pathname.includes('login.html')) {
          handleLogin(user);
        }
      }
    });
  </script>
</body>
</html>
