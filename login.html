<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Cameras Decoded</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ===== BASE (matches original signup) ===== */
    :root {
      --green: #8deb00;
      --green-dim: rgba(141, 235, 0, 0.12);
      --green-glow: rgba(141, 235, 0, 0.25);
      --card-bg: rgba(15, 15, 15, 0.85);
      --border: #1A1A1A;
      --text-muted: #b4b4b4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      background-image: radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 24px 24px;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* ---- Particles canvas (floating dots, not binary rain) ---- */
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* ---- Main container with chasing border ---- */
    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 40px 32px;
      backdrop-filter: blur(4px);
      animation: fadeSlide 0.6s ease forwards;
      border: 3px solid transparent;
    }

    /* ---- Chasing light border (your custom sizes) ---- */
    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    .login-wrapper::before {
      content: '';
      position: absolute;
      inset: -0.7px;          /* your inset */
      border-radius: 24.7px;   /* 24 + 0.7 */
      padding: 0.7px;          /* border thickness */
      background: conic-gradient(from var(--angle), #8deb00, #00e5ff, #a0f520, #8deb00);
      -webkit-mask: 
        linear-gradient(black, black) content-box,
        linear-gradient(black, black) border-box;
      -webkit-mask-composite: xor;
      mask: 
        linear-gradient(black, black) content-box,
        linear-gradient(black, black) border-box;
      mask-composite: exclude;
      animation: spinBorder 4s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes spinBorder {
      to { --angle: 360deg; }
    }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ---- Card contents ---- */
    .login-wrapper h1 {
      font-family: 'Space Mono', monospace;
      color: var(--green);
      margin-bottom: 30px;
      font-size: 24px;
      text-align: center;
      position: relative;
      z-index: 3;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
      position: relative;
      z-index: 3;
    }

    .input-group label {
      display: block;
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 6px;
      font-family: 'Space Mono', monospace;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      background: #0F0F0F;   /* solid */
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      outline: none;
      transition: all 0.3s;
    }

    .input-group input:focus {
      border-color: var(--green);
      box-shadow: 0 0 20px rgba(141, 235, 0, 0.06);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--green);
      border: none;
      border-radius: 10px;
      color: #000;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 20px rgba(141, 235, 0, 0.1);
      margin-top: 10px;
      position: relative;
      z-index: 3;
    }

    .btn-login:hover {
      background: #a0f520;
      box-shadow: 0 0 40px rgba(141, 235, 0, 0.3);
      transform: scale(1.02);
    }

    .error-msg {
      color: #ff4d4d;
      margin-top: 15px;
      display: none;
      font-size: 14px;
      text-align: center;
      position: relative;
      z-index: 3;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      color: var(--text-muted);
      font-size: 13px;
      text-decoration: none;
      text-align: center;
      font-family: 'Montserrat', sans-serif;
      position: relative;
      z-index: 3;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--green);
    }

    .back-link i {
      margin-right: 6px;
    }

    /* ---- Toast notifications ---- */
    #cd-toast-container {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      pointer-events: none;
    }

    .cd-toast {
      background: #0A0A0A;
      border: 1px solid var(--green);
      color: #ffffff;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      padding: 12px 22px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 0 15px rgba(141, 235, 0, 0.15);
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      pointer-events: auto;
      max-width: 90vw;
      text-align: center;
    }

    .cd-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .cd-toast.error {
      border-color: #ff4a4a;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 0 15px rgba(255, 74, 74, 0.15);
    }

    /* ---- Responsive ---- */
    @media (max-width: 500px) {
      .login-wrapper { padding: 30px 20px; }
    }
  </style>
</head>
<body>

  <!-- Particles Canvas (floating dots, not binary rain) -->
  <canvas id="particles"></canvas>

  <!-- Main Login Card -->
  <div class="login-wrapper">
    <h1>LOGIN</h1>
    <form id="loginForm">
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn-login">Access Dashboard</button>
      <div id="errorMsg" class="error-msg">Invalid email or password.</div>
    </form>
    <a href="signup.html" class="back-link"><i class="fas fa-arrow-left"></i> No account? Sign Up</a>
    <a href="https://camerasdecoded.com" style="display:block; margin-top: 16px; color: var(--text-muted); font-size: 12px; text-decoration: none; font-family: 'Space Mono', monospace; transition: color 0.2s; text-align:center; position:relative; z-index:3;">
      <i class="fas fa-home"></i> Return to Cameras Decoded
    </a>
  </div>

  <!-- Toast Container -->
  <div id="cd-toast-container"></div>

  <!-- Toast helper -->
  <script>
    function cdToast(message, type) {
      const container = document.getElementById('cd-toast-container');
      const toast = document.createElement('div');
      toast.className = 'cd-toast' + (type === 'error' ? ' error' : '');
      toast.textContent = message;
      container.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.add('show');
      });
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }
  </script>

  <!-- FIREBASE COMPAT SCRIPTS -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {

      // --- Firebase Config ---
      const firebaseConfig = {
        apiKey: "AIzaSyB95Vx0i8W6WNfUy1N4TNQyfN5xCxQYnz8",
        authDomain: "cameras-decoded.firebaseapp.com",
        projectId: "cameras-decoded",
        storageBucket: "cameras-decoded.firebasestorage.app",
        messagingSenderId: "1088920052790",
        appId: "1:1088920052790:web:2177c1fb31109c1fa02497",
        measurementId: "G-YN3M01WW0B"
      };
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();

      // --- Login Form Submit ---
      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const error = document.getElementById('errorMsg');
        let loggedInUid = null;

        auth.signInWithEmailAndPassword(email, password)
          .then((userCredential) => {
            error.style.display = 'none';
            loggedInUid = userCredential.user.uid;
            return db.collection('users').doc(loggedInUid).get();
          })
          .then((doc) => {
            // Check for redirect parameter
            const params = new URLSearchParams(window.location.search);
            const redirectUrl = params.get('redirect');
            if (redirectUrl) {
              try {
                const destUrl = new URL(decodeURIComponent(redirectUrl));
                destUrl.searchParams.set('opToken', loggedInUid);
                window.location.href = destUrl.toString();
              } catch (e) {
                window.location.href = decodeURIComponent(redirectUrl);
              }
              return;
            }

            if (doc.exists) {
              const userRole = doc.data().role || 'Partner';
              if(userRole === 'Instructor') {
                window.location.href = 'instructor-dashboard.html';
              } else if(userRole === 'Operator') {
                window.location.href = 'operator-dashboard.html';
              } else {
                window.location.href = 'partner-dashboard.html';
              }
            } else {
              cdToast('Account data not found. Please contact support.', 'error');
            }
          })
          .catch((err) => {
            error.style.display = 'block';
            error.innerText = err.message;
          });
      });

      // --- Particles (floating dots, same as signup) ---
      (function() {
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let w, h;
        const particles = [];
        const count = 120;

        function resize() {
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
          constructor() {
            this.x = Math.random() * w;
            this.y = Math.random() * h;
            this.size = Math.random() * 2.5 + 0.5;
            this.speedX = (Math.random() - 0.5) * 0.4;
            this.speedY = (Math.random() - 0.5) * 0.4;
            this.opacity = Math.random() * 0.4 + 0.1;
          }
          update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > w) this.speedX *= -1;
            if (this.y < 0 || this.y > h) this.speedY *= -1;
          }
          draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(141,235,0,${this.opacity})`;
            ctx.fill();
          }
        }

        for (let i = 0; i < count; i++) particles.push(new Particle());

        function animate() {
          ctx.clearRect(0, 0, w, h);
          particles.forEach(p => { p.update(); p.draw(); });
          requestAnimationFrame(animate);
        }
        animate();
      })();

    });
  </script>
</body>
</html>
