<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Cameras Decoded</title>
  <meta name="description" content="Access your dashboard. The signal awaits." />

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --green: #8deb00;
      --green-dim: rgba(141, 235, 0, 0.06);
      --green-glow: rgba(141, 235, 0, 0.15);
      --green-soft: rgba(141, 235, 0, 0.08);
      --card-bg: rgba(12, 12, 14, 0.92);
      --border: rgba(255, 255, 255, 0.06);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --text-muted: rgba(255, 255, 255, 0.35);
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #08080a;
      background-image:
        radial-gradient(ellipse at 30% 20%, rgba(141, 235, 0, 0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 80%, rgba(141, 235, 0, 0.02) 0%, transparent 50%),
        radial-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px;
      color: var(--text-primary);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.4;
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 48px 36px 40px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      animation: fadeSlide 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    .login-card::before {
      content: '';
      position: absolute;
      inset: -0.5px;
      border-radius: calc(var(--radius) + 0.5px);
      padding: 0.5px;
      background: conic-gradient(from var(--angle), transparent 20%, var(--green) 40%, transparent 60%, var(--green) 80%, transparent 100%);
      -webkit-mask: linear-gradient(black, black) content-box, linear-gradient(black, black) border-box;
      -webkit-mask-composite: xor;
      mask: linear-gradient(black, black) content-box, linear-gradient(black, black) border-box;
      mask-composite: exclude;
      animation: spinBorder 6s linear infinite;
      pointer-events: none;
      z-index: 0;
      opacity: 0.3;
    }

    @keyframes spinBorder {
      to { --angle: 360deg; }
    }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(20px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
    }

    .login-header .logo-image {
      display: block;
      max-height: 110px;
      width: auto;
      margin: 0 auto 16px auto;
      object-fit: contain;
    }

    .login-header .title-image {
      display: block;
      max-width: 100%;
      max-height: 44px;
      width: auto;
      margin: 0 auto 4px auto;
      object-fit: contain;
    }

    .login-header h1 {
      font-family: 'Space Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .login-header p {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
      font-weight: 300;
    }

    .social-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }

    .btn-social {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-secondary);
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .btn-social:hover {
      border-color: rgba(141, 235, 0, 0.25);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 20px 0 22px;
      color: var(--text-muted);
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .form-group {
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
    }

    .form-group label {
      display: block;
      color: var(--text-secondary);
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      border-color: rgba(141, 235, 0, 0.3);
      box-shadow: 0 0 30px rgba(141, 235, 0, 0.03);
      background: rgba(255, 255, 255, 0.05);
    }

    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 40px; }
    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 16px;
    }

    .forgot-row {
      text-align: right;
      margin-top: 4px;
      margin-bottom: 2px;
      font-size: 12px;
      position: relative;
      z-index: 1;
    }
    .forgot-row a {
      color: var(--text-muted);
      text-decoration: none;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.3px;
      transition: color 0.2s ease;
    }
    .forgot-row a:hover { color: var(--green); }

    /* ============ FORGOT PASSWORD MODAL ============ */
    .cd-modal {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .cd-modal[hidden] { display: none; }
    .cd-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .cd-modal-card {
      position: relative;
      width: 100%;
      max-width: 340px;
      background: #0c0c0e;
      border: 1px solid rgba(141, 235, 0, 0.25);
      border-radius: var(--radius);
      padding: 32px 28px 28px;
      box-shadow: 0 0 60px rgba(141, 235, 0, 0.08), 0 20px 60px rgba(0, 0, 0, 0.6);
      animation: modalIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
    }
    @keyframes modalIn {
      0% { opacity: 0; transform: translateY(16px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .cd-modal-card h3 {
      font-family: 'Space Mono', monospace;
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .cd-modal-card p {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 300;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .cd-modal-card .form-group { text-align: left; }
    .cd-modal-msg {
      font-size: 13px;
      margin-top: 14px;
      min-height: 18px;
      font-family: 'Space Mono', monospace;
    }
    .cd-modal-msg.success { color: var(--green); }
    .cd-modal-msg.error { color: #ff4d4d; }
    .cd-modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }
    .btn-modal-primary {
      width: 100%;
      padding: 13px;
      background: var(--green);
      border: none;
      border-radius: var(--radius-sm);
      color: #000;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .btn-modal-primary:hover:not(:disabled) {
      background: #a0f520;
      box-shadow: 0 0 30px rgba(141, 235, 0, 0.2);
    }
    .btn-modal-primary:disabled { opacity: 0.6; cursor: wait; }
    .btn-modal-cancel {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      padding: 8px;
      transition: color 0.2s ease;
    }
    .btn-modal-cancel:hover { color: var(--text-secondary); }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--green);
      border: none;
      border-radius: var(--radius-sm);
      color: #000;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }

    .btn-login:hover {
      background: #a0f520;
      box-shadow: 0 0 40px rgba(141, 235, 0, 0.15);
      transform: scale(1.01);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    .error-msg {
      color: #ff4d4d;
      margin-top: 14px;
      display: none;
      font-size: 13px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    #cd-toast-container {
      position: fixed;
      top: 20px;
      top: calc(20px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      pointer-events: none;
    }
    .cd-toast {
      background: #0c0c0e;
      border: 1px solid var(--green);
      color: #fff;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      padding: 12px 24px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      pointer-events: auto;
      text-align: center;
      max-width: 90vw;
    }
    .cd-toast.show { opacity: 1; transform: translateY(0); }
    .cd-toast.error { border-color: #ff4d4d; }

    .login-footer {
      margin-top: 24px;
      text-align: center;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .login-footer a {
      color: var(--text-secondary);
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .login-footer a:hover {
      color: var(--green);
    }

    @media (max-width: 480px) {
      .login-card { padding: 32px 20px 28px; }
      .login-header h1 { font-size: 20px; }
      .login-header .logo-image { max-height: 80px; }
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <div class="login-card">
    <div class="login-header">
      <img src="/cameras-decoded-logo.png?v=20261006" alt="Cameras Decoded" class="logo-image" />
      <img src="/custom-site-titles/login.png?v=20261006" alt="Welcome back" class="title-image" onerror="this.style.display='none';this.nextElementSibling.hidden=false;" />
      <h1 hidden>Welcome back</h1>
      <p>Access your command center</p>
    </div>

    <div class="social-buttons">
      <button class="btn-social" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.38-3.09 1.03-4.41l-7.98-6.19C.92 17.05 0 20.41 0 24c0 3.59.92 6.95 2.56 9.81l7.97-6.22z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span>Sign in with Google</span>
      </button>
      <button class="btn-social" onclick="signInWithFacebook()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        <span>Sign in with Facebook</span>
      </button>
    </div>

    <div class="divider">or</div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Enter your password" required />
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <p class="forgot-row"><a href="#" id="forgotLink">Forgot password?</a></p>
      <button type="submit" class="btn-login" id="loginBtn">Access Dashboard</button>
      <div id="errorMsg" class="error-msg"></div>
    </form>

    <div class="login-footer">
      <a href="signup.html">No account? Sign up</a>
      <a href="https://camerasdecoded.com"><i class="fas fa-arrow-left"></i> Return to Cameras Decoded</a>
    </div>
  </div>

  <!-- Forgot password modal -->
  <div id="forgotModal" class="cd-modal" hidden role="dialog" aria-modal="true" aria-labelledby="forgotModalTitle">
    <div class="cd-modal-backdrop" id="forgotBackdrop"></div>
    <div class="cd-modal-card">
      <h3 id="forgotModalTitle">Reset password</h3>
      <p>Enter the email you signed up with and we'll send you a reset link.</p>
      <div class="form-group">
        <label for="resetEmail">Email address</label>
        <input type="email" id="resetEmail" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="cd-modal-msg" id="resetMsg"></div>
      <div class="cd-modal-actions">
        <button type="button" class="btn-modal-primary" id="sendResetBtn">Send reset link</button>
        <button type="button" class="btn-modal-cancel" id="forgotCancel">Cancel</button>
      </div>
    </div>
  </div>

  <div id="cd-toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script>
    // Firebase init
    const firebaseConfig = {
      apiKey: "AIzaSyB95Vx0i8W6WNfUy1N4TNQyfN5xCxQYnz8",
      authDomain: "cameras-decoded.firebaseapp.com",
      projectId: "cameras-decoded",
      storageBucket: "cameras-decoded.firebasestorage.app",
      messagingSenderId: "1088920052790",
      appId: "1:1088920052790:web:2177c1fb31109c1fa02497",
      measurementId: "G-YN3M01WW0B"
    };
    // Null-guarded: page degrades gracefully if the Firebase CDN is blocked
    var auth = null;
    var db = null;
    var hasFirebase = (typeof firebase !== 'undefined' && firebase.apps);
    if (hasFirebase) {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
    }

    // Referral capture: stash ?ref=CODE (in case this page is the landing).
    (function () {
      try {
        var m = new URLSearchParams(window.location.search).get('ref');
        if (m && /^[A-Za-z0-9_-]{1,64}$/.test(m)) localStorage.setItem('signup_referral', m);
      } catch (e) {}
    })();

    // Toast
    function cdToast(message, type = 'success') {
      const container = document.getElementById('cd-toast-container');
      const toast = document.createElement('div');
      toast.className = 'cd-toast' + (type === 'error' ? ' error' : '');
      toast.textContent = message;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3500);
    }

    // Toggle password
    window.togglePasswordVisibility = function(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i class="fas fa-eye-slash"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i class="fas fa-eye"></i>';
      }
    };

    // Canonical new-user document shape (kept in sync with signup.html).
    function buildNewUserDoc(o) {
      return {
        displayName: o.displayName || '', email: o.email || '', username: o.username || '',
        photoURL: o.photoURL || null, role: 'Operator', tier: 'free', billingInterval: 'monthly',
        preferences: { brands: [], lenses: [], interests: [] }, learningJourney: {},
        totalPoints: 0, level: 1, badgesEarned: [], dailyChallengeStreak: 0,
        lastChallengeDate: null, dailyChallengesCompleted: [], savedProtocols: [],
        savedCards: [], savedBlogs: [], savedPodcasts: [], savedCommunityPosts: [],
        referralCode: o.referralCode || '', totalReferrals: 0, totalCommissionEarned: 0,
        ambassadorTier: 'signal',
        referredBy: null, referredByCode: null,
        aiUsage: { total: 0, prompt: 0, snapshot: 0, ideas: 0, critique: 0 },
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        tourCompleted: false
      };
    }

    // ---- Username policy: lowercase, 3-24 chars, letters/numbers/._- only,
    // no leading/trailing/consecutive separators, reserved words blocked,
    // globally unique via the usernames/{name} claim collection. ----
    const USERNAME_RE = /^[a-z0-9][a-z0-9_.-]{1,22}[a-z0-9]$/;
    const USERNAME_RESERVED = ['admin','administrator','root','api','support','help','billing','login','signin','signout','signup','auth','settings','dashboard','app','system','null','undefined','test','dev','official','moderator','mod','staff','security','privacy','terms','about','contact','blog','shop','store','pro','premium','founding','founder','camerasdecoded','cameras-decoded','cynetis','cynetis-7','signalkeeper','signal-keeper'];
    function usernameProblem(u) {
      u = (u || '').toLowerCase();
      if (!USERNAME_RE.test(u)) return 'format';
      if (/[._-]{2}/.test(u)) return 'format';
      if (USERNAME_RESERVED.indexOf(u) !== -1) return 'reserved';
      return null;
    }
    // Claim usernames/{name} — Firestore rules reject when taken.
    // The claim is uid-bound and never changes hands.
    async function claimUsername(username, uid) {
      await db.collection('usernames').doc(username).set({
        uid: uid, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    // For derived usernames (social sign-in, legacy docs): sanitize the base,
    // then guarantee a claimable name with uid-suffixed fallbacks.
    async function claimUniqueUsername(rawBase, uid) {
      let base = (rawBase || '').toLowerCase().replace(/[^a-z0-9_.-]/g, '')
        .replace(/^[._-]+/, '').replace(/[._-]+$/, '').slice(0, 24);
      if (usernameProblem(base)) base = '';
      const uidHex = uid.toLowerCase().replace(/[^a-z0-9]/g, '');
      const cands = [];
      if (base) cands.push(base);
      cands.push('user' + uidHex.slice(0, 6), 'user' + uidHex.slice(0, 12));
      for (const c of cands) {
        try { await claimUsername(c, uid); return c; } catch (e) { /* taken — try next */ }
      }
      const f = ('user' + uidHex).slice(0, 24);
      await claimUsername(f, uid); return f;
    }

    // Referral codes must be unique — append -2, -3... on collision.
    async function getUniqueReferralCode(base, uid) {
      let code = (base || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 20);
      if (!code) code = 'user' + uid.slice(0, 6).toLowerCase();
      let candidate = code, n = 2;
      while (n < 100) {
        const snap = await db.collection('referralCodes').doc(candidate).get();
        if (!snap.exists || (snap.data() && snap.data().uid === uid)) return candidate;
        candidate = code + '-' + n; n++;
      }
      return code + '-' + uid.slice(0, 6).toLowerCase();
    }

    async function claimReferralCode(code, uid) {
      try {
        await db.collection('referralCodes').doc(code).set({
          uid, createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (e) { /* rules reject on collision; user doc keeps the intended code */ }
    }

    // Referral attribution: resolve the stashed ?ref= code to the referring user.
    async function resolveReferrer(uid) {
      try {
        var code = localStorage.getItem('signup_referral');
        if (!code) return null;
        var snap = await db.collection('referralCodes').doc(code).get();
        if (snap.exists && snap.data() && snap.data().uid && snap.data().uid !== uid) {
          return { code: code, uid: snap.data().uid };
        }
      } catch (e) {}
      return null;
    }

    // Credit the referrer once per completed signup; always clear the stash.
    async function creditReferrer(ref) {
      try {
        if (ref) {
          await db.collection('users').doc(ref.uid).update({
            totalReferrals: firebase.firestore.FieldValue.increment(1),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      } catch (e) {}
      try { localStorage.removeItem('signup_referral'); } catch (e) {}
    }

    // Create the users doc for auth users that don't have one yet
    // (e.g. accounts created before the doc, or via the Firebase console).
    async function ensureUserDoc(user) {
      const ref = db.collection('users').doc(user.uid);
      const doc = await ref.get();
      if (doc.exists) return doc;
      const rawBase = user.email ? user.email.split('@')[0] : (user.displayName || 'user');
      const username = await claimUniqueUsername(rawBase, user.uid);
      const referralCode = await getUniqueReferralCode(username, user.uid);
      const data = buildNewUserDoc({
        displayName: user.displayName || '', email: user.email || '',
        username, referralCode, photoURL: user.photoURL || null
      });
      const referrer = await resolveReferrer(user.uid);
      if (referrer) { data.referredBy = referrer.uid; data.referredByCode = referrer.code; }
      await ref.set(data, { merge: true });
      await claimReferralCode(referralCode, user.uid);
      await creditReferrer(referrer);
      return ref.get();
    }

    // Forgot password — mid-screen modal
    (function() {
      var modal = document.getElementById('forgotModal');
      var forgotLink = document.getElementById('forgotLink');
      var cancelBtn = document.getElementById('forgotCancel');
      var backdrop = document.getElementById('forgotBackdrop');
      var sendBtn = document.getElementById('sendResetBtn');
      var emailInput = document.getElementById('resetEmail');
      var msg = document.getElementById('resetMsg');
      if (!modal) return;

      function setMsg(text, kind) {
        msg.textContent = text;
        msg.className = 'cd-modal-msg' + (kind ? ' ' + kind : '');
      }
      function openModal() {
        // Pre-fill from the login form if the user already typed their email
        var loginEmail = document.getElementById('email');
        if (loginEmail && loginEmail.value.trim() && !emailInput.value) {
          emailInput.value = loginEmail.value.trim();
        }
        setMsg('', '');
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send reset link';
        modal.hidden = false;
        setTimeout(function() { emailInput.focus(); }, 60);
      }
      function closeModal() { modal.hidden = true; }

      forgotLink.addEventListener('click', function(e) { e.preventDefault(); openModal(); });
      cancelBtn.addEventListener('click', closeModal);
      backdrop.addEventListener('click', closeModal);
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && !modal.hidden) closeModal();
      });

      function friendlyResetError(err) {
        if (!err || !err.code) return 'Something went wrong. Please try again.';
        if (err.code === 'auth/invalid-email') return 'That email address doesn\u2019t look right.';
        if (err.code === 'auth/user-not-found') return 'No account found for that email.';
        if (err.code === 'auth/too-many-requests') return 'Too many attempts. Please wait a moment and try again.';
        return err.message || 'Something went wrong. Please try again.';
      }

      sendBtn.addEventListener('click', function() {
        var email = emailInput.value.trim();
        if (!email) { setMsg('Please enter your email address.', 'error'); return; }
        // Null-guard: degrade gracefully if Firebase didn't load
        if (typeof firebase === 'undefined' || !auth || typeof auth.sendPasswordResetEmail !== 'function') {
          setMsg('Password reset is unavailable right now. Please try again later.', 'error');
          return;
        }
        sendBtn.disabled = true;
        sendBtn.textContent = 'Sending...';
        setMsg('', '');
        auth.sendPasswordResetEmail(email)
          .then(function() {
            setMsg('Check your email for the reset link.', 'success');
            sendBtn.textContent = 'Sent';
          })
          .catch(function(err) {
            sendBtn.disabled = false;
            sendBtn.textContent = 'Send reset link';
            setMsg(friendlyResetError(err), 'error');
          });
      });
      emailInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); sendBtn.click(); }
      });
    })();

    // Social login
    window.signInWithGoogle = function() {
      if (!auth) { cdToast('Login is unavailable right now. Please try again later.', 'error'); return; }
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).then(result => handleSocialLogin(result.user)).catch(err => cdToast(err.message, 'error'));
    };
    window.signInWithFacebook = function() {
      if (!auth) { cdToast('Login is unavailable right now. Please try again later.', 'error'); return; }
      const provider = new firebase.auth.FacebookAuthProvider();
      auth.signInWithPopup(provider).then(result => handleSocialLogin(result.user)).catch(err => cdToast(err.message, 'error'));
    };

    function handleSocialLogin(user) {
      ensureUserDoc(user).then(doc => {
        const data = doc.data();
        redirectToDashboard(data.role || 'Operator', user.uid);
      }).catch(err => cdToast(err.message, 'error'));
    }

    function redirectToDashboard(role, uid) {
      const map = { 'Operator': 'operator-dashboard.html', 'Partner': 'partner-dashboard.html', 'Instructor': 'instructor-dashboard.html', 'Admin': 'admin-dashboard.html', 'admin': 'admin-dashboard.html' };
      try { sessionStorage.setItem('cd_system_online', '1'); } catch (e) {}
      // Honor a stored post-login destination (e.g. /pro-checkout.html).
      try {
        const next = sessionStorage.getItem('cd_post_login_redirect');
        if (next && next.startsWith('/') && !next.startsWith('//')) {
          sessionStorage.removeItem('cd_post_login_redirect');
          window.location.href = next;
          return;
        }
      } catch (e) {}
      window.location.href = map[role] || 'operator-dashboard.html';
    }

    // Email login
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const loginBtn = document.getElementById('loginBtn');
      errorMsg.style.display = 'none';
      if (!auth) { errorMsg.textContent = 'Login is unavailable right now. Please try again later.'; errorMsg.style.display = 'block'; return; }
      if (!email || !password) { errorMsg.textContent = 'Please fill in all fields.'; errorMsg.style.display = 'block'; return; }
      loginBtn.disabled = true;
      loginBtn.textContent = 'Accessing...';
      auth.signInWithEmailAndPassword(email, password)
        .then(cred => ensureUserDoc(cred.user))
        .then(doc => {
          const data = doc.data();
          redirectToDashboard(data.role || 'Operator', doc.id);
        })
        .catch(err => {
          loginBtn.disabled = false;
          loginBtn.textContent = 'Access Dashboard';
          let msg = err.message;
          if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
            msg = 'Incorrect email or password. Please try again.';
          } else if (err.code === 'auth/too-many-requests') {
            msg = 'Too many attempts. Please wait a moment and try again.';
          }
          errorMsg.textContent = msg;
          errorMsg.style.display = 'block';
        });
    });

    // Particles
    (function() {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      let w, h, particles = [];
      const count = 80;
      function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize); resize();
      class Particle {
        constructor() { this.x = Math.random()*w; this.y = Math.random()*h; this.size = Math.random()*2+0.5; this.speedX = (Math.random()-0.5)*0.3; this.speedY = (Math.random()-0.5)*0.3; this.opacity = Math.random()*0.3+0.05; }
        update() { this.x += this.speedX; this.y += this.speedY; if (this.x<0||this.x>w) this.speedX*=-1; if (this.y<0||this.y>h) this.speedY*=-1; }
        draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fillStyle = `rgba(141,235,0,${this.opacity})`; ctx.fill(); }
      }
      for (let i=0;i<count;i++) particles.push(new Particle());
      function animate() { ctx.clearRect(0,0,w,h); particles.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(animate); }
      animate();
    })();
  </script>
</body>
</html>
