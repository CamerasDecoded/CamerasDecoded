  <!-- FIREBASE + SAVE & LIKE LOGIC -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB95Vx0i8W6WNfUy1N4TNQyfN5xCxQYnz8",
      authDomain: "cameras-decoded.firebaseapp.com",
      projectId: "cameras-decoded",
      storageBucket: "cameras-decoded.firebasestorage.app",
      messagingSenderId: "1088920052790",
      appId: "1:1088920052790:web:2177c1fb31109c1fa02497",
      measurementId: "G-YN3M01WW0B"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const ARTICLE_ID = window.location.pathname.split('/').pop().replace('.html', '') || 'default-article';
    let currentUser = null;

    // ---------- SAVE POST ----------
    function savePost() {
      const uid = localStorage.getItem('cameras_decoded_uid');
      if (!uid) {
        localStorage.setItem('pending_save_item', JSON.stringify({ type: 'blog', itemId: ARTICLE_ID }));
        window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href);
        return;
      }

      const userRef = db.collection('users').doc(uid);
      userRef.get().then((doc) => {
        const existing = doc.exists ? (doc.data().savedBlogs || []) : [];
        if (existing.includes(ARTICLE_ID)) {
          alert('Already saved to your dashboard.');
          return;
        }
        existing.push(ARTICLE_ID);
        userRef.update({ savedBlogs: existing }).then(() => {
          alert('⭐ Saved!');
        }).catch(() => {
          userRef.set({ savedBlogs: existing }, { merge: true })
            .then(() => alert('⭐ Saved!'))
            .catch(e => console.error(e));
        });
      });
    }

    // ---------- TOGGLE LIKE (APPRECIATE) ----------
    function toggleLike() {
      if (!currentUser) {
        localStorage.setItem('pending_action', JSON.stringify({ type: 'like', articleId: ARTICLE_ID }));
        window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href);
        return;
      }

      const likeRef = db.collection('articleLikes').doc(ARTICLE_ID).collection('likes').doc(currentUser.uid);
      const articleRef = db.collection('articles').doc(ARTICLE_ID);

      db.runTransaction(async (transaction) => {
        const likeDoc = await transaction.get(likeRef);
        const articleDoc = await transaction.get(articleRef);
        if (!articleDoc.exists) {
          transaction.set(articleRef, { likeCount: 0 });
        }
        const currentLikes = articleDoc.exists ? (articleDoc.data().likeCount || 0) : 0;

        if (likeDoc.exists) {
          // Unlike
          transaction.delete(likeRef);
          transaction.update(articleRef, { likeCount: currentLikes - 1 });
          return { liked: false, newCount: currentLikes - 1 };
        } else {
          // Like
          transaction.set(likeRef, { timestamp: firebase.firestore.FieldValue.serverTimestamp() });
          transaction.update(articleRef, { likeCount: currentLikes + 1 });
          return { liked: true, newCount: currentLikes + 1 };
        }
      }).then((result) => {
        updateLikeUI(result.liked, result.newCount);
      }).catch((err) => {
        console.error('Like transaction failed:', err);
      });
    }

    function updateLikeUI(liked, count) {
      const topBtn = document.getElementById('likeBtnTop');
      const bottomBtn = document.getElementById('likeBtnBottom');
      const topCount = document.getElementById('likeCountTop');
      const bottomCount = document.getElementById('likeCountBottom');

      if (topCount) topCount.textContent = count;
      if (bottomCount) bottomCount.textContent = count;

      if (topBtn) {
        if (liked) topBtn.classList.add('liked'); else topBtn.classList.remove('liked');
      }
      if (bottomBtn) {
        if (liked) bottomBtn.classList.add('liked'); else bottomBtn.classList.remove('liked');
      }
    }

    // Initial like status and count
    function initLikeStatus() {
      const articleRef = db.collection('articles').doc(ARTICLE_ID);
      articleRef.get().then((doc) => {
        const count = doc.exists ? (doc.data().likeCount || 0) : 0;
        document.getElementById('likeCountTop').textContent = count;
        document.getElementById('likeCountBottom').textContent = count;

        if (currentUser) {
          const likeRef = db.collection('articleLikes').doc(ARTICLE_ID).collection('likes').doc(currentUser.uid);
          likeRef.get().then((likeDoc) => {
            if (likeDoc.exists) {
              document.getElementById('likeBtnTop').classList.add('liked');
              document.getElementById('likeBtnBottom').classList.add('liked');
            }
          });
        }
      });
    }

    // Auth listener
    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        localStorage.setItem('cameras_decoded_uid', user.uid);
        initLikeStatus();
      } else {
        currentUser = null;
      }
    });

    // Execute pending action after login (if applicable)
    const pending = localStorage.getItem('pending_action');
    if (pending) {
      localStorage.removeItem('pending_action');
      auth.onAuthStateChanged((user) => {
        if (user) {
          const { type, articleId } = JSON.parse(pending);
          if (type === 'like' && articleId === ARTICLE_ID) toggleLike();
        }
      });
    }

    // Mobile toggle (unchanged)
    document.addEventListener('DOMContentLoaded', function() {
      const mobileToggle = document.getElementById('mobileToggle');
      const closeToggle = document.getElementById('closeToggle');
      const navGroup = document.getElementById('navGroup');
      if (mobileToggle && closeToggle && navGroup) {
        mobileToggle.addEventListener('click', () => { navGroup.classList.add('open'); mobileToggle.style.display = 'none'; });
        closeToggle.addEventListener('click', () => { navGroup.classList.remove('open'); mobileToggle.style.display = 'block'; });
      }
    });

    // (Comment widget remains unchanged)
  </script>
