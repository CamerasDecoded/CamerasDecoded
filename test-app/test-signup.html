<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – Cameras Decoded (Test)</title>
  <meta name="description" content="Create an account for Cameras Decoded test environment.">
  <meta name="theme-color" content="#0A0A0A">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Core app -->
  <script src="/test-app/test-app.js"></script>
  <script src="/test-app/test-user-state.js"></script>
  <script src="/test-app/test-nav-header.js"></script>

  <!-- Spinner -->
  <link rel="stylesheet" href="/test-app/test-spinner.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: #050705;
      color: #fff;
    }
    .signup-container {
      max-width: 400px;
      margin: 40px auto;
      padding: 20px;
    }
    h1 {
      font-size: 28px;
      color: #8deb00;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #666;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .role-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 16px 0;
    }
    .role-buttons button {
      padding: 8px 16px;
      background: #333;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: #fff;
      font-weight: 600;
      transition: background 0.2s, color 0.2s;
    }
    .role-buttons button.selected {
      background: #8deb00;
      color: #000;
    }
    .field-group {
      margin: 12px 0;
    }
    .field-group label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
    }
    .field-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #0A0A0A;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .field-group input:focus {
      outline: none;
      border-color: #8deb00;
    }
    .field-group input.input-error {
      border-color: #ff4a4a;
    }
    .password-wrapper {
      position: relative;
    }
    .password-wrapper input {
      padding-right: 40px;
    }
    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      transition: color 0.2s;
    }
    .toggle-password:hover {
      color: #8deb00;
    }
    .field-error {
      color: #ff4a4a;
      font-size: 11px;
      margin-top: 4px;
      display: none;
    }
    .field-error.show {
      display: block;
    }
    .plan-buttons {
      display: flex;
      gap: 8px;
      margin: 16px 0;
    }
    .plan-buttons button {
      padding: 8px 20px;
      background: #333;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: #fff;
      font-weight: 600;
      transition: background 0.2s, color 0.2s;
    }
    .plan-buttons button.selected {
      background: #8deb00;
      color: #000;
    }
    .general-error {
      display: none;
      background: #ffebee;
      color: #c62828;
      padding: 10px;
      border-radius: 6px;
      margin: 12px 0;
      font-size: 13px;
    }
    .loading {
      display: none;
      text-align: center;
      padding: 10px;
      color: #666;
    }
    .btn-signup {
      width: 100%;
      padding: 14px;
      background: #8deb00;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      color: #000;
      transition: background 0.2s;
    }
    .btn-signup:hover {
      background: #a0f520;
    }
    .login-link {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #999;
    }
    .login-link a {
      color: #8deb00;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="app-nav-container"></div>

  <div class="signup-container">
    <h1>Create Account</h1>
    <p class="subtitle">Choose your path and join the network.</p>

    <!-- Role selection -->
    <div class="role-buttons" id="roleButtons">
      <button type="button" onclick="selectRole('Operator')" id="roleOperator" class="selected">Operator</button>
      <button type="button" onclick="selectRole('Partner')" id="rolePartner">Partner</button>
      <button type="button" onclick="selectRole('Instructor')" id="roleInstructor">Instructor</button>
    </div>

    <!-- Name -->
    <div class="field-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Alex Rivera" autocomplete="name" />
      <div class="field-error" id="nameError">Please enter your name.</div>
    </div>

    <!-- Email -->
    <div class="field-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      <div class="field-error" id="emailError">Please enter a valid email.</div>
    </div>

    <!-- Username -->
    <div class="field-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="alexrivera" autocomplete="username" />
      <div class="field-error" id="usernameError">Please choose a username.</div>
    </div>

    <!-- Password -->
    <div class="field-group">
      <label for="password">Password (min 6 characters)</label>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" />
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)">👁</button>
      </div>
      <div class="field-error" id="passwordError">Password must be at least 6 characters.</div>
    </div>

    <!-- Confirm Password -->
    <div class="field-group">
      <label for="confirmPassword">Confirm Password</label>
      <div class="password-wrapper">
        <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password" />
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)">👁</button>
      </div>
      <div class="field-error" id="confirmPasswordError">Passwords do not match.</div>
    </div>

    <!-- Plan -->
    <div class="plan-buttons" id="planButtons">
      <button type="button" onclick="selectTier('free')" id="tierFree" class="selected">Free</button>
      <button type="button" onclick="selectTier('pro')" id="tierPro">Pro ($24/mo)</button>
    </div>

    <div class="general-error" id="error"></div>
    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <span>Creating account...</span>
    </div>

    <button class="btn-signup" onclick="signUp()">Create Account →</button>

    <p class="login-link">
      Already have an account? <a href="/test-app/test-login.html">Log in</a>
    </p>
  </div>

  <script>
    // Toggle password visibility
    window.togglePasswordVisibility = function(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁';
      }
    };

    // Clear field error on input
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('input', function() {
        this.classList.remove('input-error');
        const errorEl = document.getElementById(this.id + 'Error');
        if (errorEl) errorEl.classList.remove('show');
      });
    });

    // No need to redefine selectRole/selectTier/signUp – they come from test-app.js
  </script>
</body>
</html>
