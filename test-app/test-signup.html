<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up (Test)</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="test-app.js"></script>
</head>
<body>
  <div style="max-width:400px;margin:40px auto;padding:20px;font-family:sans-serif;">
    <h1>Create Account (TEST)</h1>
    <p style="color:#666;">Choose your path and join the network.</p>

    <div style="margin:20px 0;">
      <label style="display:block;margin-bottom:4px;font-weight:600;">I am a...</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button type="button" onclick="selectRole('Operator')" id="roleOperator" style="padding:8px 16px;background:#8deb00;border:none;border-radius:6px;cursor:pointer;font-weight:700;">Operator</button>
        <button type="button" onclick="selectRole('Partner')" id="rolePartner" style="padding:8px 16px;background:#333;border:none;border-radius:6px;cursor:pointer;color:#fff;">Partner</button>
        <button type="button" onclick="selectRole('Instructor')" id="roleInstructor" style="padding:8px 16px;background:#333;border:none;border-radius:6px;cursor:pointer;color:#fff;">Instructor</button>
      </div>
    </div>

    <div style="margin:12px 0;">
      <label style="display:block;font-size:12px;color:#666;">Full Name</label>
      <input type="text" id="name" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;" placeholder="Alex Rivera" />
    </div>
    <div style="margin:12px 0;">
      <label style="display:block;font-size:12px;color:#666;">Email</label>
      <input type="email" id="email" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;" placeholder="you@example.com" />
    </div>
    <div style="margin:12px 0;">
      <label style="display:block;font-size:12px;color:#666;">Username</label>
      <input type="text" id="username" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;" placeholder="alexrivera" />
    </div>
    <div style="margin:12px 0;">
      <label style="display:block;font-size:12px;color:#666;">Password (min 6)</label>
      <input type="password" id="password" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;" placeholder="••••••••" />
    </div>
    <div style="margin:12px 0;">
      <label style="display:block;font-size:12px;color:#666;">Confirm Password</label>
      <input type="password" id="confirmPassword" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;" placeholder="••••••••" />
    </div>

    <div style="margin:16px 0;">
      <label style="display:block;font-size:12px;color:#666;">Plan</label>
      <div style="display:flex;gap:8px;">
        <button type="button" onclick="selectTier('free')" id="tierFree" style="padding:8px 20px;background:#8deb00;border:none;border-radius:6px;cursor:pointer;font-weight:700;">Free</button>
        <button type="button" onclick="selectTier('pro')" id="tierPro" style="padding:8px 20px;background:#333;border:none;border-radius:6px;cursor:pointer;color:#fff;">Pro ($24/mo)</button>
      </div>
    </div>

    <div id="error" style="display:none;background:#ffebee;color:#c62828;padding:10px;border-radius:6px;margin-bottom:12px;font-size:13px;"></div>
    <div id="loading" style="display:none;text-align:center;padding:10px;color:#666;">Creating account...</div>

    <button type="button" onclick="signUp()" style="width:100%;padding:14px;background:#8deb00;border:none;border-radius:8px;font-weight:700;font-size:16px;cursor:pointer;">Create Account →</button>

    <p style="text-align:center;margin-top:16px;font-size:13px;color:#999;">
      Already have an account? <a href="test-login.html" style="color:#8deb00;text-decoration:none;">Log in</a>
    </p>
  </div>
</body>

<script>
let selectedRole = 'Operator';
let selectedTier = 'free';

window.selectRole = function(role) {
  console.log('📝 Selected role:', role);
  selectedRole = role;
  
  const buttons = document.querySelectorAll('#roleOperator, #rolePartner, #roleInstructor');
  buttons.forEach(btn => {
    btn.style.background = '#333';
    btn.style.color = '#fff';
  });
  
  const selectedBtn = document.getElementById('role' + role);
  if (selectedBtn) {
    selectedBtn.style.background = '#8deb00';
    selectedBtn.style.color = '#000';
  }
};

window.selectTier = function(tier) {
  console.log('💳 Selected tier:', tier);
  selectedTier = tier;
  
  const buttons = document.querySelectorAll('#tierFree, #tierPro');
  buttons.forEach(btn => {
    btn.style.background = '#333';
    btn.style.color = '#fff';
  });
  
  const selectedBtn = document.getElementById('tier' + (tier === 'free' ? 'Free' : 'Pro'));
  if (selectedBtn) {
    selectedBtn.style.background = '#8deb00';
    selectedBtn.style.color = '#000';
  }
};

window.signUp = function() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  document.getElementById('error').style.display = 'none';
  document.getElementById('loading').style.display = 'block';

  console.log('📝 Sign-up attempt:', { name, email, username, role: selectedRole, tier: selectedTier });

  if (!name || !email || !username || !password) {
    document.getElementById('error').textContent = 'Please fill in all fields.';
    document.getElementById('error').style.display = 'block';
    document.getElementById('loading').style.display = 'none';
    return;
  }
  if (password.length < 6) {
    document.getElementById('error').textContent = 'Password must be at least 6 characters.';
    document.getElementById('error').style.display = 'block';
    document.getElementById('loading').style.display = 'none';
    return;
  }
  if (password !== confirmPassword) {
    document.getElementById('error').textContent = 'Passwords do not match.';
    document.getElementById('error').style.display = 'block';
    document.getElementById('loading').style.display = 'none';
    return;
  }

  const referralCode = username.toLowerCase().replace(/[^a-z0-9]/g, '');
  console.log('🔑 Referral code:', referralCode);

  window.auth.createUserWithEmailAndPassword(email, password)
    .then(cred => {
      const user = cred.user;
      console.log('✅ Auth user created:', user.uid);
      return user.updateProfile({ displayName: name }).then(() => user);
    })
    .then(user => {
      console.log('✅ User profile updated');
      const userData = {
        uid: user.uid,
        name,
        email,
        username,
        role: selectedRole,
        tier: selectedTier,
        createdAt: new Date().toISOString()
      };
      return window.db.collection('users').doc(user.uid).set(userData).then(() => user);
    })
    .then(user => {
      console.log('✅ User doc saved');
      document.getElementById('loading').style.display = 'none';
      cdToast('✅ Account created!');
      sessionStorage.setItem('cameras_decoded_user_role', selectedRole);
      redirectToDashboard(selectedRole, user.uid);
    })
    .catch(err => {
      console.error('❌ Signup error:', err);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').textContent = err.message;
      document.getElementById('error').style.display = 'block';
    });
};
</script>

</html>
