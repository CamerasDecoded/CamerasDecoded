<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Profile</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="test-app.js"></script>
</head>
<body>
  <div style="max-width:400px;margin:40px auto;padding:20px;font-family:sans-serif;">
    <h1>📡 Partner Profile</h1>
    <div id="loading">Loading...</div>
    <div id="content" style="display:none;">
      <div style="padding:16px;background:#f5f5f5;border-radius:8px;margin-bottom:20px;">
        <p><strong>Name:</strong> <span id="displayName">—</span></p>
        <p><strong>Email:</strong> <span id="displayEmail">—</span></p>
      </div>

      <div style="margin:12px 0;">
        <label>Company Name</label>
        <input type="text" id="companyName" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;" placeholder="Your Camera Store" />
      </div>

      <div style="margin:12px 0;">
        <label>License Tier</label>
        <select id="partnerTier" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;">
          <option value="signal">Signal – $175/mo</option>
          <option value="operator">Operator – $350/mo</option>
          <option value="enterprise">Enterprise – $725/mo</option>
        </select>
      </div>

      <div style="margin:12px 0;">
        <label>Billing</label>
        <select id="billingInterval" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;">
          <option value="monthly">Monthly</option>
          <option value="annual">Annual (save 20-30%)</option>
        </select>
      </div>

      <button onclick="saveProfile()" style="width:100%;padding:14px;background:#8deb00;border:none;border-radius:8px;font-weight:700;font-size:16px;cursor:pointer;">Save Profile →</button>
      <div id="saveError" style="color:red;margin-top:12px;display:none;"></div>
    </div>
  </div>

  <script>
    let uid = null;
    const params = new URLSearchParams(window.location.search);
    uid = params.get('uid');
    if (!uid) {
      auth.onAuthStateChanged(user => {
        if (user) { uid = user.uid; loadProfile(); }
        else { window.location.href = 'test-signup.html'; }
      });
    } else {
      loadProfile();
    }

    function loadProfile() {
      db.collection('users').doc(uid).get()
        .then(doc => {
          if (!doc.exists) { cdToast('User not found.', 'error'); return; }
          const data = doc.data();
          if (data.role !== 'Partner') {
            redirectToProfile(data.role, uid);
            return;
          }
          document.getElementById('displayName').textContent = data.name || '—';
          document.getElementById('displayEmail').textContent = data.email || '—';
          document.getElementById('companyName').value = data.companyName || '';
          document.getElementById('partnerTier').value = data.partnerTier || 'signal';
          document.getElementById('billingInterval').value = data.billingInterval || 'monthly';
          document.getElementById('loading').style.display = 'none';
          document.getElementById('content').style.display = 'block';
        });
    }

    function saveProfile() {
      const companyName = document.getElementById('companyName').value.trim();
      if (!companyName) {
        document.getElementById('saveError').textContent = 'Please enter a company name.';
        document.getElementById('saveError').style.display = 'block';
        return;
      }
      const partnerTier = document.getElementById('partnerTier').value;
      const billingInterval = document.getElementById('billingInterval').value;

      db.collection('users').doc(uid).update({
        companyName: companyName,
        partnerTier: partnerTier,
        billingInterval: billingInterval,
        tourCompleted: true,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => {
        cdToast('✅ Profile saved!');
        redirectToDashboard('Partner', uid);
      })
      .catch(err => {
        document.getElementById('saveError').textContent = err.message;
        document.getElementById('saveError').style.display = 'block';
      });
    }
  </script>
</body>
</html>
