<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In – Cameras Decoded (Test)</title>
  <meta name="description" content="Log in to Cameras Decoded test environment.">
  <meta name="theme-color" content="#0A0A0A">

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Core app -->
  <script src="/test-app/test-app.js"></script>
  <script src="/test-app/test-user-state.js"></script>
  <script src="/test-app/test-nav-header.js"></script>

  <!-- Spinner -->
  <link rel="stylesheet" href="/test-app/test-spinner.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: #050705;
      color: #fff;
    }
    .login-container {
      max-width: 400px;
      margin: 80px auto;
      padding: 20px;
    }
    h1 {
      font-size: 28px;
      color: #8deb00;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #666;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .field-group {
      margin: 16px 0;
    }
    .field-group label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
    }
    .field-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #0A0A0A;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .field-group input:focus {
      outline: none;
      border-color: #8deb00;
    }
    .field-group input.input-error {
      border-color: #ff4a4a;
    }
    .password-wrapper {
      position: relative;
    }
    .password-wrapper input {
      padding-right: 40px;
    }
    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      transition: color 0.2s;
    }
    .toggle-password:hover {
      color: #8deb00;
    }
    .field-error {
      color: #ff4a4a;
      font-size: 11px;
      margin-top: 4px;
      display: none;
    }
    .field-error.show {
      display: block;
    }
    .general-error {
      display: none;
      background: #ffebee;
      color: #c62828;
      padding: 10px;
      border-radius: 6px;
      margin: 12px 0;
      font-size: 13px;
    }
    .loading {
      display: none;
      text-align: center;
      padding: 10px;
      color: #666;
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: #8deb00;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      color: #000;
      transition: background 0.2s;
    }
    .btn-login:hover {
      background: #a0f520;
    }
    .forgot-link {
      text-align: right;
      margin-top: 4px;
      font-size: 12px;
    }
    .forgot-link a {
      color: #8deb00;
      text-decoration: none;
    }
    .signup-link {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #999;
    }
    .signup-link a {
      color: #8deb00;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div id="app-nav-container"></div>

  <div class="login-container">
    <h1>Log In</h1>
    <p class="subtitle">Welcome back to Cameras Decoded (Test)</p>

    <div class="field-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      <div class="field-error" id="emailError">Please enter a valid email.</div>
    </div>

    <div class="field-group">
      <label for="password">Password</label>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)">👁</button>
      </div>
      <div class="field-error" id="passwordError">Password is required.</div>
    </div>

    <div class="forgot-link">
      <a href="#" onclick="forgotPassword(); return false;">Forgot password?</a>
    </div>

    <div class="general-error" id="error"></div>
    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <span>Logging in...</span>
    </div>

    <button class="btn-login" onclick="login()">Log In →</button>

    <p class="signup-link">
      Don't have an account? <a href="/test-app/test-signup.html">Sign up</a>
    </p>
  </div>

  <script>
    // Toggle password visibility
    window.togglePasswordVisibility = function(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁';
      }
    };

    // Clear field error when typing
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('input', function() {
        this.classList.remove('input-error');
        const errorEl = document.getElementById(this.id + 'Error');
        if (errorEl) errorEl.classList.remove('show');
      });
    });

    window.login = function() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      let valid = true;

      // Validate email
      if (!email || !email.includes('@')) {
        document.getElementById('email').classList.add('input-error');
        document.getElementById('emailError').textContent = 'Please enter a valid email.';
        document.getElementById('emailError').classList.add('show');
        valid = false;
      }

      // Validate password
      if (!password) {
        document.getElementById('password').classList.add('input-error');
        document.getElementById('passwordError').textContent = 'Password is required.';
        document.getElementById('passwordError').classList.add('show');
        valid = false;
      }

      if (!valid) return;

      document.getElementById('error').style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      window.auth.signInWithEmailAndPassword(email, password)
        .then(cred => {
          const user = cred.user;
          return window.db.collection('users').doc(user.uid).get().then(doc => {
            if (!doc.exists) {
              throw new Error('User data not found. Please sign up first.');
            }
            const userData = doc.data();
            return { user, role: userData.role || 'Operator' };
          });
        })
        .then(({ user, role }) => {
          document.getElementById('loading').style.display = 'none';
          cdToast('✅ Welcome back!');
          sessionStorage.setItem('cameras_decoded_user_role', role);
          redirectToDashboard(role);
        })
        .catch(err => {
          console.error('❌ Login error:', err);
          document.getElementById('loading').style.display = 'none';
          document.getElementById('error').textContent = err.message;
          document.getElementById('error').style.display = 'block';
        });
    };

    window.forgotPassword = function() {
      const email = document.getElementById('email').value.trim();
      if (!email) {
        document.getElementById('email').classList.add('input-error');
        document.getElementById('emailError').textContent = 'Please enter your email address first.';
        document.getElementById('emailError').classList.add('show');
        return;
      }
      window.auth.sendPasswordResetEmail(email)
        .then(() => {
          cdToast('Password reset email sent! Check your inbox.');
        })
        .catch(err => {
          cdToast('Error: ' + err.message, 'error');
        });
    };

    document.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        login();
      }
    });
  </script>
</body>
</html>
