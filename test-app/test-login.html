<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="test-app.js"></script>
</head>
<body>
  <div style="max-width:400px;margin:80px auto;padding:20px;font-family:sans-serif;">
    <h1>Log In</h1>
    <div style="margin:12px 0;">
      <label style="display:block;font-size:12px;color:#666;">Email</label>
      <input type="email" id="email" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;" placeholder="you@example.com" />
    </div>
    <div style="margin:12px 0;">
      <label style="display:block;font-size:12px;color:#666;">Password</label>
      <input type="password" id="password" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;" placeholder="••••••••" />
    </div>
    <button onclick="login()" style="width:100%;padding:14px;background:#8deb00;border:none;border-radius:8px;font-weight:700;font-size:16px;cursor:pointer;">Log In →</button>
    <div id="error" style="color:red;margin-top:12px;display:none;"></div>
    <div style="margin-top:20px;font-size:14px;color:#666;text-align:center;">
      <a href="test-signup.html" style="color:#8deb00;text-decoration:none;">Don't have an account? Sign up</a>
    </div>
  </div>

  <script>
    function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      document.getElementById('error').style.display = 'none';

      if (!email || !password) {
        document.getElementById('error').textContent = 'Please fill in all fields.';
        document.getElementById('error').style.display = 'block';
        return;
      }

      auth.signInWithEmailAndPassword(email, password)
        .then(cred => {
          const user = cred.user;
          return db.collection('users').doc(user.uid).get();
        })
        .then(doc => {
          if (doc.exists) {
            const role = doc.data().role || 'Operator';
            redirectToDashboard(role, doc.id);
          } else {
            cdToast('User data not found.', 'error');
          }
        })
        .catch(err => {
          document.getElementById('error').textContent = err.message;
          document.getElementById('error').style.display = 'block';
        });
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        db.collection('users').doc(user.uid).get().then(doc => {
          if (doc.exists) {
            redirectToDashboard(doc.data().role || 'Operator', user.uid);
          }
        });
      }
    });
  </script>
</body>
</html>
