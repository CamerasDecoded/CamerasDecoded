<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Profile (Test)</title>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Your existing Firebase init + auth/db globals -->
  <script src="test-app.js"></script>

  <!-- NEW: user state and nav components -->
  <script src="/test-app/user-state.js"></script>
  <script src="/test-app/nav-header.js"></script>

  <style>
    .chip {
      display: inline-block;
      padding: 6px 14px;
      background: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }
    .chip.selected {
      background: #8deb00;
      border-color: #8deb00;
      color: #000;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Nav container -->
  <div id="app-nav-container"></div>

  <!-- Profile content -->
  <div style="max-width:600px;margin:40px auto;padding:20px;font-family:sans-serif;">
    <h1>📡 Complete Your Operator Profile (TEST)</h1>

    <div id="loading">Loading...</div>

    <div id="content" style="display:none;">
      <div style="padding:16px;background:#f5f5f5;border-radius:8px;margin-bottom:20px;">
        <p><strong>Name:</strong> <span id="displayName">—</span></p>
        <p><strong>Email:</strong> <span id="displayEmail">—</span></p>
        <p><strong>Role:</strong> Operator</p>
      </div>

      <div>
        <label>Brands (click to select)</label>
        <div id="brands" style="display:flex;flex-wrap:wrap;gap:6px;margin:4px 0;">
          <span class="chip" data-val="Sony" onclick="toggleChip(this)">Sony</span>
          <span class="chip" data-val="Canon" onclick="toggleChip(this)">Canon</span>
          <span class="chip" data-val="Nikon" onclick="toggleChip(this)">Nikon</span>
          <span class="chip" data-val="Fuji" onclick="toggleChip(this)">Fuji</span>
        </div>
      </div>

      <div style="margin:12px 0;">
        <label>Interests (max 3)</label>
        <div id="interests" style="display:flex;flex-wrap:wrap;gap:6px;margin:4px 0;">
          <span class="chip" data-val="Portraits" onclick="toggleChipLimit(this, 3)">Portraits</span>
          <span class="chip" data-val="Events" onclick="toggleChipLimit(this, 3)">Events</span>
          <span class="chip" data-val="Landscape" onclick="toggleChipLimit(this, 3)">Landscape</span>
          <span class="chip" data-val="Street" onclick="toggleChipLimit(this, 3)">Street</span>
        </div>
        <div style="font-size:12px;color:#666;">Selected: <span id="interestCount">0</span> / 3</div>
      </div>

      <div style="margin:12px 0;">
        <label>Primary Goal</label>
        <select id="primaryGoal" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;">
          <option value="master-manual">Master Manual Mode</option>
          <option value="start-business">Start a Business</option>
          <option value="improve-social">Improve Social Content</option>
        </select>
      </div>

      <div style="margin:12px 0;">
        <label>Confidence (1-10)</label>
        <input type="range" id="confidence" min="1" max="10" value="5" style="width:100%;" />
        <span id="confDisplay">5</span>
      </div>

      <button onclick="saveProfile()" style="width:100%;padding:14px;background:#8deb00;border:none;border-radius:8px;font-weight:700;font-size:16px;cursor:pointer;">Save Profile →</button>
      <div id="saveError" style="color:red;margin-top:12px;display:none;"></div>
    </div>
  </div>

  <!-- ===== PROFILE SCRIPT (FIXED) ===== -->
  <script>
    (function() {
      let uid = null;

      // ---- Helper: load profile data ----
      function loadProfile() {
        window.db.collection('users').doc(uid).get()
          .then(doc => {
            if (!doc.exists) {
              cdToast('User not found.', 'error');
              return;
            }
            const data = doc.data();

            // Redirect if wrong role
            if (data.role !== 'Operator') {
              redirectToDashboard(data.role, uid);
              return;
            }

            // Populate fields
            document.getElementById('displayName').textContent = data.name || '—';
            document.getElementById('displayEmail').textContent = data.email || '—';

            const prefs = data.preferences || {};
            document.querySelectorAll('#brands .chip').forEach(el => {
              if ((prefs.brands || []).includes(el.dataset.val)) el.classList.add('selected');
            });
            document.querySelectorAll('#interests .chip').forEach(el => {
              if ((prefs.interests || []).includes(el.dataset.val)) el.classList.add('selected');
            });
            document.getElementById('interestCount').textContent = (prefs.interests || []).length;

            const lj = data.learningJourney || {};
            document.getElementById('primaryGoal').value = lj.primaryGoal || 'master-manual';
            const conf = lj.confidence || 5;
            document.getElementById('confidence').value = conf;
            document.getElementById('confDisplay').textContent = conf;
            document.getElementById('confidence').oninput = function() {
              document.getElementById('confDisplay').textContent = this.value;
            };

            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
          })
          .catch(err => {
            document.getElementById('loading').textContent = 'Error: ' + err.message;
          });
      }

      // ---- Determine UID and load ----
      function initializeProfile() {
        // 1. If window.USER is already available and logged in
        if (window.USER && window.USER.isLoggedIn) {
          uid = window.USER.uid;
          loadProfile();
          return;
        }

        // 2. If URL has a uid parameter (e.g., from signup redirect)
        const params = new URLSearchParams(window.location.search);
        const urlUid = params.get('uid');
        if (urlUid) {
          // Check if we have a valid auth session
          const currentUser = firebase.auth().currentUser;
          if (currentUser && currentUser.uid === urlUid) {
            uid = urlUid;
            loadProfile();
            return;
          }
          // Fallback: wait for userStateReady to validate
        }

        // 3. Wait for user-state.js to resolve
        window.addEventListener('userStateReady', (e) => {
          const user = e.detail;
          if (user.isLoggedIn) {
            uid = user.uid;
            loadProfile();
          } else {
            // Not logged in – redirect to login
            window.location.href = '/test-app/test-login.html';
          }
        });
      }

      // Start when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeProfile);
      } else {
        initializeProfile();
      }

      // ---- Expose chip toggles ----
      window.toggleChip = function(el) {
        el.classList.toggle('selected');
      };

      window.toggleChipLimit = function(el, max) {
        const parent = el.parentElement;
        const selected = parent.querySelectorAll('.chip.selected').length;
        if (el.classList.contains('selected')) {
          el.classList.remove('selected');
        } else {
          if (selected >= max) {
            cdToast('Max ' + max + ' selections.', 'error');
            return;
          }
          el.classList.add('selected');
        }
        const countEl = document.getElementById('interestCount');
        if (countEl) countEl.textContent = parent.querySelectorAll('.chip.selected').length;
      };

      // ---- Save profile ----
      window.saveProfile = function() {
        const brands = Array.from(document.querySelectorAll('#brands .chip.selected')).map(el => el.dataset.val);
        const interests = Array.from(document.querySelectorAll('#interests .chip.selected')).map(el => el.dataset.val);
        const primaryGoal = document.getElementById('primaryGoal').value;
        const confidence = parseInt(document.getElementById('confidence').value) || 5;

        const updateData = {
          'preferences.brands': brands,
          'preferences.interests': interests,
          'learningJourney.primaryGoal': primaryGoal,
          'learningJourney.confidence': confidence,
          tourCompleted: true,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        window.db.collection('users').doc(uid).update(updateData)
          .then(() => {
            cdToast('✅ Profile saved!');
            redirectToDashboard('Operator', uid);
          })
          .catch(err => {
            document.getElementById('saveError').textContent = err.message;
            document.getElementById('saveError').style.display = 'block';
          });
      };
    })();
  </script>

  <!-- ===== FIXED REDIRECT FUNCTIONS (fallback) ===== -->
  <script>
    window.redirectToDashboard = function(role, uid) {
      const map = {
        'Operator': '/test-app/test-operator-dashboard.html',
        'Partner': '/test-app/test-partner-dashboard.html',
        'Instructor': '/test-app/test-instructor-dashboard.html'
      };
      const url = (map[role] || '/test-app/test-operator-dashboard.html') + '?uid=' + uid;
      window.location.href = url;
    };

    window.redirectToProfile = function(role, uid) {
      const map = {
        'Operator': '/test-app/test-profile.html',
        'Partner': '/test-app/test-partner-profile.html',
        'Instructor': '/test-app/test-instructor-profile.html'
      };
      const url = (map[role] || '/test-app/test-profile.html') + '?uid=' + uid;
      window.location.href = url;
    };

    window.handleLogout = function() {
      auth.signOut().then(() => {
        sessionStorage.removeItem('cameras_decoded_user_role');
        window.location.href = '/test-app/test-index.html';
      });
    };
  </script>

</body>
</html>
