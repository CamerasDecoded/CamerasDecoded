<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Profile Debug</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="test-app.js"></script>
  <script src="/test-app/user-state.js"></script>
  <script src="/test-app/nav-header.js"></script>
  <link rel="stylesheet" href="/test-app/sidebar.css">
  <script src="/test-app/sidebar.js"></script>
</head>
<body>
  <div id="app-nav-container"></div>
  <div id="sidebarContainer"></div>

  <div style="margin-left:260px;padding:20px;">
    <h1>Profile Debug</h1>
    <div id="output">Loading...</div>
    <button onclick="loadData()">Load Data</button>
  </div>

  <script>
    console.log('🔥 DEBUG SCRIPT EXECUTED');

    function loadData() {
      const user = firebase.auth().currentUser;
      if (!user) {
        document.getElementById('output').textContent = 'Not logged in';
        return;
      }
      document.getElementById('output').textContent = 'UID: ' + user.uid;
      firebase.firestore().collection('users').doc(user.uid).get()
        .then(doc => {
          if (doc.exists) {
            document.getElementById('output').textContent = 'Data: ' + JSON.stringify(doc.data(), null, 2);
          } else {
            document.getElementById('output').textContent = 'User doc not found';
          }
        })
        .catch(err => {
          document.getElementById('output').textContent = 'Error: ' + err.message;
        });
    }

    // Auto-load on page load
    if (document.readyState === 'complete') {
      loadData();
    } else {
      window.addEventListener('load', loadData);
    }
  </script>
</body>
</html>
