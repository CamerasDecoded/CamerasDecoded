<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Profile (Test)</title>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="test-app.js"></script>
  <script src="/test-app/user-state.js"></script>
  <script src="/test-app/nav-header.js"></script>
  <link rel="stylesheet" href="/test-app/sidebar.css">
  <script src="/test-app/sidebar.js"></script>
  <style>
    .chip { display:inline-block; padding:6px 14px; background:#f0f0f0; border:1px solid #ddd; border-radius:20px; font-size:13px; cursor:pointer; user-select:none; }
    .chip.selected { background:#8deb00; border-color:#8deb00; color:#000; font-weight:600; }
    .main-content { margin-left:260px; padding:20px; max-width:600px; }
    @media (max-width:768px) { .main-content { margin-left:0; padding:16px; } }
    .referral-section { margin:20px 0; padding:16px; background:#f5f5f5; border-radius:8px; border-left:4px solid #8deb00; }
    .referral-code-display { font-size:20px; font-weight:bold; background:#222; color:#8deb00; padding:4px 12px; border-radius:4px; letter-spacing:1px; display:inline-block; }
    .referral-status { font-size:13px; margin-top:6px; }
    .referral-status.available { color:#2e7d32; }
    .referral-status.taken { color:#c62828; }
    .referral-status.error { color:#e65100; }
    .copy-btn { margin-left:8px; padding:4px 12px; background:#333; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:13px; }
    .copy-btn:hover { background:#555; }
    .btn-reload { padding:6px 16px; background:#555; color:#fff; border:none; border-radius:4px; cursor:pointer; margin-left:10px; }
  </style>
</head>
<body>
  <div id="app-nav-container"></div>
  <div id="sidebarContainer"></div>

  <div class="main-content">
    <h1>📡 Complete Your Operator Profile (TEST)</h1>
    <div id="loading">
      Loading...
      <button class="btn-reload" onclick="forceLoadProfile()">↻ Load Now</button>
    </div>
    <div id="content" style="display:none;">
      <div style="padding:16px;background:#f5f5f5;border-radius:8px;margin-bottom:20px;">
        <p><strong>Name:</strong> <span id="displayName">—</span></p>
        <p><strong>Email:</strong> <span id="displayEmail">—</span></p>
        <p><strong>Role:</strong> Operator</p>
      </div>

      <!-- Referral Code Section -->
      <div class="referral-section" id="referralSection">
        <p style="font-weight:600;margin:0 0 8px 0;">🔗 Your Referral Code</p>
        <div id="referralDisplay">
          <div id="existingCodeDisplay" style="display:none;">
            <span class="referral-code-display" id="userReferralCode">—</span>
            <button class="copy-btn" onclick="copyReferralCode()">Copy</button>
          </div>
          <div id="referralSetup" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">
            <input type="text" id="newReferralCode" placeholder="Set your permanent referral code" style="padding:8px;border:1px solid #ddd;border-radius:4px;flex:1;min-width:150px;" />
            <button id="setReferralBtn" onclick="setReferralCode()" style="padding:8px 16px;background:#8deb00;border:none;border-radius:4px;cursor:pointer;font-weight:600;">Set Code</button>
          </div>
          <div id="referralStatus" class="referral-status"></div>
        </div>
      </div>

      <!-- Profile fields -->
      <div>
        <label>Brands (click to select)</label>
        <div id="brands" style="display:flex;flex-wrap:wrap;gap:6px;margin:4px 0;">
          <span class="chip" data-val="Sony" onclick="toggleChip(this)">Sony</span>
          <span class="chip" data-val="Canon" onclick="toggleChip(this)">Canon</span>
          <span class="chip" data-val="Nikon" onclick="toggleChip(this)">Nikon</span>
          <span class="chip" data-val="Fuji" onclick="toggleChip(this)">Fuji</span>
        </div>
      </div>

      <div style="margin:12px 0;">
        <label>Interests (max 3)</label>
        <div id="interests" style="display:flex;flex-wrap:wrap;gap:6px;margin:4px 0;">
          <span class="chip" data-val="Portraits" onclick="toggleChipLimit(this, 3)">Portraits</span>
          <span class="chip" data-val="Events" onclick="toggleChipLimit(this, 3)">Events</span>
          <span class="chip" data-val="Landscape" onclick="toggleChipLimit(this, 3)">Landscape</span>
          <span class="chip" data-val="Street" onclick="toggleChipLimit(this, 3)">Street</span>
        </div>
        <div style="font-size:12px;color:#666;">Selected: <span id="interestCount">0</span> / 3</div>
      </div>

      <div style="margin:12px 0;">
        <label>Primary Goal</label>
        <select id="primaryGoal" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;">
          <option value="master-manual">Master Manual Mode</option>
          <option value="start-business">Start a Business</option>
          <option value="improve-social">Improve Social Content</option>
        </select>
      </div>

      <div style="margin:12px 0;">
        <label>Confidence (1-10)</label>
        <input type="range" id="confidence" min="1" max="10" value="5" style="width:100%;" />
        <span id="confDisplay">5</span>
      </div>

      <button onclick="saveProfile()" style="width:100%;padding:14px;background:#8deb00;border:none;border-radius:8px;font-weight:700;font-size:16px;cursor:pointer;">Save Profile →</button>
      <div id="saveError" style="color:red;margin-top:12px;display:none;"></div>
    </div>
  </div>

  <script>
    console.log('🔍 Operator profile script loaded');

    let userData = null;

    // ---- Helpers ----
    async function isReferralCodeUnique(code) {
      if (!code) return false;
      try {
        const snapshot = await window.db.collection('users').where('referralCode', '==', code.toUpperCase()).get();
        return snapshot.empty;
      } catch (err) { return false; }
    }

    // ---- Core fetch + render ----
    function fetchAndRenderProfile(uid) {
      console.log('📥 fetchAndRenderProfile called for uid:', uid);
      window.db.collection('users').doc(uid).get()
        .then(doc => {
          console.log('📄 Firestore doc:', doc.exists ? 'exists' : 'not found');
          if (!doc.exists) {
            cdToast('User not found.', 'error');
            document.getElementById('loading').textContent = 'User not found.';
            return;
          }
          userData = doc.data();
          if (userData.role !== 'Operator') {
            console.log('🔀 Redirecting to dashboard for role:', userData.role);
            redirectToDashboard(userData.role);
            return;
          }
          // Populate fields
          document.getElementById('displayName').textContent = userData.name || '—';
          document.getElementById('displayEmail').textContent = userData.email || '—';

          const existingCode = userData.referralCode || null;
          if (existingCode) {
            document.getElementById('existingCodeDisplay').style.display = 'block';
            document.getElementById('userReferralCode').textContent = existingCode;
            document.getElementById('referralSetup').style.display = 'none';
            document.getElementById('referralStatus').textContent = '';
          } else {
            document.getElementById('existingCodeDisplay').style.display = 'none';
            document.getElementById('referralSetup').style.display = 'flex';
            document.getElementById('referralStatus').textContent = '';
          }

          const prefs = userData.preferences || {};
          document.querySelectorAll('#brands .chip').forEach(el => {
            if ((prefs.brands || []).includes(el.dataset.val)) el.classList.add('selected');
          });
          document.querySelectorAll('#interests .chip').forEach(el => {
            if ((prefs.interests || []).includes(el.dataset.val)) el.classList.add('selected');
          });
          document.getElementById('interestCount').textContent = (prefs.interests || []).length;

          const lj = userData.learningJourney || {};
          document.getElementById('primaryGoal').value = lj.primaryGoal || 'master-manual';
          const conf = lj.confidence || 5;
          document.getElementById('confidence').value = conf;
          document.getElementById('confDisplay').textContent = conf;
          document.getElementById('confidence').oninput = function() {
            document.getElementById('confDisplay').textContent = this.value;
          };

          document.getElementById('loading').style.display = 'none';
          document.getElementById('content').style.display = 'block';
          console.log('✅ Profile rendered successfully');
        })
        .catch(err => {
          console.error('❌ Firestore error:', err);
          document.getElementById('loading').textContent = 'Error: ' + err.message;
        });
    }

    // ---- Manual force load ----
    window.forceLoadProfile = function() {
      console.log('🔄 Manual forceLoad triggered');
      if (window.USER && window.USER.isLoggedIn) {
        // Access control check before loading
        if (!checkPageAccess()) return;
        fetchAndRenderProfile(window.USER.uid);
      } else {
        document.getElementById('loading').textContent = 'Not logged in. Please log in.';
        cdToast('Not logged in', 'error');
      }
    };

    // ---- Auto‑load using window.USER ----
    function autoLoad() {
      if (window.USER && window.USER.isLoggedIn) {
        console.log('👤 Auto‑load using window.USER');
        // 🔒 Access control
        if (!checkPageAccess()) return;
        fetchAndRenderProfile(window.USER.uid);
      } else {
        console.log('⏳ Waiting for userStateReady...');
        window.addEventListener('userStateReady', (e) => {
          if (e.detail.isLoggedIn) {
            console.log('👤 userStateReady fired');
            // 🔒 Access control
            if (!checkPageAccess()) return;
            fetchAndRenderProfile(e.detail.uid);
          } else {
            window.location.href = '/test-app/test-login.html';
          }
        });
      }
    }

    // Also try immediate auth check (in case user is already logged in)
    const immediateUser = firebase.auth().currentUser;
    if (immediateUser) {
      console.log('👤 Immediate auth check: logged in');
      if (checkPageAccess()) {
        fetchAndRenderProfile(immediateUser.uid);
      }
    } else {
      // Start normal flow
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', autoLoad);
      } else {
        autoLoad();
      }
    }

    // ---- Referral functions ----
    window.setReferralCode = async function() {
      const input = document.getElementById('newReferralCode');
      const code = input.value.trim().toUpperCase();
      const status = document.getElementById('referralStatus');
      const btn = document.getElementById('setReferralBtn');

      if (!code || !/^[A-Z0-9]{3,20}$/.test(code)) {
        status.textContent = '⚠️ Use 3-20 letters/numbers.';
        status.className = 'referral-status error';
        return;
      }
      if (!window.USER || !window.USER.isLoggedIn) {
        status.textContent = '❌ Not logged in.';
        status.className = 'referral-status error';
        cdToast('Not logged in', 'error');
        return;
      }
      const uid = window.USER.uid;

      try {
        const unique = await isReferralCodeUnique(code);
        if (!unique) {
          status.textContent = '❌ Already taken.';
          status.className = 'referral-status taken';
          return;
        }
      } catch (err) {
        status.textContent = '⚠️ Error checking.';
        status.className = 'referral-status error';
        return;
      }

      btn.disabled = true;
      status.textContent = 'Saving...';
      try {
        await window.db.collection('users').doc(uid).update({
          referralCode: code,
          referralCodeSetAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        window.USER.referralCode = code;
        sessionStorage.setItem('user_state', JSON.stringify(window.USER));
        userData.referralCode = code;
        document.getElementById('existingCodeDisplay').style.display = 'block';
        document.getElementById('userReferralCode').textContent = code;
        document.getElementById('referralSetup').style.display = 'none';
        status.textContent = '✅ Referral code set!';
        status.className = 'referral-status available';
        cdToast('Referral code set!');
      } catch (err) {
        console.error('❌ Firestore write error:', err);
        status.textContent = '❌ Error saving: ' + err.message;
        status.className = 'referral-status error';
        btn.disabled = false;
      }
    };

    window.copyReferralCode = function() {
      const code = document.getElementById('userReferralCode').textContent;
      if (!code || code === '—') return;
      navigator.clipboard.writeText(code).then(() => cdToast('✅ Copied!'))
        .catch(() => {
          const input = document.createElement('input');
          input.value = code;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
          cdToast('✅ Copied!');
        });
    };

    window.toggleChip = function(el) { el.classList.toggle('selected'); };

    window.toggleChipLimit = function(el, max) {
      const parent = el.parentElement;
      const selected = parent.querySelectorAll('.chip.selected').length;
      if (el.classList.contains('selected')) {
        el.classList.remove('selected');
      } else {
        if (selected >= max) { cdToast('Max ' + max + ' selections.', 'error'); return; }
        el.classList.add('selected');
      }
      document.getElementById('interestCount').textContent = parent.querySelectorAll('.chip.selected').length;
    };

    // ---- Save profile ----
    window.saveProfile = function() {
      const uid = window.USER?.uid;
      if (!uid) {
        cdToast('Not logged in.', 'error');
        return;
      }
      // Access control check before saving (though should already be on page)
      if (!checkPageAccess()) return;

      const brands = Array.from(document.querySelectorAll('#brands .chip.selected')).map(el => el.dataset.val);
      const interests = Array.from(document.querySelectorAll('#interests .chip.selected')).map(el => el.dataset.val);
      const primaryGoal = document.getElementById('primaryGoal').value;
      const confidence = parseInt(document.getElementById('confidence').value) || 5;

      window.db.collection('users').doc(uid).update({
        'preferences.brands': brands,
        'preferences.interests': interests,
        'learningJourney.primaryGoal': primaryGoal,
        'learningJourney.confidence': confidence,
        tourCompleted: true,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => {
        cdToast('✅ Profile saved!');
        redirectToDashboard('Operator');
      })
      .catch(err => {
        document.getElementById('saveError').textContent = err.message;
        document.getElementById('saveError').style.display = 'block';
      });
    };
  </script>
</body>
</html>
