<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Profile (Test)</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/test/test-app.js"></script>
  <script src="/test-app/test-user-state.js"></script>
  <script src="/test-app/test-nav-header.js"></script>
  <link rel="stylesheet" href="/test-app/test-sidebar.css">
  <link rel="stylesheet" href="/test-app/test-announcement.css">
  <script src="/test-app/test-announcement.js"></script>
  <script src="/test-app/test-sidebar.js"></script>
  <link rel="stylesheet" href="test-bottom-nav.css">

  <style>
    .main-content {
      margin-left: 260px;
      padding: 20px;
      max-width: 900px;
    }
    @media (max-width: 768px) {
      .main-content { margin-left: 0; padding: 16px; }
    }

    .section {
      background: #0A0A0A;
      border: 1px solid #1A1A1A;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
    }
    .section h3 {
      color: #8deb00;
      font-size: 16px;
      margin-bottom: 12px;
      font-family: 'Space Mono', monospace;
    }
    .section h3 i {
      margin-right: 8px;
    }

    .admin-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .admin-info .field {
      margin-bottom: 8px;
    }
    .admin-info .field .label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      font-family: 'Space Mono', monospace;
    }
    .admin-info .field .value {
      font-size: 15px;
      color: #fff;
    }

    .module-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      color: #ccc;
      font-size: 14px;
    }
    .module-item:last-child {
      border-bottom: none;
    }
    .module-item .module-name {
      color: #fff;
      font-weight: 500;
    }
    .module-item .module-meta {
      font-size: 12px;
      color: #888;
    }
    .module-item .module-actions {
      display: flex;
      gap: 8px;
    }
    .module-item .module-actions button {
      background: transparent;
      border: 1px solid #333;
      color: #888;
      padding: 2px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      transition: 0.2s;
    }
    .module-item .module-actions button:hover {
      border-color: #8deb00;
      color: #8deb00;
    }
    .module-item .module-actions button.danger:hover {
      border-color: #ff4a4a;
      color: #ff4a4a;
    }

    .btn-add-module {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid #8deb00;
      color: #8deb00;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      transition: 0.2s;
      margin-top: 12px;
    }
    .btn-add-module:hover {
      background: rgba(141,235,0,0.08);
    }

    .stats-mini {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 8px;
    }
    .stats-mini .stat {
      background: rgba(255,255,255,0.02);
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }
    .stats-mini .stat .number {
      font-size: 24px;
      font-weight: 700;
      color: #8deb00;
    }
    .stats-mini .stat .label {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
      text-transform: uppercase;
      font-family: 'Space Mono', monospace;
    }
  </style>
</head>
<body>
  <div id="app-nav-container"></div>
  <div id="sidebarContainer"></div>

  <div class="main-content">
    <h1>👤 Admin Profile</h1>
    <p style="color:#888;margin-bottom:20px;">Manage your admin account and platform modules.</p>

    <!-- Admin Info -->
    <div class="section">
      <h3><i class="fa-regular fa-id-card"></i> Admin Information</h3>
      <div class="admin-info">
        <div class="field">
          <div class="label">Name</div>
          <div class="value" id="adminName">—</div>
        </div>
        <div class="field">
          <div class="label">Email</div>
          <div class="value" id="adminEmail">—</div>
        </div>
        <div class="field">
          <div class="label">Role</div>
          <div class="value" style="color:#8deb00;" id="adminRole">Admin</div>
        </div>
        <div class="field">
          <div class="label">Admin Since</div>
          <div class="value" id="adminSince">—</div>
        </div>
      </div>
    </div>

    <!-- Quick Stats -->
    <div class="section">
      <h3><i class="fa-regular fa-chart-line"></i> Quick Stats</h3>
      <div class="stats-mini">
        <div class="stat">
          <div class="number" id="totalUsers">0</div>
          <div class="label">Total Users</div>
        </div>
        <div class="stat">
          <div class="number" id="totalModules">0</div>
          <div class="label">Modules</div>
        </div>
      </div>
    </div>

    <!-- Module Management -->
    <div class="section">
      <h3><i class="fa-regular fa-book"></i> Module Management</h3>
      <div id="moduleList">
        <p style="color:#666;text-align:center;padding:20px 0;">Loading modules...</p>
      </div>
      <button class="btn-add-module" id="btnAddModule">
        <i class="fa-regular fa-plus"></i> Add New Module
      </button>
    </div>
  </div>

  <script src="test-bottom-nav.js"></script>

  <script>
    console.log('🔍 Admin profile loaded');

    // ================================================================
    // HELPERS
    // ================================================================
    function cdToast(msg, type) {
      const container = document.getElementById('toast-container') || (() => {
        const el = document.createElement('div');
        el.id = 'toast-container';
        el.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;font-family:sans-serif;';
        document.body.appendChild(el);
        return el;
      })();
      const toast = document.createElement('div');
      toast.style.cssText = `
        background:#0A0A0A; border:1px solid ${type === 'error' ? '#ff4a4a' : '#8deb00'};
        color:#fff; font-size:14px; padding:10px 20px; border-radius:8px;
        opacity:0; transform:translateY(-10px); transition:all 0.3s ease;
        pointer-events:auto; text-align:center;
      `;
      toast.textContent = msg;
      container.appendChild(toast);
      requestAnimationFrame(() => { toast.style.opacity = '1'; toast.style.transform = 'translateY(0)'; });
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // ================================================================
    // LOAD ADMIN PROFILE DATA
    // ================================================================
    async function loadAdminProfile(uid) {
      try {
        const doc = await db.collection('users').doc(uid).get();
        if (!doc.exists) {
          cdToast('Admin user not found', 'error');
          return;
        }
        const data = doc.data();
        document.getElementById('adminName').textContent = data.name || data.username || 'Admin';
        document.getElementById('adminEmail').textContent = data.email || '—';
        document.getElementById('adminRole').textContent = data.role || 'Admin';
        document.getElementById('adminSince').textContent = data.createdAt
          ? new Date(data.createdAt.toDate ? data.createdAt.toDate() : data.createdAt).toLocaleDateString()
          : '—';
      } catch (err) {
        console.error('Error loading admin profile:', err);
        cdToast('Failed to load admin profile', 'error');
      }
    }

    // ================================================================
    // LOAD QUICK STATS
    // ================================================================
    async function loadQuickStats() {
      try {
        const [usersSnap, modulesSnap] = await Promise.all([
          db.collection('users').get(),
          db.collection('modules').get()
        ]);
        document.getElementById('totalUsers').textContent = usersSnap.size;
        document.getElementById('totalModules').textContent = modulesSnap.size;
        return modulesSnap;
      } catch (err) {
        console.error('Stats error:', err);
        cdToast('Failed to load stats', 'error');
        return null;
      }
    }

    // ================================================================
    // LOAD MODULE LIST
    // ================================================================
    async function loadModules() {
      const container = document.getElementById('moduleList');
      try {
        const snapshot = await db.collection('modules').orderBy('metadata.order', 'asc').get();
        if (snapshot.empty) {
          container.innerHTML = '<p style="color:#666;text-align:center;padding:20px 0;">No modules created yet.</p>';
          return;
        }
        let html = '';
        snapshot.forEach(doc => {
          const data = doc.data();
          const metadata = data.metadata || {};
          html += `
            <div class="module-item">
              <span class="module-name">${metadata.title || doc.id}</span>
              <span class="module-meta">${metadata.difficulty || '—'} · ${data.slides ? Object.keys(data.slides).length : 0} slides</span>
              <div class="module-actions">
                <button onclick="editModule('${doc.id}')">Edit</button>
                <button class="danger" onclick="deleteModule('${doc.id}')">Delete</button>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      } catch (err) {
        console.error('Error loading modules:', err);
        container.innerHTML = '<p style="color:#ff4a4a;text-align:center;padding:20px 0;">Error loading modules</p>';
      }
    }

    // ================================================================
    // MODULE ACTIONS
    // ================================================================
    window.editModule = function(moduleId) {
      cdToast('Edit module: ' + moduleId + ' (coming soon)');
    };

    window.deleteModule = async function(moduleId) {
      if (!confirm(`Delete module "${moduleId}"? This cannot be undone.`)) return;
      try {
        await db.collection('modules').doc(moduleId).delete();
        cdToast('Module deleted');
        loadModules();
      } catch (err) {
        cdToast('Error deleting module: ' + err.message, 'error');
      }
    };

    document.getElementById('btnAddModule').addEventListener('click', () => {
      cdToast('Add module feature coming soon!');
    });

    // ================================================================
    // INIT – AUTH + ACCESS CONTROL (case-insensitive)
    // ================================================================
    function init() {
      if (window.USER && window.USER.isLoggedIn) {
        const role = window.USER.role;
        if (role && role.toLowerCase() !== 'admin') {
          cdToast('Access denied. Admin only.', 'error');
          setTimeout(() => { window.location.href = '/test-app/test-operator-dashboard.html'; }, 1500);
          return;
        }
        const uid = window.USER.uid;
        loadAdminProfile(uid);
        loadQuickStats().then(() => loadModules());
      } else {
        window.addEventListener('userStateReady', (e) => {
          if (e.detail.isLoggedIn) {
            const role = e.detail.role;
            if (role && role.toLowerCase() !== 'admin') {
              cdToast('Access denied. Admin only.', 'error');
              setTimeout(() => { window.location.href = '/test-app/test-operator-dashboard.html'; }, 1500);
              return;
            }
            const uid = e.detail.uid;
            loadAdminProfile(uid);
            loadQuickStats().then(() => loadModules());
          } else {
            window.location.href = '/test-app/test-login.html';
          }
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
