<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Profile (Test)</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Core app -->
  <script src="/test-app/test-app.js"></script>
  <script src="/test-app/test-user-state.js"></script>
  <!-- Access control -->
  <script src="/test-app/test-access-control.js"></script>
  <script src="/test-app/test-nav-header.js"></script>

  <!-- Sidebar / mobile sheet -->
  <link rel="stylesheet" href="/test-app/test-sidebar.css">
  <script src="/test-app/test-sidebar.js"></script>

  <!-- Announcement -->
  <link rel="stylesheet" href="/test-app/test-announcement.css">
  <script src="/test-app/test-announcement.js"></script>

  <!-- Bottom nav -->
  <link rel="stylesheet" href="/test-app/test-bottom-nav.css">

  <style>
    /* ... all existing styles unchanged ... */
  </style>
</head>
<body>
  <div id="app-nav-container"></div>
  <div id="sidebarContainer"></div>

  <div class="main-content">
    <!-- all existing content unchanged -->
  </div>

  <!-- Bottom Nav Container -->
  <div id="bottomNavContainer"></div>
  <script src="/test-app/test-bottom-nav.js"></script>

  <script>
    console.log('🔍 Admin profile loaded');

    // ================================================================
    // HELPERS
    // ================================================================
    function cdToast(msg, type) {
      // ... unchanged ...
    }

    // ================================================================
    // LOAD ADMIN PROFILE DATA
    // ================================================================
    async function loadAdminProfile(uid) {
      try {
        const doc = await db.collection('users').doc(uid).get();
        if (!doc.exists) {
          cdToast('Admin user not found', 'error');
          return;
        }
        const data = doc.data();
        document.getElementById('adminName').textContent = data.name || data.username || 'Admin';
        document.getElementById('adminEmail').textContent = data.email || '—';
        document.getElementById('adminRole').textContent = data.role || 'Admin';
        document.getElementById('adminSince').textContent = data.createdAt
          ? new Date(data.createdAt.toDate ? data.createdAt.toDate() : data.createdAt).toLocaleDateString()
          : '—';
      } catch (err) {
        console.error('Error loading admin profile:', err);
        cdToast('Failed to load admin profile', 'error');
      }
    }

    // ================================================================
    // LOAD QUICK STATS
    // ================================================================
    async function loadQuickStats() {
      try {
        const [usersSnap, modulesSnap] = await Promise.all([
          db.collection('users').get(),
          db.collection('modules').get()
        ]);
        document.getElementById('totalUsers').textContent = usersSnap.size;
        document.getElementById('totalModules').textContent = modulesSnap.size;
        return modulesSnap;
      } catch (err) {
        console.error('Stats error:', err);
        cdToast('Failed to load stats', 'error');
        return null;
      }
    }

    // ================================================================
    // LOAD MODULE LIST
    // ================================================================
    async function loadModules() {
      const container = document.getElementById('moduleList');
      try {
        const snapshot = await db.collection('modules').orderBy('metadata.order', 'asc').get();
        if (snapshot.empty) {
          container.innerHTML = '<p style="color:#666;text-align:center;padding:20px 0;">No modules created yet.</p>';
          return;
        }
        let html = '';
        snapshot.forEach(doc => {
          const data = doc.data();
          const metadata = data.metadata || {};
          html += `
            <div class="module-item">
              <span class="module-name">${metadata.title || doc.id}</span>
              <span class="module-meta">${metadata.difficulty || '—'} · ${data.slides ? Object.keys(data.slides).length : 0} slides</span>
              <div class="module-actions">
                <button onclick="editModule('${doc.id}')">Edit</button>
                <button class="danger" onclick="deleteModule('${doc.id}')">Delete</button>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      } catch (err) {
        console.error('Error loading modules:', err);
        container.innerHTML = '<p style="color:#ff4a4a;text-align:center;padding:20px 0;">Error loading modules</p>';
      }
    }

    // ================================================================
    // MODULE ACTIONS
    // ================================================================
    window.editModule = function(moduleId) {
      cdToast('Edit module: ' + moduleId + ' (coming soon)');
    };

    window.deleteModule = async function(moduleId) {
      if (!confirm(`Delete module "${moduleId}"? This cannot be undone.`)) return;
      try {
        await db.collection('modules').doc(moduleId).delete();
        cdToast('Module deleted');
        loadModules();
      } catch (err) {
        cdToast('Error deleting module: ' + err.message, 'error');
      }
    };

    document.getElementById('btnAddModule').addEventListener('click', () => {
      cdToast('Add module feature coming soon!');
    });

    // ================================================================
    // INIT – Robust admin check (always wait for fresh auth + role)
    // ================================================================
    function init() {
      // Always use onAuthStateChanged to ensure fresh role,
      // bypassing any stale window.USER cache.
      firebase.auth().onAuthStateChanged(async (user) => {
        if (!user) {
          window.location.href = '/test-app/test-login.html';
          return;
        }

        // Fetch the user's role directly from Firestore
        try {
          const doc = await db.collection('users').doc(user.uid).get();
          if (!doc.exists) {
            cdToast('User data not found', 'error');
            window.location.href = '/test-app/test-login.html';
            return;
          }
          const role = doc.data().role;
          if (role && role.toLowerCase() !== 'admin') {
            cdToast('Access denied. Admin only.', 'error');
            setTimeout(() => { window.location.href = '/test-app/test-operator-dashboard.html'; }, 1500);
            return;
          }

          // User is admin – load data
          loadAdminProfile(user.uid);
          loadQuickStats().then(() => loadModules());
        } catch (err) {
          console.error('Auth check error:', err);
          cdToast('Error checking access', 'error');
          window.location.href = '/test-app/test-login.html';
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
