<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard (Test)</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/test/test-app.js"></script>
  <script src="/test-app/test-user-state.js"></script>
  <script src="/test-app/test-nav-header.js"></script>
  <link rel="stylesheet" href="/test-app/test-sidebar.css">
  <link rel="stylesheet" href="/test-app/test-announcement.css">
  <script src="/test-app/test-announcement.js"></script>
  <script src="/test-app/test-sidebar.js"></script>
  <link rel="stylesheet" href="test-bottom-nav.css">

  <style>
    .main-content {
      margin-left: 260px;
      padding: 20px;
      max-width: 900px;
    }
    @media (max-width: 768px) {
      .main-content { margin-left: 0; padding: 16px; }
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin: 20px 0;
    }
    .stat-card {
      background: #0A0A0A;
      border: 1px solid #1A1A1A;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    .stat-card .number {
      font-size: 28px;
      font-weight: 700;
      color: #8deb00;
    }
    .stat-card .label {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    .section {
      background: #0A0A0A;
      border: 1px solid #1A1A1A;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
    }
    .section h3 {
      color: #8deb00;
      font-size: 16px;
      margin-bottom: 12px;
      font-family: 'Space Mono', monospace;
    }

    .users-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      color: #ccc;
    }
    .users-table th {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid #1A1A1A;
      color: #fff;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
    }
    .users-table td {
      padding: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .users-table tr:hover {
      background: rgba(141,235,0,0.04);
    }

    .announcement-area textarea {
      width: 100%;
      padding: 12px;
      background: #0F0F0F;
      border: 1px solid #1A1A1A;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      resize: vertical;
      min-height: 80px;
      font-family: inherit;
    }
    .announcement-area textarea:focus {
      border-color: #8deb00;
      outline: none;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .btn-publish {
      padding: 8px 20px;
      background: #8deb00;
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
    }
    .btn-publish:hover {
      background: #a0f520;
    }
    .btn-clear {
      padding: 8px 20px;
      background: transparent;
      border: 1px solid #ff4a4a;
      border-radius: 6px;
      color: #ff4a4a;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
    }
    .btn-clear:hover {
      background: rgba(255,74,74,0.08);
    }
    .current-announcement {
      margin-top: 12px;
      padding: 12px;
      background: rgba(141,235,0,0.04);
      border: 1px solid rgba(141,235,0,0.12);
      border-radius: 6px;
      font-size: 14px;
      color: #ccc;
    }
    .current-announcement strong {
      color: #8deb00;
    }

    .btn-refresh {
      background: transparent;
      border: 1px solid #333;
      color: #888;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-left: 12px;
    }
    .btn-refresh:hover {
      border-color: #8deb00;
      color: #8deb00;
    }

    .load-more {
      display: block;
      margin: 12px auto 0;
      padding: 8px 20px;
      background: transparent;
      border: 1px solid #333;
      border-radius: 6px;
      color: #888;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
    }
    .load-more:hover {
      border-color: #8deb00;
      color: #8deb00;
    }
  </style>
</head>
<body>
  <div id="app-nav-container"></div>
  <div id="sidebarContainer"></div>

  <div class="main-content">
    <h1>📡 Admin Dashboard</h1>
    <p style="color:#888;margin-bottom:20px;">Overview of platform activity and users.</p>

    <!-- Stats -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="number" id="statUsers">0</div><div class="label">Total Users</div></div>
      <div class="stat-card"><div class="number" id="statPro">0</div><div class="label">Pro Users</div></div>
      <div class="stat-card"><div class="number" id="statActive">0</div><div class="label">Active Today</div></div>
      <div class="stat-card"><div class="number" id="statModules">0</div><div class="label">Modules</div></div>
    </div>

    <!-- Announcement -->
    <div class="section announcement-area">
      <h3><i class="fa-regular fa-bullhorn"></i> Broadcast Announcement</h3>
      <textarea id="announcementInput" placeholder="Write announcement here..."></textarea>
      <div class="btn-group">
        <button class="btn-publish" id="publishAnnouncement">Publish</button>
        <button class="btn-clear" id="clearAnnouncement">Clear</button>
      </div>
      <div class="current-announcement">
        <strong>Current:</strong> <span id="announcementText">No active announcement</span>
      </div>
    </div>

    <!-- Users Table -->
    <div class="section">
      <h3>
        <i class="fa-regular fa-users"></i> All Users
        <button class="btn-refresh" onclick="refreshUsers()">↻ Refresh</button>
      </h3>
      <div style="overflow-x:auto;">
        <table class="users-table">
          <thead>
            <tr><th>Name</th><th>Email</th><th>Plan</th><th>Role</th><th>Points</th></tr>
          </thead>
          <tbody id="usersTableBody">
            <tr><td colspan="5" style="text-align:center;padding:20px;color:#666;">Loading users...</td></tr>
          </tbody>
        </table>
        <div id="loadMoreContainer"></div>
      </div>
    </div>
  </div>

  <script src="test-bottom-nav.js"></script>

  <script>
    console.log('🔍 Admin dashboard loaded');

    // ================================================================
    // HELPERS
    // ================================================================
    function cdToast(msg, type) {
      const container = document.getElementById('toast-container') || (() => {
        const el = document.createElement('div');
        el.id = 'toast-container';
        el.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;font-family:sans-serif;';
        document.body.appendChild(el);
        return el;
      })();
      const toast = document.createElement('div');
      toast.style.cssText = `
        background:#0A0A0A; border:1px solid ${type === 'error' ? '#ff4a4a' : '#8deb00'};
        color:#fff; font-size:14px; padding:10px 20px; border-radius:8px;
        opacity:0; transform:translateY(-10px); transition:all 0.3s ease;
        pointer-events:auto; text-align:center;
      `;
      toast.textContent = msg;
      container.appendChild(toast);
      requestAnimationFrame(() => { toast.style.opacity = '1'; toast.style.transform = 'translateY(0)'; });
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // ================================================================
    // LOAD STATS
    // ================================================================
    async function loadStats() {
      try {
        const usersSnap = await db.collection('users').get();
        let total = 0, pro = 0, active = 0;
        const today = new Date();
        today.setHours(0,0,0,0);

        usersSnap.forEach(doc => {
          const u = doc.data();
          total++;
          if (u.tier === 'pro') pro++;
          if (u.lastActive) {
            const last = u.lastActive.toDate ? u.lastActive.toDate() : new Date(u.lastActive);
            if (last >= today) active++;
          }
        });

        const modulesSnap = await db.collection('modules').get();
        document.getElementById('statUsers').textContent = total;
        document.getElementById('statPro').textContent = pro;
        document.getElementById('statActive').textContent = active;
        document.getElementById('statModules').textContent = modulesSnap.size;

        return usersSnap;
      } catch (err) {
        console.error('Stats error:', err);
        cdToast('Failed to load stats', 'error');
        return null;
      }
    }

    // ================================================================
    // USERS TABLE (paginated)
    // ================================================================
    let lastDoc = null;

    async function loadUsers(reset = true) {
      if (reset) {
        lastDoc = null;
        document.getElementById('usersTableBody').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:#666;">Loading users...</td></tr>';
        document.getElementById('loadMoreContainer').innerHTML = '';
      }

      let q = db.collection('users').orderBy('createdAt', 'desc').limit(20);
      if (lastDoc) q = q.startAfter(lastDoc);

      try {
        const snap = await q.get();
        const tbody = document.getElementById('usersTableBody');

        if (snap.empty && !lastDoc) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:#666;">No users found</td></tr>';
          return;
        }
        if (snap.empty && lastDoc) {
          document.getElementById('loadMoreContainer').innerHTML = '<p style="text-align:center;color:#666;font-size:13px;">— End of list —</p>';
          return;
        }

        if (reset || tbody.children.length === 1 && tbody.children[0].colSpan === 5) {
          tbody.innerHTML = '';
        }

        lastDoc = snap.docs[snap.docs.length - 1];

        snap.forEach(doc => {
          const u = doc.data();
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${u.name || u.username || '—'}</td>
            <td>${u.email || '—'}</td>
            <td>${u.tier || 'free'}</td>
            <td>${u.role || 'Operator'}</td>
            <td>${u.totalPoints || 0}</td>
          `;
          tbody.appendChild(tr);
        });

        const container = document.getElementById('loadMoreContainer');
        if (snap.docs.length === 20) {
          container.innerHTML = `<button class="load-more" onclick="loadUsers(false)">Load More</button>`;
        } else {
          container.innerHTML = '<p style="text-align:center;color:#666;font-size:13px;margin-top:8px;">— All users loaded —</p>';
        }

      } catch (err) {
        console.error('Users table error:', err);
        cdToast('Failed to load users', 'error');
      }
    }

    window.refreshUsers = function() {
      loadUsers(true);
      loadStats();
    };

    // ================================================================
    // ANNOUNCEMENT
    // ================================================================
    function listenAnnouncement() {
      db.collection('admin').doc('announcement').onSnapshot(doc => {
        const el = document.getElementById('announcementText');
        if (doc.exists && doc.data().active) {
          el.textContent = doc.data().message || 'No active announcement';
        } else {
          el.textContent = 'No active announcement';
        }
      });
    }

    document.getElementById('publishAnnouncement').addEventListener('click', async () => {
      const input = document.getElementById('announcementInput');
      const msg = input.value.trim();
      if (!msg) { cdToast('Please write a message', 'error'); return; }
      try {
        await db.collection('admin').doc('announcement').set({
          message: msg,
          active: true,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        cdToast('Announcement published!');
        input.value = '';
      } catch (err) {
        cdToast('Failed: ' + err.message, 'error');
      }
    });

    document.getElementById('clearAnnouncement').addEventListener('click', async () => {
      try {
        await db.collection('admin').doc('announcement').set({
          message: '',
          active: false,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        cdToast('Announcement cleared');
      } catch (err) {
        cdToast('Failed: ' + err.message, 'error');
      }
    });

    // ================================================================
    // INIT – AUTH + ACCESS CONTROL (case-insensitive)
    // ================================================================
    function init() {
      if (window.USER && window.USER.isLoggedIn) {
        const role = window.USER.role;
        if (role && role.toLowerCase() !== 'admin') {
          cdToast('Access denied. Admin only.', 'error');
          setTimeout(() => { window.location.href = '/test-app/test-operator-dashboard.html'; }, 1500);
          return;
        }
        // Load data
        loadStats().then(() => loadUsers(true));
        listenAnnouncement();
      } else {
        window.addEventListener('userStateReady', (e) => {
          if (e.detail.isLoggedIn) {
            const role = e.detail.role;
            if (role && role.toLowerCase() !== 'admin') {
              cdToast('Access denied. Admin only.', 'error');
              setTimeout(() => { window.location.href = '/test-app/test-operator-dashboard.html'; }, 1500);
              return;
            }
            loadStats().then(() => loadUsers(true));
            listenAnnouncement();
          } else {
            window.location.href = '/test-app/test-login.html';
          }
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
