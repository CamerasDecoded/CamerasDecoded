<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard (Test)</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Core app -->
  <script src="/test-app/test-app.js"></script>
  <script src="/test-app/test-user-state.js"></script>
  <!-- Access control -->
  <script src="/test-app/test-access-control.js"></script>
  <!-- Top navigation -->
  <script src="/test-app/test-nav-header.js"></script>

  <!-- Sidebar / mobile sheet -->
  <link rel="stylesheet" href="/test-app/test-sidebar.css">
  <script src="/test-app/test-sidebar.js"></script>

  <!-- Announcement -->
  <link rel="stylesheet" href="/test-app/test-announcement.css">
  <script src="/test-app/test-announcement.js"></script>

  <!-- Bottom nav -->
  <link rel="stylesheet" href="/test-app/test-bottom-nav.css">

  <style>
    .main-content { margin-left:260px; padding:20px; max-width:1000px; }
    @media (max-width:768px) { .main-content { margin-left:0; padding:16px; } }
    .stat-card {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      border-left: 4px solid #8deb00;
    }
    .stat-card h3 { margin-top: 0; color: #333; }
    .stat-card p { margin: 4px 0; color: #555; }
  </style>
</head>
<body>
  <div id="app-nav-container"></div>
  <div id="sidebarContainer"></div>

  <div class="main-content">
    <h1>📊 Admin Dashboard (TEST)</h1>
    <div id="loading">Loading admin stats...</div>
    <div id="content" style="display:none;">
      <!-- Placeholder stats – replace with real data -->
      <div class="stat-card">
        <h3>User Overview</h3>
        <p><strong>Total Users:</strong> <span id="totalUsers">—</span></p>
        <p><strong>Operators:</strong> <span id="operatorCount">—</span></p>
        <p><strong>Partners:</strong> <span id="partnerCount">—</span></p>
        <p><strong>Instructors:</strong> <span id="instructorCount">—</span></p>
      </div>
      <div class="stat-card">
        <h3>Referrals</h3>
        <p><strong>Total Referral Codes Used:</strong> <span id="totalReferrals">—</span></p>
      </div>
      <button onclick="handleLogout()" style="padding:10px 20px;background:#ff4444;border:none;border-radius:6px;cursor:pointer;color:#fff;">Logout</button>
    </div>
  </div>

  <!-- Bottom Nav Container -->
  <div id="bottomNavContainer"></div>
  <script src="/test-app/test-bottom-nav.js"></script>

  <script>
    // ---- Admin dashboard logic ----
    let uid = null;

    async function loadAdminStats() {
      try {
        const db = window.db;
        // Placeholder queries – replace with actual admin data fetching
        // Example: fetch counts from users collection
        const usersSnapshot = await db.collection('users').get();
        const users = usersSnapshot.docs.map(doc => doc.data());
        const totalUsers = users.length;
        const operatorCount = users.filter(u => u.role === 'Operator').length;
        const partnerCount = users.filter(u => u.role === 'Partner').length;
        const instructorCount = users.filter(u => u.role === 'Instructor').length;

        document.getElementById('totalUsers').textContent = totalUsers;
        document.getElementById('operatorCount').textContent = operatorCount;
        document.getElementById('partnerCount').textContent = partnerCount;
        document.getElementById('instructorCount').textContent = instructorCount;

        // Referral count
        const refSnapshot = await db.collection('referralCodesUsed').get();
        document.getElementById('totalReferrals').textContent = refSnapshot.size;

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        if (window.BottomNav) window.BottomNav.setActive();
      } catch (err) {
        console.error('Admin stats error:', err);
        document.getElementById('loading').textContent = 'Error loading stats: ' + err.message;
      }
    }

    function init() {
      if (window.USER && window.USER.isLoggedIn) {
        // Check if user is admin (role 'Admin' or 'admin')
        const role = window.USER.role;
        if (role !== 'Admin' && role !== 'admin') {
          redirectToDashboard(role);
          return;
        }
        uid = window.USER.uid;
        loadAdminStats();
      } else {
        window.addEventListener('userStateReady', (e) => {
          if (e.detail.isLoggedIn) {
            const role = e.detail.role;
            if (role !== 'Admin' && role !== 'admin') {
              redirectToDashboard(role);
              return;
            }
            uid = e.detail.uid;
            loadAdminStats();
          } else {
            window.location.href = '/test-app/test-login.html';
          }
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
