<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Dashboard (Test)</title>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/test-app/test-app.js"></script>
  <script src="/test-app/test-user-state.js"></script>
  <script src="/test-app/test-access-control.js"></script>
  <script src="/test-app/test-nav-header.js"></script>
  <link rel="stylesheet" href="/test-app/test-sidebar.css">
  <link rel="stylesheet" href="/test-app/test-announcement.css">
  <script src="/test-app/test-announcement.js"></script>
  <script src="/test-app/test-sidebar.js"></script>
  <link rel="stylesheet" href="/test-app/test-bottom-nav.css">
  <link rel="stylesheet" href="/test-app/test-spinner.css">
  <script src="/test-app/test-commission-card.js"></script>
  <style>
    .main-content { margin-left:260px; padding:20px; max-width:800px; }
    @media (max-width:768px) { .main-content { margin-left:0; padding:16px; } }
  </style>
</head>
<body>
  <div id="app-nav-container"></div>
  <div id="sidebarContainer"></div>

  <div class="main-content">
    <h1>📡 Partner Dashboard (TEST)</h1>
    <div id="loading" style="text-align:center;">
      <div class="loading-spinner"></div>
      <span>Loading...</span>
    </div>
    <div id="content" style="display:none;">
      <div style="padding:20px;background:#f5f5f5;border-radius:8px;margin-bottom:20px;">
        <h2>Welcome, <span id="userName">—</span>!</h2>
        <p><strong>Company:</strong> <span id="userCompany">—</span></p>
        <p><strong>License:</strong> <span id="userTier">—</span></p>
        <p><strong>Billing:</strong> <span id="userBilling">—</span></p>
        <p><strong>Referral:</strong> <span id="userReferral">—</span></p>
        <button onclick="copyReferral()" style="padding:6px 16px;background:#8deb00;border:none;border-radius:4px;cursor:pointer;">Copy Referral</button>
        <br><br>
        <button onclick="handleLogout()" style="padding:6px 16px;background:#ff4444;border:none;border-radius:4px;cursor:pointer;color:#fff;">Logout</button>
      </div>

      <div id="statsGrid" class="stats-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;">
        <div style="background:#f5f5f5;padding:12px;border-radius:8px;"><strong>License:</strong><br><span id="statTier">—</span></div>
        <div style="background:#f5f5f5;padding:12px;border-radius:8px;"><strong>Billing:</strong><br><span id="statBilling">—</span></div>
        <div style="background:#f5f5f5;padding:12px;border-radius:8px;"><strong>Referrals:</strong><br><span id="statReferrals">0</span></div>
      </div>
    </div>
  </div>

  <div id="bottomNavContainer"></div>
  <script src="/test-app/test-bottom-nav.js"></script>

  <script>
    let uid = null;

    function loadDashboard() {
      db.collection('users').doc(uid).get()
        .then(doc => {
          if (!doc.exists) { cdToast('User not found.', 'error'); return; }
          const data = doc.data();
          if (data.role !== 'Partner') {
            redirectToDashboard(data.role);
            return;
          }
          document.getElementById('userName').textContent = data.name || '—';
          document.getElementById('userCompany').textContent = data.companyName || '—';
          const tierMap = { 'signal': 'Signal', 'operator': 'Operator', 'enterprise': 'Enterprise' };
          document.getElementById('userTier').textContent = tierMap[data.partnerTier] || 'Signal';
          document.getElementById('userBilling').textContent = data.billingInterval === 'annual' ? 'Annual' : 'Monthly';
          document.getElementById('userReferral').textContent = data.referralCode || '—';

          document.getElementById('statTier').textContent = tierMap[data.partnerTier] || 'Signal';
          document.getElementById('statBilling').textContent = data.billingInterval === 'annual' ? 'Annual' : 'Monthly';
          document.getElementById('statReferrals').textContent = data.referralStats?.totalReferrals || 0;

          document.getElementById('loading').style.display = 'none';
          document.getElementById('content').style.display = 'block';

          if (window.BottomNav) window.BottomNav.setActive();
          window.insertCommissionCard('statsGrid', 'after');
        })
        .catch(err => {
          document.getElementById('loading').innerHTML = 'Error: ' + err.message;
        });
    }

    function init() {
      if (window.USER && window.USER.isLoggedIn) {
        uid = window.USER.uid;
        loadDashboard();
      } else {
        window.addEventListener('userStateReady', (e) => {
          if (e.detail.isLoggedIn) {
            uid = e.detail.uid;
            loadDashboard();
          } else {
            window.location.href = '/test-app/test-login.html';
          }
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    function copyReferral() {
      const link = document.getElementById('userReferral').textContent;
      if (!link || link === '—') { cdToast('Referral code not available.', 'error'); return; }
      const fullLink = 'https://camerasdecoded.com/ref/' + link;
      navigator.clipboard.writeText(fullLink).then(() => cdToast('✅ Copied!'))
        .catch(() => {
          const input = document.createElement('input');
          input.value = fullLink;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
          cdToast('✅ Copied!');
        });
    }
  </script>
</body>
</html>
