<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructor Profile (Test)</title>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Your existing Firebase init + auth/db globals -->
  <script src="test-app.js"></script>

  <!-- user state and nav components -->
  <script src="/test-app/user-state.js"></script>
  <script src="/test-app/nav-header.js"></script>

  <style>
    .referral-box {
      margin-top: 20px;
      padding: 16px;
      background: #f0f0f0;
      border-radius: 8px;
    }
    .referral-box code {
      background: #222;
      color: #8deb00;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 18px;
      letter-spacing: 1px;
    }
    .referral-status {
      font-size: 13px;
      color: #666;
      margin-left: 12px;
    }
  </style>
</head>
<body>

  <!-- Nav container -->
  <div id="app-nav-container"></div>

  <!-- Profile content -->
  <div style="max-width:400px;margin:40px auto;padding:20px;font-family:sans-serif;">
    <h1>📡 Instructor Profile (TEST)</h1>
    <div id="loading">Loading...</div>
    <div id="content" style="display:none;">
      <div style="padding:16px;background:#f5f5f5;border-radius:8px;margin-bottom:20px;">
        <p><strong>Name:</strong> <span id="displayName">—</span></p>
        <p><strong>Email:</strong> <span id="displayEmail">—</span></p>
        <p><strong>License:</strong> Educator</p>
      </div>

      <!-- Referral Code Section -->
      <div class="referral-box">
        <p><strong>Referral Code:</strong> <span id="userReferral">—</span></p>
        <div id="referralAction">
          <button id="generateReferralBtn" onclick="generateReferral()" style="padding:6px 16px;background:#8deb00;border:none;border-radius:4px;cursor:pointer;">Generate Referral Code</button>
          <span id="referralStatus" class="referral-status"></span>
        </div>
      </div>

      <div style="margin:12px 0;">
        <label>Teaching Experience</label>
        <select id="teachingExperience" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;">
          <option value="<1">Less than 1 year</option>
          <option value="1-3">1–3 years</option>
          <option value="3-5">3–5 years</option>
          <option value="5+">5+ years</option>
        </select>
      </div>

      <div style="margin:12px 0;">
        <label>Billing</label>
        <select id="billingInterval" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;">
          <option value="monthly">Monthly ($300/mo)</option>
          <option value="annual">Annual ($2,500/yr – save 30%)</option>
        </select>
      </div>

      <button onclick="saveProfile()" style="width:100%;padding:14px;background:#8deb00;border:none;border-radius:8px;font-weight:700;font-size:16px;cursor:pointer;">Save Profile →</button>
      <div id="saveError" style="color:red;margin-top:12px;display:none;"></div>
    </div>
  </div>

  <!-- ===== PROFILE SCRIPT ===== -->
  <script>
    let uid = null;
    let userData = null;

    function loadProfile() {
      window.db.collection('users').doc(uid).get()
        .then(doc => {
          if (!doc.exists) {
            cdToast('User not found.', 'error');
            return;
          }
          userData = doc.data();

          if (userData.role !== 'Instructor') {
            redirectToDashboard(userData.role);
            return;
          }

          document.getElementById('displayName').textContent = userData.name || '—';
          document.getElementById('displayEmail').textContent = userData.email || '—';

          // Referral code
          const referralCode = userData.referralCode || null;
          document.getElementById('userReferral').textContent = referralCode || '—';
          if (referralCode) {
            document.getElementById('generateReferralBtn').style.display = 'none';
            document.getElementById('referralStatus').textContent = '✅ Permanent code set';
          } else {
            document.getElementById('generateReferralBtn').style.display = 'inline-block';
            document.getElementById('referralStatus').textContent = '';
          }

          document.getElementById('teachingExperience').value = userData.teachingExperience || '';
          document.getElementById('billingInterval').value = userData.billingInterval || 'annual';

          document.getElementById('loading').style.display = 'none';
          document.getElementById('content').style.display = 'block';
        })
        .catch(err => {
          document.getElementById('loading').textContent = 'Error: ' + err.message;
        });
    }

    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        uid = user.uid;
        loadProfile();
      } else {
        window.location.href = '/test-app/test-login.html';
      }
    });

    // Generate referral code
    window.generateReferral = async function() {
      const btn = document.getElementById('generateReferralBtn');
      const status = document.getElementById('referralStatus');
      btn.disabled = true;
      status.textContent = 'Generating...';
      try {
        const code = await generateAndSaveReferralCode(uid);
        document.getElementById('userReferral').textContent = code;
        status.textContent = '✅ Code generated and saved!';
        btn.style.display = 'none';
        userData.referralCode = code;
      } catch (err) {
        status.textContent = '❌ ' + err.message;
        btn.disabled = false;
      }
    };

    window.saveProfile = function() {
      const teachingExperience = document.getElementById('teachingExperience').value;
      const billingInterval = document.getElementById('billingInterval').value;

      window.db.collection('users').doc(uid).update({
        teachingExperience: teachingExperience,
        billingInterval: billingInterval,
        tourCompleted: true,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => {
        cdToast('✅ Profile saved!');
        redirectToDashboard('Instructor');
      })
      .catch(err => {
        document.getElementById('saveError').textContent = err.message;
        document.getElementById('saveError').style.display = 'block';
      });
    };
  </script>

</body>
</html>
