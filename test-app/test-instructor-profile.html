<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructor Profile (Test)</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="test-app.js"></script>
  <script src="/test-app/user-state.js"></script>
  <script src="/test-app/nav-header.js"></script>
  <style>
    .referral-section {
      margin: 20px 0;
      padding: 16px;
      background: #f5f5f5;
      border-radius: 8px;
      border-left: 4px solid #8deb00;
    }
    .referral-code-display {
      font-size: 20px;
      font-weight: bold;
      background: #222;
      color: #8deb00;
      padding: 4px 12px;
      border-radius: 4px;
      letter-spacing: 1px;
      display: inline-block;
    }
    .referral-status {
      font-size: 13px;
      margin-top: 6px;
    }
    .referral-status.available { color: #2e7d32; }
    .referral-status.taken { color: #c62828; }
    .referral-status.error { color: #e65100; }
    .copy-btn {
      margin-left: 8px;
      padding: 4px 12px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .copy-btn:hover { background: #555; }
  </style>
</head>
<body>
  <div id="app-nav-container"></div>
  <div style="max-width:400px;margin:40px auto;padding:20px;font-family:sans-serif;">
    <h1>📡 Instructor Profile (TEST)</h1>
    <div id="loading">Loading...</div>
    <div id="content" style="display:none;">
      <div style="padding:16px;background:#f5f5f5;border-radius:8px;margin-bottom:20px;">
        <p><strong>Name:</strong> <span id="displayName">—</span></p>
        <p><strong>Email:</strong> <span id="displayEmail">—</span></p>
        <p><strong>License:</strong> Educator</p>
      </div>

      <!-- Referral Section -->
      <div class="referral-section" id="referralSection">
        <p style="font-weight:600;margin:0 0 8px 0;">🔗 Your Referral Code</p>
        <div id="referralDisplay">
          <div id="existingCodeDisplay" style="display:none;">
            <span class="referral-code-display" id="userReferralCode">—</span>
            <button class="copy-btn" onclick="copyReferralCode()">Copy</button>
          </div>
          <div id="referralSetup" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">
            <input type="text" id="newReferralCode" placeholder="Set your permanent referral code" style="padding:8px;border:1px solid #ddd;border-radius:4px;flex:1;min-width:150px;" />
            <button id="setReferralBtn" onclick="setReferralCode()" style="padding:8px 16px;background:#8deb00;border:none;border-radius:4px;cursor:pointer;font-weight:600;">Set Code</button>
          </div>
          <div id="referralStatus" class="referral-status"></div>
        </div>
      </div>

      <!-- Instructor fields -->
      <div style="margin:12px 0;">
        <label>Teaching Experience</label>
        <select id="teachingExperience" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;">
          <option value="<1">Less than 1 year</option>
          <option value="1-3">1–3 years</option>
          <option value="3-5">3–5 years</option>
          <option value="5+">5+ years</option>
        </select>
      </div>
      <div style="margin:12px 0;">
        <label>Billing</label>
        <select id="billingInterval" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;">
          <option value="monthly">Monthly ($300/mo)</option>
          <option value="annual">Annual ($2,500/yr – save 30%)</option>
        </select>
      </div>
      <button onclick="saveProfile()" style="width:100%;padding:14px;background:#8deb00;border:none;border-radius:8px;font-weight:700;font-size:16px;cursor:pointer;">Save Profile →</button>
      <div id="saveError" style="color:red;margin-top:12px;display:none;"></div>
    </div>
  </div>

  <script>
    let uid = null;
    let userData = null;

    async function isReferralCodeUnique(code) {
      if (!code) return false;
      try {
        const snapshot = await window.db.collection('users')
          .where('referralCode', '==', code.toUpperCase())
          .get();
        return snapshot.empty;
      } catch (err) { return false; }
    }

    function loadProfile() {
      window.db.collection('users').doc(uid).get()
        .then(doc => {
          if (!doc.exists) { cdToast('User not found.', 'error'); return; }
          userData = doc.data();
          if (userData.role !== 'Instructor') {
            redirectToDashboard(userData.role);
            return;
          }
          document.getElementById('displayName').textContent = userData.name || '—';
          document.getElementById('displayEmail').textContent = userData.email || '—';

          const existingCode = userData.referralCode || null;
          if (existingCode) {
            document.getElementById('existingCodeDisplay').style.display = 'block';
            document.getElementById('userReferralCode').textContent = existingCode;
            document.getElementById('referralSetup').style.display = 'none';
            document.getElementById('referralStatus').textContent = '';
          } else {
            document.getElementById('existingCodeDisplay').style.display = 'none';
            document.getElementById('referralSetup').style.display = 'flex';
            document.getElementById('referralStatus').textContent = '';
          }

          document.getElementById('teachingExperience').value = userData.teachingExperience || '';
          document.getElementById('billingInterval').value = userData.billingInterval || 'annual';

          document.getElementById('loading').style.display = 'none';
          document.getElementById('content').style.display = 'block';
        })
        .catch(err => {
          document.getElementById('loading').textContent = 'Error: ' + err.message;
        });
    }

    firebase.auth().onAuthStateChanged((user) => {
      if (user) { uid = user.uid; loadProfile(); }
      else { window.location.href = '/test-app/test-login.html'; }
    });

    document.getElementById('newReferralCode')?.addEventListener('input', async function() {
      const code = this.value.trim().toUpperCase();
      const status = document.getElementById('referralStatus');
      if (!code) { status.textContent = ''; status.className = 'referral-status'; return; }
      if (!/^[A-Z0-9]{3,20}$/.test(code)) {
        status.textContent = '⚠️ Only letters & numbers, 3-20 characters';
        status.className = 'referral-status error';
        return;
      }
      try {
        const unique = await isReferralCodeUnique(code);
        if (unique) { status.textContent = '✅ Available'; status.className = 'referral-status available'; }
        else { status.textContent = '❌ Already taken'; status.className = 'referral-status taken'; }
      } catch (err) {
        status.textContent = '⚠️ Error checking';
        status.className = 'referral-status error';
      }
    });

    window.setReferralCode = async function() {
      const input = document.getElementById('newReferralCode');
      const code = input.value.trim().toUpperCase();
      const status = document.getElementById('referralStatus');
      const btn = document.getElementById('setReferralBtn');
      if (!code || !/^[A-Z0-9]{3,20}$/.test(code)) {
        status.textContent = '⚠️ Use 3-20 letters/numbers.';
        status.className = 'referral-status error';
        return;
      }
      try {
        const unique = await isReferralCodeUnique(code);
        if (!unique) {
          status.textContent = '❌ Already taken.';
          status.className = 'referral-status taken';
          return;
        }
      } catch (err) {
        status.textContent = '⚠️ Error checking.';
        status.className = 'referral-status error';
        return;
      }
      btn.disabled = true;
      status.textContent = 'Saving...';
      try {
        await window.db.collection('users').doc(uid).update({
          referralCode: code,
          referralCodeSetAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        userData.referralCode = code;
        document.getElementById('existingCodeDisplay').style.display = 'block';
        document.getElementById('userReferralCode').textContent = code;
        document.getElementById('referralSetup').style.display = 'none';
        status.textContent = '✅ Referral code set!';
        status.className = 'referral-status available';
        cdToast('Referral code set!');
      } catch (err) {
        status.textContent = '❌ Error saving.';
        status.className = 'referral-status error';
        btn.disabled = false;
      }
    };

    window.copyReferralCode = function() {
      const code = document.getElementById('userReferralCode').textContent;
      if (!code || code === '—') return;
      navigator.clipboard.writeText(code).then(() => cdToast('✅ Copied!'))
        .catch(() => {
          const input = document.createElement('input');
          input.value = code;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
          cdToast('✅ Copied!');
        });
    };

    window.saveProfile = function() {
      const teachingExperience = document.getElementById('teachingExperience').value;
      const billingInterval = document.getElementById('billingInterval').value;
      window.db.collection('users').doc(uid).update({
        teachingExperience, billingInterval,
        tourCompleted: true,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => { cdToast('✅ Profile saved!'); redirectToDashboard('Instructor'); })
      .catch(err => {
        document.getElementById('saveError').textContent = err.message;
        document.getElementById('saveError').style.display = 'block';
      });
    };
  </script>
</body>
</html>
