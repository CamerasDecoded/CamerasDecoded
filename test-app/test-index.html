<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home (Test)</title>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Core app (Firebase init + auth/db globals) -->
  <script src="/test-app/test-app.js"></script>

  <!-- User state -->
  <script src="/test-app/test-user-state.js"></script>

  <!-- Access control -->
  <script src="/test-app/test-access-control.js"></script>

  <!-- Top navigation -->
  <script src="/test-app/test-nav-header.js"></script>

  <!-- Sidebar and mobile bottom sheet -->
  <link rel="stylesheet" href="/test-app/test-sidebar.css">
  <script src="/test-app/test-sidebar.js"></script>

  <!-- Bottom navigation -->
  <link rel="stylesheet" href="/test-app/test-bottom-nav.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: #050705;
      color: #fff;
    }
    #app-nav-container {
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .main-content {
      margin: 40px auto;
      margin-left: 260px;  /* keeps content beside the sidebar */
      padding: 20px;
      max-width: 800px;
    }
    @media (max-width: 768px) {
      .main-content {
        margin-left: 0;
        padding: 16px;
      }
    }
    h1 {
      font-size: 32px;
      color: #8deb00;
      margin-bottom: 16px;
    }
    p {
      color: #999;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .button-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 30px;
    }
    a, button {
      padding: 12px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
      border: none;
      font-weight: 600;
    }
    .btn-primary {
      background: #8deb00;
      color: #000;
    }
    .btn-primary:hover {
      background: #a0f520;
    }
    .btn-secondary {
      background: transparent;
      color: #8deb00;
      border: 1px solid #8deb00;
    }
    .btn-secondary:hover {
      background: rgba(141,235,0,0.1);
    }
    .user-status {
      background: rgba(141,235,0,0.1);
      border: 1px solid #8deb00;
      padding: 20px;
      border-radius: 6px;
      margin-top: 30px;
      display: none;
    }
    .user-status.show {
      display: block;
    }
  </style>
</head>
<body>
  <div id="app-nav-container"></div>
  <div id="sidebarContainer"></div>

  <div class="main-content">
    <h1>Cameras Decoded (Test)</h1>
    <p>This is the test home page. Choose a pathway below or log in to continue.</p>

    <div id="guestContent" class="button-group">
      <a href="/test-app/test-signup.html" class="btn-primary">Create Account →</a>
      <a href="/test-app/test-login.html" class="btn-secondary">Log In</a>
    </div>

    <div id="userContent" class="user-status">
      <h2 style="margin-top:0;">Welcome back!</h2>
      <p id="userInfo"></p>
      <p style="font-size:13px;color:#666;">Use the navigation above to explore the dashboard and profile.</p>
    </div>
  </div>

  <!-- Bottom navigation -->
  <div id="bottomNavContainer"></div>
  <script src="/test-app/test-bottom-nav.js"></script>

  <script>
    // Show/hide content based on user state
    window.addEventListener('userStateReady', (e) => {
      const user = e.detail;
      const guestContent = document.getElementById('guestContent');
      const userContent = document.getElementById('userContent');

      if (user.isLoggedIn) {
        guestContent.style.display = 'none';
        userContent.classList.add('show');
        document.getElementById('userInfo').innerHTML = `
          You're logged in as <strong>${user.name}</strong><br>
          Role: <span style="color:#8deb00;">${user.role}</span> | Plan: <span style="color:#8deb00;">${user.tier}</span>
        `;
      } else {
        guestContent.style.display = 'flex';
        userContent.classList.remove('show');
      }
    });
  </script>

</body>
</html>
