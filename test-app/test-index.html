<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cameras Decoded (Test)</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="test-app.js"></script>
</head>
<body>
  <div style="max-width:400px;margin:80px auto;padding:20px;text-align:center;font-family:sans-serif;">
    <h1>📡 Cameras Decoded</h1>
    <p style="color:#666;">TEST ENVIRONMENT</p>
    <div style="margin-top:30px;display:flex;flex-direction:column;gap:12px;">
      <a href="test-signup.html" style="padding:12px 24px;background:#8deb00;color:#000;text-decoration:none;border-radius:8px;font-weight:700;">Sign Up</a>
      <a href="test-login.html" style="padding:12px 24px;background:transparent;color:#8deb00;text-decoration:none;border:1px solid #8deb00;border-radius:8px;">Log In</a>
    </div>
  </div>
  <script>
    auth.onAuthStateChanged(user => {
      if (user) {
        db.collection('users').doc(user.uid).get().then(doc => {
          if (doc.exists) {
            redirectToDashboard(doc.data().role || 'Operator', user.uid);
          }
        });
      }
    });
  </script>
</body>
</html>
