<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Dashboard (Test)</title>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="test-app.js"></script>
  <script src="/test-app/user-state.js"></script>
  <script src="/test-app/nav-header.js"></script>
  <link rel="stylesheet" href="/test-app/sidebar.css">
  <link rel="stylesheet" href="/test-app/announcement.css">
  <script src="/test-app/announcement.js"></script>
  <script src="/test-app/sidebar.js"></script>
  <link rel="stylesheet" href="test-bottom-nav.css">
  <style>
    .main-content { margin-left:260px; padding:20px; max-width:800px; }
    @media (max-width:768px) { .main-content { margin-left:0; padding:16px; } }
  </style>
</head>
<body>
  <div id="app-nav-container"></div>
  <div id="sidebarContainer"></div>

  <div class="main-content">
    <h1>📡 Operator Dashboard (TEST)</h1>
    <div id="loading">Loading...</div>
    <div id="content" style="display:none;">
      <div style="padding:20px;background:#f5f5f5;border-radius:8px;margin-bottom:20px;">
        <h2>Welcome, <span id="userName">—</span>!</h2>
        <p><strong>Username:</strong> <span id="userUsername">—</span></p>
        <p><strong>Plan:</strong> <span id="userTier">Free</span></p>
        <p><strong>Points:</strong> <span id="userPoints">0</span></p>
        <p><strong>Level:</strong> <span id="userLevel">1</span></p>
        <p><strong>Referral Code:</strong> <span id="userReferral">—</span></p>
        <button onclick="copyReferral()" style="padding:6px 16px;background:#8deb00;border:none;border-radius:4px;cursor:pointer;">Copy Referral</button>
        <br><br>
        <button onclick="handleLogout()" style="padding:6px 16px;background:#ff4444;border:none;border-radius:4px;cursor:pointer;color:#fff;">Logout</button>
      </div>
    </div>
  </div>

  <div id="bottomNavContainer">
    <nav class="bottom-nav chasing-border-nav">
      <a href="test-index.html">Home</a>
      <a href="test-operator-dashboard.html">Dashboard</a>
      <a href="learning-journey.html">Journey</a>
      <a href="cynetis-7.html">Cynetis-7</a>
      <a href="test-profile.html">Profile</a>
    </nav>
  </div>
  <script src="test-bottom-nav.js"></script>

  <script>
    let uid = null;

    function loadDashboard() {
      db.collection('users').doc(uid).get()
        .then(doc => {
          if (!doc.exists) { cdToast('User not found.', 'error'); return; }
          const data = doc.data();
          if (data.role !== 'Operator') {
            redirectToDashboard(data.role);
            return;
          }
          document.getElementById('userName').textContent = data.name || '—';
          document.getElementById('userUsername').textContent = data.username || '—';
          document.getElementById('userTier').textContent = data.tier === 'pro' ? 'Pro' : 'Free';
          document.getElementById('userPoints').textContent = data.totalPoints || 0;
          document.getElementById('userLevel').textContent = data.level || 1;
          document.getElementById('userReferral').textContent = data.referralCode || '—';
          document.getElementById('loading').style.display = 'none';
          document.getElementById('content').style.display = 'block';
          if (window.BottomNav) window.BottomNav.setActive();
        })
        .catch(err => {
          document.getElementById('loading').textContent = 'Error: ' + err.message;
        });
    }

    // ---- Init: wait for window.USER ----
    function init() {
      if (window.USER && window.USER.isLoggedIn) {
        // 🔒 Check access
        if (!checkPageAccess()) return;
        uid = window.USER.uid;
        loadDashboard();
      } else {
        // Wait for userStateReady
        window.addEventListener('userStateReady', (e) => {
          if (e.detail.isLoggedIn) {
            if (!checkPageAccess()) return;
            uid = e.detail.uid;
            loadDashboard();
          } else {
            window.location.href = '/test-app/test-login.html';
          }
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    function copyReferral() {
      const link = document.getElementById('userReferral').textContent;
      if (!link || link === '—') { cdToast('Referral code not available.', 'error'); return; }
      const fullLink = 'https://camerasdecoded.com/ref/' + link;
      navigator.clipboard.writeText(fullLink).then(() => cdToast('✅ Copied!'))
        .catch(() => {
          const input = document.createElement('input');
          input.value = fullLink;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
          cdToast('✅ Copied!');
        });
    }
  </script>
</body>
</html>
