<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructor Dashboard (Test)</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Core app -->
  <script src="/test-app/test-app.js"></script>
  <script src="/test-app/test-user-state.js"></script>
  <script src="/test-app/test-access-control.js"></script>
  <script src="/test-app/test-nav-header.js"></script>

  <!-- Sidebar / mobile sheet -->
  <link rel="stylesheet" href="/test-app/test-sidebar.css">
  <script src="/test-app/test-sidebar.js"></script>

  <!-- Announcement -->
  <link rel="stylesheet" href="/test-app/test-announcement.css">
  <script src="/test-app/test-announcement.js"></script>

  <!-- Bottom nav -->
  <link rel="stylesheet" href="/test-app/test-bottom-nav.css">

  <!-- Commission card -->
  <script src="/test-app/test-commission-card.js"></script>

  <style>
    .main-content { margin-left:260px; padding:20px; max-width:800px; }
    @media (max-width:768px) { .main-content { margin-left:0; padding:16px; } }
  </style>
</head>
<body>
  <div id="app-nav-container"></div>
  <div id="sidebarContainer"></div>

  <div class="main-content">
    <h1>📡 Instructor Dashboard (TEST)</h1>
    <div id="loading">Loading...</div>
    <div id="content" style="display:none;">
      <div style="padding:20px;background:#f5f5f5;border-radius:8px;margin-bottom:20px;">
        <h2>Welcome, <span id="userName">—</span>!</h2>
        <p><strong>Experience:</strong> <span id="userExperience">—</span></p>
        <p><strong>License:</strong> Educator</p>
        <p><strong>Billing:</strong> <span id="userBilling">—</span></p>
        <p><strong>Students:</strong> <span id="userStudents">0</span></p>
        <p><strong>Referral:</strong> <span id="userReferral">—</span></p>
        <button onclick="copyReferral()" style="padding:6px 16px;background:#8deb00;border:none;border-radius:4px;cursor:pointer;">Copy Referral</button>
        <br><br>
        <button onclick="handleLogout()" style="padding:6px 16px;background:#ff4444;border:none;border-radius:4px;cursor:pointer;color:#fff;">Logout</button>
      </div>

      <!-- Stats Grid (will host commission card after it) -->
      <div id="statsGrid" class="stats-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;">
        <div style="background:#f5f5f5;padding:12px;border-radius:8px;"><strong>Students:</strong><br><span id="statStudents">0</span></div>
        <div style="background:#f5f5f5;padding:12px;border-radius:8px;"><strong>Lessons:</strong><br><span id="statLessons">0</span></div>
        <div style="background:#f5f5f5;padding:12px;border-radius:8px;"><strong>Earnings:</strong><br><span id="statEarnings">$0.00</span></div>
      </div>
    </div>
  </div>

  <!-- Bottom Nav Container -->
  <div id="bottomNavContainer"></div>
  <script src="/test-app/test-bottom-nav.js"></script>

  <script>
    let uid = null;

    function loadDashboard() {
      db.collection('users').doc(uid).get()
        .then(doc => {
          if (!doc.exists) { cdToast('User not found.', 'error'); return; }
          const data = doc.data();
          if (data.role !== 'Instructor') {
            redirectToDashboard(data.role);
            return;
          }
          const expMap = { '<1': 'Less than 1 year', '1-3': '1–3 years', '3-5': '3–5 years', '5+': '5+ years' };
          document.getElementById('userName').textContent = data.name || '—';
          document.getElementById('userExperience').textContent = expMap[data.teachingExperience] || data.teachingExperience || '—';
          document.getElementById('userBilling').textContent = data.billingInterval === 'annual' ? 'Annual ($2,500/yr)' : 'Monthly ($300/mo)';
          document.getElementById('userStudents').textContent = data.totalStudents || 0;
          document.getElementById('userReferral').textContent = data.referralCode || '—';

          // Update stats grid
          document.getElementById('statStudents').textContent = data.totalStudents || 0;
          document.getElementById('statLessons').textContent = data.totalLessons || 0;
          document.getElementById('statEarnings').textContent = '$' + (data.referralStats?.totalEarnings || 0).toFixed(2);

          document.getElementById('loading').style.display = 'none';
          document.getElementById('content').style.display = 'block';

          if (window.BottomNav) window.BottomNav.setActive();

          // Insert commission card after stats grid
          window.insertCommissionCard('statsGrid', 'after');
        })
        .catch(err => {
          document.getElementById('loading').textContent = 'Error: ' + err.message;
        });
    }

    function init() {
      if (window.USER && window.USER.isLoggedIn) {
        uid = window.USER.uid;
        loadDashboard();
      } else {
        window.addEventListener('userStateReady', (e) => {
          if (e.detail.isLoggedIn) {
            uid = e.detail.uid;
            loadDashboard();
          } else {
            window.location.href = '/test-app/test-login.html';
          }
        });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    function copyReferral() {
      const link = document.getElementById('userReferral').textContent;
      if (!link || link === '—') { cdToast('Referral code not available.', 'error'); return; }
      const fullLink = 'https://camerasdecoded.com/ref/' + link;
      navigator.clipboard.writeText(fullLink).then(() => cdToast('✅ Copied!'))
        .catch(() => {
          const input = document.createElement('input');
          input.value = fullLink;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
          cdToast('✅ Copied!');
        });
    }
  </script>
</body>
</html>
