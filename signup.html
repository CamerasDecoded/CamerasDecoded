<body>

  <canvas id="particles"></canvas>
  <div id="blast-container"></div>

  <div class="onboarding-wrapper">
    <div class="signal-meter">
      <span class="label" id="signalLabel">SIGNAL</span>
      <div class="bar"><div class="fill" id="signalFill"></div></div>
      <span class="percentage" id="signalPercent">0%</span>
    </div>
    <div class="top-links">
      <a href="https://camerasdecoded.com"><i class="fas fa-arrow-left"></i> back to camerasdecoded.com</a>
    </div>
    <div class="step-wave" id="stepWave"></div>
    <div class="step-container" id="stepContainer"></div>
  </div>

  <!-- BACK CONFIRM OVERLAY -->
  <div class="back-confirm-overlay" id="backConfirmOverlay">
    <div class="back-confirm-modal">
      <div class="icon-ring"><i class="fas fa-exclamation-triangle"></i></div>
      <h3>Hold your signal</h3>
      <p>You're about to step back from the final activation. Your progress won't be lost, but you'll need to complete your password to lock in your dashboard.</p>
      <div class="btn-group">
        <button class="btn-secondary" onclick="closeBackConfirm()">Stay &amp; Finish</button>
        <button class="btn-primary" onclick="confirmGoBack()">Go Back</button>
      </div>
    </div>
  </div>

  <script>
    // ================================================================
    // GLOBAL FLIGHT FLAG – suppresses background auth listeners
    // ================================================================
    window.isCamerasDecodedSignupFlight = false;

    // ================================================================
    // HELPER FUNCTIONS
    // ================================================================
    function getReferralParam() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('ref') || null;
    }
    const referralParam = getReferralParam();
    if (referralParam) { localStorage.setItem('signup_referral', referralParam); }

    function triggerBlast(x, y) {
      const container = document.getElementById('blast-container');
      const count = 30;
      for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'blast-particle';
        const angle = Math.random() * 2 * Math.PI;
        const distance = 80 + Math.random() * 200;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;
        particle.style.setProperty('--tx', tx + 'px');
        particle.style.setProperty('--ty', ty + 'px');
        particle.style.left = (x - 6) + 'px';
        particle.style.top = (y - 6) + 'px';
        const size = 6 + Math.random() * 12;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';

    // ================================================================
    // CORE FUNCTIONS
    // ================================================================
    function typeWriter(element, text, speed = 40) {
      if (titleInterval) clearInterval(titleInterval);
      let i = 0;
      element.textContent = '';
      function type() {
        if (i < text.length) { element.textContent += text.charAt(i); i++; }
        else { clearInterval(titleInterval); titleInterval = null; }
      }
      titleInterval = setInterval(type, speed);
    }

    function saveFormData() {
      document.querySelectorAll('#stepContainer input, #stepContainer select, #stepContainer textarea').forEach(el => {
        if (el.id) {
          if (el.type === 'checkbox' || el.type === 'radio') { formData[el.id] = el.checked; }
          else { formData[el.id] = el.value; }
        }
      });
      formData['selectedGear'] = Array.from(document.querySelectorAll('.gear-card.selected')).map(el => el.dataset.brand);
      formData['selectedLenses'] = Array.from(document.querySelectorAll('.lens-chip.selected')).map(el => el.dataset.lens);
      formData['selectedInterests'] = Array.from(document.querySelectorAll('#interestChips .interest-chip.selected')).map(el => el.dataset.interest);
      formData['painPoints'] = Array.from(document.querySelectorAll('#painChips .interest-chip.selected')).map(el => el.dataset.pain);
      const slider = document.getElementById('confidenceSlider'); if (slider) formData['confidenceSlider'] = slider.value;
      const tierEl = document.querySelector('.pricing-card.selected'); if (tierEl) formData['operatorTier'] = tierEl.dataset.tier;
      formData['isAnnual'] = isAnnual;
      formData['isWeekly'] = isWeekly;
      // console.log('🔍 formData after save:', formData);
    }

    function restoreFormData() {
      document.querySelectorAll('#stepContainer input, #stepContainer select, #stepContainer textarea').forEach(el => {
        if (el.id && formData.hasOwnProperty(el.id)) {
          if (el.type === 'checkbox' || el.type === 'radio') { el.checked = formData[el.id]; }
          else { el.value = formData[el.id]; }
        }
      });
    }

    function restoreSelections() {
      if (formData.selectedGear && formData.selectedGear.length > 0) {
        document.querySelectorAll('.gear-card').forEach(card => {
          if (formData.selectedGear.includes(card.dataset.brand)) card.classList.add('selected');
        });
      }
      if (formData.selectedLenses && formData.selectedLenses.length > 0) {
        document.querySelectorAll('.lens-chip').forEach(chip => {
          if (formData.selectedLenses.includes(chip.dataset.lens)) chip.classList.add('selected');
        });
      }
      if (formData.selectedInterests && formData.selectedInterests.length > 0) {
        document.querySelectorAll('#interestChips .interest-chip').forEach(chip => {
          if (formData.selectedInterests.includes(chip.dataset.interest)) chip.classList.add('selected');
        });
        const countEl = document.getElementById('interestCount');
        if (countEl) countEl.textContent = formData.selectedInterests.length;
      }
      if (formData.painPoints && formData.painPoints.length > 0) {
        document.querySelectorAll('#painChips .interest-chip').forEach(chip => {
          if (formData.painPoints.includes(chip.dataset.pain)) chip.classList.add('selected');
        });
        const countEl = document.getElementById('painCount');
        if (countEl) countEl.textContent = formData.painPoints.length;
      }
      if (formData.confidenceSlider) {
        const slider = document.getElementById('confidenceSlider');
        if (slider) { slider.value = formData.confidenceSlider; updateConfidence(formData.confidenceSlider); }
      }
      if (formData.operatorTier) { selectTier(formData.operatorTier); }
      if (formData.isAnnual !== undefined) { isAnnual = formData.isAnnual; const toggle = document.getElementById('billingToggle'); if (toggle) { if (isAnnual) toggle.classList.add('annual'); else toggle.classList.remove('annual'); } updatePricingDisplay(); }
      if (formData.isWeekly !== undefined) { isWeekly = formData.isWeekly; const weeklyEl = document.getElementById('weeklyOption'); const wrap = document.getElementById('billingWrap'); if (weeklyEl && wrap) { if (isWeekly) { weeklyEl.classList.add('selected'); wrap.classList.add('overridden'); } else { weeklyEl.classList.remove('selected'); wrap.classList.remove('overridden'); } } updatePricingDisplay(); }
    }

    function renderStepWave() {
      const wave = document.getElementById('stepWave');
      wave.innerHTML = '';
      const totalDots = steps.length + 1;
      const activeIndex = currentStepIndex + 1;
      for (let i = 0; i < totalDots; i++) {
        const dot = document.createElement('span');
        dot.className = 'wave-dot';
        if (i < activeIndex) dot.classList.add('done');
        else if (i === activeIndex) dot.classList.add('active');
        wave.appendChild(dot);
      }
    }

    function updateSignalMeter() {
      const total = steps.length + 1;
      const current = currentStepIndex + 1;
      const pct = Math.round((current / (total - 1)) * 100);
      document.getElementById('signalFill').style.width = pct + '%';
      document.getElementById('signalPercent').textContent = pct + '%';
    }

    function updateSignalGlow() {
      const label = document.getElementById('signalLabel');
      label.classList.remove('pulse-glow', 'static-glow');
      if (currentStepIndex === steps.length - 1) { label.classList.add('static-glow'); }
      else { label.classList.add('pulse-glow'); }
    }

    function updatePercentageGlow() {
      const pctEl = document.getElementById('signalPercent');
      pctEl.classList.remove('static-glow');
      if (currentStepIndex === steps.length - 1) pctEl.classList.add('static-glow');
    }

    // ================================================================
    // RENDER CURRENT STEP
    // ================================================================
    function renderCurrentStep() {
      saveFormData();
      const container = document.getElementById('stepContainer');
      const stepData = steps[currentStepIndex];
      const titleText = stepData.title;

      let html = `<div class="step active"><div class="path-indicator"><i class="fas fa-route"></i> Path: ${selectedRole}</div><h2><span class="icon">${stepData.icon}</span><span class="title-text" id="titleText">${titleText}</span><span class="typing-cursor"></span></h2><p class="sub">${stepData.subtitle}</p>${stepData.html}`;
      let backButtonHtml = '';
      if (currentStepIndex === 0) {
        backButtonHtml = `<button class="btn-back-path" onclick="goToRoleSelection()"><i class="fas fa-arrow-left"></i> Back to Path Selection</button>`;
      } else {
        if (currentStepIndex === steps.length - 1) {
          backButtonHtml = `<button class="btn-secondary" onclick="requestBackConfirmation()">← Back</button>`;
        } else {
          backButtonHtml = `<button class="btn-secondary" onclick="prevStep()">← Back</button>`;
        }
      }
      if (stepData.buttonText) {
        html += `<div class="btn-group">${backButtonHtml}<button class="btn-primary" onclick="nextStep()">${stepData.buttonText}</button></div>`;
      }
      html += `<div class="bottom-login-link"><i class="fas fa-sign-in-alt"></i> <a href="login.html">Already have an account? Log in</a></div></div>`;
      container.innerHTML = html;
      restoreFormData();
      restoreSelections();

      if (currentStepIndex === steps.length - 1) {
        const summaryCard = document.getElementById('summaryCard');
        if (summaryCard) {
          updateSummary();
          const btn = document.getElementById('activateBtn');
          if (btn) {
            btn.style.display = 'block';
            btn.removeEventListener('click', window.activateSignal);
            btn.addEventListener('click', window.activateSignal);
          }
          setTimeout(initSlider, 150);
        }
      }
      renderStepWave();
      updateSignalMeter();
      updateSignalGlow();
      updatePercentageGlow();

      const titleEl = document.getElementById('titleText');
      if (titleEl) {
        if (titleInterval) clearInterval(titleInterval);
        titleInterval = null;
        typeWriter(titleEl, titleText, 50);
      }
    }

    function nextStep() {
      const stepData = steps[currentStepIndex];
      if (stepData.onNext && !stepData.onNext()) return;
      if (currentStepIndex < steps.length - 1) { currentStepIndex++; renderCurrentStep(); }
    }

    function prevStep() { if (currentStepIndex > 0) { currentStepIndex--; renderCurrentStep(); } else { goToRoleSelection(); } }

    function requestBackConfirmation() { openBackConfirm(function() { prevStep(); }); }

    function goToRoleSelection() {
      selectedRole = null; currentPath = null; currentStepIndex = 0; steps = [];
      if (titleInterval) clearInterval(titleInterval); titleInterval = null;
      formData = {};
      sliderConfirmed = false;
      socialUserData = null;
      showRoleSelection();
      document.getElementById('signalFill').style.width = '0%';
      document.getElementById('signalPercent').textContent = '0%';
      document.getElementById('signalLabel').classList.remove('pulse-glow', 'static-glow');
      document.getElementById('signalLabel').classList.add('pulse-glow');
    }

    function selectPath(role) {
      formData = {};
      sliderConfirmed = false;
      socialUserData = null;
      selectedRole = role;
      currentPath = role;
      steps = paths[role];
      currentStepIndex = 0;
      selectedTier = 'free'; isAnnual = false; isWeekly = false;
      partnerSelectedTier = 'signal'; partnerIsAnnual = false;
      instructorIsAnnual = true;
      renderCurrentStep();

      container.innerHTML = `<div class="step active"><h2><span class="icon">🛠️</span><span class="title-text" id="titleText">Choose Your Path</span><span class="typing-cursor"></span></h2><p class="sub">How will you use Cameras Decoded?</p><div class="role-grid"><div class="role-card operator-highlight" onclick="selectPath('Operator')"><i class="fas fa-camera"></i><h4>Operator</h4><p>For individual photographers & videographers</p></div><div class="role-card" onclick="selectPath('Partner')"><i class="fas fa-store"></i><h4>Partner</h4><p>For camera stores, schools & training programs</p></div><div class="role-card" onclick="selectPath('Instructor')"><i class="fas fa-chalkboard-teacher"></i><h4>Instructor</h4><p>For working photographers who teach</p></div></div><div class="bottom-login-link"><i class="fas fa-sign-in-alt"></i> <a href="login.html">Already have an account? Log in</a></div></div>`;

    // ================================================================
    // TOGGLE FUNCTIONS
    // ================================================================
    window.toggleBrand = function(el) { el.classList.toggle('selected'); saveFormData(); };
    window.toggleLens = function(el) { el.classList.toggle('selected'); saveFormData(); };
    window.toggleInterest = function(el) {
      const selected = document.querySelectorAll('#interestChips .interest-chip.selected');
      if (el.classList.contains('selected')) { el.classList.remove('selected'); }
      else {
        if (selected.length >= 3) { cdToast('You can select up to 3 interests.', 'error'); return; }
        el.classList.add('selected');
      }
      const countEl = document.getElementById('interestCount');
      if (countEl) countEl.textContent = document.querySelectorAll('#interestChips .interest-chip.selected').length;
      saveFormData();
    };
    window.togglePain = function(el) {
      const selected = document.querySelectorAll('#painChips .interest-chip.selected');
      if (el.classList.contains('selected')) { el.classList.remove('selected'); }
      else {
        if (selected.length >= 3) { cdToast('You can select up to 3 pain points.', 'error'); return; }
        el.classList.add('selected');
      }
      const countEl = document.getElementById('painCount');
      if (countEl) countEl.textContent = document.querySelectorAll('#painChips .interest-chip.selected').length;
      saveFormData();
    };
    window.updateConfidence = function(val) {
      const statuses = {1:'New Signal',2:'Faint Signal',3:'Weak Signal',4:'Scanning',5:'Locking On',6:'Locking On',7:'Strong Signal',8:'Strong Signal',9:'Locked',10:'Locked'};
      const statusEl = document.getElementById('confidenceStatus');
      if (statusEl) statusEl.textContent = statuses[val] || 'Locking On';
      const pct = ((val - 1) / 9) * 100;
      const fill = document.getElementById('sliderTrackFill');
      if (fill) fill.style.width = pct + '%';
      const ring = document.getElementById('pulseRing');
      if (ring) { ring.style.display = 'block'; ring.style.animation = 'none'; setTimeout(() => { ring.style.animation = 'pulseRing 1.2s ease-out forwards'; setTimeout(() => { ring.style.display = 'none'; }, 1200); }, 10); }
      saveFormData();
    };
    window.selectTier = function(tier) {
      selectedTier = tier;
      document.querySelectorAll('.pricing-card').forEach(c => c.classList.remove('selected'));
      const card = document.querySelector(`.pricing-card[data-tier="${tier}"]`);
      if (card) card.classList.add('selected');
      const phoneGroup = document.getElementById('phoneGroup');
      if (phoneGroup) phoneGroup.style.display = tier === 'pro' ? 'block' : 'none';
      saveFormData();
    };
    window.toggleBilling = function() {
      if (isWeekly) { isWeekly = false; document.getElementById('weeklyOption').classList.remove('selected'); document.getElementById('billingWrap').classList.remove('overridden'); }
      isAnnual = !isAnnual;
      document.getElementById('billingToggle').classList.toggle('annual', isAnnual);
      updatePricingDisplay();
      saveFormData();
    };
    window.toggleWeekly = function() {
      const el = document.getElementById('weeklyOption');
      const wrap = document.getElementById('billingWrap');
      if (isWeekly) { isWeekly = false; el.classList.remove('selected'); wrap.classList.remove('overridden'); }
      else { isWeekly = true; el.classList.add('selected'); wrap.classList.add('overridden'); }
      updatePricingDisplay();
      saveFormData();
    };
    window.clearWeekly = function() {
      if (isWeekly) { isWeekly = false; document.getElementById('weeklyOption').classList.remove('selected'); document.getElementById('billingWrap').classList.remove('overridden'); updatePricingDisplay(); saveFormData(); }
    };
    function updatePricingDisplay() {
      const priceEl = document.getElementById('proPrice');
      const periodEl = document.getElementById('proPeriod');
      const badgeEl = document.getElementById('proSavingBadge');
      if (!priceEl) return;
      if (isWeekly) { priceEl.innerHTML = '<span class="currency">$</span>8'; periodEl.textContent = '/ week'; badgeEl.textContent = 'Flexible – cancel anytime'; badgeEl.style.display = 'inline-block'; return; }
      if (isAnnual) { priceEl.innerHTML = '<span class="currency">$</span>199'; periodEl.textContent = '/ year'; badgeEl.textContent = 'Save 30% vs monthly'; badgeEl.style.display = 'inline-block'; }
      else { priceEl.innerHTML = '<span class="currency">$</span>24'; periodEl.textContent = '/ month'; badgeEl.textContent = 'Save 30% yearly'; badgeEl.style.display = 'inline-block'; }

    // ================================================================

    function initSlider() {
      const container = document.getElementById('sliderConfirmContainer');
      const knob = document.getElementById('sliderKnob');
      const track = document.getElementById('sliderTrack');
      const label = document.getElementById('sliderLabel');
      const confirmed = document.getElementById('sliderConfirmed');
      if (!container) return;
      sliderConfirmed = false;
      const containerWidth = container.offsetWidth;
      const knobWidth = 44;
      const maxLeft = containerWidth - knobWidth - 8;
      let currentLeft = 4;
      let dragging = false;

      function updateSlider(clientX) {
        const rect = container.getBoundingClientRect();
        let newLeft = clientX - rect.left - knobWidth / 2;
        newLeft = Math.max(4, Math.min(maxLeft, newLeft));
        currentLeft = newLeft;
        knob.style.left = newLeft + 'px';
        const progress = (newLeft - 4) / (maxLeft - 4);
        track.style.width = (progress * 100) + '%';
        if (progress >= 0.95) {
          sliderConfirmed = true;
          label.style.display = 'none';
          confirmed.style.display = 'inline';
          container.style.borderColor = 'var(--green)';
          knob.innerHTML = '<i class="fas fa-check"></i>';
          knob.style.background = 'var(--green)';
          document.getElementById('confirmError').style.display = 'none';
        } else {
          sliderConfirmed = false;
          label.style.display = 'inline';
          confirmed.style.display = 'none';
          container.style.borderColor = 'var(--border)';
          knob.innerHTML = '<i class="fas fa-arrow-right"></i>';
        }
      }

      function startDrag(e) {
        e.preventDefault();
        dragging = true;
        const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
        knob.style.cursor = 'grabbing';
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchmove', onDragTouch, { passive: false });
        document.addEventListener('touchend', endDragTouch);
      }

      function onDrag(e) { e.preventDefault(); if (!dragging) return; updateSlider(e.clientX); }
      function onDragTouch(e) { e.preventDefault(); if (!dragging) return; updateSlider(e.touches[0].clientX); }

      function endDrag() {
        dragging = false;
        knob.style.cursor = 'grab';
        if (!sliderConfirmed) {
          knob.style.left = '4px';
          track.style.width = '0%';
          label.style.display = 'inline';
          confirmed.style.display = 'none';
          container.style.borderColor = 'var(--border)';
          knob.innerHTML = '<i class="fas fa-arrow-right"></i>';
        }
        document.removeEventListener('mousemove', onDrag);
        document.removeEventListener('mouseup', endDrag);
        document.removeEventListener('touchmove', onDragTouch);
        document.removeEventListener('touchend', endDragTouch);
      }

      function endDragTouch() {
        dragging = false;
        if (!sliderConfirmed) {
          knob.style.left = '4px';
          track.style.width = '0%';
          label.style.display = 'inline';
          confirmed.style.display = 'none';
          container.style.borderColor = 'var(--border)';
          knob.innerHTML = '<i class="fas fa-arrow-right"></i>';
        }
        document.removeEventListener('mousemove', onDrag);
        document.removeEventListener('mouseup', endDrag);
        document.removeEventListener('touchmove', onDragTouch);
        document.removeEventListener('touchend', endDragTouch);
      }

      knob.addEventListener('mousedown', startDrag);
      container.addEventListener('mousedown', function(e) {
        if (e.target === knob) return;
        const rect = container.getBoundingClientRect();
        const clickX = e.clientX - rect.left - knobWidth / 2;
        if (clickX > 20 && clickX < containerWidth - 20) { startDrag(e); updateSlider(e.clientX); }
      });
      knob.addEventListener('touchstart', startDrag, { passive: true });
      container.addEventListener('touchstart', function(e) {
        if (e.target === knob) return;
        const rect = container.getBoundingClientRect();
        const touch = e.touches[0];
        const clickX = touch.clientX - rect.left - knobWidth / 2;
        if (clickX > 20 && clickX < containerWidth - 20) { startDrag(e); updateSlider(touch.clientX); }
      }, { passive: true });
      window.addEventListener('resize', function() { if (!sliderConfirmed) { knob.style.left = '4px'; track.style.width = '0%'; } });
    }

    // ================================================================
    // COPY REFERRAL LINK
    // ================================================================
    window.copyNewReferralLink = function() {
      const link = document.getElementById('newReferralLink')?.textContent;
      if (!link) return;
      navigator.clipboard.writeText('https://' + link).then(() => cdToast('Referral link copied!', '')).catch(() => {
        const input = document.createElement('input');
        input.value = 'https://' + link;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        cdToast('Copied!', '');
      });
    };

    // ================================================================
    // REDIRECT (appends uid as query parameter)
    // ================================================================
    function redirectToDashboard(role, uid) {
      const map = {
        'Operator': 'operator-dashboard.html',
        'Instructor': 'instructor-dashboard.html',
        'Partner': 'partner-dashboard.html',
        'admin': 'admin-dashboard.html',
        'Admin': 'admin-dashboard.html'
      };
      let url = map[role] || 'operator-dashboard.html';
      const target = new URL(url, window.location.origin);
      target.searchParams.set('uid', uid);
      // Clear the flight flag before navigating
      window.isCamerasDecodedSignupFlight = false;
      window.location.href = target.toString();
    }

    // ================================================================
    // ACTIVATE SIGNAL – with flight flag, redirect with uid
    // ================================================================
    window.activateSignal = function() {
      // 🔥 Set the flight flag to suppress background reads
      window.isCamerasDecodedSignupFlight = true;
      
      // Capture all form data
      saveFormData();
      
      console.log('🚀 Activating signal with formData:', formData);

      const btn = document.getElementById('activateBtn');
      const spinner = document.getElementById('signupSpinner');
      const errorEl = document.getElementById('signupError');
      const locked = document.getElementById('signalLocked');

      // ---- Validate slider ----
      if (!sliderConfirmed) {
        const confirmError = document.getElementById('confirmError');
        if (confirmError) confirmError.style.display = 'block';
        errorEl.textContent = '⚠️ Please slide to confirm your agreement.';
        errorEl.style.display = 'block';
        const container = document.getElementById('sliderConfirmContainer');
        if (container) {
          container.style.borderColor = '#ff4a4a';
          container.style.boxShadow = '0 0 20px rgba(255,74,74,0.2)';
          setTimeout(() => { container.style.borderColor = 'var(--border)'; container.style.boxShadow = 'none'; }, 2000);
        }
        window.isCamerasDecodedSignupFlight = false;
        return;
      }
      const confirmError = document.getElementById('confirmError');
      if (confirmError) confirmError.style.display = 'none';

      // ---- Validate fields ----
      const name = formData['fullName'] || '';
      const email = formData['email'] || '';
      const username = formData['username'] || '';
      const isSocialUser = socialUserData !== null;
      const password = document.getElementById('password')?.value?.trim() || '';
      const confirmPassword = document.getElementById('confirmPassword')?.value?.trim() || '';

      if (!name || !email || !username) {
        errorEl.textContent = '⚠️ Please fill in all required fields.';
        errorEl.style.display = 'block';
        window.isCamerasDecodedSignupFlight = false;
        return;
      }

      if (!isSocialUser) {
        if (!password || password.length < 6) {
          errorEl.textContent = '⚠️ Password must be at least 6 characters.';
          errorEl.style.display = 'block';
          window.isCamerasDecodedSignupFlight = false;
          return;
        }
        if (password !== confirmPassword) {
          document.getElementById('confirmPasswordError').style.display = 'block';
          errorEl.textContent = '⚠️ Passwords do not match.';
          errorEl.style.display = 'block';
          window.isCamerasDecodedSignupFlight = false;
          return;
        }
        document.getElementById('confirmPasswordError').style.display = 'none';
      }

      if (typeof firebase === 'undefined' || !firebase.auth) {
        errorEl.textContent = '⚠️ Firebase not loaded. Please refresh and try again.';
        errorEl.style.display = 'block';
        window.isCamerasDecodedSignupFlight = false;
        return;
      }

      btn.style.display = 'none';
      spinner.style.display = 'block';
      errorEl.style.display = 'none';

      const userAuth = auth;
      const firestore = db;

      // 🔥 Auto-generate referral code
      let referralCode = username.toLowerCase().replace(/[^a-z0-9]/g, '');
      if (!referralCode || referralCode.length < 3) {
        referralCode = Math.random().toString(36).substring(2, 8);
      }

      // Build userData
      let userData = {
        name,
        email,
        username,
        role: selectedRole,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        referralCode: referralCode,
        totalReferrals: 0,
        totalCommissionEarned: 0,
        ambassadorTier: 'signal'
      };

      // Store referrer if any (but do NOT increment their count)
      const referredBy = localStorage.getItem('signup_referral') || null;
      if (referredBy) {
        userData.referredBy = referredBy;
      }

      if (selectedRole === 'Operator') {
        const phone = formData['phone'] || '';
        const confidence = parseInt(formData['confidenceSlider']) || 0;
        const challenge = formData['challenge'] || '';
        const shootFrequency = formData['shootFrequency'] || '';
        const learningStyle = formData['learningStyle'] || '';
        const brands = formData['selectedGear'] || [];
        const lenses = formData['selectedLenses'] || [];
        const interests = formData['selectedInterests'] || [];
        let billingInterval = 'monthly';
        if (isWeekly) billingInterval = 'weekly';
        else if (isAnnual) billingInterval = 'annual';

        const learningJourney = {
          experience: formData['experience'] || '',
          primaryGoal: formData['primaryGoal'] || '',
          ambition: formData['ambition'] || '',
          contentFormat: formData['contentFormat'] || '',
          deliveryChannel: formData['deliveryChannel'] || '',
          painPoints: formData['painPoints'] || [],
          sixMonthGoal: formData['sixMonthGoal'] || '',
          dreamProject: formData['dreamProject'] || '',
          challenge: challenge,
          shootFrequency: shootFrequency,
          learningStyle: learningStyle,
          confidence: confidence
        };

        userData = {
          ...userData,
          phone: selectedTier === 'pro' ? phone : null,
          tier: selectedTier,
          billingInterval,
          confidence,
          challenge,
          shootFrequency,
          learningStyle,
          preferences: { brands, lenses, interests },
          savedCards: [],
          savedBlogs: [],
          savedPodcasts: [],
          savedCommunityPosts: [],
          savedProtocols: [],
          learningJourney: learningJourney
        };
      } else if (selectedRole === 'Partner') {
        const companyName = formData['companyName'] || '';
        const tier = partnerSelectedTier;
        const isAnnualPartner = partnerIsAnnual;
        userData = {
          ...userData,
          companyName,
          partnerTier: tier,
          billingInterval: isAnnualPartner ? 'annual' : 'monthly',
          partnerId: 'PART-' + Math.random().toString(36).substring(2, 8),
          clicks: 0,
          downloads: 0,
          agreements: 0,
          referredStudents: 0
        };
      } else if (selectedRole === 'Instructor') {
        const teachingExperience = formData['teachingExperience'] || '';
        const isAnnualInst = instructorIsAnnual;
        userData = {
          ...userData,
          teachingExperience,
          instructorLicense: 'educator',
          billingInterval: isAnnualInst ? 'annual' : 'monthly',
          instructorId: 'INSTR-' + Math.random().toString(36).substring(2, 8),
          totalStudents: 0,
          totalWorkshops: 0,
          guideSales: 0,
          totalCohorts: 0,
          nextBillingDate: new Date(Date.now() + 30*24*60*60*1000).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })
        };
      }

      let createPromise;
      if (isSocialUser) {
        const user = userAuth.currentUser;
        if (!user || user.uid !== socialUserData.uid) {
          errorEl.textContent = '⚠️ Social login session expired. Please try again.';
          errorEl.style.display = 'block';
          btn.style.display = 'block';
          spinner.style.display = 'none';
          window.isCamerasDecodedSignupFlight = false;
          return;
        }
        createPromise = Promise.resolve(user);
      } else {
        createPromise = userAuth.createUserWithEmailAndPassword(email, password);
      }

      createPromise
        .then(cred => {
          const user = isSocialUser ? cred : cred.user;
          const uid = user.uid;
          if (selectedRole === 'Partner') userData.partnerId = 'PART-' + uid.slice(0, 6).toUpperCase();
          else if (selectedRole === 'Instructor') userData.instructorId = 'INSTR-' + uid.slice(0, 6).toUpperCase();
          return user.updateProfile({ displayName: name }).catch(()=>{}).then(() => ({ user, uid }));
        })
        .then(({ user, uid }) => {
          // Write the user document – this is the only Firestore write
          userData.email = (userData.email || email || '').trim().toLowerCase();
          userData.uid = uid;
          return firestore.collection('users').doc(uid).set(userData, {merge:true});
        })
        .then(() => {
          // Success – show confirmation and redirect with uid
          btn.style.display = 'none';
          spinner.style.display = 'none';
          locked.style.display = 'block';
          const linkEl = document.getElementById('newReferralLink');
          if (linkEl) { linkEl.textContent = `camerasdecoded.com/ref/${referralCode}`; }
          localStorage.removeItem('signup_referral');
          socialUserData = null;
          
          // Redirect using the helper that appends uid
          redirectToDashboard(selectedRole, auth.currentUser.uid);
        })
        .catch(err => {
          console.error('Signup error:', err);
          let errorMessage = err.message || 'Something went wrong.';
          if (err.code === 'auth/email-already-in-use') {
            errorMessage = '❌ This email is already registered. Please <a href="login.html" style="color:#8deb00; text-decoration:underline;">log in</a> instead.';
          } else if (err.code === 'auth/weak-password') {
            errorMessage = '❌ Password is too weak. Please use at least 6 characters.';
          } else if (err.code === 'auth/invalid-email') {
            errorMessage = '❌ Invalid email address.';
          } else if (err.code === 'auth/network-request-failed') {
            errorMessage = '❌ Network error. Please check your connection.';
          } else if (err.code === 'auth/too-many-requests') {
            errorMessage = '❌ Too many attempts. Please try again later.';
          } else if (err.code === 'auth/invalid-credential') {
            errorMessage = '❌ Invalid credentials. Please ensure your email and password are correct.';
          } else {
            errorMessage = '❌ ' + errorMessage;
          }
          errorEl.innerHTML = errorMessage;
          errorEl.style.display = 'block';
          btn.style.display = 'block';
          spinner.style.display = 'none';
          window.isCamerasDecodedSignupFlight = false;
          // FIXED: Do NOT delete Auth user on Firestore failure.
          // Deleting creates orphaned docs and allows duplicate emails.
          // If Firestore write failed, user is still logged in – we can retry set() on next login.
        });
    };

    // ================================================================
    // AUTH STATE LISTENER – with flight guard
    // ================================================================
    auth.onAuthStateChanged((user) => {
      // 🛡️ If a signup/login flight is active, suppress all background reads
      if (window.isCamerasDecodedSignupFlight) {
        console.log('Flight active: suppressing background reads.');
        return;
      }
      // Normal behaviour – do nothing, the page handles its own logic.
    });

    // ================================================================
    // PARTICLES
    // ================================================================
    (function() {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      let w, h;
      const particles = [];
      const count = 120;
      function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize); resize();
      class Particle { constructor() { this.x = Math.random() * w; this.y = Math.random() * h; this.size = Math.random() * 2.5 + 0.5; this.speedX = (Math.random() - 0.5) * 0.4; this.speedY = (Math.random() - 0.5) * 0.4; this.opacity = Math.random() * 0.4 + 0.1; } update() { this.x += this.speedX; this.y += this.speedY; if (this.x < 0 || this.x > w) this.speedX *= -1; if (this.y < 0 || this.y > h) this.speedY *= -1; } draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fillStyle = `rgba(141,235,0,${this.opacity})`; ctx.fill(); } }
      for (let i = 0; i < count; i++) particles.push(new Particle());
      function animate() { ctx.clearRect(0, 0, w, h); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
      animate();
    })();

    // ================================================================
    // INIT
    // ================================================================
    document.addEventListener('DOMContentLoaded', function() {
      showRoleSelection();
    });

    document.addEventListener('input', function(e) { if (e.target.closest('#stepContainer')) { saveFormData(); } });
    document.addEventListener('change', function(e) { if (e.target.closest('#stepContainer')) { saveFormData(); } });
  </script>
</body>
