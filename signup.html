<body>

  <canvas id="particles"></canvas>
  <div id="blast-container"></div>

  <div class="onboarding-wrapper">
    <div class="signal-meter">
      <span class="label" id="signalLabel">SIGNAL</span>
      <div class="bar"><div class="fill" id="signalFill"></div></div>
      <span class="percentage" id="signalPercent">0%</span>
    </div>
    <div class="top-links">
      <a href="https://camerasdecoded.com"><i class="fas fa-arrow-left"></i> back to camerasdecoded.com</a>
    </div>
    <div class="step-wave" id="stepWave"></div>
    <div class="step-container" id="stepContainer"></div>
    <div id="cd-toast-container"></div>
  </div>

  <div class="back-confirm-overlay" id="backConfirmOverlay">
    <div class="back-confirm-modal">
      <div class="icon-ring"><i class="fas fa-exclamation-triangle"></i></div>
      <h3>Hold your signal</h3>
      <p>You're about to step back from the final activation. Your progress won't be lost, but you'll need to complete your password to lock in your dashboard.</p>
      <div class="btn-group">
        <button class="btn-secondary" onclick="closeBackConfirm()">Stay &amp; Finish</button>
        <button class="btn-primary" onclick="confirmGoBack()">Go Back</button>
      </div>
    </div>
  </div>

  <script>
    // ================================================================
    // HELPER FUNCTIONS
    // ================================================================
    function cdToast(message, type) {
      const container = document.getElementById('cd-toast-container');
      const toast = document.createElement('div');
      toast.className = 'cd-toast' + (type === 'error' ? ' error' : '');
      toast.textContent = message;
      container.appendChild(toast);
      requestAnimationFrame(() => { toast.classList.add('show'); });
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 4000);
    }
    function getReferralParam() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('ref') || null;
    }
    const referralParam = getReferralParam();
    if (referralParam) { localStorage.setItem('signup_referral', referralParam); }

    function triggerBlast(x, y) {
      const container = document.getElementById('blast-container');
      const count = 30;
      for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'blast-particle';
        const angle = Math.random() * 2 * Math.PI;
        const distance = 80 + Math.random() * 200;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;
        particle.style.setProperty('--tx', tx + 'px');
        particle.style.setProperty('--ty', ty + 'px');
        particle.style.left = (x - 6) + 'px';
        particle.style.top = (y - 6) + 'px';
        const size = 6 + Math.random() * 12;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.background = Math.random() > 0.5 ? '#8deb00' : '#a0f520';
        particle.style.boxShadow = `0 0 ${size * 1.5}px rgba(141,235,0,0.5)`;
        particle.style.animationDuration = (0.6 + Math.random() * 0.4) + 's';
        container.appendChild(particle);
        setTimeout(() => particle.remove(), 1200);
      }
    }
    document.addEventListener('click', function(e) {
      const target = e.target.closest('.btn-primary');
      if (target) {
        const rect = target.getBoundingClientRect();
        triggerBlast(rect.left + rect.width / 2, rect.top + rect.height / 2);
      }
    });

    let pendingBackAction = null;
    function openBackConfirm(callback) { pendingBackAction = callback; document.getElementById('backConfirmOverlay').classList.add('show'); }
    function closeBackConfirm() { document.getElementById('backConfirmOverlay').classList.remove('show'); pendingBackAction = null; }
    function confirmGoBack() { document.getElementById('backConfirmOverlay').classList.remove('show'); if (pendingBackAction) { pendingBackAction(); pendingBackAction = null; } }

    // ================================================================
    // STATE & DATA
    // ================================================================
    let selectedRole = null, currentPath = null, currentStepIndex = 0, steps = [], titleInterval = null;
    let formData = {};
    let selectedTier = 'free', isAnnual = false, isWeekly = false;
    let partnerSelectedTier = 'signal', partnerIsAnnual = false;
    let instructorIsAnnual = true;
    let sliderConfirmed = false; // Slider confirmation state

    // ================================================================
    // PATHS DEFINITION (Operator: 10 steps)
    // ================================================================
    const paths = {
      Operator: [
        // STEP 1: Tune In
        {
          title: 'Tune In', icon: '📡', subtitle: 'Enter your details to begin.', fields: ['fullName', 'email', 'username'],
          html: `<div class="form-group"><label for="fullName">Full Name</label><input type="text" id="fullName" placeholder="Alex Rivera" required /></div><div class="form-group"><label for="email">Email</label><input type="email" id="email" placeholder="you@example.com" required /><div class="hint" id="emailHint">We'll send you a confirmation link.</div><div class="error-hint" id="emailError">Please enter a valid email address.</div></div><div class="form-group"><label for="username">Username</label><input type="text" id="username" placeholder="alexrivera" required /><div class="hint" id="usernameHint">Choose a unique username</div></div>`,
          buttonText: 'Initiate access',
          onNext: function() {
            const name = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const username = document.getElementById('username').value.trim();
            const emailError = document.getElementById('emailError');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!name || !email || !username) { cdToast('Please fill in all fields.', 'error'); return false; }
            if (!emailRegex.test(email)) { emailError.style.display = 'block'; cdToast('Please enter a valid email address.', 'error'); return false; }
            emailError.style.display = 'none';
            return true;
          }
        },
        // STEP 2: Gear Scan
        {
          title: 'Gear Scan', icon: '🔍', subtitle: 'Select your camera brand(s) and lenses.', fields: [],
          html: `<div style="font-size:13px; color:var(--text-muted); margin-bottom:8px;">Camera Brand</div><div class="gear-grid" id="cameraGrid"><div class="gear-card" data-brand="sony" onclick="toggleBrand(this)"><i class="fab fa-sony"></i> Sony</div><div class="gear-card" data-brand="canon" onclick="toggleBrand(this)"><i class="fab fa-canon"></i> Canon</div><div class="gear-card" data-brand="nikon" onclick="toggleBrand(this)"><i class="fas fa-camera"></i> Nikon</div><div class="gear-card" data-brand="fuji" onclick="toggleBrand(this)"><i class="fas fa-camera-retro"></i> Fuji</div><div class="gear-card" data-brand="panasonic" onclick="toggleBrand(this)"><i class="fas fa-camera"></i> Panasonic</div><div class="gear-card" data-brand="blackmagic" onclick="toggleBrand(this)"><i class="fas fa-video"></i> Blackmagic</div></div><div style="font-size:13px; color:var(--text-muted); margin-top:12px;">Lenses</div><div class="lens-chips" id="lensChips"><span class="lens-chip" data-lens="24-70mm-f2.8" onclick="toggleLens(this)">24-70mm f/2.8</span><span class="lens-chip" data-lens="85mm-f1.4" onclick="toggleLens(this)">85mm f/1.4</span><span class="lens-chip" data-lens="70-200mm-f2.8" onclick="toggleLens(this)">70-200mm f/2.8</span><span class="lens-chip" data-lens="35mm-f1.4" onclick="toggleLens(this)">35mm f/1.4</span><span class="lens-chip" data-lens="50mm-f1.8" onclick="toggleLens(this)">50mm f/1.8</span><span class="lens-chip" data-lens="16-35mm-f2.8" onclick="toggleLens(this)">16-35mm f/2.8</span><span class="lens-chip" data-lens="24-105mm-f4" onclick="toggleLens(this)">24-105mm f/4</span><span class="lens-chip" data-lens="macro" onclick="toggleLens(this)">Macro</span><span class="lens-chip" data-lens="24-70mm-f4" onclick="toggleLens(this)">24-70mm f/4</span><span class="lens-chip" data-lens="50mm-f1.2" onclick="toggleLens(this)">50mm f/1.2</span><span class="lens-chip" data-lens="85mm-f1.8" onclick="toggleLens(this)">85mm f/1.8</span><span class="lens-chip" data-lens="70-200mm-f4" onclick="toggleLens(this)">70-200mm f/4</span><span class="lens-chip" data-lens="14-24mm-f2.8" onclick="toggleLens(this)">14-24mm f/2.8</span><span class="lens-chip" data-lens="24mm-f1.4" onclick="toggleLens(this)">24mm f/1.4</span></div>`,
          buttonText: 'Continue',
          onNext: function() { if (document.querySelectorAll('.gear-card.selected').length === 0) { cdToast('Please select at least one camera brand.', 'error'); return false; } return true; }
        },
        // STEP 3: Signal Focus (with Content Creation)
        {
          title: 'Signal Focus', icon: '🎯', subtitle: 'What do you shoot most? Choose up to <span class="highlight">3</span>.', fields: [],
          html: `<div class="interest-chips" id="interestChips"><span class="interest-chip" data-interest="portraits" onclick="toggleInterest(this)">Portraits</span><span class="interest-chip" data-interest="events" onclick="toggleInterest(this)">Events / Weddings</span><span class="interest-chip" data-interest="landscape" onclick="toggleInterest(this)">Landscape</span><span class="interest-chip" data-interest="street" onclick="toggleInterest(this)">Street</span><span class="interest-chip" data-interest="sports" onclick="toggleInterest(this)">Sports / Action</span><span class="interest-chip" data-interest="real-estate" onclick="toggleInterest(this)">Real Estate</span><span class="interest-chip" data-interest="product" onclick="toggleInterest(this)">Product</span><span class="interest-chip" data-interest="wildlife" onclick="toggleInterest(this)">Wildlife</span><span class="interest-chip" data-interest="astro" onclick="toggleInterest(this)">Astro</span><span class="interest-chip" data-interest="food" onclick="toggleInterest(this)">Food</span><span class="interest-chip" data-interest="videography" onclick="toggleInterest(this)">Videography / Film</span><span class="interest-chip" data-interest="documentary" onclick="toggleInterest(this)">Documentary</span><span class="interest-chip" data-interest="music-video" onclick="toggleInterest(this)">Music Videos</span><span class="interest-chip" data-interest="corporate" onclick="toggleInterest(this)">Corporate / Commercial</span><span class="interest-chip" data-interest="content" onclick="toggleInterest(this)">Content Creation</span></div><div class="interest-counter">Selected: <span class="count" id="interestCount">0</span> / 3</div>`,
          buttonText: 'Continue',
          onNext: function() { if (document.querySelectorAll('.interest-chip.selected').length === 0) { cdToast('Please select at least one interest.', 'error'); return false; } return true; }
        },
        // STEP 4: Confidence Check
        {
          title: 'Confidence Check', icon: '📊', subtitle: 'How locked in are you? Help us understand your workflow and goals.', fields: ['challenge', 'shootFrequency', 'learningStyle', 'referralCode'],
          html: `<div class="confidence-section"><div class="slider-label"><span class="left">Signal Strength</span><span class="status" id="confidenceStatus">New Signal</span></div><div class="slider-wrapper"><input type="range" id="confidenceSlider" min="1" max="10" value="4" step="1" oninput="updateConfidence(this.value)" /><div class="slider-track-fill" id="sliderTrackFill" style="width: 33.33%;"></div><div class="pulse-ring" id="pulseRing"></div></div><div class="slider-values"><span>1 — New Signal</span><span>5 — Locking On</span><span>10 — Locked</span></div></div><div class="form-group"><label for="challenge">What's your biggest challenge right now?</label><select id="challenge"><option value="">Select one…</option><option value="low-light">Low light performance</option><option value="composition">Composition & framing</option><option value="posing-subjects">Posing subjects / directing talent</option><option value="manual-settings">Manual settings confusion</option><option value="autofocus">Autofocus struggles</option><option value="editing">Post‑processing / editing</option><option value="color-grading">Color grading</option><option value="confidence">Confidence / imposter syndrome</option><option value="gear">Understanding my gear</option><option value="business">Building my business</option><option value="other">Other</option></select></div><div class="form-group"><label for="shootFrequency">How often do you shoot?</label><select id="shootFrequency"><option value="daily">Daily</option><option value="weekly" selected>Weekly</option><option value="monthly">Monthly</option><option value="rarely">Rarely</option></select></div><div class="form-group"><label for="learningStyle">Preferred learning style</label><select id="learningStyle"><option value="video">Video</option><option value="text">Text / Articles</option><option value="audio">Audio / Podcasts</option><option value="interactive">Interactive / Hands‑on</option></select></div><div class="form-group"><label for="referralCode">Referral code (optional)</label><input type="text" id="referralCode" placeholder="SIGNAL2026" /></div>`,
          buttonText: 'Continue',
          onNext: function() { return true; }
        },
        // STEP 5: Experience & Goals
        {
          title: 'Your Journey', icon: '🧭', subtitle: 'Tell us about your experience and where you want to go.', fields: ['experience', 'primaryGoal', 'ambition'],
          html: `<div class="form-group"><label for="experience">How long have you been shooting mirrorless?</label><select id="experience"><option value="<6">Less than 6 months</option><option value="6-12">6–12 months</option><option value="1-2">1–2 years</option><option value="3-5">3–5 years</option><option value="5+">5+ years</option></select></div><div class="form-group"><label for="primaryGoal">What is your primary goal?</label><select id="primaryGoal"><option value="master-manual">Master manual mode</option><option value="start-business">Start a photography / video business</option><option value="improve-social">Improve social media content</option><option value="family-travel">Capture family / travel memories</option><option value="professional-event">Become a professional event/wedding photographer</option><option value="filmmaker">Become a filmmaker / videographer</option><option value="other">Other</option></select></div><div class="form-group"><label for="ambition">Which best describes your ambition?</label><select id="ambition"><option value="hobbyist">Hobbyist – I create for fun</option><option value="semi-pro">Semi‑professional – I earn some income</option><option value="professional">Professional – this is my primary income</option></select></div>`,
          buttonText: 'Continue',
          onNext: function() { return true; }
        },
        // STEP 6: Learning Preferences
        {
          title: 'Learning Flow', icon: '📖', subtitle: 'How do you prefer to absorb knowledge?', fields: ['contentFormat', 'deliveryChannel'],
          html: `<div class="form-group"><label for="contentFormat">Which content format works best for you?</label><select id="contentFormat"><option value="video">Video tutorials</option><option value="written">Written guides & articles</option><option value="interactive">Interactive exercises</option><option value="audio">Audio / Podcasts</option><option value="mixed">A mix of everything</option></select></div><div class="form-group"><label for="deliveryChannel">How would you like to receive your protocols?</label><select id="deliveryChannel"><option value="email">Email (daily)</option><option value="sms">SMS (daily)</option><option value="push">Push notifications (web)</option><option value="email-sms">Email + SMS</option></select></div><div style="font-size:12px; color:var(--text-muted); margin-top:4px;">SMS is only available on the Pro plan.</div>`,
          buttonText: 'Continue',
          onNext: function() { return true; }
        },
        // STEP 7: Pain Points
        {
          title: 'Pain Points', icon: '💥', subtitle: 'What holds you back the most? Select up to <span class="highlight">3</span>.', fields: ['painPoints'],
          html: `<div style="margin-bottom:12px; font-size:13px; color:var(--text-muted);">Choose the areas where you feel stuck.</div><div class="interest-chips" id="painChips"><span class="interest-chip" data-pain="technical" onclick="togglePain(this)">Technical confusion (settings, gear)</span><span class="interest-chip" data-pain="creative" onclick="togglePain(this)">Creative block</span><span class="interest-chip" data-pain="editing" onclick="togglePain(this)">Editing / post‑processing</span><span class="interest-chip" data-pain="color-grading" onclick="togglePain(this)">Color grading</span><span class="interest-chip" data-pain="business" onclick="togglePain(this)">Business / marketing</span><span class="interest-chip" data-pain="portfolio" onclick="togglePain(this)">Building a portfolio / showreel</span><span class="interest-chip" data-pain="clients" onclick="togglePain(this)">Attracting clients</span><span class="interest-chip" data-pain="inspiration" onclick="togglePain(this)">Lack of inspiration</span><span class="interest-chip" data-pain="technical2" onclick="togglePain(this)">Understanding my camera</span><span class="interest-chip" data-pain="audio" onclick="togglePain(this)">Audio / Sound</span><span class="interest-chip" data-pain="lighting" onclick="togglePain(this)">Lighting for video</span></div><div class="interest-counter">Selected: <span class="count" id="painCount">0</span> / 3</div>`,
          buttonText: 'Continue',
          onNext: function() {
            const selected = document.querySelectorAll('#painChips .interest-chip.selected').length;
            if (selected === 0) { cdToast('Please select at least one pain point.', 'error'); return false; }

    function typeWriter(element, text, speed = 40) {
      if (titleInterval) clearInterval(titleInterval);
      let i = 0;
      element.textContent = '';
      function type() {
        if (i < text.length) { element.textContent += text.charAt(i); i++; }
        else { clearInterval(titleInterval); titleInterval = null; }
      }
      titleInterval = setInterval(type, speed);
    }

        if (el.id) {
          if (el.type === 'checkbox' || el.type === 'radio') { formData[el.id] = el.checked; }
          else { formData[el.id] = el.value; }

      formData['selectedLenses'] = Array.from(document.querySelectorAll('.lens-chip.selected')).map(el => el.dataset.lens);

      formData['painPoints'] = Array.from(document.querySelectorAll('#painChips .interest-chip.selected')).map(el => el.dataset.pain);

    // ---------------------------------------------------------------
    // SLIDER CONFIRMATION – INIT
    // ---------------------------------------------------------------
    function initSlider() {
      const container = document.getElementById('sliderConfirmContainer');
      const knob = document.getElementById('sliderKnob');
      const track = document.getElementById('sliderTrack');
      const label = document.getElementById('sliderLabel');
      const confirmed = document.getElementById('sliderConfirmed');
      
      if (!container) return;
      
      // Reset slider state
      sliderConfirmed = false;
      const containerWidth = container.offsetWidth;
      const knobWidth = 44;
      const maxLeft = containerWidth - knobWidth - 8;
      
      let startX = 0;
      let currentLeft = 4;
      let dragging = false;
      
      function updateSlider(clientX) {
        const rect = container.getBoundingClientRect();
        let newLeft = clientX - rect.left - knobWidth / 2;
        newLeft = Math.max(4, Math.min(maxLeft, newLeft));
        currentLeft = newLeft;
        knob.style.left = newLeft + 'px';
        const progress = (newLeft - 4) / (maxLeft - 4);
        track.style.width = (progress * 100) + '%';
        
        if (progress >= 0.95) {
          sliderConfirmed = true;
          label.style.display = 'none';
          confirmed.style.display = 'inline';
          container.style.borderColor = 'var(--green)';
          knob.innerHTML = '<i class="fas fa-check"></i>';
          knob.style.background = 'var(--green)';
          document.getElementById('confirmError').style.display = 'none';
        } else {
          sliderConfirmed = false;
          label.style.display = 'inline';
          confirmed.style.display = 'none';
          container.style.borderColor = 'var(--border)';
          knob.innerHTML = '<i class="fas fa-arrow-right"></i>';
        }
      }
      
      function startDrag(e) {
        e.preventDefault();
        dragging = true;
        const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
        startX = clientX;
        knob.style.cursor = 'grabbing';
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchmove', onDragTouch, { passive: false });
        document.addEventListener('touchend', endDragTouch);
      }
      
      function onDrag(e) {
        e.preventDefault();
        if (!dragging) return;
        updateSlider(e.clientX);
      }
      
      function onDragTouch(e) {
        e.preventDefault();
        if (!dragging) return;
        updateSlider(e.touches[0].clientX);
      }
      
      function endDrag() {
        dragging = false;
        knob.style.cursor = 'grab';
        if (!sliderConfirmed) {
          knob.style.left = '4px';
          track.style.width = '0%';
          label.style.display = 'inline';
          confirmed.style.display = 'none';
          container.style.borderColor = 'var(--border)';
          knob.innerHTML = '<i class="fas fa-arrow-right"></i>';
        }
        document.removeEventListener('mousemove', onDrag);
        document.removeEventListener('mouseup', endDrag);
        document.removeEventListener('touchmove', onDragTouch);
        document.removeEventListener('touchend', endDragTouch);
      }
      
      function endDragTouch() {
        dragging = false;
        if (!sliderConfirmed) {
          knob.style.left = '4px';
          track.style.width = '0%';
          label.style.display = 'inline';
          confirmed.style.display = 'none';
          container.style.borderColor = 'var(--border)';
          knob.innerHTML = '<i class="fas fa-arrow-right"></i>';
        }
        document.removeEventListener('mousemove', onDrag);
        document.removeEventListener('mouseup', endDrag);
        document.removeEventListener('touchmove', onDragTouch);
        document.removeEventListener('touchend', endDragTouch);
      }
      
      // Bind events
      knob.addEventListener('mousedown', startDrag);
      container.addEventListener('mousedown', function(e) {
        if (e.target === knob) return;
        const rect = container.getBoundingClientRect();
        const clickX = e.clientX - rect.left - knobWidth / 2;
        if (clickX > 20 && clickX < containerWidth - 20) {
          startDrag(e);
          updateSlider(e.clientX);
        }
      });
      knob.addEventListener('touchstart', startDrag, { passive: true });
      container.addEventListener('touchstart', function(e) {
        if (e.target === knob) return;
        const rect = container.getBoundingClientRect();
        const touch = e.touches[0];
        const clickX = touch.clientX - rect.left - knobWidth / 2;
        if (clickX > 20 && clickX < containerWidth - 20) {
          startDrag(e);
          updateSlider(touch.clientX);
        }
      }, { passive: true });
      
      // Reset on window resize
      window.addEventListener('resize', function() {
        if (!sliderConfirmed) {
          knob.style.left = '4px';
          track.style.width = '0%';
        }
      });
    }

        backButtonHtml = `<button class="btn-back-path" onclick="goToRoleSelection()"><i class="fas fa-arrow-left"></i> Back to Path Selection</button>`;

            backBtn.textContent = '← Back';

      if (selectedRole === 'Partner' && currentStepIndex === 1) {

      updateSignalGlow();
      updatePercentageGlow();

      const titleEl = document.getElementById('titleText');
      if (titleEl) {
        if (titleInterval) clearInterval(titleInterval);

        typeWriter(titleEl, titleText, 50);
      }
    }

      if (currentStepIndex < steps.length - 1) { currentStepIndex++; renderCurrentStep(); }

window.activateSignal = function() {
  console.log('🔵 activateSignal called');
  console.log('🔵 sliderConfirmed:', sliderConfirmed);

  const btn = document.getElementById('activateBtn');
  const spinner = document.getElementById('signupSpinner');
  const errorEl = document.getElementById('signupError');
  const locked = document.getElementById('signalLocked');

  // === SLIDER CONFIRMATION ===
  if (!sliderConfirmed) {
    const confirmError = document.getElementById('confirmError');
    if (confirmError) confirmError.style.display = 'block';
    errorEl.textContent = '⚠️ Please slide to confirm your agreement.';
    errorEl.style.display = 'block';
    const container = document.getElementById('sliderConfirmContainer');
    if (container) {
      container.style.borderColor = '#ff4a4a';
      container.style.boxShadow = '0 0 20px rgba(255,74,74,0.2)';
      setTimeout(() => { 
        container.style.borderColor = 'var(--border)';
        container.style.boxShadow = 'none';
      }, 2000);
    }
    return;
  }
  const confirmError = document.getElementById('confirmError');
  if (confirmError) confirmError.style.display = 'none';

  // === FIELD VALIDATION ===
  const name = formData['fullName'] || '';
  const email = formData['email'] || '';
  const username = formData['username'] || '';
  const password = document.getElementById('password')?.value?.trim() || '';
  const confirmPassword = document.getElementById('confirmPassword')?.value?.trim() || '';

  if (!name || !email || !username || !password || !confirmPassword) {
    errorEl.textContent = '⚠️ Please fill in all required fields.';
    errorEl.style.display = 'block';
    return;
  }
  if (password.length < 6) {
    errorEl.textContent = '⚠️ Password must be at least 6 characters.';
    errorEl.style.display = 'block';
    return;
  }
  if (password !== confirmPassword) {
    document.getElementById('confirmPasswordError').style.display = 'block';
    errorEl.textContent = '⚠️ Passwords do not match.';
    errorEl.style.display = 'block';
    return;
  }
  document.getElementById('confirmPasswordError').style.display = 'none';

  if (typeof firebase === 'undefined' || !firebase.auth) {
    errorEl.textContent = '⚠️ Firebase not loaded. Please refresh and try again.';
    errorEl.style.display = 'block';
    return;
  }

  // === SHOW LOADING STATE ===
  btn.style.display = 'none';
  spinner.style.display = 'block';
  errorEl.style.display = 'none';

  const auth = firebase.auth();
  const db = firebase.firestore();

  // Helper: Wait for auth state to be fully ready
  function waitForAuth(maxAttempts = 10) {
    return new Promise((resolve, reject) => {
      let attempts = 0;
      const check = () => {
        attempts++;
        const user = auth.currentUser;
        if (user) {
          resolve(user);
        } else if (attempts >= maxAttempts) {
          reject(new Error('Authentication timeout'));
        } else {
          setTimeout(check, 200);
        }
      };
      check();
    });
  }

  // === BUILD USER DATA ===
  let userData = { 
    name, email, username, role: selectedRole, 
    createdAt: firebase.firestore.FieldValue.serverTimestamp() 
  };
  
  const referredBy = localStorage.getItem('signup_referral') || null;
  let referralCode = username.toLowerCase().replace(/[^a-z0-9]/g, '');
  if (!referralCode || referralCode.length < 3) { 
    referralCode = Math.random().toString(36).substring(2, 8); 
  }
  userData.referralCode = referralCode;
  if (referredBy) { userData.referredBy = referredBy; }
  userData.totalReferrals = 0;
  userData.totalCommissionEarned = 0;
  userData.ambassadorTier = 'signal';

  if (selectedRole === 'Operator') {
    const phone = formData['phone'] || '';
    const confidence = parseInt(formData['confidenceSlider']) || 0;
    const challenge = formData['challenge'] || '';
    const shootFrequency = formData['shootFrequency'] || '';
    const learningStyle = formData['learningStyle'] || '';
    const referralCodeUser = formData['referralCode'] || '';
    const brands = formData['selectedGear'] || [];
    const lenses = formData['selectedLenses'] || [];
    const interests = formData['selectedInterests'] || [];
    let billingInterval = 'monthly'; 
    if (isWeekly) billingInterval = 'weekly'; 
    else if (isAnnual) billingInterval = 'annual';

    const learningJourney = {
      experience: formData['experience'] || '',
      primaryGoal: formData['primaryGoal'] || '',
      ambition: formData['ambition'] || '',
      contentFormat: formData['contentFormat'] || '',
      deliveryChannel: formData['deliveryChannel'] || '',
      painPoints: formData['painPoints'] || [],
      sixMonthGoal: formData['sixMonthGoal'] || '',
      dreamProject: formData['dreamProject'] || '',
      challenge: challenge,
      shootFrequency: shootFrequency,
      learningStyle: learningStyle,
      confidence: confidence
    };

    userData = {
      ...userData,
      phone: selectedTier === 'pro' ? phone : null,
      tier: selectedTier,
      billingInterval,
      confidence,
      challenge,
      shootFrequency,
      learningStyle,
      referralCode: referralCodeUser || '',
      preferences: { brands, lenses, interests },
      savedCards: [],
      savedBlogs: [],
      savedPodcasts: [],
      savedCommunityPosts: [],
      learningJourney: learningJourney
    };
  } else if (selectedRole === 'Partner') {
    const companyName = formData['companyName'] || '';
    const tier = partnerSelectedTier;
    const isAnnualPartner = partnerIsAnnual;
    userData = { 
      ...userData, 
      companyName, 
      partnerTier: tier, 
      billingInterval: isAnnualPartner ? 'annual' : 'monthly', 
      partnerId: 'PART-' + Math.random().toString(36).substring(2, 8), 
      clicks: 0, 
      downloads: 0, 
      agreements: 0, 
      referredStudents: 0 
    };
  } else if (selectedRole === 'Instructor') {
    const teachingExperience = formData['teachingExperience'] || '';
    const isAnnualInst = instructorIsAnnual;
    userData = { 
      ...userData, 
      teachingExperience, 
      instructorLicense: 'educator', 
      billingInterval: isAnnualInst ? 'annual' : 'monthly', 
      instructorId: 'INSTR-' + Math.random().toString(36).substring(2, 8), 
      totalStudents: 0, 
      totalWorkshops: 0, 
      guideSales: 0, 
      totalCohorts: 0, 
      nextBillingDate: new Date(Date.now() + 30*24*60*60*1000).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) 
    };
  }

  // === CREATE ACCOUNT ===
  auth.createUserWithEmailAndPassword(email, password)
    .then(cred => {
      console.log('✅ Auth account created');
      // Wait for auth to be fully available
      return waitForAuth();
    })
    .then(user => {
      const uid = user.uid;
      console.log('✅ User authenticated:', uid);
      if (selectedRole === 'Partner') userData.partnerId = 'PART-' + uid.slice(0, 6).toUpperCase();
      else if (selectedRole === 'Instructor') userData.instructorId = 'INSTR-' + uid.slice(0, 6).toUpperCase();
      return user.updateProfile({ displayName: name }).then(() => ({ user, uid }));
    })
    .then(({ user, uid }) => {
      console.log('📝 Writing user document for UID:', uid);
      // Write user document – the user is now fully authenticated
      return db.collection('users').doc(uid).set(userData)
        .then(() => {
          console.log('✅ User document written');
          return { user, uid };
        })
        .catch(err => {
          console.error('❌ User document write failed:', err);
          // If user doc fails, delete the Auth user and propagate error
          return user.delete().then(() => {
            throw new Error('User document write failed: ' + err.message);
          });
        });
    })
    .then(({ user, uid }) => {
      console.log('📝 Creating referral code:', referralCode);
      // Create referral code (if fails, log but continue)
      return db.collection('referralCodes').doc(referralCode).set({ 
        uid: uid, 
        createdAt: firebase.firestore.FieldValue.serverTimestamp() 
      })
      .then(() => {
        console.log('✅ Referral code created');
        return { user, uid };
      })
      .catch(err => {
        console.warn('⚠️ Referral code creation failed (non-critical):', err);
        return { user, uid };
      });
    })
    .then(({ user, uid }) => {
      if (referredBy) {
        console.log('📝 Updating referrer:', referredBy);
        return db.collection('referralCodes').doc(referredBy).get()
          .then(doc => {
            if (doc.exists) { 
              const referrerUid = doc.data().uid; 
              return db.collection('users').doc(referrerUid).update({ 
                totalReferrals: firebase.firestore.FieldValue.increment(1) 
              })
              .catch(err => {
                console.warn('⚠️ Referrer update failed (non-critical):', err);
                return Promise.resolve();
              });
            }
            return Promise.resolve();
          })
          .then(() => ({ user, uid }))
          .catch(err => {
            console.warn('⚠️ Referrer lookup failed:', err);
            return { user, uid };
          });
      }
      return { user, uid };
    })
    .then(({ user, uid }) => {
      // === SUCCESS ===
      console.log('🎉 Signup complete!');
      btn.style.display = 'none'; 
      spinner.style.display = 'none'; 
      locked.style.display = 'block';
      const linkEl = document.getElementById('newReferralLink'); 
      if (linkEl) { 
        linkEl.textContent = `camerasdecoded.com/ref/${referralCode}`; 
      }
      localStorage.removeItem('signup_referral');
      let redirect = 'operator-dashboard.html'; 
      if (selectedRole === 'Partner') redirect = 'partner-dashboard.html'; 
      else if (selectedRole === 'Instructor') redirect = 'instructor-dashboard.html';
      setTimeout(() => { window.location.href = redirect + '?welcome=onboarding'; }, 3000);
    })
    .catch(err => { 
      // === ERROR HANDLING ===
      console.log('🔴 Signup error:', err);
      console.log('🔴 Error code:', err.code);
      
      let errorMessage = err.message || 'Something went wrong.';
      
      if (err.code === 'auth/email-already-in-use') {
        errorMessage = '❌ This email is already registered. Please <a href="login.html" style="color:#8deb00; text-decoration:underline;">log in</a> instead, or use a different email address.';
      } else if (err.code === 'auth/weak-password') {
        errorMessage = '❌ Password is too weak. Please use at least 6 characters.';
      } else if (err.code === 'auth/invalid-email') {
        errorMessage = '❌ Invalid email address. Please check and try again.';
      } else if (err.code === 'auth/network-request-failed') {
        errorMessage = '❌ Network error. Please check your connection and try again.';
      } else if (err.code === 'auth/too-many-requests') {
        errorMessage = '❌ Too many attempts. Please try again later.';
      } else if (err.code === 'auth/invalid-credential') {
        errorMessage = '❌ Invalid credentials. Please ensure your email and password are correct.';
      } else {
        errorMessage = '❌ ' + errorMessage;
      }
      
      errorEl.innerHTML = errorMessage;
      errorEl.style.display = 'block'; 
      btn.style.display = 'block'; 
      spinner.style.display = 'none'; 
      
      if (auth.currentUser) { 
        auth.currentUser.delete()
          .then(() => console.log('🧹 Deleted partial Auth account'))
          .catch(err => console.warn('⚠️ Could not delete partial Auth account:', err));
      } 
    });
};
    // ================================================================
    // PARTICLES & INIT
    // ================================================================
    (function() {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      let w, h;
      const particles = [];
      const count = 120;
      function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize); resize();
      class Particle { constructor() { this.x = Math.random() * w; this.y = Math.random() * h; this.size = Math.random() * 2.5 + 0.5; this.speedX = (Math.random() - 0.5) * 0.4; this.speedY = (Math.random() - 0.5) * 0.4; this.opacity = Math.random() * 0.4 + 0.1; } update() { this.x += this.speedX; this.y += this.speedY; if (this.x < 0 || this.x > w) this.speedX *= -1; if (this.y < 0 || this.y > h) this.speedY *= -1; } draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fillStyle = `rgba(141,235,0,${this.opacity})`; ctx.fill(); } }
      for (let i = 0; i < count; i++) particles.push(new Particle());
      function animate() { ctx.clearRect(0, 0, w, h); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
      animate();
    })();
