<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Dashboard — Cameras Decoded</title>
  <meta name="description" content="Analytics, agreements, and resources for Cameras Decoded partners.">

  <!-- ===== MASTER LOADER (Fonts, CSS) ===== -->
  <script src="/scripts/master-loader.js"></script>

  <!-- ===== FIREBASE SDKs ===== -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- ===== FIREBASE INIT ===== -->
  <script src="/scripts/firebase-init.js"></script>

  <style>
    /* ============================================================
       PARTNER DASHBOARD – SAME STYLES AS ORIGINAL
       ============================================================ */
    /* ... (all styles unchanged from the original) ... */
  </style>
</head>
<body>

  <!-- ===== FLOATING HEADER (IDENTICAL TO OPERATOR) ===== -->
  <div class="floating-header">
    <div class="floating-left-group">
      <a href="index.html" class="floating-home-icon" title="Home"><i class="fas fa-home"></i></a>
      <span id="roleTierBadge" class="role-tier-badge" style="display:none;">
        <span class="glow-role" id="headerRole">Partner</span> · <span id="headerTier" class="tier-text">Signal</span>
      </span>
    </div>
    <div class="floating-center-group"></div>
    <div class="floating-right-group">
      <a href="cart.html" class="cart-header-link chasing-border" id="cartHeaderLink">
        <i class="fas fa-shopping-cart"></i> <span id="cartHeaderLabel">Cart</span>
        <span class="cart-count-badge" id="cartHeaderCount" style="display:none;">0</span>
      </a>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>
      <button class="floating-toggle" id="floatingToggle" aria-label="Menu"><i class="fas fa-bars"></i></button>
    </div>
  </div>

  <!-- ===== SIDEBAR CONTAINER ===== -->
  <div id="sidebarContainer"></div>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content">
    <!-- ... all partner dashboard content ... -->
  </main>

  <!-- ===== BOTTOM NAV ===== -->
  <div id="bottomNavContainer"></div>
  <script src="bottom-nav.js"></script>

  <!-- ===== COMMISSION CARD ===== -->
  <script src="/scripts/commission-card.js"></script>

  <!-- ===== SIDEBAR SCRIPT ===== -->
  <script src="sidebar.js"></script>

  <!-- ===== PAGE-SPECIFIC JAVASCRIPT – IDENTICAL PATTERN TO OPERATOR ===== -->
  <script>
    // ============================================================
    // PARTNER DASHBOARD – EXACTLY THE SAME PATTERN AS OPERATOR
    // ============================================================

    // ---- Auth & db ----
    var auth = window.auth || firebase.auth();
    var db = window.db || firebase.firestore();
    var cdToast = window.cdToast || function(msg, type) { alert(msg); };

    window.handleLogout = function() {
      auth.signOut().then(function() {
        localStorage.clear();
        window.location.href = 'login.html';
      }).catch(function() {
        localStorage.clear();
        window.location.href = 'login.html';
      });
    };

    // ---- Reveal animations ----
    document.addEventListener('DOMContentLoaded', function() {
      var reveals = document.querySelectorAll('.reveal');
      var observer = new IntersectionObserver(function(entries) {
        for (var i = 0; i < entries.length; i++) {
          var entry = entries[i];
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        }
      }, { threshold: 0.1 });
      for (var j = 0; j < reveals.length; j++) {
        observer.observe(reveals[j]);
      }
    });

    // ---- Global functions ----
    function copyReferralLink() {
      var link = document.getElementById('referralLink').textContent;
      navigator.clipboard.writeText('https://' + link).then(function() {
        cdToast('Copied!');
      }).catch(function() {
        var input = document.createElement('input');
        input.value = 'https://' + link;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        cdToast('Copied!');
      });
    }

    function viewPDF(filename) { cdToast('Opening ' + filename); }
    function downloadResource(filename) { cdToast('Downloading ' + filename); }

    // ---- Cart UI ----
    function getCart() {
      return JSON.parse(localStorage.getItem('cameras_decoded_cart') || '[]');
    }

    function updateCartUI() {
      var cart = getCart();
      var totalItems = 0;
      for (var i = 0; i < cart.length; i++) {
        totalItems += cart[i].qty;
      }
      var countEl = document.getElementById('cartHeaderCount');
      var labelEl = document.getElementById('cartHeaderLabel');
      if (countEl) {
        countEl.textContent = totalItems;
        countEl.style.display = totalItems > 0 ? 'inline-block' : 'none';
      }
      if (labelEl) {
        labelEl.textContent = totalItems > 0 ? 'Cart (' + totalItems + ')' : 'Cart';
      }
    }
    updateCartUI();

    // ---- Partner logic ----
    var userDocRef = null;
    var currentUser = null;
    var window.demoCommissionId = null;

    function simulatePurchase() {
      if (!userDocRef) {
        cdToast('Please log in first.', 'error');
        return;
      }
      if (window.demoCommissionId) {
        cdToast('A demo commission already exists. Reset it first.', '');
        return;
      }

      var rate = 0.20;
      var purchaseAmount = 50;
      var commissionAmount = purchaseAmount * rate;
      var commissionRef = userDocRef.collection('commissions').doc();
      var commissionData = {
        productName: '📘 Camera Confidence Guide (demo)',
        amount: commissionAmount,
        status: 'pending',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        purchaseId: 'demo-' + Date.now(),
        purchaseAmount: purchaseAmount,
        rate: rate,
        tier: 'partner',
        isDemo: true
      };
      commissionRef.set(commissionData).then(function() {
        return userDocRef.update({
          totalCommissionEarned: firebase.firestore.FieldValue.increment(commissionAmount)
        });
      }).then(function() {
        cdToast('✅ Demo commission: $' + commissionAmount.toFixed(2) + ' earned (20% rate).');
      }).catch(function(err) {
        console.error('Simulate error:', err);
        cdToast('Error creating test commission: ' + err.message, 'error');
      });
    }

    function resetDemoCommission() {
      if (!window.demoCommissionId) {
        cdToast('No demo commission to reset.', '');
        return;
      }
      if (!userDocRef) return;
      var commissionRef = userDocRef.collection('commissions').doc(window.demoCommissionId);
      commissionRef.get().then(function(doc) {
        if (!doc.exists) return;
        var amount = doc.data().amount || 0;
        return commissionRef.delete().then(function() {
          return userDocRef.update({
            totalCommissionEarned: firebase.firestore.FieldValue.increment(-amount)
          });
        });
      }).then(function() {
        window.demoCommissionId = null;
        cdToast('Demo commission removed.');
      }).catch(function(err) {
        console.error('Reset demo error:', err);
        cdToast('Could not reset demo: ' + err.message, 'error');
      });
    }

    function updatePartnerProfile(data) {
      document.getElementById('profileUsername').textContent = data.username || '—';
      document.getElementById('profileName').textContent = data.name || '—';
      document.getElementById('profileEmail').textContent = data.email || '—';
      document.getElementById('profileCompany').textContent = data.companyName || '—';
      var tier = data.partnerTier || 'signal';
      var tierDisplay = tier.charAt(0).toUpperCase() + tier.slice(1);
      document.getElementById('profileLicense').textContent = tierDisplay;
      var billing = data.billingInterval || 'monthly';
      document.getElementById('profileBilling').textContent = billing.charAt(0).toUpperCase() + billing.slice(1);
      document.getElementById('partnerUniqueId').textContent = data.partnerId || '—';
      document.getElementById('clickCount').textContent = data.clicks || 0;
      document.getElementById('downloadCount').textContent = data.downloads || 0;
      document.getElementById('agreementCount').textContent = data.agreements || 0;
      document.getElementById('studentCountPartner').textContent = data.referredStudents || 0;

      var code = data.referralCode || '';
      document.getElementById('referralLink').textContent = 'camerasdecoded.com/ref/' + code;
      document.getElementById('totalReferrals').textContent = data.totalReferrals || 0;
      document.getElementById('totalCommission').textContent = '$' + (data.totalCommissionEarned || 0).toFixed(2);
      document.getElementById('ambassadorTier').textContent = 'Partner (20%)';
      document.getElementById('headerTier').textContent = tierDisplay;
      document.getElementById('headerRole').textContent = 'Partner';
      document.getElementById('roleTierBadge').style.display = 'inline-flex';

      if (document.getElementById('statsGrid') && typeof insertCommissionCard === 'function') {
        insertCommissionCard('statsGrid', 'after');
      }
    }

    function renderCommissionHistory(commissions) {
      var list = document.getElementById('commissionList');
      if (!list) return;
      if (!commissions || commissions.length === 0) {
        list.innerHTML = '<div class="commission-empty">No commissions yet. Earn commissions when people buy through your referral link.</div>';
        return;
      }
      var sorted = commissions.slice().sort(function(a, b) {
        var dateA = a.createdAt && a.createdAt.toDate ? a.createdAt.toDate() : new Date(0);
        var dateB = b.createdAt && b.createdAt.toDate ? b.createdAt.toDate() : new Date(0);
        return dateB - dateA;
      });
      var display = sorted.slice(0, 20);
      var html = '';
      for (var i = 0; i < display.length; i++) {
        var c = display[i];
        var date = c.createdAt && c.createdAt.toDate ? c.createdAt.toDate() : new Date();
        var dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        var statusClass = c.status || 'pending';
        var statusLabel = statusClass.charAt(0).toUpperCase() + statusClass.slice(1);
        html += '<div class="commission-item"><div class="left"><div class="name">' + (c.productName || 'Purchase') + '</div><div class="date">' + dateStr + '</div></div><div class="right"><span class="amount">$' + c.amount.toFixed(2) + '</span><span class="status ' + statusClass + '">' + statusLabel + '</span></div></div>';
      }
      list.innerHTML = html;

      var hasDemo = false;
      for (var j = 0; j < commissions.length; j++) {
        if (commissions[j].isDemo === true) {
          hasDemo = true;
          window.demoCommissionId = commissions[j].id;
          break;
        }
      }
      var resetBtn = document.getElementById('resetDemoBtn');
      var simBtn = document.getElementById('simulateBtn');
      if (hasDemo) {
        resetBtn.style.display = 'inline-block';
        simBtn.textContent = 'Demo used';
        simBtn.disabled = true;
        simBtn.style.opacity = '0.5';
        simBtn.style.cursor = 'default';
      } else {
        resetBtn.style.display = 'none';
        simBtn.textContent = 'Simulate Purchase';
        simBtn.disabled = false;
        simBtn.style.opacity = '1';
        simBtn.style.cursor = 'pointer';
        window.demoCommissionId = null;
      }
    }

    // ---- Auth listener ----
    auth.onAuthStateChanged(function(user) {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      userDocRef = db.collection('users').doc(user.uid);

      userDocRef.onSnapshot(function(doc) {
        if (!doc.exists) {
          var email = user.email || '';
          var username = email ? email.split('@')[0] : 'user' + user.uid.slice(0,6);
          userDocRef.set({
            username: username,
            name: user.displayName || '',
            email: user.email,
            role: 'Partner',
            companyName: '',
            partnerTier: 'signal',
            billingInterval: 'monthly',
            partnerId: 'PART-' + user.uid.slice(0,6).toUpperCase(),
            clicks: 0, downloads: 0, agreements: 0, referredStudents: 0,
            referralCode: username,
            totalReferrals: 0,
            totalCommissionEarned: 0
          }, { merge: true }).then(function() {
            userDocRef.get().then(function(snap) {
              if (snap.exists) {
                updatePartnerProfile(snap.data());
                listenCommissions();
              }
            });
          }).catch(console.error);
          return;
        }
        updatePartnerProfile(doc.data());
        if (!commissionListener) listenCommissions();
      }, function(error) {
        console.error('Profile listener error:', error);
      });

      var homeNav = document.querySelector('.sidebar .nav-item[href="index.html"]');
      if (homeNav && !document.getElementById('dynamic-dashboard-node')) {
        var dashLink = document.createElement('a');
        dashLink.id = 'dynamic-dashboard-node';
        dashLink.className = 'nav-item active';
        dashLink.innerHTML = '<i class="fas fa-chart-simple"></i> Dashboard';
        dashLink.href = 'partner-dashboard.html';
        homeNav.parentNode.insertBefore(dashLink, homeNav);
      }

      if (window.BottomNav) {
        window.BottomNav.init();
      }

      localStorage.setItem('cameras_decoded_uid', user.uid);
    });

    // ---- Commission listener ----
    var commissionListener = null;
    function listenCommissions() {
      if (commissionListener) {
        commissionListener();
        commissionListener = null;
      }
      if (!userDocRef) return;
      commissionListener = userDocRef.collection('commissions')
        .orderBy('createdAt', 'desc')
        .limit(20)
        .onSnapshot(function(snapshot) {
          var commissions = [];
          snapshot.forEach(function(doc) {
            var data = doc.data();
            data.id = doc.id;
            commissions.push(data);
          });
          renderCommissionHistory(commissions);
        }, function(error) {
          console.error('Commission listener error:', error);
        });
    }

    // ---- Sidebar toggle ----
    document.addEventListener('click', function(e) {
      var toggle = e.target.closest('#floatingToggle');
      if (toggle) {
        e.preventDefault();
        var sidebarContainer = document.getElementById('sidebarContainer');
        if (sidebarContainer) {
          var sidebar = sidebarContainer.querySelector('.sidebar');
          if (sidebar) {
            sidebar.classList.toggle('open');
          }
        }
      }
      if (window.innerWidth <= 1024) {
        var sidebarContainer2 = document.getElementById('sidebarContainer');
        if (sidebarContainer2) {
          var sidebar2 = sidebarContainer2.querySelector('.sidebar');
          if (sidebar2) {
            var link = e.target.closest('.sidebar-nav .nav-item');
            if (link) {
              sidebar2.classList.remove('open');
            }
          }
        }
      }
    });

    window.addEventListener('storage', updateCartUI);
  </script>
</body>
</html>
