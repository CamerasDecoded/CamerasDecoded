<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Dashboard — Cameras Decoded</title>
  <meta name="description" content="Analytics, agreements, and resources for Cameras Decoded partners.">

  <!-- ===== MASTER LOADER (Fonts, CSS) ===== -->
  <script src="/scripts/master-loader.js"></script>

  <!-- ===== FIREBASE SDKs ===== -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- ===== FIREBASE INIT ===== -->
  <script src="/scripts/firebase-init.js"></script>

  <style>
    /* ============================================================
       PARTNER DASHBOARD – FULL STYLES (same as operator)
       ============================================================ */
    /* ... (all styles same as before, omitted for brevity) ... */
    /* Use the exact same CSS you had, no changes needed */
  </style>
</head>
<body>

  <!-- ===== FLOATING HEADER (INLINE) ===== -->
  <div class="floating-header">
    <div class="floating-left-group">
      <a href="index.html" class="floating-home-icon" title="Home"><i class="fas fa-home"></i></a>
      <span id="roleTierBadge" class="role-tier-badge" style="display:none;">
        <span class="glow-role" id="headerRole">Partner</span> · <span id="headerTier" class="tier-text">Signal</span>
      </span>
    </div>
    <div class="floating-center-group"></div>
    <div class="floating-right-group">
      <a href="cart.html" class="cart-header-link" id="cartHeaderLink">
        <i class="fas fa-shopping-cart"></i> <span id="cartHeaderLabel">Cart</span>
        <span class="cart-count-badge" id="cartHeaderCount" style="display:none;">0</span>
      </a>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>
      <button class="floating-toggle" id="floatingToggle" aria-label="Menu"><i class="fas fa-bars"></i></button>
    </div>
  </div>

  <!-- ===== SIDEBAR CONTAINER (injected by sidebar.js) ===== -->
  <div id="sidebarContainer"></div>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content">

    <!-- DASHBOARD HEADER -->
    <div class="dash-header reveal">
      <h1 style="font-family:'Space Mono',monospace; font-size:26px; color:var(--green); display:flex; align-items:center; gap:12px;">
        <i class="fas fa-handshake" style="color:var(--green);"></i> Partner Command Center
      </h1>
      <div class="partner-id">Partner ID: <span id="partnerUniqueId">—</span></div>
    </div>

    <!-- LOADING STATE -->
    <div id="loadingState" style="text-align:center;padding:60px 0;color:var(--text-muted);">
      <i class="fas fa-spinner fa-spin" style="font-size:32px;color:var(--green);"></i>
      <p style="margin-top:12px;">Loading your partner signal...</p>
    </div>

    <!-- DASHBOARD CONTENT -->
    <div id="dashboardContent" style="display:none;">
      <!-- ... all dashboard sections (stats, profile, referral, etc.) same as before ... -->
    </div>
  </main>

  <!-- ===== BOTTOM NAV ===== -->
  <div id="bottomNavContainer"></div>
  <script src="bottom-nav.js"></script>

  <!-- ===== COMMISSION CARD ===== -->
  <script src="/scripts/commission-card.js"></script>

  <!-- ===== SIDEBAR SCRIPT ===== -->
  <script src="sidebar.js"></script>

  <!-- ===== PAGE-SPECIFIC JAVASCRIPT – WITH DELEGATED TOGGLE ===== -->
  <script>
    // ================================================================
    // PARTNER DASHBOARD – ALL DOM REFERENCES ARE CHECKED
    // ================================================================

    // ---- Toast fallback ----
    if (typeof cdToast === 'undefined') {
      window.cdToast = function(msg, type) { alert(msg); };
    }
    var cdToast = window.cdToast;

    // ---- Firebase auth/db ----
    var auth = window.auth || firebase.auth();
    var db = window.db || firebase.firestore();

    // ---- Ensure user doc ----
    async function ensureUserDoc(user) {
      var uid = user.uid;
      var docRef = db.collection('users').doc(uid);
      var doc = await docRef.get();
      if (doc.exists) return doc.data();
      var email = user.email || '';
      var username = email ? email.split('@')[0] : 'user' + uid.slice(0,6);
      var data = {
        uid: uid, email: email, displayName: user.displayName || '', username: username,
        role: 'Partner', partnerTier: 'signal', billingInterval: 'monthly',
        companyName: '', partnerId: 'PART-' + uid.slice(0,6).toUpperCase(),
        clicks: 0, downloads: 0, agreements: 0, referredStudents: 0,
        referralCode: username, totalReferrals: 0, totalCommissionEarned: 0,
        ambassadorTier: 'partner',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        tourCompleted: false
      };
      await docRef.set(data);
      return data;
    }

    // ---- Render functions (safe) ----
    function renderProfile(u) {
      var sidebarUsername = document.getElementById('sidebarUsername');
      if (sidebarUsername) sidebarUsername.textContent = u.username || 'Partner';
      var sidebarEmail = document.getElementById('sidebarEmail');
      if (sidebarEmail) sidebarEmail.textContent = u.email || 'loading...';
      var avatar = document.querySelector('.profile-avatar');
      if (avatar) {
        if (u.photoURL) {
          avatar.style.backgroundImage = 'url(' + u.photoURL + ')';
          avatar.innerHTML = '';
          localStorage.setItem('profilePhoto', u.photoURL);
        } else {
          var cached = localStorage.getItem('profilePhoto');
          if (cached) {
            avatar.style.backgroundImage = 'url(' + cached + ')';
            avatar.innerHTML = '';
          } else {
            avatar.style.backgroundImage = "url('cameras-decoded-logo.png')";
            avatar.innerHTML = '';
          }
        }
      }
      var badge = document.getElementById('roleTierBadge');
      if (badge) {
        badge.style.display = 'inline-flex';
        badge.innerHTML = '<span class="glow-role">' + (u.role || 'Partner') + '</span> · <span class="tier-text">' + (u.partnerTier || 'Signal') + '</span>';
      }
    }

    function renderStats(u) {
      function safeSet(id, value) {
        var el = document.getElementById(id);
        if (el) el.textContent = value;
      }
      safeSet('clickCount', u.clicks || 0);
      safeSet('downloadCount', u.downloads || 0);
      safeSet('agreementCount', u.agreements || 0);
      safeSet('studentCountPartner', u.referredStudents || 0);
      safeSet('profileUsername', u.username || '—');
      safeSet('profileName', u.displayName || u.name || '—');
      safeSet('profileEmail', u.email || '—');
      safeSet('profileCompany', u.companyName || '—');
      safeSet('profileLicense', (u.partnerTier || 'signal').charAt(0).toUpperCase() + (u.partnerTier || 'signal').slice(1));
      safeSet('profileBilling', (u.billingInterval || 'monthly').charAt(0).toUpperCase() + (u.billingInterval || 'monthly').slice(1));
      safeSet('partnerUniqueId', u.partnerId || '—');
      safeSet('referralLink', 'camerasdecoded.com/ref/' + (u.referralCode || ''));
      safeSet('totalReferrals', u.totalReferrals || 0);
      safeSet('totalCommission', '$' + (u.totalCommissionEarned || 0).toFixed(2));
      safeSet('ambassadorTier', 'Partner (20%)');
    }

    // ---- Render commission history ----
    function renderCommissionHistory(commissions) {
      var list = document.getElementById('commissionList');
      if (!list) return;
      if (!commissions || commissions.length === 0) {
        list.innerHTML = '<div class="commission-empty">No commissions yet. Earn commissions when people buy through your referral link.</div>';
        return;
      }
      var sorted = commissions.slice().sort(function(a, b) {
        var dateA = a.createdAt && a.createdAt.toDate ? a.createdAt.toDate() : new Date(0);
        var dateB = b.createdAt && b.createdAt.toDate ? b.createdAt.toDate() : new Date(0);
        return dateB - dateA;
      });
      var display = sorted.slice(0, 20);
      var html = '';
      for (var i = 0; i < display.length; i++) {
        var c = display[i];
        var date = c.createdAt && c.createdAt.toDate ? c.createdAt.toDate() : new Date();
        var dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        var statusClass = c.status || 'pending';
        var statusLabel = statusClass.charAt(0).toUpperCase() + statusClass.slice(1);
        html += '<div class="commission-item"><div class="left"><div class="name">' + (c.productName || 'Purchase') + '</div><div class="date">' + dateStr + '</div></div><div class="right"><span class="amount">$' + c.amount.toFixed(2) + '</span><span class="status ' + statusClass + '">' + statusLabel + '</span></div></div>';
      }
      list.innerHTML = html;

      var hasDemo = false;
      for (var j = 0; j < commissions.length; j++) {
        if (commissions[j].isDemo === true) {
          hasDemo = true;
          window.demoCommissionId = commissions[j].id;
          break;
        }
      }
      var resetBtn = document.getElementById('resetDemoBtn');
      var simBtn = document.getElementById('simulateBtn');
      if (hasDemo) {
        if (resetBtn) resetBtn.style.display = 'inline-block';
        if (simBtn) {
          simBtn.textContent = 'Demo used';
          simBtn.disabled = true;
          simBtn.style.opacity = '0.5';
          simBtn.style.cursor = 'default';
        }
      } else {
        if (resetBtn) resetBtn.style.display = 'none';
        if (simBtn) {
          simBtn.textContent = 'Simulate Purchase';
          simBtn.disabled = false;
          simBtn.style.opacity = '1';
          simBtn.style.cursor = 'pointer';
        }
        window.demoCommissionId = null;
      }
    }

    // ---- Simulate / reset ----
    function simulatePurchase() {
      if (!userDocRef) {
        cdToast('Please log in first.', 'error');
        return;
      }
      if (window.demoCommissionId) {
        cdToast('A demo commission already exists. Reset it first.', '');
        return;
      }
      var rate = 0.20;
      var purchaseAmount = 50;
      var commissionAmount = purchaseAmount * rate;
      var commissionRef = userDocRef.collection('commissions').doc();
      var commissionData = {
        productName: '📘 Camera Confidence Guide (demo)',
        amount: commissionAmount,
        status: 'pending',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        purchaseId: 'demo-' + Date.now(),
        purchaseAmount: purchaseAmount,
        rate: rate,
        tier: 'partner',
        isDemo: true
      };
      commissionRef.set(commissionData).then(function() {
        return userDocRef.update({
          totalCommissionEarned: firebase.firestore.FieldValue.increment(commissionAmount)
        });
      }).then(function() {
        cdToast('✅ Demo commission: $' + commissionAmount.toFixed(2) + ' earned (20% rate).');
      }).catch(function(err) {
        console.error('Simulate error:', err);
        cdToast('Error creating test commission: ' + err.message, 'error');
      });
    }

    function resetDemoCommission() {
      if (!window.demoCommissionId) {
        cdToast('No demo commission to reset.', '');
        return;
      }
      if (!userDocRef) return;
      var commissionRef = userDocRef.collection('commissions').doc(window.demoCommissionId);
      commissionRef.get().then(function(doc) {
        if (!doc.exists) return;
        var amount = doc.data().amount || 0;
        return commissionRef.delete().then(function() {
          return userDocRef.update({
            totalCommissionEarned: firebase.firestore.FieldValue.increment(-amount)
          });
        });
      }).then(function() {
        window.demoCommissionId = null;
        cdToast('Demo commission removed.');
      }).catch(function(err) {
        console.error('Reset demo error:', err);
        cdToast('Could not reset demo: ' + err.message, 'error');
      });
    }

    // ---- Main load ----
    var loadingEl = document.getElementById('loadingState');
    var contentEl = document.getElementById('dashboardContent');

    async function loadDashboard(user) {
      if (!user) {
        loadingEl.innerHTML = '<p class="error">Not authenticated. <a href="login.html">Login</a></p>';
        return;
      }
      try {
        console.log('🔄 Loading partner dashboard for user:', user.uid);
        var userData = await ensureUserDoc(user);
        console.log('✅ Partner data loaded:', userData);
        renderProfile(userData);
        renderStats(userData);
        loadingEl.style.display = 'none';
        contentEl.style.display = 'block';
        if (document.getElementById('statsGrid') && typeof insertCommissionCard === 'function') {
          insertCommissionCard('statsGrid', 'after');
        }
        if (window.BottomNav) {
          window.BottomNav.updateBadges(userData);
        }
      } catch (err) {
        console.error('❌ Dashboard load error:', err);
        if (loadingEl) {
          loadingEl.innerHTML = '<p style="color:#ff4a4a; font-family:\'Space Mono\',monospace;">Error loading dashboard: ' + err.message + '</p>';
        }
      }
    }

    // ---- Auth listener ----
    auth.onAuthStateChanged(function(user) {
      if (user) {
        loadDashboard(user);
      } else {
        loadingEl.innerHTML = '<p>You are not logged in. <a href="login.html">Go to Login</a></p>';
      }
    });

    // ---- Logout ----
    window.handleLogout = function() {
      auth.signOut().then(function() {
        window.location.href = 'login.html';
      }).catch(function() {
        window.location.href = 'login.html';
      });
    };

    // ================================================================
    // SIDEBAR TOGGLE – DELEGATED EVENT LISTENER (WORKS EVEN IF BUTTON IS ADDED LATE)
    // ================================================================
    document.addEventListener('click', function(e) {
      var target = e.target;
      // Check if the click is on the toggle button or its child icon
      var toggle = target.closest('#floatingToggle');
      if (toggle) {
        e.preventDefault();
        var sidebarContainer = document.getElementById('sidebarContainer');
        if (sidebarContainer) {
          var sidebar = sidebarContainer.querySelector('.sidebar');
          if (sidebar) {
            sidebar.classList.toggle('open');
            console.log('Sidebar toggled:', sidebar.classList.contains('open') ? 'open' : 'closed');
          } else {
            console.warn('Sidebar element not found inside sidebarContainer');
          }
        } else {
          console.warn('sidebarContainer not found');
        }
      }
    });

    // ---- Cart UI ----
    function getCart() { return JSON.parse(localStorage.getItem('cameras_decoded_cart') || '[]'); }
    function updateCartUI() {
      var cart = getCart();
      var totalItems = 0;
      for (var i = 0; i < cart.length; i++) {
        totalItems += cart[i].qty;
      }
      var countEl = document.getElementById('cartHeaderCount');
      var labelEl = document.getElementById('cartHeaderLabel');
      if (countEl) {
        countEl.textContent = totalItems;
        countEl.style.display = totalItems > 0 ? 'inline-block' : 'none';
      }
      if (labelEl) {
        labelEl.textContent = totalItems > 0 ? 'Cart (' + totalItems + ')' : 'Cart';
      }
    }
    updateCartUI();

    // ---- Reveal animations ----
    document.addEventListener('DOMContentLoaded', function() {
      var reveals = document.querySelectorAll('.reveal');
      var observer = new IntersectionObserver(function(entries) {
        for (var i = 0; i < entries.length; i++) {
          var entry = entries[i];
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        }
      }, { threshold: 0.1 });
      for (var j = 0; j < reveals.length; j++) {
        observer.observe(reveals[j]);
      }
    });

    // ---- Expose global functions ----
    window.copyReferralLink = function() {
      var link = document.getElementById('referralLink').textContent;
      navigator.clipboard.writeText('https://' + link).then(function() {
        cdToast('Copied!');
      }).catch(function() {
        var input = document.createElement('input');
        input.value = 'https://' + link;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        cdToast('Copied!');
      });
    };
    window.handleLogout = handleLogout;
    window.simulatePurchase = simulatePurchase;
    window.resetDemoCommission = resetDemoCommission;
  </script>
</body>
</html>
