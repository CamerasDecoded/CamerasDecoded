<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operator Dashboard — Cameras Decoded</title>

  <!-- ===== SHARED BOTTOM NAV CSS ===== -->
  <link rel="stylesheet" href="bottom-nav.css" />

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* ============================================================
       COMPLETE DASHBOARD – APPLE ACTIVITY CARD WITH 3 RINGS
       ============================================================ */
    :root {
      --green: #8deb00;
      --green-dim: rgba(141,235,0,0.12);
      --green-glow: rgba(141,235,0,0.25);
      --text-muted: #b4b4b4;
      --bg-panel: #0A0A0A;
      --border-dim: #1A1A1A;
      --gold: #e0b12d;
      --card-bg: rgba(10,10,10,0.6);
      --radius: 12px;
      --transition-smooth: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ring-size: 88px;
      --ring-stroke: 6px;
      --ring-gap: 12px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: #050705;
      background-image: radial-gradient(circle at 20% 30%, rgba(141,235,0,0.12) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(141,235,0,0.08) 0%, transparent 45%),
                        linear-gradient(rgba(141,235,0,0.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(141,235,0,0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px, 24px 24px;
      background-attachment: fixed;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }
    h1, h2, h3, .mono { font-family: 'Space Mono', monospace; }

    /* ===== SCROLLBARS ===== */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
    * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent; }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeInUp { 0% { opacity:0; transform:translateY(20px); } 100% { opacity:1; transform:translateY(0); } }
    @keyframes fireFlicker {
      0%,100% { transform: scale(1) rotate(-2deg); opacity:1; }
      25% { transform: scale(1.1) rotate(2deg); opacity:0.9; }
      50% { transform: scale(0.95) rotate(-1deg); opacity:1; }
      75% { transform: scale(1.06) rotate(3deg); opacity:0.95; }
    }
    @keyframes numberPulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* ============================================================
       LAYOUT
       ============================================================ */
    .dashboard-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px 120px;
    }

    /* ===== HEADER SECTION ===== */
    .dashboard-header {
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-dim);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .header-top h1 {
      font-size: 28px;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .action-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--text-muted);
      font-size: 16px;
    }

    .action-btn:hover {
      border-color: var(--green);
      color: var(--green);
      box-shadow: 0 0 20px rgba(141,235,0,0.2);
    }

    /* ===== PROFILE SECTION ===== */
    .profile-section {
      background: var(--card-bg);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(141,235,0,0.1);
      border: 2px solid var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
    }

    .profile-info {
      flex: 1;
    }

    .profile-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .profile-email {
      font-size: 13px;
      color: var(--text-muted);
    }

    .profile-links {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .profile-link-btn {
      padding: 8px 16px;
      background: rgba(141,235,0,0.1);
      border: 1px solid var(--green);
      border-radius: 6px;
      font-size: 12px;
      color: var(--green);
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Space Mono', monospace;
    }

    .profile-link-btn:hover {
      background: rgba(141,235,0,0.2);
      box-shadow: 0 0 15px rgba(141,235,0,0.2);
    }

    /* ============================================================
       APPLE ACTIVITY CARD – 3 RINGS
       ============================================================ */
    .activity-card {
      background: rgba(10, 10, 10, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 24px 28px 20px;
      margin-bottom: 24px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      animation: fadeInUp 0.6s var(--transition-smooth) forwards;
      opacity: 0;
    }
    .activity-card:hover {
      border-color: rgba(141, 235, 0, 0.15);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
    }

    .activity-title {
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .activity-title i {
      color: var(--green);
      font-size: 16px;
    }

    /* ---- Rings Row ---- */
    .rings-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-around;
      gap: 16px;
      flex-wrap: wrap;
    }

    .ring-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 80px;
      max-width: 130px;
    }

    .ring-wrapper {
      position: relative;
      width: var(--ring-size);
      height: var(--ring-size);
      flex-shrink: 0;
    }
    .ring-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      display: block;
    }
    .ring-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.06);
      stroke-width: var(--ring-stroke);
    }
    .ring-fill {
      fill: none;
      stroke-width: var(--ring-stroke);
      stroke-linecap: round;
      transition: stroke-dashoffset 1s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .ring-fill.streak-ring { stroke: #ff6b35; }
    .ring-fill.points-ring { stroke: #8deb00; }
    .ring-fill.multiplier-ring { stroke: #e0b12d; }

    .ring-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      line-height: 1;
    }
    .ring-icon {
      font-size: 18px;
      display: block;
      margin-bottom: 1px;
    }
    .ring-icon.fire-icon {
      animation: fireFlicker 1.2s ease-in-out infinite;
      transform-origin: center;
    }
    .ring-value {
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      display: block;
      transition: all 0.3s ease;
    }
    .ring-value.animate {
      animation: numberPulse 0.6s var(--transition-smooth) 2;
    }
    .ring-label {
      font-size: 8px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-top: 1px;
      display: block;
    }

    /* ---- Progress Tier (below rings) ---- */
    .activity-bottom {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .tier-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'Space Mono', monospace;
      margin-bottom: 6px;
    }
    .tier-header strong {
      color: #fff;
      font-weight: 700;
    }
    .tier-target {
      color: var(--green);
      font-weight: 700;
    }

    .tier-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .tier-fill {
      height: 100%;
      background: linear-gradient(90deg, #1db31b 0%, #c9e265 100%);
      border-radius: 4px;
      width: 0%;
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ============================================================
       STAT CARDS GRID (4 CARDS)
       ============================================================ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius);
      padding: 24px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s var(--transition-smooth);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
      cursor: pointer;
      perspective: 1000px;
      transform-style: preserve-3d;
    }

    .stat-card:hover {
      border-color: var(--green);
      box-shadow: 0 8px 30px rgba(141,235,0,0.15);
    }

    .stat-card.hovered {
      border-color: var(--green);
    }

    .stat-card.dimmed {
      opacity: 0.4;
      pointer-events: none;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      font-family: 'Space Mono', monospace;
    }

    .stat-number {
      font-size: 32px;
      font-weight: 700;
      color: var(--green);
      font-family: 'Space Mono', monospace;
      margin-bottom: 12px;
    }

    .stat-description {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* ============================================================
       SECTIONS (Learning, Challenge, Protocols, Referral, Feed)
       ============================================================ */
    .section {
      margin-bottom: 40px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-family: 'Space Mono', monospace;
    }

    .section-title i {
      color: var(--green);
      font-size: 18px;
    }

    .section-content {
      background: var(--card-bg);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius);
      padding: 24px;
      animation: fadeInUp 0.6s var(--transition-smooth) forwards;
      opacity: 0;
    }

    /* ===== JOURNEY SECTION ===== */
    #journeySection {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    .journey-card {
      background: rgba(141,235,0,0.08);
      border: 1px solid rgba(141,235,0,0.2);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .journey-card:hover {
      background: rgba(141,235,0,0.15);
      border-color: var(--green);
      transform: translateY(-2px);
    }

    .journey-card h4 {
      font-size: 13px;
      margin-bottom: 8px;
      color: #fff;
    }

    .journey-card p {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ===== CHALLENGE SECTION ===== */
    .challenge-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .challenge-info h3 {
      margin-bottom: 8px;
    }

    .challenge-info p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .challenge-btn {
      padding: 12px 24px;
      background: var(--green);
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .challenge-btn:hover {
      background: #a0f520;
      box-shadow: 0 0 20px rgba(141,235,0,0.3);
    }

    /* ===== PROTOCOLS SECTION ===== */
    .protocols-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .protocol-item {
      background: rgba(141,235,0,0.04);
      border: 1px solid rgba(141,235,0,0.15);
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .protocol-item:hover {
      background: rgba(141,235,0,0.1);
      border-color: var(--green);
    }

    .protocol-item h4 {
      font-size: 13px;
      margin-bottom: 4px;
      color: #fff;
    }

    .protocol-item p {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ===== REFERRAL SECTION ===== */
    .referral-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .referral-info h3 {
      margin-bottom: 8px;
    }

    .referral-info p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .referral-code {
      background: rgba(141,235,0,0.08);
      border: 1px solid rgba(141,235,0,0.3);
      border-radius: 8px;
      padding: 12px 16px;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      color: var(--green);
      word-break: break-all;
      flex: 1;
      min-width: 150px;
    }

    .copy-btn {
      padding: 10px 16px;
      background: rgba(141,235,0,0.1);
      border: 1px solid var(--green);
      color: var(--green);
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      transition: all 0.3s ease;
    }

    .copy-btn:hover {
      background: rgba(141,235,0,0.2);
      box-shadow: 0 0 15px rgba(141,235,0,0.2);
    }

    /* ===== FEED SECTION ===== */
    #feed-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .feed-item {
      background: rgba(141,235,0,0.04);
      border: 1px solid rgba(141,235,0,0.15);
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .feed-item:hover {
      background: rgba(141,235,0,0.1);
      border-color: var(--green);
      transform: translateY(-2px);
    }

    .feed-item h4 {
      font-size: 13px;
      margin-bottom: 8px;
      color: #fff;
    }

    .feed-item p {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* ===== LOADING & CONTENT ===== */
    #loadingState {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    #dashboardContent {
      display: none;
    }

    .error {
      color: #ff4a4a;
    }

    .section-content {
      opacity: 0;
      animation: fadeInUp 0.6s var(--transition-smooth) forwards;
    }

    .section:nth-child(1) .section-content { animation-delay: 0.1s; }
    .section:nth-child(2) .section-content { animation-delay: 0.2s; }
    .section:nth-child(3) .section-content { animation-delay: 0.3s; }
    .section:nth-child(4) .section-content { animation-delay: 0.4s; }
    .section:nth-child(5) .section-content { animation-delay: 0.5s; }

    /* ===== SPOTLIGHT CARD EFFECT ===== */
    .stat-card.spotlight-enabled {
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .dashboard-wrapper {
        padding: 24px 16px 120px;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .profile-section {
        flex-direction: column;
        text-align: center;
      }

      .profile-links {
        justify-content: center;
      }

      .challenge-content, .referral-content {
        flex-direction: column;
        align-items: stretch;
      }

      .header-top {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
    }

    @media (max-width: 480px) {
      .dashboard-wrapper {
        padding: 16px 12px 120px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .header-top h1 {
        font-size: 24px;
      }

      .stat-number {
        font-size: 28px;
      }

      .rings-row {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <!-- LOADING STATE -->
  <div id="loadingState">
    <p>Loading your dashboard...</p>
  </div>

  <!-- MAIN CONTENT -->
  <div id="dashboardContent">
    <div class="dashboard-wrapper">
      
      <!-- HEADER SECTION -->
      <div class="dashboard-header">
        <div class="header-top">
          <h1>Operator Dashboard</h1>
          <div class="header-actions">
            <button class="action-btn" title="Settings">
              <i class="fas fa-cog"></i>
            </button>
            <button class="action-btn" title="Notifications">
              <i class="fas fa-bell"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- PROFILE SECTION -->
      <div id="profileSection"></div>

      <!-- ACTIVITY RING CARD (Hero) -->
      <div id="statsSection"></div>

      <!-- STAT CARDS GRID (4 Cards: Saved Protocols, Snapshot Cards, Other Saved, Community Posts) -->
      <div class="stats-grid" id="statCardsGrid"></div>

      <!-- LEARNING JOURNEY SECTION -->
      <div class="section">
        <div class="section-title">
          <i class="fas fa-graduation-cap"></i>
          Learning Journey
        </div>
        <div class="section-content">
          <div id="journeySection"></div>
        </div>
      </div>

      <!-- 30-DAY CHALLENGE SECTION -->
      <div class="section">
        <div class="section-title">
          <i class="fas fa-fire"></i>
          30-Day Challenge
        </div>
        <div class="section-content">
          <div id="challengeSection"></div>
        </div>
      </div>

      <!-- PROTOCOLS LIBRARY SECTION -->
      <div class="section">
        <div class="section-title">
          <i class="fas fa-play-circle"></i>
          Protocols Library
        </div>
        <div class="section-content">
          <div id="protocolsSection"></div>
        </div>
      </div>

      <!-- REFERRAL & AMBASSADOR SECTION -->
      <div class="section">
        <div class="section-title">
          <i class="fas fa-users"></i>
          Referral & Ambassador Program
        </div>
        <div class="section-content">
          <div id="referralSection"></div>
        </div>
      </div>

      <!-- PERSONALIZED FEED SECTION -->
      <div class="section">
        <div class="section-title">
          <i class="fas fa-stream"></i>
          Your Feed
        </div>
        <div class="section-content">
          <div id="feed-container"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

  <script src="js/firebase-init.js"></script>

  <script>
    // ============================================================
    // ALL ORIGINAL FUNCTIONS PRESERVED EXACTLY
    // ============================================================

    // Create Spring class for physics-based animation
    class Spring {
      constructor(stiffness = 200, damping = 25) {
        this.stiffness = stiffness;
        this.damping = damping;
        this.current = 0;
        this.target = 0;
        this.velocity = 0;
      }

      setTarget(value) {
        this.target = value;
      }

      update(dt) {
        const diff = this.target - this.current;
        const force = this.stiffness * diff;
        this.velocity += force * dt;
        this.velocity *= (1 - this.damping * dt);
        this.current += this.velocity * dt;
        return this.current;
      }
    }

    // ---- Render Profile ----
    function renderProfile(userData) {
      const profileEl = document.getElementById('profileSection');
      const avatarText = userData.displayName ? userData.displayName.charAt(0).toUpperCase() : 'U';
      
      profileEl.innerHTML = `
        <div class="profile-section">
          <div class="profile-avatar">${avatarText}</div>
          <div class="profile-info">
            <div class="profile-name">${userData.displayName || 'Operator'}</div>
            <div class="profile-email">${userData.email || 'user@camerasdecoded.com'}</div>
            <div class="profile-links">
              <button class="profile-link-btn" id="goToAtlasBtn">Camera Atlas</button>
              <button class="profile-link-btn" id="goToCollectionBtn">Saved Collection</button>
            </div>
          </div>
        </div>
      `;
    }

    // ---- Render Stats (Activity Card with 3 Rings) ----
    function renderStats(userData) {
      const points = userData.totalPoints || 0;
      const streak = userData.dailyStreak || 0;
      const bonus = (userData.bonusMultiplier || 1) * 100;
      const xp = userData.totalPoints || 0;
      const xpToNextTier = 2000 - (xp % 2000);
      const nextTierXp = xpToNextTier;
      const tierProgress = ((xp % 2000) / 2000) * 100;

      const pointsCircumference = 2 * Math.PI * 35;
      const pointsOffset = pointsCircumference * (1 - Math.min(points, 1000) / 1000);
      const streakCircumference = 2 * Math.PI * 35;
      const streakOffset = streakCircumference * (1 - Math.min(streak, 30) / 30);
      const bonusCircumference = 2 * Math.PI * 35;
      const bonusOffset = bonusCircumference * (1 - Math.min(bonus, 150) / 150);

      const statsEl = document.getElementById('statsSection');
      statsEl.innerHTML = `
        <div class="activity-card" style="animation-delay:0.2s;">
          <div class="activity-title">
            <i class="fas fa-fire"></i>
            Activity Progress
          </div>
          <div class="rings-row">
            <div class="ring-item">
              <div class="ring-wrapper">
                <svg class="ring-svg" viewBox="0 0 88 88">
                  <circle class="ring-bg" cx="44" cy="44" r="35" />
                  <circle class="ring-fill points-ring" cx="44" cy="44" r="35" stroke-dasharray="${pointsCircumference}" stroke-dashoffset="${pointsOffset}" />
                </svg>
                <div class="ring-center">
                  <span class="ring-icon">⭐</span>
                  <span class="ring-value">${Math.min(points, 999)}</span>
                  <span class="ring-label">Points</span>
                </div>
              </div>
            </div>
            <div class="ring-item">
              <div class="ring-wrapper">
                <svg class="ring-svg" viewBox="0 0 88 88">
                  <circle class="ring-bg" cx="44" cy="44" r="35" />
                  <circle class="ring-fill streak-ring" cx="44" cy="44" r="35" stroke-dasharray="${streakCircumference}" stroke-dashoffset="${streakOffset}" />
                </svg>
                <div class="ring-center">
                  <span class="ring-icon fire-icon">🔥</span>
                  <span class="ring-value">${streak}</span>
                  <span class="ring-label">Streak</span>
                </div>
              </div>
            </div>
            <div class="ring-item">
              <div class="ring-wrapper">
                <svg class="ring-svg" viewBox="0 0 88 88">
                  <circle class="ring-bg" cx="44" cy="44" r="35" />
                  <circle class="ring-fill multiplier-ring" cx="44" cy="44" r="35" stroke-dasharray="${bonusCircumference}" stroke-dashoffset="${bonusOffset}" />
                </svg>
                <div class="ring-center">
                  <span class="ring-icon">⚡</span>
                  <span class="ring-value">${bonus.toFixed(0)}%</span>
                  <span class="ring-label">Bonus</span>
                </div>
              </div>
            </div>
          </div>
          <div class="activity-bottom">
            <div class="tier-header">
              <strong>Next Tier</strong>
              <span class="tier-target">${Math.ceil(nextTierXp)} XP</span>
            </div>
            <div class="tier-track">
              <div class="tier-fill" style="width:${tierProgress}%"></div>
            </div>
          </div>
        </div>
      `;
    }

    // ---- Ensure User Doc ----
    async function ensureUserDoc(user) {
      const userRef = db.collection('users').doc(user.uid);
      const userSnap = await userRef.get();
      
      if (!userSnap.exists) {
        await userRef.set({
          uid: user.uid,
          email: user.email,
          displayName: user.displayName || 'Operator',
          createdAt: new Date(),
          totalPoints: 0,
          dailyStreak: 0,
          bonusMultiplier: 1,
          savedProtocolsCount: 0,
          snapshotCardsCount: 0,
          otherSavedCount: 0,
          communityPostsCount: 0,
        });
      }
      
      return userSnap.exists ? userSnap.data() : (await userRef.get()).data();
    }

    // ---- Animate Rings on Load ----
    function animateRingsOnLoad(userData) {
      const rings = document.querySelectorAll('.ring-fill');
      rings.forEach(ring => {
        const currentDashOffset = parseFloat(ring.getAttribute('stroke-dashoffset'));
        ring.setAttribute('stroke-dashoffset', ring.getAttribute('stroke-dasharray'));
        setTimeout(() => {
          ring.style.transition = 'stroke-dashoffset 1.2s cubic-bezier(0.34, 1.56, 0.64, 1)';
          ring.setAttribute('stroke-dashoffset', currentDashOffset);
        }, 100);
      });
    }

    // ---- Spotlight Card Effect ----
    function initSpotlightCards() {
      if (!window._spotlightCardsData) {
        window._spotlightCardsData = [];
      }

      const cards = document.querySelectorAll('.stat-card');
      let prevTime;

      cards.forEach(card => {
        const springX = new Spring(200, 25);
        const springY = new Spring(200, 25);
        const cardData = {
          element: card,
          springX,
          springY,
          isHovering: false,
        };

        window._spotlightCardsData.push(cardData);

        // Desktop: Hover
        card.addEventListener('mouseenter', () => {
          cardData.isHovering = true;
          card.classList.add('hovered');
          cards.forEach(c => {
            if (c !== card) c.classList.add('dimmed');
          });
        });

        card.addEventListener('mousemove', (e) => {
          if (!cardData.isHovering) return;
          const rect = card.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width;
          const y = (e.clientY - rect.top) / rect.height;
          const tiltMax = 8;
          springX.setTarget((y - 0.5) * -tiltMax);
          springY.setTarget((x - 0.5) * tiltMax);
        });

        card.addEventListener('mouseleave', () => {
          cardData.isHovering = false;
          card.classList.remove('hovered');
          cards.forEach(c => c.classList.remove('dimmed'));
          springX.setTarget(0);
          springY.setTarget(0);
        });

        // Mobile: Tap
        let touchMoved = false;
        let isDragging = false;

        card.addEventListener('touchstart', (e) => {
          cardData.isHovering = true;
          card.classList.add('hovered');
          cards.forEach(c => {
            if (c !== card) c.classList.add('dimmed');
          });
          touchMoved = false;

          const autoNodTimeout = setTimeout(() => {
            if (!touchMoved && cardData.isHovering) {
              springX.setTarget(4);
              springY.setTarget(-4);
              setTimeout(() => {
                springX.setTarget(-4);
                springY.setTarget(4);
                setTimeout(() => {
                  springX.setTarget(0);
                  springY.setTarget(0);
                }, 300);
              }, 300);
            }
          }, 200);
          card._autoNodTimeout = autoNodTimeout;
        }, { passive: true });

        let touchStartX = 0, touchStartY = 0;
        card.addEventListener('touchstart', (e) => {
          const touch = e.touches[0];
          touchStartX = touch.clientX;
          touchStartY = touch.clientY;
        }, { passive: true });

        card.addEventListener('touchmove', (e) => {
          const touch = e.touches[0];
          const rect = card.getBoundingClientRect();
          const x = (touch.clientX - rect.left) / rect.width;
          const y = (touch.clientY - rect.top) / rect.height;

          if (!touchMoved) {
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
              touchMoved = true;
              isDragging = true;
              if (card._autoNodTimeout) {
                clearTimeout(card._autoNodTimeout);
                card._autoNodTimeout = null;
              }
              springX.setTarget(0);
              springY.setTarget(0);
            }
          }

          if (isDragging && cardData.isHovering) {
            const tiltMax = 8;
            springX.setTarget((y - 0.5) * -tiltMax);
            springY.setTarget((x - 0.5) * tiltMax);
          }
        }, { passive: true });

        card.addEventListener('touchend', () => {
          if (card._autoNodTimeout) {
            clearTimeout(card._autoNodTimeout);
            card._autoNodTimeout = null;
          }
          if (isDragging) {
            springX.setTarget(0);
            springY.setTarget(0);
            cardData.isHovering = false;
            card.classList.remove('hovered');
            cards.forEach(c => c.classList.remove('dimmed'));
          } else {
            setTimeout(() => {
              if (!isDragging) {
                cardData.isHovering = false;
                card.classList.remove('hovered');
                cards.forEach(c => c.classList.remove('dimmed'));
                springX.setTarget(0);
                springY.setTarget(0);
              }
            }, 800);
          }
          isDragging = false;
          touchMoved = false;
        }, { passive: true });
      });

      function animate(timestamp) {
        const dt = prevTime ? Math.min((timestamp - prevTime) / 1000, 0.05) : 0.016;
        prevTime = timestamp;
        if (window._spotlightCardsData) {
          window._spotlightCardsData.forEach(data => {
            const x = data.springX.update(dt);
            const y = data.springY.update(dt);
            data.element.style.transform = `rotateX(${x}deg) rotateY(${y}deg)`;
          });
        }
        requestAnimationFrame(animate);
      }

      if (!window._spotlightAnimId) {
        window._spotlightAnimId = requestAnimationFrame(animate);
      }
    }

    // ---- Main Load ----
    const loadingEl = document.getElementById('loadingState');
    const contentEl = document.getElementById('dashboardContent');

    async function loadDashboard(user) {
      if (!user) {
        loadingEl.innerHTML = '<p class="error">Not authenticated. <a href="login.html">Login</a></p>';
        return;
      }
      try {
        const userData = await ensureUserDoc(user);
        renderProfile(userData);
        renderStats(userData);
        renderStatCards(userData);
        renderAIWidget(userData);
        renderJourney(userData);
        renderChallenge(userData);
        renderProtocols(userData);
        renderReferral(userData);

        animateRingsOnLoad(userData);

        document.getElementById('goToAtlasBtn').href = `https://settings.camerasdecoded.com/?opToken=${userData.uid}`;
        document.getElementById('goToCollectionBtn').href = `https://settings.camerasdecoded.com/collection.html?opToken=${userData.uid}`;

        await loadNotification();

        (function() {
          const container = document.getElementById('feed-container');
          if (!container) return;
          function setFeedMessage(msg) {
            container.innerHTML = `<div style="padding:40px 20px;text-align:center;grid-column:1/-1;color:var(--text-muted);">${msg}</div>`;
          }
          setFeedMessage('Your personalized feed will appear here as you explore more content.');
        })();

        loadingEl.style.display = 'none';
        contentEl.style.display = 'block';

        initSpotlightCards();

        if (window.BottomNav) {
          window.BottomNav.updateBadges(userData);
        }

      } catch (err) {
        console.error(err);
        loadingEl.innerHTML = `<p class="error">Error: ${err.message}</p>`;
      }
    }

    auth.onAuthStateChanged((user) => {
      if (user) {
        loadDashboard(user);
      } else {
        loadingEl.innerHTML = '<p>You are not logged in. <a href="login.html">Go to Login</a></p>';
      }
    });

    if (auth.currentUser) {
      loadDashboard(auth.currentUser);
    }
  </script>
