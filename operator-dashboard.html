<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operator Dashboard</title>
  <style>
    body { font-family: sans-serif; background: #0a0a0a; color: #fff; padding: 20px; }
    .card { background: #1a1a1a; padding: 20px; border-radius: 12px; max-width: 600px; margin: 20px auto; }
    button { padding: 8px 16px; background: #8deb00; border: none; border-radius: 4px; color: #000; cursor: pointer; margin: 4px; }
    .error { color: #ff4a4a; }
    .success { color: #8deb00; }
    pre { background: #2a2a2a; padding: 10px; border-radius: 6px; overflow: auto; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📡 Operator Dashboard</h2>
    <div id="content">
      <p>Loading...</p>
    </div>
    <hr>
    <button id="logoutBtn">Logout</button>
    <button id="reloadBtn" onclick="location.reload()">Reload</button>
    <p style="margin-top: 12px; font-size: 12px; color: #888;">This page does NOT redirect. Check console for logs.</p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyB95Vx0i8W6WNfUy1N4TNQyfN5xCxQYnz8",
      authDomain: "cameras-decoded.firebaseapp.com",
      projectId: "cameras-decoded",
      storageBucket: "cameras-decoded.firebasestorage.app",
      messagingSenderId: "1088920052790",
      appId: "1:1088920052790:web:2177c1fb31109c1fa02497",
      measurementId: "G-YN3M01WW0B"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const content = document.getElementById('content');

    // Helper to create minimal user doc
    async function ensureUserDoc(user) {
      const uid = user.uid;
      const docRef = db.collection('users').doc(uid);
      const doc = await docRef.get();
      if (doc.exists) return doc.data();

      // Create minimal doc
      const email = user.email || '';
      const username = email ? email.split('@')[0] : 'user' + uid.slice(0,6);
      const data = {
        uid,
        email,
        displayName: user.displayName || '',
        username,
        role: 'Operator',
        tier: 'free',
        billingInterval: 'monthly',
        preferences: { brands: [], lenses: [], interests: [] },
        learningJourney: {},
        totalPoints: 0,
        level: 1,
        badgesEarned: [],
        dailyChallengeStreak: 0,
        lastChallengeDate: null,
        dailyChallengesCompleted: [],
        savedProtocols: [],
        savedCards: [],
        savedBlogs: [],
        savedPodcasts: [],
        savedCommunityPosts: [],
        referralCode: username,
        totalReferrals: 0,
        totalCommissionEarned: 0,
        ambassadorTier: 'signal',
        aiUsage: { total: 0, prompt: 0, snapshot: 0, ideas: 0, critique: 0 },
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        tourCompleted: false
      };
      await docRef.set(data);
      return data;
    }

    // Render dashboard content
    function renderUserData(user, userData, error = null) {
      if (error) {
        content.innerHTML = `<p class="error">❌ Error: ${error.message || error}</p><pre>${JSON.stringify(error, null, 2)}</pre>`;
        return;
      }
      if (!user) {
        content.innerHTML = `<p class="error">❌ No user logged in.</p>`;
        return;
      }
      const html = `
        <p><strong>Authenticated as:</strong> ${user.email || 'No email'}</p>
        <p><strong>UID:</strong> ${user.uid}</p>
        <p><strong>Display Name:</strong> ${user.displayName || '—'}</p>
        ${userData ? `
          <p class="success">✅ User document found/created.</p>
          <p><strong>Username:</strong> ${userData.username || '—'}</p>
          <p><strong>Role:</strong> ${userData.role || '—'}</p>
          <p><strong>Plan:</strong> ${userData.tier || '—'}</p>
          <p><strong>Points:</strong> ${userData.totalPoints || 0}</p>
        ` : `
          <p class="error">❌ No user data available.</p>
        `}
      `;
      content.innerHTML = html;
    }

    // Main load function
    async function loadDashboard(user) {
      if (!user) {
        renderUserData(null, null, new Error('Not authenticated'));
        console.warn('No user');
        return;
      }

      console.log('User authenticated:', user.uid, user.email);

      try {
        const userData = await ensureUserDoc(user);
        console.log('User document:', userData);
        renderUserData(user, userData);
      } catch (err) {
        console.error('Error loading user doc:', err);
        renderUserData(user, null, err);
      }
    }

    // Auth listener
    auth.onAuthStateChanged((user) => {
      console.log('Auth state changed. User:', user ? user.uid : null);
      if (user) {
        loadDashboard(user);
      } else {
        renderUserData(null, null, new Error('No user signed in. Please go to login.'));
        console.warn('No user');
      }
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      auth.signOut().then(() => {
        window.location.href = 'login.html';
      });
    });

    // Check if already logged in on page load
    if (auth.currentUser) {
      loadDashboard(auth.currentUser);
    } else {
      console.log('No current user, waiting for listener.');
    }
  </script>
</body>
</html>
