<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operator Dashboard — Cameras Decoded</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div id="toast-container"></div>

  <div style="max-width:1200px;margin:40px auto;padding:0 20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;border-bottom:1px solid var(--border);padding-bottom:12px;">
      <h1 style="font-family:'Space Mono',monospace;color:var(--green);">📡 Operator Dashboard</h1>
      <div style="display:flex;gap:12px;">
        <button id="logoutBtn" class="btn-secondary" style="padding:6px 16px;font-size:12px;">Logout</button>
      </div>
    </div>

    <!-- Loading State -->
    <div id="loadingState" style="text-align:center;padding:60px 0;color:var(--text-muted);">
      <i class="fas fa-spinner fa-spin" style="font-size:32px;color:var(--green);"></i>
      <p style="margin-top:12px;">Loading your signal...</p>
    </div>

    <!-- Dashboard Content (hidden until loaded) -->
    <div id="dashboardContent" style="display:none;">

      <!-- Profile Overview -->
      <div id="profileSection" style="background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:24px;"></div>

      <!-- Stats -->
      <div id="statsSection" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:24px;"></div>

      <!-- AI Widget -->
      <div id="aiWidget" style="background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:24px;"></div>

      <!-- 4-Block Grid -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;">
        <div id="journeyBlock" style="background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;"></div>
        <div id="challengeBlock" style="background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;"></div>
      </div>

      <!-- Protocols -->
      <div id="protocolsSection" style="background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:24px;"></div>

      <!-- Referral & Commissions -->
      <div id="referralSection" style="background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:24px;"></div>

    </div>
  </div>

  <script type="module">
    import { auth, db } from './js/firebase-init.js';
    import { logout } from './js/auth.js';
    import { cdToast, triggerConfetti, initParticles } from './js/ui-helpers.js';
    import { PROTOCOL_LIBRARY, CHALLENGES, BADGE_DEFS } from './js/constants.js';

    initParticles();

    const loading = document.getElementById('loadingState');
    const content = document.getElementById('dashboardContent');
    const uid = new URLSearchParams(window.location.search).get('uid');

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await logout();
      window.location.href = 'login.html';
    });

    // Load Dashboard
    async function loadDashboard(userId) {
      try {
        const doc = await db.collection('users').doc(userId).get();
        if (!doc.exists) {
          cdToast('User data not found.', 'error');
          return;
        }
        const user = doc.data();

        // Fill sections
        renderProfile(user);
        renderStats(user);
        renderAIWidget(user);
        renderJourney(user);
        renderChallenge(user);
        renderProtocols(user);
        renderReferral(user);

        loading.style.display = 'none';
        content.style.display = 'block';

      } catch (err) {
        console.error(err);
        cdToast('Error loading dashboard: ' + err.message, 'error');
      }
    }

    // ----- Render Functions (compact) -----
    function renderProfile(u) {
      const el = document.getElementById('profileSection');
      el.innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;">
          <div><span style="color:var(--text-muted);font-size:11px;">Name</span><br><strong>${u.displayName || '—'}</strong></div>
          <div><span style="color:var(--text-muted);font-size:11px;">Username</span><br><strong>${u.username || '—'}</strong></div>
          <div><span style="color:var(--text-muted);font-size:11px;">Plan</span><br><strong style="color:var(--green);">${u.tier === 'pro' ? 'Pro' : 'Free'}</strong></div>
          <div><span style="color:var(--text-muted);font-size:11px;">Level</span><br><strong>${u.level || 1}</strong></div>
          <div><span style="color:var(--text-muted);font-size:11px;">Points</span><br><strong>${u.totalPoints || 0}</strong></div>
          <div><span style="color:var(--text-muted);font-size:11px;">Streak</span><br><strong>🔥 ${u.dailyChallengeStreak || 0} days</strong></div>
        </div>
      `;
    }

    function renderStats(u) {
      const el = document.getElementById('statsSection');
      const saved = u.savedProtocols?.length || 0;
      const cards = u.savedCards?.length || 0;
      const blogs = u.savedBlogs?.length || 0;
      const podcasts = u.savedPodcasts?.length || 0;
      el.innerHTML = `
        <div class="stat-card"><div class="number">${saved}</div><div class="label">Protocols</div></div>
        <div class="stat-card"><div class="number">${cards}</div><div class="label">Snapshot Cards</div></div>
        <div class="stat-card"><div class="number">${blogs + podcasts}</div><div class="label">Saved Content</div></div>
        <div class="stat-card"><div class="number">${u.totalReferrals || 0}</div><div class="label">Referrals</div></div>
      `;
      // Inject minimal stat-card style if not present
    }

    function renderAIWidget(u) {
      const el = document.getElementById('aiWidget');
      const usage = u.aiUsage || { total: 0 };
      const limit = u.tier === 'pro' ? 50 : 5;
      const pct = Math.min((usage.total / limit) * 100, 100);
      el.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h3 style="font-family:'Space Mono',monospace;color:var(--green);font-size:16px;"><i class="fas fa-robot"></i> AI Workbench</h3>
          <span style="font-size:11px;color:var(--text-muted);">${u.tier === 'pro' ? '∞' : `${usage.total}/${limit}`} used</span>
        </div>
        <div style="height:4px;background:var(--border);border-radius:4px;overflow:hidden;margin:8px 0;">
          <div style="height:100%;width:${pct}%;background:var(--green);border-radius:4px;transition:width 0.5s;"></div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;">
          <div><span style="color:var(--text-muted);font-size:11px;">Prompt</span><br><strong>${usage.prompt || 0}</strong></div>
          <div><span style="color:var(--text-muted);font-size:11px;">Snapshot</span><br><strong>${usage.snapshot || 0}</strong></div>
          <div><span style="color:var(--text-muted);font-size:11px;">Ideas</span><br><strong>${usage.ideas || 0}</strong></div>
          <div><span style="color:var(--text-muted);font-size:11px;">Critique</span><br><strong>${usage.critique || 0}</strong></div>
        </div>
      `;
    }

    function renderJourney(u) {
      const el = document.getElementById('journeyBlock');
      const nodes = u.completedNodes?.length || 0;
      const total = u.totalNodes || 10; // placeholder
      const pct = total > 0 ? (nodes / total) * 100 : 0;
      const badges = u.badgesEarned || [];
      el.innerHTML = `
        <h4 style="font-family:'Space Mono',monospace;color:var(--green);margin-bottom:8px;">📍 Journey Progress</h4>
        <div><strong>${nodes}</strong> / ${total} nodes completed</div>
        <div style="height:4px;background:var(--border);border-radius:4px;overflow:hidden;margin:8px 0;">
          <div style="height:100%;width:${pct}%;background:var(--green);border-radius:4px;transition:width 0.5s;"></div>
        </div>
        <div style="font-size:12px;color:var(--text-muted);">Badges: ${badges.length > 0 ? badges.join(', ') : 'None yet'}</div>
      `;
    }

    function renderChallenge(u) {
      const el = document.getElementById('challengeBlock');
      const dayOfYear = Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
      const challenge = CHALLENGES[dayOfYear % CHALLENGES.length];
      const completed = u.dailyChallengesCompleted || [];
      const today = new Date().toISOString().split('T')[0];
      const done = completed.includes(today);

      el.innerHTML = `
        <h4 style="font-family:'Space Mono',monospace;color:var(--green);margin-bottom:8px;">⚡ Daily Challenge</h4>
        <div style="font-weight:600;">${challenge.title}</div>
        <div style="font-size:13px;color:var(--text-muted);margin:4px 0 8px;">${challenge.description}</div>
        <button class="btn-primary" style="padding:6px 16px;font-size:12px;" id="doChallenge" ${done ? 'disabled style="opacity:0.5;"' : ''}>
          ${done ? '✅ Completed' : 'Start Challenge'}
        </button>
        <div style="margin-top:8px;font-size:12px;color:var(--text-muted);">Streak: 🔥 ${u.dailyChallengeStreak || 0} days</div>
      `;

      document.getElementById('doChallenge')?.addEventListener('click', async () => {
        if (done) return;
        try {
          const basePoints = 10;
          const streak = u.dailyChallengeStreak || 0;
          const multiplier = streak >= 7 ? 3 : streak >= 5 ? 2 : streak >= 3 ? 1.5 : 1;
          const totalPts = Math.round(basePoints * multiplier);
          const bonus = totalPts - basePoints;

          const todayStr = new Date().toISOString().split('T')[0];
          const update = {
            totalPoints: firebase.firestore.FieldValue.increment(totalPts),
            dailyChallengesCompleted: firebase.firestore.FieldValue.arrayUnion(todayStr),
            lastChallengeDate: new Date()
          };
          // Streak logic
          const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
          const lastDate = u.lastChallengeDate?.toDate?.() || null;
          if (lastDate && lastDate.toDateString() === yesterday.toDateString()) {
            update.dailyChallengeStreak = firebase.firestore.FieldValue.increment(1);
          } else {
            update.dailyChallengeStreak = 1;
          }

          await db.collection('users').doc(u.uid).update(update);
          cdToast(`+${totalPts} points! ${bonus > 0 ? `(🔥 ${multiplier}x bonus)` : ''}`);
          triggerConfetti();
          setTimeout(() => window.location.reload(), 1500);
        } catch (err) {
          cdToast(err.message, 'error');
        }
      });
    }

    function renderProtocols(u) {
      const el = document.getElementById('protocolsSection');
      const saved = u.savedProtocols || [];
      const filtered = PROTOCOL_LIBRARY.filter(p => saved.includes(p.id));
      el.innerHTML = `
        <h4 style="font-family:'Space Mono',monospace;color:var(--green);margin-bottom:12px;">📚 My Protocols</h4>
        ${filtered.length === 0 ? '<p style="color:var(--text-muted);">No saved protocols yet.</p>' :
          filtered.map(p => `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);">
            <span>${p.title}</span>
            <span style="color:var(--text-muted);font-size:12px;">${p.genre}</span>
          </div>`).join('')
        }
      `;
    }

    function renderReferral(u) {
      const el = document.getElementById('referralSection');
      el.innerHTML = `
        <h4 style="font-family:'Space Mono',monospace;color:var(--green);margin-bottom:8px;">📡 Referral Signal</h4>
        <div style="display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;">
          <div>
            <div style="font-size:12px;color:var(--text-muted);">Your Link</div>
            <code style="background:#0A0A0A;padding:4px 8px;border-radius:4px;border:1px solid var(--border);">camerasdecoded.com/ref/${u.referralCode || '—'}</code>
          </div>
          <div style="display:flex;gap:24px;">
            <div><span style="color:var(--text-muted);font-size:11px;">Referrals</span><br><strong>${u.totalReferrals || 0}</strong></div>
            <div><span style="color:var(--text-muted);font-size:11px;">Commission</span><br><strong>$${u.totalCommissionEarned?.toFixed(2) || '0.00'}</strong></div>
            <div><span style="color:var(--text-muted);font-size:11px;">Tier</span><br><strong>${u.ambassadorTier || 'signal'}</strong></div>
          </div>
        </div>
      `;
    }

    // ----- Auth Listener (with race condition fix) -----
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      const targetUid = uid || user.uid;
      if (user.uid !== targetUid) {
        // If uid param mismatches, use the logged-in user
        loadDashboard(user.uid);
      } else {
        loadDashboard(targetUid);
      }
    });

    // If no auth state triggers (e.g., page refresh), force check
    if (!auth.currentUser && !uid) {
      // redirect
      window.location.href = 'login.html';
    } else if (auth.currentUser) {
      // Already loaded via listener, but just in case
    }
  </script>
</body>
</html>
