<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operator Dashboard — Cameras Decoded</title>
  <meta name="description" content="Your personal command center." />

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --green: #8deb00;
      --green-glow: rgba(141,235,0,0.15);
      --text-muted: #b4b4b4;
      --bg-panel: #0A0A0A;
      --border-dim: #1A1A1A;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 240px;
      background: rgba(0,0,0,0.95);
      padding: 24px;
      border-right: 1px solid var(--border-dim);
      height: 100vh;
      position: sticky;
      top: 0;
      flex-shrink: 0;
      z-index: 2;
    }
    .sidebar .logo img { height: 100px; }
    .sidebar .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0;
      color: var(--text-muted);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      border-bottom: 1px solid transparent;
      transition: 0.2s;
    }
    .sidebar .nav-item i { width: 20px; text-align: center; }
    .sidebar .nav-item:hover { color: var(--green); border-bottom: 1px solid var(--green); }
    .sidebar .nav-item.active { color: var(--green); }
    .sidebar-divider { border-top: 1px solid var(--border-dim); margin: 8px 0; }

    .main-content {
      flex: 1;
      padding: 80px 40px 40px;
      max-width: 1100px;
    }

    .floating-header {
      position: fixed;
      top: 12px; left: 240px; right: 0;
      z-index: 99;
      display: flex; align-items: center; gap: 20px;
      padding: 10px 24px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(141,235,0,0.2);
      border-radius: 30px;
      margin: 0 12px;
    }
    .floating-header a { color: var(--green); }
    .floating-header .logout-btn {
      background: transparent;
      border: 1px solid var(--green);
      color: var(--green);
      padding: 4px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
    }

    .role-tier-badge {
      position: absolute;
      bottom: -24px;
      left: 16px;
      background: rgba(10,10,10,0.9);
      border: 1px solid rgba(141,235,0,0.3);
      border-radius: 14px;
      padding: 2px 10px;
      font-size: 10px;
      color: var(--green);
      display: none;
    }

    .dash-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-dim);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      text-decoration: none;
      color: inherit;
    }
    .stat-card .number { font-size: 30px; color: var(--green); font-weight: 700; }
    .stat-card .label { font-size: 12px; color: var(--text-muted); }

    .section-header h2 { color: var(--green); font-family: 'Space Mono', monospace; font-size: 18px; }

    .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .item-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-dim);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
    }
    .item-card .icon { color: var(--green); }

    .substack-teaser {
      background: var(--bg-panel);
      border: 1px solid var(--border-dim);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 30px;
    }

    .delete-link { color: #ff4a4a; font-size: 11px; text-align: left; margin-top: 20px; }

    @media (max-width: 1024px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: static; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 15px 20px; }
      .sidebar .logo img { height: 50px; }
      .sidebar .nav-group { display: none; }
      .sidebar .mobile-toggle { display: block !important; background: none; border: none; color: var(--green); font-size: 28px; }
      .main-content { padding: 100px 20px 20px; }
      .floating-header { left: 10px; right: 10px; top: 70px; padding: 8px 18px; }
      .dash-stats { grid-template-columns: 1fr 1fr; }
      .item-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="logo"><a href="https://camerasdecoded.com"><img src="cameras-decoded-logo.png" alt="Cameras Decoded"></a></div>
    <div class="nav-group" id="navGroup">
      <a href="index.html" class="nav-item"><i class="fas fa-home"></i> Home</a>
      <a href="operator-dashboard.html" class="nav-item active"><i class="fas fa-chart-simple"></i> Dashboard</a>
      <a href="https://settings.camerasdecoded.com" class="nav-item"><i class="fas fa-id-card"></i> Snapshot Cards</a>
      <a href="#" class="nav-item" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
    <button class="mobile-toggle" id="mobileToggle" aria-label="Menu">☰</button>
  </aside>

  <div class="floating-header" id="floatingHeader">
    <a href="index.html"><i class="fas fa-home"></i></a>
    <div id="roleTierBadge" class="role-tier-badge">Operator · Free</div>
    <button class="logout-btn" id="floatingLogoutBtn" style="display:none;" onclick="handleLogout()">Logout</button>
    <button class="mobile-toggle" id="floatingToggle" aria-label="Menu">☰</button>
  </div>

  <main class="main-content">
    <div class="dash-header">
      <h2 style="color:var(--green); font-family:'Space Mono',monospace;">Operator Dashboard</h2>
      <div class="greeting" id="greeting">Welcome back, Operator.</div>
    </div>

    <div class="dash-stats">
      <div class="stat-card"><div class="number" id="statProtocols">0</div><div class="label">Saved Protocols</div></div>
      <a href="#" id="statCardsLink" class="stat-card"><div class="number" id="statCards">0</div><div class="label">Snapshot Cards</div></a>
      <div class="stat-card"><div class="number" id="statOther">0</div><div class="label">Other Saved</div></div>
      <div class="stat-card"><div class="number" id="statCommunity">0</div><div class="label">Community Posts</div></div>
    </div>

    <div id="substackTeaser" class="substack-teaser" style="display:none;">
      <i class="fas fa-satellite-dish" style="color:var(--green)"></i> <span>Latest Transmission</span>
      <a id="substackLink" href="https://camerasdecoded.substack.com" target="_blank" style="color:#fff; text-decoration:none;">
        <h4 id="substackTitle">Loading…</h4>
        <p id="substackSnippet"></p>
      </a>
      <a href="dailyprotocols-op-dashboard.html" class="btn-sm">Get Daily Protocols</a>
    </div>

    <div class="section-header"><h2><i class="fas fa-id-card"></i> Snapshot Cards</h2></div>
    <div id="cardsList" class="item-grid"><div class="empty-state">No snapshot cards saved yet.</div></div>

    <div class="delete-link"><a href="#" id="deleteAccountLink" style="display:none;" onclick="handleDeleteAccount()">Delete account</a></div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB95Vx0i8W6WNfUy1N4TNQyfN5xCxQYnz8",
      authDomain: "cameras-decoded.firebaseapp.com",
      projectId: "cameras-decoded",
      storageBucket: "cameras-decoded.firebasestorage.app",
      messagingSenderId: "1088920052790",
      appId: "1:1088920052790:web:2177c1fb31109c1fa02497",
      measurementId: "G-YN3M01WW0B"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Mobile menu
    function toggleMenu() {
      const nav = document.getElementById('navGroup');
      nav.style.display = nav.style.display === 'flex' ? 'none' : 'flex';
    }
    document.getElementById('mobileToggle').addEventListener('click', toggleMenu);
    document.getElementById('floatingToggle').addEventListener('click', toggleMenu);

    window.handleLogout = function() {
      auth.signOut().then(() => {
        localStorage.removeItem('cameras_decoded_uid');
        window.location.href = 'login.html';
      });
    };

    window.handleDeleteAccount = function() {
      if (confirm('Delete your account and all data?')) {
        const user = auth.currentUser;
        if (!user) return;
        db.collection('users').doc(user.uid).delete()
          .then(() => user.delete())
          .then(() => {
            localStorage.clear();
            window.location.href = 'index.html';
          })
          .catch(err => alert('Delete error: ' + err.message));
      }
    };

    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      const uid = user.uid;
      localStorage.setItem('cameras_decoded_uid', uid);
      document.getElementById('statCardsLink').href = `https://settings.camerasdecoded.com/collection.html?opToken=${uid}`;
      document.getElementById('floatingLogoutBtn').style.display = 'inline-block';
      document.getElementById('deleteAccountLink').style.display = 'inline-block';
      document.getElementById('roleTierBadge').style.display = 'block';

      db.collection('users').doc(uid).onSnapshot(doc => {
        if (doc.exists) {
          const data = doc.data();
          const savedCards = data.savedCards || [];
          document.getElementById('statCards').textContent = savedCards.length;
          // Render cards
          const cardsList = document.getElementById('cardsList');
          if (savedCards.length === 0) {
            cardsList.innerHTML = '<div class="empty-state">No snapshot cards saved yet.</div>';
          } else {
            cardsList.innerHTML = savedCards.map(slug => `
              <a href="https://settings.camerasdecoded.com/collection.html?opToken=${uid}" class="item-card">
                <span class="icon">→</span>
                <div class="info">
                  <div class="title">${slug.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</div>
                </div>
              </a>
            `).join('');
          }
          // Update role badge
          const role = data.role || 'Operator';
          document.getElementById('roleTierBadge').innerHTML = `${role} · Free`;
        }
      });
    });

    // Substack teaser (simplified)
    fetch('https://api.rss2json.com/v1/api.json?rss_url=https://camerasdecoded.substack.com/feed')
      .then(res => res.json())
      .then(data => {
        if (data.items && data.items.length > 0) {
          const latest = data.items[0];
          document.getElementById('substackTitle').textContent = latest.title;
          document.getElementById('substackSnippet').textContent = latest.description.replace(/<[^>]*>/g, '').substring(0, 120);
          document.getElementById('substackLink').href = latest.link;
          document.getElementById('substackTeaser').style.display = 'block';
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
