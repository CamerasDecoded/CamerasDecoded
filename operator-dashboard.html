<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operator Dashboard — Cameras Decoded</title>
  <meta name="description" content="Your personal command center. Saved items appear here automatically." />

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    /* ===== ALL STYLES – same as before ===== */
    :root {
      --space-sm: 16px; --space-md: 32px; --space-lg: 64px; --space-xl: 96px; --space-xxl: 140px;
      --green: #8deb00; --green-dim: rgba(141,235,0,0.12); --green-glow: rgba(141,235,0,0.15);
      --text-muted: #b4b4b4; --bg-panel: #0A0A0A; --border-dim: #1A1A1A; --gold: #e0b12d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050705;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(141, 235, 0, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(141, 235, 0, 0.08) 0%, transparent 45%),
        linear-gradient(rgba(141, 235, 0, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(141, 235, 0, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px, 24px 24px;
      background-attachment: fixed;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    h1,h2,h3,.mono { font-family: 'Space Mono', monospace; }
    a { text-decoration: none; color: inherit; transition: 0.2s; }

    .sidebar {
      width: 240px;
      background: rgba(0,0,0,0.95);
      padding: 24px;
      border-right: 1px solid var(--border-dim);
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 100;
      flex-shrink: 0;
    }
    .sidebar .logo img { height: 120px; width: auto; }
    .sidebar .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 12px 0;
      color: var(--text-muted); font-family: 'Space Mono', monospace; font-size: 13px;
      border-bottom: 1px solid transparent; transition: all 0.2s;
    }
    .sidebar .nav-item i { width: 20px; text-align: center; }
    .sidebar .nav-item:hover { color: var(--green); border-bottom: 1px solid var(--green); }
    .sidebar .nav-item.active { color: var(--green); }
    .sidebar-divider { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 8px 0; }

    .header-login-btn {
      display: block; color: var(--green); font-family: 'Space Mono', monospace; font-size: 12px;
      border: 1px solid var(--green); padding: 0 10px; border-radius: 20px; background: transparent;
      text-align: center; width: fit-content; margin: 5px 0; text-decoration: none;
    }

    .main-content {
      margin-left: 240px;
      padding: 80px 40px 40px;
      max-width: calc(1200px + 240px);
      position: relative;
      z-index: 2;
      animation: fadeIn 0.5s ease-in-out forwards;
    }
    @keyframes fadeIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }

    .floating-header {
      position: fixed;
      top: 12px;
      left: 252px;
      right: 12px;
      z-index: 99;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 10px 24px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(141,235,0,0.2);
      border-radius: 30px;
      margin: 0;
    }
    .floating-header a { color: var(--green); }
    .floating-header .logout-btn {
      background: transparent; border: 1px solid var(--green); color: var(--green);
      padding: 4px 12px; border-radius: 20px; cursor: pointer; font-family: 'Space Mono', monospace; font-size: 12px; margin-left: 12px;
    }
    .floating-toggle { display: none; background: none; border: none; color: var(--green); font-size: 24px; cursor: pointer; }

    .role-tier-badge {
      position: absolute; bottom: -24px; left: 16px; background: rgba(10,10,10,0.9);
      border: 1px solid rgba(141,235,0,0.3); border-radius: 14px; padding: 2px 10px;
      font-size: 10px; color: var(--green); display: none;
    }
    .glow-role { font-weight: 700; text-shadow: 0 0 8px #8deb00, 0 0 12px #8deb00; }
    .tier-text { opacity: 0.8; }

    .dash-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border-dim); padding-bottom: 16px; }
    .dash-title-img { max-height: 50px; }
    .greeting { color: var(--text-muted); font-size: 14px; }
    .subscription-badge { background: var(--green-dim); border: 1px solid rgba(141,235,0,0.2); border-radius: 20px; padding: 2px 14px; font-size: 11px; color: var(--green); }

    /* ===== DASHBOARD STAT CARDS ===== */
    .dash-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }
    .stat-card {
      position: relative;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      border: 1px solid var(--border-dim);
      min-height: 120px;
      overflow: hidden;
      isolation: isolate;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 10, 0.82);
      z-index: 0;
      border-radius: 8px;
      transition: background 0.3s ease;
    }
    .stat-card .number,
    .stat-card .label,
    .stat-card * { position: relative; z-index: 1; }
    .stat-card:hover {
      border-color: var(--green);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .stat-card:hover::before { background: rgba(10, 10, 10, 0.75); }
    .stat-card .number {
      font-size: 30px;
      font-weight: 700;
      color: var(--green);
      text-shadow: 0 0 20px rgba(141, 235, 0, 0.15);
    }
    .stat-card .label {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ===== AI WORKBENCH WIDGET ===== */
    .ai-widget {
      background: rgba(10, 10, 10, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 18px 24px;
      margin-bottom: 24px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .ai-widget:hover {
      border-color: rgba(141,235,0,0.3);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .ai-widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .ai-widget-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ai-widget-title h3 {
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      color: #ffffff;
      margin: 0;
    }
    .ai-widget-title i { color: var(--green); font-size: 20px; }
    .ai-widget-badge {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      background: var(--green-dim);
      color: var(--green);
      padding: 2px 12px;
      border-radius: 30px;
      border: 1px solid rgba(141,235,0,0.15);
    }
    .ai-usage-text {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 4px;
    }
    .ai-usage-text strong { color: var(--green); }
    .ai-usage-percent { font-family: 'Space Mono', monospace; font-size: 11px; }
    .ai-usage-bar {
      width: 100%;
      height: 4px;
      background: var(--border-dim);
      border-radius: 4px;
      overflow: hidden;
    }
    .ai-usage-fill {
      height: 100%;
      background: linear-gradient(90deg, #1db31b 0%, #c9e265 100%);
      border-radius: 4px;
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      width: 0%;
    }
    .ai-widget-tools {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 14px 0 12px;
    }
    .ai-tool-btn {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s ease;
      border: 1px solid var(--border-dim);
    }
    .ai-tool-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.75) 100%);
      z-index: 1;
      transition: background 0.3s ease;
    }
    .ai-tool-btn:hover::before {
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%);
    }
    .ai-tool-btn:hover {
      transform: translateY(-2px);
      border-color: var(--green);
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .ai-tool-overlay {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      padding: 8px 4px;
      width: 100%;
      height: 100%;
      text-align: center;
    }
    .ai-tool-overlay i {
      font-size: 20px;
      color: var(--green);
      margin-bottom: 2px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    }
    .ai-tool-overlay .ai-tool-count {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--green);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(2px);
      padding: 0 6px;
      border-radius: 12px;
      border: 1px solid rgba(141,235,0,0.15);
      margin-top: 2px;
    }
    .ai-tool-btn.all-tools {
      background: rgba(255,255,255,0.03) !important;
      border-color: var(--green);
      min-height: 80px;
    }
    .ai-tool-btn.all-tools .ai-tool-overlay i { font-size: 22px; }
    .ai-tool-btn.all-tools:hover {
      background: rgba(141,235,0,0.08) !important;
      border-color: var(--green);
    }
    .ai-widget-footer {
      display: flex;
      justify-content: flex-end;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 10px;
    }
    .ai-widget-link {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--green);
      text-decoration: none;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .ai-widget-link:hover { color: #a0f520; gap: 10px; }

    /* ===== SIGNAL FEED ===== */
    #dashboard-feed {
      display: none;
      margin-top: 40px;
      margin-bottom: 24px;
    }
    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-dim);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .feed-header h2 {
      color: var(--green);
      font-family: 'Space Mono', monospace;
      font-size: 20px;
      margin: 0;
    }
    .feed-header .feed-sub {
      color: #666;
      font-size: 12px;
      font-family: 'Space Mono', monospace;
    }
    .feed-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .feed-card {
      background: #0A0A0A;
      border: 1px solid var(--border-dim);
      border-radius: 10px;
      padding: 18px 20px;
      transition: all 0.3s ease;
    }
    .feed-card:hover {
      border-color: var(--green);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(141, 235, 0, 0.08);
    }
    .feed-card .feed-badge {
      font-size: 10px;
      font-family: 'Space Mono', monospace;
      color: var(--green);
      background: rgba(141, 235, 0, 0.08);
      padding: 2px 10px;
      border-radius: 12px;
      border: 1px solid rgba(141, 235, 0, 0.15);
      display: inline-block;
    }
    .feed-card .feed-match {
      font-size: 10px;
      color: #444;
      font-family: 'Space Mono', monospace;
      float: right;
    }
    .feed-card h4 {
      color: #fff;
      font-family: 'Space Mono', monospace;
      font-size: 15px;
      margin: 8px 0 4px 0;
      line-height: 1.3;
    }
    .feed-card p {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .feed-card .feed-price {
      color: var(--gold);
      font-weight: bold;
      font-size: 14px;
    }
    .feed-card .feed-number {
      color: #666;
      font-size: 12px;
      font-family: 'Space Mono', monospace;
    }

    /* ===== RECOMMENDED FOR YOU (POLISHED) ===== */
    .recommended-row {
      margin: 40px 0 20px;
    }
    .recommended-row .row-title {
      font-family: 'Space Mono', monospace;
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .recommended-row .row-title i {
      color: var(--green);
    }
    .recommended-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .rec-card-polished {
      background: #0A0A0A;
      border: 1px solid var(--border-dim);
      border-radius: 10px;
      padding: 16px 18px;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .rec-card-polished::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .rec-card-polished:hover {
      border-color: var(--green);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(141, 235, 0, 0.06);
    }
    .rec-card-polished:hover::before {
      opacity: 1;
    }
    .rec-card-polished .rec-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .rec-card-polished .rec-genre {
      font-size: 10px;
      font-family: 'Space Mono', monospace;
      color: var(--green);
      background: rgba(141, 235, 0, 0.06);
      padding: 2px 10px;
      border-radius: 12px;
      border: 1px solid rgba(141, 235, 0, 0.08);
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .rec-card-polished .rec-score {
      font-size: 10px;
      color: #555;
      font-family: 'Space Mono', monospace;
      background: rgba(255,255,255,0.03);
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .rec-card-polished .rec-title {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
      line-height: 1.3;
      font-family: 'Montserrat', sans-serif;
    }
    .rec-card-polished .rec-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .rec-card-polished .rec-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.04);
      padding-top: 10px;
      margin-top: 4px;
    }
    .rec-card-polished .rec-action {
      font-size: 11px;
      color: var(--green);
      font-family: 'Space Mono', monospace;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: gap 0.2s ease;
    }
    .rec-card-polished .rec-action:hover {
      gap: 8px;
    }
    .rec-card-polished .rec-price {
      color: var(--gold);
      font-weight: 700;
      font-size: 14px;
      font-family: 'Space Mono', monospace;
    }
    .rec-card-polished .rec-number {
      color: #555;
      font-size: 11px;
      font-family: 'Space Mono', monospace;
    }

    /* ===== SUBSTACK TEASER ===== */
    .substack-teaser {
      position: relative;
      background-image: url('images/substack-banner.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 10px;
      padding: 18px 22px;
      margin-bottom: 24px;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid var(--border-dim);
      transition: border-color 0.2s;
    }
    .substack-teaser::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 10, 0.82);
      z-index: 0;
      border-radius: 10px;
    }
    .substack-teaser:hover { border-color: var(--green); }
    .substack-teaser:hover::before { background: rgba(10, 10, 10, 0.75); }
    .substack-teaser * { position: relative; z-index: 1; }
    .teaser-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }

    /* ===== REFERRAL SECTION ===== */
    .referral-section {
      position: relative;
      background-image: url('images/referral-banner.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 30px;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid var(--border-dim);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .referral-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 10, 0.85);
      z-index: 0;
      border-radius: 10px;
    }
    .referral-section:hover {
      border-color: var(--green);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .referral-section:hover::before { background: rgba(10, 10, 10, 0.78); }
    .referral-section .row,
    .referral-section .tier-info,
    .referral-section .link-area,
    .referral-section .stats,
    .referral-section * { position: relative; z-index: 1; }
    .referral-section .row { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between; }
    .referral-section .link-area { flex: 1; min-width: 200px; }
    .referral-section .link-area .label { font-size: 12px; color: #666; font-family: 'Space Mono', monospace; text-transform: uppercase; }
    .referral-section .link-area .link { font-family: 'Space Mono', monospace; color: var(--green); word-break: break-all; }
    .referral-section .stats { display: flex; gap: 30px; flex-wrap: wrap; }
    .referral-section .stat .num { font-size: 28px; font-weight: 700; color: var(--green); }
    .referral-section .stat .lbl { font-size: 12px; color: #666; }
    .tier-info { margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 12px; display: flex; align-items: center; justify-content: space-between; }
    .tier-badge { font-family: 'Space Mono', monospace; font-size: 14px; color: var(--green); background: var(--green-dim); padding: 4px 14px; border-radius: 20px; border: 1px solid rgba(141,235,0,0.2); }
    .progress-wrap { flex: 1; margin-left: 20px; }
    .bar { height: 4px; background: var(--border-dim); border-radius: 2px; overflow: hidden; }
    .bar .fill { height: 100%; background: var(--green); transition: width 0.6s ease; }

    /* ===== COMMISSION SECTION ===== */
    .commission-section {
      position: relative;
      background-image: url('images/commission-bg.jpg');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 30px;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid var(--border-dim);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .commission-section:hover {
      border-color: var(--green);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .commission-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 10, 0.78);
      z-index: 0;
      border-radius: 10px;
    }
    .commission-section:hover::before { background: rgba(10, 10, 10, 0.70); }
    .commission-section .header,
    .commission-section .commission-list,
    .commission-section .btn-group,
    .commission-section * { position: relative; z-index: 1; }

    .commission-total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 12px;

    @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

    .chasing-border { position: relative; border-color: transparent !important; background-clip: padding-box; }
    .chasing-border::before {
      content: ''; position: absolute; inset: -1px; border-radius: inherit; padding: 1px;
      background: conic-gradient(from var(--angle), #8deb00, #00e5ff, #a0f520, #8deb00);
      -webkit-mask: linear-gradient(black, black) content-box, linear-gradient(black, black) border-box;
      -webkit-mask-composite: xor;
      mask: linear-gradient(black, black) content-box, linear-gradient(black, black) border-box;
      mask-composite: exclude;
      animation: spinBorder 4s linear infinite;
      pointer-events: none; z-index: 0; will-change: transform;
    }
