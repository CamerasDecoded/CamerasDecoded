<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Arena — Cameras Decoded</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --green: #8deb00;
      --green-dim: rgba(141,235,0,0.12);
      --text-muted: #b4b4b4;
      --bg-panel: #0A0A0A;
      --border-dim: #1A1A1A;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    /* Particle canvas */
    #particles {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.5;
    }
    /* Subtle radial gradient overlay */
    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: radial-gradient(circle at 20% 30%, rgba(141,235,0,0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    .quiz-container {
      max-width: 820px;
      width: 100%;
      background: rgba(10,10,10,0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-dim);
      border-radius: 20px;
      padding: 30px 32px 40px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.9);
      position: relative;
      z-index: 2;
      transition: border-color 0.3s;
    }
    .quiz-container:hover { border-color: rgba(141,235,0,0.2); }

    /* ----- HEADER ----- */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .quiz-header h1 {
      font-family: 'Space Mono', monospace;
      font-size: 20px;
      color: var(--green);
      letter-spacing: 1px;
    }
    .quiz-header .back-link {
      color: var(--text-muted);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      text-decoration: none;
      transition: 0.2s;
    }
    .quiz-header .back-link:hover { color: var(--green); }
    .quiz-header .back-link i { margin-right: 6px; }

    /* ----- SIGNAL METER ----- */
    .signal-meter {
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 18px;
      border: 1px solid var(--border-dim);
    }
    .signal-meter .top-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .signal-meter .label {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--green);
      letter-spacing: 1px;
      min-width: 60px;
    }
    .signal-meter .bar {
      flex: 1;
      height: 4px;
      background: var(--border-dim);
      border-radius: 2px;
      overflow: hidden;
    }
    .signal-meter .bar .fill {
      height: 100%;
      width: 0%;
      background: var(--green);
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .signal-meter .percentage {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--green);
      min-width: 40px;
      text-align: right;
    }
    .signal-meter .step-label {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      display: block;
    }

    /* ----- STEP WAVE (progress dots) ----- */
    .step-wave {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 16px 0 20px;
    }
    .wave-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border-dim);
      transition: 0.3s;
      cursor: default;
    }
    .wave-dot.active { background: var(--green); box-shadow: 0 0 12px var(--green); }
    .wave-dot.completed { background: var(--green); opacity: 0.4; }

    /* ----- DIFFICULTY SELECTOR ----- */
    .difficulty-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .diff-btn {
      padding: 6px 18px;
      border: 1px solid var(--border-dim);
      border-radius: 20px;
      background: transparent;
      color: var(--text-muted);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }
    .diff-btn:hover { border-color: var(--green); color: var(--green); }
    .diff-btn.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }

    /* ----- QUESTION AREA ----- */
    .question-text {
      font-family: 'Space Mono', monospace;
      font-size: 20px;
      font-weight: 400;
      margin: 16px 0 24px;
      line-height: 1.5;
      min-height: 60px;
      animation: slideUp 0.4s ease;
    }
    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .answers-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .answer-btn {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border-dim);
      border-radius: 10px;
      padding: 14px 20px;
      color: #fff;
      font-size: 15px;
      font-family: 'Montserrat', sans-serif;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .answer-btn:hover:not(:disabled) {
      border-color: var(--green);
      background: rgba(141,235,0,0.05);
      transform: translateX(4px);
    }
    .answer-btn .letter {
      display: inline-block;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      text-align: center;
      line-height: 30px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .answer-btn.correct { border-color: var(--green) !important; background: rgba(141,235,0,0.12) !important; }
    .answer-btn.correct .letter { background: var(--green); color: #000; }
    .answer-btn.wrong { border-color: #ff4a4a !important; background: rgba(255,74,74,0.12) !important; }
    .answer-btn.wrong .letter { background: #ff4a4a; color: #000; }
    .answer-btn:disabled { opacity: 0.6; cursor: default; transform: none !important; }

    /* ----- FEEDBACK BOX ----- */
    .feedback-box {
      margin-top: 20px;
      padding: 16px 20px;
      border-radius: 8px;
      background: rgba(255,255,255,0.02);
      border-left: 4px solid var(--green);
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .feedback-box .fb-title { font-weight: 700; font-size: 15px; }
    .feedback-box .fb-explain { font-size: 14px; color: var(--text-muted); margin-top: 6px; }

    .next-btn {
      margin-top: 24px;
      padding: 12px 0;
      width: 100%;
      background: transparent;
      border: 1px solid var(--green);
      border-radius: 8px;
      color: var(--green);
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      display: none;
      text-align: center;
    }
    .next-btn:hover { background: rgba(141,235,0,0.1); box-shadow: 0 0 20px rgba(141,235,0,0.15); }

    /* ----- RESULTS ----- */
    .results-box {
      text-align: center;
      padding: 20px 0;
      display: none;
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .results-box .emoji { font-size: 56px; margin-bottom: 10px; display: block; }
    .results-box h2 { font-family: 'Space Mono', monospace; color: var(--green); font-size: 24px; }
    .results-box .sub { color: var(--text-muted); font-size: 16px; margin: 8px 0; }
    .results-box .score-highlight { font-size: 32px; font-weight: 700; color: #fff; }
    .retake-btn, .reset-diff-btn {
      margin-top: 16px;
      padding: 10px 30px;
      background: transparent;
      border: 1px solid var(--green);
      border-radius: 8px;
      color: var(--green);
      font-family: 'Space Mono', monospace;
      cursor: pointer;
      transition: 0.2s;
    }
    .retake-btn:hover, .reset-diff-btn:hover { background: rgba(141,235,0,0.1); }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 600px) {
      .quiz-container { padding: 20px 16px; }
      .question-text { font-size: 17px; }
      .answer-btn { font-size: 14px; padding: 12px 14px; }
      .quiz-header h1 { font-size: 16px; }
    }
  </style>
</head>
<body>

  <!-- PARTICLE CANVAS -->
  <canvas id="particles"></canvas>

  <div class="quiz-container">
    <!-- HEADER -->
    <div class="quiz-header">
      <h1><i class="fas fa-brain" style="margin-right:8px;"></i> Quiz Arena</h1>

    </div>

    <!-- STEP WAVE -->
    <div class="step-wave" id="stepWave">
      <span class="wave-dot active" data-step="0"></span>
      <span class="wave-dot" data-step="1"></span>
      <span class="wave-dot" data-step="2"></span>
      <span class="wave-dot" data-step="3"></span>

    <!-- DIFFICULTY SELECTOR -->
    <div class="difficulty-selector" id="diffSelector">
      <button class="diff-btn active" data-level="beginner">🌱 Beginner</button>
      <button class="diff-btn" data-level="intermediate">⚡ Intermediate</button>
      <button class="diff-btn" data-level="advanced">🚀 Advanced</button>

    <!-- QUIZ UI -->
    <div id="quizUI">

        <div class="sub">You scored</div>
        <div class="score-highlight"><span id="finalScore">0</span> / <span id="totalQ">0</span></div>
        <div class="sub" id="resultMsg" style="color:var(--green); font-family:'Space Mono',monospace; margin-top:10px;">Keep decoding!</div>
        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
          <button class="retake-btn" onclick="resetQuiz()"><i class="fas fa-redo"></i> Retake</button>
          <button class="reset-diff-btn" onclick="resetDifficulty()"><i class="fas fa-arrow-left"></i> Change Difficulty</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <script>
    // ============================================================
    // 0.  FIREBASE INIT
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyB95Vx0i8W6WNfUy1N4TNQyfN5xCxQYnz8",
      authDomain: "cameras-decoded.firebaseapp.com",

    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ============================================================
    // 1.  PARTICLES BACKGROUND
    // ============================================================
    (function() {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      let w, h;
      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const particles = [];
      const count = 80;
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.6,
          vy: (Math.random() - 0.5) * 0.6,
          r: Math.random() * 2 + 1,
          alpha: Math.random() * 0.5 + 0.2
        });
      }

      function drawParticles() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > w) p.vx *= -1;
          if (p.y < 0 || p.y > h) p.vy *= -1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(141, 235, 0, ${p.alpha})`;
          ctx.fill();
        });
        // Draw lines between nearby particles
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(141, 235, 0, ${0.08 * (1 - dist/120)})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(drawParticles);
      }
      drawParticles();
    })();

    // ============================================================
    // 2.  QUIZ DATA
    // ============================================================
    const questionBank = {

      ],
      intermediate: [
        { q: "What is the 'exposure triangle' composed of?", a: ["ISO, Shutter Speed, Aperture", "ISO, Focal Length, Shutter Speed", "Aperture, White Balance, ISO", "Shutter Speed, Flash, Aperture"], c: 0, e: "The triangle consists of ISO, shutter speed, and aperture – balancing them determines exposure." },

        { q: "What is the benefit of shooting in RAW over JPEG?", a: ["Smaller size", "More dynamic range", "Sharper images", "Better out‑of‑camera colours"], c: 1, e: "RAW preserves much more highlight and shadow detail, giving you room to recover data in post‑processing." },
        { q: "Which lighting pattern creates a triangle of light on the shadow side of the face?", a: ["Rembrandt", "Split", "Butterfly", "Loop"], c: 0, e: "Rembrandt lighting is defined by that signature triangular highlight under the eye on the shadow side." },
        { q: "What does 'hyperfocal distance' mean?", a: ["Focus point that maximises depth of field", "The closest focus distance", "The focus distance for infinity", "A lens calibration method"], c: 0, e: "Hyperfocal distance is the focus point that keeps everything from half that distance to infinity acceptably sharp – ideal for landscapes." },

      advanced: [

        { q: "What is 'T‑stop' compared to f‑stop?", a: ["Same as f‑stop", "Measures actual light transmission", "A measure of sharpness", "Aperture in video"], c: 1, e: "T‑stops account for light loss within the lens; they are more accurate for exposure, especially in cinema." },
        { q: "What causes 'lens flare' and how can it be used creatively?", a: ["Internal reflections", "Chromatic aberration", "Vignetting", "Diffraction"], c: 0, e: "Flare occurs when light scatters inside the lens. It can add a dramatic, moody look if controlled." },
        { q: "What is 'ETTR' (Expose To The Right) and why use it?", a: ["Overexpose to capture shadows", "Push histogram to the right", "Always underexpose", "Use flash"], c: 1, e: "ETTR means slightly overexposing (without clipping highlights) to maximise signal‑to‑noise ratio in the shadows." },
        { q: "What is 'focus breathing'?", a: ["Lens changes focal length as it focuses", "Lens vibrates during AF", "Image stabilisation issues", "Depth of field shifts"], c: 0, e: "Focus breathing is a change in angle of view as focus is adjusted, common in many zoom lenses." },
        { q: "How does 'diffraction' affect image sharpness?", a: ["It increases sharpness", "It reduces sharpness at small apertures", "It causes colour shifts", "It doesn't affect sharpness"], c: 1, e: "At very small apertures (like f/16+), light bends around the aperture blades, reducing overall sharpness due to diffraction." },
        { q: "What is a 'colour checker' used for?", a: ["Colour calibration", "White balance only", "Checking RGB values", "Printer calibration"], c: 0, e: "A colour checker provides known colour patches to create a custom profile, ensuring accurate colour reproduction." },
        { q: "What is 'HDR' photography and when is it best used?", a: ["High Dynamic Range – merging exposures", "High Definition Resolution", "A type of filter", "A shooting mode"], c: 0, e: "HDR combines multiple exposures to capture a wider dynamic range, ideal for high‑contrast scenes like landscapes." },
        { q: "What is 'perspective distortion' and how can it be minimised?", a: ["Wide‑angle close‑up distortion", "Use a longer focal length", "Use a tilt‑shift lens", "All of the above"], c: 3, e: "All three methods reduce perspective distortion: longer lenses compress space, tilt‑shift corrects perspective, and backing up helps." },

    };

    // ============================================================
    // 3.  QUIZ ENGINE – WITH FIRESTORE SYNC
    // ============================================================
    let currentLevel = 'beginner';
    let questions = [];
    let currentQ = 0;
    let score = 0;
    let answered = false;
    let streak = 0;
    let currentUser = null;

    const letters = ['A', 'B', 'C', 'D'];
    const totalQuestionsPerLevel = 10;

    // DOM refs
    const qText = document.getElementById('qText');
    const answersContainer = document.getElementById('answersContainer');
    const feedbackBox = document.getElementById('feedbackBox');
    const fbTitle = document.getElementById('fbTitle');
    const fbExplain = document.getElementById('fbExplain');
    const nextBtn = document.getElementById('nextBtn');
    const resultsBox = document.getElementById('resultsBox');
    const finalScore = document.getElementById('finalScore');
    const totalQSpan = document.getElementById('totalQ');
    const resultMsg = document.getElementById('resultMsg');
    const resultEmoji = document.getElementById('resultEmoji');
    const signalFill = document.getElementById('signalFill');
    const signalPercent = document.getElementById('signalPercent');
    const stepLabel = document.getElementById('stepLabel');
    const waveDots = document.querySelectorAll('.wave-dot');
    const streakDisplay = document.querySelector('.streak-display');

    // ---- Load quiz data from Firestore ----
    async function loadQuizData() {
      const user = auth.currentUser;
      if (!user) return;
      currentUser = user;
      try {
        const doc = await db.collection('users').doc(user.uid).get();
        if (doc.exists) {
          const data = doc.data();
          if (data.quizStreak !== undefined) {
            streak = data.quizStreak || 0;
          } else {
            // Fallback to localStorage then default to 0
            streak = parseInt(localStorage.getItem('quizStreak') || '0');
          }
          // Update UI
          document.getElementById('streakNum2').textContent = streak;
          localStorage.setItem('quizStreak', streak.toString());
          // Last score
          if (data.quizLastScore) {
            const score = data.quizLastScore;
            const levelNames = { beginner:'🌱', intermediate:'⚡', advanced:'🚀' };
            const levelIcon = levelNames[score.level] || '';
            document.getElementById('lastScoreDisplay').textContent = `${levelIcon} ${score.score}/${score.total}`;
            localStorage.setItem('quizLastScore', JSON.stringify(score));
          }
        }
      } catch (err) {
        console.warn('Error loading quiz data:', err);
        streak = parseInt(localStorage.getItem('quizStreak') || '0');
        document.getElementById('streakNum2').textContent = streak;
      }
    }

    // ---- Save quiz data to Firestore ----
    async function saveQuizData(scoreData) {
      const user = auth.currentUser;
      if (!user) return;
      try {
        await db.collection('users').doc(user.uid).update({
          quizStreak: streak,
          quizLastScore: scoreData
        });
        // Also update localStorage for quick access
        localStorage.setItem('quizStreak', streak.toString());
        localStorage.setItem('quizLastScore', JSON.stringify(scoreData));
      } catch (err) {
        console.warn('Error saving quiz data:', err);
        // Fallback to localStorage only
        localStorage.setItem('quizStreak', streak.toString());
        localStorage.setItem('quizLastScore', JSON.stringify(scoreData));
      }
    }

    // ---- Difficulty buttons ----
    document.querySelectorAll('.diff-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentLevel = this.dataset.level;
        resetQuiz();
      });
    });

    function loadQuestions(level) {
      questions = questionBank[level] || questionBank.beginner;
      return questions;
    }

    function startQuiz() {
      const level = currentLevel;
      questions = loadQuestions(level);
      currentQ = 0;
      score = 0;
      answered = false;
      resultsBox.style.display = 'none';
      document.getElementById('questionArea').style.display = 'block';
      feedbackBox.style.display = 'none';
      nextBtn.style.display = 'none';
      updateWaveAndMeter(0);
      stepLabel.textContent = `⚡ ${level.charAt(0).toUpperCase()+level.slice(1)} · Question 1 of ${questions.length}`;
      renderQuestion();
    }

    function renderQuestion() {
      if (currentQ >= questions.length) {
        showResults();
        return;
      }
      const q = questions[currentQ];
      qText.textContent = q.q;
      answersContainer.innerHTML = '';
      q.a.forEach((ans, idx) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.innerHTML = `<span class="letter">${letters[idx]}</span> ${ans}`;
        btn.dataset.idx = idx;
        btn.addEventListener('click', () => handleAnswer(idx));
        answersContainer.appendChild(btn);
      });
      feedbackBox.style.display = 'none';
      nextBtn.style.display = 'none';
      answered = false;
      stepLabel.textContent = `⚡ ${currentLevel.charAt(0).toUpperCase()+currentLevel.slice(1)} · Question ${currentQ+1} of ${questions.length}`;
      updateWaveAndMeter(currentQ);
    }

    function handleAnswer(selected) {
      if (answered) return;
      answered = true;
      const q = questions[currentQ];
      const isCorrect = selected === q.c;
      if (isCorrect) { score++; streak++; } else { streak = 0; }
      // Update UI streak
      document.getElementById('streakNum2').textContent = streak;
      localStorage.setItem('quizStreak', streak.toString());

      const btns = document.querySelectorAll('.answer-btn');
      btns.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.c) btn.classList.add('correct');
        if (idx === selected && !isCorrect) btn.classList.add('wrong');
      });

      const progress = (score / questions.length) * 100;
      signalFill.style.width = progress + '%';
      signalPercent.textContent = Math.round(progress) + '%';

      feedbackBox.style.display = 'block';
      feedbackBox.style.borderLeftColor = isCorrect ? 'var(--green)' : '#ff4a4a';
      fbTitle.innerHTML = isCorrect ? '✅ Correct!' : '❌ Not quite.';
      fbTitle.style.color = isCorrect ? 'var(--green)' : '#ff4a4a';
      fbExplain.textContent = q.e;

      nextBtn.style.display = 'block';
      nextBtn.textContent = (currentQ === questions.length - 1) ? 'See Results 🏆' : 'Next Question →';
      waveDots.forEach((dot, i) => {
        if (i <= currentQ) dot.classList.add('completed');
        else dot.classList.remove('completed');
      });
      waveDots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentQ + 1);
      });
    }

    function nextQuestion() {
      currentQ++;
      renderQuestion();
    }

    async function showResults() {
      const scoreData = {
        score: score,
        total: questions.length,
        level: currentLevel
      };

      // Save to Firestore (syncs across devices)
      await saveQuizData(scoreData);

      document.getElementById('questionArea').style.display = 'none';
      feedbackBox.style.display = 'none';
      nextBtn.style.display = 'none';
      resultsBox.style.display = 'block';
      finalScore.textContent = score;
      totalQSpan.textContent = questions.length;

      let emoji, msg;
      if (score === questions.length) { emoji = '🌟'; msg = 'Perfect! You are a true Decoder Master!'; }
      else if (score >= questions.length - 1) { emoji = '🔥'; msg = 'Almost perfect! You\'re on fire!'; }
      else if (score >= Math.floor(questions.length * 0.6)) { emoji = '📡'; msg = 'Good job! Review the missed concepts to level up.'; }
      else { emoji = '📚'; msg = 'Keep studying the signal! Try again.'; }
      resultEmoji.textContent = emoji;
      resultMsg.textContent = msg;

      const finalPct = (score / questions.length) * 100;
      signalFill.style.width = finalPct + '%';
      signalPercent.textContent = Math.round(finalPct) + '%';
      stepLabel.textContent = '🎯 Quiz Complete!';
      waveDots.forEach(d => d.classList.add('completed'));

      // Update dashboard display (last score)
      const levelNames = { beginner:'🌱', intermediate:'⚡', advanced:'🚀' };
      const levelIcon = levelNames[currentLevel] || '';
      document.getElementById('lastScoreDisplay').textContent = `${levelIcon} ${score}/${questions.length}`;

      if (score === questions.length) launchConfetti();
    }

    function resetQuiz() {
      startQuiz();
    }

    function resetDifficulty() {
      resultsBox.style.display = 'none';
      document.getElementById('questionArea').style.display = 'block';
      qText.textContent = 'Select a difficulty to begin.';
      answersContainer.innerHTML = '';
      feedbackBox.style.display = 'none';
      nextBtn.style.display = 'none';
      signalFill.style.width = '0%';
      signalPercent.textContent = '0%';
      stepLabel.textContent = '⚡ Step 1: Choose difficulty';
      waveDots.forEach(d => { d.classList.remove('active', 'completed'); });
      waveDots[0].classList.add('active');
      finalScore.textContent = '0';
      totalQSpan.textContent = '0';
    }

    function updateWaveAndMeter(qIndex) {
      waveDots.forEach((dot, i) => {
        if (i < qIndex) dot.classList.add('completed');
        else dot.classList.remove('completed');
        dot.classList.toggle('active', i === qIndex);
      });
      const progress = qIndex / (questions.length || 1) * 100;
      signalFill.style.width = progress + '%';
      signalPercent.textContent = Math.round(progress) + '%';
    }

    // ---- Confetti ----
    function launchConfetti() {
      const colors = ['#8deb00', '#00e5ff', '#ffdd00', '#ff4a4a', '#a0f520'];
      for (let i = 0; i < 60; i++) {
        const el = document.createElement('div');
        el.style.cssText = `
          position: fixed;
          width: ${Math.random()*8+4}px;
          height: ${Math.random()*8+4}px;
          background: ${colors[Math.floor(Math.random()*colors.length)]};
          left: ${Math.random()*100}vw;
          top: -10px;
          border-radius: ${Math.random()>0.5 ? '50%' : '2px'};
          pointer-events: none;
          z-index: 9999;
          transform: rotate(${Math.random()*360}deg);
          animation: confettiFall ${Math.random()*2+2}s linear forwards;
          animation-delay: ${Math.random()*0.5}s;
        `;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 4000);
      }
      if (!document.getElementById('confettiStyle')) {
        const style = document.createElement('style');
        style.id = 'confettiStyle';
        style.textContent = `
          @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg) scale(0.2); opacity: 0; }
          }
        `;
        document.head.appendChild(style);
      }
    }

    // ============================================================
    // 4.  INIT – load data then start
    // ============================================================
    document.addEventListener('DOMContentLoaded', async function() {
      // Wait for auth to be ready
      if (auth.currentUser) {
        await loadQuizData();
      } else {
        // Listen for auth
        auth.onAuthStateChanged(async (user) => {
          if (user) {
            currentUser = user;
            await loadQuizData();
          }
        });
      }

      const params = new URLSearchParams(window.location.search);
      const levelParam = params.get('level');
      if (levelParam && ['beginner','intermediate','advanced'].includes(levelParam)) {
        currentLevel = levelParam;
        document.querySelectorAll('.diff-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.level === levelParam);
        });
        startQuiz();
      } else {
        resetDifficulty();
      }
    });

    // ---- Auth listener for real-time updates ----
    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        // If quiz hasn't started yet, load data
        if (document.querySelector('.diff-btn.active')) {
          loadQuizData();
        }
      }
    });
  </script>
</body>
</html>
