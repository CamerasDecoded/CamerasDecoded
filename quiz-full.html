<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Quiz Arena — Cameras Decoded</title>

  <!-- ===== MASTER LOADER (shared slim header, mobile bottom nav, design system) ===== -->
  <script src="/scripts/master-loader.js?v=20260924b"></script>

  <!-- ===== SHARED COMPONENT CSS ===== -->
  <link rel="stylesheet" href="header.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --green: #8deb00;
      --green-dim: rgba(141,235,0,0.12);
      --text-muted: #b4b4b4;
      --bg-panel: #0A0A0A;
      --border-dim: #1A1A1A;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Body-layout guard: design-system.css (via master-loader) forces flex
       centering on body, which clips page edges. This page owns its layout. */
    body {
      display: block !important;
      justify-content: normal !important;
      align-items: normal !important;
      padding: 0 !important;
      background: #000;
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    /* App-shell content wrapper: clears the floating header (96px) and the
       mobile bottom nav (120px). */
    .main-content {
      max-width: 860px;
      margin: 0 auto;
      padding: 96px 20px 120px;
      position: relative;
      z-index: 2;
    }
    /* Particle canvas */
    #particles {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.5;
    }
    /* Subtle radial gradient overlay */
    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: radial-gradient(circle at 20% 30%, rgba(141,235,0,0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    .quiz-container {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      background: rgba(10,10,10,0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-dim);
      border-radius: 20px;
      padding: 30px 32px 40px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.9);
      position: relative;
      z-index: 2;
      transition: border-color 0.3s;
    }
    .quiz-container:hover { border-color: rgba(141,235,0,0.2); }

    /* ----- HEADER ----- */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .quiz-header h1 {
      font-family: 'Space Mono', monospace;
      font-size: 20px;
      color: var(--green);
      letter-spacing: 1px;
    }
    /* ----- SIGNAL METER ----- */
    .signal-meter {
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 18px;
      border: 1px solid var(--border-dim);
    }
    .signal-meter .top-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .signal-meter .label {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--green);
      letter-spacing: 1px;
      min-width: 60px;
    }
    .signal-meter .bar {
      flex: 1;
      height: 4px;
      background: var(--border-dim);
      border-radius: 2px;
      overflow: hidden;
    }
    .signal-meter .bar .fill {
      height: 100%;
      width: 0%;
      background: var(--green);
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .signal-meter .percentage {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--green);
      min-width: 40px;
      text-align: right;
    }
    .signal-meter .step-label {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      display: block;
    }

    /* ----- STEP WAVE (progress dots) ----- */
    .step-wave {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 16px 0 20px;
    }
    .wave-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border-dim);
      transition: 0.3s;
      cursor: default;
    }
    .wave-dot.active { background: var(--green); box-shadow: 0 0 12px var(--green); }
    .wave-dot.completed { background: var(--green); opacity: 0.4; }

    /* ----- DIFFICULTY SELECTOR ----- */
    .difficulty-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .diff-btn {
      padding: 6px 18px;
      border: 1px solid var(--border-dim);
      border-radius: 20px;
      background: transparent;
      color: var(--text-muted);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }
    .diff-btn:hover { border-color: var(--green); color: var(--green); }
    .diff-btn.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }

    /* ----- QUESTION AREA ----- */
    .question-text {
      font-family: 'Space Mono', monospace;
      font-size: 20px;
      font-weight: 400;
      margin: 16px 0 24px;
      line-height: 1.5;
      min-height: 60px;
      animation: slideUp 0.4s ease;
    }
    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .answers-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .answer-btn {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border-dim);
      border-radius: 10px;
      padding: 14px 20px;
      color: #fff;
      font-size: 15px;
      font-family: 'Montserrat', sans-serif;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .answer-btn:hover:not(:disabled) {
      border-color: var(--green);
      background: rgba(141,235,0,0.05);
      transform: translateX(4px);
    }
    .answer-btn .letter {
      display: inline-block;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      text-align: center;
      line-height: 30px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .answer-btn.correct { border-color: var(--green) !important; background: rgba(141,235,0,0.12) !important; }
    .answer-btn.correct .letter { background: var(--green); color: #000; }
    .answer-btn.wrong { border-color: #ff4a4a !important; background: rgba(255,74,74,0.12) !important; }
    .answer-btn.wrong .letter { background: #ff4a4a; color: #000; }
    .answer-btn:disabled { opacity: 0.6; cursor: default; transform: none !important; }

    /* ----- FEEDBACK BOX ----- */
    .feedback-box {
      margin-top: 20px;
      padding: 16px 20px;
      border-radius: 8px;
      background: rgba(255,255,255,0.02);
      border-left: 4px solid var(--green);
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .feedback-box .fb-title { font-weight: 700; font-size: 15px; }
    .feedback-box .fb-explain { font-size: 14px; color: var(--text-muted); margin-top: 6px; }

    .next-btn {
      margin-top: 24px;
      padding: 12px 0;
      width: 100%;
      background: transparent;
      border: 1px solid var(--green);
      border-radius: 8px;
      color: var(--green);
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      display: none;
      text-align: center;
    }
    .next-btn:hover { background: rgba(141,235,0,0.1); box-shadow: 0 0 20px rgba(141,235,0,0.15); }

    /* ----- RESULTS ----- */
    .results-box {
      text-align: center;
      padding: 20px 0;
      display: none;
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .results-box .emoji { font-size: 56px; margin-bottom: 10px; display: block; }
    .results-box h2 { font-family: 'Space Mono', monospace; color: var(--green); font-size: 24px; }
    .results-box .sub { color: var(--text-muted); font-size: 16px; margin: 8px 0; }
    .results-box .score-highlight { font-size: 32px; font-weight: 700; color: #fff; }
    .retake-btn, .reset-diff-btn {
      margin-top: 16px;
      padding: 10px 30px;
      background: transparent;
      border: 1px solid var(--green);
      border-radius: 8px;
      color: var(--green);
      font-family: 'Space Mono', monospace;
      cursor: pointer;
      transition: 0.2s;
    }
    .retake-btn:hover, .reset-diff-btn:hover { background: rgba(141,235,0,0.1); }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 600px) {
      .quiz-container { padding: 20px 16px; }
      .question-text { font-size: 17px; }
      .answer-btn { font-size: 14px; padding: 12px 14px; }
      .quiz-header h1 { font-size: 16px; }
    }

    .xp-line {
      margin-top: 12px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      letter-spacing: 1px;
    }
    .xp-line.banked { color: var(--green); }
    .xp-line.muted { color: var(--text-muted); }
    .xp-how {
      margin-top: 8px;
      background: none; border: none; cursor: pointer;
      color: var(--text-muted);
      font-family: 'Space Mono', monospace; font-size: 11px;
      letter-spacing: 2px; text-transform: uppercase;
      text-decoration: underline; text-underline-offset: 3px;
      padding: 6px;
    }
    .xp-how:hover { color: var(--green); }

    /* ----- YOU WIN sting (fullscreen, 3s) ----- */
    #quizSting{position:fixed;inset:0;z-index:200;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .45s ease}
    #quizSting[hidden]{display:none}
    #quizSting.on{opacity:1;pointer-events:auto}
    #quizSting.leaving{opacity:0;pointer-events:none}
    #quizSting video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    #quizSting .sting-kicker{position:absolute;z-index:2;left:0;right:0;bottom:96px;text-align:center;font:700 13px 'Space Mono',monospace;letter-spacing:.34em;color:#fff;text-transform:uppercase;text-shadow:0 2px 18px rgba(0,0,0,.9)}
    #quizSting .sting-skip{position:absolute;z-index:2;left:0;right:0;bottom:30px;text-align:center;font:600 10.5px 'Space Mono',monospace;letter-spacing:.22em;color:rgba(255,255,255,.45);text-transform:uppercase}
  </style>
</head>
<body>

  <!-- PARTICLE CANVAS -->
  <canvas id="particles"></canvas>

  <main class="main-content">
  <div class="quiz-container">
    <!-- HEADER -->
    <div class="quiz-header">
      <h1><img src="/custom-site-titles/quiz-arena.png" alt="Quiz Arena" style="max-width:240px;width:100%;height:auto;display:block" onerror="this.style.display='none';this.nextElementSibling.style.display=''"><span style="display:none"><i class="fas fa-brain" style="margin-right:8px;"></i> Quiz Arena</span></h1>
    </div>

    <!-- SIGNAL METER -->
    <div class="signal-meter">
      <div class="top-row">
        <span class="label" id="signalLabel">SIGNAL</span>
        <div class="bar"><div class="fill" id="signalFill"></div></div>
        <span class="percentage" id="signalPercent">0%</span>
      </div>
      <div class="step-label" id="stepLabel">⚡ Step 1: Choose difficulty</div>
    </div>

    <!-- STEP WAVE -->
    <div class="step-wave" id="stepWave">
      <span class="wave-dot active" data-step="0"></span>
      <span class="wave-dot" data-step="1"></span>
      <span class="wave-dot" data-step="2"></span>
      <span class="wave-dot" data-step="3"></span>
      <span class="wave-dot" data-step="4"></span>
      <span class="wave-dot" data-step="5"></span>
    </div>

    <!-- DIFFICULTY SELECTOR -->
    <div class="difficulty-selector" id="diffSelector">
      <button class="diff-btn active" data-level="beginner">🌱 Beginner</button>
      <button class="diff-btn" data-level="intermediate">⚡ Intermediate</button>
      <button class="diff-btn" data-level="advanced">🚀 Advanced</button>
    </div>

    <!-- QUIZ UI -->
    <div id="quizUI">
      <div id="questionArea">
        <div class="question-text" id="qText">Select a difficulty to begin.</div>
        <div class="answers-grid" id="answersContainer"></div>
      </div>

      <div class="feedback-box" id="feedbackBox">
        <div class="fb-title" id="fbTitle">✅ Correct!</div>
        <div class="fb-explain" id="fbExplain">Explanation goes here.</div>
      </div>

      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question →</button>

      <div class="results-box" id="resultsBox">
        <span class="emoji" id="resultEmoji">🎉</span>
        <h2>Quiz Complete!</h2>
        <div class="sub">You scored</div>
        <div class="score-highlight"><span id="finalScore">0</span> / <span id="totalQ">0</span></div>
        <div class="sub" id="resultMsg" style="color:var(--green); font-family:'Space Mono',monospace; margin-top:10px;">Keep decoding!</div>
        <div class="xp-line" id="xpLine" style="display:none;"></div>
        <button class="xp-how" id="xpHowBtn" type="button">How XP works</button>
        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
          <button class="retake-btn" onclick="resetQuiz()"><i class="fas fa-redo"></i> Retake</button>
          <button class="reset-diff-btn" onclick="resetDifficulty()"><i class="fas fa-arrow-left"></i> Change Difficulty</button>
        </div>
      </div>
    </div>
  </div>
  </main>

  <div id="quizSting" role="dialog" aria-modal="true" aria-label="Perfect quiz" hidden>
    <video id="quizStingVideo" muted playsinline preload="auto" aria-hidden="true"></video>
    <div class="sting-kicker">YOU WIN</div>
    <div class="sting-skip">tap to continue</div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/scripts/badges.js"></script>
  <script src="/scripts/gear-awards.js"></script>
  <script src="/scripts/gear-share.js"></script>
  <script src="/scripts/firebase-init.js"></script>
  <script src="/scripts/user-state.js"></script>
  <script src="/scripts/xp-explainer.js"></script>
  <script src="header.js"></script>
  <script src="/scripts/desktop-sidebar.js"></script>

  <script>
    // ============================================================
    // 0.  FIREBASE INIT
    // ============================================================
    // NOTE: scripts/firebase-init.js (loaded above via the app shell) owns
    // `firebaseConfig` and initializes the Firebase app. Do NOT re-declare
    // `const firebaseConfig` here: classic scripts share the global scope, so
    // a duplicate `const` throws "Identifier 'firebaseConfig' has already been
    // declared" at parse time and kills this entire script block (that is what
    // left the difficulty buttons dead). If the Firebase CDN is ever blocked,
    // `firebase` is undefined: the quiz still runs fully offline on the local
    // question bank; only cloud sync and XP banking are skipped.
    const hasFirebase = (typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length);
    const auth = hasFirebase ? firebase.auth() : null;
    const db = hasFirebase ? firebase.firestore() : null;

    // ============================================================
    // 1.  PARTICLES BACKGROUND
    // ============================================================
    (function() {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      let w, h;
      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const particles = [];
      const count = 80;
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.6,
          vy: (Math.random() - 0.5) * 0.6,
          r: Math.random() * 2 + 1,
          alpha: Math.random() * 0.5 + 0.2
        });
      }

      function drawParticles() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > w) p.vx *= -1;
          if (p.y < 0 || p.y > h) p.vy *= -1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(141, 235, 0, ${p.alpha})`;
          ctx.fill();
        });
        // Draw lines between nearby particles
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(141, 235, 0, ${0.08 * (1 - dist/120)})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(drawParticles);
      }
      drawParticles();
    })();

    // ============================================================
    // 2.  QUIZ DATA
    // ============================================================
    const questionBank = {
      beginner: [
        { q: "What does ISO primarily control in a camera?", a: ["Aperture", "Shutter speed", "Light sensitivity", "White balance"], c: 2, e: "ISO adjusts the sensor's sensitivity to light. Higher ISO = brighter in low light, but more noise." },
        { q: "Which shutter speed freezes fast motion best?", a: ["1/15s", "1/60s", "1/500s", "1/2s"], c: 2, e: "1/500s is fast enough to freeze most sports and moving subjects." },
        { q: "What does 'f/2.8' refer to?", a: ["Shutter speed", "ISO", "Aperture (focal ratio)", "White balance"], c: 2, e: "f/2.8 is a wide aperture that lets in lots of light and creates shallow depth of field." },
        { q: "Which file format gives the most editing flexibility?", a: ["JPEG", "PNG", "RAW", "TIFF"], c: 2, e: "RAW files contain unprocessed sensor data, offering maximum latitude for exposure and colour adjustments." },
        { q: "What is the 'rule of thirds'?", a: ["Exposure rule", "Composition guideline", "Focus technique", "Lighting setup"], c: 1, e: "It divides the frame into 9 equal parts, placing key elements along the lines or intersections for balance." },
        { q: "Which lens is best for portraits?", a: ["50mm f/1.8", "18-55mm kit lens", "70-200mm f/4", "24mm f/2.8"], c: 0, e: "A 50mm or 85mm prime with wide aperture gives pleasing bokeh and natural perspective for portraits." },
        { q: "What does 'white balance' correct?", a: ["Exposure", "Colour temperature", "Focus", "Depth of field"], c: 1, e: "White balance adjusts the colour cast so that white objects appear white under different lighting conditions." },
        { q: "When should you use a tripod?", a: ["Always", "Only for video", "In low light and long exposures", "Never"], c: 2, e: "Tripods eliminate camera shake, essential for long exposures, low light, and macro work." },
        { q: "Which mode gives you full creative control?", a: ["Auto", "Aperture Priority", "Shutter Priority", "Manual"], c: 3, e: "Manual mode lets you set both aperture and shutter speed independently, offering complete creative freedom." },
        { q: "What is 'bokeh'?", a: ["A type of lens", "Background blur quality", "A colour profile", "A light meter"], c: 1, e: "Bokeh describes the aesthetic quality of the out-of-focus areas, often soft and creamy with fast lenses." },
        { q: "What does shutter speed control?", a: ["How long the sensor is exposed to light", "The size of the lens opening", "The camera's focus point", "The image file size"], c: 0, e: "Shutter speed is how long the sensor sees light — fast speeds freeze motion, slow speeds blur it." },
        { q: "What happens when you raise the ISO?", a: ["Brighter image with more noise", "Sharper image with less noise", "Wider depth of field", "Faster autofocus"], c: 0, e: "Higher ISO brightens the image but adds digital noise, so raise it only as much as the shot needs." },
        { q: "Which aperture gives the blurriest background?", a: ["f/16", "f/11", "f/8", "f/1.8"], c: 3, e: "f/1.8 is a wide aperture — wide openings give shallow depth of field and creamy backgrounds." },
        { q: "What is 'exposure'?", a: ["The total light reaching the sensor", "The camera's battery level", "The lens zoom range", "The number of megapixels"], c: 0, e: "Exposure is simply how much light the sensor collects, set by aperture, shutter speed and ISO together." },
        { q: "What does AF stand for on your camera?", a: ["Auto flash", "Autofocus", "Aperture fixed", "Always flat"], c: 1, e: "AF is autofocus — the camera drives the lens to focus for you; MF is manual focus." },
        { q: "Which white balance setting suits indoor tungsten bulbs?", a: ["Daylight", "Tungsten", "Cloudy", "Shade"], c: 1, e: "Tungsten bulbs burn warm/orange, so the Tungsten preset cools the image back to neutral." },
        { q: "What does the histogram show you?", a: ["The distribution of tones from black to white", "The camera's shutter count", "The lens sharpness map", "The battery health"], c: 0, e: "The histogram graphs every tone in the shot — spikes jammed left mean crushed blacks, right means blown highlights." },
        { q: "What is a JPEG?", a: ["A compressed image format", "A lens mount", "A flash mode", "A focus system"], c: 0, e: "JPEG is a compressed format: small files and ready-to-share colour, but less room to fix exposure later than RAW." },
        { q: "Which of these is a wide-angle focal length?", a: ["85mm", "50mm", "35mm", "24mm"], c: 3, e: "24mm is wide-angle — it takes in a broad scene, great for landscapes and tight interiors." },
        { q: "What is the smartest thing to do the night before a shoot?", a: ["Charge batteries and clear memory cards", "Buy a new lens", "Post a teaser online", "Rinse the sensor under water"], c: 0, e: "Dead batteries and full cards have ruined more shoots than any camera setting ever will." },
      ],
      intermediate: [
        { q: "What is the 'exposure triangle' composed of?", a: ["ISO, Shutter Speed, Aperture", "ISO, Focal Length, Shutter Speed", "Aperture, White Balance, ISO", "Shutter Speed, Flash, Aperture"], c: 0, e: "The triangle consists of ISO, shutter speed, and aperture – balancing them determines exposure." },

    // ============================================================
    // 3.  QUIZ ENGINE – WITH FIRESTORE SYNC
    // ============================================================
    let currentLevel = 'beginner';
    let questions = [];
    let currentQ = 0;
    let score = 0;
    let answered = false;
    let streak = 0;
    let currentUser = null;
    let quizXpState = 'signedout'; // 'banked' | 'already' | 'signedout' | 'error' | 'noscore' 

    const letters = ['A', 'B', 'C', 'D'];
    const totalQuestionsPerLevel = 10;

    // DOM refs
    const qText = document.getElementById('qText');
    const answersContainer = document.getElementById('answersContainer');
    const feedbackBox = document.getElementById('feedbackBox');
    const fbTitle = document.getElementById('fbTitle');
    const fbExplain = document.getElementById('fbExplain');
    const nextBtn = document.getElementById('nextBtn');
    const resultsBox = document.getElementById('resultsBox');
    const finalScore = document.getElementById('finalScore');
    const totalQSpan = document.getElementById('totalQ');
    const resultMsg = document.getElementById('resultMsg');
    const resultEmoji = document.getElementById('resultEmoji');
    const signalFill = document.getElementById('signalFill');
    const signalPercent = document.getElementById('signalPercent');
    const stepLabel = document.getElementById('stepLabel');
    const waveDots = document.querySelectorAll('.wave-dot');
    const streakDisplay = document.querySelector('.streak-display');

    // Safe text update: legacy ids (streakNum2, lastScoreDisplay) have no
    // element on this page — never let a missing node throw and kill the handler.
    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    // ---- Load quiz data from Firestore ----
    async function loadQuizData() {
      const user = auth ? auth.currentUser : null;
      if (!user) return;
      currentUser = user;
      try {
        const doc = await db.collection('users').doc(user.uid).get();
        if (doc.exists) {
          const data = doc.data();
          if (data.quizStreak !== undefined) {
            streak = data.quizStreak || 0;
          } else {
            // Fallback to localStorage then default to 0
            streak = parseInt(localStorage.getItem('quizStreak') || '0');
          }
          // Update UI
          setText('streakNum2', streak);
          localStorage.setItem('quizStreak', streak.toString());
          // Last score
          if (data.quizLastScore) {
            const score = data.quizLastScore;
            const levelNames = { beginner:'🌱', intermediate:'⚡', advanced:'🚀' };
            const levelIcon = levelNames[score.level] || '';
            setText('lastScoreDisplay', `${levelIcon} ${score.score}/${score.total}`);
            localStorage.setItem('quizLastScore', JSON.stringify(score));
          }
        }
      } catch (err) {
        console.warn('Error loading quiz data:', err);
        streak = parseInt(localStorage.getItem('quizStreak') || '0');
        setText('streakNum2', streak);
      }
    }

    // ---- Save quiz data to Firestore ----
    async function saveQuizData(scoreData) {
      const user = auth ? auth.currentUser : null;
      if (!user) { quizXpState = 'signedout'; return; }
      try {
        await db.collection('users').doc(user.uid).update({
          quizStreak: streak,
          quizLastScore: scoreData
        });
        // Also update localStorage for quick access
        localStorage.setItem('quizStreak', streak.toString());
        localStorage.setItem('quizLastScore', JSON.stringify(scoreData));
      } catch (err) {
        console.warn('Error saving quiz data:', err);
        // Fallback to localStorage only
        localStorage.setItem('quizStreak', streak.toString());
        localStorage.setItem('quizLastScore', JSON.stringify(scoreData));
      }

      // ---- Quiz Arena XP: +10 on the first scored run per difficulty per day ----
      // Every XP writer stamps the active-day keys so a later reward write
      // cannot erase xpToday (XP day-stamp fix).
      try {
        if (!scoreData || !scoreData.total) {
          quizXpState = 'noscore';
        } else {
          const d = new Date();
          const dayKey = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
          const uref = db.collection('users').doc(user.uid);
          const snap = await uref.get();
          const udata = snap.exists ? snap.data() : {};
          const dayLog = (udata.quizXpLog && udata.quizXpLog[dayKey]) || {};
          if (dayLog[currentLevel]) {
            quizXpState = 'already';
          } else {
            // Day-aware: xpTodayDate (local) is the day authority — freshDay
            // means the stored total already belongs to today, so increment
            // it; on a new day set the first XP absolutely.
            const freshDay = !!udata && udata.xpTodayDate === dayKey;
            const upd = {
              lastActivityDate: dayKey,
              lastActiveDate: dayKey,
              lastStreakDate: dayKey,
              lastXpDate: dayKey
            };
            if (freshDay) { upd.xpToday = firebase.firestore.FieldValue.increment(10); }
            else { upd.xpToday = 10; upd.dailyXp = 10; upd.xpTodayDate = dayKey; }
            upd['xpByDay.' + dayKey] = firebase.firestore.FieldValue.increment(10);
            upd.totalPoints = firebase.firestore.FieldValue.increment(10);
            upd['quizXpLog.' + dayKey + '.' + currentLevel] = true;
            await uref.set(upd, { merge: true });
            quizXpState = 'banked';
          }
        }
      } catch (e) { quizXpState = 'error'; }

      // ---- Leaderboard XP: 2 XP per correct answer ----
      try {
        const xp = (scoreData.score || 0) * 2;
        const wk = isoWeekKey(new Date());
        const upd = {
          displayName: user.displayName || 'Operator',
          xp: firebase.firestore.FieldValue.increment(xp),
          plays: firebase.firestore.FieldValue.increment(1),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        upd['weeks.' + wk] = firebase.firestore.FieldValue.increment(xp);
        await db.collection('leaderboard').doc(user.uid).set(upd, { merge: true });
      } catch (e) { /* leaderboard is best-effort */ }

      // ---- Badges ----
      try {
        if (window.CDBadges) {
          if (scoreData.score === scoreData.total && scoreData.total > 0) {
            CDBadges.award(user.uid, 'quiz-perfect', db);
            if (window.CDGear) { try { window.CDGear.trackQuizPerfect(db, user.uid); } catch (e) {} }
            if (currentLevel === 'advanced' && window.CDGear) {
              window.CDGear.award(user.uid, 'gear-ghost', db);
            }
          }
          const uref = db.collection('users').doc(user.uid);
          await uref.set({ quizTotal: firebase.firestore.FieldValue.increment(1) }, { merge: true });
          const usnap = await uref.get();
          if (((usnap.data() || {}).quizTotal || 0) >= 10) {
            CDBadges.award(user.uid, 'quiz-10', db);
          }
        }
      } catch (e) { /* badges are best-effort */ }
    }

    // ISO week key: YYYY-Www (matches leaderboard weekly buckets)
    function isoWeekKey(d) {
      d = d || new Date();
      var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      var day = (t.getUTCDay() + 6) % 7;
      t.setUTCDate(t.getUTCDate() - day + 3);
      var first = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
      var week = 1 + Math.round(((t - first) / 864e5 - 3 + ((first.getUTCDay() + 6) % 7)) / 7);
      return t.getUTCFullYear() + '-W' + ('0' + week).slice(-2);
    }

    // ---- How XP works ----
    (function() {
      var b = document.getElementById('xpHowBtn');
      if (b) b.addEventListener('click', function() {
        if (window.CDXpExplainer) window.CDXpExplainer.open();
      });
    })();

    // ---- Difficulty buttons ----
    document.querySelectorAll('.diff-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentLevel = this.dataset.level;
        resetQuiz();
      });
    });

    function loadQuestions(level) {
      var bank = questionBank[level] || questionBank.beginner;
      // Shuffle a copy and deal 10 per run, so repeat visits meet fresh questions.
      var pool = bank.slice();
      for (var i = pool.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
      }
      questions = pool.slice(0, Math.min(10, pool.length));
      return questions;
    }

    function startQuiz() {
      const level = currentLevel;
      questions = loadQuestions(level);
      currentQ = 0;
      score = 0;
      answered = false;
      resultsBox.style.display = 'none';
      document.getElementById('questionArea').style.display = 'block';
      feedbackBox.style.display = 'none';
      nextBtn.style.display = 'none';
      updateWaveAndMeter(0);
      stepLabel.textContent = `⚡ ${level.charAt(0).toUpperCase()+level.slice(1)} · Question 1 of ${questions.length}`;
      renderQuestion();
    }

    function renderQuestion() {
      if (currentQ >= questions.length) {
        showResults();
        return;
      }
      const q = questions[currentQ];
      qText.textContent = q.q;
      answersContainer.innerHTML = '';
      q.a.forEach((ans, idx) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.innerHTML = `<span class="letter">${letters[idx]}</span> ${ans}`;
        btn.dataset.idx = idx;
        btn.addEventListener('click', () => handleAnswer(idx));
        answersContainer.appendChild(btn);
      });
      feedbackBox.style.display = 'none';
      nextBtn.style.display = 'none';
      answered = false;
      stepLabel.textContent = `⚡ ${currentLevel.charAt(0).toUpperCase()+currentLevel.slice(1)} · Question ${currentQ+1} of ${questions.length}`;
      updateWaveAndMeter(currentQ);
    }

    function handleAnswer(selected) {
      if (answered) return;
      answered = true;
      const q = questions[currentQ];
      const isCorrect = selected === q.c;
      if (isCorrect) { score++; streak++; } else { streak = 0; }
      // Update UI streak
      setText('streakNum2', streak);
      localStorage.setItem('quizStreak', streak.toString());

      const btns = document.querySelectorAll('.answer-btn');
      btns.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.c) btn.classList.add('correct');
        if (idx === selected && !isCorrect) btn.classList.add('wrong');
      });

      const progress = (score / questions.length) * 100;
      signalFill.style.width = progress + '%';
      signalPercent.textContent = Math.round(progress) + '%';

      feedbackBox.style.display = 'block';
      feedbackBox.style.borderLeftColor = isCorrect ? 'var(--green)' : '#ff4a4a';
      fbTitle.innerHTML = isCorrect ? '✅ Correct!' : '❌ Not quite.';
      fbTitle.style.color = isCorrect ? 'var(--green)' : '#ff4a4a';
      fbExplain.textContent = q.e;

      nextBtn.style.display = 'block';
      nextBtn.textContent = (currentQ === questions.length - 1) ? 'See Results 🏆' : 'Next Question →';
      waveDots.forEach((dot, i) => {
        if (i <= currentQ) dot.classList.add('completed');
        else dot.classList.remove('completed');
      });
      waveDots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentQ + 1);
      });
    }

    function nextQuestion() {
      currentQ++;
      renderQuestion();
    }

    async function showResults() {
      const scoreData = {
        score: score,
        total: questions.length,
        level: currentLevel
      };

      // Save to Firestore (syncs across devices)
      await saveQuizData(scoreData);

      if (score === questions.length && questions.length > 0) {
        playQuizSting(renderQuizResults); // YOU WIN sting, then the results
      } else {
        renderQuizResults();
      }
    }

    function renderQuizResults() {
      document.getElementById('questionArea').style.display = 'none';
      feedbackBox.style.display = 'none';
      nextBtn.style.display = 'none';
      resultsBox.style.display = 'block';
      finalScore.textContent = score;
      totalQSpan.textContent = questions.length;

      let emoji, msg;
      if (score === questions.length) { emoji = '🌟'; msg = 'Perfect! You are a true Decoder Master!'; }
      else if (score >= questions.length - 1) { emoji = '🔥'; msg = 'Almost perfect! You\'re on fire!'; }
      else if (score >= Math.floor(questions.length * 0.6)) { emoji = '📡'; msg = 'Good job! Review the missed concepts to level up.'; }
      else { emoji = '📚'; msg = 'Keep studying the signal! Try again.'; }
      resultEmoji.textContent = emoji;
      resultMsg.textContent = msg;

      // XP status line
      (function() {
        var xpLine = document.getElementById('xpLine');
        if (!xpLine) return;
        var levelLabel = { beginner: 'Beginner', intermediate: 'Intermediate', advanced: 'Advanced' }[currentLevel] || currentLevel;
        xpLine.style.display = 'block';
        if (quizXpState === 'banked') {
          xpLine.className = 'xp-line banked';
          xpLine.textContent = '\u26A1 +10 XP banked \u2014 first ' + levelLabel + ' run today';
        } else if (quizXpState === 'already') {
          xpLine.className = 'xp-line muted';
          xpLine.textContent = 'XP already claimed for ' + levelLabel + ' today \u2014 replays are practice';
        } else if (quizXpState === 'signedout') {
          xpLine.className = 'xp-line muted';
          xpLine.textContent = 'Log in to bank XP for your runs';
        } else {
          xpLine.style.display = 'none';
        }
      })();

      const finalPct = (score / questions.length) * 100;
      signalFill.style.width = finalPct + '%';
      signalPercent.textContent = Math.round(finalPct) + '%';
      stepLabel.textContent = '🎯 Quiz Complete!';
      waveDots.forEach(d => d.classList.add('completed'));

      // Update dashboard display (last score)
      const levelNames = { beginner:'🌱', intermediate:'⚡', advanced:'🚀' };
      const levelIcon = levelNames[currentLevel] || '';
      setText('lastScoreDisplay', `${levelIcon} ${score}/${questions.length}`);

      if (score === questions.length) launchConfetti();
    }

    // Fullscreen YOU WIN sting on a perfect quiz (3s, tap to skip), then results.
    function playQuizSting(onDone) {
      const sting = document.getElementById('quizSting');
      const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion || !sting) { if (onDone) onDone(); return; }
      const vid = document.getElementById('quizStingVideo');
      let done = false;
      const finish = () => {
        if (done) return; done = true;
        sting.classList.add('leaving');
        setTimeout(() => { sting.classList.remove('on', 'leaving'); sting.hidden = true; }, 450);
        if (onDone) onDone();
      };
      vid.innerHTML = '';
      const srcEl = document.createElement('source');
      srcEl.src = '/media/you-win-success.mp4'; srcEl.type = 'video/mp4';
      srcEl.addEventListener('error', finish);
      vid.appendChild(srcEl);
      vid.onended = finish;
      sting.onclick = finish;
      sting.hidden = false;
      requestAnimationFrame(() => sting.classList.add('on'));
      setTimeout(finish, 3600); // backstop: stings are 3.0s
      try { vid.load(); const p = vid.play(); if (p && p.catch) p.catch(finish); }
      catch (e) { finish(); }
    }

    function resetQuiz() {
      startQuiz();
    }

    function resetDifficulty() {
      resultsBox.style.display = 'none';
      document.getElementById('questionArea').style.display = 'block';
      qText.textContent = 'Select a difficulty to begin.';
      answersContainer.innerHTML = '';
      feedbackBox.style.display = 'none';
      nextBtn.style.display = 'none';
      signalFill.style.width = '0%';
      signalPercent.textContent = '0%';
      stepLabel.textContent = '⚡ Step 1: Choose difficulty';
      waveDots.forEach(d => { d.classList.remove('active', 'completed'); });
      waveDots[0].classList.add('active');
      finalScore.textContent = '0';
      totalQSpan.textContent = '0';
    }

    function updateWaveAndMeter(qIndex) {
      waveDots.forEach((dot, i) => {
        if (i < qIndex) dot.classList.add('completed');
        else dot.classList.remove('completed');
        dot.classList.toggle('active', i === qIndex);
      });
      const progress = qIndex / (questions.length || 1) * 100;
      signalFill.style.width = progress + '%';
      signalPercent.textContent = Math.round(progress) + '%';
    }

    // ---- Confetti ----
    function launchConfetti() {
      const colors = ['#8deb00', '#00e5ff', '#ffdd00', '#ff4a4a', '#a0f520'];
      for (let i = 0; i < 60; i++) {
        const el = document.createElement('div');
        el.style.cssText = `
          position: fixed;
          width: ${Math.random()*8+4}px;
          height: ${Math.random()*8+4}px;
          background: ${colors[Math.floor(Math.random()*colors.length)]};
          left: ${Math.random()*100}vw;
          top: -10px;
          border-radius: ${Math.random()>0.5 ? '50%' : '2px'};
          pointer-events: none;
          z-index: 9999;
          transform: rotate(${Math.random()*360}deg);
          animation: confettiFall ${Math.random()*2+2}s linear forwards;
          animation-delay: ${Math.random()*0.5}s;
        `;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 4000);
      }
      if (!document.getElementById('confettiStyle')) {
        const style = document.createElement('style');
        style.id = 'confettiStyle';
        style.textContent = `
          @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg) scale(0.2); opacity: 0; }
          }
        `;
        document.head.appendChild(style);
      }
    }

    // ============================================================
    // 4.  INIT – load data then start
    // ============================================================
    document.addEventListener('DOMContentLoaded', async function() {
      // Wait for auth to be ready
      if (auth && auth.currentUser) {
        await loadQuizData();
      } else if (auth) {
        // Listen for auth
        auth.onAuthStateChanged(async (user) => {
          if (user) {
            currentUser = user;
            await loadQuizData();
          }
        });
      }

      const params = new URLSearchParams(window.location.search);
      const levelParam = params.get('level');
      if (levelParam && ['beginner','intermediate','advanced'].includes(levelParam)) {
        currentLevel = levelParam;
        document.querySelectorAll('.diff-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.level === levelParam);
        });
        startQuiz();
      } else {
        resetDifficulty();
      }
    });

    // ---- Auth listener for real-time updates ----
    if (auth) auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        // If quiz hasn't started yet, load data
        if (document.querySelector('.diff-btn.active')) {
          loadQuizData();
        }
      }
    });
  </script>
  <script src="/scripts/ptr.js"></script>
</body>
</html>
