<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#060806">
<title>Play — Cameras Decoded</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#070708" />
<meta name="apple-mobile-web-app-title" content="Cameras Decoded" />
<!--
  PLAY.SHELL — the single lesson player for all learning games.
  - Loads ONE game script lazily (?slot=<firestoreId> | ?demo=<n> | ?game=<id>&version=<v>)
  - Renders shared premium chrome: progress, XP, transitions, result screen.
  - Games never touch Firebase; the shell owns persistence (game_sessions).
  - Deploy: copy play.html + games/ to site root. Firebase compat scripts
    + your firebase-init are included below (paste your web config into the
    marked block) BEFORE games/cdgames.js to enable Firestore slot loading
    + session writes. Without a valid config: demo mode.
-->
<style>
  :root{
    --bg:#060806; --panel:#0b0f0b; --line:#1e2a1e; --txt:#eef4e9; --dim:#8a9a86;
    --acc:#8deb00; --acc-dim:rgba(141,235,0,.14);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:'Montserrat',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:var(--sans);}
  body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}

  /* ---------- top chrome ---------- */
  .cd-top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
    padding:10px 14px;background:rgba(6,8,6,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);}
  .cd-exit{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:10px;
    font-family:var(--mono);font-size:12px;letter-spacing:1px;padding:9px 12px;cursor:pointer;}
  .cd-exit:active{transform:scale(.96);}
  .cd-titleblock{flex:1;min-width:0;}
  .cd-crumb{font-family:var(--mono);font-size:9.5px;letter-spacing:2px;color:var(--dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cd-title{font-family:var(--mono);font-size:14px;letter-spacing:1px;color:var(--txt);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cd-xppill{font-family:var(--mono);font-size:11px;color:#06110a;background:var(--acc);
    border-radius:999px;padding:7px 12px;font-weight:700;letter-spacing:1px;white-space:nowrap;}

  /* ---------- progress ---------- */
  .cd-progress{height:5px;background:#101510;position:relative;overflow:hidden;}
  .cd-progress-fill{position:absolute;left:0;top:0;bottom:0;width:0%;
    background:linear-gradient(90deg,#5da300,var(--acc));box-shadow:0 0 12px rgba(141,235,0,.8);
    transition:width .45s cubic-bezier(.22,1,.36,1);}
  .cd-progress-label{font-family:var(--mono);font-size:9.5px;letter-spacing:2px;color:var(--dim);
    padding:7px 14px 0;}

  /* ---------- stage ---------- */
  #cdStage{flex:1;width:100%;max-width:1060px;margin:0 auto;padding:12px 12px 8px;opacity:0;
    transform:translateY(10px) scale(.995);transition:opacity .5s ease,transform .5s ease;}
  #cdStage.on{opacity:1;transform:none;}

  /* ---------- footer ---------- */
  .cd-foot{position:sticky;bottom:0;z-index:40;display:flex;align-items:center;gap:12px;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:rgba(6,8,6,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--line);}
  .cd-foothint{flex:1;font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--dim);line-height:1.6;}
  .cd-finish{border:none;border-radius:12px;background:var(--acc);color:#06110a;cursor:pointer;
    font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:2px;padding:15px 26px;
    box-shadow:0 4px 0 #5da300,0 10px 26px rgba(141,235,0,.28);transition:transform .07s,box-shadow .07s;}
  .cd-finish:active{transform:translateY(3px);box-shadow:0 1px 0 #5da300;}

  /* ---------- loading ---------- */
  .cd-veil{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;transition:opacity .4s ease;overflow:hidden;}
  .cd-lvideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.4;pointer-events:none;}
  .cd-veil>*:not(.cd-lvideo){position:relative;z-index:1;}
  .cd-veil.off{opacity:0;pointer-events:none;}
  .cd-pulse{font-family:var(--mono);font-size:13px;letter-spacing:4px;color:var(--acc);
    animation:cdPulse 1.4s ease-in-out infinite;}
  @keyframes cdPulse{0%,100%{opacity:.45}50%{opacity:1}}
  .cd-loadbar{width:180px;height:3px;background:#141a14;border-radius:2px;overflow:hidden;}
  .cd-loadbar i{display:block;height:100%;width:40%;background:var(--acc);border-radius:2px;
    animation:cdSlide 1.1s ease-in-out infinite;}
  @keyframes cdSlide{0%{transform:translateX(-100%)}100%{transform:translateX(450%)}}
  .cd-err{max-width:420px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.8;padding:0 24px;}
  .cd-err b{color:#ff5d5d;}

  /* ---------- result ---------- */
  #cdResult{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
    padding:20px;background:rgba(4,6,4,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  #cdResult.on{display:flex;}
  .cd-rcard{width:100%;max-width:440px;text-align:center;background:var(--panel);
    border:1px solid rgba(141,235,0,.4);border-radius:20px;padding:34px 26px;
    box-shadow:0 0 60px rgba(141,235,0,.12),0 30px 80px rgba(0,0,0,.6);
    animation:cdRise .55s cubic-bezier(.22,1,.36,1);}
  @keyframes cdRise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
  .cd-rcard{position:relative;z-index:1;width:100%;max-width:460px;text-align:center;
    background:transparent;border:none;box-shadow:none;padding:24px 26px;
    animation:cdRise .55s cubic-bezier(.22,1,.36,1);}
  /* Full-screen Cynetis-7 success backdrop — black video fills the screen, text overlaid on top */
  .cd-rvideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    pointer-events:none;animation:cdRFade 1.2s ease both;}
  @keyframes cdRFade{from{opacity:0}to{opacity:1}}
  /* Matrix-ish terminal print for the detail lines */
  .cd-rline{display:inline-block;animation:cdLineIn .45s cubic-bezier(.22,1,.36,1) both;}
  @keyframes cdLineIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .cd-rkicker{font-family:var(--mono);font-size:10px;letter-spacing:4px;color:var(--acc);margin-bottom:10px;}
  .cd-rscore{font-family:var(--mono);font-size:76px;font-weight:700;color:var(--acc);line-height:1;
    text-shadow:0 0 30px rgba(141,235,0,.45);font-variant-numeric:tabular-nums;}
  .cd-rxp{display:inline-block;margin-top:12px;font-family:var(--mono);font-size:13px;font-weight:700;
    letter-spacing:2px;color:#06110a;background:var(--acc);border-radius:999px;padding:8px 18px;
    animation:cdPop .5s .35s cubic-bezier(.22,1.4,.36,1) backwards;}
  @keyframes cdPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
  .cd-rdetail{font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.8;margin:14px 0 4px;}
  .cd-rbtns{display:flex;gap:10px;margin-top:20px;}
  .cd-rbtn{flex:1;padding:14px;border-radius:12px;cursor:pointer;font-family:var(--mono);
    font-size:12px;letter-spacing:2px;border:1px solid var(--line);background:transparent;color:var(--txt);}
  .cd-rbtn.primary{background:var(--acc);border-color:var(--acc);color:#06110a;font-weight:700;}
  .cd-rbtn:active{transform:scale(.97);}
  .cd-rexit{display:block;margin:16px auto 0;background:none;border:0;cursor:pointer;
    font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--dim);opacity:.8;}
  .cd-rexit:hover{opacity:1;color:var(--txt);}

  /* ---------- toast ---------- */
  #cdToast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);z-index:80;
    background:#0e140e;border:1px solid rgba(141,235,0,.5);color:var(--acc);
    font-family:var(--mono);font-size:12px;letter-spacing:1px;border-radius:999px;padding:10px 20px;
    opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;white-space:nowrap;}
  #cdToast.on{opacity:1;transform:translateX(-50%);}
  @media(prefers-reduced-motion:reduce){
    #cdStage{transition:none;} .cd-pulse,.cd-loadbar i{animation:none;}
    .cd-rcard,.cd-rxp{animation:none;} .cd-progress-fill{transition:none;}
    .cd-rvideo{display:none;}
    .cd-lvideo{display:none;}
    .cd-rline{animation:none;}
  }
</style>
</head>
<body>

<header class="cd-top">
  <button class="cd-exit" id="cdExit" aria-label="Exit game">✕ EXIT</button>
  <div class="cd-titleblock">
    <div class="cd-crumb" id="cdCrumb">LOADING…</div>
    <div class="cd-title" id="cdTitle">—</div>
  </div>
  <div class="cd-xppill" id="cdXpPill">0 XP</div>
</header>
<div class="cd-progress"><div class="cd-progress-fill" id="cdProgressFill"></div></div>
<div class="cd-progress-label" id="cdProgressLabel">SESSION</div>

<main id="cdStage" aria-live="polite"></main>

<footer class="cd-foot">
  <div class="cd-foothint" id="cdFootHint">Run the drill above.<br>Finish anytime to bank your signal.</div>
  <button class="cd-finish" id="cdFinish">FINISH</button>
</footer>

<div class="cd-veil" id="cdVeil">
  <video class="cd-lvideo" muted loop playsinline autoplay preload="auto" aria-hidden="true" onerror="this.remove()">
  </video>
  <script>
  // Random branded loading video (same pool as the boot veil).
  (function(){var v=document.currentScript.previousElementSibling;if(!v||v.tagName!=='VIDEO')return;var p=['/media/loading-success.mp4','/media/loading-v2-success.mp4'];var s=document.createElement('source');s.type='video/mp4';s.src=p[Math.floor(Math.random()*p.length)];v.appendChild(s);try{v.load();}catch(e){}})();
  </script>
  <div class="cd-pulse">◉ LOADING GAME</div>
  <div class="cd-loadbar"><i></i></div>
  <div class="cd-err" id="cdErr" hidden></div>
</div>

<div id="cdResult" role="dialog" aria-modal="true" aria-label="Session result">
  <video class="cd-rvideo" id="cdResultVideo" muted playsinline preload="auto" aria-hidden="true"
    onerror="this.remove()">
    <source src="/media/signal-decoded-success.mp4" type="video/mp4">
  </video>
  <div class="cd-rcard">
    <div class="cd-rkicker" id="cdKicker">SIGNAL DECODED</div>
    <div class="cd-rscore" id="cdScoreNum">0</div>
    <div><span class="cd-rxp" id="cdXpLine">+0 XP</span></div>
    <div class="cd-rdetail" id="cdDetail"></div>
    <div class="cd-rbtns">
      <button class="cd-rbtn" id="cdReplay">↻ REPLAY</button>
      <button class="cd-rbtn primary" id="cdNext">NEXT →</button>
    </div>
    <button class="cd-rexit" id="cdExitArcade">EXIT TO ARCADE</button>
  </div>
</div>

<div id="cdToast"></div>

<!-- Firebase (compat) — required for ?slot= mode. Canonical init. -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="/scripts/firebase-init.js"></script>
<script src="/scripts/badges.js"></script>
<script src="/scripts/gear-awards.js"></script>
<script src="/scripts/gear-share.js"></script>
<script src="/scripts/streak.js"></script>
<script src="/scripts/haptics.js"></script>
<script src="/scripts/sound.js?v=20260918a"></script>
<script src="games/cdgames.js"></script>
<script>
(function () {
  'use strict';

  /* ============ demo queue (no backend needed) ============ */
  var DEMO_QUEUE = [
    { slotId: 'demo-exposure', game: 'exposure-lab', version: 'v1',
      title: 'Exposure Lab', unit: 'EXPOSURE', lesson: 'The Triangle',
      order: 1, xp: 50, config: {} },
    { slotId: 'demo-ar', game: 'ar-viewfinder', version: 'v1',
      title: 'AR Viewfinder', unit: 'EXPOSURE', lesson: 'Meter Reading',
      order: 2, xp: 50, config: { demo: true } },
    { slotId: 'demo-golden', game: 'golden-hour-rush', version: 'v1',
      title: 'Golden Hour Rush', unit: 'EXPOSURE', lesson: 'Chasing Light',
      order: 3, xp: 60, config: {} },
    { slotId: 'demo-sniper', game: 'focal-length-sniper', version: 'v1',
      title: 'Focal Length Sniper', unit: 'LENSES', lesson: 'Reading Glass',
      order: 4, xp: 60, config: { rounds: 6 } }
  ];

  var params = new URLSearchParams(location.search);
  var stage = document.getElementById('cdStage');
  var veil = document.getElementById('cdVeil');

  // Background sound: play.html skips master-loader, so unlock audio on the
  // first user gesture here (no-op if the session entry already started it).
  window.addEventListener('pointerdown', function startBgAudio() {
    window.removeEventListener('pointerdown', startBgAudio);
    try { if (window.CDSound) window.CDSound.start(); } catch (e) {}
  });

  var slot = null, game = null, startTime = 0, finished = false;

  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  /* ============ toast ============ */
  var toastT = 0;
  function toast(msg) {
    var t = $('cdToast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function () { t.classList.remove('on'); }, 2400);
  }

  /* ============ api given to games ============ */
  var api = {
    hud: function (s) {
      s = s || {};
      $('cdProgressFill').style.width = clamp((s.progress || 0) * 100, 0, 100) + '%';
      if (s.label) $('cdProgressLabel').textContent = s.label.toUpperCase();
    },
    finish: function () { completeSession(); },
    exit: function () { goBack(); },
    toast: toast
  };

  function goBack() {
    // Exit always exits: back through history when there is any, otherwise Missions.
    if (history.length > 1) history.back();
    else location.href = 'missions.html';
  }

  /* ============ slot resolution: Firestore → demo ============ */
  function db() {
    try {
      return (window.firebase && firebase.firestore) ? firebase.firestore() : null;
    } catch (e) { return null; }
  }
  function currentUid() {
    try {
      if (window.firebase && firebase.auth() && firebase.auth().currentUser)
        return firebase.auth().currentUser.uid;
    } catch (e) {}
    return 'anon';
  }

  async function resolveSlot() {
    var d = db();
    var slotParam = params.get('slot');
    if (slotParam && d) {
      try {
        var doc = await d.collection('lesson_slots').doc(slotParam).get();
        if (doc.exists) return Object.assign({ slotId: doc.id }, doc.data());
      } catch (e) { /* fall through to demo */ }
    }
    // ad-hoc: ?game=exposure-lab&version=v1&title=…&xp=50
    var g = params.get('game');
    if (g) {
      return {
        slotId: 'adhoc-' + g, game: g, version: params.get('version') || 'v1',
        title: params.get('title') || g, unit: 'SANDBOX', lesson: 'Free play',
        order: 0, xp: parseInt(params.get('xp') || '50', 10), config: {}
      };
    }
    var idx = parseInt(params.get('demo') || '0', 10);
    return DEMO_QUEUE[clamp(idx, 0, DEMO_QUEUE.length - 1)] || null;
  }

  function paintChrome(s) {
    $('cdCrumb').textContent = (s.unit || 'TRAINING') + ' · ' + (s.lesson || 'LESSON') +
      (s.order ? ' · SLOT ' + s.order : '');
    $('cdTitle').textContent = s.title || s.game;
    $('cdXpPill').textContent = 'UP TO ' + (s.xp || 0) + ' XP';
    document.title = (s.title || s.game) + ' — Cameras Decoded';
  }

  function showError(msg, retry) {
    veil.classList.remove('off');
    $('cdErr').hidden = false;
    $('cdErr').innerHTML = '<b>Could not start this game.</b><br>' + msg +
      (retry ? '<br><br><button class="cd-rbtn primary" style="max-width:220px" onclick="location.reload()">↻ RETRY</button>' : '');
  }

  /* ============ boot ============ */
  var demoIdx = -1;
  var visBound = false;

  function teardownGame() {
    if (game) {
      try { if (game.pause) game.pause(); } catch (e) {}
      try { game.destroy(); } catch (e) {}
      game = null;
    }
    stage.innerHTML = '';
  }

  async function startSlot(s) {
    teardownGame();
    finished = false;
    slot = s;
    paintChrome(slot);
    $('cdResult').classList.remove('on');
    $('cdProgressFill').style.width = '0%';
    $('cdProgressLabel').textContent = '';
    try {
      game = await window.CDGames.load(slot.game, slot.version || 'v1', 'games/');
    } catch (e) {
      showError('Game module "' + slot.game + '.' + (slot.version || 'v1') + '" failed to load.<br>' + e.message, true);
      return;
    }
    veil.classList.add('off');
    stage.classList.add('on');
    try {
      game.init(stage, slot.config || {}, api);
    } catch (e) {
      showError('Game crashed on start: ' + e.message, true);
      return;
    }
    startTime = Date.now();
    if (!visBound) { document.addEventListener('visibilitychange', onVis); visBound = true; }
  }

  async function boot() {
    var s = await resolveSlot();
    if (!s) { showError('No slot found. Use ?demo=0, ?game=&lt;id&gt;, or ?slot=&lt;firestore-id&gt;.', false); return; }
    demoIdx = DEMO_QUEUE.indexOf(s);
    startSlot(s);
  }

  function onVis() {
    if (!game) return;
    if (document.hidden) { if (game.pause) game.pause(); }
    else { if (game.resume) game.resume(); }
  }

  /* ============ session completion → XP → persistence ============ */
  async function completeSession() {
    if (finished || !game) return;
    finished = true;
    if (game.pause) game.pause();
    var snap = { score: 0, detail: {} };
    try { snap = game.getSnapshot() || snap; } catch (e) {}
    var score = clamp(Math.round(snap.score) || 0, 0, 100);
    var xp = slot.xp ? Math.round(slot.xp * score / 100) : 0;
    var durationMs = Date.now() - startTime;
    var tier = await resultTier(score);
    persist({ score: score, xp: xp, durationMs: durationMs, detail: snap.detail || {} });
    try { if (window.CDHaptics) window.CDHaptics[score >= 90 ? "bigSuccess" : "success"](); } catch (e) {}
    /* Bell: stamp activity for the resume nudge. */
    try { if (window.CDNotifs) window.CDNotifs.stampActivity(slot.title || "Game Arcade", "/arcade.html"); } catch (e) {}
    showResult(score, xp, durationMs, snap.detail || {}, tier);
  }

  /* Pick the result sting: first session on this slot → FIRST CONTACT,
     new personal best → BEST LOCK, 70+ → CLEAN SIGNAL, else SIGNAL DECODED.
     Firestore lookup is best-effort with a 1.2s timeout so the result screen
     never waits on the network; demo mode falls back to the score tier. */
  function baseTier(score) {
    return score >= 70
      ? { src: '/media/clean-signal-success.mp4', kick: 'CLEAN SIGNAL' }
      : { src: '/media/signal-decoded-success.mp4', kick: 'SIGNAL DECODED' };
  }
  async function resultTier(score) {
    var tier = baseTier(score);
    var d = db();
    if (!d || !slot || !slot.slotId) return tier;
    try {
      var qs = await Promise.race([
        d.collection('game_sessions').where('uid', '==', currentUid()).limit(100).get(),
        new Promise(function (_, rej) { setTimeout(function () { rej(new Error('tier-timeout')); }, 1200); })
      ]);
      var n = 0, best = -1;
      qs.forEach(function (doc) {
        var s = doc.data() || {};
        if (s.slotId === slot.slotId) {
          n++;
          if (typeof s.score === 'number' && s.score > best) best = s.score;
        }
      });
      if (!n) tier = { src: '/media/first-contact-success.mp4', kick: 'FIRST CONTACT' };
      else if (score > 0 && score > best) tier = { src: '/media/best-lock-success.mp4', kick: 'BEST LOCK' };
    } catch (e) {}
    return tier;
  }

  function persist(rec) {
    var d = db();
    if (!d || !slot || !slot.slotId) return; // demo mode: nothing to write to
    persistWithDailyXp(d, currentUid(), rec);
  }

  function localDayKey(d) {
    d = d || new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  /* First scored play of a slot each day also feeds the daily XP total
     (xpToday / totalPoints / xpByDay). Anti-farm: replays still record a
     session and count on the leaderboard, but don't re-bank. Sessions are
     append-only, so the banked flag is set at create time. */
  async function persistWithDailyXp(d, uid, rec) {
    var bank = false;
    if (rec.xp > 0 && uid) {
      try {
        var today = localDayKey();
        var qs = await Promise.race([
          d.collection('game_sessions').where('uid', '==', uid).limit(200).get(),
          new Promise(function (_, rej) { setTimeout(function () { rej(new Error('bank-check-timeout')); }, 3000); })
        ]);
        var seen = false;
        qs.forEach(function (doc) {
          var s = doc.data() || {};
          if (s.slotId !== slot.slotId || !(s.xp > 0)) return;
          var t = s.createdAt && s.createdAt.toDate ? s.createdAt.toDate() : null;
          if (t && localDayKey(t) === today) seen = true;
        });
        bank = !seen;
      } catch (e) { bank = false; }
    }
    try {
      await d.collection('game_sessions').add({
        uid: uid,
        slotId: slot.slotId, game: slot.game, version: slot.version || 'v1',
        score: rec.score, xp: rec.xp, durationMs: rec.durationMs,
        detail: rec.detail, bankedDaily: bank,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } catch (e) {}
    try { if (window.CDGear && uid) window.CDGear.trackArcade(d, uid, slot && slot.slotId); } catch (e) {} // gear: overdrive / arsenal progress
    if (bank) {
      // Feed the daily total. Day keys included so RewardEngine.award()'s
      // day-rollover reset can't wipe this XP (see darkroom-learn bankXp).
      // Day-aware: xpTodayDate (local) is the day authority — freshDay means
      // the stored total already belongs to today, so increment it; on a new
      // day set the first XP absolutely.
      try {
        var today = localDayKey();
        var F = firebase.firestore.FieldValue;
        var usnap = await d.collection('users').doc(uid).get().catch(function(){ return null; });
        var udata = (usnap && usnap.exists) ? usnap.data() : null;
        var freshDay = !!udata && udata.xpTodayDate === today;
        var upd = {
          totalPoints: F.increment(rec.xp),
          lastActivityDate: today, lastActiveDate: today,
          lastStreakDate: today, lastXpDate: today,
          recentActivity: F.arrayUnion({
            type: 'arcade_game', label: 'Arcade · ' + (slot.game || 'game'),
            time: 'Just now', xp: rec.xp
          })
        };
        if (freshDay) { upd.xpToday = F.increment(rec.xp); }
        else { upd.xpToday = rec.xp; upd.dailyXp = rec.xp; upd.xpTodayDate = today; }
        upd['xpByDay.' + today] = F.increment(rec.xp);
        await d.collection('users').doc(uid).set(upd, { merge: true });
      } catch (e) {}
    }
    try { updateLeaderboard(uid, rec.xp, 1); } catch (e) {} // best-effort
    try { if (window.CDStreak) window.CDStreak.touch(d, uid); } catch (e) {} // true day streak: any completed game counts
  }

  /* ============ leaderboard hook (best-effort; per-write caps in rules) ============ */
  var _lbName = null;
  function lbWeekKey(d) {
    d = d || new Date();
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = (t.getUTCDay() + 6) % 7;
    t.setUTCDate(t.getUTCDate() - day + 3);
    var first = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
    var week = 1 + Math.round(((t - first) / 864e5 - 3 + ((first.getUTCDay() + 6) % 7)) / 7);
    return t.getUTCFullYear() + '-W' + ('0' + week).slice(-2);
  }
  async function updateLeaderboard(uid, xp, plays) {
    var d = db();
    if (!d || !uid || !(xp > 0)) return;
    try {
      if (!_lbName) {
        var u = firebase.auth().currentUser;
        _lbName = (u && u.displayName) || null;
        if (!_lbName && u) {
          try {
            var ud = await d.collection('users').doc(u.uid).get();
            _lbName = (ud.data() || {}).displayName || (ud.data() || {}).name || null;
          } catch (e) {}
        }
        if (!_lbName) _lbName = 'Operator ' + String(uid).slice(0, 4);
      }
      var wk = lbWeekKey();
      var upd = {
        displayName: _lbName,
        xp: firebase.firestore.FieldValue.increment(xp),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      upd['weeks.' + wk] = firebase.firestore.FieldValue.increment(xp);
      if (plays) upd.plays = firebase.firestore.FieldValue.increment(plays);
      await d.collection('leaderboard').doc(uid).set(upd, { merge: true });
      if (window.CDBadges) CDBadges.award(uid, 'arcade-first', d);
    } catch (e) { /* leaderboard is best-effort */ }
  }

  /* Matrix-ish decode: glyphs cycle then resolve into the final text. */
  function decodeText(el, text, dur) {
    dur = dur || 1000;
    var glyphs = '█▓▒░<>\\/[]{}=+*^?#01';
    var t0 = null;
    function frame(t) {
      if (!t0) t0 = t;
      var p = Math.min((t - t0) / dur, 1), out = '';
      for (var i = 0; i < text.length; i++) {
        out += (i / text.length < p) ? text[i]
          : (text[i] === ' ' ? ' ' : glyphs[(Math.random() * glyphs.length) | 0]);
      }
      el.textContent = out;
      if (p < 1) requestAnimationFrame(frame); else el.textContent = text;
    }
    requestAnimationFrame(frame);
  }

  function showResult(score, xp, durationMs, detail, tier) {
    tier = tier || { src: '/media/signal-decoded-success.mp4', kick: 'SIGNAL DECODED' };
    var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var secs = Math.round(durationMs / 1000);
    $('cdDetail').innerHTML =
      'SIGNAL ' + score + ' / 100 · TIME ' + Math.floor(secs / 60) + ':' + ('0' + (secs % 60)).slice(-2) +
      (detail && detail.briefs ? '<br>BRIEFS ' + JSON.stringify(detail.briefs) : '') +
      (detail && detail.shotsTaken != null ? '<br>SHOTS ' + detail.shotsTaken + ' · CHALLENGES ' + (detail.challengesDone || 0) : '') +
      (detail && detail.summary ? '<br>' + detail.summary : '');
    // Terminal print: detail lines scroll up one by one.
    if (!RM) {
      var dEl = $('cdDetail');
      dEl.innerHTML = dEl.innerHTML.split(/<br\s*\/?>/i).map(function (ln, i) {
        return '<span class="cd-rline" style="animation-delay:' + (0.5 + i * 0.22).toFixed(2) + 's">' + ln + '</span>';
      }).join('<br>');
    }
    $('cdResult').classList.add('on');
    // Animated success backdrop: tiered 3s sting behind the overlaid text (plays once, fades to black).
    try {
      var rv = $('cdResultVideo');
      if (rv) {
        if (RM) rv.remove();
        else {
          var srcEl = rv.querySelector('source');
          if (srcEl && srcEl.getAttribute('src') !== tier.src) { srcEl.setAttribute('src', tier.src); rv.load(); }
          var vp = rv.play(); if (vp && vp.catch) vp.catch(function () {});
        }
      }
    } catch (e) {}
    var kick = $('cdKicker');
    if (kick) { if (RM) kick.textContent = tier.kick; else decodeText(kick, tier.kick, 1100); }
    window.CDGames.fx.countUp($('cdScoreNum'), score, 900);
    setTimeout(function () {
      $('cdXpLine').textContent = '+' + xp + ' XP';
      if (xp > 0) toast('+' + xp + ' XP banked');
    }, 500);
    if (window.CDGames) window.CDGames.blip(score >= 70 ? 880 : 440, 200);
  }

  /* ============ result buttons ============ */
  $('cdReplay').addEventListener('click', function () { location.reload(); });
  $('cdExitArcade').addEventListener('click', function () { location.href = '/arcade.html'; });
  $('cdNext').addEventListener('click', async function () {
    var d = db();
    // demo queue: swap in place — no page navigation, works in any viewer
    if (demoIdx !== -1 && DEMO_QUEUE[demoIdx + 1]) {
      demoIdx++;
      toast('Loading ' + DEMO_QUEUE[demoIdx].title + '…');
      startSlot(DEMO_QUEUE[demoIdx]);
      return;
    }
    if (d && slot.slotId && slot.slotId.indexOf('demo') !== 0 && slot.slotId.indexOf('adhoc') !== 0) {
      try {
        var qs = await d.collection('lesson_slots').where('unit', '==', slot.unit || '').get();
        var next = null;
        qs.forEach(function (doc) {
          var s = doc.data();
          if (s.order > (slot.order || 0) && (!next || s.order < next.order))
            next = Object.assign({ slotId: doc.id }, s);
        });
        if (next) { location.href = 'play.html?slot=' + next.slotId; return; }
      } catch (e) {}
    }
    // demo queue: after the last game, loop back to the start (handy for testing)
    if (demoIdx !== -1) {
      demoIdx = 0;
      toast('Queue complete — looping back to ' + DEMO_QUEUE[0].title + '.');
      setTimeout(function () { startSlot(DEMO_QUEUE[0]); }, 900);
      return;
    }
    toast('Queue complete — back to Missions.');
    setTimeout(goBack, 1200);
  });
  $('cdFinish').addEventListener('click', function () {
    if (window.CDGames) window.CDGames.fx.tap(10);
    completeSession();
  });
  $('cdExit').addEventListener('click', goBack);

  boot();
})();
</script>
