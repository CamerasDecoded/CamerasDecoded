<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog & Updates — Cameras Decoded</title>
  <meta name="description" content="Guides, gear breakdowns, and business advice for mirrorless operators — from Cameras Decoded.">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <meta property="og:title" content="Blog & Updates — Cameras Decoded">
  <meta property="og:description" content="Guides, gear breakdowns, and business advice for mirrorless operators.">
  <meta property="og:url" content="https://camerasdecoded.com/blog-updates.html">
  <meta property="og:type" content="website">

  <style>
    /* ... (all existing CSS remains identical; only additions shown) ... */
    /* Add these new styles */
    .save-btn {
      background: transparent;
      border: 1px solid #8deb00;
      border-radius: 6px;
      color: #8deb00;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      padding: 4px 10px;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    .save-btn:hover {
      background: rgba(141, 235, 0, 0.1);
      box-shadow: 0 0 10px rgba(141, 235, 0, 0.3);
    }
    .save-btn.saved {
      background: #8deb00;
      color: #000;
    }
    .post-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <!-- SIDEBAR (unchanged) -->
  <aside class="sidebar">
    <!-- ... same as original ... -->
  </aside>

  <main class="main-content">
    <!-- ... top nav, masthead, controls unchanged ... -->

    <div class="post-list" id="postList"></div>

    <footer class="footer">
      <!-- ... same footer ... -->
    </footer>
  </main>

  <!-- FIREBASE SCRIPTS -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script>
    // Firebase init (same as before)
    const firebaseConfig = {
      apiKey: "AIzaSyB95Vx0i8W6WNfUy1N4TNQyfN5xCxQYnz8",
      authDomain: "cameras-decoded.firebaseapp.com",
      projectId: "cameras-decoded",
      storageBucket: "cameras-decoded.firebasestorage.app",
      messagingSenderId: "1088920052790",
      appId: "1:1088920052790:web:2177c1fb31109c1fa02497",
      measurementId: "G-YN3M01WW0B"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // --- Post data (unchanged) ---
    const posts = [
      {
        slug: "blog-post-template",
        title: "This Is Your First Post Title",
        excerpt: "A one or two sentence summary of the post goes here — this shows on the index page to help readers decide whether to click in.",
        category: "Gear Guides",
        date: "July 28, 2026",
        readTime: "6 min read",
        image: "blog-images/example-first-post-thumb.jpg"
      }
    ];

    let activeCategory = 'All';

    function renderCategoryChips() { /* ... unchanged ... */ }
    function setCategory(cat) { activeCategory = cat; renderCategoryChips(); renderPosts(); }

    // --- Save to Dashboard function ---
    function saveItem(type, itemId) {
      const uid = localStorage.getItem('cameras_decoded_uid');
      if (!uid) {
        localStorage.setItem('pending_save_item', JSON.stringify({ type, itemId }));
        window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href);
        return;
      }

      const userRef = db.collection('users').doc(uid);
      const field = type === 'blog' ? 'savedBlogs' : 'savedItems';

      userRef.get().then((doc) => {
        const existing = doc.exists ? (doc.data()[field] || []) : [];
        if (existing.includes(itemId)) {
          // Already saved – toast notification (simple alert for now)
          alert('Already saved to your dashboard.');
          return;
        }
        existing.push(itemId);
        userRef.update({ [field]: existing }).then(() => {
          alert('⭐ Saved to your dashboard!');
          // Optionally update UI (e.g., change button state)
        }).catch(() => {
          userRef.set({ [field]: existing }, { merge: true })
            .then(() => alert('⭐ Saved to your dashboard!'))
            .catch(e => console.error(e));
        });
      });
    }

    // --- Render posts with save button ---
    function renderPosts() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const list = document.getElementById('postList');
      const filtered = posts.filter(p => {
        const matchCategory = activeCategory === 'All' || p.category === activeCategory;
        const matchSearch = p.title.toLowerCase().includes(search) || p.excerpt.toLowerCase().includes(search);
        return matchCategory && matchSearch;
      });
      if (filtered.length === 0) { list.innerHTML = '<div class="empty-state">No matching posts found.</div>'; return; }
      list.innerHTML = filtered.map(p => `
        <div class="post-row">
          <div class="post-thumb">
            <img src="${p.image}" alt="${p.title}" loading="lazy"
                 onerror="this.parentElement.innerHTML='<div class=\\'post-thumb-fallback\\'>📷</div>'">
          </div>
          <div class="post-info">
            <div class="post-category-tag">${p.category}</div>
            <a href="${p.slug}.html" class="post-title">${p.title}</a>
            <div class="post-excerpt">${p.excerpt}</div>
            <div class="post-meta">${p.date} · ${p.readTime}</div>
            <div class="post-actions">
              <button class="save-btn" onclick="event.preventDefault(); saveItem('blog', '${p.slug}')">💾 Save</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Initial render
    renderCategoryChips(); renderPosts();

    // --- Auth & Dashboard link (unchanged) ---
    const homeLink = document.getElementById('nav-home');
    document.querySelectorAll('#dashboardLink').forEach(el => el.remove());
    auth.onAuthStateChanged((user) => {
      const activeDynamicLink = document.getElementById('dynamic-dashboard-node');
      if (activeDynamicLink) activeDynamicLink.remove();
      if (user) {
        localStorage.setItem('cameras_decoded_uid', user.uid);
        const newDashboardLink = document.createElement('a');
        newDashboardLink.id = 'dynamic-dashboard-node';
        newDashboardLink.className = 'nav-item';
        newDashboardLink.innerText = 'Dashboard';
        newDashboardLink.href = 'operator-dashboard.html';
        if (homeLink && homeLink.parentNode) {
          homeLink.parentNode.insertBefore(newDashboardLink, homeLink);
        }
      } else {
        localStorage.removeItem('cameras_decoded_uid');
      }
    });

    // Mobile toggle (unchanged)
    document.addEventListener('DOMContentLoaded', function() {
      const mobileToggle = document.getElementById('mobileToggle');
      const closeToggle = document.getElementById('closeToggle');
      const navGroup = document.getElementById('navGroup');
      if (mobileToggle && closeToggle && navGroup) {
        mobileToggle.addEventListener('click', () => { navGroup.classList.add('open'); mobileToggle.style.display = 'none'; });
        closeToggle.addEventListener('click', () => { navGroup.classList.remove('open'); mobileToggle.style.display = 'block'; });
      }
    });
  </script>
</body>
</html>
