<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — Cameras Decoded</title>
  <meta name="description" content="Review your cart and checkout securely with Stripe.">

  <!-- ===== SHARED STYLES ===== -->
  <link rel="stylesheet" href="/styles/design-system.css" />
  <link rel="stylesheet" href="/styles/components.css" />
  <link rel="stylesheet" href="/styles/bottom-nav.css" />

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* ================================================================
       CART PAGE – production style
       ================================================================ */
    body {
      background: #050705;
      background-image: radial-gradient(circle at 20% 30%, rgba(141,235,0,0.12) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(141,235,0,0.08) 0%, transparent 45%),
                        linear-gradient(rgba(141,235,0,0.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(141,235,0,0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px, 24px 24px;
      background-attachment: fixed;
      color: var(--text-primary, #ffffff);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      max-width: 820px;
      margin: 80px auto 40px;
      padding: 0 20px 40px;
      width: 100%;
      position: relative;
      z-index: 2;
      animation: fadeSlideUp 0.6s ease forwards;
    }
    @media (max-width: 640px) {
      .main-content {
        margin-top: 100px;
        padding: 0 16px 20px;
      }
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border, #1A1A1A);
      padding-bottom: 16px;
    }
    .cart-header h1 {
      font-family: 'Space Mono', monospace;
      font-size: 26px;
      color: var(--green, #8deb00);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cart-header .back-link {
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      color: var(--green, #8deb00);
      transition: 0.2s;
    }
    .cart-header .back-link:hover {
      color: #a0f520;
      transform: translateX(-4px);
    }

    /* Floating header – same as other production pages */
    .floating-header {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 99;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 6px 14px; background: rgba(0,0,0,0.4); backdrop-filter: blur(16px);
      border: 1px solid rgba(141,235,0,0.2); border-radius: 30px; min-height: 40px;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    .floating-header:hover {
      background: rgba(0,0,0,0.6);
      box-shadow: 0 4px 30px rgba(0,0,0,0.3);
    }
    .floating-left-group, .floating-right-group {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .floating-center-group {
      display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center;
    }
    .floating-home-icon {
      font-size: 15px; color: var(--green, #8deb00); text-decoration: none;
      transition: transform 0.3s, color 0.3s;
    }
    .floating-home-icon:hover {
      color: #a0f520;
      transform: scale(1.1);
    }
    .role-tier-badge {
      background: rgba(10,10,10,0.9);
      border: 1px solid rgba(141,235,0,0.3);
      border-radius: 14px;
      padding: 2px 12px;
      font-size: 10px;
      color: var(--green, #8deb00);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: border-color 0.3s ease;
    }
    .role-tier-badge:hover {
      border-color: var(--green, #8deb00);
      box-shadow: 0 0 20px rgba(141,235,0,0.1);
    }
    .glow-role {
      font-weight: 700;
      text-shadow: 0 0 8px #8deb00, 0 0 12px #8deb00;
    }
    .logout-btn {
      background: transparent;
      border: 1px solid var(--green, #8deb00);
      color: var(--green, #8deb00);
      padding: 2px 10px;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      transition: all 0.25s, box-shadow 0.3s ease;
      min-height: 22px;
      line-height: 1.2;
    }
    .logout-btn:hover {
      background: rgba(141,235,0,0.1);
      box-shadow: 0 0 20px rgba(141,235,0,0.2);
      transform: scale(1.02);
    }
    .logout-btn:active {
      transform: scale(0.95);
    }
    .cart-header-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--green, #8deb00);
      border-radius: 20px;
      padding: 2px 10px;
      color: var(--green, #8deb00);
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      transition: all 0.25s, box-shadow 0.3s ease;
      text-decoration: none;
      min-height: 22px;
      line-height: 1.2;
    }
    .cart-header-link:hover {
      background: rgba(141,235,0,0.1);
      box-shadow: 0 0 20px rgba(141,235,0,0.2);
      transform: scale(1.02);
    }
    .cart-count-badge {
      background: var(--green, #8deb00);
      color: #000;
      border-radius: 50%;
      padding: 0 4px;
      font-size: 8px;
      font-weight: 700;
      display: inline-block;
      min-width: 14px;
      text-align: center;
      line-height: 14px;
    }

    /* ===== CHASING BORDER (for cart link) ===== */
    @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
    .chasing-border {
      position: relative;
      border-color: transparent !important;
      background-clip: padding-box;
      overflow: visible;
    }
    .chasing-border::before {
      content: '';
      position: absolute;
      inset: -1.5px;
      border-radius: inherit;
      padding: 1.5px;
      background: conic-gradient(from var(--angle), #8deb00, #00e5ff, #a0f520, #8deb00);
      -webkit-mask: linear-gradient(black, black) content-box, linear-gradient(black, black) border-box;
      -webkit-mask-composite: xor;
      mask: linear-gradient(black, black) content-box, linear-gradient(black, black) border-box;
      mask-composite: exclude;
      animation: spinBorder 4s linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    .chasing-border > * { position: relative; z-index: 1; }
    @keyframes spinBorder { to { --angle: 360deg; } }

    @media (max-width: 640px) {
      .floating-header {
        left: 10px; right: 10px; top: 70px;
        padding: 6px 12px;
      }
      .floating-center-group {
        font-size: 11px;
      }
    }

    /* ===== CART TABLE ===== */
    .cart-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 24px;
      background: var(--bg-panel, #0A0A0A);
      border: 1px solid var(--border, #1A1A1A);
      border-radius: 10px;
      overflow: hidden;
    }
    .cart-table th,
    .cart-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border, #1A1A1A);
      text-align: left;
    }
    .cart-table th {
      color: var(--green, #8deb00);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .cart-table td {
      color: var(--text-primary, #fff);
    }
    .qty-btn {
      background: transparent;
      border: 1px solid var(--border, #1A1A1A);
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      font-family: 'Space Mono', monospace;
      transition: 0.2s;
    }
    .qty-btn:hover {
      border-color: var(--green, #8deb00);
      color: var(--green, #8deb00);
    }
    .remove-btn {
      background: none;
      border: none;
      color: #ff4a4a;
      cursor: pointer;
      font-size: 16px;
      transition: 0.2s;
    }
    .remove-btn:hover {
      color: #ff6666;
    }

    .total-box {
      background: var(--bg-panel, #0A0A0A);
      border: 1px solid var(--green, #8deb00);
      border-radius: 8px;
      padding: 18px 24px;
      margin: 20px 0;
      text-align: center;
      font-family: 'Space Mono', monospace;
      font-size: 20px;
    }
    .total-box strong {
      color: var(--green, #8deb00);
    }

    .signal-message {
      border: 1px solid var(--border, #1A1A1A);
      border-radius: 8px;
      padding: 16px 20px;
      margin: 16px 0;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--green, #8deb00);
      background: rgba(141,235,0,0.03);
      text-align: center;
      line-height: 1.8;
    }
    .signal-message.too-many {
      border-color: #ffaa00;
      color: #ffaa00;
      background: rgba(255,170,0,0.05);
    }

    .checkout-btn {
      display: inline-block;
      padding: 14px 40px;
      background: var(--green, #8deb00);
      color: #000;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 12px;
      font-size: 16px;
      transition: 0.2s;
      border: none;
      cursor: pointer;
    }
    .checkout-btn:hover {
      background: #a0f520;
      box-shadow: 0 0 30px rgba(141,235,0,0.5);
      transform: scale(1.02);
    }
    .checkout-btn.disabled {
      background: #333;
      color: #666;
      pointer-events: none;
      cursor: not-allowed;
      border: 1px solid #444;
    }

    .empty-cart {
      text-align: center;
      color: var(--text-muted, #b4b4b4);
      font-family: 'Space Mono', monospace;
      padding: 60px 20px;
    }
    .empty-cart i {
      font-size: 48px;
      display: block;
      margin-bottom: 16px;
      color: var(--green, #8deb00);
    }
    .empty-cart a {
      color: var(--green, #8deb00);
      text-decoration: underline;
    }

    .footer {
      width: 100%;
      border-top: 1px solid var(--border, #1A1A1A);
      padding: 20px;
      margin-top: 40px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted, #b4b4b4);
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .footer a {
      color: var(--text-muted, #b4b4b4);
      transition: 0.2s;
    }
    .footer a:hover {
      color: var(--green, #8deb00);
    }

    @media (max-width: 600px) {
      .cart-table th,
      .cart-table td {
        padding: 10px 12px;
        font-size: 13px;
      }
      .total-box {
        font-size: 17px;
        padding: 14px 16px;
      }
      .checkout-btn {
        width: 100%;
        text-align: center;
        padding: 14px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- ===== FLOATING HEADER (shared with other pages) ===== -->
  <div class="floating-header">
    <div class="floating-left-group">
      <a href="index.html" class="floating-home-icon" title="Home"><i class="fas fa-home"></i></a>
      <span class="role-tier-badge" id="roleTierBadge" style="display:none;">
        <span class="glow-role" id="headerRole">Operator</span> · <span class="tier-text" id="headerTier">Free</span>
      </span>
    </div>
    <div class="floating-center-group"></div>
    <div class="floating-right-group">
      <a href="cart.html" class="cart-header-link chasing-border" id="cartHeaderLink">
        <i class="fas fa-shopping-cart"></i> <span id="cartHeaderLabel">Cart</span>
        <span class="cart-count-badge" id="cartHeaderCount" style="display:none;">0</span>
      </a>
      <button class="logout-btn" id="floatingLogoutBtn" style="display:none;" onclick="handleLogout()">Logout</button>
    </div>
  </div>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content">
    <div class="cart-header">
      <h1><i class="fas fa-shopping-cart" style="color:var(--green);"></i> Your Cart</h1>
      <a href="products.html" class="back-link"><i class="fas fa-arrow-left"></i> Continue Shopping</a>
    </div>

    <div id="cartContent">
      <!-- rendered by JS -->
    </div>
  </main>

  <!-- ===== BOTTOM NAV CONTAINER ===== -->
  <div id="bottomNavContainer"></div>

  <!-- ===== SHARED BOTTOM NAV SCRIPT ===== -->
  <script src="bottom-nav.js"></script>

  <!-- ===== FIREBASE SDKs ===== -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script>
    // ================================================================
    // FIREBASE CONFIG – same as other pages
    // ================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyB95Vx0i8W6WNfUy1N4TNQyfN5xCxQYnz8",
      authDomain: "cameras-decoded.firebaseapp.com",
      projectId: "cameras-decoded",
      storageBucket: "cameras-decoded.firebasestorage.app",
      messagingSenderId: "1088920052790",
      appId: "1:1088920052790:web:2177c1fb31109c1fa02497",
      measurementId: "G-YN3M01WW0B"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ================================================================
    // CART LOGIC
    // ================================================================
    function getCart() {
      return JSON.parse(localStorage.getItem('cameras_decoded_cart') || '[]');
    }
    function saveCart(cart) {
      localStorage.setItem('cameras_decoded_cart', JSON.stringify(cart));
      renderCart();
      updateCartUI();
    }

    function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cartContent');
      const distinctItems = cart.length;
      const singleItem = distinctItems === 1;
      const cartIsEmpty = distinctItems === 0;

      if (cartIsEmpty) {
        container.innerHTML = `<div class="empty-cart">
          <i class="fas fa-shopping-cart"></i>
          Your cart is empty.<br>
          <a href="products.html">Continue shopping</a>
        </div>`;
        return;
      }

      let html = `<table class="cart-table"><thead><tr>
        <th>Item</th><th>Price</th><th>Qty</th><th>Subtotal</th><th></th>
      </tr></thead><tbody>`;
      let total = 0;
      cart.forEach((item, index) => {
        const subtotal = item.price * item.qty;
        total += subtotal;
        html += `<tr>
          <td>${item.name}</td>
          <td>$${item.price.toFixed(2)}</td>
          <td>
            <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
            <span style="margin:0 8px;">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
          </td>
          <td>$${subtotal.toFixed(2)}</td>
          <td><button class="remove-btn" onclick="removeItem(${index})"><i class="fas fa-trash"></i></button></td>
        </tr>`;
      });
      html += '</tbody></table>';

      if (singleItem) {
        html += `<div class="signal-message">
          ✦ The Signal is transmitted one transmission at a time.<br>
          Instant delivery of your template requires a single‑item purchase.<br>
          Multiple items? They’ll be here when you return.
        </div>`;
      } else {
        html += `<div class="signal-message too-many">
          ⚡ Too many signals at once. Please reduce your cart to a single item before checkout.<br>
          Remove items or save them for your next transmission.
        </div>`;
      }

      html += `<div class="total-box">
        <span>Total: <strong>$${total.toFixed(2)}</strong></span>
      </div>`;

      const checkoutLink = (singleItem && cart[0].paymentLink && cart[0].paymentLink !== "#") ? cart[0].paymentLink : null;

      html += `<div style="text-align:center;">
        <a href="${checkoutLink || '#'}" target="${checkoutLink ? '_blank' : '_self'}" class="checkout-btn${checkoutLink ? '' : ' disabled'}" onclick="${checkoutLink ? '' : 'return false;'}">
          ${checkoutLink ? 'Checkout with Stripe →' : 'Payment link not available'}
        </a>`;
      if (checkoutLink) {
        html += `<p style="color:var(--text-muted); font-size:13px; margin-top:10px;">
          You'll be redirected to Stripe to complete your purchase at the exact amount shown.
        </p>`;
      } else {
        html += `<p style="color:var(--text-muted); font-size:13px; margin-top:10px;">
          Payment link not yet available for this product. Please check back soon.
        </p>`;
      }
      html += `</div>`;

      container.innerHTML = html;
    }

    window.changeQty = function(index, delta) {
      let cart = getCart();
      cart[index].qty += delta;
      if (cart[index].qty < 1) cart[index].qty = 1;
      saveCart(cart);
    };

    window.removeItem = function(index) {
      let cart = getCart();
      cart.splice(index, 1);
      saveCart(cart);
    };

    // ================================================================
    // CART UI (badge in header)
    // ================================================================
    function updateCartUI() {
      const cart = getCart();
      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      const countEl = document.getElementById('cartHeaderCount');
      const labelEl = document.getElementById('cartHeaderLabel');
      if (countEl) {
        countEl.textContent = totalItems;
        countEl.style.display = totalItems > 0 ? 'inline-block' : 'none';
      }
      if (labelEl) {
        labelEl.textContent = totalItems > 0 ? `Cart (${totalItems})` : 'Cart';
      }
    }

    // ================================================================
    // AUTH – update header role/tier
    // ================================================================
    function updateAuthUI(user) {
      const roleBadge = document.getElementById('roleTierBadge');
      const headerRole = document.getElementById('headerRole');
      const headerTier = document.getElementById('headerTier');
      const logoutBtn = document.getElementById('floatingLogoutBtn');

      if (user) {
        logoutBtn.style.display = 'inline-block';
        roleBadge.style.display = 'inline-flex';
        db.collection('users').doc(user.uid).get().then(doc => {
          if (doc.exists) {
            const data = doc.data();
            const role = data.role || 'Operator';
            const tier = data.tier || 'free';
            const tierLabel = tier === 'pro' ? 'Pro' : 'Free';
            headerRole.textContent = role;
            headerTier.textContent = tierLabel;
          }
        }).catch(() => {
          headerRole.textContent = 'Operator';
          headerTier.textContent = 'Free';
        });
      } else {
        logoutBtn.style.display = 'none';
        roleBadge.style.display = 'none';
      }
    }

    window.handleLogout = function() {
      auth.signOut().then(() => {
        localStorage.removeItem('cameras_decoded_uid');
        localStorage.removeItem('cameras_decoded_user');
        window.location.href = 'index.html';
      }).catch(() => {
        localStorage.clear();
        window.location.href = 'index.html';
      });
    };

    // ================================================================
    // AUTH LISTENER
    // ================================================================
    auth.onAuthStateChanged((user) => {
      updateAuthUI(user);
      if (user) {
        localStorage.setItem('cameras_decoded_uid', user.uid);
      } else {
        localStorage.removeItem('cameras_decoded_uid');
      }
    });

    // ================================================================
    // INIT
    // ================================================================
    renderCart();
    updateCartUI();

    // Re-render on storage changes (if cart updated in other tabs)
    window.addEventListener('storage', function(e) {
      if (e.key === 'cameras_decoded_cart') {
        renderCart();
        updateCartUI();
      }
    });
  </script>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <a href="terms.html">Privacy/Terms</a>
    <a href="mailto:signal@camerasdecoded.com">signal@camerasdecoded.com</a>
  </footer>

</body>
</html>
