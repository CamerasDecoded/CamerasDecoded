  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ================================================================
       CART — Cameras Decoded
       Shared slim header + bottom nav (mobile). Premium, quiet, mobile-first.
       ================================================================ */
    :root {
      --bg: #070708;
      --neon: #8deb00;
      --neon-bright: #a0f520;
      --card: rgba(16, 19, 16, 0.88);
      --card-solid: #101310;
      --border: rgba(255, 255, 255, 0.09);
      --text: #f2f4ec;
      --muted: #b4b4b4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: block !important;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 20% 0%, rgba(141, 235, 0, 0.07) 0%, transparent 45%),
        radial-gradient(circle at 85% 60%, rgba(141, 235, 0, 0.05) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1, h2, h3, .mono { font-family: 'Space Mono', monospace; }
    a { text-decoration: none; color: inherit; }

    .main-content {
      max-width: 820px;
      margin: 0 auto;
      padding: calc(58px + 28px) 24px 32px;
      animation: fadeIn 0.45s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    /* ---------- PAGE HEADER ---------- */
    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .cart-header h1 {
      font-size: 24px;
      color: var(--neon);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cart-header h1 i { color: var(--neon); }
    .cart-header .back-link {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--neon);
      transition: color 0.2s;
    }
    .cart-header .back-link:hover { color: var(--neon-bright); }

    /* ---------- CART TABLE ---------- */
    .cart-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .cart-table th,
    .cart-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .cart-table tbody tr:last-child td { border-bottom: none; }
    .cart-table th {
      color: var(--neon);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .cart-table td {
      color: var(--text);
      font-size: 14px;
    }

    .qty-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      width: 30px;
      height: 30px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-family: 'Space Mono', monospace;
      transition: border-color 0.2s, color 0.2s;
    }
    .qty-btn:hover {
      border-color: var(--neon);
      color: var(--neon);
    }
    .qty-btn:focus-visible,
    .remove-btn:focus-visible,
    .checkout-btn:focus-visible,
    .back-link:focus-visible {
      outline: 2px solid var(--neon);
      outline-offset: 2px;
    }
    .remove-btn {
      background: none;
      border: none;
      color: #ff4a4a;
      cursor: pointer;
      font-size: 16px;
      padding: 6px;
      transition: color 0.2s;
    }
    .remove-btn:hover { color: #ff7777; }

    /* ---------- TOTAL ---------- */
    .total-box {
      background: var(--card);
      border: 1px solid rgba(141, 235, 0, 0.35);
      border-radius: 12px;
      padding: 18px 24px;
      margin: 20px 0;
      text-align: center;
      font-family: 'Space Mono', monospace;
      font-size: 20px;
    }
    .total-box strong { color: var(--neon); }

    /* ---------- SIGNAL MESSAGE ---------- */
    .signal-message {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin: 16px 0;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--neon);
      background: rgba(141, 235, 0, 0.04);
      text-align: center;
      line-height: 1.8;
    }
    .signal-message.too-many {
      border-color: rgba(255, 170, 0, 0.4);
      color: #ffaa00;
      background: rgba(255, 170, 0, 0.05);
    }

    /* ---------- CHECKOUT CTA (the one loud CTA) ---------- */
    .checkout-btn {
      display: inline-block;
      padding: 15px 44px;
      background: var(--neon);
      color: #000;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      border-radius: 10px;
      margin-top: 12px;
      font-size: 16px;
      transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
      border: none;
      cursor: pointer;
    }
    .checkout-btn:hover {
      background: var(--neon-bright);
      box-shadow: 0 0 30px rgba(141, 235, 0, 0.45);
      transform: translateY(-1px);
    }
    .checkout-btn.disabled {
      background: #2a2d2a;
      color: #6b6f6b;
      pointer-events: none;
      cursor: not-allowed;
      border: 1px solid var(--border);
      box-shadow: none;
      transform: none;
    }

    /* ---------- EMPTY CART ---------- */
    .empty-cart {
      text-align: center;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      padding: 60px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      line-height: 1.8;
    }
    .empty-cart i {
      font-size: 44px;
      display: block;
      margin-bottom: 16px;
      color: var(--neon);
    }
    .empty-cart a {
      color: var(--neon);
      text-decoration: underline;
    }

    /* ---------- FOOTER ---------- */
    .footer {
      max-width: 820px;
      margin: 40px auto 0;
      border-top: 1px solid var(--border);
      padding: 24px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
    }
    .footer a {
      color: var(--muted);
      transition: color 0.2s;
    }
    .footer a:hover { color: var(--neon); }

    /* ---------- MOBILE ---------- */
    @media (max-width: 768px) {
      .main-content { padding: calc(58px + 20px) 18px 120px; }
      .cart-header h1 { font-size: 20px; }
      .cart-table th,
      .cart-table td {
        padding: 10px 12px;
        font-size: 13px;
      }
      .total-box { font-size: 17px; padding: 14px 16px; }
      .checkout-btn {
        width: 100%;
        text-align: center;
        padding: 15px 20px;
      }
    }

    /* ---------- REDUCED MOTION ---------- */
    @media (prefers-reduced-motion: reduce) {
      .main-content { animation: none; }
      .qty-btn, .remove-btn, .checkout-btn, .back-link, .footer a { transition: none; }
      .checkout-btn:hover { transform: none; }
    }
  </style>
</head>
<body>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content">
    <div class="cart-header">
      <h1><i class="fas fa-shopping-cart"></i> Your Cart</h1>
      <a href="products.html" class="back-link"><i class="fas fa-arrow-left"></i> Continue Shopping</a>
    </div>

    <div id="cartContent">
      <!-- rendered by JS -->
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <a href="terms.html">Privacy/Terms</a>
    <a href="mailto:signal@camerasdecoded.com">signal@camerasdecoded.com</a>
  </footer>

  <script>
    // ================================================================
    // CART LOGIC (unchanged from production)
    // ================================================================
    function getCart() {
      return JSON.parse(localStorage.getItem('cameras_decoded_cart') || '[]');
    }
    function saveCart(cart) {
      localStorage.setItem('cameras_decoded_cart', JSON.stringify(cart));
      renderCart();
      updateCartUI();
    }

    function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cartContent');
      const distinctItems = cart.length;
      const singleItem = distinctItems === 1;
      const cartIsEmpty = distinctItems === 0;

      if (cartIsEmpty) {
        container.innerHTML = `<div class="empty-cart">
          <i class="fas fa-shopping-cart"></i>
          Your cart is empty.<br>
          <a href="products.html">Continue shopping</a>
        </div>`;
        return;
      }

      let html = `<table class="cart-table"><thead><tr>
        <th>Item</th><th>Price</th><th>Qty</th><th>Subtotal</th><th></th>
      </tr></thead><tbody>`;
      let total = 0;
      cart.forEach((item, index) => {
        const subtotal = item.price * item.qty;
        total += subtotal;
        html += `<tr>
          <td>${item.name}</td>
          <td>$${item.price.toFixed(2)}</td>
          <td>
            <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
            <span style="margin:0 8px;">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
          </td>
          <td>$${subtotal.toFixed(2)}</td>
          <td><button class="remove-btn" onclick="removeItem(${index})"><i class="fas fa-trash"></i></button></td>
        </tr>`;
      });
      html += '</tbody></table>';

      if (singleItem) {
        html += `<div class="signal-message">
          ✦ The Signal is transmitted one transmission at a time.<br>
          Instant delivery of your template requires a single‑item purchase.<br>
          Multiple items? They’ll be here when you return.
        </div>`;
      } else {
        html += `<div class="signal-message too-many">
          ⚡ Too many signals at once. Please reduce your cart to a single item before checkout.<br>
          Remove items or save them for your next transmission.
        </div>`;
      }

      html += `<div class="total-box">
        <span>Total: <strong>$${total.toFixed(2)}</strong></span>
      </div>`;

      const checkoutLink = (singleItem && cart[0].paymentLink && cart[0].paymentLink !== "#") ? cart[0].paymentLink : null;

      html += `<div style="text-align:center;">
        <a href="${checkoutLink || '#'}" target="${checkoutLink ? '_blank' : '_self'}" class="checkout-btn${checkoutLink ? '' : ' disabled'}" onclick="${checkoutLink ? '' : 'return false;'}">
          ${checkoutLink ? 'Checkout with Stripe →' : 'Payment link not available'}
        </a>`;
      if (checkoutLink) {
        html += `<p style="color:var(--muted); font-size:13px; margin-top:10px;">
          You'll be redirected to Stripe to complete your purchase at the exact amount shown.
        </p>`;
      } else {
        html += `<p style="color:var(--muted); font-size:13px; margin-top:10px;">
          Payment link not yet available for this product. Please check back soon.
        </p>`;
      }
      html += `</div>`;

      container.innerHTML = html;
    }

    window.changeQty = function(index, delta) {
      let cart = getCart();
      cart[index].qty += delta;
      if (cart[index].qty < 1) cart[index].qty = 1;
      saveCart(cart);
    };

    window.removeItem = function(index) {
      let cart = getCart();
      cart.splice(index, 1);
      saveCart(cart);
    };

    // ================================================================
    // CART UI (header badge — no-ops safely when shared header owns it)
    // ================================================================
    function updateCartUI() {
      const cart = getCart();
      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      const countEl = document.getElementById('cartHeaderCount');
      const labelEl = document.getElementById('cartHeaderLabel');
      if (countEl) {
        countEl.textContent = totalItems;
        countEl.style.display = totalItems > 0 ? 'inline-block' : 'none';
      }
      if (labelEl) {
        labelEl.textContent = totalItems > 0 ? `Cart (${totalItems})` : 'Cart';
      }
    }

    // ================================================================
    // INIT
    // ================================================================
    renderCart();
    updateCartUI();

    // Re-render on storage changes (if cart updated in other tabs)
    window.addEventListener('storage', function(e) {
      if (e.key === 'cameras_decoded_cart') {
        renderCart();
        updateCartUI();
      }
    });
  </script>

  <script src="/scripts/ptr.js"></script>

</body>
</html>
