<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — Cameras Decoded</title>
  <meta name="description" content="Review your cart and checkout securely with Stripe.">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #000000;
      background-image: radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 24px 24px;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      line-height: 1.6;
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 600px;
      background: linear-gradient(180deg, rgba(29, 179, 27, 0.30) 0%, transparent 100%);
      pointer-events: none;
      z-index: -1;
    }
    h1, h2, h3, .mono { font-family: 'Space Mono', monospace; }
    .green-text { color: #8deb00; }
    .grey-text { color: #b4b4b4; }
    a { text-decoration: none; color: inherit; transition: 0.2s; }

    .cart-wrapper {
      width: 100%;
      max-width: 800px;
      padding: 40px 20px 20px 20px;
      margin: 0 auto;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 30px;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      color: #8deb00;
      transition: 0.2s;
    }
    .back-link:hover { color: #a0f520; transform: translateX(-4px); }

    .cart-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
      background: #0A0A0A;
      border: 1px solid #1A1A1A;
      border-radius: 10px;
      overflow: hidden;
    }
    .cart-table th, .cart-table td {
      padding: 16px;
      border-bottom: 1px solid #1A1A1A;
      text-align: left;
    }
    .cart-table th {
      color: #8deb00;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      text-transform: uppercase;
    }
    .qty-btn {
      background: transparent;
      border: 1px solid #1A1A1A;
      color: #fff;
      width: 32px; height: 32px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      font-family: 'Space Mono', monospace;
    }
    .qty-btn:hover { border-color: #8deb00; color: #8deb00; }
    .remove-btn { background: none; border: none; color: #ff4444; cursor: pointer; font-size: 16px; }
    .remove-btn:hover { color: #ff6666; }

    .total-amount-box {
      background: #0A0A0A;
      border: 1px solid #8deb00;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
      text-align: center;
      font-family: 'Space Mono', monospace;
    }

    .checkout-btn {
      display: inline-block;
      padding: 14px 40px;
      background: #8deb00;
      color: #000;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 20px;
      font-size: 16px;
      transition: 0.2s;
    }
    .checkout-btn:hover { background: #a0f520; box-shadow: 0 0 20px rgba(141,235,0,0.5); }
    .checkout-btn.disabled {
      background: #333;
      color: #666;
      pointer-events: none;
      cursor: not-allowed;
      border: 1px solid #444;
    }

    .empty-cart {
      text-align: center;
      color: #b4b4b4;
      font-family: 'Space Mono', monospace;
      padding: 40px;
    }
    .signal-message {
      border: 1px solid #1A1A1A;
      border-radius: 8px;
      padding: 18px 24px;
      margin: 20px 0;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: #8deb00;
      background: rgba(141, 235, 0, 0.03);
      text-align: center;
      line-height: 1.8;
    }
    .signal-message.too-many {
      border-color: #ffaa00;
      color: #ffaa00;
      background: rgba(255, 170, 0, 0.05);
    }

    .footer {
      width: 100%;
      border-top: 1px solid #1A1A1A;
      padding: 20px;
      margin-top: 60px;
      text-align: center;
      font-size: 12px;
      color: #b4b4b4;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .footer a { color: #b4b4b4; }
    .footer a:hover { color: #8deb00; }

    @media (max-width: 600px) {
      .cart-wrapper { padding: 20px 15px; }
      .cart-table th, .cart-table td { padding: 10px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="cart-wrapper">
    <a href="products.html" class="back-link">← Back to Products</a>
    <h1 style="font-family:'Space Mono',monospace; color:#8deb00; margin-bottom:30px;">Your Cart</h1>
    <div id="cartContent"></div>
  </div>

  <footer class="footer">
    <a href="terms.html">Privacy/Terms</a>
    <a href="mailto:signal@camerasdecoded.com">signal@camerasdecoded.com</a>
  </footer>

  <script>
    function getCart() {
      return JSON.parse(localStorage.getItem('cameras_decoded_cart') || '[]');
    }
    function saveCart(cart) {
      localStorage.setItem('cameras_decoded_cart', JSON.stringify(cart));
      renderCart();
    }

    function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cartContent');
      const distinctItems = cart.length;
      const singleItem = distinctItems === 1;
      const cartIsEmpty = distinctItems === 0;

      if (cartIsEmpty) {
        container.innerHTML = `<div class="empty-cart">
          <i class="fas fa-shopping-cart" style="font-size:48px; display:block; margin-bottom:15px;"></i>
          Your cart is empty.<br>
          <a href="products.html" style="color:#8deb00; text-decoration:underline;">Continue shopping</a>
        </div>`;
        return;
      }

      let html = '<table class="cart-table"><thead><tr><th>Item</th><th>Price</th><th>Qty</th><th>Subtotal</th><th></th></tr></thead><tbody>';
      let total = 0;
      cart.forEach((item, index) => {
        const subtotal = item.price * item.qty;
        total += subtotal;
        html += `<tr>
          <td>${item.name}</td>
          <td>$${item.price.toFixed(2)}</td>
          <td>
            <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
            <span style="margin:0 8px;">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
          </td>
          <td>$${subtotal.toFixed(2)}</td>
          <td><button class="remove-btn" onclick="removeItem(${index})"><i class="fas fa-trash"></i></button></td>
        </tr>`;
      });
      html += '</tbody></table>';

      if (singleItem) {
        html += `<div class="signal-message">
          ✦ The Signal is transmitted one transmission at a time.<br>
          Instant delivery of your template requires a single‑item purchase.<br>
          Multiple items? They’ll be here when you return.
        </div>`;
      } else {
        html += `<div class="signal-message too-many">
          ⚡ Too many signals at once. Please reduce your cart to a single item before checkout.<br>
          Remove items or save them for your next transmission.
        </div>`;
      }

      html += `<div class="total-amount-box">
        <span style="font-size:20px;">Total: <strong>$${total.toFixed(2)}</strong></span>
      </div>`;

      const checkoutLink = singleItem && cart[0].paymentLink && cart[0].paymentLink !== "#" ? cart[0].paymentLink : null;

      html += `<div style="text-align:center;">
        <a href="${checkoutLink || '#'}" target="${checkoutLink ? '_blank' : '_self'}" class="checkout-btn${checkoutLink ? '' : ' disabled'}" onclick="${checkoutLink ? '' : 'return false;'}">Checkout with Stripe →</a>`;
      
      if (checkoutLink) {
        html += `<p style="color:#b4b4b4; font-size:13px; margin-top:10px;">
          You'll be redirected to Stripe to complete your purchase at the exact amount shown.
        </p>`;
      } else {
        html += `<p style="color:#b4b4b4; font-size:13px; margin-top:10px;">
          Payment link not yet available for this product. Please check back soon.
        </p>`;
      }
      html += `</div>`;

      container.innerHTML = html;
    }

    window.changeQty = function(index, delta) {
      let cart = getCart();
      cart[index].qty += delta;
      if (cart[index].qty < 1) cart[index].qty = 1;
      saveCart(cart);
    };

    window.removeItem = function(index) {
      let cart = getCart();
      cart.splice(index, 1);
      saveCart(cart);
    };

    // Initial render
    renderCart();
  </script>
</body>
</html>
