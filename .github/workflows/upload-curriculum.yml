name: Upload Field Manual curriculum

# Private curriculum delivery: writes a manual's curriculum to
# Firestore as TWO docs — guideContent/<manual> (the free chapters,
# public read) and guideContent/<manual>_pro (the Pro chapters,
# Pro-only read). See tools/curriculum-uploader/upload.js. Field
# Manuals is a library — each manual's curriculum is its own pair of
# docs in the same collection. The curriculum itself is NEVER
# committed to this repo — it arrives per-run as a workflow_dispatch
# input (base64), so nothing private touches git.
#
# One-time setup (owner):
#   1. Firebase console → Project settings → Service accounts →
#      "Generate new private key" (downloads a JSON file).
#   2. GitHub repo → Settings → Secrets and variables → Actions →
#      New repository secret named FIREBASE_SERVICE_ACCOUNT,
#      paste the whole JSON.
# After that, curriculum updates are dispatched via the API —
# no console trips, no secrets in chat.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Curriculum version string (e.g. 2026-09-21-visuals)'
        required: true
      curriculum_b64:
        description: 'Base64 of JSON.stringify({ version, chapters })'
        required: true
      manual:
        description: 'Manual id — the guideContent doc to write (curriculum = Manual 01, finish = Manual 02 The Finish)'
        required: false
        default: 'curriculum'
      free_chapters:
        description: 'Optional: opening chapters that are free for this manual (blank = uploader default from scripts/manuals.js: curriculum 3, finish 1). The upload writes the free doc + the <manual>_pro doc.'
        required: false
        default: ''

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install firebase-admin
        run: npm install
        working-directory: tools/curriculum-uploader
      - name: Upload curriculum to Firestore
        run: node upload.js
        working-directory: tools/curriculum-uploader
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CURRICULUM_VERSION: ${{ inputs.version }}
          CURRICULUM_B64: ${{ inputs.curriculum_b64 }}
          CURRICULUM_MANUAL: ${{ inputs.manual }}
          CURRICULUM_FREE_CHAPTERS: ${{ inputs.free_chapters }}
