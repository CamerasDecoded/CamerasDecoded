name: Blog to Feed

on:
  push:
    branches: [main]
    paths: ['blog/*.html']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install feed-writer deps
        run: npm install
        working-directory: tools/feed-writer
      - name: Publish all posts to feed
        working-directory: tools/feed-writer
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          published=0
          failed=0
          for f in "$GITHUB_WORKSPACE"/blog/*.html; do
            slug=$(basename "$f" .html)
            RAW_TITLE=$(grep -o '<title>[^<]*</title>' "$f" | sed 's/<[^>]*>//g' | head -1)
            TITLE=$(printf '%s' "$RAW_TITLE" | python3 -c "import html,sys; sys.stdout.write(html.unescape(sys.stdin.read().strip()))")
            TITLE=${TITLE% — Cameras Decoded}
            TITLE=${TITLE% - Cameras Decoded}
            [ -z "$TITLE" ] && TITLE="$slug"
            IMG=$(grep -o '<meta[^>]*property="og:image"[^>]*>' "$f" | grep -o 'content="[^"]*"' | cut -d'"' -f2 | head -1)
            echo "Publishing: $TITLE"
            if [ -n "$IMG" ]; then
              node feed-writer.js --type blog_post --title "$TITLE" \
                --actionUrl "https://camerasdecoded.com/blog/${slug}.html" \
                --actionLabel "Read" --targetId "$slug" --imageUrl "$IMG" \
                && published=$((published+1)) || failed=$((failed+1))
            else
              node feed-writer.js --type blog_post --title "$TITLE" \
                --actionUrl "https://camerasdecoded.com/blog/${slug}.html" \
                --actionLabel "Read" --targetId "$slug" \
                && published=$((published+1)) || failed=$((failed+1))
            fi
          done
          echo "Feed publish complete: $published ok, $failed failed"
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed post(s) failed to publish to the feed"
            exit 1
          fi
