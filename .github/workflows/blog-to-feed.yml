name: Blog to Feed

on:
  push:
    branches: [main]
    paths: ['blog/*.html']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install feed-writer deps
        run: npm install
        working-directory: tools/feed-writer
      - name: Publish posts to feed
        working-directory: tools/feed-writer
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # One-time backfill for 2026-10-12 posts (hardcoded, no input needed)
          for slug in night-photography-everyday-places raising-blacks-lightroom-sunset-glow bayer-filter-colorblind-sensor; do
            f="$GITHUB_WORKSPACE/blog/${slug}.html"
            if [ ! -f "$f" ]; then echo "Not found: $f"; continue; fi
            TITLE=$(grep -o '<title>[^<]*</title>' "$f" | sed 's/<[^>]*>//g' | head -1)
            [ -z "$TITLE" ] && TITLE="$slug"
            echo "Publishing: $TITLE"
            node feed-writer.js \
              --type blog_post \
              --title "$TITLE" \
              --actionUrl "https://camerasdecoded.com/blog/${slug}.html" \
              --actionLabel "Read" \
              --targetId "$slug"
          done
