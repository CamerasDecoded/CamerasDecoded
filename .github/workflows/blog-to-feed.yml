name: Blog to Feed

# Auto: when new blog posts merge to main, publish them to the feed as editorial cards.
# One-time backfill: run manually (Actions -> Blog to Feed -> Run workflow) and paste
# the merge commit SHA of the blog PR to backfill (e.g. PR #570's "merged commit" code).
# The file stays as-is afterwards -- future posts keep publishing automatically.
#
# Uses tools/feed-writer/feed-writer.js with the FIREBASE_SERVICE_ACCOUNT secret
# (same secret as the arena closer).

on:
  push:
    branches: [main]
    paths: ['blog/*.html']
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Merge commit SHA of the blog PR to backfill (copy it from the PR page, next to "merged commit")'
        required: true
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install feed-writer deps
        run: npm install
        working-directory: tools/feed-writer
      - name: Publish posts to feed
        working-directory: tools/feed-writer
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RANGE="${{ inputs.commit_sha }}~1 ${{ inputs.commit_sha }}"
          else
            RANGE="HEAD~1 HEAD"
          fi
          NEW_FILES=$(git diff --name-only --diff-filter=A $RANGE -- 'blog/*.html')
          if [ -z "$NEW_FILES" ]; then
            echo "No new blog posts in that commit."
            exit 0
          fi
          echo "$NEW_FILES" | while read -r f; do
            SLUG=$(basename "$f" .html)
            TITLE=$(grep -o '<title>[^<]*</title>' "$GITHUB_WORKSPACE/$f" | sed 's/<[^>]*>//g' | head -1)
            if [ -z "$TITLE" ]; then TITLE="$SLUG"; fi
            echo "Publishing: $TITLE"
            node feed-writer.js \
              --type blog_post \
              --title "$TITLE" \
              --actionUrl "https://camerasdecoded.com/blog/${SLUG}.html" \
              --actionLabel "Read" \
              --targetId "$SLUG"
          done
