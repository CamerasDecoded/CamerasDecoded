name: Pro requests report

# Hourly snapshot of the pending Pro-request queue for the owner-side
# watcher: reads proRequests where status == 'pending' and publishes a
# tiny machine-readable status file to the dedicated `watch-state`
# branch (pro-requests.json). The agent-side check diffs that file each
# hour and only wakes the owner when a NEW pending request appears —
# no tokens burned on empty checks.
#
# Service-account pattern mirrors cynetis-daily-post.yml exactly: the whole
# Firebase service-account JSON lives in the FIREBASE_SERVICE_ACCOUNT
# repo secret. No secrets in chat, no secrets committed.
#
# Failure behavior (in report.js): a Firestore read failure exits non-zero
# WITHOUT touching the status file — a stale file is honest, a wrong empty
# one would fake "no requests".
#
# Cadence: hourly at :07 UTC (off the round hour). Runonce/manual
# dispatch exists for testing after merge.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pro-requests-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install firebase-admin
        run: npm install --prefix /tmp/prr firebase-admin@^12.7.0 --no-audit --no-fund
      - name: Write pending-requests status file
        working-directory: tools/pro-requests
        run: NODE_PATH=/tmp/prr/node_modules node report.js
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
