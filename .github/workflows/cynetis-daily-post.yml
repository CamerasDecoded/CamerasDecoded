name: Cynetis-7 daily post

# Once a day, Cynetis-7 posts a transmission (field tip or shoot prompt)
# to the Signal as itself. The writer is idempotent — the doc id is the
# Chicago date — so a manual re-run never double-posts.
#
# Service-account pattern mirrors arena-close.yml exactly: the whole
# Firebase service-account JSON lives in the FIREBASE_SERVICE_ACCOUNT
# repo secret. No secrets in chat, no secrets committed.
#
# Cadence: scheduled 08:00 UTC daily. GitHub's scheduler runs this repo's
# workflows ~4.5h late (observed Oct 15–20), so the post actually lands
# ~7:30 AM Chicago — a morning post; the pick itself rolls over at Chicago
# midnight. (Was 12:30 UTC until 2026-10-20, which drifted to ~noon Chicago;
# the owner chose the earlier schedule so the Signal Room morning post is
# live by 7:30 AM.)

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install firebase-admin
        run: npm install
        working-directory: tools/cynetis-post
      - name: Post today's transmission
        run: node post.js
        working-directory: tools/cynetis-post
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
