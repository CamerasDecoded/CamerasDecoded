name: Arena Round Repair (one-off)

# One-off repair for the Oct 2026 lane incident: daily rounds written with
# lane='daily' are invisible to the arena closer (it only advances/closes
# lane='challenge'/'mission'). This workflow runs
# tools/arena-round-repair/repair.py with the Firebase service account to
# relabel current rounds, quiet-close stale pre-launch rounds, and print a
# mission-lane readiness report (brief queue + mission rounds).
#
# Manual trigger only. Idempotent — safe to re-run; a second run finds no
# legacy labels and writes nothing. Safe to delete once the repair has run.
#
# Required repo secret:
#   FIREBASE_SERVICE_ACCOUNT — whole service-account JSON (already exists;
#                              same secret the arena workflows use).

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install firebase-admin

      - name: Repair arena rounds
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 ${{ github.workspace }}/tools/arena-round-repair/repair.py 2>&1 | tail -60
