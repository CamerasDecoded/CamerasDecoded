<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <title>Suggestions — Cameras Decoded</title>
  <meta name="description" content="Tell us what to build. Vote on ideas, watch them ship." />
  <script src="/scripts/master-loader.js?v=20261019a"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/scripts/firebase-init.js?v=20261007b"></script>
  <script src="/scripts/user-state.js?v=20261014a"></script>
  <script src="header.js?v=20261002a"></script>
  <script src="/scripts/desktop-sidebar.js?v=20261019a"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
:root{--green:#8deb00;--green-soft:rgba(141,235,0,.12);--green-border:rgba(141,235,0,.35);
--bg:#070807;--surface:#0e0f0e;--surface-2:#121312;--text:#fff;--muted:#a9b8a2;--muted-2:#6f7d68;
--border:rgba(255,255,255,.09);--gold:#f5c044;--blue:#4da6ff;--red:#ff5c6c;
--font-d:'Space Mono',monospace;--font-b:'Montserrat',sans-serif;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{display:block !important;justify-content:normal !important;align-items:normal !important;
padding:0 !important;padding-top:calc(env(safe-area-inset-top,0px) + 80px) !important;
background:var(--bg);color:var(--text);font-family:var(--font-b);min-height:100dvh}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 120px}
.title{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.title img{height:32px}
.title h1{font-family:var(--font-d);font-size:18px;letter-spacing:.08em}
.btn-new{font-family:var(--font-d);font-size:12px;color:#0a0a0a;background:var(--green);
border:none;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
/* suggestion card */
.sug{background:var(--surface);border:1px solid var(--border);border-radius:16px;
padding:16px;margin-bottom:12px;animation:fadeUp .4s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sug-top{display:flex;align-items:flex-start;gap:12px}
.vote-btn{flex-shrink:0;width:52px;background:var(--surface-2);border:1px solid var(--border);
border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer;color:var(--muted)}
.vote-btn .count{font-family:var(--font-d);font-size:16px;font-weight:700;color:var(--text);display:block}
.vote-btn .label{font-family:var(--font-d);font-size:9px;letter-spacing:.06em}
.vote-btn.voted{border-color:var(--green-border);background:var(--green-soft)}
.vote-btn.voted .count{color:var(--green)}
.sug-body{flex:1;min-width:0}
.sug-title{font-weight:700;font-size:15px;margin-bottom:4px}
.sug-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:8px}
.sug-meta{display:flex;align-items:center;gap:8px;font-family:var(--font-d);font-size:10px;color:var(--muted-2)}
.status{font-family:var(--font-d);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
border-radius:6px;padding:3px 8px;border:1px solid var(--border)}
.status.open{color:var(--muted);border-color:var(--border)}
.status.planned{color:var(--blue);border-color:rgba(77,166,255,.35);background:rgba(77,166,255,.1)}
.status.shipped{color:var(--green);border-color:var(--green-border);background:var(--green-soft)}
.status.declined{color:var(--red);border-color:rgba(255,92,108,.35);background:rgba(255,92,108,.1)}
.admin-row{margin-top:10px;display:none;gap:8px}
.admin-row.open{display:flex}
.admin-row select{background:var(--surface-2);border:1px solid var(--border);color:var(--text);
border-radius:8px;padding:8px;font-family:var(--font-d);font-size:12px}
/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.8);display:none;
align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;
width:100%;max-width:640px;padding:24px 20px 40px;animation:slideUp .3s var(--ease)}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--font-d);font-size:16px;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-family:var(--font-d);font-size:11px;color:var(--muted);margin-bottom:6px;letter-spacing:.06em}
.field input,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);
border-radius:10px;color:var(--text);font-family:var(--font-b);font-size:14px;padding:12px}
.field textarea{min-height:80px;resize:vertical}
.sheet-actions{display:flex;gap:10px;margin-top:8px}
.btn-cancel{flex:1;background:transparent;border:1px solid var(--border);color:var(--muted);
border-radius:10px;padding:12px;font-family:var(--font-d);font-size:13px;cursor:pointer}
.btn-create{flex:2;background:var(--green);border:none;color:#0a0a0a;border-radius:10px;
padding:12px;font-family:var(--font-d);font-size:13px;font-weight:700;cursor:pointer}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.loading{text-align:center;padding:40px;color:var(--muted-2);font-family:var(--font-d);font-size:13px}
@media(min-width:768px){.wrap{padding-top:24px}.modal{align-items:center}.sheet{border-radius:20px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">
      <div style="display:flex;align-items:center;gap:12px">
        <img src="/custom-site-titles/suggestions.png?v=20261011a" alt="Suggestions"
          onerror="this.style.display='none';this.nextElementSibling.hidden=false;" />
        <h1 hidden>SUGGESTIONS</h1>
      </div>
      <button class="btn-new" id="btnNew">+ Suggest</button>
    </div>
    <div id="sugList"><div class="loading">Reading the room…</div></div>
  </div>

  <div class="modal" id="createModal">
    <div class="sheet">
      <h2>SUGGEST AN IDEA</h2>
      <div class="field"><label>TITLE</label><input id="fTitle" maxlength="80" placeholder="e.g. Dark mode for the blog" /></div>
      <div class="field"><label>DETAILS</label><textarea id="fDesc" maxlength="500" placeholder="What should it do and why?"></textarea></div>
      <div class="sheet-actions">
        <button class="btn-cancel" id="btnCancel">Cancel</button>
        <button class="btn-create" id="btnPost">Submit Idea</button>
      </div>
    </div>
  </div>

<script>
(function(){
const list=document.getElementById('sugList');
let isAdmin=false, myVotes=new Set();
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function timeAgo(ts){ if(!ts) return ''; const ms=ts.toMillis?ts.toMillis():(ts.seconds*1000);
  const s=Math.floor((Date.now()-ms)/1000);
  if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; }

async function init(){
  if(typeof firebase==='undefined'||!firebase.apps||!firebase.apps.length){
    list.innerHTML='<div class="empty"><div>No connection.</div></div>'; return;
  }
  const u=firebase.auth().currentUser;
  if(u){
    try{
      const udoc=await firebase.firestore().collection('users').doc(u.uid).get();
      isAdmin=udoc.exists&&udoc.data().role==='admin';
      const vsnap=await firebase.firestore().collectionGroup('votes').where('uid','==',u.uid).get();
      vsnap.forEach(d=>{ const sid=d.ref.parent.parent.id; myVotes.add(sid); });
    }catch(e){}
  }
  loadSuggestions();
}

async function loadSuggestions(){
  try{
    const snap=await firebase.firestore().collection('suggestions')
      .orderBy('voteCount','desc').limit(50).get();
    if(snap.empty){
      list.innerHTML='<div class="empty"><div style="font-size:40px;margin-bottom:12px">◌</div><div>No ideas yet.<br/>Be the first to suggest something.</div></div>';
      return;
    }
    list.innerHTML='';
    snap.forEach(doc=>{
      const d=doc.data(), sid=doc.id, voted=myVotes.has(sid);
      const el=document.createElement('div'); el.className='sug';
      el.innerHTML=
        `<div class="sug-top">`+
          `<div class="vote-btn${voted?' voted':''}" data-sid="${sid}">`+
            `<span class="count">${d.voteCount||0}</span><span class="label">VOTES</span></div>`+
          `<div class="sug-body">`+
            `<div class="sug-title">${esc(d.title)}</div>`+
            (d.description?`<div class="sug-desc">${esc(d.description)}</div>`:'')+
            `<div class="sug-meta"><span class="status ${d.status||'open'}">${d.status||'open'}</span>`+
            `<span>by ${esc(d.authorName||'Operator')}</span><span>${timeAgo(d.createdAt)}</span></div>`+
            `<div class="admin-row${isAdmin?' open':''}">`+
              `<select data-sid="${sid}" class="statusSel">`+
                ['open','planned','shipped','declined'].map(s=>
                  `<option value="${s}"${(d.status||'open')===s?' selected':''}>${s}</option>`).join('')+
              `</select></div>`+
          `</div></div>`;
      list.appendChild(el);
    });
    /* wire votes */
    list.querySelectorAll('.vote-btn').forEach(b=>{
      b.onclick=()=>toggleVote(b.dataset.sid, b);
    });
    /* wire admin status */
    list.querySelectorAll('.statusSel').forEach(sel=>{
      sel.onchange=()=>setStatus(sel.dataset.sid, sel.value);
    });
  }catch(e){ list.innerHTML='<div class="empty"><div>Could not load suggestions.</div></div>'; }
}

async function toggleVote(sid, btn){
  const u=firebase.auth().currentUser;
  if(!u){ location.href='/login.html?next=/suggestions.html'; return; }
  const db=firebase.firestore(), vref=db.collection('suggestions').doc(sid).collection('votes').doc(u.uid);
  try{
    if(myVotes.has(sid)){
      await vref.delete();
      await db.collection('suggestions').doc(sid).update({voteCount:firebase.firestore.FieldValue.increment(-1)});
      myVotes.delete(sid);
    }else{
      await vref.set({uid:u.uid, createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      await db.collection('suggestions').doc(sid).update({voteCount:firebase.firestore.FieldValue.increment(1)});
      myVotes.add(sid);
    }
    loadSuggestions();
  }catch(e){}
}

async function setStatus(sid, status){
  if(!isAdmin) return;
  try{
    await firebase.firestore().collection('suggestions').doc(sid).update({status:status});
    loadSuggestions();
  }catch(e){}
}

/* create */
const modal=document.getElementById('createModal');
document.getElementById('btnNew').onclick=()=>{
  const u=firebase.auth().currentUser;
  if(!u){ location.href='/login.html?next=/suggestions.html'; return; }
  modal.classList.add('open');
};
document.getElementById('btnCancel').onclick=()=>modal.classList.remove('open');
modal.onclick=(e)=>{ if(e.target===modal) modal.classList.remove('open'); };
document.getElementById('btnPost').onclick=async()=>{
  const title=document.getElementById('fTitle').value.trim();
  const desc=document.getElementById('fDesc').value.trim();
  if(!title) return;
  const u=firebase.auth().currentUser; if(!u) return;
  const userName=(window.USER&&window.USER.name)||u.displayName||'Operator';
  const db=firebase.firestore();
  try{
    const ref=await db.collection('suggestions').add({
      title:title, description:desc, authorUid:u.uid, authorName:userName,
      status:'open', voteCount:0,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    /* feed: new suggestion (best-effort) */
    try{
      await db.collection('feedItems').add({
        type:'suggestion', actorUid:u.uid, actorName:userName,
        actorAvatar:(window.USER && window.USER.avatar) || u.photoURL || null,
        text:userName+' suggested: '+title,
        targetType:'suggestion', targetId:ref.id,
        actionUrl:'/suggestions.html', actionLabel:'Vote',
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),
        visibility:'public'
      });
    }catch(e){}
    document.getElementById('fTitle').value='';
    document.getElementById('fDesc').value='';
    modal.classList.remove('open');
    loadSuggestions();
  }catch(e){}
};

function boot(){
  if(typeof firebase==='undefined'||!firebase.apps||!firebase.apps.length){ setTimeout(boot,500); return; }
  firebase.auth().onAuthStateChanged(()=>init());
}
boot();
})();
</script>
<script src="/scripts/ptr.js?v=20261001a"></script>
</body>
</html>
