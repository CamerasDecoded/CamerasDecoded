<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duel — Cameras Decoded</title>
  <meta name="description" content="One operator challenged another. One theme, 24 hours to shoot, and the community picks the winner. From the Cameras Decoded Arena.">
  <meta property="og:title" content="Duel — Cameras Decoded">
  <meta property="og:description" content="One theme, 24 hours to shoot, and the community picks the winner.">
  <meta property="og:image" content="https://camerasdecoded.com/og-image.jpg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://camerasdecoded.com/duel.html">

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/scripts/master-loader.js?v=20261119a"></script>

  <style>
    :root {
      --green: #8deb00;
      --green-hi: #a0f520;
      --gold: #e0b12d;
      --ink: #08080a;
      --line: rgba(255,255,255,0.08);
      --line-green: rgba(141,235,0,0.18);
      --text-dim: #b4b4b4;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Body-layout guard: design-system.css loads later via master-loader and
       forces flex centering + 20px padding; this page claims its own layout. */
    body {
      display: block !important;
      justify-content: normal !important;
      align-items: normal !important;
      padding: 0 !important;
      background-color: var(--ink);
      background-image:
        radial-gradient(ellipse at 30% 20%, rgba(141, 235, 0, 0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 80%, rgba(141, 235, 0, 0.02) 0%, transparent 50%),
        radial-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      position: relative;
    }
    h1, h2, h3, .mono { font-family: 'Space Mono', monospace; }
    a { text-decoration: none; color: inherit; }

    .main-content {
      max-width: 880px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 0px) + 80px) 20px 120px;
      position: relative;
      z-index: 1;
      animation: fadeIn 0.5s ease-in-out forwards;
    }
    @keyframes fadeIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }

    .back-link { display: inline-block; margin-bottom: 22px; font-family: 'Space Mono', monospace; font-size: 14px; color: var(--green); }
    .back-link:hover { color: var(--green-hi); }

    .du-kicker { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 2.5px; color: var(--green); text-transform: uppercase; margin-bottom: 10px; }
    .du-title-img { display: block; width: min(220px, 60%); height: auto; }
    #duTitleFb { font-size: 38px; line-height: 1.15; background: linear-gradient(90deg, #1db31b 0%, #c9e265 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .du-theme { font-size: 24px; line-height: 1.3; margin-top: 14px; color: #ffffff; font-weight: 700; }

    .du-status { margin-top: 26px; border: 1px solid var(--line); border-radius: 16px; padding: 22px; background: rgba(12,12,14,0.6); }
    .du-status .big { display: block; font-family: 'Space Mono', monospace; font-size: 18px; margin-bottom: 6px; }
    .du-status p { color: var(--text-dim); font-size: 14px; margin: 0; }
    .du-count { font-family: 'Space Mono', monospace; font-size: 26px; color: var(--green); margin-top: 10px; }

    .du-vs { margin-top: 26px; display: flex; align-items: stretch; gap: 12px; }
    .du-op {
      flex: 1; border: 1px solid var(--line); border-radius: 16px; padding: 18px 14px;
      background: rgba(12,12,14,0.6); text-align: center; display: flex; flex-direction: column;
      align-items: center; gap: 8px; min-width: 0;
    }
    .du-op.winner { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(224,177,45,.35), 0 8px 30px rgba(224,177,45,.08); }
    .du-op img.av { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid var(--line-green); background: #141416; }
    .du-op .av-ph { width: 64px; height: 64px; border-radius: 50%; background: #141416; border: 2px solid var(--line-green); display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 24px; }
    .du-op .nm { font-weight: 700; font-size: 15px; word-break: break-word; }
    .du-op .rl { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); }
    .du-op .tag { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); border: 1px solid rgba(224,177,45,.45); border-radius: 999px; padding: 3px 10px; }
    .du-vs-mid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; flex: 0 0 auto; padding: 0 2px; }
    .du-vs-img { display: block; height: 40px; width: auto; }
    .du-vs-fb { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 26px; color: var(--green); }

    .du-card { margin-top: 22px; border: 1px solid var(--line); border-radius: 16px; padding: 22px; background: rgba(12,12,14,0.6); }
    .du-card h3 { font-size: 16px; margin-bottom: 8px; }
    .du-card p { color: var(--text-dim); font-size: 14px; margin: 0 0 12px; }
    .du-card p:last-child { margin-bottom: 0; }
    .du-note { color: var(--text-dim); font-size: 13px; margin-top: 12px; }
    .du-err { color: #ff8a8a; font-size: 13px; margin-top: 12px; min-height: 18px; }

    /* Signature button: dark glass + green chase ring on the single primary CTA. */
    @property --du-angle { syntax: '<angle>'; initial-value: 120deg; inherits: false; }
    @keyframes duChase { to { --du-angle: 360deg; } }
    .du-btn {
      position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 48px; padding: 12px 22px; border-radius: 14px; cursor: pointer;
      font: 700 15px 'Montserrat', sans-serif; letter-spacing: .01em;
      color: var(--green); border: 1px solid transparent; text-shadow: 0 0 14px rgba(141,235,0,.4);
      background:
        linear-gradient(120deg, rgba(255,255,255,.10), rgba(255,255,255,0) 42%),
        linear-gradient(165deg, rgba(141,235,0,.20) 0%, rgba(141,235,0,.07) 60%, rgba(141,235,0,.13) 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.09), 0 6px 22px rgba(141,235,0,.10);
      transition: transform .18s ease, opacity .18s ease;
    }
    .du-btn:active { transform: scale(.97); }
    .du-btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
    .du-btn.chase::before {
      content: ''; position: absolute; inset: -.5px; border-radius: inherit; padding: 1.5px;
      opacity: .45; pointer-events: none;
      background: conic-gradient(from var(--du-angle,120deg), transparent 20%, #8deb00 40%, transparent 60%, #8deb00 80%, transparent 100%);
      -webkit-mask: linear-gradient(#000,#000) content-box, linear-gradient(#000,#000);
      -webkit-mask-composite: xor;
              mask: linear-gradient(#000,#000) content-box, linear-gradient(#000,#000);
              mask-composite: exclude;
      animation: duChase 6s linear infinite;
    }
    .du-btn.chase:disabled::before { animation: none; opacity: .25; }
    .du-btn.ghost { color: var(--text-dim); text-shadow: none; background: rgba(255,255,255,.05); border: 1px solid var(--line); box-shadow: none; }
    .du-btn.ghost:hover { color: #fff; }
    .du-btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .du-btn-row .du-btn { flex: 1 1 auto; }
    @media (prefers-reduced-motion: reduce) { .du-btn.chase::before { animation: none; } }

    .du-entries { margin-top: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 520px) { .du-entries { grid-template-columns: 1fr; } }
    .du-entry { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: #0c0c0e; }
    .du-entry img { width: 100%; display: block; aspect-ratio: 4/3; object-fit: cover; }
    .du-entry .meta { padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .du-entry .who { font-weight: 700; font-size: 14px; }
    .du-entry .vc { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--green); white-space: nowrap; }
    .du-entry .vote-wrap { padding: 0 14px 14px; }
    .du-vote-btn {
      width: 100%; min-height: 44px; border-radius: 12px; cursor: pointer;
      font: 700 14px 'Montserrat', sans-serif; color: #d9f7b4;
      border: 1px solid rgba(141,235,0,.35);
      background: linear-gradient(165deg, rgba(141,235,0,.16) 0%, rgba(141,235,0,.06) 100%);
    }
    .du-vote-btn:disabled { opacity: .45; cursor: not-allowed; }
    .du-vote-btn.voted { background: linear-gradient(180deg, #a4f71f, #7fd000); color: #0a0c05; border-color: transparent; }
    .du-entry-ph { aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--text-dim); font-family: 'Space Mono', monospace; font-size: 14px; }

    .du-winner { margin-top: 22px; border: 1px solid rgba(224,177,45,.45); border-radius: 16px; padding: 22px; background: linear-gradient(165deg, rgba(224,177,45,.12), rgba(224,177,45,.03)); text-align: center; }
    .du-winner .t { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--gold); }
    .du-winner .w { font-size: 22px; font-weight: 700; margin-top: 8px; }
    .du-winner p { color: var(--text-dim); font-size: 14px; margin: 6px 0 0; }
    .du-winner .du-signal-link { margin-top: 10px; }
    .du-winner .du-signal-link a { color: var(--green); text-decoration: none; font-weight: 600; }

    .du-preview img { width: 100%; display: block; border-radius: 12px; aspect-ratio: 4/3; object-fit: cover; }
    .du-share-row { margin-top: 26px; text-align: center; }
    .du-loading { text-align: center; padding: 60px 20px; color: var(--text-dim); font-family: 'Space Mono', monospace; font-size: 15px; }
    .du-spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--green); margin: 0 auto 16px; animation: duSpin .8s linear infinite; }
    @keyframes duSpin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="main-content">
    <a class="back-link" href="/missions.html">&larr; Arena</a>

    <div class="du-kicker">Operator duel</div>
    <img class="du-title-img" src="/custom-site-titles/duel.png?v=20261118b" alt="Duel" onerror="this.style.display='none';document.getElementById('duTitleFb').hidden=false;">
    <h1 id="duTitleFb" hidden>Duel</h1>
    <p class="du-theme" id="duTheme">—</p>

    <div id="duLoading" class="du-loading">
      <div class="du-spinner"></div>
      Loading the duel…
    </div>

    <div id="duError" class="du-card" hidden>
      <h3 id="duErrorTitle">Duel not found</h3>
      <p id="duErrorText">This duel does not exist, or the link is incomplete.</p>
      <div class="du-btn-row">
        <a class="du-btn ghost" href="/missions.html">Back to the Arena</a>
      </div>
    </div>

    <div id="duBody" hidden>
      <div class="du-status" id="duStatus">
        <span class="big" id="duStatusBig">—</span>
        <p id="duStatusSub">—</p>
        <div class="du-count" id="duCount" hidden></div>
      </div>

      <div class="du-vs">
        <a class="du-op" id="duOpC" href="#">
          <span id="duAvC"></span>
          <span class="nm" id="duNameC">—</span>
          <span class="rl">Challenger</span>
          <span class="tag" id="duTagC" hidden>Winner</span>
        </a>
        <div class="du-vs-mid">
          <img class="du-vs-img" src="/custom-site-titles/vs.png?v=20261118b" alt="versus" onerror="this.style.display='none';this.nextElementSibling.hidden=false;">
          <span class="du-vs-fb" hidden>VS</span>
        </div>
        <a class="du-op" id="duOpO" href="#">
          <span id="duAvO"></span>
          <span class="nm" id="duNameO">—</span>
          <span class="rl">Challenged</span>
          <span class="tag" id="duTagO" hidden>Winner</span>
        </a>
      </div>

      <div id="duWinner" class="du-winner" hidden>
        <div class="t">Duel winner</div>
        <div class="w" id="duWinnerName">—</div>
        <p id="duWinnerSub">—</p>
        <p class="du-signal-link" id="duWinnerSignal" hidden><a id="duWinnerSignalLink" href="#">See the result in the Signal</a></p>
      </div>

      <div id="duAction"></div>
      <div id="duEntries"></div>

      <div class="du-share-row">
        <button type="button" class="du-btn ghost" id="duShareBtn"><i class="fas fa-share-alt"></i> Share this duel</button>
      </div>
    </div>
  </main>

  <input type="file" id="duFileInput" accept="image/*" hidden>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/scripts/firebase-init.js?v=20261007b"></script>
  <script src="/scripts/cd-upload.js?v=20261014b"></script>
  <script>
  (function () {
    'use strict';
    var DAY_MS = 24 * 3600 * 1000;
    var COMPRESS_MAX_EDGE = 1600;
    var HARD_CAP_BYTES = 5 * 1024 * 1024;

    function el(id) { return document.getElementById(id); }
    function setText(id, v) { var n = el(id); if (n) n.textContent = v; }
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function tsMs(ts) {
      if (!ts) return 0;
      if (typeof ts.toMillis === 'function') return ts.toMillis();
      if (ts instanceof Date) return ts.getTime();
      if (typeof ts === 'number') return ts;
      if (typeof ts.seconds === 'number') return ts.seconds * 1000;
      return 0;
    }
    function clientTs(ms) { return firebase.firestore.Timestamp.fromDate(new Date(ms)); }
    function fmtCountdown(ms) {
      if (ms <= 0) return '0s';
      var s = Math.floor(ms / 1000);
      var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      if (h > 0) return h + 'h ' + (m < 10 ? '0' : '') + m + 'm';
      if (m > 0) return m + 'm ' + (sec < 10 ? '0' : '') + sec + 's';
      return sec + 's';
    }
    function showError(title, text) {
      el('duLoading').hidden = true;
      el('duBody').hidden = true;
      setText('duErrorTitle', title);
      setText('duErrorText', text);
      el('duError').hidden = false;
    }
    function needAuth() {
      try { sessionStorage.setItem('cd_post_login_redirect', '/duel.html' + window.location.search); } catch (e) {}
      window.location.href = 'login.html';
    }

    var duelId = new URLSearchParams(window.location.search).get('d');
    var hasFirebase = typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length && window.db;
    var db = hasFirebase ? window.db : null;
    var auth = hasFirebase ? (window.auth || firebase.auth()) : null;
    var user = null;
    var duel = null;            /* duel doc data + _id */
    var entries = {};           /* {challenger: doc|null, opponent: doc|null} */
    var votes = [];             /* [{voterUid, pick}] */
    var tickTimer = null;
    var lastDeadlineReload = 0;
    var previewBlob = null;
    var previewUrl = null;

    function derive() {
      var now = Date.now();
      var c = entries.challenger, o = entries.opponent;
      var bothIn = !!(c && o);
      var voteByMs = tsMs(duel.voteBy);
      if (!duel.voteBy && bothIn) voteByMs = Math.max(tsMs(c.submittedAt), tsMs(o.submittedAt)) + DAY_MS;
      var tallyC = 0, tallyO = 0, myVote = null;
      for (var i = 0; i < votes.length; i++) {
        if (votes[i].pick === 'challenger') tallyC++;
        else if (votes[i].pick === 'opponent') tallyO++;
        if (user && votes[i].voterUid === user.uid) myVote = votes[i].pick;
      }
      /* Settled by the duel closer — authoritative, never re-derived. */
      if (duel.state === 'closed') {
        var wSide = duel.winnerUid === duel.challengerUid ? 'challenger'
          : (duel.winnerUid === duel.opponentUid ? 'opponent' : null);
        if (duel.closeReason === 'votes') return { key: 'closed', winner: wSide, byDefault: false, tallyC: tallyC, tallyO: tallyO, myVote: myVote };
        if (duel.closeReason === 'default') return { key: 'default', winner: wSide, byDefault: true, tallyC: tallyC, tallyO: tallyO, myVote: myVote };
        if (duel.closeReason === 'expired') return { key: 'expired', tallyC: tallyC, tallyO: tallyO, myVote: myVote };
        if (duel.closeReason === 'declined') return { key: 'declined', tallyC: tallyC, tallyO: tallyO, myVote: myVote };
        if (duel.closeReason === 'void') return { key: 'void', tallyC: tallyC, tallyO: tallyO, myVote: myVote };
        return { key: 'closed', winner: wSide, byDefault: false, tallyC: tallyC, tallyO: tallyO, myVote: myVote };
      }
      function winnerByVotes() {
        if (tallyC === tallyO) {
          return tsMs(c.submittedAt) <= tsMs(o.submittedAt) ? 'challenger' : 'opponent';
        }
        return tallyC > tallyO ? 'challenger' : 'opponent';
      }
      if (duel.declinedAt) return { key: 'declined', tallyC: tallyC, tallyO: tallyO, myVote: myVote };
      if (!duel.acceptedAt && now > tsMs(duel.acceptBy)) return { key: 'expired', tallyC: tallyC, tallyO: tallyO, myVote: myVote };
      if (!duel.acceptedAt) return { key: 'pending', deadlineMs: tsMs(duel.acceptBy), tallyC: tallyC, tallyO: tallyO, myVote: myVote };
      if (duel.voteBy && now > voteByMs) return { key: 'closed', winner: winnerByVotes(), byDefault: false, tallyC: tallyC, tallyO: tallyO, myVote: myVote };
      if (voteByMs) return { key: 'voting', deadlineMs: voteByMs, tallyC: tallyC, tallyO: tallyO, myVote: myVote };
      if (now > tsMs(duel.submitBy)) {
        if (c && !o) return { key: 'default', winner: 'challenger', tallyC: tallyC, tallyO: tallyO, myVote: myVote };
        if (o && !c) return { key: 'default', winner: 'opponent', tallyC: tallyC, tallyO: tallyO, myVote: myVote };
        return { key: 'void', tallyC: tallyC, tallyO: tallyO, myVote: myVote };
      }
      return { key: 'submitting', deadlineMs: tsMs(duel.submitBy), tallyC: tallyC, tallyO: tallyO, myVote: myVote };
    }

    function isChallenger() { return user && duel && user.uid === duel.challengerUid; }
    function isOpponent() { return user && duel && user.uid === duel.opponentUid; }
    function isDuelist() { return isChallenger() || isOpponent(); }
    function myEntry() {
      if (isChallenger()) return entries.challenger;
      if (isOpponent()) return entries.opponent;
      return null;
    }
    function nameOf(side) {
      return side === 'challenger' ? (duel.challengerName || 'Operator') : (duel.opponentName || 'Operator');
    }

    function avatarEl(url, name) {
      if (url) {
        var img = document.createElement('img');
        img.className = 'av'; img.src = url; img.alt = name || 'Operator';
        return img;
      }
      var ph = document.createElement('span');
      ph.className = 'av-ph';
      ph.innerHTML = '<i class="fas fa-user"></i>';
      return ph;
    }
    function setAvatar(slotId, url, name) {
      var slot = el(slotId);
      if (!slot) return;
      while (slot.firstChild) slot.removeChild(slot.firstChild);
      slot.appendChild(avatarEl(url, name));
    }

    function render() {
      var st = derive();
      var cName = nameOf('challenger'), oName = nameOf('opponent');
      setText('duTheme', duel.theme || 'Untitled duel');
      el('duOpC').href = '/profile.html?u=' + encodeURIComponent(duel.challengerUid);
      el('duOpO').href = '/profile.html?u=' + encodeURIComponent(duel.opponentUid);
      setAvatar('duAvC', duel.challengerAvatar, cName);
      setAvatar('duAvO', duel.opponentAvatar, oName);
      setText('duNameC', cName);
      setText('duNameO', oName);
      el('duTagC').hidden = true; el('duTagO').hidden = true;
      el('duOpC').classList.remove('winner'); el('duOpO').classList.remove('winner');

      var big = '', sub = '', statusSub = null, showCount = false;
      var action = el('duAction'), ents = el('duEntries'), win = el('duWinner');
      action.innerHTML = ''; ents.innerHTML = ''; win.hidden = true;

      if (st.key === 'pending') {
        big = 'Waiting on ' + oName;
        sub = cName + ' challenged ' + oName + ' — ' + oName + ' has 24 hours to accept.';
        showCount = true;
        if (isOpponent()) {
          action.innerHTML = '<div class="du-card"><h3>You were challenged</h3>' +
            '<p>' + esc(cName) + ' wants a duel: <b>' + esc(duel.theme || '') + '</b>. Accept and you both have 24 hours to shoot it. The community votes on the winner.</p>' +
            '<div class="du-btn-row"><button type="button" class="du-btn chase" id="duAcceptBtn">Accept the duel</button>' +
            '<button type="button" class="du-btn ghost" id="duDeclineBtn">Decline</button></div>' +
            '<p class="du-err" id="duActErr"></p></div>';
          el('duAcceptBtn').onclick = acceptDuel;
          el('duDeclineBtn').onclick = declineDuel;
        } else if (isChallenger()) {
          action.innerHTML = '<div class="du-card"><h3>Challenge sent</h3><p>' + esc(oName) + ' has 24 hours to accept. If they don&rsquo;t answer, the duel expires — no harm done.</p></div>';
        }
      } else if (st.key === 'declined') {
        big = 'Challenge declined';
        sub = oName + ' passed on this one. No winner, no loss.';
      } else if (st.key === 'expired') {
        big = 'Challenge expired';
        sub = oName + ' didn&rsquo;t answer in 24 hours. The duel is void — no winner, no loss.';
      } else if (st.key === 'submitting') {
        big = 'Duel on — shoot your shot';
        sub = 'Both sides have 24 hours from acceptance to submit. Miss it and you lose by default.';
        showCount = true;
        var mine = myEntry();
        if (isDuelist() && !mine) {
          action.innerHTML = '<div class="du-card"><h3>Your shot</h3>' +
            '<p>Shoot the theme: <b>' + esc(duel.theme || '') + '</b>. One shot — you can&rsquo;t change it after you submit, and your opponent can&rsquo;t see it until they submit too.</p>' +
            '<div class="du-preview" id="duPreview" hidden><img id="duPreviewImg" alt="Your shot preview"></div>' +
            '<div class="du-btn-row" id="duSubmitRow"><button type="button" class="du-btn chase" id="duPickBtn">Choose your photo</button></div>' +
            '<div class="du-btn-row" id="duConfirmRow" hidden><button type="button" class="du-btn ghost" id="duRetakeBtn">Retake</button>' +
            '<button type="button" class="du-btn chase" id="duSubmitBtn">Submit entry</button></div>' +
            '<p class="du-err" id="duActErr"></p></div>';
          el('duPickBtn').onclick = function () { el('duFileInput').click(); };
          el('duRetakeBtn').onclick = resetPreview;
          el('duSubmitBtn').onclick = submitEntry;
        } else if (isDuelist() && mine) {
          action.innerHTML = '<div class="du-card"><h3>Your shot is in</h3><p>Waiting on ' + esc(isChallenger() ? oName : cName) + ' to submit. Your photo stays hidden until they do.</p></div>';
          renderEntry(mine, isChallenger() ? 'challenger' : 'opponent', st, true);
        } else {
          action.innerHTML = '<div class="du-card"><h3>Shooting now</h3><p>Both sides are out shooting. The photos reveal the moment both are in — then voting opens.</p></div>';
        }
      } else if (st.key === 'voting') {
        big = 'Voting is open';
        sub = 'Both shots are in. Pick the winner — one vote each, and the duelists can\u2019t vote.';
        showCount = true;
        renderEntry(entries.challenger, 'challenger', st, false);
        renderEntry(entries.opponent, 'opponent', st, false);
      } else if (st.key === 'closed' || st.key === 'default') {
        var wSide = st.winner, wName = nameOf(wSide);
        big = wName + ' won the duel';
        sub = st.key === 'default'
          ? nameOf(wSide === 'challenger' ? 'opponent' : 'challenger') + ' didn&rsquo;t submit in time — default win.'
          : 'The community voted. Final: ' + st.tallyC + ' – ' + st.tallyO + '.';
        statusSub = '';
        win.hidden = false;
        setText('duWinnerName', wName);
        setText('duWinnerSub', sub);
        var sigP = el('duWinnerSignal');
        if (sigP) {
          var rid = duel.signalPostIds && duel.signalPostIds.result;
          if (rid) {
            sigP.hidden = false;
            el('duWinnerSignalLink').href = '/feed.html#' + encodeURIComponent(rid);
          } else sigP.hidden = true;
        }
        el(wSide === 'challenger' ? 'duTagC' : 'duTagO').hidden = false;
        el(wSide === 'challenger' ? 'duOpC' : 'duOpO').classList.add('winner');
        if (entries.challenger) renderEntry(entries.challenger, 'challenger', st, false);
        if (entries.opponent) renderEntry(entries.opponent, 'opponent', st, false);
      } else if (st.key === 'void') {
        big = 'No duel';
        sub = 'Neither side submitted in time. The duel is void — no winner, no loss.';
      }

      setText('duStatusBig', big);
      setText('duStatusSub', statusSub === null ? sub : statusSub);
      var countEl = el('duCount');
      if (showCount && st.deadlineMs) {
        countEl.hidden = false;
        countEl.textContent = fmtCountdown(st.deadlineMs - Date.now());
        countEl.dataset.deadline = String(st.deadlineMs);
      } else {
        countEl.hidden = true;
        countEl.removeAttribute('data-deadline');
      }
      el('duLoading').hidden = true;
      el('duBody').hidden = false;
    }

    function renderEntry(entry, side, st, ownOnly) {
      if (!entry) return;
      var wrap = el('duEntries');
      var card = document.createElement('div');
      card.className = 'du-entry';
      var votesFor = side === 'challenger' ? st.tallyC : st.tallyO;
      var photo = document.createElement('img');
      photo.src = entry.imgUrl;
      photo.alt = 'Duel entry by ' + nameOf(side);
      var html = '<div class="meta"><span class="who">' + esc(nameOf(side)) + '</span>' +
        (st.key === 'voting' || st.key === 'closed' ? '<span class="vc">' + votesFor + ' vote' + (votesFor === 1 ? '' : 's') + '</span>' : '') + '</div>';
      if (ownOnly) {
        html += '<div class="vote-wrap"><p class="du-note" style="margin:0;">Only you can see this until both shots are in.</p></div>';
      } else if (st.key === 'voting') {
        /* Signed-out visitors get a live button: the tap sends them to sign in
           (castVote handles !user via needAuth) instead of a dead control. */
        var canVote = !isDuelist() && !st.myVote;
        var isMine = st.myVote === side;
        html += '<div class="vote-wrap"><button type="button" class="du-vote-btn' + (isMine ? ' voted' : '') + '" data-pick="' + side + '"' +
          (canVote || isMine ? '' : ' disabled') + '>' +
          (isMine ? 'Your vote' : (st.myVote ? 'Vote for ' + esc(nameOf(side)) : 'Vote for ' + esc(nameOf(side)))) + '</button></div>';
      }
      card.innerHTML = html;
      /* Insert the photo AFTER innerHTML — setting innerHTML wipes children. */
      card.insertBefore(photo, card.firstChild);
      var btn = card.querySelector('.du-vote-btn');
      if (btn && !btn.disabled) btn.onclick = function () { castVote(side); };
      wrap.appendChild(card);
    }

    function actErr(msg) { setText('duActErr', msg || ''); }

    function acceptDuel() {
      if (!user) { needAuth(); return; }
      var btn = el('duAcceptBtn'); if (btn) btn.disabled = true;
      actErr('');
      var now = Date.now();
      db.collection('duels').doc(duelId).update({
        acceptedAt: clientTs(now),
        submitBy: clientTs(now + DAY_MS)
      }).then(load).catch(function () {
        if (btn) btn.disabled = false;
        actErr('Could not accept — check your connection and try again.');
      });
    }

    function declineDuel() {
      if (!user) { needAuth(); return; }
      var btn = el('duDeclineBtn'); if (btn) btn.disabled = true;
      actErr('');
      db.collection('duels').doc(duelId).update({
        declinedAt: clientTs(Date.now())
      }).then(load).catch(function () {
        if (btn) btn.disabled = false;
        actErr('Could not decline — check your connection and try again.');
      });
    }

    function canvasToBlob(canvas, q) {
      return new Promise(function (res) { canvas.toBlob(res, 'image/jpeg', q); });
    }
    function compressImage(file) {
      return new Promise(function (resolve, reject) {
        var objUrl = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () {
          URL.revokeObjectURL(objUrl);
          var w = img.naturalWidth, h = img.naturalHeight;
          if (!w || !h) { reject(new Error('empty image')); return; }
          var scale = Math.min(1, COMPRESS_MAX_EDGE / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement('canvas');
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext('2d');
          if (!ctx) { reject(new Error('canvas unavailable')); return; }
          ctx.drawImage(img, 0, 0, cw, ch);
          var qualities = [0.85, 0.7, 0.55], qi = 0;
          (function nextQ() {
            if (qi >= qualities.length) { reject(new Error('Couldn\u2019t compress under 5MB — try a smaller file.')); return; }
            canvasToBlob(canvas, qualities[qi]).then(function (blob) {
              if (!blob) { reject(new Error('encode failed')); return; }
              if (blob.size <= HARD_CAP_BYTES) resolve(blob);
              else { qi++; nextQ(); }
            });
          })();
        };
        img.onerror = function () { URL.revokeObjectURL(objUrl); reject(new Error('Could not read that photo.')); };
        img.src = objUrl;
      });
    }

    function resetPreview() {
      previewBlob = null;
      if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
      var pv = el('duPreview'); if (pv) pv.hidden = true;
      var cr = el('duConfirmRow'); if (cr) cr.hidden = true;
      var sr = el('duSubmitRow'); if (sr) sr.hidden = false;
      var fi = el('duFileInput'); if (fi) fi.value = '';
      actErr('');
    }

    function onFileChosen(e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      actErr('Preparing your photo…');
      compressImage(file).then(function (blob) {
        previewBlob = blob;
        previewUrl = URL.createObjectURL(blob);
        var img = el('duPreviewImg');
        if (img) img.src = previewUrl;
        var pv = el('duPreview'); if (pv) pv.hidden = false;
        var sr = el('duSubmitRow'); if (sr) sr.hidden = true;
        var cr = el('duConfirmRow'); if (cr) cr.hidden = false;
        actErr('');
      }).catch(function (err) {
        actErr(err && err.message ? err.message : 'Could not read that photo.');
        var fi = el('duFileInput'); if (fi) fi.value = '';
      });
    }

    function submitEntry() {
      if (!user) { needAuth(); return; }
      if (!previewBlob) { actErr('Choose a photo first.'); return; }
      var btn = el('duSubmitBtn'); if (btn) btn.disabled = true;
      actErr('Uploading your shot…');
      var uid = user.uid;
      var authorName = (window.USER && window.USER.name) || user.displayName || 'Operator';
      var otherUid = isChallenger() ? duel.opponentUid : duel.challengerUid;
      var entryRef = db.collection('duels').doc(duelId).collection('entries').doc(uid);
      window.CDUpload.upload(previewBlob, 'duel-entry.jpg').then(function (up) {
        if (!up || !up.url) throw new Error('Your photo could not be uploaded — the connection may have dropped.');
        return entryRef.set({
          imgUrl: up.url,
          submittedAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function () {
          return entryRef.collection('_private').doc('data').set({
            authorUid: uid,
            authorName: authorName
          });
        });
      }).then(function () {
        /* If the other side already submitted, this submit opens voting. */
        return db.collection('duels').doc(duelId).collection('entries').doc(otherUid).get().then(function (snap) {
          if (snap && snap.exists) {
            return db.collection('duels').doc(duelId).update({ voteBy: clientTs(Date.now() + DAY_MS) }).catch(function () {});
          }
        }).catch(function () {});
      }).then(load).catch(function (err) {
        if (btn) btn.disabled = false;
        actErr(err && err.message ? err.message : 'Could not submit — check your connection and try again.');
      });
    }

    function castVote(pick) {
      if (!user) { needAuth(); return; }
      if (isDuelist()) return;
      var btns = document.querySelectorAll('.du-vote-btn');
      for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
      db.collection('duels').doc(duelId).collection('votes').doc(user.uid).set({
        voterUid: user.uid,
        pick: pick,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(load).catch(function () {
        load();
      });
    }

    function shareDuel() {
      if (!duel) return;
      var url = window.location.href;
      var text = nameOf('challenger') + ' challenged ' + nameOf('opponent') + ': ' + (duel.theme || '') + '. Vote for the winner.';
      if (navigator.share) {
        navigator.share({ title: 'Duel — Cameras Decoded', text: text, url: url }).catch(function () {});
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () {
          var b = el('duShareBtn'); if (b) b.textContent = 'Link copied';
        });
      }
    }

    function startTicker() {
      if (tickTimer) return;
      tickTimer = setInterval(function () {
        var countEl = el('duCount');
        if (!countEl || countEl.hidden) return;
        var dl = parseInt(countEl.dataset.deadline || '0', 10);
        if (!dl) return;
        var left = dl - Date.now();
        if (left <= 0) {
          if (lastDeadlineReload !== dl) { lastDeadlineReload = dl; load(); }
          return;
        }
        countEl.textContent = fmtCountdown(left);
      }, 1000);
    }

    function load() {
      if (!duelId) { showError('Duel not found', 'This link has no duel in it.'); return; }
      if (!hasFirebase) { showError('Duel offline', 'The connection dropped — check yours and reload.'); return; }
      var duelRef = db.collection('duels').doc(duelId);
      duelRef.get().then(function (snap) {
        if (!snap || !snap.exists) {
          showError('Duel not found', 'This duel does not exist, or it was removed.');
          return null;
        }
        duel = snap.data();
        duel._id = snap.id;
        var cUid = duel.challengerUid, oUid = duel.opponentUid;
        var entryC = duelRef.collection('entries').doc(cUid).get().catch(function () { return null; });
        var entryO = duelRef.collection('entries').doc(oUid).get().catch(function () { return null; });
        var voteQ = duelRef.collection('votes').get().catch(function () { return null; });
        return Promise.all([entryC, entryO, voteQ]).then(function (res) {
          entries.challenger = (res[0] && res[0].exists) ? res[0].data() : null;
          entries.opponent = (res[1] && res[1].exists) ? res[1].data() : null;
          votes = [];
          if (res[2]) res[2].forEach(function (d) { votes.push(d.data()); });
          render();
          startTicker();
        });
      }).catch(function () {
        showError('Could not load the duel', 'The duel is on record, but it would not load. Check your connection and reload.');
      });
    }

    var shareBtn = el('duShareBtn');
    if (shareBtn) shareBtn.onclick = shareDuel;
    var fi = el('duFileInput');
    if (fi) fi.addEventListener('change', onFileChosen);

    if (!duelId) {
      showError('Duel not found', 'This link has no duel in it.');
    } else if (!hasFirebase) {
      showError('Duel offline', 'The connection dropped — check yours and reload.');
    } else if (auth && auth.onAuthStateChanged) {
      auth.onAuthStateChanged(function (u) { user = u; load(); });
    } else {
      load();
    }
  })();
  </script>
