  <script>
    // ================================================================

    // ================================================================
    // RECOMMENDATIONS (with debug logs and fallback)
    // ================================================================
    // Load tagging engine
    const tagScript = document.createElement('script');
    tagScript.src = 'tagging-engine.js';
    document.head.appendChild(tagScript);

    // Wait for auth
    if (typeof auth !== 'undefined' && auth) {
      auth.onAuthStateChanged(async (user) => {
        const section = document.getElementById('recommendations-section');
        const container = document.getElementById('recommendation-container');
        if (!section || !container) {
          console.warn('Recommendation elements not found');
          return;
        }

        // Always show the section
        section.style.display = 'block';

        if (!user) {
          container.innerHTML = `<p class="grey-text"><a href="login.html" style="color:#8deb00;">Log in</a> to see personalized recommendations.</p>`;
          return;
        }

        try {
          // Wait for tagging engine
          if (typeof window.getUserTags === 'undefined') {
            console.log('Waiting for tagging engine...');
            await new Promise(resolve => {
              let check = setInterval(() => {
                if (typeof window.getUserTags !== 'undefined') {
                  clearInterval(check);
                  resolve();
                }
              }, 200);
            });
          }

          // Fetch user data
          const userDoc = await db.collection('users').doc(user.uid).get();
          const userData = userDoc.data();
          if (!userData) {
            container.innerHTML = '<p class="grey-text">Complete your onboarding to get recommendations.</p>';
            return;
          }

          const userTags = window.getUserTags(userData);
          console.log('User tags:', userTags);

          // Get recommendations from Firestore
          const recs = await window.getRecommendedContent('protocols', userTags, 6, { active: true });
          console.log('Protocols recommendations from Firestore:', recs);

          if (recs.length === 0) {
            // Fallback: show top 3 protocols by likes from hardcoded list
            const fallbackRecs = [...protocols].sort((a,b) => b.likes - a.likes).slice(0, 3);
            container.innerHTML = `
              <p class="grey-text" style="margin-bottom:10px;">No personalized recommendations yet. Here are popular protocols:</p>
              ${fallbackRecs.map(p => `
                <div class="rec-card">
                  <div class="number">${p.number}</div>
                  <h4>${p.title}</h4>
                  <p>${p.excerpt}</p>
                  <span class="score">🔥 ${p.likes} likes</span>
                </div>
              `).join('')}
            `;
          } else {
            container.innerHTML = recs.map(item => `
              <div class="rec-card">
                <div class="number">${item.number}</div>
                <h4>${item.title}</h4>
                <p>${item.excerpt || ''}</p>
                <span class="score">Score: ${item.score}</span>
              </div>
            `).join('');
          }
        } catch (e) {
          console.error('Recommendations error:', e);
          container.innerHTML = '<p class="grey-text">Could not load recommendations. Please try again later.</p>';
        }
      });
    }
