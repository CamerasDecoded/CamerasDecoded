  <!-- PAGE-SPECIFIC SCRIPT -->
  <script>
    // ================================================================
    // FIREBASE FALLBACK
    // ================================================================
    if (typeof firebase !== 'undefined' && !firebase.apps.length) {
      firebase.initializeApp({
        apiKey: "AIzaSyB95Vx0i8W6WNfUy1N4TNQyfN5xCxQYnz8",
        authDomain: "cameras-decoded.firebaseapp.com",
        projectId: "cameras-decoded",
        storageBucket: "cameras-decoded.firebasestorage.app",
        messagingSenderId: "1088920052790",
        appId: "1:1088920052790:web:2177c1fb31109c1fa02497",
        measurementId: "G-YN3M01WW0B"
      });
    }

    // ---- Toast helper ----
    var cdToast = window.cdToast || function(msg, type) {
      alert(msg);
    };

    // ---- Auth & DB ----
    var auth = window.auth || firebase.auth();
    var db = window.db || firebase.firestore();

    // ---- Rest of the original logic (with safe declarations) ----
    var currentUser = null;
    var userDocRef = null;
    var students = [];
    var studentListener = null;
    var commissionListener = null;
    window.demoCommissionId = null;

    function getDefaultUserData(user) {
      var uid = user.uid;
      var email = user.email || '';
      var username = email ? email.split('@')[0] : 'instructor_' + uid.slice(0,6);
      return {
        uid: uid,
        username: username,
        name: user.displayName || '',
        email: email,
        role: 'Instructor',
        instructorId: 'INSTR-' + uid.slice(0,6).toUpperCase(),
        teachingExperience: '',
        instructorLicense: 'educator',
        billingInterval: 'annual',
        totalStudents: 0,
        totalWorkshops: 0,
        guideSales: 0,
        totalCohorts: 0,
        referralCode: username,
        totalReferrals: 0,
        totalCommissionEarned: 0,
        nextBillingDate: new Date(Date.now() + 30*24*60*60*1000).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })
      };
    }

    function updateInstructorProfile(data) {
      document.getElementById('profileUsername').textContent = data.username || '—';
      document.getElementById('profileName').textContent = data.name || '—';
      document.getElementById('profileEmail').textContent = data.email || '—';

      var expMap = { '<1': 'Less than 1 year', '1-3': '1–3 years', '3-5': '3–5 years', '5+': '5+ years' };
      document.getElementById('profileExperience').textContent = expMap[data.teachingExperience] || data.teachingExperience || '—';

      var license = data.instructorLicense || 'educator';
      var licenseDisplay = license.charAt(0).toUpperCase() + license.slice(1);
      document.getElementById('profileLicense').textContent = licenseDisplay;

      var billing = data.billingInterval || 'annual';
      var billingDisplay = billing.charAt(0).toUpperCase() + billing.slice(1);
      document.getElementById('profileBilling').textContent = billingDisplay;

      var instructorId = data.instructorId || 'INSTR-' + (currentUser ? currentUser.uid.slice(0,6).toUpperCase() : '—');
      document.getElementById('instructorUniqueId').textContent = instructorId;
      document.getElementById('guideUniqueId').textContent = instructorId;

      document.getElementById('studentCount').textContent = data.totalStudents || 0;
      document.getElementById('guideSalesCount').textContent = data.guideSales || 0;
      document.getElementById('workshopCount').textContent = data.totalWorkshops || 0;
      document.getElementById('cohortCount').textContent = data.totalCohorts || 0;

      var isAnnual = data.billingInterval === 'annual';
      document.getElementById('billingPlan').textContent = 'Educator License';
      document.getElementById('billingPrice').textContent = isAnnual ? '$2,500 / year' : '$300 / month';
      document.getElementById('billingNext').textContent = data.nextBillingDate || '—';

      document.getElementById('headerTier').textContent = licenseDisplay;

      var code = data.referralCode || '';
      document.getElementById('referralLink').textContent = 'camerasdecoded.com/ref/' + code;
      document.getElementById('totalReferrals').textContent = data.totalReferrals || 0;
      document.getElementById('totalCommission').textContent = '$' + (data.totalCommissionEarned || 0).toFixed(2);
      document.getElementById('ambassadorTier').textContent = 'Instructor (20%)';

      if (document.getElementById('statsGrid') && typeof insertCommissionCard === 'function') {
        insertCommissionCard('statsGrid', 'after');
      }
      if (window.BottomNav) {
        window.BottomNav.updateBadges(data);
      }
    }

    function renderCommissionHistory(commissions) {
      var list = document.getElementById('commissionList');
      if (!list) return;
      if (!commissions || commissions.length === 0) {
        list.innerHTML = '<div class="commission-empty">No commissions yet. Earn commissions when people buy through your referral link.</div>';
        return;
      }
      var sorted = commissions.slice().sort(function(a, b) {
        var dateA = a.createdAt && a.createdAt.toDate ? a.createdAt.toDate() : new Date(0);
        var dateB = b.createdAt && b.createdAt.toDate ? b.createdAt.toDate() : new Date(0);
        return dateB - dateA;
      });
      var html = '';
      sorted.slice(0, 20).forEach(function(c) {
        var date = c.createdAt && c.createdAt.toDate ? c.createdAt.toDate() : new Date();
        var dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        var statusClass = c.status || 'pending';
        var statusLabel = statusClass.charAt(0).toUpperCase() + statusClass.slice(1);
        html += '<div class="commission-item"><div class="left"><div class="name">' + (c.productName || 'Purchase') + '</div><div class="date">' + dateStr + '</div></div><div class="right"><span class="amount">$' + c.amount.toFixed(2) + '</span><span class="status ' + statusClass + '">' + statusLabel + '</span></div></div>';
      });
      list.innerHTML = html;

      var demo = commissions.find(function(c) { return c.isDemo === true; });
      var resetBtn = document.getElementById('resetDemoBtn');
      var simBtn = document.getElementById('simulateBtn');
      if (demo) {
        resetBtn.style.display = 'inline-block';
        simBtn.textContent = 'Demo used';
        simBtn.disabled = true;
        simBtn.style.opacity = '0.5';
        simBtn.style.cursor = 'default';
        window.demoCommissionId = demo.id;
      } else {
        resetBtn.style.display = 'none';
        simBtn.textContent = 'Simulate Purchase';
        simBtn.disabled = false;
        simBtn.style.opacity = '1';
        simBtn.style.cursor = 'pointer';
        window.demoCommissionId = null;
      }
    }

    function simulatePurchase() {
      if (!userDocRef) {
        cdToast('Please log in first.', 'error');
        return;
      }
      if (window.demoCommissionId) {
        cdToast('A demo commission already exists. Reset it first.', '');
        return;
      }
      var rate = 0.20;
      var purchaseAmount = 50;
      var commissionAmount = purchaseAmount * rate;
      var commissionRef = userDocRef.collection('commissions').doc();
      commissionRef.set({
        productName: '📘 Camera Confidence Guide (demo)',
        amount: commissionAmount,
        status: 'pending',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        purchaseId: 'demo-' + Date.now(),
        purchaseAmount: purchaseAmount,
        rate: rate,
        tier: 'instructor',
        isDemo: true
      }).then(function() {
        return userDocRef.update({
          totalCommissionEarned: firebase.firestore.FieldValue.increment(commissionAmount)
        });
      }).then(function() {
        cdToast('✅ Demo commission: $' + commissionAmount.toFixed(2) + ' earned (20% rate).');
      }).catch(function(err) {
        console.error('Simulate error:', err);
        cdToast('Error creating test commission: ' + err.message, 'error');
      });
    }

    function resetDemoCommission() {
      if (!window.demoCommissionId || !userDocRef) return;
      var commissionRef = userDocRef.collection('commissions').doc(window.demoCommissionId);
      commissionRef.get().then(function(doc) {
        if (!doc.exists) return;
        var amount = doc.data().amount || 0;
        return commissionRef.delete().then(function() {
          return userDocRef.update({
            totalCommissionEarned: firebase.firestore.FieldValue.increment(-amount)
          });
        });
      }).then(function() {
        window.demoCommissionId = null;
        cdToast('Demo commission removed.');
      }).catch(function(err) {
        console.error('Reset demo error:', err);
        cdToast('Could not reset demo: ' + err.message, 'error');
      });
    }

    function renderStudents() {
      var list = document.getElementById('studentList');
      if (!list) return;
      if (students.length === 0) {
        list.innerHTML = '<div class="empty-msg">No students added yet. Add your first student above.</div>';
        return;
      }
      var html = '';
      students.forEach(function(s) {
        html += '<div class="student-row"><span><strong>' + s.name + '</strong> <span class="email">' + s.email + '</span></span><button class="remove-btn" onclick="removeStudent(\'' + s.id + '\')">✕</button></div>';
      });
      list.innerHTML = html;
      document.getElementById('studentCount').textContent = students.length;
    }

    function addStudent(name, email) {
      if (!userDocRef) {
        cdToast('User document not ready.', 'error');
        return;
      }
      var studentRef = userDocRef.collection('students').doc();
      studentRef.set({
        name: name,
        email: email,
        addedAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(function() {
        userDocRef.update({
          totalStudents: firebase.firestore.FieldValue.increment(1)
        }).catch(console.error);
        cdToast('✅ Student "' + name + '" added!');
      }).catch(function(err) {
        console.error('Add student error:', err);
        cdToast('Could not add student: ' + err.message, 'error');
      });
    }

    window.removeStudent = function(studentId) {
      if (!confirm('Remove this student?')) return;
      if (!userDocRef) return;
      userDocRef.collection('students').doc(studentId).delete().then(function() {
        userDocRef.update({
          totalStudents: firebase.firestore.FieldValue.increment(-1)
        }).catch(console.error);
        cdToast('Student removed.');
      }).catch(function(err) {
        console.error('Remove student error:', err);
        cdToast('Could not remove student: ' + err.message, 'error');
      });
    };

    function listenStudents() {
      if (studentListener) {
        studentListener();
        studentListener = null;
      }
      if (!userDocRef) return;
      studentListener = userDocRef.collection('students').onSnapshot(function(snapshot) {
        students = [];
        snapshot.forEach(function(doc) {
          students.push({ id: doc.id, name: doc.data().name, email: doc.data().email });
        });
        renderStudents();
      }, function(err) {
        console.warn('Student listener error:', err);
      });
    }

    function listenCommissions() {
      if (commissionListener) {
        commissionListener();
        commissionListener = null;
      }
      if (!userDocRef) return;
      commissionListener = userDocRef.collection('commissions').onSnapshot(function(snapshot) {
        var commissions = [];
        snapshot.forEach(function(doc) {
          commissions.push({ id: doc.id, amount: doc.data().amount, productName: doc.data().productName, status: doc.data().status, createdAt: doc.data().createdAt, isDemo: doc.data().isDemo });
        });
        renderCommissionHistory(commissions);
      }, function(err) {
        console.warn('Commission listener error:', err);
        renderCommissionHistory([]);
      });
    }

    // ---- AUTH ----
    auth.onAuthStateChanged(function(user) {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      userDocRef = db.collection('users').doc(user.uid);

      userDocRef.get().then(function(doc) {
        if (doc.exists) {
          updateInstructorProfile(doc.data());
          listenStudents();
          listenCommissions();
        } else {
          var defaultData = getDefaultUserData(user);
          userDocRef.set(defaultData, { merge: true }).then(function() {
            updateInstructorProfile(defaultData);
            listenStudents();
            listenCommissions();
          }).catch(function() {
            updateInstructorProfile(defaultData);
            listenStudents();
            listenCommissions();
          });
        }
      }).catch(function(err) {
        console.warn('Read error, using default:', err);
        var defaultData = getDefaultUserData(user);
        userDocRef.set(defaultData, { merge: true }).catch(function() {});
        updateInstructorProfile(defaultData);
        listenStudents();
        listenCommissions();
      });

      var form = document.getElementById('addStudentForm');
      if (form) {
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          var name = document.getElementById('studentName').value.trim();
          var email = document.getElementById('studentEmail').value.trim();
          if (!name || !email) {
            cdToast('Please fill in both fields.', 'error');
            return;
          }
          addStudent(name, email);
          this.reset();
        });
      }

      if (window.BottomNav) {
        window.BottomNav.init();
      }
    });

    // ---- Utility functions ----
    window.copyReferralLink = function() {
      var link = document.getElementById('referralLink').textContent;
      navigator.clipboard.writeText('https://' + link).then(function() { cdToast('Copied!'); })
        .catch(function() {
          var input = document.createElement('input');
          input.value = 'https://' + link;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
          cdToast('Copied!');
        });
    };

    window.copyGuideLink = function() {
      var referralLink = document.getElementById('referralLink').textContent;
      var code = referralLink.replace('camerasdecoded.com/ref/', '').trim();
      if (!code || code === '—') {
        cdToast('Referral code not found.', 'error');
        return;
      }
      var link = 'https://camerasdecoded.com/camera-confidence-guide.html?ref=' + code;
      navigator.clipboard.writeText(link).then(function() { cdToast('Guide link copied!'); })
        .catch(function() {
          var input = document.createElement('input');
          input.value = link;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
          cdToast('Guide link copied!');
        });
    };

    window.copyScript = function(id) {
      var el = document.getElementById(id);
      if (!el) return;
      navigator.clipboard.writeText(el.value).then(function() { cdToast('Copied!'); })
        .catch(function() { el.select(); document.execCommand('copy'); cdToast('Copied!'); });
    };

    window.downloadText = function(id, filename) {
      var text = document.getElementById(id).value;
      var blob = new Blob([text], {type: 'text/plain'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    };

    window.orderItem = function(name, price) {
      var cart = JSON.parse(localStorage.getItem('cameras_decoded_cart') || '[]');
      var existing = cart.find(function(item) { return item.name === name; });
      if (existing) existing.qty += 1;
      else cart.push({ name: name, price: price, qty: 1, image: '' });
      localStorage.setItem('cameras_decoded_cart', JSON.stringify(cart));
      updateCartUI();
      cdToast(name + ' added to cart.');
    };

    function getCart() { return JSON.parse(localStorage.getItem('cameras_decoded_cart') || '[]'); }
    function updateCartUI() {
      var cart = getCart();
      var totalItems = 0;
      for (var i = 0; i < cart.length; i++) {
        totalItems += cart[i].qty;
      }
      var countEl = document.getElementById('cartHeaderCount');
      var labelEl = document.getElementById('cartHeaderLabel');
      if (countEl) { countEl.textContent = totalItems; countEl.style.display = totalItems > 0 ? 'inline-block' : 'none'; }
      if (labelEl) { labelEl.textContent = totalItems > 0 ? 'Cart (' + totalItems + ')' : 'Cart'; }
    }
    updateCartUI();
    window.addEventListener('storage', updateCartUI);

    // ---- Sidebar toggle ----
    document.addEventListener('DOMContentLoaded', function() {
      var toggleBtn = document.getElementById('floatingToggle');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', function(e) {
          e.preventDefault();
          var sidebar = document.getElementById('sidebar');
          if (sidebar) sidebar.classList.toggle('open');
        });
      }
      document.querySelectorAll('.sidebar-nav .nav-item').forEach(function(link) {
        link.addEventListener('click', function() {
          if (window.innerWidth <= 1024) {
            var sidebar = document.getElementById('sidebar');
            if (sidebar) sidebar.classList.remove('open');
          }
        });
      });
    });

    // ---- Reveal animations ----
    document.addEventListener('DOMContentLoaded', function() {
      var reveals = document.querySelectorAll('.reveal');
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      }, { threshold: 0.1 });
      reveals.forEach(function(el) { observer.observe(el); });
    });

    window.handleLogout = function() {
      auth.signOut().then(function() { window.location.href = 'login.html'; });
    };
    window.simulatePurchase = simulatePurchase;
    window.resetDemoCommission = resetDemoCommission;
  </script>
