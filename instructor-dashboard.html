<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructor Dashboard — Cameras Decoded</title>
  <meta name="description" content="Manage your students, workshops, and materials.">

  <!-- ===== MASTER LOADER (injects header, bottom nav container) ===== -->
  <script src="/scripts/master-loader.js"></script>

  <!-- ===== GLOBAL COMPONENT STYLES ===== -->
  <link rel="stylesheet" href="header.css" />
  <link rel="stylesheet" href="bottom-nav.css" />

  <!-- ===== FIREBASE SDKs ===== -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- ===== firebase-init.js ===== -->
  <script src="/scripts/firebase-init.js"></script>

  <!-- ===== HEADER AUTH UI LOGIC (function definitions) ===== -->
  <script src="header.js"></script>

  <style>
    /* ============================================================
       INSTRUCTOR DASHBOARD – PAGE-SPECIFIC STYLES
       (all sidebar-related styles are now handled by sidebar.js,
        but we keep container & main-content positioning)
       ============================================================ */
    :root {
      --green: #8deb00;
      --green-dim: rgba(141,235,0,0.12);
      --green-glow: rgba(141,235,0,0.25);
      --text-muted: #b4b4b4;
      --bg-panel: #0A0A0A;
      --border-dim: #1A1A1A;
      --gold: #e0b12d;
      --card-bg: rgba(10,10,10,0.6);
      --radius: 12px;
      --transition-smooth: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: #050705;
      background-image: radial-gradient(circle at 20% 30%, rgba(141,235,0,0.12) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(141,235,0,0.08) 0%, transparent 45%),
                        linear-gradient(rgba(141,235,0,0.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(141,235,0,0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px, 24px 24px;
      background-attachment: fixed;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }
    h1, h2, h3, .mono { font-family: 'Space Mono', monospace; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
    * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent; }

    @keyframes fadeInUp { 0% { opacity:0; transform:translateY(20px); } 100% { opacity:1; transform:translateY(0); } }
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== SIDEBAR CONTAINER – positioning only ===== */
    #sidebarContainer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 1000;
      width: 280px;
    }

    /* ===== MAIN CONTENT LAYOUT – margin-left for desktop ===== */
    .main-content {
      margin-left: 280px;
      padding: 80px 40px 40px;
      max-width: calc(1200px + 280px);
      position: relative;
      z-index: 2;
    }
    @media (max-width: 1024px) {
      .main-content { margin-left: 0; padding: 100px 20px 20px; }
    }

    /* ============================================================
       DASHBOARD SPECIFIC STYLES (unchanged from before)
       ============================================================ */
    .dash-header {
      display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center;
      margin-bottom:24px; border-bottom:1px solid var(--border-dim); padding-bottom:16px;
    }
    .dash-header h1 {
      font-family:'Space Mono',monospace; font-size:26px; color:var(--green);
      display:flex; align-items:center; gap:12px;
    }
    .dash-header .instructor-id {
      color:var(--text-muted); font-size:13px; font-family:'Space Mono',monospace;
    }
    .dash-header .instructor-id span { color:var(--green); }

    .section-header {
      margin: 40px 0 20px;
      border-bottom: 1px solid var(--border-dim);
      padding-bottom: 12px;
    }
    .section-header h2 {
      font-family:'Space Mono',monospace; font-size:18px; color:var(--green);
      text-transform:uppercase; letter-spacing:1px;
    }

    .stat-grid {
      display:grid; grid-template-columns:repeat(4,1fr); gap:15px; margin-bottom:30px;
    }
    .stat-card {
      background:var(--bg-panel);
      border:1px solid var(--border-dim);
      border-radius:var(--radius);
      padding:18px 20px;
      text-align:center;
      transition:border-color 0.3s ease, transform 0.3s ease;
    }
    .stat-card:hover {
      border-color:var(--green);
      transform:translateY(-3px);
      box-shadow:0 8px 30px rgba(0,0,0,0.3);
    }
    .stat-card .label {
      font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px;
      font-family:'Space Mono',monospace;
    }
    .stat-card .value {
      font-size:34px; font-weight:700; color:var(--green);
      text-shadow:0 0 20px rgba(141,235,0,0.2); margin:4px 0;
    }
    .stat-card .sub { font-size:12px; color:#666; }

    .profile-section {
      background:var(--bg-panel);
      border:1px solid var(--border-dim);
      border-radius:var(--radius);
      padding:18px 24px;
      margin-bottom:30px;
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(200px,1fr));
      gap:12px 24px;
    }
    .profile-item { display:flex; flex-direction:column; }
    .profile-item .label { font-size:10px; color:#666; font-family:'Space Mono',monospace; text-transform:uppercase; letter-spacing:0.5px; }
    .profile-item .value { font-size:14px; color:#fff; font-weight:500; word-break:break-word; margin-top:4px; }
    .profile-item .value.green { color:var(--green); }

    .referral-section {
      background:var(--bg-panel);
      border:1px solid var(--border-dim);
      border-radius:var(--radius);
      padding:20px 24px;
      margin-bottom:30px;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }
    .referral-section .link-area { flex:1; min-width:200px; }
    .referral-section .link-area .label { font-size:12px; color:#666; font-family:'Space Mono',monospace; text-transform:uppercase; letter-spacing:0.5px; }
    .referral-section .link-area .link { font-family:'Space Mono',monospace; color:var(--green); word-break:break-all; margin-top:4px; }
    .referral-section .stats { display:flex; gap:30px; flex-wrap:wrap; }
    .referral-section .stats .stat { text-align:center; }
    .referral-section .stats .stat .num { font-size:28px; font-weight:700; color:var(--green); }
    .referral-section .stats .stat .lbl { font-size:12px; color:#666; font-family:'Space Mono',monospace; text-transform:uppercase; letter-spacing:0.5px; }
    .referral-section .tier-badge {
      font-family:'Space Mono',monospace; color:var(--green); font-size:14px;
      background:rgba(141,235,0,0.08);
      padding:4px 14px; border-radius:20px;
      border:1px solid rgba(141,235,0,0.2);
      display:inline-block; width:100%; text-align:center;
    }

    .commission-section {
      background:var(--bg-panel);
      border:1px solid var(--border-dim);
      border-radius:var(--radius);
      padding:20px 24px;
      margin-bottom:30px;
    }
    .commission-section .header {
      display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
      margin-bottom:16px;
    }
    .commission-section .header h3 {
      font-family:'Space Mono',monospace; color:var(--green); font-size:18px;
    }
    .commission-section .header .test-btn {
      padding:6px 16px; background:transparent; border:1px solid var(--gold);
      border-radius:20px; color:var(--gold); font-family:'Space Mono',monospace; font-size:12px;
      cursor:pointer; transition:0.2s;
    }
    .commission-section .header .test-btn:hover {
      background:rgba(224,177,45,0.1); box-shadow:0 0 20px rgba(224,177,45,0.2);
    }
    .commission-section .header .reset-demo {
      display:none;
      padding:4px 12px; background:transparent; border:1px solid #555;
      border-radius:16px; color:#999; font-family:'Space Mono',monospace; font-size:11px;
      cursor:pointer; transition:0.2s;
    }
    .commission-section .header .reset-demo:hover { border-color:#ff4444; color:#ff4444; }
    .commission-list { display:flex; flex-direction:column; gap:8px; }
    .commission-item {
      display:flex; justify-content:space-between; align-items:center;
      padding:10px 14px; background:#0F0F0F; border-radius:6px; border-left:3px solid var(--green);
      font-size:14px;
    }
    .commission-item .left .name { color:#fff; font-weight:500; }
    .commission-item .left .date { color:#666; font-size:12px; font-family:'Space Mono',monospace; }
    .commission-item .right .amount { color:var(--green); font-weight:700; }
    .commission-item .right .status {
      font-size:11px; font-family:'Space Mono',monospace; padding:2px 10px; border-radius:12px; margin-left:10px;
    }
    .commission-item .right .status.pending { background:rgba(255,170,0,0.12); color:#ffaa00; border:1px solid rgba(255,170,0,0.2); }
    .commission-item .right .status.paid { background:rgba(141,235,0,0.12); color:var(--green); border:1px solid rgba(141,235,0,0.2); }
    .commission-item .right .status.failed { background:rgba(255,68,68,0.12); color:#ff4444; border:1px solid rgba(255,68,68,0.2); }
    .commission-empty { color:#666; font-size:13px; font-style:italic; padding:10px 0; text-align:center; }

    .curriculum-list {
      display:flex; flex-direction:column; gap:10px; margin-bottom:30px;
    }
    .curriculum-item {
      background:var(--bg-panel);
      border:1px solid var(--border-dim);
      border-radius:8px;
      padding:16px 22px;
      display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
      transition:border-color 0.2s;
    }
    .curriculum-item:hover { border-color:var(--green); }
    .curriculum-item .left { display:flex; align-items:center; gap:16px; }
    .curriculum-item .left .module-num { font-family:'Space Mono',monospace; font-size:14px; color:var(--green); width:36px; }
    .curriculum-item .left .module-title { font-size:15px; color:#fff; }
    .curriculum-item .left .module-desc { font-size:13px; color:var(--text-muted); }
    .curriculum-item .right { display:flex; gap:12px; align-items:center; }
    .curriculum-item .right .badge-mod { font-size:11px; font-family:'Space Mono',monospace; color:#666; background:rgba(255,255,255,0.04); padding:2px 12px; border-radius:12px; }

    .btn-sm {
      padding:6px 16px; background:transparent; border:1px solid var(--green);
      border-radius:6px; color:var(--green); font-family:'Space Mono',monospace; font-size:12px;
      cursor:pointer; transition:0.2s;
    }
    .btn-sm:hover { background:rgba(141,235,0,0.1); box-shadow:0 0 12px rgba(141,235,0,0.2); }
    .btn-sm-outline { border-color:#333; color:var(--text-muted); }
    .btn-sm-outline:hover { border-color:var(--green); color:var(--green); }

    .guide-box {
      background:rgba(29,179,27,0.04);
      border:1px solid rgba(141,235,0,0.2);
      border-radius:10px;
      padding:22px 28px;
      display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
      margin-bottom:30px;
    }
    .guide-box .left h4 { font-family:'Space Mono',monospace; color:var(--green); font-size:18px; }
    .guide-box .left p { color:var(--text-muted); font-size:14px; margin:2px 0 0 0; }
    .guide-box .right { display:flex; gap:15px; align-items:center; flex-wrap:wrap; }
    .guide-box .right .unique-id { font-family:'Space Mono',monospace; font-size:13px; color:var(--text-muted); background:var(--bg-panel); padding:6px 14px; border:1px solid var(--border-dim); border-radius:6px; }
    .guide-box .right .unique-id span { color:var(--green); }

    .email-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:30px;
    }
    .email-card {
      background:var(--bg-panel);
      border:1px solid var(--border-dim);
      border-radius:8px;
      padding:20px 24px;
    }
    .email-card h4 { font-family:'Space Mono',monospace; color:var(--green); font-size:16px; margin-bottom:4px; }
    .email-card p { color:var(--text-muted); font-size:13px; margin-bottom:10px; }
    .email-card textarea {
      width:100%; background:#0F0F0F; border:1px solid var(--border-dim); border-radius:6px;
      color:#ddd; padding:10px 12px; font-size:13px; font-family:'Montserrat',sans-serif;
      resize:vertical; outline:none; min-height:80px;
    }
    .email-card textarea:focus { border-color:var(--green); }
    .email-card .actions { display:flex; gap:12px; margin-top:10px; }

    .crm-container {
      background:var(--bg-panel);
      border:1px solid var(--border-dim);
      border-radius:10px;
      padding:24px 28px;
      margin-bottom:30px;
    }
    .crm-container .form-row {
      display:flex; flex-wrap:wrap; gap:15px; align-items:end; margin-bottom:18px;
    }
    .crm-container .form-row .field { flex:1; min-width:150px; }
    .crm-container .form-row label { display:block; color:var(--text-muted); font-size:12px; font-family:'Space Mono',monospace; margin-bottom:4px; }
    .crm-container .form-row input {
      width:100%; padding:10px 14px; background:#0F0F0F; border:1px solid var(--border-dim);
      border-radius:6px; color:#fff; font-family:'Montserrat',sans-serif; font-size:14px; outline:none;
    }
    .crm-container .form-row input:focus { border-color:var(--green); }
    .crm-container .student-list { border-top:1px solid var(--border-dim); padding-top:16px; }
    .crm-container .student-list .student-row {
      display:flex; justify-content:space-between; align-items:center;
      padding:8px 0; border-bottom:1px solid #0F0F0F; font-size:14px; color:#d0d0d0;
    }
    .crm-container .student-list .student-row .email { color:var(--text-muted); font-size:13px; }
    .crm-container .student-list .student-row .remove-btn {
      color:#ff4444; font-size:13px; cursor:pointer; background:none; border:none;
      font-family:'Space Mono',monospace;
    }
    .crm-container .student-list .student-row .remove-btn:hover { color:#ff6666; }
    .empty-msg { color:#666; font-size:13px; font-style:italic; padding:8px 0; }

    .billing-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:30px;
    }
    .billing-panel {
      background:var(--bg-panel);
      border:1px solid var(--border-dim);
      border-radius:8px;
      padding:22px 26px;
    }
    .billing-panel h4 { font-family:'Space Mono',monospace; color:var(--green); font-size:16px; margin-bottom:10px; }
    .billing-panel .line {
      display:flex; justify-content:space-between; padding:6px 0;
      color:var(--text-muted); font-size:14px; border-bottom:1px solid #0F0F0F;
    }
    .billing-panel .line .val { color:#fff; }
    .billing-panel .line .val.green { color:var(--green); }
    .billing-panel .stripe-placeholder {
      background:#0F0F0F; border:1px dashed var(--border-dim); border-radius:6px;
      padding:16px; text-align:center; color:#666; font-size:13px; margin-top:12px;
    }
    .billing-panel .stripe-placeholder i { color:var(--green); margin-right:6px; }

    .store-grid {
      display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:30px;
    }
    .store-item {
      background:var(--bg-panel);
      border:1px solid var(--border-dim);
      border-radius:8px;
      padding:20px;
      text-align:center;
      transition:border-color 0.2s;
    }
    .store-item:hover { border-color:var(--green); }
    .store-item i { font-size:32px; color:var(--green); margin-bottom:8px; }
    .store-item h4 { font-family:'Space Mono',monospace; color:#fff; font-size:16px; }
    .store-item .price { color:var(--text-muted); font-size:14px; margin:4px 0 12px 0; }
    .store-item .order-btn {
      padding:8px 20px; background:transparent; border:1px solid var(--green);
      border-radius:6px; color:var(--green); font-family:'Space Mono',monospace; font-size:12px;
      cursor:pointer; transition:0.2s;
    }
    .store-item .order-btn:hover { background:rgba(141,235,0,0.1); box-shadow:0 0 12px rgba(141,235,0,0.2); }

    .btn-neon-outline {
      display:inline-block; padding:10px 28px; background:transparent;
      border:1px solid var(--green); border-radius:8px; color:var(--green);
      font-family:'Space Mono',monospace; font-size:14px; transition:0.2s; text-decoration:none;
    }
    .btn-neon-outline:hover { background:rgba(141,235,0,0.1); box-shadow:0 0 20px rgba(141,235,0,0.3); }

    .support-box {
      background:rgba(29,179,27,0.04);
      border:1px solid rgba(141,235,0,0.2);
      border-radius:var(--radius);
      padding:22px 28px;
      display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
      margin-top:10px;
    }
    .support-box h4 { font-family:'Space Mono',monospace; color:var(--green); font-size:16px; }
    .support-box p { color:var(--text-muted); font-size:14px; }

    .footer {
      border-top:1px solid var(--border-dim);
      padding-top:20px; margin-top:40px;
      display:flex; flex-direction:column; gap:15px;
      font-size:12px; color:var(--text-muted); text-align:center;
    }
    .footer .socials { display:flex; justify-content:center; gap:20px; }
    .footer .socials a { color:#fff; font-size:18px; transition:0.2s; }
    .footer .socials a:hover { color:var(--green); }
    .footer .footer-links { display:flex; justify-content:center; gap:20px; flex-wrap:wrap; }
    .footer .footer-links a { color:var(--green); transition:0.2s; }
    .footer .footer-links a:hover { color:#a0f520; }

    #toast-container {
      position:fixed; top:24px; left:50%; transform:translateX(-50%); z-index:10000;
      display:flex; flex-direction:column; gap:10px; align-items:center; pointer-events:none;
    }
    .toast {
      background:#0A0A0A; border:1px solid var(--green); color:#fff;
      font-family:'Space Mono',monospace; font-size:13px; padding:12px 22px;
      border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,0.6);
      opacity:0; transform:translateY(-10px); transition:all 0.3s ease;
      pointer-events:auto; max-width:90vw; text-align:center;
    }
    .toast.show { opacity:1; transform:translateY(0); }
    .toast.error { border-color:#ff4a4a; }

    @media (max-width: 1024px) {
      .stat-grid { grid-template-columns:1fr 1fr; }
      .email-grid { grid-template-columns:1fr; }
      .billing-grid { grid-template-columns:1fr; }
      .store-grid { grid-template-columns:1fr 1fr; }
      .curriculum-item { flex-direction:column; align-items:flex-start; gap:10px; }
      .guide-box { flex-direction:column; align-items:flex-start; gap:15px; }
      .referral-section { flex-direction:column; align-items:stretch; }
      .referral-section .stats { justify-content:space-around; }
      .commission-section .header { flex-direction:column; align-items:stretch; }
      .commission-item { flex-direction:column; align-items:flex-start; gap:6px; }
      .profile-section { grid-template-columns:1fr 1fr; }
    }
    @media (max-width: 600px) {
      .stat-grid { grid-template-columns:1fr; }
      .store-grid { grid-template-columns:1fr; }
      .profile-section { grid-template-columns:1fr; }
      .referral-section .stats { flex-direction:column; align-items:center; gap:10px; }
    }
  </style>
</head>
