<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Booking diagnostic</title>
<style>
  body { background: #08080a; color: #e8e8e8; font-family: monospace; margin: 0; padding: 20px; }
  .page-title { font-size: 16px; color: #8deb00; font-weight: bold; }
  .row { margin: 14px 0; padding: 12px; border: 1px solid #333; border-radius: 8px; word-break: break-word; }
  .label { color: #8deb00; font-weight: bold; }
  .ok { color: #8deb00; }
  .bad { color: #ff4a4a; }
  pre { white-space: pre-wrap; margin: 6px 0 0; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="/scripts/firebase-init.js?v=20261014a"></script>
</head>
<body>
<div class="page-title">Booking diagnostic (temporary — reads only, writes nothing)</div>
<div class="row" id="authRow"><span class="label">Signed in:</span> <span id="authOut">waiting…</span></div>
<div class="row"><span class="label">Server read — publicProfiles/{uid} (the card's exact call):</span><pre id="serverOut">waiting…</pre></div>
<div class="row"><span class="label">Plain read — publicProfiles/{uid}:</span><pre id="plainOut">waiting…</pre></div>
<div class="row"><span class="label">Control read — users/{uid} (proves reads work at all):</span><pre id="usersOut">waiting…</pre></div>
<script>
(function () {
  'use strict';
  function show(id, text, good) {
    var el = document.getElementById(id);
    el.textContent = text;
    el.className = good === true ? 'ok' : (good === false ? 'bad' : '');
  }
  function fmt(snap) {
    if (!snap.exists) return 'MISSING DOC (exists=false)';
    var d = snap.data() || {};
    return 'exists=true\n' + JSON.stringify(d, null, 2);
  }
  function fail(e) {
    return 'FAILED: ' + (e && e.code ? e.code : 'no-code') + ' — ' + (e && e.message ? e.message : String(e));
  }
  var auth = window.auth, db = window.db;
  if (!auth || !db) {
    show('authOut', 'Firebase did not initialize (window.auth/window.db missing).', false);
    return;
  }
  auth.onAuthStateChanged(function (user) {
    if (!user) { show('authOut', 'NOT SIGNED IN — sign in, then reload this page.', false); return; }
    show('authOut', 'uid=' + user.uid + ' email=' + (user.email || '(none)'), true);
    var ref = db.collection('publicProfiles').doc(user.uid);
    ref.get({ source: 'server' })
      .then(function (s) { show('serverOut', fmt(s), s.exists); })
      .catch(function (e) { show('serverOut', fail(e), false); });
    ref.get()
      .then(function (s) { show('plainOut', fmt(s), s.exists); })
      .catch(function (e) { show('plainOut', fail(e), false); });
    db.collection('users').doc(user.uid).get()
      .then(function (s) {
        if (!s.exists) { show('usersOut', 'MISSING DOC (exists=false)', false); return; }
        var d = s.data() || {};
        show('usersOut', 'exists=true displayName=' + (d.displayName || d.name || '(none)') + ' username=' + (d.username || '(none)') + ' totalPoints=' + (d.totalPoints || 0), true);
      })
      .catch(function (e) { show('usersOut', fail(e), false); });
  });
})();
</script>
</body>
</html>
