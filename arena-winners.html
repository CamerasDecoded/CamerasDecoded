<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall of Crowns — Every Arena Winner | Cameras Decoded</title>
  <meta name="description" content="Every crowned night in the Cameras Decoded Arena: the winning shot, the photographer who took it, and the challenge it won — judged blind, proven nightly.">
  <meta property="og:title" content="Wall of Crowns — Cameras Decoded">
  <meta property="og:description" content="Every Arena winner, kept. Judged blind. Proven nightly.">
  <meta property="og:image" content="https://camerasdecoded.com/og-image.jpg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://camerasdecoded.com/arena-winners.html">

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/scripts/master-loader.js?v=20261110a"></script>

  <style>
    :root {
      --green: #8deb00;
      --green-hi: #a0f520;
      --gold: #e0b12d;
      --ink: #08080a;
      --line: rgba(255,255,255,0.08);
      --line-green: rgba(141,235,0,0.18);
      --text-dim: #b4b4b4;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Body-layout guard: design-system.css loads later via master-loader and
       forces flex centering + 20px padding; this page claims its own layout. */
    body {
      display: block !important;
      justify-content: normal !important;
      align-items: normal !important;
      padding: 0 !important;
      background-color: var(--ink);
      background-image:
        radial-gradient(ellipse at 30% 20%, rgba(141, 235, 0, 0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 80%, rgba(141, 235, 0, 0.02) 0%, transparent 50%),
        radial-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      position: relative;
    }
    h1, h2, h3, .mono { font-family: 'Space Mono', monospace; }
    a { text-decoration: none; color: inherit; }

    .main-content {
      max-width: 1080px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 0px) + 80px) 20px 120px;
      position: relative;
      z-index: 1;
      animation: fadeIn 0.5s ease-in-out forwards;
    }
    @keyframes fadeIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }

    .back-link { display: inline-block; margin-bottom: 22px; font-family: 'Space Mono', monospace; font-size: 14px; color: var(--green); }
    .back-link:hover { color: var(--green-hi); }

    .wc-title-img { display: block; width: min(430px, 100%); height: auto; }
    #wcTitleFb { font-size: 38px; line-height: 1.15; background: linear-gradient(90deg, #1db31b 0%, #c9e265 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .wc-sub { color: var(--text-dim); font-size: 16px; margin-top: 14px; max-width: 640px; }
    .wc-sub b { color: #fff; }

    .wc-status { margin-top: 30px; border: 1px solid var(--line); border-radius: 16px; padding: 26px 22px; background: rgba(12,12,14,0.6); }
    .wc-status .big { display: block; font-family: 'Space Mono', monospace; font-size: 19px; margin-bottom: 8px; }
    .wc-status p { color: var(--text-dim); font-size: 15px; }

    .wc-grid { margin-top: 30px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    @media (max-width: 620px) { .wc-grid { grid-template-columns: 1fr; } }
    .wc-card { display: block; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: rgba(12,12,14,0.6); transition: 0.2s; }
    .wc-card:hover { border-color: var(--green); box-shadow: 0 0 18px rgba(141,235,0,0.25); }
    .wc-card .imgwrap { position: relative; background: #0c0c0e; }
    .wc-card .imgwrap img { width: 100%; display: block; aspect-ratio: 16/10; object-fit: cover; }
    .wc-card .imgwrap .ph { aspect-ratio: 16/10; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; color: var(--text-dim); font-family: 'Space Mono', monospace; font-size: 14px; }
    .wc-media { display: block; }
    .wc-card .crown { position: absolute; top: 10px; left: 10px; background: var(--green); color: #000; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: 1.5px; padding: 4px 10px; border-radius: 4px; }
    .wc-card .cbody { padding: 16px 18px 18px; }
    .wc-card .who { font-family: 'Space Mono', monospace; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wc-card .what { color: #d8d8d8; font-size: 14.5px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wc-card .when { color: var(--text-dim); font-size: 13px; margin-top: 6px; font-family: 'Space Mono', monospace; }
    .wc-card .when .lane { color: var(--gold); }

    .wc-doors { margin-top: 34px; display: flex; gap: 12px; flex-wrap: wrap; }
    .btn-solid { padding: 14px 26px; border: none; border-radius: 10px; background: var(--green); color: #000; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 15px; cursor: pointer; display: inline-block; transition: 0.2s; }
    .btn-solid:hover { background: var(--green-hi); box-shadow: 0 0 20px rgba(141,235,0,0.5); }
  </style>
</head>
<body>
  <main class="main-content">
    <a class="back-link" href="/missions.html">&larr; The Arena</a>
    <h1><img class="wc-title-img" src="/custom-site-titles/wall-of-crowns.png?v=20261111a" alt="Wall of Crowns" onerror="this.style.display='none';document.getElementById('wcTitleFb').style.display=''"><span id="wcTitleFb" style="display:none">Wall of Crowns</span></h1>
    <p class="wc-sub">Every crowned night, kept. Each winner was <b>judged blind</b> by other photographers — no names, no follow counts, just the shot. This is the proof.</p>
    <div id="wcBody">
      <div class="wc-status"><span class="big">One moment</span><p>Reading the crown record from the Signal — every winner announcement since the Arena opened.</p></div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/scripts/firebase-init.js?v=20261007b"></script>
  <script>
    (function () {
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function ts(v) { return v && v.toMillis ? v.toMillis() : (typeof v === 'number' ? v : null); }
      function fmtDate(ms) {
        if (!ms) return '';
        try {
          return new Date(ms).toLocaleDateString('en-US', { timeZone: 'America/Chicago', month: 'long', day: 'numeric', year: 'numeric' });
        } catch (e) { return ''; }
      }
      var body = document.getElementById('wcBody');
      var DOORS = '<div class="wc-doors"><a class="btn-solid" href="/missions.html">Enter tonight&rsquo;s round</a></div>';
      function status(big, text) {
        body.innerHTML = '<div class="wc-status"><span class="big">' + esc(big) + '</span><p>' + esc(text) + '</p></div>' + DOORS;
      }
      var tries = 0;
      function arm() {
        var ok = typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length && window.db;
        if (!ok) { if (tries++ < 50) setTimeout(arm, 100); return; }
        load(window.db);
      }
      function load(db) {
        db.collection('feedItems').where('type', '==', 'arena_winner').orderBy('createdAt', 'desc').limit(80).get()
          .then(function (snap) {
            var seen = {}, items = [];
            snap.forEach(function (d) {
              var v = d.data() || {};
              if (!v.targetId) return;
              if (String(v.actorUid || '').indexOf('crew:') === 0) return; /* crew battle records live elsewhere */
              if (seen[v.targetId]) return; /* one card per crowned round */
              seen[v.targetId] = true;
              items.push(v);
            });
            if (!items.length) {
              status('No crowns yet', 'The wall fills the first night a round is won. Enter tonight and it could start with you.');
              return;
            }
            var jobs = items.map(function (v) {
              return db.collection('arenaRounds').doc(v.targetId).get()
                .then(function (r) {
                  var rd = r.exists ? (r.data() || {}) : {};
                  v._title = rd.title || 'Arena round';
                  v._lane = rd.lane === 'mission' ? 'Weekly Mission' : 'Daily Challenge';
                  v._dateMs = ts(rd.closesAt) || ts(v.createdAt);
                })
                .catch(function () {
                  v._title = 'Arena round';
                  v._lane = 'Daily Challenge';
                  v._dateMs = ts(v.createdAt);
                });
            });
            Promise.all(jobs).then(function () { render(items); });
          })
          .catch(function () {
            status('Could not load the wall', 'Check your connection and reload — the crowns are not going anywhere.');
          });
      }
      function render(items) {
        var html = '<div class="wc-grid">';
        items.forEach(function (v) {
          var who = v.actorUsername ? '@' + v.actorUsername : (v.actorName || 'An operator');
          html += '<a class="wc-card" data-img="' + esc(v.imageUrl || '') + '" href="/arena-winner.html?round=' + encodeURIComponent(v.targetId) + '">' +
            '<span class="imgwrap"><span class="wc-media"></span>' +
            '<span class="crown">WINNER</span></span>' +
            '<span class="cbody" style="display:block">' +
            '<span class="who" style="display:block">' + esc(who) + '</span>' +
            '<span class="what" style="display:block">' + esc(v._title) + '</span>' +
            '<span class="when" style="display:block">' + esc(fmtDate(v._dateMs)) + ' · <span class="lane">' + esc(v._lane) + '</span>' +
            (typeof v.votes === 'number' ? ' · ' + v.votes + ' weighted votes' : '') + '</span>' +
            '</span></a>';
        });
        html += '</div>' + DOORS;
        body.innerHTML = html;
        /* Card images attach as DOM nodes — their URLs live on the feed
           record, not in markup. A dead image falls back to the kept-crown
           note. */
        body.querySelectorAll('.wc-card').forEach(function (card) {
          var slot = card.querySelector('.wc-media');
          var url = card.getAttribute('data-img');
          function ph() {
            var el = document.createElement('span');
            el.className = 'ph';
            el.textContent = 'The winning image has expired — the crown stands.';
            slot.appendChild(el);
          }
          if (!url) { ph(); return; }
          var im = document.createElement('img');
          im.alt = ''; im.loading = 'lazy';
          im.addEventListener('error', function () { slot.removeChild(im); ph(); });
          im.src = url;
          slot.appendChild(im);
        });
      }
      arm();
    })();
  </script>
  <script src="/scripts/ptr.js?v=20261111a"></script>
  <!-- Cloudflare Web Analytics --><script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "d2f80af5be2b45e08c6b2e63231edd5d"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
